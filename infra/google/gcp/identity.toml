# Google Cloud identity, as code.
#
# infra/google/gcp/gcp-identity-sync.js reads this file, lists the live workload identity pool, its
# providers, the service account's IAM policy and the [[org_policy]] entries below, diffs them
# against what is written here, and creates or updates the difference.
#
# Federation replaces the long-lived service-account key in both directions: GitHub Actions
# presents its OIDC token to the "github" provider, and the analytics Lambdas present their
# execution role's AWS credentials to the "aws-ci" / "aws-prod" providers. Each provider's
# principal set is granted roles/iam.workloadIdentityUser on the service account, so a
# federated caller impersonates it and holds exactly the roles infra/google/gcp/project.toml grants.

[project]
id = "diyaccounting-ga4"
# The project number is the audience prefix every federated caller presents. It is the same
# number that leads the sign-in OAuth client id in infra/google/gcp/oauth.toml; the script reads the live
# number from Resource Manager and fails if this record does not match it.
number = "958354756046"

[service_account]
email = "ga4-report-pull@diyaccounting-ga4.iam.gserviceaccount.com"

[workload_identity_pool]
id = "submit-federation"
display_name = "GitHub Actions + submit Lambdas"

  # GitHub Actions on this repository. The attribute condition pins the repository, so a fork
  # or a sibling repository presenting a token from the same issuer is refused.
  [[workload_identity_pool.provider]]
  id = "github"
  display_name = "GitHub Actions, submit repo"
  type = "oidc"
  issuer_uri = "https://token.actions.githubusercontent.com"
  attribute_condition = 'assertion.repository == "diy-accounting-uk/submit.diyaccounting.co.uk"'
  principal_set = "attribute.repository/diy-accounting-uk/submit.diyaccounting.co.uk"

    [workload_identity_pool.provider.attribute_mapping]
    "google.subject" = "assertion.sub"
    "attribute.repository" = "assertion.repository"
    "attribute.repository_owner" = "assertion.repository_owner"

  # The analytics Lambdas in the submit-ci account. Their execution roles are named by CDK
  # from the function construct ids (IngestionStack.java: Ga4ReportPullFn, Ga4EventExportPullFn,
  # Ga4DailyPullFn), so the condition matches the role name on those ids rather than pinning a
  # generated suffix.
  [[workload_identity_pool.provider]]
  id = "aws-ci"
  display_name = "submit-ci analytics Lambdas"
  type = "aws"
  account_id = "367191799875"
  github_environment = "ci"
  attribute_condition = 'attribute.aws_role.contains("Ga4ReportPullFn") || attribute.aws_role.contains("Ga4EventExportPullFn") || attribute.aws_role.contains("Ga4DailyPullFn")'
  principal_set = "attribute.account/367191799875"

    [workload_identity_pool.provider.attribute_mapping]
    "google.subject" = "assertion.arn.extract('assumed-role/{role}/')"
    "attribute.account" = "assertion.account"
    "attribute.aws_role" = "assertion.arn.extract('assumed-role/{role}/')"

  # The same three Lambdas in the submit-prod account, plus the operator's own AWS SSO session
  # (arn:aws:sts::972912397388:assumed-role/AWSReservedSSO_AdministratorAccess_<id>/<user>), so a
  # local session can reach Google through this same provider with no service-account key.
  [[workload_identity_pool.provider]]
  id = "aws-prod"
  display_name = "submit-prod analytics Lambdas"
  type = "aws"
  account_id = "972912397388"
  github_environment = "prod"
  attribute_condition = 'attribute.aws_role.contains("Ga4ReportPullFn") || attribute.aws_role.contains("Ga4EventExportPullFn") || attribute.aws_role.contains("Ga4DailyPullFn") || attribute.aws_role.contains("AWSReservedSSO_AdministratorAccess")'
  principal_set = "attribute.account/972912397388"

    [workload_identity_pool.provider.attribute_mapping]
    "google.subject" = "assertion.arn.extract('assumed-role/{role}/')"
    "attribute.account" = "assertion.account"
    "attribute.aws_role" = "assertion.arn.extract('assumed-role/{role}/')"

# An exposed service-account key must be disabled automatically, not just alerted on, so a leak
# stops working before anyone reads the alert.
[[org_policy]]
constraint = "iam.serviceAccountKeyExposureResponse"
resource = "organizations/936151157673"
allowed_values = ["DISABLE_KEY"]
