# Google Ads account 814-268-5080, as code.
#
# infra/google/ads/ads-inventory.js reads this file and prints a read-only snapshot of the
# account: the customer record, its conversion actions and default goals, its campaigns and
# asset groups, and the GA4 side of the link. It writes nothing.
#
# infra/google/ads/ads-sync.js reads the [account], [[conversion_action]],
# [[customer_conversion_goal]] and [[campaign]] declarations below, diffs them against the live
# account and plans (or, with --apply, makes) the difference. A declared conversion action that
# the live account does not have fails the run rather than being created: conversion actions for
# GA4 events are created in the GA4 property (see infra/google/ga4/ga4-sync.js), not here. The
# GA4 side of the Ads link stays with ga4-sync.js.
#
# Each [[campaign]] needs a [campaign.bidding] table naming its strategy and that strategy's
# fields — see ads-sync.js's header comment for the full mapping. A Performance Max campaign
# accepts only maximize_conversions and maximize_conversion_value.
#
# API access here is an access level on the Cloud project below, granted on the "Google Ads
# API Overview" page of the Cloud console, not a developer token: a developer-token header is
# optional and Google ignores it. Reading this one client account with its own OAuth
# credentials needs no manager account and no login-customer-id header.

[account]
customer_id = "8142685080"
auto_tagging = true

[project]
id = "diyaccounting-ga4"

# The OAuth client scripts/youtube-upload.js already holds (a Desktop app client created once
# in the Cloud console), reused here under the adwords scope instead of the YouTube ones. The
# refresh token is its own secret: the same client, consented separately for this scope.
[secrets]
oauth_client = "prod/submit/youtube/oauth_client"
refresh_token = "prod/submit/google/ads/refresh_token"

[oauth]
scope = "https://www.googleapis.com/auth/adwords"

[api]
version = "v25"

[ga4]
property_id = "523400333"

# infra/google/ads/ads-conversions-upload.js sends paid conversions to this "Import from clicks"
# conversion action through the Data Manager API. The action is created in the Ads UI, not by
# ads-sync.js, and the script fails when the account has no action of this name. The stored
# refresh token must be consented with this scope as well as the adwords one.
[upload]
conversion_action_name = "DIY Accounting (upload) purchase"
scope = "https://www.googleapis.com/auth/datamanager"

# The four conversion actions the site's GA4 events create, matched here by name. category and
# primary_for_goal are the two fields ads-sync.js plans against the live conversion action; a
# name declared here with no matching live conversion action fails the run.
[[conversion_action]]
name = "DIY Accounting (web) purchase"
ga4_event = "purchase"
category = "PURCHASE"
primary_for_goal = true

[[conversion_action]]
name = "DIY Accounting (web) submit_vat_return"
ga4_event = "submit_vat_return"
category = "SIGNUP"
primary_for_goal = true

[[conversion_action]]
name = "DIY Accounting (web) runner_download"
ga4_event = "runner_download"
category = "SIGNUP"
primary_for_goal = false

[[conversion_action]]
name = "DIY Accounting (web) donate"
ga4_event = "donate"
category = "PAGE_VIEW"
primary_for_goal = false

# The account's default conversion goals, matched by category. biddable is the only field
# ads-sync.js plans against the live goal.
[[customer_conversion_goal]]
category = "PURCHASE"
origin = "WEBSITE"
biddable = true

[[customer_conversion_goal]]
category = "SIGNUP"
origin = "WEBSITE"
biddable = true

[[customer_conversion_goal]]
category = "PAGE_VIEW"
origin = "WEBSITE"
biddable = true

[[customer_conversion_goal]]
category = "ENGAGEMENT"
origin = "YOUTUBE_HOSTED"
biddable = false

[[customer_conversion_goal]]
category = "YOUTUBE_FOLLOW_ON_VIEWS"
origin = "YOUTUBE_HOSTED"
biddable = false

[[campaign]]
name = "Campaign #1"
type = "PERFORMANCE_MAX"
status = "PAUSED"
budget_micros = 1000000

[campaign.bidding]
strategy = "maximize_conversions"

[[campaign.asset_group]]
name = "Asset Group 1"

[[campaign]]
name = "Search: MTD VAT"
type = "SEARCH"
status = "ENABLED"
budget_gbp = 1.00
locations = ["GB"]
geo_target_type = "PRESENCE"
contains_eu_political_advertising = false

[campaign.network]
google_search = true
search_network = false
content_network = false

[campaign.bidding]
strategy = "maximize_clicks"
cpc_bid_ceiling_gbp = 1.00

