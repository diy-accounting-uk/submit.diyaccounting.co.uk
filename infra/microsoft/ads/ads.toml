# Microsoft Advertising account G1202SF9, as code.
#
# infra/microsoft/ads/msads.js reads this file with --plan (print the difference from the live
# account), --apply (make the account match) and --export (print the live account in this shape).
# The account, secrets and API addresses are in infra/microsoft/ads/msads.toml. --apply creates
# and updates what this file names and deletes nothing.
#
# The campaign below mirrors the Google "Search: MTD VAT" campaign in infra/google/ads/ads.toml:
# the same ad groups, phrase keywords, negative keywords and responsive search ads. Microsoft
# Search campaigns take Enhanced CPC at the campaign level and ignore Manual CPC, so the bid
# cap is the ad group bid, held at or under the Google ceiling.

[account]
auto_tagging = true

# The Universal Event Tracking tag. --apply creates it with AddUetTags when no tag of this name
# exists and prints its id. Put that id in tag_id, and in the UET_TAG_ID value the deploy writes
# to /submit.env, so the site loads the tag.
[uet]
name = "DIY Accounting Submit"
description = "Site tag for submit.diyaccounting.co.uk"
tag_id = "97279388"

# msads-conversions-upload.js sends paid conversions to this offline goal by msclkid.
[upload]
conversion_goal_name = "DIY Accounting (upload) purchase"

# The four events the site sends to GA4, as UET event goals on the same event names. Microsoft
# Advertising imports goals from Google Ads, not from GA4, so these are declared here.
# revenue is "variable" (the event carries the value) or "none".
[[conversion_goal]]
name = "DIY Accounting (web) purchase"
type = "Event"
event = "purchase"
category = "Purchase"
count_type = "All"
window_minutes = 43200
revenue = "variable"

[[conversion_goal]]
name = "DIY Accounting (web) submit_vat_return"
type = "Event"
event = "submit_vat_return"
category = "Signup"
count_type = "All"
window_minutes = 43200
revenue = "none"

[[conversion_goal]]
name = "DIY Accounting (web) runner_download"
type = "Event"
event = "runner_download"
category = "Signup"
count_type = "All"
window_minutes = 43200
revenue = "none"

[[conversion_goal]]
name = "DIY Accounting (web) donate"
type = "Event"
event = "donate"
category = "Other"
count_type = "All"
window_minutes = 43200
revenue = "variable"

[[conversion_goal]]
name = "DIY Accounting (upload) purchase"
type = "OfflineConversion"
category = "Purchase"
count_type = "All"
window_minutes = 43200
revenue = "variable"

[[campaign]]
