description = "Work out the due date of a VAT return and your late submission penalty points. The thresholds, the £200 penalty and what removes the points, each with its gov.uk source."
summary = "A VAT return is due one calendar month and 7 days after the end of the accounting period. Each late return adds a penalty point until you reach the threshold, then a £200 penalty. Pick your period end and how often you file, and tick the late returns."
