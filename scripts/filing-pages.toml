[[article.section]]
heading = "When a VAT return is due"
text = ["A period that ends on the last day of a month is due on the 7th of the month after next. A quarter that ends on 31 March is due on 7 May."]
sources = ["vat-return-due-date"]

[[article.section]]
heading = "Penalty points and the threshold"
text = ["Each late return adds one point until you reach the threshold of your accounting period."]
table = "vat-penalty-rules"
sources = ["vat-penalty-points-thresholds", "vat-penalty-200"]

[[article.section]]
heading = "What removes points"
text = [
  "Below the threshold, points expire on their own.",
  "At the threshold, you remove the points when you meet both conditions: a period of compliance, and every outstanding return of the previous 24 months.",
]
sources = ["vat-penalty-points-expire", "vat-penalty-points-removal", "vat-penalty-compliance-period"]

