# The copy of each filing page that scripts/build-filing-pages.mjs writes. The price, the steps
# with their screenshots, the video and the status come from the catalogue, the video manifest
# and AVAILABILITY. The due date comes from the source file named in `deadline.source`.
# An entry whose activity is not production on prod writes no page.

[[page]]
file = "vat-return-from-a-spreadsheet.html"
activity = "submit-vat"
video = "submit-return"
title = "VAT return from a spreadsheet - DIY Accounting Submit"
heading = "How to file a VAT return from a spreadsheet"
subtitle = "Send the nine boxes from your spreadsheet to HMRC under Making Tax Digital"
description = "How to file a VAT return from a spreadsheet with HMRC under Making Tax Digital: what you need, the steps with screenshots, the price and the free pass."
summary = "Submit sends the nine boxes of your VAT return to HMRC. You keep your records in your own spreadsheet, work out the boxes there, and enter the figures here. HMRC sends back a receipt with a Form Bundle Number."
action = { label = "File a VAT return", href = "hmrc/vat/submitVat.html" }
before = [
  "Your VAT registration number.",
  "The figures for the nine boxes of the period, worked out in your spreadsheet.",
  "A Government Gateway user ID and password, to give Submit permission to send your returns to HMRC.",
  "A Google or Microsoft account to sign in to Submit.",
]
deadline = { source = "vat-mtd-all-registered", text = "Every VAT-registered business sends its returns to HMRC through Making Tax Digital software." }

