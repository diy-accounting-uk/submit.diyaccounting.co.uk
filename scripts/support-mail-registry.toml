# The senders whose mail the support intake sorts without a person. One entry says: mail from this
# domain (or a subdomain), whose subject matches the pattern, goes to this lane when Google's
# Authentication-Results shows dkim=pass for the dkim domain (or a subdomain of it).
#
#   domain   the registered domain of the From address
#   dkim     the domain the vendor signs with; a pass for a mailing service alone does not count
#   lane     "record" (counted, no issue) or "notice" (counted; an issue once the reader exists)
#   subject  optional case-insensitive regular expression; an entry without one is the default for
#            its domain, and every domain has one
#
# The longest matching domain wins. Within it, the first entry whose subject matches wins, then the
# default. A registered sender whose DKIM check fails goes to the unverified lane.
# This file holds no account detail.

[[sender]]
domain = "aws.com"
dkim = "aws.com"
lane = "record"
subject = "invoice|statement"

