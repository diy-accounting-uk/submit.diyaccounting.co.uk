# Level and purpose of every GitHub secret and variable that a workflow or composite action reads.
# scripts/build-secrets-table.mjs writes README.md's "Secrets and variables" section from this file
# and from the references in .github/. It holds names only, never a value.
#   kind:    "secret" or "variable"
#   level:   "organisation", "repository", "environment ci", "environment prod" or "environment ci and prod"
#   purpose: at most 12 words

[[item]]
name = "AGENT_APP_PRIVATE_KEY"
kind = "secret"
level = "repository"
purpose = "Private key of the GitHub App that runs agent workflows."

