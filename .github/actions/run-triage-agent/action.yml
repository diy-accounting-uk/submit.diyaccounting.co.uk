# @capability OPS-18 Run alarm triage
# - **Use when:** an [ALARM] issue needs an automated first-pass triage.
# - **Does:** run-triage-agent executes scripts/nova-agent.mjs against Bedrock on Nova Pro. It writes the JSON result to a file without failing the job on the model's verdict. alarm-triage.yml dispatches it from an [ALARM] issue. A gate job runs scripts/issue-agent-allowlist.mjs first, so an issue event starts an agent only when the issue's author and the event's sender are on its allow list. alarm-triage.yml posts its reasoning on a mirror issue in private.diyaccounting.co.uk and one status line with the link on the public issue. When the first pass is unusable or unsure, the run holds instead of running a second pass: the quarantine reader summarises the first-pass result, the checked summary goes on the mirror issue, and `maintainer-review` is added to the alarm issue. scripts/maintainer-review-gate.mjs requires that the operator, and no bot, removed the label last. The operator removes the label to run the second pass on scripts/alarm-escalation-input.mjs's output.
# - **Run:** `gh workflow run alarm-triage.yml`
# - **Entry:** `.github/actions/run-triage-agent/action.yml`
# - **Files:** .github/actions/run-triage-agent/action.yml, .github/workflows/alarm-triage.yml, scripts/issue-agent-allowlist.mjs, app/unit-tests/scripts/issueAgentAllowlist.test.js, scripts/maintainer-review-gate.mjs, app/unit-tests/scripts/maintainerReviewGate.test.js, prompts/alarm-triage.md, prompts/alarm-reader.md, scripts/alarm-escalation-input.mjs, app/unit-tests/scripts/alarmEscalationInput.test.js, app/unit-tests/alarmTriageWorkflow.test.js
# - **Keywords:** triage agent, alarm triage, nova, bedrock, second pass
# - **Related:** OPS-17, OPS-19, OPS-20, OPS-23, OPS-142
# @end-capability

name: "Run the alarm-triage agent"
description: "Runs scripts/nova-agent.mjs against a prompt file (prompts/alarm-triage.md by default) with the given model and writes its result JSON to a file. Shared by alarm-triage.yml's first and second pass, so those invocations cannot diverge. Never fails the step on the agent's own exit code or content: the caller judges the result from the output file."

inputs:
  model-id:
    description: "the model: one of nova-agent.mjs's ALLOWED_MODEL_IDS"
    required: true
  reasoning-effort:
    description: "maxReasoningEffort for a Nova 2 model (low, medium or high); empty leaves reasoning off"
    required: false
    default: ""
  output-file:
    description: "path to write the result JSON to"
    required: true
  prompt-file:
    description: "path to the prompt template, expanded with envsubst before it is passed to the runner"
    required: false
    default: "prompts/alarm-triage.md"
  max-turns:
    description: "the turn cap, nova-agent.mjs's --max-turns"
    required: false
    default: "60"
  tools:
    description: "comma-separated read tools, from the fixed list in scripts/nova-agent-tools.mjs; the word none offers only submit_answer"
    required: false
    default: "read_file,grep_repo,list_files,aws_read"
  final-schema:
    description: "path to the final schema file that defines submit_answer's sections (see prompts/alarm-triage-answer.json); empty takes one free answer"
    required: false
    default: ""
  input-files:
    description: "newline-separated paths outside git that read_file may open"
    required: false
    default: ""
  context-files:
    description: "newline-separated paths that the runner puts into the request after the prompt, unexpanded"
    required: false
    default: ""
  frozen-results:
    description: "path to a JSON file of recorded aws results for aws_read, so a replay makes no live aws call; empty makes live calls"
    required: false
    default: ""
  deadline-seconds:
    description: "the deadline for the whole run; keep it below the job's timeout"
    required: false
    default: "900"

runs:
  using: "composite"
  steps:
    - shell: bash
      env:
        AWS_REGION: 'eu-west-2'
        MODEL_ID: ${{ inputs.model-id }}
        REASONING_EFFORT: ${{ inputs.reasoning-effort }}
        OUTPUT_FILE: ${{ inputs.output-file }}
        PROMPT_FILE: ${{ inputs.prompt-file }}
        NOVA_TOOLS: ${{ inputs.tools }}
        MAX_TURNS: ${{ inputs.max-turns }}
        FINAL_SCHEMA: ${{ inputs.final-schema }}
        INPUT_FILES: ${{ inputs.input-files }}
        CONTEXT_FILES: ${{ inputs.context-files }}
        FROZEN_RESULTS: ${{ inputs.frozen-results }}
        DEADLINE_SECONDS: ${{ inputs.deadline-seconds }}
      run: |
        set -o pipefail
        if [ "$NOVA_TOOLS" = "none" ]; then NOVA_TOOLS=""; fi
        EXPANDED_PROMPT=$(mktemp)
        envsubst < "$PROMPT_FILE" > "$EXPANDED_PROMPT"
        NOVA_ARGS=(--prompt-file "$EXPANDED_PROMPT" --output-file "$OUTPUT_FILE" --model-id "$MODEL_ID" --tools "$NOVA_TOOLS" --max-turns "$MAX_TURNS" --deadline-seconds "$DEADLINE_SECONDS")
        if [ -n "$REASONING_EFFORT" ]; then NOVA_ARGS+=(--reasoning-effort "$REASONING_EFFORT"); fi
        if [ -n "$FINAL_SCHEMA" ]; then NOVA_ARGS+=(--final-schema "$FINAL_SCHEMA"); fi
        if [ -n "$FROZEN_RESULTS" ]; then NOVA_ARGS+=(--frozen-results "$FROZEN_RESULTS"); fi
        while IFS= read -r INPUT_FILE; do
          if [ -n "$INPUT_FILE" ]; then NOVA_ARGS+=(--input-file "$INPUT_FILE"); fi
        done <<< "$INPUT_FILES"
        while IFS= read -r CONTEXT_FILE; do
          if [ -n "$CONTEXT_FILE" ]; then NOVA_ARGS+=(--context-file "$CONTEXT_FILE"); fi
        done <<< "$CONTEXT_FILES"
        node scripts/nova-agent.mjs "${NOVA_ARGS[@]}" || true
        rm -f "$EXPANDED_PROMPT"
