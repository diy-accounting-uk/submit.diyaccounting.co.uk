name: "Run the alarm-triage agent"
description: "Runs claude -p against a prompt file (prompts/alarm-triage.md by default) with the given model and writes its --output-format json result to a file. Shared by alarm-triage.yml's Haiku first pass and Sonnet escalation, by support-triage.yml, and by security-review.yml's triage, so those invocations cannot diverge. Never fails the step on the agent's own exit code or content: the caller judges the result from the output file."

inputs:
  model-id:
    description: "value for ANTHROPIC_MODEL"
    required: true
  small-fast-model-id:
    description: "value for ANTHROPIC_SMALL_FAST_MODEL"
    required: true
  output-file:
    description: "path to write claude's --output-format json result to"
    required: true
  prompt-file:
    description: "path to the prompt template, expanded with envsubst before it is passed to claude -p"
    required: false
    default: "prompts/alarm-triage.md"
  allowed-tools:
    description: "value for claude's --allowedTools"
    required: false
    default: "Read,Grep,Glob,Bash(aws logs:*),Bash(aws xray:*),Bash(aws cloudwatch describe-alarm-history:*),Bash(aws cloudwatch describe-alarms:*)"
  max-turns:
    description: "value for claude's --max-turns"
    required: false
    default: "60"
  echo-output:
    description: "'false' writes the result to output-file only, keeping it out of the job log (a public repository's logs are public)"
    required: false
    default: "true"

runs:
  using: "composite"
  steps:
    - shell: bash
      env:
        CLAUDE_CODE_USE_BEDROCK: '1'
        AWS_REGION: 'eu-west-2'
        ANTHROPIC_MODEL: ${{ inputs.model-id }}
        ANTHROPIC_SMALL_FAST_MODEL: ${{ inputs.small-fast-model-id }}
        CLAUDE_CODE_MAX_OUTPUT_TOKENS: '8192'
        DISABLE_TELEMETRY: '1'
        DISABLE_ERROR_REPORTING: '1'
        DISABLE_AUTOUPDATER: '1'
        OUTPUT_FILE: ${{ inputs.output-file }}
        PROMPT_FILE: ${{ inputs.prompt-file }}
        ALLOWED_TOOLS: ${{ inputs.allowed-tools }}
        MAX_TURNS: ${{ inputs.max-turns }}
        ECHO_OUTPUT: ${{ inputs.echo-output }}
      run: |
        set -o pipefail
        PROMPT=$(envsubst < "$PROMPT_FILE")
        CLAUDE_ARGS=(-p "$PROMPT" --max-turns "$MAX_TURNS" --output-format json --permission-mode default --allowedTools "$ALLOWED_TOOLS")
        if [ "$ECHO_OUTPUT" = "false" ]; then
          claude "${CLAUDE_ARGS[@]}" > "$OUTPUT_FILE" 2>&1 || true
        else
          claude "${CLAUDE_ARGS[@]}" 2>&1 | tee "$OUTPUT_FILE" || true
        fi
        # The caller (alarm-triage.yml's "Judge the first pass" and "Require a usable result"
        # steps) reads $OUTPUT_FILE's content to decide success, escalation and failure, so a
        # crash here must not also fail this step - that would stop the job before the other
        # pass or the escalation judgement ever runs.
