name: "Run the alarm-triage agent"
description: "Runs claude -p against a prompt file (prompts/alarm-triage.md by default) with the given model and writes its --output-format json result to a file. Shared by alarm-triage.yml's Haiku first pass and Sonnet escalation, and by support-triage.yml, so those invocations cannot diverge. Never fails the step on the agent's own exit code or content: the caller judges the result from the output file."

inputs:
  model-id:
    description: "value for ANTHROPIC_MODEL"
    required: true
  small-fast-model-id:
    description: "value for ANTHROPIC_SMALL_FAST_MODEL"
    required: true
  output-file:
    description: "path to write claude's --output-format json result to"
    required: true
  prompt-file:
    description: "path to the prompt template, expanded with envsubst before it is passed to claude -p"
    required: false
    default: "prompts/alarm-triage.md"

runs:
  using: "composite"
  steps:
    - shell: bash
      env:
        CLAUDE_CODE_USE_BEDROCK: '1'
        AWS_REGION: 'eu-west-2'
        ANTHROPIC_MODEL: ${{ inputs.model-id }}
        ANTHROPIC_SMALL_FAST_MODEL: ${{ inputs.small-fast-model-id }}
        CLAUDE_CODE_MAX_OUTPUT_TOKENS: '8192'
        DISABLE_TELEMETRY: '1'
        DISABLE_ERROR_REPORTING: '1'
        DISABLE_AUTOUPDATER: '1'
        OUTPUT_FILE: ${{ inputs.output-file }}
        PROMPT_FILE: ${{ inputs.prompt-file }}
      run: |
        set -o pipefail
        PROMPT=$(envsubst < "$PROMPT_FILE")
        claude -p "$PROMPT" \
          --max-turns 60 \
          --output-format json \
          --permission-mode default \
          --allowedTools "Read,Grep,Glob,Bash(aws logs:*),Bash(aws xray:*),Bash(aws cloudwatch describe-alarm-history:*),Bash(aws cloudwatch describe-alarms:*)" \
          2>&1 | tee "$OUTPUT_FILE" || true
        # The caller (alarm-triage.yml's "Judge the first pass" and "Require a usable result"
        # steps) reads $OUTPUT_FILE's content to decide success, escalation and failure, so a
        # crash here must not also fail this step - that would stop the job before the other
        # pass or the escalation judgement ever runs.
