name: "Get environment and domain names"
description: "Computes environment name, deployment name, and domain URLs based on branch and inputs"

inputs:
  environment-name:
    description: "Origin domain to point to."
    required: false
    default: ""
  deployment-name:
    description: "Computed deployment name"
    required: false
    default: ""

outputs:
  environment-name:
    description: "Computed environment name"
    value: ${{ inputs.environment-name || steps.compute.outputs.ENVIRONMENT_NAME }}
  deployment-name:
    description: "Computed deployment name"
    value: ${{ inputs.deployment-name || steps.compute.outputs.DEPLOYMENT_NAME }}
  base-domain:
    description: "Base hostname for the deployment"
    value: ${{ steps.compute.outputs.DIY_SUBMIT_BASE_DOMAIN }}
  base-url:
    description: "Base URL for the deployment"
    value: ${{ steps.compute.outputs.DIY_SUBMIT_BASE_URL }}
  apex-domain:
    description: "Apex hostname for the environment"
    value: ${{ steps.compute.outputs.DIY_SUBMIT_APEX_DOMAIN }}
  apex-url:
    description: "Apex URL for the environment"
    value: ${{ steps.compute.outputs.DIY_SUBMIT_APEX_URL }}
  holding-domain:
    description: "Holding page hostname for the environment"
    value: ${{ steps.compute.outputs.DIY_SUBMIT_HOLDING_DOMAIN }}
  holding-url:
    description: "Holding page URL for the environment"
    value: ${{ steps.compute.outputs.DIY_SUBMIT_HOLDING_URL }}
  public-domain:
    description: "Public-facing hostname (submit.diyaccounting.co.uk for prod, same as apex for non-prod)"
    value: ${{ steps.compute.outputs.DIY_SUBMIT_PUBLIC_DOMAIN }}
  public-url:
    description: "Public-facing URL (https://submit.diyaccounting.co.uk/ for prod, same as apex for non-prod)"
    value: ${{ steps.compute.outputs.DIY_SUBMIT_PUBLIC_URL }}
  prod-apex-alias:
    description: "Additional prod alias domain (submit.diyaccounting.co.uk) - only set for prod"
    value: ${{ steps.compute.outputs.DIY_SUBMIT_PROD_ALIAS }}

runs:
  using: "composite"
  steps:
    - id: compute
      name: Compute deployment config
      shell: bash
      env:
        GET_NAMES_ENVIRONMENT_NAME: ${{ inputs.environment-name }}
        GET_NAMES_DEPLOYMENT_NAME: ${{ inputs.deployment-name }}
        GET_NAMES_GITHUB_REF: ${{ github.ref }}
        GET_NAMES_GITHUB_REF_NAME: ${{ github.ref_name }}
        GET_NAMES_GITHUB_HEAD_REF: ${{ github.head_ref }}
        GET_NAMES_GITHUB_SHA: ${{ github.sha }}
        GET_NAMES_PROD_BRANCH_NAME: 'main'
        GET_NAMES_GITHUB_TOKEN: ${{ github.token }}
        GET_NAMES_GITHUB_EVENT_NAME: ${{ github.event_name }}
      run: |
        set -euo pipefail
        REF_NAME="${GET_NAMES_GITHUB_REF_NAME:-${GET_NAMES_GITHUB_HEAD_REF:-${GET_NAMES_GITHUB_REF##*/}}}"

        # Clean branch name: lowercase, remove non-alphanumeric characters and known prefixes/tokens
        CLEANED=$(echo "$REF_NAME" | tr '[:upper:]' '[:lower:]' | sed -e 's/dependabot//g' -e 's/feature//g' -e 's/copilot//g' -e 's/[^a-z0-9]//g')
        # Fallback to commit SHA if cleaned branch is empty (avoid trailing prefix like "ci-")
        if [ -z "$CLEANED" ]; then
          CLEANED=$(echo "${GET_NAMES_GITHUB_SHA:-}" | tr '[:upper:]' '[:lower:]' | sed -e 's/[^a-z0-9]//g')
        fi

        if [ "${GITHUB_REF:-}" = "refs/heads/${GET_NAMES_PROD_BRANCH_NAME?}" ] || [ "${REF_NAME?}" = "${GET_NAMES_PROD_BRANCH_NAME?}" ]; then
          ENVIRONMENT_NAME="prod"
        else
          ENVIRONMENT_NAME="ci"
        fi
        if [ -n "${GET_NAMES_ENVIRONMENT_NAME:-}" ]; then
          ENVIRONMENT_NAME="${GET_NAMES_ENVIRONMENT_NAME?}"
        fi

        if [ "${ENVIRONMENT_NAME?}" = "prod" ]; then
          # Prod: Always use commit SHA for consistent, reproducible deployment names
          # This ensures the same commit always deploys to the same name, regardless of
          # whether it's a direct push, merged PR, or re-run of tests
          DEPLOYMENT_NAME="prod-${GET_NAMES_GITHUB_SHA::7}"
        else
          # CI: branch name plus a hash of the full ref name, so two branches that clean
          # down to the same first few characters (e.g. two "claude/mode-rename-*" branches)
          # still get different deployment names instead of overwriting each other's stacks.
          if command -v sha1sum >/dev/null 2>&1; then
            REF_HASH=$(printf '%s' "$REF_NAME" | sha1sum | cut -c1-4)
          elif command -v shasum >/dev/null 2>&1; then
            REF_HASH=$(printf '%s' "$REF_NAME" | shasum | cut -c1-4)
          elif command -v md5sum >/dev/null 2>&1; then
            REF_HASH=$(printf '%s' "$REF_NAME" | md5sum | cut -c1-4)
          else
            echo "::error::No hash tool (sha1sum, shasum, md5sum) found on this runner" >&2
            exit 1
          fi
          DEPLOYMENT_NAME="ci-${CLEANED:0:5}${REF_HASH}"
        fi
        if [ -n "${GET_NAMES_DEPLOYMENT_NAME:-}" ]; then
          DEPLOYMENT_NAME="${GET_NAMES_DEPLOYMENT_NAME?}"
        fi

        # Normalize final deployment name: lowercase and ensure no trailing dash
        DEPLOYMENT_NAME=$(echo "$DEPLOYMENT_NAME" | tr '[:upper:]' '[:lower:]' | sed -e 's/-$//')

        DIY_SUBMIT_BASE_DOMAIN="${DEPLOYMENT_NAME?}.submit.diyaccounting.co.uk"
        DIY_SUBMIT_BASE_URL="https://${DIY_SUBMIT_BASE_DOMAIN?}/"

        DIY_SUBMIT_APEX_DOMAIN="${ENVIRONMENT_NAME?}-submit.diyaccounting.co.uk"
        DIY_SUBMIT_APEX_URL="https://${DIY_SUBMIT_APEX_DOMAIN?}/"

        # Must match SubmitSharedNames.holdingDomainName: set-origins looks the holding
        # distribution up by an OriginFor tag equal to this string.
        if [ "${ENVIRONMENT_NAME?}" = "prod" ]; then
          DIY_SUBMIT_HOLDING_DOMAIN="holding.submit.diyaccounting.co.uk"
        else
          DIY_SUBMIT_HOLDING_DOMAIN="${ENVIRONMENT_NAME?}-holding.submit.diyaccounting.co.uk"
        fi
        DIY_SUBMIT_HOLDING_URL="https://${DIY_SUBMIT_HOLDING_DOMAIN?}/"

        # Public domain: the canonical user-facing domain (matches publicDomainName in SubmitSharedNames.java)
        if [ "${ENVIRONMENT_NAME?}" = "prod" ]; then
          DIY_SUBMIT_PUBLIC_DOMAIN="submit.diyaccounting.co.uk"
          DIY_SUBMIT_PROD_ALIAS="${DIY_SUBMIT_PUBLIC_DOMAIN}"
          echo "DIY_SUBMIT_PROD_ALIAS=$DIY_SUBMIT_PROD_ALIAS" | tee -a "$GITHUB_OUTPUT"
        else
          DIY_SUBMIT_PUBLIC_DOMAIN="${DIY_SUBMIT_APEX_DOMAIN}"
        fi
        DIY_SUBMIT_PUBLIC_URL="https://${DIY_SUBMIT_PUBLIC_DOMAIN}/"

        echo "ENVIRONMENT_NAME=$ENVIRONMENT_NAME" | tee -a "$GITHUB_OUTPUT"
        echo "DEPLOYMENT_NAME=$DEPLOYMENT_NAME" | tee -a "$GITHUB_OUTPUT"

        echo "DIY_SUBMIT_BASE_DOMAIN=$DIY_SUBMIT_BASE_DOMAIN" | tee -a "$GITHUB_OUTPUT"
        echo "DIY_SUBMIT_BASE_URL=$DIY_SUBMIT_BASE_URL" | tee -a "$GITHUB_OUTPUT"

        echo "DIY_SUBMIT_APEX_DOMAIN=$DIY_SUBMIT_APEX_DOMAIN" | tee -a "$GITHUB_OUTPUT"
        echo "DIY_SUBMIT_APEX_URL=$DIY_SUBMIT_APEX_URL" | tee -a "$GITHUB_OUTPUT"

        echo "DIY_SUBMIT_PUBLIC_DOMAIN=$DIY_SUBMIT_PUBLIC_DOMAIN" | tee -a "$GITHUB_OUTPUT"
        echo "DIY_SUBMIT_PUBLIC_URL=$DIY_SUBMIT_PUBLIC_URL" | tee -a "$GITHUB_OUTPUT"

        echo "DIY_SUBMIT_HOLDING_DOMAIN=$DIY_SUBMIT_HOLDING_DOMAIN" | tee -a "$GITHUB_OUTPUT"
        echo "DIY_SUBMIT_HOLDING_URL=$DIY_SUBMIT_HOLDING_URL" | tee -a "$GITHUB_OUTPUT"
