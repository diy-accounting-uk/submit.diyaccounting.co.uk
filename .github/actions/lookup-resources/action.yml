name: "Lookup AWS resources by domain convention"
description: "Looks up Cognito, API Gateway, and CloudFront resources using deterministic domain names"

inputs:
  environment-name:
    description: "Environment name (e.g. ci, prod)"
    required: true
  deployment-name:
    description: "Deployment name (e.g. ci-rootdns, prod-a1b2c3d). Required for API Gateway and CloudFront lookups."
    required: false
    default: ""
  hosted-zone-name:
    description: "Hosted zone name"
    required: false
    default: "diyaccounting.co.uk"
  sub-domain-name:
    description: "Sub-domain name"
    required: false
    default: "submit"
  lookup-cognito:
    description: "Look up Cognito User Pool from domain"
    required: false
    default: "true"
  lookup-api-gateway:
    description: "Look up API Gateway from deployment custom domain"
    required: false
    default: "false"
  lookup-cloudfront:
    description: "Look up CloudFront distribution from OriginFor tag"
    required: false
    default: "false"
  lenient-diya-gl-client-lookup:
    description: >-
      Return an empty cognito-diya-gl-client-id instead of failing when the DIYA-GL app client
      cannot be found, after a short single attempt with no retry. Set to 'true' only from a
      destroy workflow, where the client may legitimately be gone already and a transient lookup
      problem must not abort stack cleanup. Every other caller needs the retry-and-fail-loud
      default: a deploy cannot proceed without a real client id, and failing fast here beats
      failing deep inside CDK synth several minutes later.
    required: false
    default: "false"

outputs:
  cognito-user-pool-arn:
    description: "Cognito User Pool ARN"
    value: ${{ steps.cognito.outputs.USER_POOL_ARN }}
  cognito-user-pool-id:
    description: "Cognito User Pool ID"
    value: ${{ steps.cognito.outputs.USER_POOL_ID }}
  cognito-client-id:
    description: "Cognito User Pool Client ID (the main app client, selected by ClientName)"
    value: ${{ steps.cognito.outputs.CLIENT_ID }}
  cognito-diya-gl-client-id:
    description: "Cognito User Pool Client ID for the spreadsheets DIYA-GL pages (selected by ClientName)"
    value: ${{ steps.cognito.outputs.DIYA_GL_CLIENT_ID }}
  http-api-id:
    description: "API Gateway HTTP API ID"
    value: ${{ steps.api-gateway.outputs.HTTP_API_ID }}
  http-api-url:
    description: "API Gateway HTTP API URL (execute-api endpoint with trailing slash)"
    value: ${{ steps.api-gateway.outputs.HTTP_API_URL }}
  cloudfront-distribution-id:
    description: "CloudFront Distribution ID"
    value: ${{ steps.cloudfront.outputs.DISTRIBUTION_ID }}

runs:
  using: "composite"
  steps:
    - name: Lookup Cognito User Pool from domain
      id: cognito
      if: ${{ inputs.lookup-cognito == 'true' }}
      shell: bash
      env:
        COGNITO_DOMAIN: "${{ inputs.environment-name }}-auth.${{ inputs.hosted-zone-name }}"
      run: |
        set -euo pipefail
        echo "Looking up Cognito User Pool from domain: ${COGNITO_DOMAIN}"

        USER_POOL_ID=""
        for ATTEMPT in 1 2 3; do
          LOOKUP_OUTPUT=$(aws cognito-idp describe-user-pool-domain \
            --domain "${COGNITO_DOMAIN}" \
            --query 'DomainDescription.UserPoolId' \
            --output text 2>&1) && {
            USER_POOL_ID="$LOOKUP_OUTPUT"
            break
          }
          echo "  Attempt ${ATTEMPT}/3 failed: ${LOOKUP_OUTPUT}"
          sleep 5
        done

        if [ -z "$USER_POOL_ID" ] || [ "$USER_POOL_ID" = "None" ]; then
          echo "ERROR: No Cognito User Pool found for domain ${COGNITO_DOMAIN}" >&2
          echo "  Last output: ${LOOKUP_OUTPUT:-empty}" >&2
          exit 1
        fi
        echo "Found User Pool ID: ${USER_POOL_ID}"

        USER_POOL_ARN=$(aws cognito-idp describe-user-pool \
          --user-pool-id "${USER_POOL_ID}" \
          --query 'UserPool.Arn' \
          --output text)
        echo "Found User Pool ARN: ${USER_POOL_ARN}"

        # Select by ClientName, not list position: the pool carries a second client (the
        # spreadsheets DIYA-GL pages), so array order is not a stable way to find the app client.
        CLIENT_NAME="${{ inputs.environment-name }}-env-client"
        CLIENT_ID=$(aws cognito-idp list-user-pool-clients \
          --user-pool-id "${USER_POOL_ID}" \
          --query "UserPoolClients[?ClientName=='${CLIENT_NAME}'].ClientId | [0]" \
          --output text)
        if [ -z "$CLIENT_ID" ] || [ "$CLIENT_ID" = "None" ]; then
          echo "ERROR: No Cognito User Pool Client named ${CLIENT_NAME} found in pool ${USER_POOL_ID}" >&2
          exit 1
        fi
        echo "Found Client ID: ${CLIENT_ID}"

        # The DIYA-GL client is created by IdentityStack during the environment deploy
        # (deploy-environment.yml), a separate workflow from the one that reads it here. Both
        # fire off the same push, so a deploy that starts before IdentityStack has finished
        # creating the client would otherwise see it missing when it is only late. Retry with
        # backoff for long enough to ride out that ordinary race, then fail loudly and early —
        # here, before the deploy spends minutes on a build and CDK synth it cannot finish, not
        # nine minutes from now inside SubmitApplication.java's own check for this value.
        #
        # A destroy workflow passes lenient-diya-gl-client-lookup: 'true' to opt back out: there
        # the client may legitimately already be gone, and a transient lookup problem must not
        # abort stack cleanup, so it keeps the single quick attempt with no retry and no failure.
        DIYA_GL_CLIENT_NAME="${{ inputs.environment-name }}-env-diya-gl-client"
        DIYA_GL_LOOKUP_QUERY="UserPoolClients[?ClientName=='${DIYA_GL_CLIENT_NAME}'].ClientId | [0]"

        if [ "${{ inputs.lenient-diya-gl-client-lookup }}" = "true" ]; then
          DIYA_GL_CLIENT_ID=$(aws cognito-idp list-user-pool-clients \
            --user-pool-id "${USER_POOL_ID}" \
            --query "${DIYA_GL_LOOKUP_QUERY}" \
            --output text 2>/dev/null || echo "")
          if [ "$DIYA_GL_CLIENT_ID" = "None" ]; then
            DIYA_GL_CLIENT_ID=""
          fi
          echo "Found DIYA-GL Client ID: ${DIYA_GL_CLIENT_ID:-<not found, proceeding leniently>}"
        else
          DIYA_GL_CLIENT_ID=""
          DIYA_GL_MAX_ATTEMPTS=30
          DIYA_GL_SLEEP_SECONDS=15
          for ATTEMPT in $(seq 1 "${DIYA_GL_MAX_ATTEMPTS}"); do
            DIYA_GL_LOOKUP_OUTPUT=$(aws cognito-idp list-user-pool-clients \
              --user-pool-id "${USER_POOL_ID}" \
              --query "${DIYA_GL_LOOKUP_QUERY}" \
              --output text 2>&1) || DIYA_GL_LOOKUP_OUTPUT=""
            if [ -n "$DIYA_GL_LOOKUP_OUTPUT" ] && [ "$DIYA_GL_LOOKUP_OUTPUT" != "None" ]; then
              DIYA_GL_CLIENT_ID="$DIYA_GL_LOOKUP_OUTPUT"
              break
            fi
            echo "  DIYA-GL client not found yet (attempt ${ATTEMPT}/${DIYA_GL_MAX_ATTEMPTS}); IdentityStack's environment deploy may still be creating it. Retrying in ${DIYA_GL_SLEEP_SECONDS}s."
            sleep "${DIYA_GL_SLEEP_SECONDS}"
          done

          if [ -z "$DIYA_GL_CLIENT_ID" ]; then
            echo "ERROR: No Cognito User Pool Client named ${DIYA_GL_CLIENT_NAME} found in pool ${USER_POOL_ID} after ${DIYA_GL_MAX_ATTEMPTS} attempts." >&2
            echo "  Set it from the /submit/${{ inputs.environment-name }}/spreadsheets-diya-gl-app-client-id SSM parameter, written by IdentityStack during the environment deploy." >&2
            echo "  If a 'deploy environment' run for ${{ inputs.environment-name }} is still in progress, wait for it to finish and re-run this deploy." >&2
            exit 1
          fi
          echo "Found DIYA-GL Client ID: ${DIYA_GL_CLIENT_ID}"
        fi

        echo "USER_POOL_ID=${USER_POOL_ID}" >> "$GITHUB_OUTPUT"
        echo "USER_POOL_ARN=${USER_POOL_ARN}" >> "$GITHUB_OUTPUT"
        echo "CLIENT_ID=${CLIENT_ID}" >> "$GITHUB_OUTPUT"
        echo "DIYA_GL_CLIENT_ID=${DIYA_GL_CLIENT_ID}" >> "$GITHUB_OUTPUT"

    - name: Lookup API Gateway from custom domain
      id: api-gateway
      if: ${{ inputs.lookup-api-gateway == 'true' && inputs.deployment-name != '' }}
      shell: bash
      env:
        DEPLOYMENT_DOMAIN: "${{ inputs.deployment-name }}.${{ inputs.sub-domain-name }}.${{ inputs.hosted-zone-name }}"
      run: |
        set -euo pipefail
        echo "Looking up API Gateway from custom domain: ${DEPLOYMENT_DOMAIN}"

        # Retried for the same reason the Cognito lookups above are: the mapping is created by the
        # deploy api job moments earlier and can take a little while to be visible here. A single
        # attempt fails the EdgeStack deploy on a race, and every behaviour test after it then fails
        # against a deployment that has no edge.
        API_MAPPING_MAX_ATTEMPTS=10
        API_MAPPING_SLEEP_SECONDS=10
        HTTP_API_ID=""
        for ATTEMPT in $(seq 1 "${API_MAPPING_MAX_ATTEMPTS}"); do
          HTTP_API_ID=$(aws apigatewayv2 get-api-mappings \
            --domain-name "${DEPLOYMENT_DOMAIN}" \
            --query 'Items[0].ApiId' \
            --output text 2>/dev/null || echo "")
          if [ -n "$HTTP_API_ID" ] && [ "$HTTP_API_ID" != "None" ]; then
            break
          fi
          if [ "${ATTEMPT}" -lt "${API_MAPPING_MAX_ATTEMPTS}" ]; then
            echo "  No mapping for ${DEPLOYMENT_DOMAIN} yet (attempt ${ATTEMPT}/${API_MAPPING_MAX_ATTEMPTS}); the api deploy may still be publishing it. Retrying in ${API_MAPPING_SLEEP_SECONDS}s."
            sleep "${API_MAPPING_SLEEP_SECONDS}"
          fi
        done

        if [ -z "$HTTP_API_ID" ] || [ "$HTTP_API_ID" = "None" ]; then
          echo "ERROR: No API Gateway mapping found for domain ${DEPLOYMENT_DOMAIN} after ${API_MAPPING_MAX_ATTEMPTS} attempts." >&2
          exit 1
        fi
        echo "Found HTTP API ID: ${HTTP_API_ID}"

        HTTP_API_URL=$(aws apigatewayv2 get-api \
          --api-id "${HTTP_API_ID}" \
          --query 'ApiEndpoint' \
          --output text)
        # Append trailing slash to match CDK output format
        HTTP_API_URL="${HTTP_API_URL}/"
        echo "Found HTTP API URL: ${HTTP_API_URL}"

        echo "HTTP_API_ID=${HTTP_API_ID}" >> "$GITHUB_OUTPUT"
        echo "HTTP_API_URL=${HTTP_API_URL}" >> "$GITHUB_OUTPUT"

    - name: Lookup CloudFront distribution from OriginFor tag
      id: cloudfront
      if: ${{ inputs.lookup-cloudfront == 'true' && inputs.deployment-name != '' }}
      shell: bash
      env:
        ORIGIN_DOMAIN: "${{ inputs.deployment-name }}.${{ inputs.sub-domain-name }}.${{ inputs.hosted-zone-name }}"
        EDGE_STACK_NAME: "${{ inputs.deployment-name }}-app-EdgeStack"
      run: |
        set -euo pipefail
        DISTRIBUTION_ID=$(scripts/lookup-cloudfront-distribution.sh "${ORIGIN_DOMAIN}" "${EDGE_STACK_NAME}")
        echo "DISTRIBUTION_ID=${DISTRIBUTION_ID}" >> "$GITHUB_OUTPUT"
