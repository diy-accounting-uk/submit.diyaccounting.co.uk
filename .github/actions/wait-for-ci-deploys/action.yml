name: 'Wait for ci deploys'
description: >
  Waits until every deploy.yml, deploy-app.yml, destroy-ci.yml and video-capture.yml run
  on a non-main branch that was created before this run has finished, so ci runs queue in
  creation order instead of overlapping or having an older one dropped by a concurrency group.
inputs:
  github-token:
    description: 'Token with actions:read, used to list other workflow runs'
    required: true
runs:
  using: 'composite'
  steps:
    - name: Wait for older ci deploy runs to finish
      shell: bash
      env:
        GH_TOKEN: ${{ inputs.github-token }}
        CURRENT_RUN_ID: ${{ github.run_id }}
      # The github.action_path and github.workspace expressions expand to the runner's host
      # paths, which a container job cannot see. The GITHUB_WORKSPACE variable set inside the
      # step is the checkout's path wherever the step runs.
      run: node "${GITHUB_WORKSPACE}/.github/actions/wait-for-ci-deploys/wait-for-ci-deploys.mjs"
