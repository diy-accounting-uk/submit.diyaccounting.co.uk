# @capability OPS-19 Kill-switch to stop unattended agent workflows
# - **Use when:** an unattended agent path must be stopped immediately across an environment.
# - **Does:** agent-kill-switch.yml sets the /submit/<env>/agents/kill-switch SSM parameter. The composite action reads that parameter and fails the calling job when it is set. This halts every unattended agent path, alarm-triage and support-triage, in that environment.
# - **Run:** `gh workflow run agent-kill-switch.yml -f state=<on|off> -f environment-name=<ci|prod>`
# - **Entry:** `.github/actions/agent-kill-switch/action.yml`
# - **Files:** .github/actions/agent-kill-switch/action.yml, .github/workflows/agent-kill-switch.yml
# - **Keywords:** kill switch, stop agents, ssm parameter, unattended agent, halt triage
# - **Related:** OPS-18
# @end-capability

name: "Stop when the agent kill switch is on"
description: "Reads /submit/<env>/agents/kill-switch and fails the job when it is on, so one dispatch of agent-kill-switch.yml stops every unattended agent path"

inputs:
  environment-name:
    description: "The environment whose flag to read: ci or prod. The AWS credentials already configured decide the account."
    required: true

runs:
  using: "composite"
  steps:
    - name: Read the kill switch
      shell: bash
      env:
        KILL_SWITCH_PARAMETER: /submit/${{ inputs.environment-name }}/agents/kill-switch
      run: |
        set -o pipefail
        if ! state=$(aws ssm get-parameter --name "$KILL_SWITCH_PARAMETER" --query 'Parameter.Value' --output text 2>&1); then
          if printf '%s' "$state" | grep -q ParameterNotFound; then
            # The parameter arrives with the environment deploy that carries it; until then the
            # switch is off, and the line below says so in the log.
            echo "kill switch: $KILL_SWITCH_PARAMETER does not exist yet, treating it as off" | tee -a "$GITHUB_STEP_SUMMARY"
            exit 0
          fi
          echo "::error::kill switch: could not read $KILL_SWITCH_PARAMETER: $state"
          exit 1
        fi
        case "$state" in
          on)
            echo "::error::kill switch: $KILL_SWITCH_PARAMETER is on, so this agent run stops here. Turn it off with: gh workflow run agent-kill-switch.yml -f state=off -f environment-name=${{ inputs.environment-name }}"
            echo "kill switch on: run stopped before the agent acted" | tee -a "$GITHUB_STEP_SUMMARY"
            exit 1
            ;;
          off)
            echo "kill switch: $KILL_SWITCH_PARAMETER is off"
            ;;
          *)
            echo "::error::kill switch: $KILL_SWITCH_PARAMETER holds '$state', which is neither on nor off; stopping"
            exit 1
            ;;
        esac
