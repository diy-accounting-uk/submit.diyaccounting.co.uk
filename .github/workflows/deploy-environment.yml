              && cd .. \
            ;
        env:
          ENVIRONMENT_NAME: ${{ needs.names.outputs.environment-name }}
          DEPLOYMENT_NAME: ${{ needs.names.outputs.environment-name }}

      - name: Resolve stack outputs
        id: identity-outputs
        run: |
          COGNITO_USER_POOL_ARN=$(jq -r '.["${{ needs.names.outputs.environment-name }}-env-IdentityStack"].UserPoolArn' cdk-submit-environment.out/cdk-outputs-identity.json)
          COGNITO_USER_POOL_ID=$(jq -r '.["${{ needs.names.outputs.environment-name }}-env-IdentityStack"].UserPoolId' cdk-submit-environment.out/cdk-outputs-identity.json)
          COGNITO_CLIENT_ID=$(jq -r '.["${{ needs.names.outputs.environment-name }}-env-IdentityStack"].UserPoolClientId' cdk-submit-environment.out/cdk-outputs-identity.json)
          echo "COGNITO_USER_POOL_ARN=$COGNITO_USER_POOL_ARN"
          echo "COGNITO_USER_POOL_ID=$COGNITO_USER_POOL_ID"
          echo "COGNITO_CLIENT_ID=$COGNITO_CLIENT_ID"
          echo "COGNITO_USER_POOL_ARN=$COGNITO_USER_POOL_ARN" >> $GITHUB_OUTPUT
          echo "COGNITO_USER_POOL_ID=$COGNITO_USER_POOL_ID" >> $GITHUB_OUTPUT
          echo "COGNITO_CLIENT_ID=$COGNITO_CLIENT_ID" >> $GITHUB_OUTPUT
        shell: bash

      - name: Force refresh Google Identity Provider (after secret rotation)
        if: ${{ needs.params.outputs.force-identity-refresh == 'true' }}
        run: |
          echo "Force refreshing Google Identity Provider to pick up rotated secret..."
          COGNITO_USER_POOL_ID=$(jq -r '.["${{ needs.names.outputs.environment-name }}-env-IdentityStack"].UserPoolId' cdk-submit-environment.out/cdk-outputs-identity.json)

          # Get current Google IdP configuration
          CURRENT_CONFIG=$(aws cognito-idp describe-identity-provider \
            --user-pool-id "$COGNITO_USER_POOL_ID" \
            --provider-name Google \
            --query 'IdentityProvider.ProviderDetails' \
            --output json)

          # Get current attribute mapping
          CURRENT_ATTRS=$(aws cognito-idp describe-identity-provider \
            --user-pool-id "$COGNITO_USER_POOL_ID" \
            --provider-name Google \
            --query 'IdentityProvider.AttributeMapping' \
            --output json)

          # Fetch the new secret value from Secrets Manager
          NEW_SECRET=$(aws secretsmanager get-secret-value \
            --secret-id "${{ needs.names.outputs.environment-name }}/submit/google/client_secret" \
            --query 'SecretString' \
            --output text)

          # Update the IdP with the new secret - this forces Cognito to use the new value
          # We need to re-specify all provider details including the updated client_secret
          CLIENT_ID=$(echo "$CURRENT_CONFIG" | jq -r '.client_id')

          aws cognito-idp update-identity-provider \
            --user-pool-id "$COGNITO_USER_POOL_ID" \
            --provider-name Google \
            --provider-details "client_id=$CLIENT_ID,client_secret=$NEW_SECRET,authorize_scopes=email openid profile" \
            --attribute-mapping "$CURRENT_ATTRS"

          echo "Google Identity Provider updated with new secret"

  deploy-simulator:
    name: 'deploy simulator'
    needs:
      - names
      - create-secrets
    runs-on: ubuntu-24.04
    environment: ${{ needs.names.outputs.environment-name }}
    permissions:
      id-token: write
      contents: read
    steps:

      - name: Configure AWS role via GitHub OIDC
        uses: aws-actions/configure-aws-credentials@v6
        with:
          role-to-assume: ${{ vars.SUBMIT_ACTIONS_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}
          role-chaining: false
          audience: sts.amazonaws.com
          role-skip-session-tagging: true
          output-credentials: true
          retry-max-attempts: 3

      - name: Assume AWS deployment role
        uses: aws-actions/configure-aws-credentials@v6
        with:
          role-to-assume: ${{ vars.SUBMIT_DEPLOY_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}
          role-chaining: true
          audience: sts.amazonaws.com
          role-skip-session-tagging: true
          output-credentials: true
          retry-max-attempts: 3

      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Node
        uses: actions/setup-node@v7
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'

      - name: Node dependencies
        run: timeout 120 npm ci --prefer-offline || { sleep 30; timeout 180 npm ci; }
        timeout-minutes: 6
        env:
          NPM_CONFIG_FETCH_RETRIES: "3"

      - name: Build simulator
        run: npm run build:simulator

      - uses: actions/setup-java@v5
        with:
          distribution: 'temurin'
          java-version: ${{ env.JAVA_VERSION }}
          cache: 'maven'

      - name: Deploy Simulator stack (CDK)
        run: |
          ./mvnw --errors clean verify -DskipTests -Dmaven.compiler.source=${{ env.JAVA_VERSION }} -Dmaven.compiler.target=${{ env.JAVA_VERSION }} \
            && cd cdk-environment \
            && cat ../.env.${{ needs.names.outputs.environment-name }} \
            && npx dotenv -e ../.env.${{ needs.names.outputs.environment-name }} -- \
              npx cdk deploy \
                ${{ needs.names.outputs.environment-name }}-env-SimulatorStack \
                --exclusively \
                --require-approval never \
                --ci true \
                --no-notices \
                --concurrency 4 \
                --asset-parallelism \
                --outputs-file ../cdk-submit-environment.out/cdk-outputs-simulator.json \
            && cd .. \
          ;
        env:
          ENVIRONMENT_NAME: ${{ needs.names.outputs.environment-name }}
          DEPLOYMENT_NAME: ${{ needs.names.outputs.environment-name }}

  deploy-billing-webhook:
    name: 'deploy billing webhook'
    needs:
      - names
      - create-secrets
    runs-on: ubuntu-24.04
    environment: ${{ needs.names.outputs.environment-name }}
    permissions:
      id-token: write
      contents: read
    steps:

      - name: Configure AWS role via GitHub OIDC
        uses: aws-actions/configure-aws-credentials@v6
        with:
          role-to-assume: ${{ vars.SUBMIT_ACTIONS_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}
          role-chaining: false
          audience: sts.amazonaws.com
          role-skip-session-tagging: true
          output-credentials: true
          retry-max-attempts: 3

      - name: Assume AWS deployment role
        uses: aws-actions/configure-aws-credentials@v6
        with:
          role-to-assume: ${{ vars.SUBMIT_DEPLOY_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}
          role-chaining: true
          audience: sts.amazonaws.com
          role-skip-session-tagging: true
          output-credentials: true
          retry-max-attempts: 3

      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Node
        uses: actions/setup-node@v7
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'

      - name: Node dependencies
        run: timeout 120 npm ci --prefer-offline || { sleep 30; timeout 180 npm ci; }
        timeout-minutes: 6
        env:
          NPM_CONFIG_FETCH_RETRIES: "3"

      # --- Build and push env-level Docker image (self-contained, no app deploy dependency) ---

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Set up QEMU for ARM64
        uses: docker/setup-qemu-action@v4
        with:
          platforms: arm64

      - name: Build env billing webhook image (ARM64)
        run: |
          docker buildx build \
            --platform linux/arm64 \
            --provenance=false \
            --cache-from type=gha \
            --cache-to type=gha,mode=max \
            --load \
            -t "env-billing-webhook:${{ github.sha }}" \
            -f Dockerfile .

      - name: Login to ECR
        run: |
          ECR_REPOSITORY_BASE_URL="${{ vars.SUBMIT_ACCOUNT_ID }}.dkr.ecr.${{ env.AWS_REGION }}.amazonaws.com"
          aws ecr get-login-password --region ${{ env.AWS_REGION }} \
            | docker login --username AWS --password-stdin "${ECR_REPOSITORY_BASE_URL}"
        shell: bash

      - name: Tag and push env billing webhook image to ECR
        run: |
          ECR_REPOSITORY_BASE_URL="${{ vars.SUBMIT_ACCOUNT_ID }}.dkr.ecr.${{ env.AWS_REGION }}.amazonaws.com"
          ECR_REPOSITORY_NAME="${{ needs.names.outputs.environment-name }}-env-ecr"
          ECR_URI="${ECR_REPOSITORY_BASE_URL}/${ECR_REPOSITORY_NAME}"
          # The SHA in the tag is what makes each deploy a new image URI; a fixed tag leaves
          # CloudFormation with nothing to update and the function on its old image.
          ENV_IMAGE_TAG="env-billing-webhook-${{ github.sha }}"

          docker tag "env-billing-webhook:${{ github.sha }}" "${ECR_URI}:${ENV_IMAGE_TAG}"
          docker push "${ECR_URI}:${ENV_IMAGE_TAG}"
          echo "Pushed ${ECR_URI}:${ENV_IMAGE_TAG}"
        shell: bash

      # --- Deploy CDK stack using the env-level image tag ---

      - uses: actions/setup-java@v5
        with:
          distribution: 'temurin'
          java-version: ${{ env.JAVA_VERSION }}
          cache: 'maven'

      - name: Deploy BillingWebhook stack (CDK)
        run: |
          ./mvnw --errors clean verify -DskipTests -Dmaven.compiler.source=${{ env.JAVA_VERSION }} -Dmaven.compiler.target=${{ env.JAVA_VERSION }} \
            && cd cdk-environment \
            && cat ../.env.${{ needs.names.outputs.environment-name }} \
            && npx dotenv -e ../.env.${{ needs.names.outputs.environment-name }} -- \
              npx cdk deploy \
                ${{ needs.names.outputs.environment-name }}-env-BillingWebhookStack \
                --exclusively \
                --require-approval never \
                --ci true \
                --no-notices \
                --concurrency 4 \
                --asset-parallelism \
                --outputs-file ../cdk-submit-environment.out/cdk-outputs-billing-webhook.json \
            && cd .. \
          ;
        env:
          ENVIRONMENT_NAME: ${{ needs.names.outputs.environment-name }}
          DEPLOYMENT_NAME: ${{ needs.names.outputs.environment-name }}
          REGIONAL_CERTIFICATE_ARN: ${{ vars.SUBMIT_REGIONAL_CERTIFICATE_ARN }}
          BASE_IMAGE_TAG: env-billing-webhook-${{ github.sha }}

  deploy-cost-export:
    name: 'deploy cost export'
    needs:
      - names
    # A single org-wide resource in the management account, not one per environment: running it
    # from both the ci and prod pipelines would deploy the same CloudFormation stack twice with
    # nothing gained, so it rides the prod pipeline only.
    if: ${{ needs.names.outputs.environment-name == 'prod' }}
    runs-on: ubuntu-24.04
    permissions:
      id-token: write
      contents: read
    env:
      ROOT_ACTIONS_ROLE_ARN: 'arn:aws:iam::887764105431:role/root-github-actions-role'
      ROOT_DEPLOY_ROLE_ARN: 'arn:aws:iam::887764105431:role/root-deployment-role'
      COST_ACCOUNT_ID: '887764105431'
    steps:

      - name: Configure AWS role via GitHub OIDC
        uses: aws-actions/configure-aws-credentials@v6
        with:
          role-to-assume: ${{ env.ROOT_ACTIONS_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}
          role-chaining: false
          audience: sts.amazonaws.com
          role-skip-session-tagging: true
          output-credentials: true
          retry-max-attempts: 3

      - name: Assume management account deployment role
        uses: aws-actions/configure-aws-credentials@v6
        with:
          role-to-assume: ${{ env.ROOT_DEPLOY_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}
          role-chaining: true
          audience: sts.amazonaws.com
          role-skip-session-tagging: true
          output-credentials: true
          retry-max-attempts: 3

      - name: Checkout
        uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'

      - name: Node dependencies
        run: timeout 120 npm ci --prefer-offline || { sleep 30; timeout 180 npm ci; }
        timeout-minutes: 6
        env:
          NPM_CONFIG_FETCH_RETRIES: "3"

      - uses: actions/setup-java@v5
        with:
          distribution: 'temurin'
          java-version: ${{ env.JAVA_VERSION }}
          cache: 'maven'

      - name: Build cost CDK app
        run: |
          ./mvnw --errors clean verify -DskipTests -P cdk-cost \
            -Dmaven.compiler.source=${{ env.JAVA_VERSION }} \
            -Dmaven.compiler.target=${{ env.JAVA_VERSION }}

      - name: Deploy FOCUS cost export (CDK)
        working-directory: cdk-cost
        env:
          CDK_DEFAULT_ACCOUNT: ${{ env.COST_ACCOUNT_ID }}
          CDK_DEFAULT_REGION: ${{ env.AWS_REGION }}
        run: |
          npx cdk deploy --all \
            --require-approval never \
            --ci true \
            --no-notices \
            --outputs-file ../cdk-submit-cost.out/cdk-outputs-cost.json
