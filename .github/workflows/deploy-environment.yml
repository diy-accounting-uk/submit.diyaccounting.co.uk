# deploy-environment: public-url fix for probe test (bump)
name: deploy environment
run-name: "deploy environment from ${{ github.ref_name }}"
concurrency:
  # This workflow deploys the shared `{env}-env-*` stacks: one ObservabilityStack, one
  # DataStack, one IdentityStack, and so on, per environment — not per branch, not per commit.
  # Two branches that both touch a watched infra path (an env stack's Java source, cdk.json,
  # web/public, the holding page) would otherwise deploy to the identical stack at once and hit
  # CloudFormation's "Stack is in UPDATE_IN_PROGRESS state" error, which is what happened to the
  # sibling spreadsheets repo. This workflow has no wait-for-ci-deploys step of its own, so the
  # group always resolves to the effective environment (the explicit input when a
  # workflow_dispatch names one, otherwise the branch), for ci as much as for prod.
  #
  # deploy.yml's `wait-for-environment-deploy` job polls this workflow's runs (by workflow file
  # name and this same branch-based environment resolution) before its own `names` job reads
  # anything this workflow creates, e.g. the DIYA-GL Cognito client IdentityStack creates below —
  # see that job's comment in deploy.yml. It re-derives this group's resolution independently
  # rather than sharing it, so changing how an environment name is resolved here needs the same
  # change on that side.
  group: deploy-environment-${{ (inputs.environment-name && inputs.environment-name != '(auto)' && inputs.environment-name) || (github.ref == 'refs/heads/main' && 'prod' || 'ci') }}
  cancel-in-progress: false

# bump12

on:
  workflow_dispatch:
    inputs:
      environment-name:
        type: choice
        description: 'Environment name to use instead of computing from branch, e.g. ci or prod'
        required: false
        options:
          - '(auto)'
          - 'ci'
          - 'prod'
        default: '(auto)'
      force-identity-refresh:
        type: boolean
        description: 'Force refresh of Cognito Identity Provider (use after rotating GOOGLE_CLIENT_SECRET)'
        required: false
        default: false

  push:
    branches:
      - '**'
      - '!gh_pages'
      - '!dependabot/**'
      #- '!copilot/**'
    paths:
      - '.env.ci'
      - '.env.prod'
      - 'cdk-environment/cdk.json'
      - '.github/actions/get-names'
      - '.github/actions/set-origins'
      - '.github/workflows/deploy-environment.yml'
      # Environment stacks
      - 'infra/main/java/co/uk/diyaccounting/submit/stacks/ObservabilityStack.java'
      - 'infra/main/java/co/uk/diyaccounting/submit/stacks/ObservabilityUE1Stack.java'
      - 'infra/main/java/co/uk/diyaccounting/submit/stacks/DataStack.java'
      - 'infra/main/java/co/uk/diyaccounting/submit/stacks/BackupStack.java'
      - 'infra/main/java/co/uk/diyaccounting/submit/stacks/HoldingStack.java'
      - 'infra/main/java/co/uk/diyaccounting/submit/stacks/IdentityStack.java'
      - 'infra/main/java/co/uk/diyaccounting/submit/stacks/ActivityStack.java'
      - 'infra/main/java/co/uk/diyaccounting/submit/stacks/AnalyticsStack.java'
      - 'infra/main/java/co/uk/diyaccounting/submit/stacks/BillingWebhookStack.java'
      - 'infra/main/java/co/uk/diyaccounting/submit/stacks/IngestionStack.java'
      - 'infra/main/java/co/uk/diyaccounting/submit/stacks/analytics/**'
      - 'infra/main/java/co/uk/diyaccounting/submit/stacks/SimulatorStack.java'
      - 'infra/main/java/co/uk/diyaccounting/submit/stacks/EcrStack.java'
      # Analytics Lambda source
      - 'app/functions/analytics/**'
      # Activity Telegram forwarder Lambda source
      - 'app/functions/ops/activityTelegramForwarder.js'
      # Simulator source code. build-simulator.js reads web/public and writes
      # web/public-simulator, which is gitignored, so only the source can appear
      # in a push and only the source belongs in this list.
      - 'web/public/**'
      # Holding page source
      - 'web/holding/**'
      # Shared utilities and entry point
      - 'infra/main/java/co/uk/diyaccounting/submit/constructs/**'
      - 'infra/main/java/co/uk/diyaccounting/submit/utils/**'
      - 'infra/main/java/co/uk/diyaccounting/submit/SubmitEnvironment.java'
      - 'infra/main/java/co/uk/diyaccounting/submit/SubmitSharedNames.java'
      - 'infra/main/java/co/uk/diyaccounting/submit/SubmitStackProps.java'
  schedule:
    - cron: '51 3 * * *'

# bump

env:
  JAVA_VERSION: '25'
  NODE_VERSION: '24'
  AWS_REGION: 'eu-west-2'
  GITHUB_ACTOR: ${{ github.actor }}

jobs:

  params:
    runs-on: ubuntu-24.04
    permissions: {}
    steps:
      - name: "github.event_name=[${{ github.event_name }}]"
        run: ":"
      - name: "github.ref=[${{ github.ref }}]"
        run: ":"
      - name: "inputs.environment-name=[${{ inputs.environment-name }}]"
        run: ":"
      - name: Normalise Params
        id: normalise
        shell: bash
        run: |
          # Convert '(auto)' to empty string for downstream processing
          ENV_NAME='${{ inputs.environment-name }}'; [[ "$ENV_NAME" == "(auto)" ]] && ENV_NAME=""
          echo "environment-name=${ENV_NAME}" | tee -a "$GITHUB_OUTPUT"
          X='${{ inputs.force-identity-refresh }}' ; echo "force-identity-refresh=${X:-false}" | tee -a "$GITHUB_OUTPUT"
          # Resolve GitHub Actions environment from explicit input or branch
          GH_ENV="${ENV_NAME}"
          if [ -z "$GH_ENV" ]; then
            if [ "${{ github.ref }}" == "refs/heads/main" ]; then GH_ENV="prod"; else GH_ENV="ci"; fi
          fi
          echo "github-environment=${GH_ENV}" | tee -a "$GITHUB_OUTPUT"
    outputs:
      environment-name: ${{ steps.normalise.outputs.environment-name }}
      force-identity-refresh: ${{ steps.normalise.outputs.force-identity-refresh }}
      github-environment: ${{ steps.normalise.outputs.github-environment }}

  names:
    needs:
      - params
    runs-on: ubuntu-24.04
    environment: ${{ needs.params.outputs.github-environment }}
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@v7
      - name: Compute deployment name and environment
        id: deployment-config
        uses: ./.github/actions/get-names
        with:
          environment-name: ${{ needs.params.outputs.environment-name }}
      - name: Check whether the holding certificate has been issued
        id: holding-certificate
        env:
          HOLDING_CERTIFICATE_ARN: ${{ vars.SUBMIT_HOLDING_CERTIFICATE_ARN }}
        run: |
          set -euo pipefail
          if [ -n "${HOLDING_CERTIFICATE_ARN:-}" ]; then
            echo "holding-certificate-set=true" | tee -a "$GITHUB_OUTPUT"
          else
            echo "SUBMIT_HOLDING_CERTIFICATE_ARN is unset; skipping the holding stack deployment"
            echo "holding-certificate-set=false" | tee -a "$GITHUB_OUTPUT"
          fi
    outputs:
      environment-name: ${{ steps.deployment-config.outputs.environment-name }}
      deployment-name: ${{ steps.deployment-config.outputs.deployment-name }}
      base-domain: ${{ steps.deployment-config.outputs.base-domain }}
      base-url:      ${{ steps.deployment-config.outputs.base-url }}
      apex-domain: ${{ steps.deployment-config.outputs.apex-domain }}
      apex-url: ${{ steps.deployment-config.outputs.apex-url }}
      holding-domain: ${{ steps.deployment-config.outputs.holding-domain }}
      holding-url: ${{ steps.deployment-config.outputs.holding-url }}
      holding-certificate-set: ${{ steps.holding-certificate.outputs.holding-certificate-set }}

  create-secrets:
    name: create secrets
    needs:
      - names
    runs-on: ubuntu-24.04
    environment: ${{ needs.names.outputs.environment-name }}
    permissions:
      id-token: write
      contents: read
    steps:

      # The salt secret's resource policy is applied by a script from the repo.
      - name: Checkout
        uses: actions/checkout@v7

      - name: Configure AWS role via GitHub OIDC
        uses: aws-actions/configure-aws-credentials@v6
        with:
          role-to-assume: ${{ vars.SUBMIT_ACTIONS_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}
          role-chaining: false
          audience: sts.amazonaws.com
          role-skip-session-tagging: true
          output-credentials: true
          retry-max-attempts: 3

      - name: Assume AWS deployment role
        uses: aws-actions/configure-aws-credentials@v6
        with:
          role-to-assume: ${{ vars.SUBMIT_DEPLOY_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}
          role-chaining: true
          audience: sts.amazonaws.com
          role-skip-session-tagging: true
          output-credentials: true
          retry-max-attempts: 3

      - name: Create secret in AWS from secrets.GOOGLE_CLIENT_SECRET
        run: |
          scripts/put-secret-with-rotation-tag.sh \
            "${{ needs.names.outputs.environment-name }}/submit/google/client_secret" \
            "${{ secrets.GOOGLE_CLIENT_SECRET }}"
        env:
          AWS_REGION: ${{ env.AWS_REGION }}

      - name: Create secret in AWS from secrets.HMRC_CLIENT_SECRET
        run: |
          scripts/put-secret-with-rotation-tag.sh \
            "${{ needs.names.outputs.environment-name }}/submit/hmrc/client_secret" \
            "${{ secrets.HMRC_CLIENT_SECRET }}"
        env:
          AWS_REGION: ${{ env.AWS_REGION }}

      - name: Create secret in AWS from secrets.HMRC_SANDBOX_CLIENT_SECRET
        run: |
          scripts/put-secret-with-rotation-tag.sh \
            "${{ needs.names.outputs.environment-name }}/submit/hmrc/sandbox_client_secret" \
            "${{ secrets.HMRC_SANDBOX_CLIENT_SECRET }}"
        env:
          AWS_REGION: ${{ env.AWS_REGION }}

      - name: Create secret in AWS from secrets.COMPANIES_HOUSE_API_KEY
        run: |
          scripts/put-secret-with-rotation-tag.sh \
            "${{ needs.names.outputs.environment-name }}/submit/companies-house/api_key" \
            "${{ secrets.COMPANIES_HOUSE_API_KEY }}"
        env:
          AWS_REGION: ${{ env.AWS_REGION }}

      - name: Create secret in AWS from secrets.COMPANIES_HOUSE_CLIENT_SECRET
        env:
          COMPANIES_HOUSE_CLIENT_SECRET: ${{ secrets.COMPANIES_HOUSE_CLIENT_SECRET }}
          AWS_REGION: ${{ env.AWS_REGION }}
        run: |
          # The Companies House filing client secret is set on the GitHub Environment by hand once
          # the developer-hub application exists. Until then the environment deploys without it
          # and the filing token exchange answers an error, which the ci-only gate keeps off prod.
          if [ -z "${COMPANIES_HOUSE_CLIENT_SECRET}" ]; then
            echo "::notice::COMPANIES_HOUSE_CLIENT_SECRET is not set on this environment; skipping the secret"
            exit 0
          fi
          scripts/put-secret-with-rotation-tag.sh \
            "${{ needs.names.outputs.environment-name }}/submit/companies-house/client_secret" \
            "${COMPANIES_HOUSE_CLIENT_SECRET}"

      - name: Create secret in AWS from secrets.COMPANIES_HOUSE_PRESENTER_ID
        env:
          COMPANIES_HOUSE_PRESENTER_ID: ${{ secrets.COMPANIES_HOUSE_PRESENTER_ID }}
          AWS_REGION: ${{ env.AWS_REGION }}
        run: |
          # The Companies House XML Gateway test presenter id and authentication code are set on
          # the GitHub Environment by hand once Companies House emails them. Until then the
          # environment deploys without accounts filing credentials.
          if [ -z "${COMPANIES_HOUSE_PRESENTER_ID}" ]; then
            echo "::notice::COMPANIES_HOUSE_PRESENTER_ID is not set on this environment; skipping the secret"
            exit 0
          fi
          scripts/put-secret-with-rotation-tag.sh \
            "${{ needs.names.outputs.environment-name }}/submit/companies-house/presenter_id" \
            "${COMPANIES_HOUSE_PRESENTER_ID}"

      - name: Create secret in AWS from secrets.COMPANIES_HOUSE_PRESENTER_CODE
        env:
          COMPANIES_HOUSE_PRESENTER_CODE: ${{ secrets.COMPANIES_HOUSE_PRESENTER_CODE }}
          AWS_REGION: ${{ env.AWS_REGION }}
        run: |
          if [ -z "${COMPANIES_HOUSE_PRESENTER_CODE}" ]; then
            echo "::notice::COMPANIES_HOUSE_PRESENTER_CODE is not set on this environment; skipping the secret"
            exit 0
          fi
          scripts/put-secret-with-rotation-tag.sh \
            "${{ needs.names.outputs.environment-name }}/submit/companies-house/presenter_code" \
            "${COMPANIES_HOUSE_PRESENTER_CODE}"

      - name: Create secret in AWS from secrets.STRIPE_SECRET_KEY
        run: |
          scripts/put-secret-with-rotation-tag.sh \
            "${{ needs.names.outputs.environment-name }}/submit/stripe/secret_key" \
            "${{ secrets.STRIPE_SECRET_KEY }}"
        env:
          AWS_REGION: ${{ env.AWS_REGION }}

      - name: Create secret in AWS from secrets.STRIPE_TEST_SECRET_KEY
        run: |
          scripts/put-secret-with-rotation-tag.sh \
            "${{ needs.names.outputs.environment-name }}/submit/stripe/test_secret_key" \
            "${{ secrets.STRIPE_TEST_SECRET_KEY }}"
        env:
          AWS_REGION: ${{ env.AWS_REGION }}

      - name: Create Stripe webhook secret (live mode) from environment secret
        env:
          SECRET_VALUE: ${{ secrets.STRIPE_WEBHOOK_SECRET }}
          AWS_REGION: ${{ env.AWS_REGION }}
        run: |
          if [ -z "$SECRET_VALUE" ]; then
            echo "No STRIPE_WEBHOOK_SECRET in ${{ needs.names.outputs.environment-name }} environment, skipping"
            exit 0
          fi
          scripts/put-secret-with-rotation-tag.sh \
            "${{ needs.names.outputs.environment-name }}/submit/stripe/webhook_secret" \
            "$SECRET_VALUE"

      - name: Create Stripe test webhook secret from environment secret
        env:
          SECRET_VALUE: ${{ secrets.STRIPE_TEST_WEBHOOK_SECRET }}
          AWS_REGION: ${{ env.AWS_REGION }}
        run: |
          if [ -z "$SECRET_VALUE" ]; then
            echo "No STRIPE_TEST_WEBHOOK_SECRET in ${{ needs.names.outputs.environment-name }} environment, skipping"
            exit 0
          fi
          scripts/put-secret-with-rotation-tag.sh \
            "${{ needs.names.outputs.environment-name }}/submit/stripe/test_webhook_secret" \
            "$SECRET_VALUE"

      - name: Create secret in AWS from secrets.GA4_SERVICE_ACCOUNT_JSON
        env:
          SECRET_VALUE: ${{ secrets.GA4_SERVICE_ACCOUNT_JSON }}
          AWS_REGION: ${{ env.AWS_REGION }}
        run: |
          if [ -z "$SECRET_VALUE" ]; then
            echo "No GA4_SERVICE_ACCOUNT_JSON in ${{ needs.names.outputs.environment-name }} environment, skipping"
            exit 0
          fi
          scripts/put-secret-with-rotation-tag.sh \
            "${{ needs.names.outputs.environment-name }}/submit/ga4/service_account" \
            "$SECRET_VALUE"

      - name: Create secret in AWS from secrets.TELEGRAM_BOT_TOKEN
        run: |
          scripts/put-secret-with-rotation-tag.sh \
            "${{ needs.names.outputs.environment-name }}/submit/telegram/bot_token" \
            "${{ secrets.TELEGRAM_BOT_TOKEN }}"
        env:
          AWS_REGION: ${{ env.AWS_REGION }}

      - name: Create secret in AWS from secrets.ISSUE_BOT_TOKEN
        env:
          SECRET_VALUE: ${{ secrets.ISSUE_BOT_TOKEN }}
          AWS_REGION: ${{ env.AWS_REGION }}
        run: |
          if [ -z "$SECRET_VALUE" ]; then
            echo "No ISSUE_BOT_TOKEN in ${{ needs.names.outputs.environment-name }} environment, skipping"
            exit 0
          fi
          scripts/put-secret-with-rotation-tag.sh \
            "${{ needs.names.outputs.environment-name }}/submit/github/issue_bot_token" \
            "$SECRET_VALUE"

      - name: Create user sub hash salt (if not exists)
        run: |
          SECRET_NAME="${{ needs.names.outputs.environment-name }}/submit/user-sub-hash-salt"
          if ! aws secretsmanager describe-secret --secret-id "$SECRET_NAME" --region ${{ env.AWS_REGION }} 2>/dev/null; then
            echo "Creating new salt secret: $SECRET_NAME"
            # Generate 32-byte cryptographically secure random salt, base64 encoded
            SALT=$(openssl rand -base64 32)
            # Store as JSON registry format for multi-version salt support
            REGISTRY=$(jq -n --arg salt "$SALT" '{"current":"v1","versions":{"v1":$salt}}')
            aws secretsmanager create-secret \
              --name "$SECRET_NAME" \
              --description "Salt registry for hashing user subs - DO NOT DELETE (required for data recovery)" \
              --secret-string "$REGISTRY" \
              --region ${{ env.AWS_REGION }} \
              --tags Key=Purpose,Value=user-sub-hashing Key=Critical,Value=true Key=BackupRequired,Value=true
            aws secretsmanager tag-resource --secret-id "$SECRET_NAME" \
              --tags "Key=rotated-at,Value=$(date -u +%Y-%m-%d)" --region ${{ env.AWS_REGION }}
            echo "Salt secret created in registry format (current: v1)"
          else
            echo "Salt secret $SECRET_NAME already exists - preserving existing value"
          fi

      - name: Apply salt secret resource policy
        run: scripts/put-salt-secret-resource-policy.sh "${{ needs.names.outputs.environment-name }}"
        env:
          SUBMIT_DEPLOY_ROLE_ARN: ${{ vars.SUBMIT_DEPLOY_ROLE_ARN }}
          SUBMIT_ACTIONS_ROLE_ARN: ${{ vars.SUBMIT_ACTIONS_ROLE_ARN }}

      # ObservabilityStack reads this parameter as an AWS::SSM::Parameter::Value<String>
      # template parameter, which CloudFormation refuses to resolve at all if the parameter is
      # missing - a hard changeset failure, not a stack-internal default. The destroy sweep
      # (destroy-ci.yml/destroy-prod.yml) sets it to the sentinel "None" rather than deleting it
      # once a deployment's last stack is gone, but this guards the case it is missing anyway
      # (never set yet, or removed by hand) so this environment's own deploy can't be blocked by
      # it.
      - name: Create last-known-good-deployment parameter (if not exists)
        run: |
          PARAMETER_NAME="/submit/${{ needs.names.outputs.environment-name }}/last-known-good-deployment"
          if aws ssm get-parameter --name "$PARAMETER_NAME" >/dev/null 2>&1; then
            echo "$PARAMETER_NAME already exists"
          else
            echo "$PARAMETER_NAME is missing, creating it with the sentinel value None"
            aws ssm put-parameter --name "$PARAMETER_NAME" --type String --value "None"
          fi

  deploy-observability:
    name: 'deploy observability'
    needs:
      - names
      - create-secrets
    uses: ./.github/workflows/deploy-cdk-stack.yml
    permissions:
      contents: read
      packages: read
      id-token: write
      pages: write
      pull-requests: read
    with:
      stackName: ${{ needs.names.outputs.environment-name }}-env-ObservabilityStack
      force-stack-deployment: 'true'
      environment-name: ${{ needs.names.outputs.environment-name }}
      deployment-name: ${{ needs.names.outputs.environment-name }}
      cdk-application: 'environment'

  deploy-security-detection:
    name: 'deploy security detection'
    needs:
      - names
      - create-secrets
      - deploy-observability
    uses: ./.github/workflows/deploy-cdk-stack.yml
    permissions:
      contents: read
      packages: read
      id-token: write
      pages: write
      pull-requests: read
    with:
      stackName: ${{ needs.names.outputs.environment-name }}-env-SecurityDetectionStack
      force-stack-deployment: 'true'
      environment-name: ${{ needs.names.outputs.environment-name }}
      deployment-name: ${{ needs.names.outputs.environment-name }}
      cdk-application: 'environment'

  deploy-observability-us-east-1:
    name: 'deploy observability us-east-1'
    needs:
      - names
      - create-secrets
      # The bedrock-budget-alert-forward Lambda this stack creates is a container image
      # Lambda in the us-east-1 environment ECR repository; deploy-ingestion pushes that
      # image (see its "push env observability ue1 image" steps below).
      - deploy-ingestion
    uses: ./.github/workflows/deploy-cdk-stack.yml
    permissions:
      contents: read
      packages: read
      id-token: write
      pages: write
      pull-requests: read
    with:
      stackName: ${{ needs.names.outputs.environment-name }}-env-ObservabilityUE1Stack
      force-stack-deployment: 'true'
      environment-name: ${{ needs.names.outputs.environment-name }}
      deployment-name: ${{ needs.names.outputs.environment-name }}
      cdk-application: 'environment'
      base-image-tag: env-observability-ue1-${{ github.sha }}

  deploy-data:
    name: 'deploy data'
    needs:
      - names
      - create-secrets
    uses: ./.github/workflows/deploy-cdk-stack.yml
    permissions:
      contents: read
      packages: read
      id-token: write
      pages: write
      pull-requests: read
    with:
      stackName: ${{ needs.names.outputs.environment-name }}-env-DataStack
      force-stack-deployment: 'true'
      environment-name: ${{ needs.names.outputs.environment-name }}
      deployment-name: ${{ needs.names.outputs.environment-name }}
      cdk-application: 'environment'

  deploy-backup:
    name: 'deploy backup'
    needs:
      - names
      - create-secrets
      - deploy-data
    uses: ./.github/workflows/deploy-cdk-stack.yml
    permissions:
      contents: read
      packages: read
      id-token: write
      pages: write
      pull-requests: read
    with:
      stackName: ${{ needs.names.outputs.environment-name }}-env-BackupStack
      force-stack-deployment: 'true'
      environment-name: ${{ needs.names.outputs.environment-name }}
      deployment-name: ${{ needs.names.outputs.environment-name }}
      cdk-application: 'environment'

  deploy-activity:
    name: 'deploy activity'
    needs:
      - names
      - create-secrets
      - deploy-ecr
    runs-on: ubuntu-24.04
    environment: ${{ needs.names.outputs.environment-name }}
    permissions:
      id-token: write
      contents: read
    steps:

      - name: Configure AWS role via GitHub OIDC
        uses: aws-actions/configure-aws-credentials@v6
        with:
          role-to-assume: ${{ vars.SUBMIT_ACTIONS_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}
          role-chaining: false
          audience: sts.amazonaws.com
          role-skip-session-tagging: true
          output-credentials: true
          retry-max-attempts: 3

      - name: Assume AWS deployment role
        uses: aws-actions/configure-aws-credentials@v6
        with:
          role-to-assume: ${{ vars.SUBMIT_DEPLOY_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}
          role-chaining: true
          audience: sts.amazonaws.com
          role-skip-session-tagging: true
          output-credentials: true
          retry-max-attempts: 3

      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Node
        uses: actions/setup-node@v7
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'

      - name: Node dependencies
        run: timeout 120 npm ci --prefer-offline || { sleep 30; timeout 180 npm ci; }
        timeout-minutes: 6
        env:
          NPM_CONFIG_FETCH_RETRIES: "3"

      # --- Build and push the env-level activity image, so this job does not wait on an app deploy ---

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Set up QEMU for ARM64
        uses: docker/setup-qemu-action@v4
        with:
          platforms: arm64

      - name: Build env activity image (ARM64)
        run: |
          docker buildx build \
            --platform linux/arm64 \
            --provenance=false \
            --cache-from type=gha \
            --cache-to type=gha,mode=max \
            --load \
            -t "env-activity:${{ github.sha }}" \
            -f Dockerfile .

      - name: Login to ECR
        run: |
          ECR_REPOSITORY_BASE_URL="${{ vars.SUBMIT_ACCOUNT_ID }}.dkr.ecr.${{ env.AWS_REGION }}.amazonaws.com"
          aws ecr get-login-password --region ${{ env.AWS_REGION }} \
            | docker login --username AWS --password-stdin "${ECR_REPOSITORY_BASE_URL}"
        shell: bash

      - name: Tag and push env activity image to ECR
        run: |
          ECR_REPOSITORY_BASE_URL="${{ vars.SUBMIT_ACCOUNT_ID }}.dkr.ecr.${{ env.AWS_REGION }}.amazonaws.com"
          ECR_REPOSITORY_NAME="${{ needs.names.outputs.environment-name }}-env-ecr"
          ECR_URI="${ECR_REPOSITORY_BASE_URL}/${ECR_REPOSITORY_NAME}"
          # The SHA in the tag is what makes each deploy a new image URI; a fixed tag leaves
          # CloudFormation with nothing to update and the function on its old image.
          ENV_IMAGE_TAG="env-activity-${{ github.sha }}"

          docker tag "env-activity:${{ github.sha }}" "${ECR_URI}:${ENV_IMAGE_TAG}"
          docker push "${ECR_URI}:${ENV_IMAGE_TAG}"
          echo "Pushed ${ECR_URI}:${ENV_IMAGE_TAG}"
        shell: bash

      # --- Deploy CDK stack using the env-level image tag ---

      - uses: actions/setup-java@v5
        with:
          distribution: 'temurin'
