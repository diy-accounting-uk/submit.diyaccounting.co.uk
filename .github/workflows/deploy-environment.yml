# @capability OPS-09 Deploy environment stacks and populate secrets
# - **Use when:** environment-level infrastructure or its secrets must be redeployed independently of an app deploy.
# - **Does:** deploy-environment.yml synths and deploys the environment-level CDK stacks: ObservabilityStack, DataStack and the rest. Its create-secrets job writes the environment's GitHub Environment secret values into AWS Secrets Manager, tagged by put-secret-with-rotation-tag.sh.
# - **Run:** `gh workflow run deploy-environment.yml -f environment-name=<ci|prod>`
# - **Entry:** `.github/workflows/deploy-environment.yml`
# - **Files:** .github/workflows/deploy-environment.yml, app/unit-tests/deployEnvironmentWorkflowPaths.test.js
# - **Keywords:** deploy environment, environment stacks, create-secrets, observabilitystack, datastack
# - **Related:** OPS-42
# @end-capability

# deploy-environment: public-url fix for probe test (bump)
name: deploy environment
run-name: "deploy environment from ${{ github.ref_name }}"
concurrency:
  # This workflow deploys the shared `{env}-env-*` stacks: one ObservabilityStack, one
  # DataStack, one IdentityStack, and so on, per environment — not per branch, not per commit.
  # Two branches that both touch a watched infra path (an env stack's Java source, cdk.json,
  # the holding page) would otherwise deploy to the identical stack at once and hit
  # CloudFormation's "Stack is in UPDATE_IN_PROGRESS state" error, which is what happened to the
  # sibling spreadsheets repo. This workflow has no wait-for-ci-deploys step of its own, so the
  # group always resolves to the effective environment (the explicit input when a
  # workflow_dispatch names one, otherwise the branch), for ci as much as for prod.
  #
  # deploy.yml's `wait-for-environment-deploy` job polls this workflow's runs (by workflow file
  # name and this same branch-based environment resolution) before its own `names` job reads
  # anything this workflow creates, e.g. the DIYA-GL Cognito client IdentityStack creates below —
  # see that job's comment in deploy.yml. It re-derives this group's resolution independently
  # rather than sharing it, so changing how an environment name is resolved here needs the same
  # change on that side.
  #
  # deploy.yml waits on the jobs of this workflow by name (ENV_JOBS_READ_BY_APP_STACKS and
  # ENV_JOBS_READ_BY_EDGE_AND_OPS in its env block), so a rename of one of those jobs needs the
  # same change in deploy.yml.
  group: deploy-environment-${{ (inputs.environment-name && inputs.environment-name != '(auto)' && inputs.environment-name) || (github.ref == 'refs/heads/main' && 'prod' || 'ci') }}
  cancel-in-progress: false

# bump12

on:
  workflow_dispatch:
    inputs:
      environment-name:
        type: choice
        description: 'Environment name to use instead of computing from branch, e.g. ci or prod'
        required: false
        options:
          - '(auto)'
          - 'ci'
          - 'prod'
        default: '(auto)'
      force-identity-refresh:
        type: boolean
        description: 'Force refresh of Cognito Identity Provider (use after rotating GOOGLE_CLIENT_SECRET)'
        required: false
        default: false

  push:
    branches:
      - '**'
      - '!gh_pages'
      - '!dependabot/**'
      #- '!copilot/**'
    paths:
      - '.env.ci'
      - '.env.prod'
      - 'cdk-environment/cdk.json'
      - '.github/actions/get-names/**'
      - '.github/actions/set-origins/**'
      - '.github/workflows/deploy-environment.yml'
      - '.github/workflows/deploy-env-image-stack.yml'
      - '.github/workflows/deploy-env-secrets.yml'
      # Environment stacks
      - 'infra/main/java/co/uk/diyaccounting/submit/stacks/ObservabilityStack.java'
      - 'infra/main/java/co/uk/diyaccounting/submit/stacks/ObservabilityUE1Stack.java'
      - 'infra/main/java/co/uk/diyaccounting/submit/stacks/DataStack.java'
      - 'infra/main/java/co/uk/diyaccounting/submit/stacks/BackupStack.java'
      - 'infra/main/java/co/uk/diyaccounting/submit/stacks/HoldingStack.java'
      - 'infra/main/java/co/uk/diyaccounting/submit/stacks/StaticSiteStack.java'
      - 'infra/main/java/co/uk/diyaccounting/submit/stacks/IdentityStack.java'
      - 'infra/main/java/co/uk/diyaccounting/submit/stacks/ActivityStack.java'
      - 'infra/main/java/co/uk/diyaccounting/submit/stacks/AnalyticsStack.java'
      - 'infra/main/java/co/uk/diyaccounting/submit/stacks/BillingWebhookStack.java'
      - 'infra/main/java/co/uk/diyaccounting/submit/stacks/IngestionStack.java'
      - 'infra/main/java/co/uk/diyaccounting/submit/stacks/SecurityBaselineStack.java'
      - 'infra/main/java/co/uk/diyaccounting/submit/stacks/security/**'
      - 'infra/main/java/co/uk/diyaccounting/submit/stacks/analytics/**'
      # The view SQL is read into the stack at synth by BusinessViews.loadResourceText, so a
      # change to a .sql file changes the deployed view and has to redeploy the stack.
      - 'infra/main/resources/analytics/**'
      - 'infra/main/java/co/uk/diyaccounting/submit/stacks/EcrStack.java'
      - 'infra/main/java/co/uk/diyaccounting/submit/stacks/ScanDetectionStack.java'
      - 'infra/main/java/co/uk/diyaccounting/submit/stacks/SecurityDetectionStack.java'
      # Analytics Lambda source
      - 'app/functions/analytics/**'
      # Activity Telegram forwarder Lambda source
      - 'app/functions/ops/activityTelegramForwarder.js'
      # Holding page source
      - 'web/holding/**'
      # Developer site source
      - 'web/developer/**'
      # Marketing site source
      - 'web/marketing/**'
      # Shared utilities and entry point
      - 'infra/main/java/co/uk/diyaccounting/submit/constructs/**'
      - 'infra/main/java/co/uk/diyaccounting/submit/utils/**'
      - 'infra/main/java/co/uk/diyaccounting/submit/SubmitEnvironment.java'
      - 'infra/main/java/co/uk/diyaccounting/submit/SubmitSharedNames.java'
      - 'infra/main/java/co/uk/diyaccounting/submit/names/**'
      - 'infra/main/java/co/uk/diyaccounting/submit/SubmitStackProps.java'
  schedule:
    - cron: '51 3 * * *'

# bump

env:
  JAVA_VERSION: '25'
  AWS_REGION: 'eu-west-2'
  GITHUB_ACTOR: ${{ github.actor }}

jobs:

  params:
    runs-on: ubuntu-24.04
    permissions: {}
    steps:
      - name: "github.event_name=[${{ github.event_name }}]"
        run: ":"
      - name: "github.ref=[${{ github.ref }}]"
        run: ":"
      - name: "inputs.environment-name=[${{ inputs.environment-name }}]"
        run: ":"
      - name: Normalise Params
        id: normalise
        shell: bash
        run: |
          # Convert '(auto)' to empty string for downstream processing
          ENV_NAME='${{ inputs.environment-name }}'; [[ "$ENV_NAME" == "(auto)" ]] && ENV_NAME=""
          echo "environment-name=${ENV_NAME}" | tee -a "$GITHUB_OUTPUT"
          X='${{ inputs.force-identity-refresh }}' ; echo "force-identity-refresh=${X:-false}" | tee -a "$GITHUB_OUTPUT"
          # Resolve GitHub Actions environment from explicit input or branch
          GH_ENV="${ENV_NAME}"
          if [ -z "$GH_ENV" ]; then
            if [ "${{ github.ref }}" == "refs/heads/main" ]; then GH_ENV="prod"; else GH_ENV="ci"; fi
          fi
          echo "github-environment=${GH_ENV}" | tee -a "$GITHUB_OUTPUT"
    outputs:
      environment-name: ${{ steps.normalise.outputs.environment-name }}
      force-identity-refresh: ${{ steps.normalise.outputs.force-identity-refresh }}
      github-environment: ${{ steps.normalise.outputs.github-environment }}

  names:
    needs:
      - params
    runs-on: ubuntu-24.04
    environment: ${{ needs.params.outputs.github-environment }}
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - name: Compute deployment name and environment
        id: deployment-config
        uses: ./.github/actions/get-names
        with:
          environment-name: ${{ needs.params.outputs.environment-name }}
      - name: Check whether the holding certificate has been issued
        id: holding-certificate
        env:
          HOLDING_CERTIFICATE_ARN: ${{ vars.SUBMIT_HOLDING_CERTIFICATE_ARN }}
        run: |
          set -euo pipefail
          if [ -n "${HOLDING_CERTIFICATE_ARN:-}" ]; then
            echo "holding-certificate-set=true" | tee -a "$GITHUB_OUTPUT"
          else
            echo "SUBMIT_HOLDING_CERTIFICATE_ARN is unset; skipping the holding stack deployment"
            echo "holding-certificate-set=false" | tee -a "$GITHUB_OUTPUT"
          fi
      - name: Check whether the developer site certificate has been issued
        id: developer-certificate
        env:
          DEVELOPER_CERTIFICATE_ARN: ${{ vars.SUBMIT_DEVELOPER_CERTIFICATE_ARN }}
        run: |
          set -euo pipefail
          if [ -n "${DEVELOPER_CERTIFICATE_ARN:-}" ]; then
            echo "developer-certificate-set=true" | tee -a "$GITHUB_OUTPUT"
          else
            echo "SUBMIT_DEVELOPER_CERTIFICATE_ARN is unset; skipping the developer site deployment"
            echo "developer-certificate-set=false" | tee -a "$GITHUB_OUTPUT"
          fi
      - name: Check whether the marketing site certificate has been issued
        id: marketing-certificate
        env:
          MARKETING_CERTIFICATE_ARN: ${{ vars.SUBMIT_MARKETING_CERTIFICATE_ARN }}
        run: |
          set -euo pipefail
          if [ -n "${MARKETING_CERTIFICATE_ARN:-}" ]; then
            echo "marketing-certificate-set=true" | tee -a "$GITHUB_OUTPUT"
          else
            echo "SUBMIT_MARKETING_CERTIFICATE_ARN is unset; skipping the marketing site deployment"
            echo "marketing-certificate-set=false" | tee -a "$GITHUB_OUTPUT"
          fi
    outputs:
      environment-name: ${{ steps.deployment-config.outputs.environment-name }}
      deployment-name: ${{ steps.deployment-config.outputs.deployment-name }}
      base-domain: ${{ steps.deployment-config.outputs.base-domain }}
      base-url:      ${{ steps.deployment-config.outputs.base-url }}
      apex-domain: ${{ steps.deployment-config.outputs.apex-domain }}
      apex-url: ${{ steps.deployment-config.outputs.apex-url }}
      holding-domain: ${{ steps.deployment-config.outputs.holding-domain }}
      holding-url: ${{ steps.deployment-config.outputs.holding-url }}
      holding-certificate-set: ${{ steps.holding-certificate.outputs.holding-certificate-set }}
      developer-certificate-set: ${{ steps.developer-certificate.outputs.developer-certificate-set }}
      marketing-certificate-set: ${{ steps.marketing-certificate.outputs.marketing-certificate-set }}

  create-secrets:
    name: create secrets
    needs:
      - names
    permissions:
      id-token: write
      contents: read
    uses: ./.github/workflows/deploy-env-secrets.yml
    secrets: inherit
    with:
      environment-name: ${{ needs.names.outputs.environment-name }}

  deploy-observability:
    name: 'deploy observability'
    needs:
      - names
      - create-secrets
    uses: ./.github/workflows/deploy-cdk-stack.yml
    permissions:
      contents: read
      packages: read
      id-token: write
      pages: write
      pull-requests: read
    with:
      stackName: ${{ needs.names.outputs.environment-name }}-env-ObservabilityStack
      force-stack-deployment: 'true'
      environment-name: ${{ needs.names.outputs.environment-name }}
      deployment-name: ${{ needs.names.outputs.environment-name }}
      cdk-application: 'environment'

  deploy-security-detection:
    name: 'deploy security detection'
    needs:
      - names
      - create-secrets
      - deploy-observability
    uses: ./.github/workflows/deploy-cdk-stack.yml
    permissions:
      contents: read
      packages: read
      id-token: write
      pages: write
      pull-requests: read
    with:
      stackName: ${{ needs.names.outputs.environment-name }}-env-SecurityDetectionStack
      force-stack-deployment: 'true'
      environment-name: ${{ needs.names.outputs.environment-name }}
      deployment-name: ${{ needs.names.outputs.environment-name }}
      cdk-application: 'environment'

  deploy-observability-us-east-1:
    name: 'deploy observability us-east-1'
    needs:
      - names
      - create-secrets
      # The bedrock-budget-alert-forward Lambda this stack creates is a container image
      # Lambda in the us-east-1 environment ECR repository; deploy-ingestion pushes that
      # image (see its "push env observability ue1 image" steps below).
      - deploy-ingestion
    uses: ./.github/workflows/deploy-cdk-stack.yml
    permissions:
      contents: read
      packages: read
      id-token: write
      pages: write
      pull-requests: read
    with:
      stackName: ${{ needs.names.outputs.environment-name }}-env-ObservabilityUE1Stack
      force-stack-deployment: 'true'
      environment-name: ${{ needs.names.outputs.environment-name }}
      deployment-name: ${{ needs.names.outputs.environment-name }}
      cdk-application: 'environment'
      base-image-tag: env-observability-ue1-${{ github.sha }}

  deploy-data:
    name: 'deploy data'
    needs:
      - names
      - create-secrets
    uses: ./.github/workflows/deploy-cdk-stack.yml
    permissions:
      contents: read
      packages: read
      id-token: write
      pages: write
      pull-requests: read
    with:
      stackName: ${{ needs.names.outputs.environment-name }}-env-DataStack
      force-stack-deployment: 'true'
      environment-name: ${{ needs.names.outputs.environment-name }}
      deployment-name: ${{ needs.names.outputs.environment-name }}
      cdk-application: 'environment'

  deploy-backup:
    name: 'deploy backup'
    needs:
      - names
      - create-secrets
      - deploy-data
    uses: ./.github/workflows/deploy-cdk-stack.yml
    permissions:
      contents: read
      packages: read
      id-token: write
      pages: write
      pull-requests: read
    with:
      stackName: ${{ needs.names.outputs.environment-name }}-env-BackupStack
      force-stack-deployment: 'true'
      environment-name: ${{ needs.names.outputs.environment-name }}
      deployment-name: ${{ needs.names.outputs.environment-name }}
      cdk-application: 'environment'

  deploy-activity:
    name: 'deploy activity'
    needs:
      - names
      - create-secrets
      - deploy-ecr
    permissions:
      id-token: write
      contents: read
    uses: ./.github/workflows/deploy-env-image-stack.yml
    secrets: inherit
    with:
      environment-name: ${{ needs.names.outputs.environment-name }}
      image-name: activity
      stack-name: ${{ needs.names.outputs.environment-name }}-env-ActivityStack

  deploy-analytics:
    name: 'deploy analytics'
    needs:
      - names
      - create-secrets
      - deploy-activity
      - deploy-data
      - deploy-ecr
    permissions:
      id-token: write
      contents: read
    uses: ./.github/workflows/deploy-env-image-stack.yml
    secrets: inherit
    with:
      environment-name: ${{ needs.names.outputs.environment-name }}
      image-name: analytics
      stack-name: ${{ needs.names.outputs.environment-name }}-env-AnalyticsStack

  deploy-security-lake:
    name: 'deploy security lake'
    needs:
      - names
      - create-secrets
      - deploy-observability
      - deploy-analytics
      - deploy-ecr
    permissions:
      id-token: write
      contents: read
    uses: ./.github/workflows/deploy-env-image-stack.yml
    secrets: inherit
    with:
      environment-name: ${{ needs.names.outputs.environment-name }}
      image-name: security-lake
      stack-name: ${{ needs.names.outputs.environment-name }}-env-SecurityLakeStack

  deploy-scan-detection:
    name: 'deploy scan detection'
    needs:
      - names
      - create-secrets
      - deploy-analytics
      - deploy-ecr
    permissions:
      id-token: write
      contents: read
    uses: ./.github/workflows/deploy-env-image-stack.yml
    secrets: inherit
    with:
      environment-name: ${{ needs.names.outputs.environment-name }}
      image-name: scan-detection
      stack-name: ${{ needs.names.outputs.environment-name }}-env-ScanDetectionStack

  deploy-ingestion:
    name: 'deploy ingestion'
    needs:
      - names
      - create-secrets
      - deploy-analytics
      - deploy-ecr
      - deploy-ecr-us-east-1
    permissions:
      id-token: write
      contents: read
    uses: ./.github/workflows/deploy-env-image-stack.yml
    secrets: inherit
    with:
      environment-name: ${{ needs.names.outputs.environment-name }}
      image-name: ingestion
      stack-name: ${{ needs.names.outputs.environment-name }}-env-IngestionStack
      push-ue1-image: true

  deploy-ecr:
    name: 'deploy ecr'
    needs:
      - names
      - create-secrets
    uses: ./.github/workflows/deploy-cdk-stack.yml
    permissions:
      contents: read
      packages: read
      id-token: write
      pages: write
      pull-requests: read
    with:
      stackName: ${{ needs.names.outputs.environment-name }}-env-EcrStack
      force-stack-deployment: 'true'
      environment-name: ${{ needs.names.outputs.environment-name }}
      deployment-name: ${{ needs.names.outputs.environment-name }}
      cdk-application: 'environment'

  deploy-ecr-us-east-1:
    name: 'deploy ecr us-east-1'
    needs:
      - names
      - create-secrets
    uses: ./.github/workflows/deploy-cdk-stack.yml
    permissions:
      contents: read
      packages: read
      id-token: write
      pages: write
      pull-requests: read
    with:
      stackName: ${{ needs.names.outputs.environment-name }}-env-EcrUE1Stack
      force-stack-deployment: 'true'
      environment-name: ${{ needs.names.outputs.environment-name }}
      deployment-name: ${{ needs.names.outputs.environment-name }}
      cdk-application: 'environment'

  deploy-holding:
    name: deploy holding
    if: ${{ needs.names.outputs.holding-certificate-set == 'true' }}
    needs:
      - names
      - create-secrets
    uses: ./.github/workflows/deploy-cdk-stack.yml
    permissions:
      contents: read
      packages: read
      id-token: write
      pages: write
      pull-requests: read
    with:
      stackName: ${{ needs.names.outputs.environment-name }}-env-HoldingStack
      force-stack-deployment: 'true'
      environment-name: ${{ needs.names.outputs.environment-name }}
      deployment-name: ${{ needs.names.outputs.environment-name }}
      cdk-application: 'environment'

  deploy-developer-site:
    name: deploy developer site
    if: ${{ needs.names.outputs.developer-certificate-set == 'true' }}
    needs:
      - names
      - create-secrets
    uses: ./.github/workflows/deploy-cdk-stack.yml
    permissions:
      contents: read
      packages: read
      id-token: write
      pages: write
      pull-requests: read
    with:
      stackName: ${{ needs.names.outputs.environment-name }}-env-DeveloperSiteStack
      force-stack-deployment: 'true'
      environment-name: ${{ needs.names.outputs.environment-name }}
      deployment-name: ${{ needs.names.outputs.environment-name }}
      cdk-application: 'environment'

  deploy-marketing-site:
    name: deploy marketing site
    if: ${{ needs.names.outputs.marketing-certificate-set == 'true' }}
    needs:
      - names
      - create-secrets
    uses: ./.github/workflows/deploy-cdk-stack.yml
    permissions:
      contents: read
      packages: read
      id-token: write
      pages: write
      pull-requests: read
    with:
      stackName: ${{ needs.names.outputs.environment-name }}-env-MarketingSiteStack
      force-stack-deployment: 'true'
      environment-name: ${{ needs.names.outputs.environment-name }}
      deployment-name: ${{ needs.names.outputs.environment-name }}
      cdk-application: 'environment'

  verify-certificate:
    name: 'verify certificate'
    needs:
      - names
      - create-secrets
    runs-on: ubuntu-24.04
    environment: ${{ needs.names.outputs.environment-name }}
    permissions:
      id-token: write
      contents: read
    steps:
      - name: Checkout the actions
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          sparse-checkout: .github/actions
          persist-credentials: false
      - name: Assume the AWS actions and deploy roles
        uses: ./.github/actions/aws-role
        with:
          actions-role-arn: ${{ vars.SUBMIT_ACTIONS_ROLE_ARN }}
          deploy-role-arn: ${{ vars.SUBMIT_DEPLOY_ROLE_ARN }}
          aws-region: us-east-1

      - name: Verify certificate covers Cognito domain
        run: |
          CERT_ARN="${{ vars.SUBMIT_CERTIFICATE_ARN }}"
          COGNITO_DOMAIN="${{ needs.names.outputs.environment-name }}-auth.submit.diyaccounting.co.uk"

          echo "Verifying certificate $CERT_ARN covers $COGNITO_DOMAIN"

          # Try to describe certificate - may fail if IAM role lacks acm:DescribeCertificate
          if ! SANS=$(aws acm describe-certificate \
            --certificate-arn "$CERT_ARN" \
            --query 'Certificate.SubjectAlternativeNames' \
            --output text 2>&1); then
            echo "WARNING: Could not verify certificate coverage (IAM permission issue)"
            echo "Error: $SANS"
            echo ""
            echo "Since ci-auth.submit.diyaccounting.co.uk works, the certificate likely has"
            echo "wildcard *.submit.diyaccounting.co.uk coverage, so proceeding anyway."
            echo ""
            echo "To enable verification, add acm:DescribeCertificate to the deployment role."
            exit 0
          fi

          echo "Certificate SANs: $SANS"

          # Check for exact match or wildcard coverage
          if echo "$SANS" | grep -qE "(^|[[:space:]])(\*\.submit\.diyaccounting\.co\.uk|${COGNITO_DOMAIN})($|[[:space:]])"; then
            echo "Certificate covers $COGNITO_DOMAIN"
          else
            echo "WARNING: Certificate may not cover $COGNITO_DOMAIN"
            echo "Expected one of:"
            echo "  - *.submit.diyaccounting.co.uk (wildcard)"
            echo "  - $COGNITO_DOMAIN (explicit)"
            echo ""
            echo "Since ci-auth.submit.diyaccounting.co.uk works, proceeding anyway."
          fi

  # TODO: Switch to deploy-cdk-stack.yml
  deploy-identity:
    name: 'deploy identity'
    needs:
      - params
      - names
      - create-secrets
      - verify-certificate
    runs-on: ubuntu-24.04
    environment: ${{ needs.names.outputs.environment-name }}
    permissions:
      id-token: write
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Assume the AWS actions and deploy roles
        uses: ./.github/actions/aws-role
        with:
          actions-role-arn: ${{ vars.SUBMIT_ACTIONS_ROLE_ARN }}
          deploy-role-arn: ${{ vars.SUBMIT_DEPLOY_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Set up the toolchain
        uses: ./.github/actions/setup-toolchain
        timeout-minutes: 6
        with:
          java: 'true'

      - name: Deploy Identity stack (CDK)
        run: |
          ./mvnw --errors clean verify -DskipTests -Dmaven.compiler.source=${{ env.JAVA_VERSION }} -Dmaven.compiler.target=${{ env.JAVA_VERSION }} \
            && cd cdk-environment \
            && cat ../.env.${{ needs.names.outputs.environment-name }} \
            && npx dotenv -e ../.env.${{ needs.names.outputs.environment-name }} -- \
              npx cdk deploy \
                ${{ needs.names.outputs.environment-name }}-env-IdentityStack \
                --exclusively \
                --require-approval never \
                --ci true \
                --no-notices \
                --concurrency 4 \
                --asset-parallelism \
                --outputs-file ../cdk-submit-environment.out/cdk-outputs-identity.json \
              && cd .. \
            ;
        env:
          ENVIRONMENT_NAME: ${{ needs.names.outputs.environment-name }}
          DEPLOYMENT_NAME: ${{ needs.names.outputs.environment-name }}

      - name: Resolve stack outputs
        id: identity-outputs
        run: |
          COGNITO_USER_POOL_ARN=$(jq -r '.["${{ needs.names.outputs.environment-name }}-env-IdentityStack"].UserPoolArn' cdk-submit-environment.out/cdk-outputs-identity.json)
          COGNITO_USER_POOL_ID=$(jq -r '.["${{ needs.names.outputs.environment-name }}-env-IdentityStack"].UserPoolId' cdk-submit-environment.out/cdk-outputs-identity.json)
          COGNITO_CLIENT_ID=$(jq -r '.["${{ needs.names.outputs.environment-name }}-env-IdentityStack"].UserPoolClientId' cdk-submit-environment.out/cdk-outputs-identity.json)
          echo "COGNITO_USER_POOL_ARN=$COGNITO_USER_POOL_ARN"
          echo "COGNITO_USER_POOL_ID=$COGNITO_USER_POOL_ID"
          echo "COGNITO_CLIENT_ID=$COGNITO_CLIENT_ID"
          echo "COGNITO_USER_POOL_ARN=$COGNITO_USER_POOL_ARN" >> $GITHUB_OUTPUT
          echo "COGNITO_USER_POOL_ID=$COGNITO_USER_POOL_ID" >> $GITHUB_OUTPUT
          echo "COGNITO_CLIENT_ID=$COGNITO_CLIENT_ID" >> $GITHUB_OUTPUT
        shell: bash

      - name: Force refresh Google Identity Provider (after secret rotation)
        if: ${{ needs.params.outputs.force-identity-refresh == 'true' }}
        run: |
          echo "Force refreshing Google Identity Provider to pick up rotated secret..."
          COGNITO_USER_POOL_ID=$(jq -r '.["${{ needs.names.outputs.environment-name }}-env-IdentityStack"].UserPoolId' cdk-submit-environment.out/cdk-outputs-identity.json)

          # Get current Google IdP configuration
          CURRENT_CONFIG=$(aws cognito-idp describe-identity-provider \
            --user-pool-id "$COGNITO_USER_POOL_ID" \
            --provider-name Google \
            --query 'IdentityProvider.ProviderDetails' \
            --output json)

          # Get current attribute mapping
          CURRENT_ATTRS=$(aws cognito-idp describe-identity-provider \
            --user-pool-id "$COGNITO_USER_POOL_ID" \
            --provider-name Google \
            --query 'IdentityProvider.AttributeMapping' \
            --output json)

          # Fetch the new secret value from Secrets Manager
          NEW_SECRET=$(aws secretsmanager get-secret-value \
            --secret-id "${{ needs.names.outputs.environment-name }}/submit/google/client_secret" \
            --query 'SecretString' \
            --output text)

          # Update the IdP with the new secret - this forces Cognito to use the new value
          # We need to re-specify all provider details including the updated client_secret
          CLIENT_ID=$(echo "$CURRENT_CONFIG" | jq -r '.client_id')

          aws cognito-idp update-identity-provider \
            --user-pool-id "$COGNITO_USER_POOL_ID" \
            --provider-name Google \
            --provider-details "client_id=$CLIENT_ID,client_secret=$NEW_SECRET,authorize_scopes=email openid profile" \
            --attribute-mapping "$CURRENT_ATTRS"

          echo "Google Identity Provider updated with new secret"

  deploy-billing-webhook:
    name: 'deploy billing webhook'
    needs:
      - names
      - create-secrets
      - deploy-data
    permissions:
      id-token: write
      contents: read
    uses: ./.github/workflows/deploy-env-image-stack.yml
    secrets: inherit
    with:
      environment-name: ${{ needs.names.outputs.environment-name }}
      image-name: billing-webhook
      stack-name: ${{ needs.names.outputs.environment-name }}-env-BillingWebhookStack

  deploy-cost-export:
    name: 'deploy cost export'
    needs:
      - names
    # A single org-wide resource in the management account, not one per environment: running it
    # from both the ci and prod pipelines would deploy the same CloudFormation stack twice with
    # nothing gained, so it rides the prod pipeline only.
    if: ${{ needs.names.outputs.environment-name == 'prod' }}
    runs-on: ubuntu-24.04
    permissions:
      id-token: write
      contents: read
    env:
      ROOT_ACTIONS_ROLE_ARN: 'arn:aws:iam::887764105431:role/root-github-actions-role'
      ROOT_DEPLOY_ROLE_ARN: 'arn:aws:iam::887764105431:role/root-deployment-role'
      COST_ACCOUNT_ID: '887764105431'
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Assume the AWS actions and deploy roles
        uses: ./.github/actions/aws-role
        with:
          actions-role-arn: ${{ env.ROOT_ACTIONS_ROLE_ARN }}
          deploy-role-arn: ${{ env.ROOT_DEPLOY_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Set up the toolchain
        uses: ./.github/actions/setup-toolchain
        timeout-minutes: 6
        with:
          java: 'true'

      - name: Build cost CDK app
        run: |
          ./mvnw --errors clean verify -DskipTests -P cdk-cost \
            -Dmaven.compiler.source=${{ env.JAVA_VERSION }} \
            -Dmaven.compiler.target=${{ env.JAVA_VERSION }}

      - name: Deploy FOCUS cost export (CDK)
        working-directory: cdk-cost
        env:
          CDK_DEFAULT_ACCOUNT: ${{ env.COST_ACCOUNT_ID }}
          CDK_DEFAULT_REGION: ${{ env.AWS_REGION }}
        run: |
          npx cdk deploy --all \
            --require-approval never \
            --ci true \
            --no-notices \
            --outputs-file ../cdk-submit-cost.out/cdk-outputs-cost.json
