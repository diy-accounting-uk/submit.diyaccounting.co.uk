name: companies-house-test-service
run-name: "Companies House XML Gateway test-service harness"

# Runs the fixed case list in scripts/fixtures/companies-house-test-service-cases.json against the
# real Companies House XML Gateway test service (GatewayTest=1, the ci presenter), through
# scripts/companies-house-test-service-run.js. This is the recurring proof the assumed
# software-authorisation criteria (PLAN_COMPANIES_HOUSE_APPROVAL.md) ask for: every variant filed on the
# test service, polled to a terminal state, at least weekly, with an evidence log a human can hand
# to Companies House's XML team. allocateSubmissionNumber() increments a live DynamoDB counter -
# an AWS write - so this run happens only here, never from a local session.

on:
  schedule:
    - cron: '38 6 * * 1' # Weekly on Monday, off the top-of-hour queue
  workflow_dispatch:
    inputs:
      case:
        type: string
        description: 'Run only this named case from the fixture (default: every case)'
        required: false
        default: ''
      poll-submission:
        type: string
        description: 'Poll this existing submission number instead of filing the cases'
        required: false
        default: ''

concurrency:
  group: companies-house-test-service-${{ github.ref }}
  cancel-in-progress: false

permissions:
  id-token: write
  contents: read

env:
  AWS_REGION: 'eu-west-2'

jobs:
  run-harness:
    name: 'Run the Companies House test-service cases'
    runs-on: ubuntu-24.04
    environment: ci
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Assume the AWS actions and deployment roles
        uses: ./.github/actions/aws-role
        with:
          actions-role-arn: ${{ vars.SUBMIT_ACTIONS_ROLE_ARN }}
          deploy-role-arn: ${{ vars.SUBMIT_DEPLOY_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Set up the toolchain
        timeout-minutes: 6
        uses: ./.github/actions/setup-toolchain

      - name: Read the gateway URI and presenter secret ARNs from .env.ci
        id: env-ci
        run: |
          echo "xmlgw-uri=$(grep -E '^COMPANIES_HOUSE_XMLGW_URI=' .env.ci | cut -d'=' -f2)" | tee -a "$GITHUB_OUTPUT"
          echo "presenter-id-arn=$(grep -E '^COMPANIES_HOUSE_PRESENTER_ID_ARN=' .env.ci | cut -d'=' -f2)" | tee -a "$GITHUB_OUTPUT"
          echo "presenter-code-arn=$(grep -E '^COMPANIES_HOUSE_PRESENTER_CODE_ARN=' .env.ci | cut -d'=' -f2)" | tee -a "$GITHUB_OUTPUT"

      - name: Run the test-service cases
        id: run
        continue-on-error: true
        run: |
          if [ -n "$POLL_SUBMISSION" ]; then
            node scripts/companies-house-test-service-run.js \
              --poll "$POLL_SUBMISSION" \
              --out-dir "$RUNNER_TEMP/companies-house-test-service"
          else
            node scripts/companies-house-test-service-run.js \
              --cases scripts/fixtures/companies-house-test-service-cases.json \
              --out-dir "$RUNNER_TEMP/companies-house-test-service" \
              ${{ inputs.case != '' && format('--case {0}', inputs.case) || '' }}
          fi
        env:
          POLL_SUBMISSION: ${{ inputs.poll-submission }}
          COMPANIES_HOUSE_XMLGW_URI: ${{ steps.env-ci.outputs.xmlgw-uri }}
          COMPANIES_HOUSE_PRESENTER_ID_ARN: ${{ steps.env-ci.outputs.presenter-id-arn }}
          COMPANIES_HOUSE_PRESENTER_CODE_ARN: ${{ steps.env-ci.outputs.presenter-code-arn }}
          COMPANIES_HOUSE_GATEWAY_TEST: 'true'
          COMPANIES_HOUSE_PACKAGE_REFERENCE: '0012'
          COMPANIES_HOUSE_ACCOUNTS_ASYNC_REQUESTS_TABLE_NAME: 'ci-env-companies-house-accounts-async-requests'

      - name: Write the case table to the step summary
        if: ${{ always() }}
        run: |
          {
            echo "## Companies House test-service run"
            echo ""
            echo "Run: ${{ github.run_id }} · $(date -u '+%Y-%m-%d %H:%M:%S UTC')"
            echo ""
            if [ -f "$RUNNER_TEMP/companies-house-test-service/summary.md" ]; then
              cat "$RUNNER_TEMP/companies-house-test-service/summary.md"
            else
              echo "No summary.md was written - the run failed before it could run any case."
            fi
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Upload the evidence log and redacted exchanges
        if: ${{ always() }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: companies-house-test-service-${{ github.run_id }}
          path: |
            ${{ runner.temp }}/companies-house-test-service/evidence-log.json
            ${{ runner.temp }}/companies-house-test-service/summary.md
          if-no-files-found: warn
          retention-days: 90

      - name: Fail the job when a case missed its expected outcome
        if: ${{ steps.run.outcome == 'failure' }}
        run: exit 1
