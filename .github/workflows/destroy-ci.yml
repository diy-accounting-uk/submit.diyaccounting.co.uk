name: destroy-ci
run-name: "destroy ci from ${{ github.ref_name }}"
concurrency:
  # This workflow always destroys ci's `{deployment}-app-*` stacks (environment-name is
  # hardcoded 'ci' below) — the branch that dispatched it is irrelevant to what it deletes, so
  # keying on github.ref_name only let two destroy-ci runs from different branches race each
  # other. A fixed group name is correct here, not a smaller bug fix short of one. This still
  # doesn't need to also cover deploy.yml/deploy-app.yml: this workflow's own
  # wait-for-ci-deploys step (below) already waits for their older runs to finish, and vice
  # versa, so a destroy racing a ci deploy is already handled outside this concurrency block.
  group: destroy-ci
  cancel-in-progress: false

on:
  workflow_dispatch:
    inputs:
      deployment-name:
        type: string
        description: 'Deployment name to destroy, e.g. ci-lambdas6'
        required: false
        default: ''
      sweep-for-stacks:
        type: boolean
        description: 'Whether to sweep for leftover stacks (true) or select by deployment name (false)'
        required: false
  workflow_call:
    inputs:
      deployment-name:
        type: string
        description: 'Deployment name to destroy, e.g. ci-lambdas6'
        required: false
        default: ''
      sweep-for-stacks:
        type: boolean
        description: 'Whether to sweep for leftover stacks (true) or select by deployment name (false)'
        required: false
        default: false
  schedule:
    - cron: '34 2,4,6,8,10,12 * * *'

permissions:
  id-token: write
  contents: read
  actions: read

env:
  JAVA_VERSION: '25'
  NODE_VERSION: '24'
  AWS_REGION: 'eu-west-2'
  BASE_IMAGE_TAG_PREFIX: 'submit-base'
  GITHUB_ACTOR: ${{ github.actor }}
  # This is a backstop's minimum age, not deploy.yml's self-destruct delay: the primary
  # teardown is the EventBridge schedule each deployment's own SelfDestructStack carries
  # (deploy.yml's SELF_DESTRUCT_DELAY_HOURS, default 2h). This sweep runs on a fixed cron
  # regardless of any single deployment's schedule, so it needs its own, larger, minimum age
  # to avoid destroying a deployment the primary schedule hasn't had a chance to reach yet.
  SELF_DESTRUCT_SWEEP_MIN_AGE_HOURS: '8'
  BASE_IMAGE_TAG: ${{ github.sha }}
  FORCE_ALL_STACK_DEPLOYMENT: 'false'
  COMMIT_HASH: ${{ github.sha }}
  BUILD_NUMBER: ${{ github.run_number }}

jobs:

  params:
    runs-on: ubuntu-24.04
    steps:
      - name: "github.event_name=[${{ github.event_name }}]"
        run: ":"
      - name: "github.ref=[${{ github.ref }}]"
        run: ":"
      - name: "inputs.deployment-name=[${{ inputs.deployment-name }}]"
        run: ":"
      - name: "inputs.sweep-for-stacks=[${{ inputs.sweep-for-stacks }}]"
        run: ":"
      - name: Normalise Params
        id: normalise
        shell: bash
        run: |
          # Trim here, once, because this is the only place the raw operator-supplied input is
          # read. A leading/trailing space (easy to paste in by accident) made the deployment
          # name fail its format check downstream and also broke the log-group prefix query,
          # which rejects whitespace outright.
          RAW_DEPLOYMENT_NAME='${{ inputs.deployment-name }}'
          TRIMMED_DEPLOYMENT_NAME=$(printf '%s' "$RAW_DEPLOYMENT_NAME" | sed -e 's/^[[:space:]]*//' -e 's/[[:space:]]*$//')
          echo "deployment-name=$TRIMMED_DEPLOYMENT_NAME" | tee -a "$GITHUB_OUTPUT"
          X='${{ inputs.sweep-for-stacks }}' ; echo "sweep-for-stacks=${X:-false}" | tee -a "$GITHUB_OUTPUT"
          # Compute isSweeping: true if sweep-for-stacks=true, or if no deployment-name was given
          # and this run is on a schedule. A reusable workflow call inherits github.event_name from
          # the caller, so an explicit deployment-name must win over the event.
          SWEEP_FOR_STACKS='${{ inputs.sweep-for-stacks }}'
          EVENT_NAME='${{ github.event_name }}'
          DEPLOYMENT_NAME="$TRIMMED_DEPLOYMENT_NAME"
          if [ "${SWEEP_FOR_STACKS:-false}" = "true" ]; then
            echo "isSweeping=true" | tee -a "$GITHUB_OUTPUT"
          elif [ -z "$DEPLOYMENT_NAME" ] && [ "$EVENT_NAME" = "schedule" ]; then
            echo "isSweeping=true" | tee -a "$GITHUB_OUTPUT"
          else
            echo "isSweeping=false" | tee -a "$GITHUB_OUTPUT"
          fi
    outputs:
      deployment-name: ${{ steps.normalise.outputs.deployment-name }}
      sweep-for-stacks: ${{ steps.normalise.outputs.sweep-for-stacks }}
      isSweeping: ${{ steps.normalise.outputs.isSweeping }}

  sweep-for-stacks:
    needs:
      - params
    if: ${{ needs.params.outputs.isSweeping == 'true' }}
    name: 'sweep for ci stacks'
    runs-on: ubuntu-24.04
    environment: ci
    steps:

      - name: Configure AWS role via GitHub OIDC
        uses: aws-actions/configure-aws-credentials@v6
        with:
          role-to-assume: ${{ vars.SUBMIT_ACTIONS_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}
          role-chaining: false
          audience: sts.amazonaws.com
          role-skip-session-tagging: true
          output-credentials: true
          retry-max-attempts: 3

      - name: Assume AWS deployment role
        uses: aws-actions/configure-aws-credentials@v6
        with:
          role-to-assume: ${{ vars.SUBMIT_DEPLOY_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}
          role-chaining: true
          audience: sts.amazonaws.com
          role-skip-session-tagging: true
          output-credentials: true
          retry-max-attempts: 3

      - name: CDK stacks in eu-west-2 and us-east-1
        run: |
          aws cloudformation describe-stacks --region eu-west-2 --query "Stacks[].StackName" --output text | tr '\t' '\n' | sort
          aws cloudformation describe-stacks --region us-east-1 --query "Stacks[].StackName" --output text | tr '\t' '\n' | sort

      - name: Get last known good ci deployment name
        id: last-known-good-deployment-names
        run: |
          PARAMETER_NAME="/submit/ci/last-known-good-deployment"
          echo "Getting SSM Parameter Store parameter $PARAMETER_NAME"
          LAST_KNOWN_GOOD=$(aws ssm get-parameter \
            --name "$PARAMETER_NAME" \
            --query "Parameter.Value" \
            --output text 2>/dev/null || echo "")
          echo "Last known good ci deployment: $LAST_KNOWN_GOOD"
          echo "last-known-good-deployment-name=$LAST_KNOWN_GOOD" >> $GITHUB_OUTPUT

      # Get the record names of aliases in any cloudfront distributions that match the ci- pattern
      - name: Get the published record names
        id: published-deployment-names
        run: |
          echo "Getting CloudFront distributions"
          DISTRIBUTION_IDS=$(aws cloudfront list-distributions --query "DistributionList.Items[].Id" --output text)
          PUBLISHED_DEPLOYMENT_NAMES=""
          echo "Found CloudFront Distribution IDs: $DISTRIBUTION_IDS"
          for DISTRIBUTION_ID in $DISTRIBUTION_IDS; do
            ALIASES=$(aws cloudfront get-distribution --id "$DISTRIBUTION_ID" --query "Distribution.DistributionConfig.Aliases.Items[]" --output text)
            echo "Found aliases for Distribution ID $DISTRIBUTION_ID: $ALIASES"
            for ALIAS in $ALIASES; do
              RECORD_NAME=$(echo "$ALIAS" | cut -d'.' -f1)
              if [[ "$RECORD_NAME" =~ ^ci-.* ]]; then
                PUBLISHED_DEPLOYMENT_NAMES="$PUBLISHED_DEPLOYMENT_NAMES $RECORD_NAME"
              fi
            done
          done

          echo "Collected published deployment names before deduplication: $PUBLISHED_DEPLOYMENT_NAMES"
          PUBLISHED_DEPLOYMENT_NAMES=$(echo $PUBLISHED_DEPLOYMENT_NAMES | tr ' ' '\n' | sort -u | tr '\n' ' ')

          echo "Published deployment names: $PUBLISHED_DEPLOYMENT_NAMES"
          echo "published-deployment-names=$PUBLISHED_DEPLOYMENT_NAMES" >> $GITHUB_OUTPUT

      # Get ci-prefixed deployment stack names from CloudFormation
      - name: Get the deployed deployment names
        id: deployed-deployment-names
        run: |
          echo 'Getting deployed ci deployment names from CloudFormation stacks in eu-west-2 and us-east-1'

          DEPLOYED_DEPLOYMENT_NAMES=$(
            for REGION in eu-west-2 us-east-1; do
              echo "Scanning region: $REGION" >&2
              aws cloudformation describe-stacks \
                --region "$REGION" \
                --query 'Stacks[].StackName' \
                --output text
            done \
            | tr '\t' '\n' \
            | grep -E '^ci-[a-zA-Z0-9-]+-(app|del)-' \
            | sed -E 's/^(ci-[a-zA-Z0-9-]+)-(app|del)-.*/\1/' \
            | sort -u
          )

          echo "Collected deployed deployment names (newline separated):"
          printf '%s\n' $DEPLOYED_DEPLOYMENT_NAMES

          DEPLOYED_DEPLOYMENT_NAMES=$(echo "$DEPLOYED_DEPLOYMENT_NAMES" | tr '\n' ' ')

          echo "Deployed deployment names: $DEPLOYED_DEPLOYMENT_NAMES"
          echo "deployed-deployment-names=$DEPLOYED_DEPLOYMENT_NAMES" >> "$GITHUB_OUTPUT"

      # Route 53 is in the management account — switch credentials for the query
      - name: Configure management account role via GitHub OIDC (for Route 53)
        uses: aws-actions/configure-aws-credentials@v6
        with:
          role-to-assume: ${{ vars.ROOT_ACTIONS_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}
          role-chaining: false
          audience: sts.amazonaws.com
          role-skip-session-tagging: true
          output-credentials: true
          retry-max-attempts: 3

      - name: Assume management account deployment role (for Route 53)
        uses: aws-actions/configure-aws-credentials@v6
        with:
          role-to-assume: ${{ vars.ROOT_DEPLOY_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}
          role-chaining: true
          audience: sts.amazonaws.com
          role-skip-session-tagging: true
          output-credentials: true
          retry-max-attempts: 3

      # Get the deployment name that ci.submit.diyaccounting.co.uk aliases to in Route 53
      - name: Get the public record names
        id: public-deployment-names
        run: |
          echo 'Getting Route 53 hosted zone for diyaccounting.co.uk.'
          ROOT_ZONE='diyaccounting.co.uk.'
          PRIMARY_NAME='ci.submit.diyaccounting.co.uk.'
          PUBLIC_DEPLOYMENT_NAMES=''

          ZONE_ID=$(aws route53 list-hosted-zones-by-name \
            --dns-name "$ROOT_ZONE" \
            --query 'HostedZones[0].Id' \
            --output text 2>/dev/null | sed 's|/hostedzone/||')

          if [ -z "$ZONE_ID" ] || [ "$ZONE_ID" = 'None' ]; then
            echo "No hosted zone found for $ROOT_ZONE"
            exit 1
          fi

          echo "Using hosted zone $ROOT_ZONE ($ZONE_ID)"
          echo "Looking up alias target for $PRIMARY_NAME"

          ALIAS_TARGETS=$(aws route53 list-resource-record-sets \
            --hosted-zone-id "$ZONE_ID" \
            --query "ResourceRecordSets[?Name==\`$PRIMARY_NAME\` && Type==\`A\`].AliasTarget.DNSName" \
            --output text)

          if [ -z "$ALIAS_TARGETS" ] || [ "$ALIAS_TARGETS" = 'None' ]; then
            echo "No alias A record found for $PRIMARY_NAME"
          else
            echo "Alias targets for $PRIMARY_NAME: $ALIAS_TARGETS"
            for TARGET in $ALIAS_TARGETS; do
              TARGET_STRIPPED=${TARGET%.}
              HOST_LABEL=${TARGET_STRIPPED%%.*}
              if [[ "$HOST_LABEL" =~ ^ci-.* ]]; then
                echo "Found public deployment from $PRIMARY_NAME -> $HOST_LABEL"
                PUBLIC_DEPLOYMENT_NAMES="$PUBLIC_DEPLOYMENT_NAMES $HOST_LABEL"
              else
                echo "Alias target $TARGET_STRIPPED does not look like ci-*, skipping"
              fi
            done
          fi

          echo "Collected public deployment names before deduplication: $PUBLIC_DEPLOYMENT_NAMES"
          PUBLIC_DEPLOYMENT_NAMES=$(echo "$PUBLIC_DEPLOYMENT_NAMES" \
            | tr ' ' '\n' \
            | sort -u \
            | tr '\n' ' ')

          echo "Public deployment names: $PUBLIC_DEPLOYMENT_NAMES"
          echo "public-deployment-names=$PUBLIC_DEPLOYMENT_NAMES" >> "$GITHUB_OUTPUT"

      # Switch back to submit-ci account for remaining steps
      - name: Restore submit-ci AWS role via GitHub OIDC
        uses: aws-actions/configure-aws-credentials@v6
        with:
          role-to-assume: ${{ vars.SUBMIT_ACTIONS_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}
          role-chaining: false
          audience: sts.amazonaws.com
          role-skip-session-tagging: true
          output-credentials: true
          retry-max-attempts: 3

      - name: Restore submit-ci AWS deployment role
        uses: aws-actions/configure-aws-credentials@v6
        with:
          role-to-assume: ${{ vars.SUBMIT_DEPLOY_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}
          role-chaining: true
          audience: sts.amazonaws.com
          role-skip-session-tagging: true
          output-credentials: true
          retry-max-attempts: 3

      # Select ci deployment names of stacks to destroy, excluding public/last-known-good
      - name: Select deployment names for destruction
        id: select-stack
        run: |
          LAST_KNOWN_GOOD_DEPLOYMENT_NAME="${{ steps.last-known-good-deployment-names.outputs.last-known-good-deployment-name }}"
          PUBLIC_DEPLOYMENT_NAMES="${{ steps.public-deployment-names.outputs.public-deployment-names }}"
          PUBLISHED_DEPLOYMENT_NAMES="${{ steps.published-deployment-names.outputs.published-deployment-names }}"
          DEPLOYED_DEPLOYMENT_NAMES="${{ steps.deployed-deployment-names.outputs.deployed-deployment-names }}"
          SELF_DESTRUCT_SWEEP_MIN_AGE_HOURS="${{ env.SELF_DESTRUCT_SWEEP_MIN_AGE_HOURS }}"

          echo "Last known good deployment name: '$LAST_KNOWN_GOOD_DEPLOYMENT_NAME'"
          echo "Public deployment names: $PUBLIC_DEPLOYMENT_NAMES"
          echo "Published deployment names: $PUBLISHED_DEPLOYMENT_NAMES"
          echo "Deployed deployment names: $DEPLOYED_DEPLOYMENT_NAMES"
          echo "Sweep minimum age hours: $SELF_DESTRUCT_SWEEP_MIN_AGE_HOURS"

          # Function to get the most recent creation time for a deployment's stacks
          get_deployment_age_hours() {
            local deployment_name="$1"
            local most_recent_timestamp=0

            echo "Checking age of deployment: $deployment_name" >&2

            if ! [[ "$deployment_name" =~ ^ci-[a-zA-Z0-9-]+$ ]]; then
              echo "Invalid deployment name format: $deployment_name" >&2
              echo "-1"
              return
            fi

            for REGION in eu-west-2 us-east-1; do
              local stack_info=$(aws cloudformation describe-stacks \
                --region "$REGION" \
                --query "Stacks[?starts_with(StackName, '${deployment_name}-')].CreationTime" \
                --output text 2>/dev/null | tr '\t' '\n' || echo "")

              if [ -n "$stack_info" ]; then
                echo "Found stacks in $REGION for $deployment_name" >&2

                while IFS= read -r creation_time; do
                  [ -z "$creation_time" ] && continue
                  local epoch=$(date -d "$creation_time" +%s 2>/dev/null)
                  if [ -z "$epoch" ]; then
                    echo "Failed to parse creation time: $creation_time" >&2
                    continue
                  fi
                  if ! [[ "$epoch" =~ ^[0-9]+$ ]] || [ "$epoch" -le 0 ]; then
                    echo "Invalid epoch value: $epoch for creation time: $creation_time" >&2
                    continue
                  fi
                  if [ "$epoch" -gt "$most_recent_timestamp" ]; then
                    most_recent_timestamp="$epoch"
                  fi
                done <<< "$stack_info"
              fi
            done

            if [ "$most_recent_timestamp" -eq 0 ]; then
              echo "No valid stacks found for deployment $deployment_name" >&2
              echo "-1"
              return
            fi

            local current_timestamp=$(date +%s)
            local age_seconds=$((current_timestamp - most_recent_timestamp))
            local age_hours=$((age_seconds / 3600))

            echo "Deployment $deployment_name age: $age_hours hours (most recent stack created at $(date -d "@$most_recent_timestamp" -Iseconds))" >&2
            echo "$age_hours"
          }

          STACK_DEPLOYMENT_NAMES_TO_KEEP=()

          # Keep deployments that are currently aliased from the primary plus last-known-good
          for DEPLOYMENT_NAME in $(echo "$PUBLIC_DEPLOYMENT_NAMES $LAST_KNOWN_GOOD_DEPLOYMENT_NAME" | tr ' ' '\n'); do
            if [ -n "$DEPLOYMENT_NAME" ]; then
              STACK_DEPLOYMENT_NAMES_TO_KEEP+=("$DEPLOYMENT_NAME")
            fi
          done

          # Keep sibling site deployments (gateway, spreadsheets) and holding pages
          for DEPLOYMENT_NAME in $PUBLISHED_DEPLOYMENT_NAMES; do
            if [[ "$DEPLOYMENT_NAME" == *-holding ]] || \
               [[ "$DEPLOYMENT_NAME" == *-gateway ]] || \
               [[ "$DEPLOYMENT_NAME" == *-spreadsheets ]]; then
              STACK_DEPLOYMENT_NAMES_TO_KEEP+=("$DEPLOYMENT_NAME")
            fi
          done

          # Remove duplicates
          echo "Removing duplicates from stacks to keep from: ${STACK_DEPLOYMENT_NAMES_TO_KEEP[*]}"
          STACK_DEPLOYMENT_NAMES_TO_KEEP=($(echo "${STACK_DEPLOYMENT_NAMES_TO_KEEP[@]}" | tr ' ' '\n' | sort -u | tr '\n' ' '))

          echo "Stacks to skip destruction: ${STACK_DEPLOYMENT_NAMES_TO_KEEP[*]}"

          ALL_CANDIDATE_DEPLOYMENT_NAMES="$PUBLISHED_DEPLOYMENT_NAMES $DEPLOYED_DEPLOYMENT_NAMES"
          ALL_CANDIDATE_DEPLOYMENT_NAMES=$(echo "$ALL_CANDIDATE_DEPLOYMENT_NAMES" | tr ' ' '\n' | sort -u | tr '\n' ' ')

          # A deployment can lose every stack an older self-destruct pass knew to delete except
          # one it didn't (added after that pass's stack list was written), leaving only that one
          # stack standing with no sibling to name the deployment through PUBLIC/PUBLISHED/DEPLOYED
          # above. Find those by scanning live stacks directly, so the next sweep still finds them,
          # even when only a single app or del stack is what's left of a deployment.
          LEFTOVER_STACK_NAMES=$(
            for REGION in eu-west-2 us-east-1; do
              aws cloudformation describe-stacks --region "$REGION" \
                --query "Stacks[].StackName" --output text 2>/dev/null
            done | tr '\t' '\n' | grep -E '^ci-[a-zA-Z0-9-]+-(app|del)-' || echo ""
          )

          LEFTOVER_DEPLOYMENT_NAMES=""
          for STACK_NAME in $LEFTOVER_STACK_NAMES; do
            PREFIX=$(echo "$STACK_NAME" | sed -E 's/^(ci-[a-zA-Z0-9-]+)-(app|del)-.*/\1/')
            if [ "$PREFIX" != "$LAST_KNOWN_GOOD_DEPLOYMENT_NAME" ]; then
              LEFTOVER_DEPLOYMENT_NAMES="$LEFTOVER_DEPLOYMENT_NAMES $PREFIX"
            fi
          done

          echo "Leftover deployment names found from stray app stacks: $LEFTOVER_DEPLOYMENT_NAMES"
          ALL_CANDIDATE_DEPLOYMENT_NAMES="$ALL_CANDIDATE_DEPLOYMENT_NAMES $LEFTOVER_DEPLOYMENT_NAMES"
          ALL_CANDIDATE_DEPLOYMENT_NAMES=$(echo "$ALL_CANDIDATE_DEPLOYMENT_NAMES" | tr ' ' '\n' | sort -u | tr '\n' ' ')

          SELECTED_DEPLOYMENT_NAME=""

          for DEPLOYMENT_NAME in $ALL_CANDIDATE_DEPLOYMENT_NAMES; do
            [ -z "$DEPLOYMENT_NAME" ] && continue

            echo "Considering deployment name: $DEPLOYMENT_NAME"

            # Only consider ci-prefixed deployments
            if [[ "$DEPLOYMENT_NAME" != ci-* ]]; then
              echo "Skipping $DEPLOYMENT_NAME (not a ci deployment)"
              continue
            fi

            if [[ " ${STACK_DEPLOYMENT_NAMES_TO_KEEP[*]} " =~ " ${DEPLOYMENT_NAME} " ]]; then
              echo "Skipping $DEPLOYMENT_NAME as it is in the keep list"
              continue
            fi

            DEPLOYMENT_AGE_HOURS=$(get_deployment_age_hours "$DEPLOYMENT_NAME")

            if [ "$DEPLOYMENT_AGE_HOURS" -eq -1 ]; then
              echo "Could not determine age for $DEPLOYMENT_NAME, skipping"
              continue
            fi

            if [ "$DEPLOYMENT_AGE_HOURS" -lt "$SELF_DESTRUCT_SWEEP_MIN_AGE_HOURS" ]; then
              echo "Skipping $DEPLOYMENT_NAME as it is only $DEPLOYMENT_AGE_HOURS hours old (minimum age: $SELF_DESTRUCT_SWEEP_MIN_AGE_HOURS hours)"
              continue
            fi

            echo "Deployment $DEPLOYMENT_NAME is $DEPLOYMENT_AGE_HOURS hours old (>= $SELF_DESTRUCT_SWEEP_MIN_AGE_HOURS hours), eligible for destruction"

            SELECTED_DEPLOYMENT_NAME="$DEPLOYMENT_NAME"
            echo "Selected deployment for destruction: Environment='ci', Deployment='$SELECTED_DEPLOYMENT_NAME'"
            break
          done

          if [ -z "$SELECTED_DEPLOYMENT_NAME" ]; then
            echo "No ci stacks found for destruction"
            SWEEPER_HIT="false"
          else
            echo "Stacks found for destruction ci/${SELECTED_DEPLOYMENT_NAME}"
            SWEEPER_HIT="true"
          fi

          echo "SWEEPER_HIT=$SWEEPER_HIT"
          echo "SELECTED_DEPLOYMENT_NAME=$SELECTED_DEPLOYMENT_NAME"
          echo "SWEEPER_HIT=$SWEEPER_HIT" >> $GITHUB_OUTPUT
          echo "SELECTED_DEPLOYMENT_NAME=$SELECTED_DEPLOYMENT_NAME" >> $GITHUB_OUTPUT

      # The keep list above always protects the deployment SSM names as last-known-good, so if
      # that deployment's own stacks are already gone (an explicit dispatch destroyed it directly,
      # bypassing the keep list, or the last straggler stack from the leftover scan above finally
      # cleared), the pointer is left naming nothing. Set it to the sentinel "None" so a future
      # sweep, and every other workflow that reads it, stop treating that name as something to
      # protect or fall back to. It used to delete the parameter outright, but
      # ObservabilityStack's dashboard reads it as an AWS::SSM::Parameter::Value<String> template
      # parameter, which CloudFormation refuses to resolve at all against a missing parameter —
      # that broke the very next environment deploy's changeset. Every reader already treats the
      # literal string "None" the same as empty (the AWS CLI's own rendering of a null field), so
      # the sentinel changes nothing downstream.
      - name: Set last-known-good pointer to "None" if it names a deployment with no stacks left
        run: |
          PARAMETER_NAME="/submit/ci/last-known-good-deployment"
          LAST_KNOWN_GOOD=$(aws ssm get-parameter --name "$PARAMETER_NAME" --query "Parameter.Value" --output text 2>/dev/null || echo "")

          if [ -z "$LAST_KNOWN_GOOD" ] || [ "$LAST_KNOWN_GOOD" = "None" ]; then
            echo "No last-known-good ci deployment set, nothing to check"
            exit 0
          fi

          REMAINING_STACKS=$(
            for REGION in eu-west-2 us-east-1; do
              aws cloudformation describe-stacks --region "$REGION" \
                --query "Stacks[?starts_with(StackName, '${LAST_KNOWN_GOOD}-')].StackName" \
                --output text 2>/dev/null || echo ""
            done | tr '\t' '\n' | grep -c . || true
          )

          if [ "${REMAINING_STACKS:-0}" -eq 0 ]; then
            echo "Last-known-good ci deployment $LAST_KNOWN_GOOD has no stacks left, setting $PARAMETER_NAME to None"
            aws ssm put-parameter --name "$PARAMETER_NAME" --type String --value "None" --overwrite
          else
            echo "Last-known-good ci deployment $LAST_KNOWN_GOOD still has $REMAINING_STACKS stack(s), leaving $PARAMETER_NAME alone"
          fi

    outputs:
      sweeper-hit: ${{ steps.select-stack.outputs.SWEEPER_HIT }}
      deployment-name: ${{ steps.select-stack.outputs.SELECTED_DEPLOYMENT_NAME }}

  names:
    # `sweep-for-stacks` is skipped (an explicit deployment-name dispatch needs no sweep) as
    # often as it fails, and both leave `sweeper-hit` empty. Checking only that output could
    # not tell the two apart, so a failed sweep read the same as "run anyway" and this job
    # would compute names from whatever the sweep managed to emit before it died.
    # needs.sweep-for-stacks.result distinguishes them: 'skipped' is the explicit-name path,
    # safe to proceed on; 'success' with sweeper-hit != 'false' is a completed sweep that
    # found something. Anything else, 'failure' above all, must not reach this job — a
    # partial stack list is not one to act on. `!cancelled()` only lifts the implicit
    # success() this job would otherwise inherit from `needs`; it does not mean the sweep
    # worked, which was the bug.
    if: ${{ !cancelled() && (needs.sweep-for-stacks.result == 'skipped' || (needs.sweep-for-stacks.result == 'success' && needs.sweep-for-stacks.outputs.sweeper-hit != 'false')) }}
    needs:
      - params
      - sweep-for-stacks
    runs-on: ubuntu-24.04
    environment: ci
    steps:
      - name: Checkout
        uses: actions/checkout@v7
      - name: Compute deployment name and environment
        id: deployment-config
        uses: ./.github/actions/get-names
        with:
          environment-name: ci
          deployment-name: ${{ needs.sweep-for-stacks.outputs.deployment-name || needs.params.outputs.deployment-name }}
    outputs:
      environment-name: ${{ steps.deployment-config.outputs.environment-name }}
      deployment-name: ${{ steps.deployment-config.outputs.deployment-name }}
      base-domain: ${{ steps.deployment-config.outputs.base-domain }}
      base-url: ${{ steps.deployment-config.outputs.base-url }}
      apex-domain: ${{ steps.deployment-config.outputs.apex-domain }}
      apex-url: ${{ steps.deployment-config.outputs.apex-url }}
      holding-domain: ${{ steps.deployment-config.outputs.holding-domain }}
      holding-url: ${{ steps.deployment-config.outputs.holding-url }}

  destroy:
    # Same gate as the `names` job above, and for the same reason: this job deletes
    # CloudFormation stacks, so it must not run on a sweep that failed partway through
    # building its list. Only a skipped sweep (explicit deployment-name) or a sweep that
    # completed and found a hit may reach here.
    if: ${{ !cancelled() && (needs.sweep-for-stacks.result == 'skipped' || (needs.sweep-for-stacks.result == 'success' && needs.sweep-for-stacks.outputs.sweeper-hit != 'false')) }}
    needs:
      - params
      - names
      - sweep-for-stacks
    runs-on: ubuntu-latest
    environment: ci
    steps:
      - name: Checkout default branch
        uses: actions/checkout@v7
        with:
          ref: ${{ github.event.repository.default_branch }} # e.g. main
          fetch-depth: 0

      - name: Report deleted ref
        run: |
          echo "Deleted: ${{ github.event.ref }}"
          echo "Ref type: ${{ github.event.ref_type }}"

      - name: Checkout
        uses: actions/checkout@v7

      - name: Wait for older ci deploy runs to finish
        uses: './.github/actions/wait-for-ci-deploys'
        with:
          github-token: ${{ github.token }}

      - name: Setup Node
        uses: actions/setup-node@v7
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'

      - uses: actions/setup-java@v5
        with:
          distribution: 'temurin'
          java-version: ${{ env.JAVA_VERSION }}
          cache: 'maven'

      - name: Configure AWS role via GitHub OIDC
        uses: aws-actions/configure-aws-credentials@v6
        with:
          role-to-assume: ${{ vars.SUBMIT_ACTIONS_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}
          role-chaining: false
          audience: sts.amazonaws.com
          role-skip-session-tagging: true
          output-credentials: true
          retry-max-attempts: 3

      - name: Assume AWS deployment role
        uses: aws-actions/configure-aws-credentials@v6
        with:
          role-to-assume: ${{ vars.SUBMIT_DEPLOY_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}
          role-chaining: true
          audience: sts.amazonaws.com
          role-skip-session-tagging: true
          output-credentials: true
          retry-max-attempts: 3

      - name: CDK stacks before
        run: |
          aws cloudformation describe-stacks --region eu-west-2 --query "Stacks[].StackName" --output text | tr '\t' '\n' | sort
          aws cloudformation describe-stacks --region us-east-1 --query "Stacks[].StackName" --output text | tr '\t' '\n' | sort

      # This workflow had no equivalent of destroy-prod.yml's live/last-known-good refusal — a
      # comment further down already referred to a "Refuse to destroy" check "above" that did not
      # exist in this file. Carrying that same protection here, adapted to ci: the base domain a
      # deployment gets is always "{deployment}.submit.diyaccounting.co.uk" (see
      # .github/actions/get-names), regardless of environment, so the live-distribution check
      # matches on that plus this environment's own apex domain.
      - name: Refuse to destroy the live or last known good deployment
        id: refuse
        shell: bash
        env:
          DEPLOYMENT: ${{ needs.names.outputs.deployment-name }}
          CI_APEX_DOMAIN: ${{ needs.names.outputs.apex-domain }}
        run: |
          set -euo pipefail
          if ! [[ "$DEPLOYMENT" =~ ^ci-[a-zA-Z0-9-]+$ ]] \
             || [[ "$DEPLOYMENT" == *-holding ]] || [[ "$DEPLOYMENT" == *-gateway ]] || [[ "$DEPLOYMENT" == *-spreadsheets ]]; then
            echo "Refusing to destroy [$DEPLOYMENT]: not an app deployment name"
            exit 1
          fi
          LAST_KNOWN_GOOD=$(aws ssm get-parameter \
            --name "/submit/ci/last-known-good-deployment" \
            --query "Parameter.Value" --output text 2>/dev/null || echo "")
          echo "Last known good ci deployment: [$LAST_KNOWN_GOOD]"
          if [ "$DEPLOYMENT" = "$LAST_KNOWN_GOOD" ]; then
            echo "Refusing to destroy [$DEPLOYMENT]: it is the last known good deployment"
            exit 1
          fi
          LIVE_DISTRIBUTION=$(aws cloudfront list-distributions \
            --query "DistributionList.Items[?Aliases.Items!=null && contains(Aliases.Items, '${CI_APEX_DOMAIN}') && contains(Aliases.Items, '${DEPLOYMENT}.submit.diyaccounting.co.uk')].Id | [0]" \
            --output text)
          if [ -n "$LIVE_DISTRIBUTION" ] && [ "$LIVE_DISTRIBUTION" != "None" ]; then
            echo "Refusing to destroy [$DEPLOYMENT]: distribution [$LIVE_DISTRIBUTION] still serves [$CI_APEX_DOMAIN]"
            exit 1
          fi
          echo "[$DEPLOYMENT] is neither live nor last known good; proceeding"

      # A destroy that matches no stacks must not report success: that reads exactly like a
      # destroy that worked, when in fact the caller named a deployment that was never live in
      # this account (or already gone). This step, like the refusal above it, has no explicit
      # `if:` guard, so it only runs when the refusal step succeeded — the default `success()`
      # every step carries unless overridden. Every step below this one that must not run past a
      # failed refusal checks `steps.confirm-stacks.outcome == 'success'`, which is true only when
      # both this step and the refusal before it succeeded.
      - name: Confirm the deployment has stacks to destroy
        id: confirm-stacks
        shell: bash
        env:
          DEPLOYMENT: ${{ needs.names.outputs.deployment-name }}
        run: |
          set -euo pipefail
          STACK_COUNT=0
          for REGION in eu-west-2 us-east-1; do
            REGION_COUNT=$(aws cloudformation describe-stacks --region "$REGION" \
              --query "length(Stacks[?starts_with(StackName, '${DEPLOYMENT}-')])" --output text 2>/dev/null || echo "0")
            echo "Found $REGION_COUNT stack(s) for [$DEPLOYMENT] in $REGION"
            STACK_COUNT=$((STACK_COUNT + REGION_COUNT))
          done
          if [ "$STACK_COUNT" -eq 0 ]; then
            echo "Refusing to report success: [$DEPLOYMENT] matches no stacks in eu-west-2 or us-east-1"
            exit 1
          fi
          echo "[$DEPLOYMENT] matches $STACK_COUNT stack(s); proceeding"

      - name: Node dependencies
        run: timeout 120 npm ci --prefer-offline || { sleep 30; timeout 180 npm ci; }
        timeout-minutes: 6
        env:
          NPM_CONFIG_FETCH_RETRIES: "3"

      - name: Silence the deployment's alarms
        run: node scripts/silence-deployment-alarms.mjs --env "${{ needs.names.outputs.environment-name }}" --deployment "${{ needs.names.outputs.deployment-name }}"

      # deploy.yml's own cut-over calls this workflow in the same run as its 'maven package' job.
      # That job's jar is usually already sitting in this run's artifacts, so reuse it instead of
      # rebuilding, the same fallback chain deploy-cdk-stack.yml uses. This only feeds the CDK
      # cleanup pass below. The actual stack deletion further down reads stack names, not the jar.
      - name: Download Maven build artifact
        id: download-maven-destroy
        uses: actions/download-artifact@v8
        continue-on-error: true
        with:
          name: maven-target
          path: target/

      - name: Cache Maven build output
        if: steps.download-maven-destroy.outcome != 'success'
        uses: actions/cache@v6
        with:
          path: target
          key: maven-target-${{ hashFiles('infra/main/java/**', 'infra/main/resources/**', 'pom.xml') }}

      - name: Build CDK
        run: |
          if [ -f target/submit-application.jar ]; then
            echo "Maven output already available (target/submit-application.jar), skipping build"
          else
            echo "Maven output not cached, building with profile cdk-application..."
            ./mvnw --errors clean verify -DskipTests \
              -Dmaven.compiler.source=${{ env.JAVA_VERSION }} -Dmaven.compiler.target=${{ env.JAVA_VERSION }} \
              -P cdk-application
          fi

      # A transient failure here (a Maven Central 403, for instance) must not abandon the
      # retirement: none of the steps below through 'Delete stacks in dependency order' touch the
      # jar this step builds. They delete named CloudFormation stacks by AWS CLI, which needs no
      # CDK synth. Only 'CDK destroy (cleanup pass)' further down needs it, and it already
      # tolerates failure on its own.
      #
      # `!cancelled()` alone is not enough: it is also true when an EARLIER step failed, which is
      # exactly what would let a failed 'Refuse to destroy' (or a failed 'Confirm the deployment
      # has stacks to destroy') run straight into stack deletion. Every step from here through
      # 'Delete leftover Lambda log groups' also requires `steps.confirm-stacks.outcome ==
      # 'success'` — true only when both the refusal and the stack-count check above it succeeded.
      # Never widen these `if` guards back to bare `!cancelled()`.
      - name: Lookup Cognito from domain convention
        if: ${{ !cancelled() && steps.confirm-stacks.outcome == 'success' }}
        id: lookup
        uses: './.github/actions/lookup-resources'
        with:
          environment-name: ${{ needs.names.outputs.environment-name }}
          lookup-cognito: 'true'
          # The DIYA-GL client may already be gone by the time cleanup runs; don't retry or
          # abort stack deletion over it.
          lenient-diya-gl-client-lookup: 'true'

      - name: Empty origin bucket
        if: ${{ !cancelled() && steps.confirm-stacks.outcome == 'success' }}
        shell: bash
        run: |
          EDGE_STACK="${{ needs.names.outputs.deployment-name }}-app-EdgeStack"
          BUCKET_NAME=$(aws cloudformation describe-stacks \
            --stack-name "${EDGE_STACK}" --region us-east-1 \
            --query 'Stacks[0].Outputs[?OutputKey==`OriginBucketName`].OutputValue' \
            --output text 2>/dev/null || echo "")
          if [ -z "$BUCKET_NAME" ] || [ "$BUCKET_NAME" = "None" ]; then
            echo "EdgeStack not found or no OriginBucketName output, skipping"
          else
            echo "Emptying origin bucket: ${BUCKET_NAME}"
            aws s3 rm "s3://${BUCKET_NAME}" --recursive \
              || echo "Origin bucket already empty or does not exist"
          fi

      - name: Clean up external API Gateway custom domain mappings
        if: ${{ !cancelled() && steps.confirm-stacks.outcome == 'success' }}
        shell: bash
        run: |
          set +e  # Best-effort cleanup
          API_STACK_NAME="${{ needs.names.outputs.deployment-name }}-app-ApiStack"
          API_ID=$(aws cloudformation describe-stacks \
            --stack-name "${API_STACK_NAME}" --region eu-west-2 \
            --query "Stacks[0].Outputs[?OutputKey=='HttpApiId'].OutputValue | [0]" \
            --output text 2>/dev/null || echo "")
          if [ -z "$API_ID" ] || [ "$API_ID" = "None" ]; then
            echo "No API ID found for stack ${API_STACK_NAME}, skipping"
            exit 0
          fi
          echo "Found API ID: $API_ID, scanning for external domain mappings"
          DOMAINS=$(aws apigatewayv2 get-domain-names --region eu-west-2 \
            --query 'Items[].DomainName' --output text 2>/dev/null || echo "")
          for DOMAIN in $DOMAINS; do
            [ -z "$DOMAIN" ] || [ "$DOMAIN" = "None" ] && continue
            MAPPINGS=$(aws apigatewayv2 get-api-mappings --domain-name "$DOMAIN" --region eu-west-2 \
              --query "Items[?ApiId=='${API_ID}'].[ApiMappingId]" --output text 2>/dev/null || echo "")
            ALL_COUNT=$(aws apigatewayv2 get-api-mappings --domain-name "$DOMAIN" --region eu-west-2 \
              --query 'length(Items)' --output text 2>/dev/null || echo "0")
            OUR_COUNT=0
            for MID in $MAPPINGS; do
              [ -z "$MID" ] || [ "$MID" = "None" ] && continue
              echo "Deleting mapping $MID from domain $DOMAIN"
              aws apigatewayv2 delete-api-mapping --domain-name "$DOMAIN" --api-mapping-id "$MID" --region eu-west-2 2>/dev/null || true
              OUR_COUNT=$((OUR_COUNT + 1))
            done
            if [ "$OUR_COUNT" -gt 0 ] && [ "$OUR_COUNT" -eq "$ALL_COUNT" ]; then
              echo "Deleting domain $DOMAIN (all mappings were ours)"
              aws apigatewayv2 delete-domain-name --domain-name "$DOMAIN" --region eu-west-2 2>/dev/null || true
            fi
          done
          echo "API Gateway custom domain mapping cleanup complete"

      - name: Delete stacks in dependency order
        if: ${{ !cancelled() && steps.confirm-stacks.outcome == 'success' }}
        shell: bash
        run: |
          DEPLOYMENT="${{ needs.names.outputs.deployment-name }}"

          delete_stack_in_region() {
            local STACK="$1" REGION="$2"
            local STATUS
            STATUS=$(aws cloudformation describe-stacks --stack-name "$STACK" --region "$REGION" \
              --query "Stacks[0].StackStatus" --output text 2>/dev/null || echo "DOES_NOT_EXIST")
            if [ "$STATUS" = "DOES_NOT_EXIST" ]; then
              echo "  $STACK does not exist in $REGION, skipping"
              return 0
            fi
            echo "  Deleting $STACK in $REGION (status: $STATUS)..."
            aws cloudformation delete-stack --stack-name "$STACK" --region "$REGION" 2>/dev/null || true
            aws cloudformation wait stack-delete-complete --stack-name "$STACK" --region "$REGION" 2>/dev/null || true
            # Check for DELETE_FAILED and force delete
            STATUS=$(aws cloudformation describe-stacks --stack-name "$STACK" --region "$REGION" \
              --query "Stacks[0].StackStatus" --output text 2>/dev/null || echo "DOES_NOT_EXIST")
            if [ "$STATUS" = "DELETE_FAILED" ]; then
              echo "  $STACK is DELETE_FAILED, force deleting"
              aws cloudformation delete-stack --stack-name "$STACK" --region "$REGION" \
                --deletion-mode FORCE_DELETE_STACK || true
              aws cloudformation wait stack-delete-complete --stack-name "$STACK" --region "$REGION" 2>/dev/null || true
            fi
          }

          # Delete in reverse dependency order (leaf stacks first)
          echo "=== Phase 1: SelfDestruct + Ops + Publish (no dependents) ==="
          delete_stack_in_region "${DEPLOYMENT}-app-SelfDestructStack" eu-west-2
          delete_stack_in_region "${DEPLOYMENT}-app-OpsStack" eu-west-2
          delete_stack_in_region "${DEPLOYMENT}-app-PublishStack" us-east-1

          echo "=== Phase 2: EdgeStack (depends on ApiStack outputs) ==="
          delete_stack_in_region "${DEPLOYMENT}-app-EdgeStack" us-east-1

          echo "=== Phase 3: ApiStack (depends on Lambda stacks) ==="
          delete_stack_in_region "${DEPLOYMENT}-app-ApiStack" eu-west-2

          echo "=== Phase 4: Lambda stacks (no cross-dependencies) ==="
          delete_stack_in_region "${DEPLOYMENT}-app-AuthStack" eu-west-2
          delete_stack_in_region "${DEPLOYMENT}-app-HmrcStack" eu-west-2
          delete_stack_in_region "${DEPLOYMENT}-app-HmrcItsaStack" eu-west-2
          delete_stack_in_region "${DEPLOYMENT}-app-CompaniesHouseStack" eu-west-2
          delete_stack_in_region "${DEPLOYMENT}-app-AccountStack" eu-west-2
          delete_stack_in_region "${DEPLOYMENT}-app-BillingStack" eu-west-2
          delete_stack_in_region "${DEPLOYMENT}-app-DiyaGlStack" eu-west-2

          echo "=== Stack deletion complete ==="

      - name: CDK destroy (cleanup pass)
        if: ${{ !cancelled() && steps.confirm-stacks.outcome == 'success' }}
        run: |
          cd cdk-application && \
            npx dotenv -e ../.env.ci -- \
              npx cdk destroy \
              --all \
              --force \
              --no-notices \
          && cd .. \
          || echo "CDK destroy cleanup pass completed (some stacks may already be deleted)"
        env:
          ENVIRONMENT_NAME: ci
          DEPLOYMENT_NAME: ${{ needs.names.outputs.deployment-name }}
          BASE_IMAGE_TAG: "${{ env.BASE_IMAGE_TAG }}:latest"
          COGNITO_USER_POOL_ARN: ${{ steps.lookup.outputs.cognito-user-pool-arn }}
          COGNITO_CLIENT_ID: ${{ steps.lookup.outputs.cognito-client-id }}
          COGNITO_DIYA_GL_CLIENT_ID: ${{ steps.lookup.outputs.cognito-diya-gl-client-id }}
          WEBSITE_HASH: 'placeholder'
          HTTP_API_URL: 'https://placeholder'

      - name: Retry DELETE_FAILED stacks
        if: ${{ !cancelled() && steps.confirm-stacks.outcome == 'success' }}
        shell: bash
        run: |
          DEPLOYMENT="${{ needs.names.outputs.deployment-name }}"
          FAILED_STACKS=$(aws cloudformation list-stacks --region eu-west-2 \
            --stack-status-filter DELETE_FAILED \
            --query "StackSummaries[?starts_with(StackName, '${DEPLOYMENT}')].StackName" \
            --output text 2>/dev/null || echo "")
          for STACK in $FAILED_STACKS; do
            [ -z "$STACK" ] || [ "$STACK" = "None" ] && continue
            echo "Stack $STACK is DELETE_FAILED, retrying with --retain-resources"
            FAILED_RESOURCES=$(aws cloudformation list-stack-resources --stack-name "$STACK" --region eu-west-2 \
              --query "StackResourceSummaries[?ResourceStatus=='DELETE_FAILED'].LogicalResourceId" \
              --output text 2>/dev/null || echo "")
            if [ -n "$FAILED_RESOURCES" ] && [ "$FAILED_RESOURCES" != "None" ]; then
              echo "Retaining: $FAILED_RESOURCES"
              aws cloudformation delete-stack --stack-name "$STACK" --region eu-west-2 \
                --retain-resources $FAILED_RESOURCES || true
            else
              echo "No failed resources found, retrying plain delete"
              aws cloudformation delete-stack --stack-name "$STACK" --region eu-west-2 || true
            fi
            echo "Waiting for $STACK deletion..."
            aws cloudformation wait stack-delete-complete --stack-name "$STACK" --region eu-west-2 2>/dev/null || true
          done

      - name: CDK stacks after
        if: ${{ !cancelled() && steps.confirm-stacks.outcome == 'success' }}
        run: |
          aws cloudformation describe-stacks --region eu-west-2 --query "Stacks[].StackName" --output text | tr '\t' '\n' | sort
          aws cloudformation describe-stacks --region us-east-1 --query "Stacks[].StackName" --output text | tr '\t' '\n' | sort

      # CDK custom-resource provider Lambdas create their own log groups outside the stacks, so
      # they survive stack deletion with no retention.
      - name: Delete leftover Lambda log groups
        if: ${{ !cancelled() && steps.confirm-stacks.outcome == 'success' }}
        shell: bash
        env:
          DEPLOYMENT: ${{ needs.names.outputs.deployment-name }}
        run: |
          set -euo pipefail
          for REGION in eu-west-2 us-east-1; do
            REMAINING=$(aws cloudformation describe-stacks --region "$REGION" \
              --query "Stacks[?starts_with(StackName, '${DEPLOYMENT}-')].StackName" --output text)
            if [ -n "$REMAINING" ] && [ "$REMAINING" != "None" ]; then
              echo "Stacks still present for ${DEPLOYMENT} in ${REGION}, leaving its log groups: ${REMAINING}"
              continue
            fi
            LOG_GROUPS=$(aws logs describe-log-groups --region "$REGION" \
              --log-group-name-prefix "/aws/lambda/${DEPLOYMENT}-" \
              --query "logGroups[?!retentionInDays].logGroupName" --output text | tr '\t' '\n')
            for LOG_GROUP in $LOG_GROUPS; do
              [ -z "$LOG_GROUP" ] || [ "$LOG_GROUP" = "None" ] && continue
              echo "Deleting log group ${LOG_GROUP} in ${REGION}"
              aws logs delete-log-group --region "$REGION" --log-group-name "$LOG_GROUP" \
                || echo "Failed to delete ${LOG_GROUP} in ${REGION}"
            done
          done

      # DORA row for the one-stop dashboard, written whether this destroy run succeeded or
      # failed, so a failed teardown counts towards the failure rate rather than leaving a gap.
      - name: Build the DORA row
        if: always()
        id: dora-row
        env:
          GH_TOKEN: ${{ github.token }}
          DORA_WORKFLOW: ${{ github.workflow }}
          DORA_ENVIRONMENT: ${{ needs.names.outputs.environment-name }}
          DORA_DEPLOYMENT: ${{ needs.names.outputs.deployment-name }}
          DORA_BRANCH: ${{ github.ref_name }}
          DORA_SHA: ${{ github.sha }}
          DORA_RUN_ID: ${{ github.run_id }}
          DORA_RUN_ATTEMPT: ${{ github.run_attempt }}
          DORA_RUN_NUMBER: ${{ github.run_number }}
          DORA_ACTOR: ${{ github.actor }}
          DORA_TRIGGER: ${{ github.event_name }}
          DORA_REPOSITORY: ${{ github.repository }}
          DORA_JOB_STATUS: ${{ job.status }}
        run: |
          set -euo pipefail
          STARTED_AT=$(gh api "repos/${DORA_REPOSITORY}/actions/runs/${DORA_RUN_ID}" --jq .run_started_at)
          FINISHED_AT=$(date -u +%FT%TZ)
          DURATION_SECONDS=$(( $(date -u -d "$FINISHED_AT" +%s) - $(date -u -d "$STARTED_AT" +%s) ))
          MERGED_AT=$(gh api "repos/${DORA_REPOSITORY}/commits/${DORA_SHA}/pulls" --jq '.[0].merged_at // empty' || echo "")

          if [ "$DORA_JOB_STATUS" = "success" ]; then CONCLUSION="success"; else CONCLUSION="failure"; fi

          ROW=$(jq -nc \
            --arg workflow "$DORA_WORKFLOW" \
            --arg environment "$DORA_ENVIRONMENT" \
            --arg deployment "$DORA_DEPLOYMENT" \
            --arg branch "$DORA_BRANCH" \
            --arg sha "$DORA_SHA" \
            --arg run_id "$DORA_RUN_ID" \
            --argjson run_attempt "$DORA_RUN_ATTEMPT" \
            --argjson run_number "$DORA_RUN_NUMBER" \
            --arg actor "$DORA_ACTOR" \
            --arg trigger "$DORA_TRIGGER" \
            --arg started_at "$STARTED_AT" \
            --arg finished_at "$FINISHED_AT" \
            --argjson duration_seconds "$DURATION_SECONDS" \
            --arg conclusion "$CONCLUSION" \
            --arg merged_at "$MERGED_AT" \
            '{
              workflow: $workflow, environment: $environment, deployment: $deployment,
              branch: $branch, sha: $sha, run_id: $run_id, run_attempt: $run_attempt,
              run_number: $run_number, actor: $actor, trigger: $trigger,
              started_at: $started_at, finished_at: $finished_at,
              duration_seconds: $duration_seconds, conclusion: $conclusion,
              merged_at: (if $merged_at == "" then null else $merged_at end),
              lead_time_seconds: (
                if $merged_at == "" then null
                else (($finished_at | strptime("%Y-%m-%dT%H:%M:%SZ") | mktime)
                      - ($merged_at | strptime("%Y-%m-%dT%H:%M:%SZ") | mktime))
                end
              )
            }')
          echo "row=$ROW" >> "$GITHUB_OUTPUT"
          echo "key=curated/dora/dt=$(date -u +%F)/${DORA_RUN_ID}-${DORA_RUN_ATTEMPT}.json" >> "$GITHUB_OUTPUT"

      - name: Write the DORA row to the lake
        if: always()
        uses: './.github/actions/dora-row'
        with:
          bucket: '${{ needs.names.outputs.environment-name }}-env-analytics-lake-${{ vars.SUBMIT_ACCOUNT_ID }}'
          key: ${{ steps.dora-row.outputs.key }}
          row: ${{ steps.dora-row.outputs.row }}
