name: cloud credentials
run-name: "cloud credentials for ${{ inputs.codename }}"

# Gives one Claude Code cloud worker short-lived AWS credentials that only it can read
# (PLAN_CLOUD_COLLABORATION.md, "AWS credentials for a worker"). The job assumes
# submit-ci-cloud-worker-role (IdentityStack, ci only) for one hour, encrypts a credentials file
# to the worker's ssh-ed25519 public key with age, and uploads only the ciphertext. The
# coordinator starts it with `new-cloud-session.sh creds <codename>`, which pushes the artifact to
# .collab/<codename>.aws.age on the worker's collab branch.
#
# The job declares no `environment:`. An environment changes the OIDC sub claim to
# repo:<repo>:environment:<name>, and the role trusts only repo:<repo>:ref:refs/heads/main.
# For the same reason the ci account id is written here, not read from the ci environment's
# SUBMIT_ACCOUNT_ID variable.

on:
  workflow_dispatch:
    inputs:
      codename:
        description: 'The worker code name (one lowercase word, the submit-cloud-<codename> repository)'
        type: string
        required: true
      public_key:
        description: 'The worker public key, one line: ssh-ed25519 <base64> [comment]'
        type: string
        required: true

concurrency:
  group: cloud-credentials-${{ inputs.codename }}
  cancel-in-progress: false

permissions:
  id-token: write
  contents: read

env:
  AWS_REGION: 'eu-west-2'
  CI_ACCOUNT_ID: '367191799875'
  CLOUD_WORKER_ROLE_NAME: 'submit-ci-cloud-worker-role'
  SESSION_SECONDS: '3600'
  AGE_VERSION: 'v1.3.2'
  AGE_LINUX_AMD64_SHA256: 'cbe24006683f8eb669266162894b9a522a1af52f2665fbc63a4bb032ed26ac10'

jobs:
  handoff:
    name: 'Encrypt ci credentials to the worker key'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Check the ref and the inputs
        env:
          CODENAME: ${{ inputs.codename }}
          PUBLIC_KEY: ${{ inputs.public_key }}
        run: |
          set -euo pipefail
          if [ "$GITHUB_REF" != "refs/heads/main" ]; then
            echo "::error::cloud-credentials runs on main only (this run is on $GITHUB_REF)"
            exit 1
          fi
          if [[ ! $CODENAME =~ ^[a-z]+$ ]]; then
            echo "::error::codename must be one lowercase word"
            exit 1
          fi
          if [[ $PUBLIC_KEY == *$'\n'* || $PUBLIC_KEY == *$'\r'* ]]; then
            echo "::error::public_key must be one line"
            exit 1
          fi
          if [[ ! $PUBLIC_KEY =~ ^ssh-ed25519\ ([A-Za-z0-9+/]+={0,2})(\ [[:print:]]*)?$ ]]; then
            echo "::error::public_key must be one line: ssh-ed25519 <base64> [comment]"
            exit 1
          fi
          blob=${BASH_REMATCH[1]}
          # An ssh-ed25519 key blob is 51 bytes: a 4-byte length, "ssh-ed25519", a 4-byte length
          # and the 32-byte key.
          blob_bytes=$(printf '%s' "$blob" | base64 -d | wc -c)
          key_type=$(printf '%s' "$blob" | base64 -d | head -c 15 | tail -c 11)
          if [ "$blob_bytes" -ne 51 ] || [ "$key_type" != "ssh-ed25519" ]; then
            echo "::error::public_key is not a valid ssh-ed25519 key"
            exit 1
          fi
          mkdir -p "$RUNNER_TEMP/handoff"
          printf '%s\n' "$PUBLIC_KEY" >"$RUNNER_TEMP/handoff/worker.pub"
          echo "worker $CODENAME, key $(ssh-keygen -l -f "$RUNNER_TEMP/handoff/worker.pub")"

      - name: Install age
        run: |
          set -euo pipefail
          tarball="age-${AGE_VERSION}-linux-amd64.tar.gz"
          curl -fsSL -o "$RUNNER_TEMP/$tarball" "https://github.com/FiloSottile/age/releases/download/${AGE_VERSION}/${tarball}"
          echo "${AGE_LINUX_AMD64_SHA256}  $RUNNER_TEMP/$tarball" | sha256sum -c -
          tar -xzf "$RUNNER_TEMP/$tarball" -C "$RUNNER_TEMP"
          echo "$RUNNER_TEMP/age" >>"$GITHUB_PATH"
          "$RUNNER_TEMP/age/age" --version

      - name: Assume the cloud worker role via GitHub OIDC
        uses: aws-actions/configure-aws-credentials@e1253824e5c10ff9df46874f81ed3ec929e19cfd # v6
        with:
          role-to-assume: arn:aws:iam::${{ env.CI_ACCOUNT_ID }}:role/${{ env.CLOUD_WORKER_ROLE_NAME }}
          role-session-name: cloud-worker-${{ inputs.codename }}
          role-duration-seconds: ${{ env.SESSION_SECONDS }}
          aws-region: ${{ env.AWS_REGION }}
          audience: sts.amazonaws.com
          role-skip-session-tagging: true
          retry-max-attempts: 3

      - name: Encrypt the credentials file to the worker key
        env:
          CODENAME: ${{ inputs.codename }}
        run: |
          set -euo pipefail
          set +x
          echo "::add-mask::$AWS_ACCESS_KEY_ID"
          echo "::add-mask::$AWS_SECRET_ACCESS_KEY"
          echo "::add-mask::$AWS_SESSION_TOKEN"
          role_arn=$(aws sts get-caller-identity --query Arn --output text)
          issued=$(date -u +%Y-%m-%dT%H:%M:%SZ)
          expires=$(date -u -d "+${SESSION_SECONDS} seconds" +%Y-%m-%dT%H:%M:%SZ)
          out="$RUNNER_TEMP/handoff/$CODENAME.aws.age"
          # printf is a shell builtin, so the keys reach age through a pipe only: never a file,
          # an argument list or the log.
          # Two sections with the same keys: [default] for the SDKs (Polly narration), and
          # [diya-submit-ci], the profile scripts/proxy-secrets.sh and the npm scripts name.
          printf '# %s for %s, issued %s, expires by %s\n[default]\naws_access_key_id = %s\naws_secret_access_key = %s\naws_session_token = %s\nregion = %s\n[diya-submit-ci]\naws_access_key_id = %s\naws_secret_access_key = %s\naws_session_token = %s\nregion = %s\n' \
            "$role_arn" "$CODENAME" "$issued" "$expires" \
            "$AWS_ACCESS_KEY_ID" "$AWS_SECRET_ACCESS_KEY" "$AWS_SESSION_TOKEN" "$AWS_REGION" \
            "$AWS_ACCESS_KEY_ID" "$AWS_SECRET_ACCESS_KEY" "$AWS_SESSION_TOKEN" "$AWS_REGION" |
            age -R "$RUNNER_TEMP/handoff/worker.pub" -o "$out"
          head -c 21 "$out" | grep -qx 'age-encryption.org/v1' || { echo "::error::$out is not an age file"; exit 1; }
          {
            echo "### Cloud credentials for $CODENAME"
            echo ""
            echo "- Role session: \`$role_arn\`"
            echo "- Issued: $issued; expires by $expires"
            echo "- Artifact: \`$CODENAME.aws.age\` (ciphertext only, kept for 1 day)"
          } >>"$GITHUB_STEP_SUMMARY"

      - name: Upload the ciphertext
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: ${{ inputs.codename }}.aws.age
          path: ${{ runner.temp }}/handoff/${{ inputs.codename }}.aws.age
          retention-days: 1
          if-no-files-found: error
