name: sbom
run-name: "SBOM generation for ${{ github.ref_name }}"
# SPDX-FileCopyrightText: 2026 DIY Accounting Limited
# SPDX-License-Identifier: AGPL-3.0-or-later

on:
  push:
    branches:
      - main
    paths:
      - 'package.json'
      - 'package-lock.json'
      - 'app/**'
      - 'web/**'
      - 'scripts/**'
      - 'infra/**'
      - 'pom.xml'
      - 'Dockerfile*'
      - '.github/workflows/sbom.yml'
  workflow_dispatch:

concurrency:
  group: sbom-${{ github.ref }}
  cancel-in-progress: true

permissions:
  id-token: write
  contents: read

env:
  NODE_VERSION: '24'
  AWS_REGION: 'eu-west-2'

jobs:
  sbom:
    name: SBOM generation
    runs-on: ubuntu-24.04
    environment: prod
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'

      - name: Install dependencies
        run: timeout 120 npm ci --prefer-offline || { sleep 30; timeout 180 npm ci; }
        timeout-minutes: 6
        env:
          NPM_CONFIG_FETCH_RETRIES: "3"

      - name: Generate the npm CycloneDX SBOM
        run: npm sbom --sbom-format cyclonedx > sbom-npm-cyclonedx.json

      - name: Check for a configured Maven CycloneDX plugin
        run: |
          if grep -q 'cyclonedx-maven-plugin' pom.xml; then
            echo "cyclonedx-maven-plugin is configured in pom.xml, but this workflow only reads it"
            echo "when present - it does not add the plugin itself."
          else
            echo "No cyclonedx-maven-plugin in pom.xml - only the npm SBOM is checked."
          fi

      - name: Log SBOM metadata
        id: sbom-info
        run: |
          cat > /tmp/sbom-info.mjs <<'EOF'
          import { readFileSync, writeFileSync } from "node:fs";

          const sbom = JSON.parse(readFileSync("sbom-npm-cyclonedx.json", "utf-8"));
          const components = sbom.components || [];

          const row = {
            run_id: process.env.GITHUB_RUN_ID,
            sha: process.env.GITHUB_SHA,
            component_count: components.length,
            sbom_created_at: sbom.metadata?.timestamp || null,
            checked_at: new Date().toISOString(),
          };

          writeFileSync("sbom-info-result.json", JSON.stringify(row));
          EOF
          node /tmp/sbom-info.mjs
          echo "row=$(cat sbom-info-result.json)" >> "$GITHUB_OUTPUT"
          echo "key=curated/security/sbom/dt=$(date -u +%F)/${GITHUB_RUN_ID}.json" >> "$GITHUB_OUTPUT"

      - name: Configure AWS role via GitHub OIDC
        uses: aws-actions/configure-aws-credentials@v6
        with:
          role-to-assume: ${{ vars.SUBMIT_ACTIONS_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}
          role-chaining: false
          audience: sts.amazonaws.com
          role-skip-session-tagging: true
          output-credentials: true
          retry-max-attempts: 3

      - name: Assume AWS deployment role
        uses: aws-actions/configure-aws-credentials@v6
        with:
          role-to-assume: ${{ vars.SUBMIT_DEPLOY_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}
          role-chaining: true
          audience: sts.amazonaws.com
          role-skip-session-tagging: true
          output-credentials: true
          retry-max-attempts: 3

      - name: Write the SBOM metadata row to the lake
        uses: './.github/actions/dora-row'
        with:
          bucket: 'prod-env-analytics-lake-${{ vars.SUBMIT_ACCOUNT_ID }}'
          key: ${{ steps.sbom-info.outputs.key }}
          row: ${{ steps.sbom-info.outputs.row }}
