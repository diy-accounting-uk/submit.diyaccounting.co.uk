name: sbom
run-name: "SBOM generation for ${{ github.ref_name }}"

on:
  push:
    branches:
      - main
    paths:
      - 'package.json'
      - 'package-lock.json'
      - 'app/**'
      - 'web/**'
      - 'scripts/**'
      - 'infra/**'
      - 'pom.xml'
      - 'Dockerfile*'
      - '.github/workflows/sbom.yml'
  workflow_dispatch:

concurrency:
  group: sbom-${{ github.ref }}
  cancel-in-progress: true

permissions:
  id-token: write
  contents: read

env:
  NODE_VERSION: '24'
  JAVA_VERSION: '25'
  AWS_REGION: 'eu-west-2'

jobs:
  sbom:
    name: SBOM generation
    runs-on: ubuntu-24.04
    environment: prod
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'

      - name: Install dependencies
        run: timeout 120 npm ci --prefer-offline || { sleep 30; timeout 180 npm ci; }
        timeout-minutes: 6
        env:
          NPM_CONFIG_FETCH_RETRIES: "3"

      - name: Generate the npm CycloneDX SBOM
        run: npm sbom --sbom-format cyclonedx > sbom-npm-cyclonedx.json

      - name: Setup Java
        uses: actions/setup-java@v5
        with:
          distribution: 'temurin'
          java-version: ${{ env.JAVA_VERSION }}

      - name: Generate the Maven CycloneDX SBOM
        run: ./mvnw -q -B org.cyclonedx:cyclonedx-maven-plugin:2.9.3:makeBom
        # pom.xml pins the plugin version and its output name/format; this goal is not bound to
        # a lifecycle phase, so it only runs here, not on every mvnw build.

      - name: Container base image is not covered
        run: |
          echo "This workflow generates SBOMs from source manifests (npm, Maven). It does not"
          echo "scan the container image that deploy-app.yml builds from Dockerfile and pushes"
          echo "to ECR. The base image's OS packages come from upstream, not from a manifest in"
          echo "this repo, so neither the npm nor the Maven generator can see them. Covering that"
          echo "needs an image scanner (e.g. Syft or Trivy) run against the built image, which is"
          echo "a separate step from this one."

      - name: Compute the lake date partition
        id: sbom-date
        run: echo "dt=$(date -u +%F)" >> "$GITHUB_OUTPUT"

      - name: Log SBOM metadata
        id: sbom-info
        env:
          SBOM_DT: ${{ steps.sbom-date.outputs.dt }}
        run: |
          cat > /tmp/sbom-info.mjs <<'EOF'
          import { readFileSync, writeFileSync } from "node:fs";

          const npmSbom = JSON.parse(readFileSync("sbom-npm-cyclonedx.json", "utf-8"));
          const javaSbom = JSON.parse(readFileSync("target/bom-java-cyclonedx.json", "utf-8"));
          const npmComponents = npmSbom.components || [];
          const javaComponents = javaSbom.components || [];
          const runId = process.env.GITHUB_RUN_ID;
          const dt = process.env.SBOM_DT;

          const row = {
            run_id: runId,
            sha: process.env.GITHUB_SHA,
            npm_component_count: npmComponents.length,
            npm_sbom_created_at: npmSbom.metadata?.timestamp || null,
            npm_sbom_key: `curated/security/sbom/dt=${dt}/${runId}-npm-cyclonedx.json`,
            java_component_count: javaComponents.length,
            java_sbom_created_at: javaSbom.metadata?.timestamp || null,
            java_sbom_key: `curated/security/sbom/dt=${dt}/${runId}-java-cyclonedx.json`,
            checked_at: new Date().toISOString(),
          };

          writeFileSync("sbom-info-result.json", JSON.stringify(row));
          EOF
          node /tmp/sbom-info.mjs
          echo "row=$(cat sbom-info-result.json)" >> "$GITHUB_OUTPUT"
          echo "key=curated/security/sbom/dt=${SBOM_DT}/${GITHUB_RUN_ID}.json" >> "$GITHUB_OUTPUT"

      - name: Configure AWS role via GitHub OIDC
        uses: aws-actions/configure-aws-credentials@v6
        with:
          role-to-assume: ${{ vars.SUBMIT_ACTIONS_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}
          role-chaining: false
          audience: sts.amazonaws.com
          role-skip-session-tagging: true
          output-credentials: true
          retry-max-attempts: 3

      - name: Assume AWS deployment role
        uses: aws-actions/configure-aws-credentials@v6
        with:
          role-to-assume: ${{ vars.SUBMIT_DEPLOY_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}
          role-chaining: true
          audience: sts.amazonaws.com
          role-skip-session-tagging: true
          output-credentials: true
          retry-max-attempts: 3

      - name: Write the SBOM documents to the lake
        # Uploaded straight from disk with aws s3 cp, not through the dora-row action: dora-row
        # pipes its `row` input through a GitHub Actions expression into an env var, which is
        # right for the small metadata row but wrong for these documents - the npm SBOM alone
        # runs to hundreds of components and would risk GitHub Actions' payload/env size limits
        # and JSON-in-YAML-expression escaping. A direct file upload has neither problem.
        run: |
          aws s3 cp sbom-npm-cyclonedx.json \
            "s3://${LAKE_BUCKET}/curated/security/sbom/dt=${SBOM_DT}/${GITHUB_RUN_ID}-npm-cyclonedx.json" \
            --content-type application/json
          aws s3 cp target/bom-java-cyclonedx.json \
            "s3://${LAKE_BUCKET}/curated/security/sbom/dt=${SBOM_DT}/${GITHUB_RUN_ID}-java-cyclonedx.json" \
            --content-type application/json
        env:
          LAKE_BUCKET: 'prod-env-analytics-lake-${{ vars.SUBMIT_ACCOUNT_ID }}'
          SBOM_DT: ${{ steps.sbom-date.outputs.dt }}

      - name: Write the SBOM metadata row to the lake
        uses: './.github/actions/dora-row'
        with:
          bucket: 'prod-env-analytics-lake-${{ vars.SUBMIT_ACCOUNT_ID }}'
          key: ${{ steps.sbom-info.outputs.key }}
          row: ${{ steps.sbom-info.outputs.row }}
