# @capability OPS-157 Write an environment's secrets into AWS Secrets Manager
# - **Use when:** reading or changing which GitHub Environment secrets reach AWS Secrets Manager for an environment, or how the salt and hash secrets are created.
# - **Does:** deploy-env-secrets.yml is called by the create-secrets job of deploy-environment.yml. It writes each environment secret into Secrets Manager through put-secret-with-rotation-tag.sh, creates the salt and email hash secrets once, and creates the last-known-good-deployment parameter when it is missing.
# - **Run:** no command; deploy-environment.yml calls it (see OPS-09)
# - **Entry:** `.github/workflows/deploy-env-secrets.yml`
# - **Files:** .github/workflows/deploy-env-secrets.yml, .github/workflows/deploy-environment.yml, scripts/put-secret-with-rotation-tag.sh
# - **Keywords:** create secrets, secrets manager, workflow_call, put-secret-with-rotation-tag, salt secret, email hash secret
# - **Related:** OPS-09, OPS-166
# @end-capability

name: deploy env secrets
run-name: "deploy env secrets ${{ inputs.environment-name }} from ${{ github.ref_name }}"

on:
  workflow_call:
    inputs:
      environment-name:
        description: 'Environment to write secrets for, e.g. ci or prod'
        type: string
        required: true

env:
  JAVA_VERSION: '25'
  AWS_REGION: 'eu-west-2'
  GITHUB_ACTOR: ${{ github.actor }}

jobs:
  create-secrets:
    name: 'create secrets'
    runs-on: ubuntu-24.04
    environment: ${{ inputs.environment-name }}
    permissions:
      id-token: write
      contents: read
    steps:

      # The salt secret's resource policy is applied by a script from the repo.
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - name: Assume the AWS actions and deploy roles
        uses: ./.github/actions/aws-role
        with:
          actions-role-arn: ${{ vars.SUBMIT_ACTIONS_ROLE_ARN }}
          deploy-role-arn: ${{ vars.SUBMIT_DEPLOY_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Create secret in AWS from secrets.GOOGLE_CLIENT_SECRET
        env:
          SECRET_VALUE: ${{ secrets.GOOGLE_CLIENT_SECRET }}
          AWS_REGION: ${{ env.AWS_REGION }}
        run: |
          scripts/put-secret-with-rotation-tag.sh \
            "${{ inputs.environment-name }}/submit/google/client_secret" \
            "$SECRET_VALUE"

      - name: Create secret in AWS from secrets.HMRC_CLIENT_SECRET
        env:
          SECRET_VALUE: ${{ secrets.HMRC_CLIENT_SECRET }}
          AWS_REGION: ${{ env.AWS_REGION }}
        run: |
          scripts/put-secret-with-rotation-tag.sh \
            "${{ inputs.environment-name }}/submit/hmrc/client_secret" \
            "$SECRET_VALUE"

      - name: Create secret in AWS from secrets.HMRC_SANDBOX_CLIENT_SECRET
        env:
          SECRET_VALUE: ${{ secrets.HMRC_SANDBOX_CLIENT_SECRET }}
          AWS_REGION: ${{ env.AWS_REGION }}
        run: |
          scripts/put-secret-with-rotation-tag.sh \
            "${{ inputs.environment-name }}/submit/hmrc/sandbox_client_secret" \
            "$SECRET_VALUE"

      - name: Create secret in AWS from secrets.COMPANIES_HOUSE_API_KEY
        env:
          SECRET_VALUE: ${{ secrets.COMPANIES_HOUSE_API_KEY }}
          AWS_REGION: ${{ env.AWS_REGION }}
        run: |
          scripts/put-secret-with-rotation-tag.sh \
            "${{ inputs.environment-name }}/submit/companies-house/api_key" \
            "$SECRET_VALUE"

      - name: Create secret in AWS from secrets.COMPANIES_HOUSE_SANDBOX_API_KEY
        env:
          COMPANIES_HOUSE_SANDBOX_API_KEY: ${{ secrets.COMPANIES_HOUSE_SANDBOX_API_KEY }}
          AWS_REGION: ${{ env.AWS_REGION }}
        run: |
          # The sandbox REST key reads the sandbox test companies for the registered office address
          # lookup on ci. Prod has no sandbox key and leaves the secret unset.
          if [ -z "${COMPANIES_HOUSE_SANDBOX_API_KEY}" ]; then
            echo "::notice::COMPANIES_HOUSE_SANDBOX_API_KEY is not set on this environment; skipping the secret"
            exit 0
          fi
          scripts/put-secret-with-rotation-tag.sh \
            "${{ inputs.environment-name }}/submit/companies-house/sandbox_api_key" \
            "${COMPANIES_HOUSE_SANDBOX_API_KEY}"

      - name: Create secret in AWS from secrets.COMPANIES_HOUSE_CLIENT_SECRET
        env:
          COMPANIES_HOUSE_CLIENT_SECRET: ${{ secrets.COMPANIES_HOUSE_CLIENT_SECRET }}
          AWS_REGION: ${{ env.AWS_REGION }}
        run: |
          # The Companies House filing client secret is set on the GitHub Environment by hand once
          # the developer-hub application exists. Until then the environment deploys without it
          # and the filing token exchange answers an error, which the ci-only gate keeps off prod.
          if [ -z "${COMPANIES_HOUSE_CLIENT_SECRET}" ]; then
            echo "::notice::COMPANIES_HOUSE_CLIENT_SECRET is not set on this environment; skipping the secret"
            exit 0
          fi
          scripts/put-secret-with-rotation-tag.sh \
            "${{ inputs.environment-name }}/submit/companies-house/client_secret" \
            "${COMPANIES_HOUSE_CLIENT_SECRET}"

      - name: Create secret in AWS from secrets.COMPANIES_HOUSE_PRESENTER_ID
        env:
          COMPANIES_HOUSE_PRESENTER_ID: ${{ secrets.COMPANIES_HOUSE_PRESENTER_ID }}
          AWS_REGION: ${{ env.AWS_REGION }}
        run: |
          # The Companies House XML Gateway test presenter id and authentication code are set on
          # the GitHub Environment by hand once Companies House emails them. Until then the
          # environment deploys without accounts filing credentials.
          if [ -z "${COMPANIES_HOUSE_PRESENTER_ID}" ]; then
            echo "::notice::COMPANIES_HOUSE_PRESENTER_ID is not set on this environment; skipping the secret"
            exit 0
          fi
          scripts/put-secret-with-rotation-tag.sh \
            "${{ inputs.environment-name }}/submit/companies-house/presenter_id" \
            "${COMPANIES_HOUSE_PRESENTER_ID}"

      - name: Create secret in AWS from secrets.COMPANIES_HOUSE_PRESENTER_CODE
        env:
          COMPANIES_HOUSE_PRESENTER_CODE: ${{ secrets.COMPANIES_HOUSE_PRESENTER_CODE }}
          AWS_REGION: ${{ env.AWS_REGION }}
        run: |
          if [ -z "${COMPANIES_HOUSE_PRESENTER_CODE}" ]; then
            echo "::notice::COMPANIES_HOUSE_PRESENTER_CODE is not set on this environment; skipping the secret"
            exit 0
          fi
          scripts/put-secret-with-rotation-tag.sh \
            "${{ inputs.environment-name }}/submit/companies-house/presenter_code" \
            "${COMPANIES_HOUSE_PRESENTER_CODE}"

      - name: Create secret in AWS from secrets.STRIPE_SECRET_KEY
        env:
          SECRET_VALUE: ${{ secrets.STRIPE_SECRET_KEY }}
          AWS_REGION: ${{ env.AWS_REGION }}
        run: |
          scripts/put-secret-with-rotation-tag.sh \
            "${{ inputs.environment-name }}/submit/stripe/secret_key" \
            "$SECRET_VALUE"

      - name: Create secret in AWS from secrets.STRIPE_TEST_SECRET_KEY
        env:
          SECRET_VALUE: ${{ secrets.STRIPE_TEST_SECRET_KEY }}
          AWS_REGION: ${{ env.AWS_REGION }}
        run: |
          scripts/put-secret-with-rotation-tag.sh \
            "${{ inputs.environment-name }}/submit/stripe/test_secret_key" \
            "$SECRET_VALUE"

      - name: Create Stripe webhook secret (live mode) from environment secret
        env:
          SECRET_VALUE: ${{ secrets.STRIPE_WEBHOOK_SECRET }}
          AWS_REGION: ${{ env.AWS_REGION }}
        run: |
          if [ -z "$SECRET_VALUE" ]; then
            echo "No STRIPE_WEBHOOK_SECRET in ${{ inputs.environment-name }} environment, skipping"
            exit 0
          fi
          scripts/put-secret-with-rotation-tag.sh \
            "${{ inputs.environment-name }}/submit/stripe/webhook_secret" \
            "$SECRET_VALUE"

      - name: Create Stripe test webhook secret from environment secret
        env:
          SECRET_VALUE: ${{ secrets.STRIPE_TEST_WEBHOOK_SECRET }}
          AWS_REGION: ${{ env.AWS_REGION }}
        run: |
          if [ -z "$SECRET_VALUE" ]; then
            echo "No STRIPE_TEST_WEBHOOK_SECRET in ${{ inputs.environment-name }} environment, skipping"
            exit 0
          fi
          scripts/put-secret-with-rotation-tag.sh \
            "${{ inputs.environment-name }}/submit/stripe/test_webhook_secret" \
            "$SECRET_VALUE"

      - name: Create secret in AWS from secrets.TELEGRAM_BOT_TOKEN
        env:
          SECRET_VALUE: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          AWS_REGION: ${{ env.AWS_REGION }}
        run: |
          scripts/put-secret-with-rotation-tag.sh \
            "${{ inputs.environment-name }}/submit/telegram/bot_token" \
            "$SECRET_VALUE"

      - name: Create secret in AWS from vars.PAYPAL_CLIENT_ID
        env:
          PAYPAL_CLIENT_ID: ${{ vars.PAYPAL_CLIENT_ID }}
          AWS_REGION: ${{ env.AWS_REGION }}
        run: |
          if [ -z "${PAYPAL_CLIENT_ID}" ]; then
            echo "::notice::PAYPAL_CLIENT_ID is not set on this environment; skipping the secret"
            exit 0
          fi
          scripts/put-secret-with-rotation-tag.sh \
            "${{ inputs.environment-name }}/submit/paypal/client_id" \
            "${PAYPAL_CLIENT_ID}"

      - name: Create secret in AWS from secrets.PAYPAL_CLIENT_SECRET
        env:
          PAYPAL_CLIENT_SECRET: ${{ secrets.PAYPAL_CLIENT_SECRET }}
          AWS_REGION: ${{ env.AWS_REGION }}
        run: |
          if [ -z "${PAYPAL_CLIENT_SECRET}" ]; then
            echo "::notice::PAYPAL_CLIENT_SECRET is not set on this environment; skipping the secret"
            exit 0
          fi
          scripts/put-secret-with-rotation-tag.sh \
            "${{ inputs.environment-name }}/submit/paypal/client_secret" \
            "${PAYPAL_CLIENT_SECRET}"

      - name: Create secret in AWS from secrets.OPS_APP_PRIVATE_KEY
        env:
          SECRET_VALUE: ${{ secrets.OPS_APP_PRIVATE_KEY }}
          AWS_REGION: ${{ env.AWS_REGION }}
        run: |
          if [ -z "$SECRET_VALUE" ]; then
            echo "No OPS_APP_PRIVATE_KEY in ${{ inputs.environment-name }} environment, skipping"
            exit 0
          fi
          scripts/put-secret-with-rotation-tag.sh \
            "${{ inputs.environment-name }}/submit/github/ops_app_private_key" \
            "$SECRET_VALUE"

      - name: Create secret in AWS from secrets.OPERATOR_EMAILS
        env:
          OPERATOR_EMAILS: ${{ secrets.OPERATOR_EMAILS }}${{ vars.SYNTHETIC_OPERATOR_EMAILS && format(',{0}', vars.SYNTHETIC_OPERATOR_EMAILS) || '' }}
          AWS_REGION: ${{ env.AWS_REGION }}
        run: |
          scripts/put-secret-with-rotation-tag.sh \
            "${{ inputs.environment-name }}/submit/operator-emails" \
            "$OPERATOR_EMAILS"

      - name: Create secret in AWS from secrets.FAMILY_AFFILIATE_EMAILS
        env:
          FAMILY_AFFILIATE_EMAILS: ${{ secrets.FAMILY_AFFILIATE_EMAILS }}${{ vars.SYNTHETIC_FAMILY_AFFILIATE_EMAILS && format(',{0}', vars.SYNTHETIC_FAMILY_AFFILIATE_EMAILS) || '' }}
          AWS_REGION: ${{ env.AWS_REGION }}
        run: |
          # An unset GitHub secret writes a single comma, which parses to an empty list: Secrets
          # Manager refuses an empty value, and the app reads no family affiliates from it.
          scripts/put-secret-with-rotation-tag.sh \
            "${{ inputs.environment-name }}/submit/family-affiliate-emails" \
            "${FAMILY_AFFILIATE_EMAILS:-,}"

      - name: Create user sub hash salt (if not exists)
        run: |
          SECRET_NAME="${{ inputs.environment-name }}/submit/user-sub-hash-salt"
          if ! aws secretsmanager describe-secret --secret-id "$SECRET_NAME" --region ${{ env.AWS_REGION }} 2>/dev/null; then
            echo "Creating new salt secret: $SECRET_NAME"
            # Generate 32-byte cryptographically secure random salt, base64 encoded
            SALT=$(openssl rand -base64 32)
            # Store as JSON registry format for multi-version salt support
            REGISTRY=$(jq -n --arg salt "$SALT" '{"current":"v1","versions":{"v1":$salt}}')
            aws secretsmanager create-secret \
              --name "$SECRET_NAME" \
              --description "Salt registry for hashing user subs - DO NOT DELETE (required for data recovery)" \
              --secret-string "$REGISTRY" \
              --region ${{ env.AWS_REGION }} \
              --tags Key=Purpose,Value=user-sub-hashing Key=Critical,Value=true Key=BackupRequired,Value=true
            aws secretsmanager tag-resource --secret-id "$SECRET_NAME" \
              --tags "Key=rotated-at,Value=$(date -u +%Y-%m-%d)" --region ${{ env.AWS_REGION }}
            echo "Salt secret created in registry format (current: v1)"
          else
            echo "Salt secret $SECRET_NAME already exists - preserving existing value"
          fi

      - name: Apply salt secret resource policy
        run: scripts/put-salt-secret-resource-policy.sh "${{ inputs.environment-name }}"
        env:
          SUBMIT_DEPLOY_ROLE_ARN: ${{ vars.SUBMIT_DEPLOY_ROLE_ARN }}
          SUBMIT_ACTIONS_ROLE_ARN: ${{ vars.SUBMIT_ACTIONS_ROLE_ARN }}

      - name: Create email hash secret (if not exists)
        run: |
          SECRET_NAME="${{ inputs.environment-name }}/submit/email-hash-secret"
          if ! aws secretsmanager describe-secret --secret-id "$SECRET_NAME" --region ${{ env.AWS_REGION }} 2>/dev/null; then
            echo "Creating new email hash secret: $SECRET_NAME"
            SECRET_VALUE=$(openssl rand -base64 32)
            # Store as JSON registry format for multi-version rotation support (see
            # email-hash-rotate.yml and app/lib/emailHash.js).
            REGISTRY=$(jq -n --arg secret "$SECRET_VALUE" '{"current":"v1","versions":{"v1":$secret}}')
            aws secretsmanager create-secret \
              --name "$SECRET_NAME" \
              --description "Secret registry for hashing pass-restriction email addresses" \
              --secret-string "$REGISTRY" \
              --region ${{ env.AWS_REGION }} \
              --tags Key=Purpose,Value=email-hashing Key=Critical,Value=false Key=BackupRequired,Value=false
            aws secretsmanager tag-resource --secret-id "$SECRET_NAME" \
              --tags "Key=rotated-at,Value=$(date -u +%Y-%m-%d)" --region ${{ env.AWS_REGION }}
            echo "Email hash secret created in registry format (current: v1)"
          else
            echo "Email hash secret $SECRET_NAME already exists - preserving existing value"
          fi

      # ObservabilityStack reads this parameter as an AWS::SSM::Parameter::Value<String>
      # template parameter, which CloudFormation refuses to resolve at all if the parameter is
      # missing - a hard changeset failure, not a stack-internal default. The destroy sweep
      # (destroy-ci.yml/destroy-prod.yml) sets it to the sentinel "None" rather than deleting it
      # once a deployment's last stack is gone, but this guards the case it is missing anyway
      # (never set yet, or removed by hand) so this environment's own deploy can't be blocked by
      # it.
      - name: Create last-known-good-deployment parameter (if not exists)
        run: |
          PARAMETER_NAME="/submit/${{ inputs.environment-name }}/last-known-good-deployment"
          if aws ssm get-parameter --name "$PARAMETER_NAME" >/dev/null 2>&1; then
            echo "$PARAMETER_NAME already exists"
          else
            echo "$PARAMETER_NAME is missing, creating it with the sentinel value None"
            aws ssm put-parameter --name "$PARAMETER_NAME" --type String --value "None"
          fi
