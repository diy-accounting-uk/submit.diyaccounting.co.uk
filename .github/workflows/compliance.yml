name: compliance-test
run-name: "compliance test of ${{ github.ref_name }}"

on:
  schedule:
    - cron: '6 6 * * 1'  # Weekly on Monday, just after 6am UTC to dodge the top-of-hour queue
  workflow_dispatch:
    inputs:
      environment-name:
        type: choice
        description: 'Environment name to use instead of computing from branch, e.g. ci or prod'
        required: false
        options:
          - '(auto)'
          - 'ci'
          - 'prod'
        default: '(auto)'
      deployment-name:
        type: string
        description: 'Deployment name to use instead of computing from branch, e.g. ci-lambdas6 or prod-ea373de'
        required: false
        default: ''
  workflow_call:
    inputs:
      environment-name:
        type: string
        description: 'Environment name to use instead of computing from branch, e.g. ci or prod'
        required: true
      deployment-name:
        type: string
        description: 'Deployment name to use instead of computing from branch, e.g. ci-lambdas6 or prod-ea373de'
        required: true

concurrency:
  group: compliance-${{ github.ref }}
  cancel-in-progress: true

permissions:
  id-token: write
  contents: read

env:
  NODE_VERSION: '24'
  AWS_REGION: 'eu-west-2'

jobs:
  params:
    runs-on: ubuntu-24.04
    steps:
      - name: "github.event_name=[${{ github.event_name }}]"
        run: ":"
      - name: "inputs.environment-name=[${{ inputs.environment-name }}]"
        run: ":"
      - name: "inputs.deployment-name=[${{ inputs.deployment-name }}]"
        run: ":"
      - name: Normalise Params
        id: normalise
        shell: bash
        run: |
          # Convert '(auto)' to empty string for downstream processing
          ENV_NAME='${{ inputs.environment-name }}'; [[ "$ENV_NAME" == "(auto)" ]] && ENV_NAME=""
          echo "environment-name=${ENV_NAME}" | tee -a "$GITHUB_OUTPUT"
          # Resolve GitHub Actions environment from explicit input or branch
          GH_ENV="${ENV_NAME}"
          if [ -z "$GH_ENV" ]; then
            if [ "${{ github.ref }}" == "refs/heads/main" ]; then GH_ENV="prod"; else GH_ENV="ci"; fi
          fi
          echo "github-environment=${GH_ENV}" | tee -a "$GITHUB_OUTPUT"
          echo 'deployment-name=${{ inputs.deployment-name }}' | tee -a "$GITHUB_OUTPUT"
    outputs:
      environment-name: ${{ steps.normalise.outputs.environment-name }}
      deployment-name: ${{ steps.normalise.outputs.deployment-name }}
      github-environment: ${{ steps.normalise.outputs.github-environment }}

  names:
    needs: params
    runs-on: ubuntu-24.04
    environment: ${{ needs.params.outputs.github-environment }}
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Configure AWS role via GitHub OIDC
        uses: aws-actions/configure-aws-credentials@v6
        with:
          role-to-assume: ${{ vars.SUBMIT_ACTIONS_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}
          role-chaining: false
          audience: sts.amazonaws.com
          role-skip-session-tagging: true
          output-credentials: true
          retry-max-attempts: 3

      - name: Assume AWS deployment role
        uses: aws-actions/configure-aws-credentials@v6
        with:
          role-to-assume: ${{ vars.SUBMIT_DEPLOY_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}
          role-chaining: true
          audience: sts.amazonaws.com
          role-skip-session-tagging: true
          output-credentials: true
          retry-max-attempts: 3

      - name: If main, read back last known good prod deployment from SSM Parameter Store
        if: ${{ needs.params.outputs.deployment-name == '' && github.ref == 'refs/heads/main' }}
        run: |
          PARAMETER_NAME="/submit/prod/last-known-good-deployment"
          LAST_KNOWN_GOOD=$(aws ssm get-parameter --name "$PARAMETER_NAME" --query "Parameter.Value" --output text 2>/dev/null || echo "")
          if [ -n "$LAST_KNOWN_GOOD" ] && [ "$LAST_KNOWN_GOOD" != "None" ]; then
            echo "$LAST_KNOWN_GOOD" > /tmp/last_known_good_deployment.txt
          fi
          echo "Last known good deployment: ${LAST_KNOWN_GOOD:-<none>}"

      - name: If not main, read back last known good ci deployment from SSM Parameter Store
        if: ${{ needs.params.outputs.deployment-name == '' && github.ref != 'refs/heads/main' }}
        run: |
          PARAMETER_NAME="/submit/ci/last-known-good-deployment"
          LAST_KNOWN_GOOD=$(aws ssm get-parameter --name "$PARAMETER_NAME" --query "Parameter.Value" --output text 2>/dev/null || echo "")
          if [ -n "$LAST_KNOWN_GOOD" ] && [ "$LAST_KNOWN_GOOD" != "None" ]; then
            echo "$LAST_KNOWN_GOOD" > /tmp/last_known_good_deployment.txt
          fi
          echo "Last known good deployment: ${LAST_KNOWN_GOOD:-<none>}"

      - name: If last-known-good-deployment set use that otherwise use current deployment name
        id: deployment-name
        run: |
          if [ -s /tmp/last_known_good_deployment.txt ]; then
            echo "Using last known good deployment from SSM Parameter Store"
            echo "deployment-name=$(cat /tmp/last_known_good_deployment.txt)" | tee -a "$GITHUB_OUTPUT"
          else
            echo "No last known good deployment found, using current deployment name"
            echo "deployment-name=${{ needs.params.outputs.deployment-name }}" | tee -a "$GITHUB_OUTPUT"
          fi

      - name: Compute environment name and apex URL
        id: deployment-config
        uses: './.github/actions/get-names'
        with:
          environment-name: ${{ needs.params.outputs.environment-name }}
          deployment-name: ${{ steps.deployment-name.outputs.deployment-name }}
    outputs:
      environment-name: ${{ steps.deployment-config.outputs.environment-name }}
      deployment-name: ${{ steps.deployment-config.outputs.deployment-name }}
      apex-domain: ${{ steps.deployment-config.outputs.apex-domain }}
      apex-url: ${{ steps.deployment-config.outputs.apex-url }}

  # Accessibility checks (run in parallel)
  accessibility-pa11y:
    name: Pa11y (WCAG AA)
    needs: [names]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'
      - run: timeout 120 npm ci --prefer-offline || { sleep 30; timeout 180 npm ci; }
        timeout-minutes: 6
        env:
          NPM_CONFIG_FETCH_RETRIES: "3"
      - name: Run accessibility:pa11y-${{ needs.names.outputs.environment-name }}
        run: npm run accessibility:pa11y-${{ needs.names.outputs.environment-name }}
        continue-on-error: true
      - name: Save pa11y JSON results for the compliance panel
        run: |
          mkdir -p web/public/tests/accessibility
          npx pa11y-ci --config .pa11yci.${{ needs.names.outputs.environment-name }}.json --reporter json \
            > web/public/tests/accessibility/pa11y-results.json
        continue-on-error: true
      - uses: actions/upload-artifact@v7
        with:
          name: pa11y-results
          path: web/public/tests/accessibility/pa11y-results.json
          retention-days: 7
          if-no-files-found: ignore

  accessibility-axe:
    name: axe-core (WCAG 2.1 AA)
    needs: [names]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'
      - run: timeout 120 npm ci --prefer-offline || { sleep 30; timeout 180 npm ci; }
        timeout-minutes: 6
        env:
          NPM_CONFIG_FETCH_RETRIES: "3"
      - name: Run accessibility:axe-${{ needs.names.outputs.environment-name }}
        run: |
          mkdir -p web/public/tests/accessibility
          npm run accessibility:axe-${{ needs.names.outputs.environment-name }} -- \
            --save web/public/tests/accessibility/axe-results.json
        continue-on-error: true
      - uses: actions/upload-artifact@v7
        with:
          name: axe-results
          path: web/public/tests/accessibility/axe-results.json
          retention-days: 7
          if-no-files-found: ignore

  accessibility-axe-wcag22:
    name: axe-core (WCAG 2.2 AA)
    needs: [names]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'
      - run: timeout 120 npm ci --prefer-offline || { sleep 30; timeout 180 npm ci; }
        timeout-minutes: 6
        env:
          NPM_CONFIG_FETCH_RETRIES: "3"
      - name: Run accessibility:axe-wcag22-${{ needs.names.outputs.environment-name }}
        run: |
          mkdir -p web/public/tests/accessibility
          npm run accessibility:axe-wcag22-${{ needs.names.outputs.environment-name }} -- \
            --save web/public/tests/accessibility/axe-wcag22-results.json
        continue-on-error: true
      - uses: actions/upload-artifact@v7
        with:
          name: axe-wcag22-results
          path: web/public/tests/accessibility/axe-wcag22-results.json
          retention-days: 7
          if-no-files-found: ignore

  accessibility-lighthouse:
    name: Lighthouse
    needs: [names]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'
      - run: timeout 120 npm ci --prefer-offline || { sleep 30; timeout 180 npm ci; }
        timeout-minutes: 6
        env:
          NPM_CONFIG_FETCH_RETRIES: "3"
      - name: Run accessibility:lighthouse-${{ needs.names.outputs.environment-name }}
        run: npm run accessibility:lighthouse-${{ needs.names.outputs.environment-name }}
        continue-on-error: true

  # Penetration checks (run in parallel)
  penetration-eslint:
    name: ESLint Security
    needs: [names]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'
      - run: timeout 120 npm ci --prefer-offline || { sleep 30; timeout 180 npm ci; }
        timeout-minutes: 6
        env:
          NPM_CONFIG_FETCH_RETRIES: "3"
      - name: Run penetration:eslint
        run: npm run penetration:eslint
        continue-on-error: true

  penetration-audit:
    name: npm audit
    needs: [names]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'
      - run: timeout 120 npm ci --prefer-offline || { sleep 30; timeout 180 npm ci; }
        timeout-minutes: 6
        env:
          NPM_CONFIG_FETCH_RETRIES: "3"
      - name: Run penetration:audit
        run: npm run penetration:audit
        continue-on-error: true

  penetration-retire:
    name: retire.js
    needs: [names]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'
      - run: timeout 120 npm ci --prefer-offline || { sleep 30; timeout 180 npm ci; }
        timeout-minutes: 6
        env:
          NPM_CONFIG_FETCH_RETRIES: "3"
      - name: Run penetration:retire
        run: npm run penetration:retire
        continue-on-error: true

  penetration-zap:
    name: OWASP ZAP
    needs: [names]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'
      - run: timeout 120 npm ci --prefer-offline || { sleep 30; timeout 180 npm ci; }
        timeout-minutes: 6
        env:
          NPM_CONFIG_FETCH_RETRIES: "3"
      - name: Run penetration:zap-${{ needs.names.outputs.environment-name }}
        run: npm run penetration:zap-${{ needs.names.outputs.environment-name }}
        continue-on-error: true

  # Accessibility and fraud-prevention-header findings into the analytics lake, for the
  # one-stop dashboard's compliance panel (v_compliance_status)
  compliance-lake:
    name: Compliance findings into the lake
    needs: [params, names, accessibility-pa11y, accessibility-axe, accessibility-axe-wcag22]
    if: always()
    runs-on: ubuntu-latest
    environment: ${{ needs.params.outputs.github-environment }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'
      - run: timeout 120 npm ci --prefer-offline || { sleep 30; timeout 180 npm ci; }
        timeout-minutes: 6
        env:
          NPM_CONFIG_FETCH_RETRIES: "3"

      - name: Download accessibility results
        uses: actions/download-artifact@v7
        with:
          path: web/public/tests/accessibility
          pattern: '*-results'
          merge-multiple: true

      - name: Configure AWS role via GitHub OIDC
        uses: aws-actions/configure-aws-credentials@v6
        with:
          role-to-assume: ${{ vars.SUBMIT_ACTIONS_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}
          role-chaining: false
          audience: sts.amazonaws.com
          role-skip-session-tagging: true
          output-credentials: true
          retry-max-attempts: 3

      - name: Assume AWS deployment role
        uses: aws-actions/configure-aws-credentials@v6
        with:
          role-to-assume: ${{ vars.SUBMIT_DEPLOY_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}
          role-chaining: true
          audience: sts.amazonaws.com
          role-skip-session-tagging: true
          output-credentials: true
          retry-max-attempts: 3

      - name: Compute the checked-at timestamp and the lake bucket
        id: config
        run: |
          echo "checked-at=$(date -u +%FT%TZ)" | tee -a "$GITHUB_OUTPUT"
          echo "dt=$(date -u +%F)" | tee -a "$GITHUB_OUTPUT"
          echo "lake-bucket=${{ needs.names.outputs.environment-name }}-env-analytics-lake-${{ vars.SUBMIT_ACCOUNT_ID }}" | tee -a "$GITHUB_OUTPUT"

      - name: Build the accessibility rows
        id: build-accessibility-rows
        run: |
          {
            echo "rows<<ROWSEOF"
            node scripts/compliance-accessibility-rows.js "${{ needs.names.outputs.environment-name }}" "${{ steps.config.outputs.checked-at }}"
            echo "ROWSEOF"
          } >> "$GITHUB_OUTPUT"

      - name: Write the accessibility rows to the lake
        if: steps.build-accessibility-rows.outputs.rows != ''
        uses: ./.github/actions/dora-row
        with:
          bucket: ${{ steps.config.outputs.lake-bucket }}
          key: "curated/compliance/accessibility/dt=${{ steps.config.outputs.dt }}/${{ github.run_id }}.json"
          row: ${{ steps.build-accessibility-rows.outputs.rows }}

      - name: Build the fraud-prevention-header rows
        id: build-fraud-header-rows
        run: |
          {
            echo "rows<<ROWSEOF"
            node scripts/compliance-fraud-headers-rows.js "${{ steps.config.outputs.checked-at }}"
            echo "ROWSEOF"
          } >> "$GITHUB_OUTPUT"

      - name: Write the fraud-prevention-header rows to the lake
        if: steps.build-fraud-header-rows.outputs.rows != ''
        uses: ./.github/actions/dora-row
        with:
          bucket: ${{ steps.config.outputs.lake-bucket }}
          key: "curated/compliance/fraud-headers/dt=${{ steps.config.outputs.dt }}/${{ github.run_id }}.json"
          row: ${{ steps.build-fraud-header-rows.outputs.rows }}

  # Final compliance report (runs after all checks complete)
  compliance-report:
    name: Generate Compliance Report
    needs: [names]
    if: always()
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'

      - name: Install dependencies
        run: timeout 120 npm ci --prefer-offline || { sleep 30; timeout 180 npm ci; }
        timeout-minutes: 6
        env:
          NPM_CONFIG_FETCH_RETRIES: "3"

      - name: Run compliance:${{ needs.names.outputs.environment-name }}-report-md
        run: npm run compliance:${{ needs.names.outputs.environment-name }}-report-md
        continue-on-error: true

      - name: List generated reports
        run: |
          echo "Penetration reports:"
          ls -la web/public/tests/penetration/ || echo "No penetration reports"
          echo "Accessibility reports:"
          ls -la web/public/tests/accessibility/ || echo "No accessibility reports"
          echo "Compliance report:"
          ls -la REPORT_ACCESSIBILITY_PENETRATION.md || echo "No compliance report"

      - name: Upload compliance reports
        uses: actions/upload-artifact@v7
        with:
          name: compliance-reports
          path: |
            web/public/tests/penetration/
            web/public/tests/accessibility/
            REPORT_ACCESSIBILITY_PENETRATION.md
          retention-days: 90

      - name: Generate GitHub summary
        run: |
          echo "# Compliance Scan Summary" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "**Date**: $(date -u '+%Y-%m-%d %H:%M:%S UTC')" >> $GITHUB_STEP_SUMMARY
          echo "**Environment**: ${{ needs.names.outputs.environment-name }}" >> $GITHUB_STEP_SUMMARY
          echo "**Target**: ${{ needs.names.outputs.apex-url }}" >> $GITHUB_STEP_SUMMARY
          echo "**Branch**: ${{ github.ref_name }}" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY

          if [ -f web/public/tests/penetration/npm-audit.json ]; then
            echo "## npm Audit Summary" >> $GITHUB_STEP_SUMMARY
            AUDIT=$(cat web/public/tests/penetration/npm-audit.json)
            echo "- Critical: $(echo "$AUDIT" | jq -r '.metadata.vulnerabilities.critical // 0')" >> $GITHUB_STEP_SUMMARY
            echo "- High: $(echo "$AUDIT" | jq -r '.metadata.vulnerabilities.high // 0')" >> $GITHUB_STEP_SUMMARY
            echo "- Moderate: $(echo "$AUDIT" | jq -r '.metadata.vulnerabilities.moderate // 0')" >> $GITHUB_STEP_SUMMARY
            echo "- Low: $(echo "$AUDIT" | jq -r '.metadata.vulnerabilities.low // 0')" >> $GITHUB_STEP_SUMMARY
            echo "" >> $GITHUB_STEP_SUMMARY
          fi

          if [ -f web/public/tests/accessibility/axe-results.json ]; then
            echo "## axe-core Summary" >> $GITHUB_STEP_SUMMARY
            VIOLATIONS=$(jq '[.[].violations | length] | add // 0' web/public/tests/accessibility/axe-results.json)
            PASSES=$(jq '[.[].passes | length] | add // 0' web/public/tests/accessibility/axe-results.json)
            echo "- Violations: $VIOLATIONS" >> $GITHUB_STEP_SUMMARY
            echo "- Passes: $PASSES" >> $GITHUB_STEP_SUMMARY
            echo "" >> $GITHUB_STEP_SUMMARY
          fi

          if [ -f web/public/tests/penetration/zap-report.json ]; then
            echo "## ZAP Scan Summary" >> $GITHUB_STEP_SUMMARY
            echo "ZAP report generated" >> $GITHUB_STEP_SUMMARY
            echo "" >> $GITHUB_STEP_SUMMARY
          fi

          echo "## Reports Generated" >> $GITHUB_STEP_SUMMARY
          echo "- ESLint security, npm audit, retire.js" >> $GITHUB_STEP_SUMMARY
          echo "- Pa11y, axe-core (WCAG 2.1 + 2.2), Lighthouse accessibility" >> $GITHUB_STEP_SUMMARY
          echo "- OWASP ZAP baseline scan" >> $GITHUB_STEP_SUMMARY
          echo "- Consolidated REPORT_ACCESSIBILITY_PENETRATION.md" >> $GITHUB_STEP_SUMMARY
