# @capability OPS-28 Enforce commit identity allowlist
# - **Use when:** a PR's commit authorship must be checked against the allowed identity list.
# - **Does:** identity-guard.yml checks, on every PR, that all commit authors' email addresses appear in allowed-commit-identities.yml. It rejects commits from unrecognised identities.
# - **Run:** no command; see Does and Entry
# - **Entry:** `.github/workflows/identity-guard.yml`
# - **Files:** .github/allowed-commit-identities.yml, .github/workflows/identity-guard.yml
# - **Keywords:** identity guard, commit identity, allowlist, author email, unrecognised identity
# - **Related:** OPS-29
# @end-capability

name: identity-guard
run-name: "identity guard for PR #${{ github.event.pull_request.number }}"

# Stops a repeat of the spreadsheets `noreply@anthropic.com` commits: a
# sub-agent set a git identity inline with nothing to catch it, and 20
# commits landed on main authored by a third party's GitHub account. This
# check reads every commit added by a pull request and fails the run if any
# author email is not on the allow-list in .github/allowed-commit-identities.yml.

on:
  pull_request:
    types: [opened, synchronize, reopened]

permissions:
  contents: read

jobs:
  check-authors:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0

      - name: Check commit authors against the allow-list
        run: scripts/check-commit-identities.sh "${{ github.event.pull_request.base.sha }}" "${{ github.event.pull_request.head.sha }}"
