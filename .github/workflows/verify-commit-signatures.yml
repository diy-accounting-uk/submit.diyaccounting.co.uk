name: verify-commit-signatures
run-name: "Commit signature check for PR #${{ github.event.pull_request.number }}"

# Fails when any commit on a PR lacks a verified signature
# (commit.verification.verified from the GitHub API), which is the only proof
# that the author field is not a self-asserted string. Workflow commits go
# through the GitHub API as the agent app (scripts/github-api-commit.sh), so
# GitHub signs them. An unsigned push still lands on its branch; only this PR
# check goes red. The job is a required status check on the main ruleset.

on:
  pull_request:
    types: [opened, synchronize, reopened]

concurrency:
  group: verify-commit-signatures-${{ github.event.pull_request.number }}
  cancel-in-progress: true

permissions:
  contents: read
  pull-requests: read

jobs:
  verify:
    name: Check commit signatures
    runs-on: ubuntu-24.04
    steps:
      - name: Report verification status of each commit
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
        run: |
          set -euo pipefail

          commits=$(gh api "repos/${REPO}/pulls/${PR_NUMBER}/commits" --paginate)
          total=$(echo "$commits" | jq 'length')
          unverified=$(echo "$commits" | jq '[.[] | select(.commit.verification.verified == false)] | length')

          echo "$commits" \
            | jq -r '.[] | [.sha[0:8], .commit.author.name, .commit.verification.verified, .commit.verification.reason] | @tsv' \
            > commit-verification.tsv

          {
            echo "### Commit signatures"
            echo
            echo "${unverified} of ${total} commits on this PR are not verified."
            echo
            echo '```'
            echo -e "sha\tauthor\tverified\treason"
            cat commit-verification.tsv
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

          if [ "$unverified" -gt 0 ]; then
            echo "::error::${unverified} of ${total} commits on this PR are not signed and verified. Sign commits with the registered SSH key, or commit through the GitHub API as the agent app."
            exit 1
          fi
