name: verify-commit-signatures
run-name: "Commit signature check for PR #${{ github.event.pull_request.number }}"

# Fails when any commit on a PR lacks a verified signature
# (commit.verification.verified from the GitHub API), which is the only proof
# that the author field is not a self-asserted string. See REPORT_GIT_CONFIG.md.
#
# Commits authored by github-actions[bot] are exempt: publish.yml's version bump
# and the alarm-triage PRs are made by the runner, which has no signing key.
# An unsigned push still lands on its branch; only this PR check goes red.
# The job is a required status check on the main ruleset.

on:
  pull_request:
    types: [opened, synchronize, reopened]

concurrency:
  group: verify-commit-signatures-${{ github.event.pull_request.number }}
  cancel-in-progress: true

permissions:
  contents: read
  pull-requests: read

jobs:
  verify:
    name: Check commit signatures
    runs-on: ubuntu-24.04
    steps:
      - name: Report verification status of each commit
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
        run: |
          set -euo pipefail

          commits=$(gh api "repos/${REPO}/pulls/${PR_NUMBER}/commits" --paginate)
          total=$(echo "$commits" | jq 'length')
          is_bot='(.commit.author.name == "github-actions[bot]" or .author.login == "github-actions[bot]")'
          unverified=$(echo "$commits" | jq "[.[] | select(.commit.verification.verified == false and (${is_bot} | not))] | length")
          exempt=$(echo "$commits" | jq "[.[] | select(.commit.verification.verified == false and ${is_bot})] | length")

          echo "$commits" \
            | jq -r '.[] | [.sha[0:8], .commit.author.name, .commit.verification.verified, .commit.verification.reason] | @tsv' \
            > commit-verification.tsv

          {
            echo "### Commit signatures"
            echo
            echo "${unverified} of ${total} commits on this PR are not verified (${exempt} unsigned github-actions[bot] commits exempt)."
            echo
            echo '```'
            echo -e "sha\tauthor\tverified\treason"
            cat commit-verification.tsv
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

          if [ "$unverified" -gt 0 ]; then
            echo "::error::${unverified} of ${total} commits on this PR are not signed and verified. Sign commits with the registered SSH key (REPORT_GIT_CONFIG.md); only github-actions[bot] commits are exempt."
            exit 1
          fi
