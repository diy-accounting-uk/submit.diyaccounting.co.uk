name: alarm-triage
run-name: "alarm triage for #${{ inputs.issue-number || github.event.issue.number }}"

# This workflow carries contents:write and pull-requests:write so it can open a draft PR when
# the triage agent names a change it is confident in. That surface is acceptable here: the issue
# that triggers this workflow is opened by our own alarm-to-issue Lambda, not by a member of the
# public, and the only text this workflow ever turns into a branch is a diff the triage agent
# wrote inside its own answer (see prompts/alarm-triage.md) - the same answer that already passed
# the regex deny-list and the Bedrock guardrail before it was posted as the issue comment. The
# alarm reason string CloudWatch composes and whatever the agent reads from logs and traces are
# treated as data throughout, never as instructions.

on:
  issues:
    types: [opened]
  workflow_dispatch:
    inputs:
      issue-number:
        description: the alarm issue to triage again
        required: true
        type: string

permissions:
  id-token: write
  contents: write
  issues: write
  pull-requests: write
  actions: read

concurrency:
  group: alarm-triage
  cancel-in-progress: false

env:
  NODE_VERSION: '24'
  AWS_REGION: 'eu-west-2'
  CLAUDE_CODE_VERSION: '2.0.30'
  # The one place this number is written. The budget guard, its step name and its skip
  # comment all read it, so the three cannot drift apart the way -gt 3 and "budget of 3" did.
  TRIAGE_BUDGET_PER_DAY: '8'

jobs:
  triage:
    if: github.event_name == 'workflow_dispatch' || contains(github.event.issue.labels.*.name, 'alarm')
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: Stop once ${{ env.TRIAGE_BUDGET_PER_DAY }} triage runs have already posted a result today
        id: budget-guard
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          SINCE=$(date -u -d '24 hours ago' +%Y-%m-%dT%H:%M:%SZ)
          # Both opened and workflow_dispatch events start a run, including the ones this guard or
          # the role check stops, so counting every run that merely started would let a burst of
          # skips (this guard, the role check, a verify-alarm-origin miss) exhaust the budget
          # without a single alarm actually being looked at. A run only counts once it has posted
          # a result: "Comment the triage" is the last step of run-triage and only reaches success
          # when a comment actually went on the issue, so its per-step conclusion (not the job's
          # overall conclusion) is the only signal that distinguishes a triaged run from a skipped
          # one.
          COUNT=0
          for RUN_ID in $(gh api \
            "repos/${{ github.repository }}/actions/workflows/alarm-triage.yml/runs?created=%3E${SINCE}&per_page=100" \
            --jq '.workflow_runs[].id'); do
            if [ "${RUN_ID}" = "${{ github.run_id }}" ]; then continue; fi
            POSTED=$(gh api "repos/${{ github.repository }}/actions/runs/${RUN_ID}/jobs" \
              --jq '.jobs[] | select(.name == "run-triage") | .steps[]? | select(.name == "Comment the triage") | .conclusion // empty')
            if [ "${POSTED}" = "success" ]; then
              COUNT=$((COUNT + 1))
            fi
          done
          echo "triage runs that posted a result in the last 24 hours: ${COUNT}"
          echo "count=${COUNT}" | tee -a "$GITHUB_OUTPUT"
          echo "since=${SINCE}" | tee -a "$GITHUB_OUTPUT"
          if [ "${COUNT}" -gt $(( ${{ env.TRIAGE_BUDGET_PER_DAY }} - 1 )) ]; then
            echo "proceed=false" | tee -a "$GITHUB_OUTPUT"
          else
            echo "proceed=true" | tee -a "$GITHUB_OUTPUT"
          fi

      # The budget guard ends this job green with no comment when it skips, which is why #173
      # (2026-09-10) was closed unread: nothing on the issue said triage had not looked at it.
      - name: Comment that triage was skipped
        if: steps.budget-guard.outputs.proceed == 'false'
        env:
          GH_TOKEN: ${{ github.token }}
          ISSUE_NUMBER: ${{ inputs.issue-number || github.event.issue.number }}
          TRIAGE_COUNT: ${{ steps.budget-guard.outputs.count }}
          TRIAGE_SINCE: ${{ steps.budget-guard.outputs.since }}
        run: |
          set -euo pipefail
          gh issue comment "$ISSUE_NUMBER" --repo "${{ github.repository }}" --body "Alarm triage was skipped: the budget of ${{ env.TRIAGE_BUDGET_PER_DAY }} triage runs per 24 hours is already used (${TRIAGE_COUNT} posted a result since ${TRIAGE_SINCE}). Nobody has looked at this alarm yet."

      - name: Read the alarm out of the issue body
        if: steps.budget-guard.outputs.proceed == 'true'
        id: alarm
        env:
          ISSUE_BODY: ${{ github.event.issue.body }}
          ISSUE_NUMBER: ${{ inputs.issue-number || github.event.issue.number }}
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          if [ -z "$ISSUE_BODY" ]; then ISSUE_BODY=$(gh issue view "$ISSUE_NUMBER" --repo "${{ github.repository }}" --json body -q .body); fi
          ALARM_NAME=$(printf '%s' "$ISSUE_BODY" | sed -n 's/^\*\*Alarm:\*\* //p' | head -1)
          TIMESTAMP=$(printf '%s' "$ISSUE_BODY" | sed -n 's/^\*\*Timestamp:\*\* //p' | head -1)
          REGION=$(printf '%s' "$ISSUE_BODY" | sed -n 's/^\*\*Region:\*\* //p' | head -1)
          DEPLOYMENT=$(printf '%s' "$ISSUE_BODY" | sed -n 's/^\*\*Deployment:\*\* //p' | head -1)
          WINDOW=$(printf '%s' "$ISSUE_BODY" | sed -n 's/^\*\*Window:\*\* //p' | head -1)
          case "$ALARM_NAME" in
            prod-*) ENV_NAME=prod ;;
            ci-*)   ENV_NAME=ci ;;
            *)      echo "alarm name has no environment prefix: $ALARM_NAME"; exit 1 ;;
          esac
          {
            echo "alarm-name=${ALARM_NAME}"
            echo "timestamp=${TIMESTAMP}"
            echo "region=${REGION:-eu-west-2}"
            echo "deployment=${DEPLOYMENT}"
            echo "window=${WINDOW}"
            echo "environment-name=${ENV_NAME}"
          } | tee -a "$GITHUB_OUTPUT"
    outputs:
      proceed: ${{ steps.budget-guard.outputs.proceed }}
      alarm-name: ${{ steps.alarm.outputs.alarm-name }}
      timestamp: ${{ steps.alarm.outputs.timestamp }}
      region: ${{ steps.alarm.outputs.region }}
      deployment: ${{ steps.alarm.outputs.deployment }}
      window: ${{ steps.alarm.outputs.window }}
      environment-name: ${{ steps.alarm.outputs.environment-name }}

  run-triage:
    needs: triage
    if: needs.triage.outputs.proceed == 'true'
    runs-on: ubuntu-24.04
    # Two agent passes can run in this job: the Haiku first pass, and the Sonnet escalation
    # when Haiku's answer is unusable or unsure. The longest single pass observed is 155s, so
    # 20 minutes covers two worst-case passes plus the AWS/npm setup steps that run once.
    timeout-minutes: 20
    environment: ${{ needs.triage.outputs.environment-name }}
    env:
      ENV_NAME: ${{ needs.triage.outputs.environment-name }}
      ALARM_NAME: ${{ needs.triage.outputs.alarm-name }}
      ALARM_REGION: ${{ needs.triage.outputs.region }}
      ALARM_WINDOW: ${{ needs.triage.outputs.window }}
      DEPLOYMENT_NAME: ${{ needs.triage.outputs.deployment }}
      ISSUE_NUMBER: ${{ inputs.issue-number || github.event.issue.number }}
      MODEL_ID: 'eu.anthropic.claude-sonnet-4-5-20250929-v1:0'
      HAIKU_MODEL_ID: 'eu.anthropic.claude-haiku-4-5-20251001-v1:0'
      RUN_URL: '${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}'
    steps:
      # The triage role is created by the environment's CDK deploy and its ARN is set on the
      # GitHub Environment by hand afterwards, so an alarm that arrives before that is a quiet
      # no-op here rather than a failed run.
      - name: Stop when the triage role is not configured for this environment
        id: role
        env:
          TRIAGE_ROLE_ARN: ${{ vars.SUBMIT_ALARM_TRIAGE_ROLE_ARN }}
        run: |
          if [ -z "${TRIAGE_ROLE_ARN}" ]; then
            echo "SUBMIT_ALARM_TRIAGE_ROLE_ARN is not set on the ${ENV_NAME} environment, so triage waits" | tee -a "$GITHUB_STEP_SUMMARY"
            echo "configured=false" | tee -a "$GITHUB_OUTPUT"
          else
            echo "configured=true" | tee -a "$GITHUB_OUTPUT"
          fi

      - name: Checkout
        if: steps.role.outputs.configured == 'true'
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Set up Node
        if: steps.role.outputs.configured == 'true'
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: ${{ env.NODE_VERSION }}

      - name: Configure AWS role via GitHub OIDC
        if: steps.role.outputs.configured == 'true'
        uses: aws-actions/configure-aws-credentials@e1253824e5c10ff9df46874f81ed3ec929e19cfd # v6
        with:
          role-to-assume: ${{ vars.SUBMIT_ACTIONS_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}
          role-chaining: false
          audience: sts.amazonaws.com
          role-skip-session-tagging: true
          output-credentials: true
          retry-max-attempts: 3

      - name: Assume the read-only alarm triage role
        if: steps.role.outputs.configured == 'true'
        uses: aws-actions/configure-aws-credentials@e1253824e5c10ff9df46874f81ed3ec929e19cfd # v6
        with:
          role-to-assume: ${{ vars.SUBMIT_ALARM_TRIAGE_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}
          role-chaining: true
          audience: sts.amazonaws.com
          role-skip-session-tagging: true
          output-credentials: true
          retry-max-attempts: 3

      - name: Stop when the agent kill switch is on
        if: steps.role.outputs.configured == 'true'
        uses: ./.github/actions/agent-kill-switch
        with:
          environment-name: ${{ env.ENV_NAME }}

      - name: Read the guardrail identifiers
        if: steps.role.outputs.configured == 'true'
        id: guardrail
        run: |
          set -euo pipefail
          aws ssm get-parameter --name "/submit/${ENV_NAME}/alarm-triage/guardrail-id" \
            --query 'Parameter.Value' --output text | tee /tmp/guardrail-id.txt
          aws ssm get-parameter --name "/submit/${ENV_NAME}/alarm-triage/guardrail-version" \
            --query 'Parameter.Value' --output text | tee /tmp/guardrail-version.txt
          echo "id=$(cat /tmp/guardrail-id.txt)" | tee -a "$GITHUB_OUTPUT"
          echo "version=$(cat /tmp/guardrail-version.txt)" | tee -a "$GITHUB_OUTPUT"

      - name: Install dependencies
        if: steps.role.outputs.configured == 'true'
        run: timeout 120 npm ci --prefer-offline || { sleep 30; timeout 180 npm ci; }

      # The only gate this pipeline can safely use before spending an agent run and posting to
      # the issue: re-read CloudWatch's own alarm history for the exact name and window the
      # issue body claims. An issue whose claimed alarm or window cannot be confirmed fails this
      # step, and the job stops here with no triage run, no comment, no draft PR.
      - name: Verify the alarm actually fired
        if: steps.role.outputs.configured == 'true'
        run: |
          node scripts/verify-alarm-origin.mjs \
            --alarm-name "$ALARM_NAME" --window "$ALARM_WINDOW" --region "$ALARM_REGION"

      - name: Resolve the evidence links for this alarm
        if: steps.role.outputs.configured == 'true'
        run: |
          set -o pipefail
          node scripts/resolve-alarm-evidence.mjs \
            --alarm-name "$ALARM_NAME" --deployment "$DEPLOYMENT_NAME" \
            --region "$ALARM_REGION" --from-alarm \
            2>&1 | tee /tmp/evidence.json

      # The agent has answered "without being able to query CloudWatch Logs" without making one
      # aws call (#229, run 35030341835). So the same credentials it will hold make the three calls
      # here first, and the results (or the exact errors) go into the evidence file for the prompt
      # to quote: an agent told "these calls worked a moment ago" has no room to assume otherwise.
      - name: Prove the triage credentials against the alarm's telemetry
        if: steps.role.outputs.configured == 'true'
        run: |
          set -o pipefail
          proof() {
            # $1 the key, the rest the command; success stores the JSON answer, failure the error text
            local key="$1"; shift
            if out=$("$@" 2>&1); then
              printf '%s' "$out" | jq -c --arg key "$key" '{($key): .}' > "/tmp/proof-${key}.json"
            else
              jq -nc --arg key "$key" --arg error "$out" '{($key): {error: $error}}' > "/tmp/proof-${key}.json"
            fi
          }
          WINDOW_START=$(printf '%s' "$ALARM_WINDOW" | sed -E 's/^([^ ]+) to .*/\1/')
          WINDOW_END=$(printf '%s' "$ALARM_WINDOW" | sed -E 's/^[^ ]+ to ([^ ]+).*/\1/')
          LOG_GROUP_PREFIX=$(jq -r '.logGroupNamePrefixes[0] // empty' /tmp/evidence.json)
          proof identity aws sts get-caller-identity --output json
          proof logGroups aws logs describe-log-groups --region "$ALARM_REGION" \
            --log-group-name-prefix "${LOG_GROUP_PREFIX:-/aws/lambda/${DEPLOYMENT_NAME}}" \
            --query 'logGroups[].{name:logGroupName,retentionInDays:retentionInDays}' --output json
          proof alarmHistory aws cloudwatch describe-alarm-history --region "$ALARM_REGION" \
            --alarm-name "$ALARM_NAME" --history-item-type StateUpdate \
            --start-date "$WINDOW_START" --end-date "$WINDOW_END" \
            --query 'AlarmHistoryItems[].{at:Timestamp,summary:HistorySummary}' --output json
          jq -s '.[0] + {credentialProof: (.[1] + .[2] + .[3] + {provedAt: (now | todate)})}' \
            /tmp/evidence.json /tmp/proof-identity.json /tmp/proof-logGroups.json /tmp/proof-alarmHistory.json \
            > /tmp/evidence.proved.json
          mv /tmp/evidence.proved.json /tmp/evidence.json
          jq '.credentialProof' /tmp/evidence.json | tee -a "$GITHUB_STEP_SUMMARY"

      - name: Install Claude Code
        if: steps.role.outputs.configured == 'true'
        run: npm install -g "@anthropic-ai/claude-code@${CLAUDE_CODE_VERSION}"

      - name: Run triage (Haiku)
        if: steps.role.outputs.configured == 'true'
        uses: ./.github/actions/run-triage-agent
        with:
          model-id: ${{ env.HAIKU_MODEL_ID }}
          small-fast-model-id: ${{ env.HAIKU_MODEL_ID }}
          output-file: /tmp/triage.haiku.json

      # Escalates to Sonnet when Haiku's pass is unusable (no result, an error, the turn budget
      # spent) or unsure (it answered "Is it still broken?" with an admission it could not tell).
      # Every other case accepts Haiku's answer as final.
      - name: Judge the first pass
        if: steps.role.outputs.configured == 'true'
        id: judge
        run: |
          set -euo pipefail
          ESCALATE=false
          REASON=""
          if [ ! -s /tmp/triage.haiku.json ]; then
            ESCALATE=true
            REASON="the Haiku pass produced no result file"
          elif jq -e '.is_error == true' /tmp/triage.haiku.json > /dev/null 2>&1; then
            ESCALATE=true
            REASON="the Haiku pass reported is_error"
          elif jq -e '.subtype == "error_max_turns"' /tmp/triage.haiku.json > /dev/null 2>&1; then
            ESCALATE=true
            REASON="the Haiku pass used its turn budget before finishing"
          elif ! jq -e '.result | length > 0' /tmp/triage.haiku.json > /dev/null 2>&1; then
            ESCALATE=true
            REASON="the Haiku pass returned an empty result"
          else
            RESULT_TEXT=$(jq -r '.result' /tmp/triage.haiku.json)
            if printf '%s' "$RESULT_TEXT" | grep -qiE 'unable to determine|cannot determine|could not determine|insufficient evidence|without querying'; then
              ESCALATE=true
              REASON="the Haiku pass could not say whether the alarm is still broken"
            fi
          fi
          echo "escalate=${ESCALATE}" | tee -a "$GITHUB_OUTPUT"
          echo "reason=${REASON}" >> "$GITHUB_OUTPUT"
          {
            echo "alarm triage first pass: escalate=${ESCALATE}"
            [ -n "${REASON}" ] && echo "reason: ${REASON}"
          } | tee -a "$GITHUB_STEP_SUMMARY"

      - name: Run triage (Sonnet)
        if: steps.role.outputs.configured == 'true' && steps.judge.outputs.escalate == 'true'
        uses: ./.github/actions/run-triage-agent
        with:
          model-id: ${{ env.MODEL_ID }}
          small-fast-model-id: ${{ env.HAIKU_MODEL_ID }}
          output-file: /tmp/triage.sonnet.json

      # Sonnet's answer stands when it ran; otherwise Haiku's does. Every step below this one
      # (the usable-result gate, redaction, guardrail, comment, draft PR) reads /tmp/triage.json
      # and does not know or care which model produced it.
      - name: Select the triage result
        if: steps.role.outputs.configured == 'true'
        id: select-result
        env:
          SONNET_MODEL_ID: ${{ env.MODEL_ID }}
          HAIKU_MODEL_ID: ${{ env.HAIKU_MODEL_ID }}
        run: |
          set -euo pipefail
          if [ -s /tmp/triage.sonnet.json ]; then
            cp /tmp/triage.sonnet.json /tmp/triage.json
            echo "model=sonnet" | tee -a "$GITHUB_OUTPUT"
            echo "model-id=${SONNET_MODEL_ID}" | tee -a "$GITHUB_OUTPUT"
          else
            cp /tmp/triage.haiku.json /tmp/triage.json
            echo "model=haiku" | tee -a "$GITHUB_OUTPUT"
            echo "model-id=${HAIKU_MODEL_ID}" | tee -a "$GITHUB_OUTPUT"
          fi

      - name: Require a usable result
        if: steps.role.outputs.configured == 'true'
        id: triage-run
        run: |
          set -o pipefail
          # A run that stopped early (max-turns, a denied tool, an entitlement error from
          # Bedrock) can still exit 0 with a JSON result that carries no usable answer. Gate on
          # the content, not just the exit code, so every failure shape - including the AWS
          # Marketplace entitlement error an environment without the Anthropic model agreement
          # gets back from Bedrock - fails this step with the reason on record, instead of
          # falling through to be posted as a comment.
          #
          # error_max_turns is the one shape that still gets posted: the redaction script already
          # turns it (and any partial `.result` text it carries) into a comment, so this step lets
          # the later Filter/guardrail/Comment steps run and only records that the turn budget was
          # the reason, leaving "Fail the run when triage stopped early" (the job's last step) to
          # put the run back into red once the comment is on the issue.
          if jq -e '.subtype == "success" and (.is_error | not) and (.result | length > 0)' /tmp/triage.json > /dev/null; then
            echo "stopped=false" | tee -a "$GITHUB_OUTPUT"
          elif jq -e '.subtype == "error_max_turns"' /tmp/triage.json > /dev/null; then
            echo "triage used its 60-turn budget before finishing; posting whatever partial answer it produced" \
              | tee -a "$GITHUB_STEP_SUMMARY"
            echo "stopped=max_turns" | tee -a "$GITHUB_OUTPUT"
          else
            echo "triage produced no answer:" | tee -a "$GITHUB_STEP_SUMMARY"
            head -c 2000 /tmp/triage.json | tee -a "$GITHUB_STEP_SUMMARY"
            exit 1
          fi

      - name: Filter the output
        if: steps.role.outputs.configured == 'true'
        id: filter
        run: |
          set -o pipefail
          node scripts/redact-triage-output.mjs /tmp/triage.json 2>&1 | tee /tmp/triage-comment.md || {
            echo "redaction failed, see the log above" | tee -a "$GITHUB_STEP_SUMMARY"
            exit 1
          }
          echo "redactions=$(wc -l < /tmp/redactions.txt)" | tee -a "$GITHUB_OUTPUT"

      - name: Apply the Bedrock guardrail
        if: steps.role.outputs.configured == 'true'
        id: guardrail-check
        run: |
          set -euo pipefail
          jq -Rs '[{ text: { text: . } }]' /tmp/triage-comment.md > /tmp/guardrail-input.json
          aws bedrock-runtime apply-guardrail \
            --guardrail-identifier "${{ steps.guardrail.outputs.id }}" \
            --guardrail-version "${{ steps.guardrail.outputs.version }}" \
            --source OUTPUT \
            --content file:///tmp/guardrail-input.json \
            2>&1 | tee /tmp/guardrail-result.json
          ACTION=$(jq -r '.action' /tmp/guardrail-result.json)
          echo "action=${ACTION}" | tee -a "$GITHUB_OUTPUT"

      # The guardrail's entities and regexes are all ANONYMIZE (see ObservabilityStack.java), so
      # GUARDRAIL_INTERVENED here means a hit was masked, never that the text was withheld. The
      # anonymised text is in outputs[0].text; the untouched text is what the redaction script
      # already wrote when the guardrail found nothing to mask.
      - name: Note when the guardrail anonymised the comment
        if: steps.role.outputs.configured == 'true'
        run: |
          set -euo pipefail
          if [ "${{ steps.guardrail-check.outputs.action }}" = "NONE" ]; then
            cp /tmp/triage-comment.md /tmp/final-comment.md
          else
            {
              echo "_The guardrail anonymised part of this comment before it was posted._"
              echo
              jq -r '.outputs[0].text' /tmp/guardrail-result.json
            } > /tmp/final-comment.md
          fi

      # The diff, if any, is a fenced ```diff block inside the comment just built, so it has
      # already passed the same deny-list and guardrail as the rest of the answer. This step
      # never reads the agent's raw output directly, and it runs before the comment is posted so
      # the comment can link to the PR it opened.
      - name: Open a draft PR when triage named a change
        if: steps.role.outputs.configured == 'true'
        id: draft-pr
        env:
          GH_TOKEN: ${{ github.token }}
          ANSWERING_MODEL_ID: ${{ steps.select-result.outputs.model-id }}
        run: |
          set -euo pipefail
          awk '/^```diff$/ { flag=1; next } /^```$/ { if (flag) exit } flag' /tmp/final-comment.md > triage-change.patch
          if [ ! -s triage-change.patch ]; then
            echo "no diff block in the triage answer, nothing to open a PR for"
            rm -f triage-change.patch
            exit 0
          fi
          if ! git apply --check triage-change.patch 2>/tmp/git-apply-check.log; then
            echo "the proposed change does not apply cleanly, skipping the draft PR"
            cat /tmp/git-apply-check.log
            rm -f triage-change.patch
            exit 0
          fi
          BRANCH="claude/triage-${ISSUE_NUMBER}"
          git switch -c "$BRANCH"
          git apply triage-change.patch
          rm triage-change.patch
          git add -A
          # Unattended-run attribution: Co-Authored-By and Claude-Model are the same trailers a
          # terminal session writes; Claude-Run replaces Claude-Session because nobody is watching
          # this run (see CLAUDE.md, "Commit attribution"). printf, not a quoted multi-line
          # string, so the trailer lines land at column 0 rather than inheriting this script's
          # indentation.
          COMMIT_MSG=$(printf 'Alarm triage for #%s: %s\n\nCo-Authored-By: Claude <noreply@anthropic.com>\nClaude-Model: %s\nClaude-Run: %s' \
            "$ISSUE_NUMBER" "$ALARM_NAME" "$ANSWERING_MODEL_ID" "$RUN_URL")
          git -c user.name='github-actions[bot]' -c user.email='github-actions[bot]@users.noreply.github.com' \
            commit -m "$COMMIT_MSG"
          git push origin "$BRANCH"
          PR_BODY=$(printf 'Draft from the alarm-triage workflow for #%s. Not reviewed by a human. Closes nothing.\n\nCo-Authored-By: Claude <noreply@anthropic.com>\nClaude-Model: %s\nClaude-Run: %s' \
            "$ISSUE_NUMBER" "$ANSWERING_MODEL_ID" "$RUN_URL")
          PR_URL=$(gh pr create --draft --base main --head "$BRANCH" \
            --title "Alarm triage for #${ISSUE_NUMBER}: ${ALARM_NAME}" \
            --body "$PR_BODY")
          echo "url=${PR_URL}" | tee -a "$GITHUB_OUTPUT"
          # origin:unattended-agent says a model ran this with nobody watching. Adding a label
          # through this endpoint, rather than gh pr create's own --label flag, creates the label
          # on first use if it doesn't already exist, so this never fails while the label is
          # still pending creation (see REPORT_IDENTITY_AUDIT.md section 8, recommendation 6).
          PR_NUMBER="${PR_URL##*/}"
          gh api "repos/${{ github.repository }}/issues/${PR_NUMBER}/labels" -f "labels[]=origin:unattended-agent"

      - name: Comment the triage
        if: steps.role.outputs.configured == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          if [ -n "${{ steps.draft-pr.outputs.url }}" ]; then
            printf '\n---\n\nDraft PR for the change above: %s\n' "${{ steps.draft-pr.outputs.url }}" >> /tmp/final-comment.md
          fi
          if [ "${{ steps.select-result.outputs.model }}" = "sonnet" ]; then
            printf '\n_Answered by Sonnet, escalated because %s._\n' "${{ steps.judge.outputs.reason }}" >> /tmp/final-comment.md
          else
            printf '\n_Answered by Haiku._\n' >> /tmp/final-comment.md
          fi
          gh issue comment "$ISSUE_NUMBER" --repo "${{ github.repository }}" --body-file /tmp/final-comment.md

      # Runs after the comment is safely posted, so the answer above is not lost, but the run
      # still ends red: a triage that only got through 60 turns by exhausting its budget is not a
      # clean pass, and green here would hide that the answer may be incomplete.
      - name: Fail the run when triage stopped early
        if: steps.triage-run.outputs.stopped == 'max_turns'
        run: |
          echo "failing the run: triage stopped after using its 60-turn budget" | tee -a "$GITHUB_STEP_SUMMARY"
          exit 1
