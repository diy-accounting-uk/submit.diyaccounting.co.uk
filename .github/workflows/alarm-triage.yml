name: alarm-triage
run-name: "alarm triage for #${{ inputs.issue-number || github.event.issue.number }}"

# The draft PR this workflow can open (branch push, PR create, label) runs on a diya-agent
# GitHub App installation token, not the default GITHUB_TOKEN, so this workflow's own
# permissions below carry no contents or pull-requests write. That surface is acceptable here:
# the issue that triggers this workflow is opened by our own alarm-to-issue Lambda, not by a
# member of the public, and the only text this workflow ever turns into a branch is a diff the
# triage agent wrote inside its own answer (see prompts/alarm-triage.md) - the same answer that
# already passed the regex deny-list and the Bedrock guardrail before it was posted as the issue
# comment. The alarm reason string CloudWatch composes and whatever the agent reads from logs
# and traces are treated as data throughout, never as instructions.

on:
  issues:
    types: [opened]
  workflow_dispatch:
    inputs:
      issue-number:
        description: the alarm issue to triage again
        required: true
        type: string

permissions:
  id-token: write
  issues: write
  actions: read

concurrency:
  group: alarm-triage
  cancel-in-progress: false

env:
  NODE_VERSION: '24'
  AWS_REGION: 'eu-west-2'
  CLAUDE_CODE_VERSION: '2.0.30'
  # The one place this number is written. The budget guard, its step name and its skip
  # comment all read it, so the three cannot drift apart the way -gt 3 and "budget of 3" did.
  TRIAGE_BUDGET_PER_DAY: '8'

jobs:
  # Anyone can open an issue or a comment in a public repository, so no agent starts from one
  # unless the issue's author and the event's sender are both on the list in
  # scripts/issue-agent-allowlist.mjs. A dispatch needs write access already and passes.
  gate:
    runs-on: ubuntu-24.04
    timeout-minutes: 2
    permissions:
      contents: read
    outputs:
      allowed: ${{ steps.allowlist.outputs.allowed }}
    steps:
      - name: Checkout the allow list
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          sparse-checkout: scripts/issue-agent-allowlist.mjs
          sparse-checkout-cone-mode: false
          persist-credentials: false

      - name: Check the issue author and the event sender against the allow list
        id: allowlist
        env:
          EVENT_NAME: ${{ github.event_name }}
          ISSUE_AUTHOR: ${{ github.event.issue.user.login }}
          EVENT_SENDER: ${{ github.event.sender.login }}
        run: node scripts/issue-agent-allowlist.mjs

  triage:
    needs: gate
    if: needs.gate.outputs.allowed == 'true' && (github.event_name == 'workflow_dispatch' || contains(github.event.issue.labels.*.name, 'alarm'))
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      # A local action needs the repository on disk before it can run; only the action's own
      # directory is fetched, since this job reads nothing else from the tree.
      - name: Checkout the budget action
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          sparse-checkout: .github/actions/agent-run-budget
          sparse-checkout-cone-mode: false
          persist-credentials: false

      - name: Stop once ${{ env.TRIAGE_BUDGET_PER_DAY }} triage runs have already posted a result today
        id: budget-guard
        uses: ./.github/actions/agent-run-budget
        with:
          workflow-file: alarm-triage.yml
          job-name: run-triage
          step-name: Comment the triage
          budget: ${{ env.TRIAGE_BUDGET_PER_DAY }}

      # The budget guard ends this job green with no comment when it skips, which is why #173
      # (2026-09-10) was closed unread: nothing on the issue said triage had not looked at it.
      - name: Comment that triage was skipped
        if: steps.budget-guard.outputs.over-budget == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          ISSUE_NUMBER: ${{ inputs.issue-number || github.event.issue.number }}
          BUDGET_REASON: ${{ steps.budget-guard.outputs.reason }}
          TRIAGE_COUNT: ${{ steps.budget-guard.outputs.count }}
          TRIAGE_SINCE: ${{ steps.budget-guard.outputs.since }}
        run: |
          set -euo pipefail
          if [ "${BUDGET_REASON}" = "api-error" ]; then
            BODY="Alarm triage was skipped: the daily run budget could not be counted because the GitHub API failed after three attempts. Nobody has looked at this alarm yet."
          else
            BODY="Alarm triage was skipped: the budget of ${{ env.TRIAGE_BUDGET_PER_DAY }} triage runs per 24 hours is already used (${TRIAGE_COUNT} posted a result since ${TRIAGE_SINCE}). Nobody has looked at this alarm yet."
          fi
          gh issue comment "$ISSUE_NUMBER" --repo "${{ github.repository }}" --body "${BODY}"

      - name: Read the alarm out of the issue body
        if: steps.budget-guard.outputs.over-budget == 'false'
        id: alarm
        env:
          ISSUE_BODY: ${{ github.event.issue.body }}
          ISSUE_NUMBER: ${{ inputs.issue-number || github.event.issue.number }}
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          if [ -z "$ISSUE_BODY" ]; then ISSUE_BODY=$(gh issue view "$ISSUE_NUMBER" --repo "${{ github.repository }}" --json body -q .body); fi
          ALARM_NAME=$(printf '%s' "$ISSUE_BODY" | sed -n 's/^\*\*Alarm:\*\* //p' | head -1)
          TIMESTAMP=$(printf '%s' "$ISSUE_BODY" | sed -n 's/^\*\*Timestamp:\*\* //p' | head -1)
          REGION=$(printf '%s' "$ISSUE_BODY" | sed -n 's/^\*\*Region:\*\* //p' | head -1)
          DEPLOYMENT=$(printf '%s' "$ISSUE_BODY" | sed -n 's/^\*\*Deployment:\*\* //p' | head -1)
          WINDOW=$(printf '%s' "$ISSUE_BODY" | sed -n 's/^\*\*Window:\*\* //p' | head -1)
          case "$ALARM_NAME" in
            prod-*) ENV_NAME=prod ;;
            ci-*)   ENV_NAME=ci ;;
            *)      echo "alarm name has no environment prefix: $ALARM_NAME"; exit 1 ;;
          esac
          {
            echo "alarm-name=${ALARM_NAME}"
            echo "timestamp=${TIMESTAMP}"
            echo "region=${REGION:-eu-west-2}"
            echo "deployment=${DEPLOYMENT}"
            echo "window=${WINDOW}"
            echo "environment-name=${ENV_NAME}"
          } | tee -a "$GITHUB_OUTPUT"
    outputs:
      proceed: ${{ steps.budget-guard.outputs.over-budget == 'false' }}
      alarm-name: ${{ steps.alarm.outputs.alarm-name }}
      timestamp: ${{ steps.alarm.outputs.timestamp }}
      region: ${{ steps.alarm.outputs.region }}
      deployment: ${{ steps.alarm.outputs.deployment }}
      window: ${{ steps.alarm.outputs.window }}
      environment-name: ${{ steps.alarm.outputs.environment-name }}

  run-triage:
    needs: triage
    if: needs.triage.outputs.proceed == 'true'
    runs-on: ubuntu-24.04
    # Two agent passes can run in this job: the Haiku first pass, and the Sonnet escalation
    # when Haiku's answer is unusable or unsure. The longest single pass observed is 155s, so
    # 20 minutes covers two worst-case passes plus the AWS/npm setup steps that run once.
    timeout-minutes: 20
    environment: ${{ needs.triage.outputs.environment-name }}
    env:
      ENV_NAME: ${{ needs.triage.outputs.environment-name }}
      ALARM_NAME: ${{ needs.triage.outputs.alarm-name }}
      ALARM_REGION: ${{ needs.triage.outputs.region }}
      ALARM_WINDOW: ${{ needs.triage.outputs.window }}
      DEPLOYMENT_NAME: ${{ needs.triage.outputs.deployment }}
      ISSUE_NUMBER: ${{ inputs.issue-number || github.event.issue.number }}
      MODEL_ID: 'eu.anthropic.claude-sonnet-4-5-20250929-v1:0'
      HAIKU_MODEL_ID: 'eu.anthropic.claude-haiku-4-5-20251001-v1:0'
      RUN_URL: '${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}'
    steps:
      # The triage role is created by the environment's CDK deploy and its ARN is set on the
      # GitHub Environment by hand afterwards, so an alarm that arrives before that is a quiet
      # no-op here rather than a failed run.
      - name: Stop when the triage role is not configured for this environment
        id: role
        env:
          TRIAGE_ROLE_ARN: ${{ vars.SUBMIT_ALARM_TRIAGE_ROLE_ARN }}
        run: |
          if [ -z "${TRIAGE_ROLE_ARN}" ]; then
            echo "SUBMIT_ALARM_TRIAGE_ROLE_ARN is not set on the ${ENV_NAME} environment, so triage waits" | tee -a "$GITHUB_STEP_SUMMARY"
            echo "configured=false" | tee -a "$GITHUB_OUTPUT"
          else
            echo "configured=true" | tee -a "$GITHUB_OUTPUT"
          fi

      - name: Generate a token for diya-agent
        if: steps.role.outputs.configured == 'true'
        id: app-token
        uses: actions/create-github-app-token@fee1f7d63c2ff003460e3d139729b119787bc349 # v2.2.2
        with:
          app-id: ${{ vars.AGENT_APP_ID }}
          private-key: ${{ secrets.AGENT_APP_PRIVATE_KEY }}

      - name: Checkout
        if: steps.role.outputs.configured == 'true'
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          token: ${{ steps.app-token.outputs.token }}
          persist-credentials: false

      - name: Set up Node
        if: steps.role.outputs.configured == 'true'
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: ${{ env.NODE_VERSION }}

      - name: Configure AWS role via GitHub OIDC
        if: steps.role.outputs.configured == 'true'
        uses: aws-actions/configure-aws-credentials@e1253824e5c10ff9df46874f81ed3ec929e19cfd # v6
        with:
          role-to-assume: ${{ vars.SUBMIT_ACTIONS_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}
          role-chaining: false
          audience: sts.amazonaws.com
          role-skip-session-tagging: true
          output-credentials: true
          retry-max-attempts: 3

      - name: Assume the read-only alarm triage role
        if: steps.role.outputs.configured == 'true'
        id: assume-triage-role
        uses: aws-actions/configure-aws-credentials@e1253824e5c10ff9df46874f81ed3ec929e19cfd # v6
        with:
          role-to-assume: ${{ vars.SUBMIT_ALARM_TRIAGE_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}
          role-chaining: true
          audience: sts.amazonaws.com
          role-skip-session-tagging: true
          output-credentials: true
          retry-max-attempts: 3

      - name: Stop when the agent kill switch is on
        if: steps.role.outputs.configured == 'true'
        id: kill-switch
        uses: ./.github/actions/agent-kill-switch
        with:
          environment-name: ${{ env.ENV_NAME }}

      - name: Install dependencies
        if: steps.role.outputs.configured == 'true'
        run: timeout 120 npm ci --prefer-offline || { sleep 30; timeout 180 npm ci; }

      # The only gate this pipeline can safely use before spending an agent run and posting to
      # the issue: re-read CloudWatch's own alarm history for the exact name and window the
      # issue body claims. An issue whose claimed alarm or window cannot be confirmed fails this
      # step, and the job stops here with no triage run, no comment, no draft PR.
      - name: Verify the alarm actually fired
        if: steps.role.outputs.configured == 'true'
        id: verify-alarm
        run: |
          node scripts/verify-alarm-origin.mjs \
            --alarm-name "$ALARM_NAME" --window "$ALARM_WINDOW" --region "$ALARM_REGION"

      - name: Resolve the evidence links for this alarm
        if: steps.role.outputs.configured == 'true'
        run: |
          set -o pipefail
          node scripts/resolve-alarm-evidence.mjs \
            --alarm-name "$ALARM_NAME" --deployment "$DEPLOYMENT_NAME" \
            --region "$ALARM_REGION" --from-alarm \
            2>&1 | tee /tmp/evidence.json

      # The agent has answered "without being able to query CloudWatch Logs" without making one
      # aws call (#229, run 35030341835). So the same credentials it will hold make the three calls
      # here first, and the results (or the exact errors) go into the evidence file for the prompt
      # to quote: an agent told "these calls worked a moment ago" has no room to assume otherwise.
      - name: Prove the triage credentials against the alarm's telemetry
        if: steps.role.outputs.configured == 'true'
        run: |
          set -o pipefail
          proof() {
            # $1 the key, the rest the command; success stores the JSON answer, failure the error text
            local key="$1"; shift
            if out=$("$@" 2>&1); then
              printf '%s' "$out" | jq -c --arg key "$key" '{($key): .}' > "/tmp/proof-${key}.json"
            else
              jq -nc --arg key "$key" --arg error "$out" '{($key): {error: $error}}' > "/tmp/proof-${key}.json"
            fi
          }
          WINDOW_START=$(printf '%s' "$ALARM_WINDOW" | sed -E 's/^([^ ]+) to .*/\1/')
          WINDOW_END=$(printf '%s' "$ALARM_WINDOW" | sed -E 's/^[^ ]+ to ([^ ]+).*/\1/')
          LOG_GROUP_PREFIX=$(jq -r '.logGroupNamePrefixes[0] // empty' /tmp/evidence.json)
          proof identity aws sts get-caller-identity --output json
          proof logGroups aws logs describe-log-groups --region "$ALARM_REGION" \
            --log-group-name-prefix "${LOG_GROUP_PREFIX:-/aws/lambda/${DEPLOYMENT_NAME}}" \
            --query 'logGroups[].{name:logGroupName,retentionInDays:retentionInDays}' --output json
          proof alarmHistory aws cloudwatch describe-alarm-history --region "$ALARM_REGION" \
            --alarm-name "$ALARM_NAME" --history-item-type StateUpdate \
            --start-date "$WINDOW_START" --end-date "$WINDOW_END" \
            --query 'AlarmHistoryItems[].{at:Timestamp,summary:HistorySummary}' --output json
          jq -s '.[0] + {credentialProof: (.[1] + .[2] + .[3] + {provedAt: (now | todate)})}' \
            /tmp/evidence.json /tmp/proof-identity.json /tmp/proof-logGroups.json /tmp/proof-alarmHistory.json \
            > /tmp/evidence.proved.json
          mv /tmp/evidence.proved.json /tmp/evidence.json
          jq '.credentialProof' /tmp/evidence.json | tee -a "$GITHUB_STEP_SUMMARY"

      # Written to $GITHUB_ENV, not a step output, so envsubst in run-triage-agent's prompt
      # substitution sees it without the composite action needing a new input of its own.
      - name: Look up the remedy row for this alarm's family
        if: steps.role.outputs.configured == 'true'
        id: remedy
        run: |
          set -euo pipefail
          FAMILY_KEY=$(node --input-type=module -e "
            import { alarmFamilyKey } from './app/lib/alarmName.js';
            console.log(alarmFamilyKey(process.env.ALARM_NAME));
          ")
          REMEDY_ROW=$(FAMILY_KEY="$FAMILY_KEY" node --input-type=module -e "
            import { readFileSync } from 'node:fs';
            const remedies = JSON.parse(readFileSync('app/data/alarm-remedies.json', 'utf8'));
            const row = remedies.find((r) => r.family === process.env.FAMILY_KEY);
            console.log(row ? JSON.stringify(row) : 'null');
          ")
          echo "family=${FAMILY_KEY}" | tee -a "$GITHUB_OUTPUT"
          {
            echo "FAMILY_KEY=${FAMILY_KEY}"
            echo "REMEDY_ROW=${REMEDY_ROW}"
          } | tee -a "$GITHUB_ENV"

      - name: Install Claude Code
        if: steps.role.outputs.configured == 'true'
        run: npm install -g "@anthropic-ai/claude-code@${CLAUDE_CODE_VERSION}"

      - name: Run triage (Haiku)
        if: steps.role.outputs.configured == 'true'
        uses: ./.github/actions/run-triage-agent
        with:
          model-id: ${{ env.HAIKU_MODEL_ID }}
          small-fast-model-id: ${{ env.HAIKU_MODEL_ID }}
          output-file: /tmp/triage.haiku.json

      # Escalates to Sonnet when Haiku's pass is unusable (no result, an error, the turn budget
      # spent) or unsure (it answered "Is it still broken?" with an admission it could not tell).
      # Every other case accepts Haiku's answer as final.
      - name: Judge the first pass
        if: steps.role.outputs.configured == 'true'
        id: judge
        run: |
          set -euo pipefail
          ESCALATE=false
          REASON=""
          if [ ! -s /tmp/triage.haiku.json ]; then
            ESCALATE=true
            REASON="the Haiku pass produced no result file"
          elif jq -e '.is_error == true' /tmp/triage.haiku.json > /dev/null 2>&1; then
            ESCALATE=true
            REASON="the Haiku pass reported is_error"
          elif jq -e '.subtype == "error_max_turns"' /tmp/triage.haiku.json > /dev/null 2>&1; then
            ESCALATE=true
            REASON="the Haiku pass used its turn budget before finishing"
          elif ! jq -e '.result | length > 0' /tmp/triage.haiku.json > /dev/null 2>&1; then
            ESCALATE=true
            REASON="the Haiku pass returned an empty result"
          else
            RESULT_TEXT=$(jq -r '.result' /tmp/triage.haiku.json)
            if printf '%s' "$RESULT_TEXT" | grep -qiE 'unable to determine|cannot determine|could not determine|insufficient evidence|without querying'; then
              ESCALATE=true
              REASON="the Haiku pass could not say whether the alarm is still broken"
            fi
          fi
          echo "escalate=${ESCALATE}" | tee -a "$GITHUB_OUTPUT"
          echo "reason=${REASON}" >> "$GITHUB_OUTPUT"
          {
            echo "alarm triage first pass: escalate=${ESCALATE}"
            if [ -n "${REASON}" ]; then echo "reason: ${REASON}"; fi
          } | tee -a "$GITHUB_STEP_SUMMARY"

      - name: Run triage (Sonnet)
        if: steps.role.outputs.configured == 'true' && steps.judge.outputs.escalate == 'true'
        uses: ./.github/actions/run-triage-agent
        with:
          model-id: ${{ env.MODEL_ID }}
          small-fast-model-id: ${{ env.HAIKU_MODEL_ID }}
          output-file: /tmp/triage.sonnet.json

      # Sonnet's answer stands when it ran; otherwise Haiku's does. Every step below this one
      # (the usable-result gate, redaction, guardrail, comment, draft PR) reads /tmp/triage.json
      # and does not know or care which model produced it.
      - name: Select the triage result
        if: steps.role.outputs.configured == 'true'
        id: select-result
        env:
          SONNET_MODEL_ID: ${{ env.MODEL_ID }}
          HAIKU_MODEL_ID: ${{ env.HAIKU_MODEL_ID }}
        run: |
          set -euo pipefail
          if [ -s /tmp/triage.sonnet.json ]; then
            cp /tmp/triage.sonnet.json /tmp/triage.json
            echo "model=sonnet" | tee -a "$GITHUB_OUTPUT"
            echo "model-id=${SONNET_MODEL_ID}" | tee -a "$GITHUB_OUTPUT"
          else
            cp /tmp/triage.haiku.json /tmp/triage.json
            echo "model=haiku" | tee -a "$GITHUB_OUTPUT"
            echo "model-id=${HAIKU_MODEL_ID}" | tee -a "$GITHUB_OUTPUT"
          fi

      - name: Require a usable result
        if: steps.role.outputs.configured == 'true'
        id: triage-run
        run: |
          set -o pipefail
          # A run that stopped early (max-turns, a denied tool, an entitlement error from
          # Bedrock) can still exit 0 with a JSON result that carries no usable answer. Gate on
          # the content, not just the exit code, so every failure shape - including the AWS
          # Marketplace entitlement error an environment without the Anthropic model agreement
          # gets back from Bedrock - fails this step with the reason on record, instead of
          # falling through to be posted as a comment.
          #
          # error_max_turns is the one shape that still gets posted: the redaction script already
          # turns it (and any partial `.result` text it carries) into a comment, so this step lets
          # the later Filter/guardrail/Comment steps run and only records that the turn budget was
          # the reason, leaving "Fail the run when triage stopped early" (the job's last step) to
          # put the run back into red once the comment is on the issue.
          if jq -e '.subtype == "success" and (.is_error | not) and (.result | length > 0)' /tmp/triage.json > /dev/null; then
            echo "stopped=false" | tee -a "$GITHUB_OUTPUT"
          elif jq -e '.subtype == "error_max_turns"' /tmp/triage.json > /dev/null; then
            echo "triage used its 60-turn budget before finishing; posting whatever partial answer it produced" \
              | tee -a "$GITHUB_STEP_SUMMARY"
            echo "stopped=max_turns" | tee -a "$GITHUB_OUTPUT"
          else
            echo "triage produced no answer:" | tee -a "$GITHUB_STEP_SUMMARY"
            head -c 2000 /tmp/triage.json | tee -a "$GITHUB_STEP_SUMMARY"
            exit 1
          fi

      - name: Filter the triage answer before it is published
        if: steps.role.outputs.configured == 'true'
        id: publish-filter
        uses: ./.github/actions/publish-filter
        with:
          input-file: /tmp/triage.json
          format: claude-json
          environment-name: ${{ env.ENV_NAME }}
          model-id: ${{ steps.select-result.outputs.model-id }}
          workflow-name: ${{ github.workflow }}
          run-number: ${{ github.run_number }}
          run-url: ${{ env.RUN_URL }}

      # The diff, if any, is a fenced ```diff block inside the comment just built, so it has
      # already passed the same deny-list and guardrail as the rest of the answer. This step
      # never reads the agent's raw output directly, and it runs before the comment is posted so
      # the comment can link to the PR it opened.
      - name: Open a draft PR when triage named a change
        if: steps.role.outputs.configured == 'true'
        id: draft-pr
        env:
          GH_TOKEN: ${{ steps.app-token.outputs.token }}
          ANSWERING_MODEL_ID: ${{ steps.select-result.outputs.model-id }}
        run: |
          set -euo pipefail
          awk '/^```diff$/ { flag=1; next } /^```$/ { if (flag) exit } flag' "${{ steps.publish-filter.outputs.output-file }}" > triage-change.patch
          if [ ! -s triage-change.patch ]; then
            echo "no diff block in the triage answer, nothing to open a PR for"
            rm -f triage-change.patch
            exit 0
          fi
          if ! git apply --check triage-change.patch 2>/tmp/git-apply-check.log; then
            echo "the proposed change does not apply cleanly, skipping the draft PR"
            cat /tmp/git-apply-check.log
            rm -f triage-change.patch
            exit 0
          fi
          BRANCH="claude/triage-${ISSUE_NUMBER}"
          BASE_SHA=$(git rev-parse HEAD)
          git switch -c "$BRANCH"
          git apply triage-change.patch
          rm triage-change.patch
          # Unattended-run attribution: Co-Authored-By and Claude-Model are the same trailers a
          # terminal session writes; Claude-Run replaces Claude-Session because nobody is watching
          # this run (see CLAUDE.md, "Commit attribution"). printf, not a quoted multi-line
          # string, so the trailer lines land at column 0 rather than inheriting this script's
          # indentation.
          printf 'Alarm triage for #%s: %s\n\nCo-Authored-By: Claude <noreply@anthropic.com>\nClaude-Model: %s\nClaude-Run: %s' \
            "$ISSUE_NUMBER" "$ALARM_NAME" "$ANSWERING_MODEL_ID" "$RUN_URL" > /tmp/commit-message.txt
          # Commits through the GitHub API with the App's own token, not `git commit` + `git
          # push`, so the commit is the App's own signed, verified identity rather than an
          # unsigned local commit (see verify-commit-signatures.yml, which has no exemption for
          # this App and should not need one).
          scripts/github-api-commit.sh --repo "${{ github.repository }}" --branch "$BRANCH" \
            --base-sha "$BASE_SHA" --message-file /tmp/commit-message.txt
          PR_BODY=$(printf 'Draft from the alarm-triage workflow for #%s. Not reviewed by a human. Closes nothing.\n\nCo-Authored-By: Claude <noreply@anthropic.com>\nClaude-Model: %s\nClaude-Run: %s' \
            "$ISSUE_NUMBER" "$ANSWERING_MODEL_ID" "$RUN_URL")
          PR_URL=$(gh pr create --draft --base main --head "$BRANCH" \
            --title "Alarm triage for #${ISSUE_NUMBER}: ${ALARM_NAME}" \
            --body "$PR_BODY")
          echo "url=${PR_URL}" | tee -a "$GITHUB_OUTPUT"
          # origin:unattended-agent says a model ran this with nobody watching. Adding a label
          # through this endpoint, rather than gh pr create's own --label flag, creates the label
          # on first use if it doesn't already exist, so this never fails on a missing label.
          PR_NUMBER="${PR_URL##*/}"
          gh api "repos/${{ github.repository }}/issues/${PR_NUMBER}/labels" -f "labels[]=origin:unattended-agent"

      # The triage reasoning goes to a mirror issue in the private repository, never to this
      # public issue, which gets one deterministic line with the status and a link. The mirror
      # issue is created on the first triage of an alarm issue and found again on later runs by
      # the marker line in its body. Its token carries issues write on that one repository.
      - name: Generate a token for the private repository
        if: steps.role.outputs.configured == 'true'
        id: private-token
        uses: actions/create-github-app-token@fee1f7d63c2ff003460e3d139729b119787bc349 # v2.2.2
        with:
          app-id: ${{ vars.AGENT_APP_ID }}
          private-key: ${{ secrets.AGENT_APP_PRIVATE_KEY }}
          owner: diy-accounting-uk
          repositories: private.diyaccounting.co.uk
          permission-issues: write

      - name: Comment the triage
        if: steps.role.outputs.configured == 'true'
        id: comment-triage
        env:
          GH_TOKEN: ${{ github.token }}
          PRIVATE_GH_TOKEN: ${{ steps.private-token.outputs.token }}
          PRIVATE_REPO: diy-accounting-uk/private.diyaccounting.co.uk
          TRIAGE_STOPPED: ${{ steps.triage-run.outputs.stopped }}
        run: |
          set -euo pipefail
          OUTPUT_FILE="${{ steps.publish-filter.outputs.output-file }}"
          if [ -n "${{ steps.draft-pr.outputs.url }}" ]; then
            printf '\n---\n\nDraft PR for the change above: %s\n' "${{ steps.draft-pr.outputs.url }}" >> "$OUTPUT_FILE"
          fi
          MARKER="alarm-triage-mirror: ${{ github.repository }}#${ISSUE_NUMBER}"
          export GH_TOKEN="$PRIVATE_GH_TOKEN"
          gh label create "alarm-mirror" --color 5319e7 --description "Private mirror of a public alarm issue" --repo "$PRIVATE_REPO" 2>/dev/null || true
          MIRROR_LIST=$(gh issue list --repo "$PRIVATE_REPO" --label alarm-mirror --state all --limit 200 --json url,body)
          MIRROR_URL=$(jq -r --arg marker "$MARKER" '[.[] | select(.body | contains($marker)) | .url][0] // empty' <<<"$MIRROR_LIST")
          if [ -z "$MIRROR_URL" ]; then
            printf 'Mirror of alarm issue %s/%s/issues/%s\n\nAlarm: %s\n\n%s\n' \
              "${{ github.server_url }}" "${{ github.repository }}" "$ISSUE_NUMBER" "$ALARM_NAME" "$MARKER" > /tmp/mirror-body.md
            MIRROR_URL=$(gh issue create --repo "$PRIVATE_REPO" --label alarm-mirror \
              --title "[ALARM] ${ALARM_NAME} (public #${ISSUE_NUMBER})" --body-file /tmp/mirror-body.md)
          fi
          gh issue comment "$MIRROR_URL" --body-file "$OUTPUT_FILE"
          if [ "$TRIAGE_STOPPED" = "max_turns" ]; then STATUS="stopped at its turn limit"; else STATUS="complete"; fi
          export GH_TOKEN="${{ github.token }}"
          gh issue comment "$ISSUE_NUMBER" --repo "${{ github.repository }}" \
            --body "Triage ${STATUS}. Reasoning: ${MIRROR_URL}"

      # Reads the model's own final "remedy: ..." line and checks it against the same row the
      # prompt gave the model, so a malformed or out-of-scope line does nothing rather than being
      # trusted. The row is the ceiling on what this step will ever do; the model's line only
      # decides whether to use it or fall back to a person (policy:question).
      - name: Act on the remedy the triage named
        if: steps.role.outputs.configured == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          APP_TOKEN: ${{ steps.app-token.outputs.token }}
          DRAFT_PR_URL: ${{ steps.draft-pr.outputs.url }}
          ALARM_TIMESTAMP: ${{ needs.triage.outputs.timestamp }}
        run: |
          set -euo pipefail
          gh label create "remedy:dispatch" --color 0e8a16 --description "Triage dispatched this family's own remedy workflow" --repo "${{ github.repository }}" 2>/dev/null || true
          gh label create "remedy:close-when-gone" --color 0e8a16 --description "This family closes itself once every alarm it names is OK or gone" --repo "${{ github.repository }}" 2>/dev/null || true
          gh label create "remedy:draft-pr" --color 0e8a16 --description "Triage's own draft PR may go ready when it stays inside the family's paths" --repo "${{ github.repository }}" 2>/dev/null || true

          LINE=$(grep -E '^remedy: ' "${{ steps.publish-filter.outputs.output-file }}" | tail -1 || true)
          if [ -z "$LINE" ]; then
            echo "no remedy line in the triage answer, nothing to act on"
            gh issue edit "$ISSUE_NUMBER" --repo "${{ github.repository }}" --add-label "policy:question"
            exit 0
          fi

          ROW_REMEDY=$(jq -r 'if . == null then "none" else .remedy end' <<<"$REMEDY_ROW")
          ROW_WORKFLOW=$(jq -r '.workflow // empty' <<<"$REMEDY_ROW")
          ROW_BUDGET=$(jq -r 'if . == null then 0 else .budgetPerDay end' <<<"$REMEDY_ROW")

          case "$LINE" in
            "remedy: none")
              gh issue edit "$ISSUE_NUMBER" --repo "${{ github.repository }}" --add-label "policy:question"
              ;;
            "remedy: dispatch "*)
              NAMED_WORKFLOW="${LINE#remedy: dispatch }"
              if [ "$ROW_REMEDY" != "dispatch" ] || [ "$NAMED_WORKFLOW" != "$ROW_WORKFLOW" ]; then
                echo "triage named a dispatch this family's row does not allow: $LINE"
                gh issue edit "$ISSUE_NUMBER" --repo "${{ github.repository }}" --add-label "policy:question"
                exit 0
              fi
              # dispatch takes a real action (a workflow run), so it is metered against
              # the family's own budgetPerDay; close-when-gone only ever applies a label
              # and is never metered here.
              REMAINING=$(node scripts/remedy-budget-remaining.mjs --family "$FAMILY_KEY" --budget "$ROW_BUDGET" --repo "${{ github.repository }}")
              if [ "$REMAINING" -le 0 ]; then
                USED=$((ROW_BUDGET - REMAINING))
                echo "family $FAMILY_KEY has used $USED of its $ROW_BUDGET remedy actions in the last 24 hours"
                gh issue edit "$ISSUE_NUMBER" --repo "${{ github.repository }}" --add-label "policy:question"
                gh issue comment "$ISSUE_NUMBER" --repo "${{ github.repository }}" --body "Remedy budget for family ${FAMILY_KEY} is spent: ${USED} of ${ROW_BUDGET} remedy actions already used in the last 24 hours. Leaving this to a person."
                exit 0
              fi
              INPUT_ARGS=()
              for KEY in $(jq -r '.inputs // {} | keys[]' <<<"$REMEDY_ROW"); do
                VALUE=$(jq -r --arg k "$KEY" '.inputs[$k]' <<<"$REMEDY_ROW")
                # A row value of {alarm-date-minus-1} is the UTC day before the alarm fired.
                if [ "$VALUE" = "{alarm-date-minus-1}" ]; then
                  VALUE=$(date -u -d "${ALARM_TIMESTAMP} - 1 day" +%F)
                fi
                INPUT_ARGS+=(-f "${KEY}=${VALUE}")
              done
              GH_TOKEN="$APP_TOKEN" gh workflow run "$ROW_WORKFLOW" --repo "${{ github.repository }}" "${INPUT_ARGS[@]}"
              gh issue edit "$ISSUE_NUMBER" --repo "${{ github.repository }}" --add-label "remedy:dispatch"
              ;;
            "remedy: close-when-gone")
              if [ "$ROW_REMEDY" != "close-when-gone" ]; then
                echo "triage named close-when-gone but this family's row is $ROW_REMEDY"
                gh issue edit "$ISSUE_NUMBER" --repo "${{ github.repository }}" --add-label "policy:question"
                exit 0
              fi
              gh issue edit "$ISSUE_NUMBER" --repo "${{ github.repository }}" --add-label "remedy:close-when-gone"
              ;;
            "remedy: draft-pr")
              if [ "$ROW_REMEDY" != "draft-pr" ]; then
                echo "triage named draft-pr but this family's row is $ROW_REMEDY"
                gh issue edit "$ISSUE_NUMBER" --repo "${{ github.repository }}" --add-label "policy:question"
                exit 0
              fi
              if [ -z "$DRAFT_PR_URL" ]; then
                echo "triage named draft-pr but opened no draft PR this run, nothing to mark ready"
                exit 0
              fi
              PR_NUMBER="${DRAFT_PR_URL##*/}"
              CHANGED=$(git diff --name-only main HEAD)
              SCOPE=$(printf '%s\n' "$CHANGED" | node scripts/verify-draft-pr-scope.mjs --family "$FAMILY_KEY" || true)
              if printf '%s' "$SCOPE" | jq -e '.allowed' > /dev/null 2>&1; then
                # draft-pr's real action is marking the PR ready, so it is metered here,
                # after scope is confirmed and before the PR actually goes ready.
                REMAINING=$(node scripts/remedy-budget-remaining.mjs --family "$FAMILY_KEY" --budget "$ROW_BUDGET" --repo "${{ github.repository }}")
                if [ "$REMAINING" -le 0 ]; then
                  USED=$((ROW_BUDGET - REMAINING))
                  echo "family $FAMILY_KEY has used $USED of its $ROW_BUDGET remedy actions in the last 24 hours"
                  gh issue edit "$ISSUE_NUMBER" --repo "${{ github.repository }}" --add-label "policy:question"
                  gh issue comment "$ISSUE_NUMBER" --repo "${{ github.repository }}" --body "Remedy budget for family ${FAMILY_KEY} is spent: ${USED} of ${ROW_BUDGET} remedy actions already used in the last 24 hours. Leaving this to a person."
                  exit 0
                fi
                GH_TOKEN="$APP_TOKEN" gh pr ready "$PR_NUMBER" --repo "${{ github.repository }}"
                gh issue edit "$ISSUE_NUMBER" --repo "${{ github.repository }}" --add-label "remedy:draft-pr"
              else
                echo "draft PR touches paths outside the family's remedy paths, leaving it as a draft"
                echo "$SCOPE"
              fi
              ;;
            *)
              echo "unrecognised remedy line: $LINE"
              gh issue edit "$ISSUE_NUMBER" --repo "${{ github.repository }}" --add-label "policy:question"
              ;;
          esac

      # Runs after the comment is safely posted, so the answer above is not lost, but the run
      # still ends red: a triage that only got through 60 turns by exhausting its budget is not a
      # clean pass, and green here would hide that the answer may be incomplete.
      - name: Fail the run when triage stopped early
        if: steps.triage-run.outputs.stopped == 'max_turns'
        run: |
          echo "failing the run: triage stopped after using its 60-turn budget" | tee -a "$GITHUB_STEP_SUMMARY"
          exit 1

      # Agent-run ledger row for the one-stop dashboard (v_agent_runs_daily): one row per run,
      # recording whether this path produced a usable answer, so nobody has to read run logs by
      # hand to see the posted rate. A run that stops at "Stop when the triage role is not
      # configured" writes no row here; the write itself (below) is also gated on
      # 'Assume the read-only alarm triage role' having actually configured credentials (see
      # WriteAgentRunLedgerRows in ObservabilityStack.java for the grant that step's role uses).
      - name: Determine the outcome for the ledger
        if: always() && !cancelled() && steps.role.outputs.configured == 'true'
        id: ledger-outcome
        run: |
          set -euo pipefail
          if [ "${{ steps.comment-triage.conclusion }}" = "success" ] && [ "${{ steps.triage-run.outputs.stopped }}" = "max_turns" ]; then
            OUTCOME=max-turns
          elif [ "${{ steps.comment-triage.conclusion }}" = "success" ]; then
            OUTCOME=posted
          elif [ "${{ steps.triage-run.conclusion }}" = "failure" ]; then
            OUTCOME=no-answer
          elif [ "${{ steps.verify-alarm.conclusion }}" = "failure" ]; then
            OUTCOME=verify-failed
          elif [ "${{ steps.kill-switch.conclusion }}" = "failure" ]; then
            OUTCOME=skipped-kill-switch
          else
            OUTCOME=no-action
          fi
          echo "outcome=${OUTCOME}" | tee -a "$GITHUB_OUTPUT"

      - name: Build the agent-run row
        if: always() && !cancelled() && steps.role.outputs.configured == 'true'
        id: agent-run-row
        env:
          GH_TOKEN: ${{ github.token }}
          ROW_WORKFLOW: ${{ github.workflow }}
          ROW_RUN_ID: ${{ github.run_id }}
          ROW_RUN_URL: ${{ env.RUN_URL }}
          ROW_TRIGGER: ${{ github.event_name }}
          ROW_ENVIRONMENT: ${{ env.ENV_NAME }}
          ROW_ISSUE_NUMBER: ${{ env.ISSUE_NUMBER }}
          ROW_MODEL_ID: ${{ steps.select-result.outputs.model-id }}
          ROW_OUTCOME: ${{ steps.ledger-outcome.outputs.outcome }}
          ROW_ESCALATED: ${{ steps.judge.outputs.escalate }}
          ROW_REDACTIONS: ${{ steps.publish-filter.outputs.redactions }}
          ROW_GUARDRAIL_ACTION: ${{ steps.publish-filter.outputs.guardrail-action }}
          ROW_PR_URL: ${{ steps.draft-pr.outputs.url }}
          ROW_REPOSITORY: ${{ github.repository }}
        run: |
          set -euo pipefail
          STARTED_AT=$(gh api "repos/${ROW_REPOSITORY}/actions/runs/${ROW_RUN_ID}" --jq .run_started_at)
          FINISHED_AT=$(date -u +%FT%TZ)
          DURATION_SECONDS=$(( $(date -u -d "$FINISHED_AT" +%s) - $(date -u -d "$STARTED_AT" +%s) ))
          PR_NUMBER=""
          if [ -n "${ROW_PR_URL}" ]; then PR_NUMBER="${ROW_PR_URL##*/}"; fi

          ROW=$(jq -nc \
            --arg workflow "$ROW_WORKFLOW" \
            --arg run_id "$ROW_RUN_ID" \
            --arg run_url "$ROW_RUN_URL" \
            --arg trigger "$ROW_TRIGGER" \
            --arg environment "$ROW_ENVIRONMENT" \
            --arg issue_number "$ROW_ISSUE_NUMBER" \
            --arg model_id "$ROW_MODEL_ID" \
            --arg outcome "$ROW_OUTCOME" \
            --argjson escalated "${ROW_ESCALATED:-false}" \
            --arg redactions "${ROW_REDACTIONS:-}" \
            --arg guardrail_action "${ROW_GUARDRAIL_ACTION:-}" \
            --arg pr_number "$PR_NUMBER" \
            --argjson duration_seconds "$DURATION_SECONDS" \
            --arg finished_at "$FINISHED_AT" \
            '{
              workflow: $workflow, run_id: $run_id, run_url: $run_url, trigger: $trigger,
              environment: $environment,
              issue_number: (if $issue_number == "" then null else ($issue_number | tonumber) end),
              model_id: (if $model_id == "" then null else $model_id end),
              outcome: $outcome, escalated: $escalated,
              redactions: (if $redactions == "" then null else ($redactions | tonumber) end),
              guardrail_action: (if $guardrail_action == "" then null else $guardrail_action end),
              pr_number: (if $pr_number == "" then null else ($pr_number | tonumber) end),
              duration_seconds: $duration_seconds, finished_at: $finished_at
            }')
          echo "row=$ROW" >> "$GITHUB_OUTPUT"
          echo "key=curated/agent-runs/dt=$(date -u +%F)/${ROW_RUN_ID}-${{ github.run_attempt }}.json" >> "$GITHUB_OUTPUT"

      # steps.role.outputs.configured == 'true' alone is not enough: it only says the ARN was
      # present, not that 'Assume the read-only alarm triage role' actually configured
      # credentials. Checking that step's own outcome too avoids this write attempting without
      # credentials, and masking whatever really failed behind an unrelated "Unable to locate
      # credentials" error, when the role assumption itself fails.
      - name: Write the agent-run row to the lake
        if: always() && !cancelled() && steps.role.outputs.configured == 'true' && steps.assume-triage-role.outcome == 'success'
        uses: ./.github/actions/dora-row
        with:
          bucket: '${{ env.ENV_NAME }}-env-analytics-lake-${{ vars.SUBMIT_ACCOUNT_ID }}'
          key: ${{ steps.agent-run-row.outputs.key }}
          row: ${{ steps.agent-run-row.outputs.row }}

  # Looks up the customer behind a failed submission and writes the result to a file in the
  # private repository, then pings the operator on Telegram with the alarm name, the issue link
  # and the file's path. The file holds personal data, so it never goes to the issue, the run log
  # or the run summary. The job never fails the triage: continue-on-error is set, and the triage
  # job above does not depend on it. The lookup reads customer data, which the read-only alarm
  # triage role denies, so this job chains into the deployment role instead.
  customer-lookup:
    needs: triage
    if: >-
      needs.triage.outputs.proceed == 'true' &&
      (needs.triage.outputs.alarm-name == 'prod-env-hmrc-submission-failure' ||
      needs.triage.outputs.alarm-name == 'prod-env-itsa-submission-failure')
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    continue-on-error: true
    environment: prod
    permissions:
      id-token: write
      contents: read
    env:
      ALARM_NAME: ${{ needs.triage.outputs.alarm-name }}
      ALARM_REGION: ${{ needs.triage.outputs.region }}
      ALARM_WINDOW: ${{ needs.triage.outputs.window }}
      ALARM_TIMESTAMP: ${{ needs.triage.outputs.timestamp }}
      ISSUE_NUMBER: ${{ inputs.issue-number || github.event.issue.number }}
      ISSUE_URL: ${{ github.server_url }}/${{ github.repository }}/issues/${{ inputs.issue-number || github.event.issue.number }}
      PRIVATE_REPO: diy-accounting-uk/private.diyaccounting.co.uk
    steps:
      - name: Stop when the private repository deploy key is not set
        id: key
        env:
          PRIVATE_REPO_DEPLOY_KEY: ${{ secrets.PRIVATE_REPO_DEPLOY_KEY }}
        run: |
          if [ -z "${PRIVATE_REPO_DEPLOY_KEY}" ]; then
            echo "PRIVATE_REPO_DEPLOY_KEY is not set on the prod environment, so the customer lookup waits" | tee -a "$GITHUB_STEP_SUMMARY"
            echo "configured=false" | tee -a "$GITHUB_OUTPUT"
          else
            echo "configured=true" | tee -a "$GITHUB_OUTPUT"
          fi

      - name: Checkout
        if: steps.key.outputs.configured == 'true'
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      - name: Set up Node
        if: steps.key.outputs.configured == 'true'
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: ${{ env.NODE_VERSION }}

      - name: Configure AWS role via GitHub OIDC
        if: steps.key.outputs.configured == 'true'
        uses: aws-actions/configure-aws-credentials@e1253824e5c10ff9df46874f81ed3ec929e19cfd # v6
        with:
          role-to-assume: ${{ vars.SUBMIT_ACTIONS_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}
          role-chaining: false
          audience: sts.amazonaws.com
          role-skip-session-tagging: true
          output-credentials: true
          retry-max-attempts: 3

      - name: Assume AWS deployment role
        if: steps.key.outputs.configured == 'true'
        uses: aws-actions/configure-aws-credentials@e1253824e5c10ff9df46874f81ed3ec929e19cfd # v6
        with:
          role-to-assume: ${{ vars.SUBMIT_DEPLOY_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}
          role-chaining: true
          audience: sts.amazonaws.com
          role-skip-session-tagging: true
          output-credentials: true
          retry-max-attempts: 3

      - name: Install dependencies
        if: steps.key.outputs.configured == 'true'
        run: timeout 120 npm ci --prefer-offline || { sleep 30; timeout 180 npm ci; }

      - name: Verify the alarm actually fired
        if: steps.key.outputs.configured == 'true'
        run: |
          node scripts/verify-alarm-origin.mjs \
            --alarm-name "$ALARM_NAME" --window "$ALARM_WINDOW" --region "${ALARM_REGION:-eu-west-2}"

      - name: Look up the customer into a file
        if: steps.key.outputs.configured == 'true'
        run: |
          set -euo pipefail
          node scripts/alarm-customer-lookup.mjs \
            --alarm-name "$ALARM_NAME" --timestamp "$ALARM_TIMESTAMP" \
            --issue-number "$ISSUE_NUMBER" --issue-url "$ISSUE_URL" \
            --region "${ALARM_REGION:-eu-west-2}" --out "$RUNNER_TEMP/alarm-lookup.md"

      - name: Commit the file to the private repository
        if: steps.key.outputs.configured == 'true'
        id: private-commit
        env:
          PRIVATE_REPO_DEPLOY_KEY: ${{ secrets.PRIVATE_REPO_DEPLOY_KEY }}
        run: |
          set -euo pipefail
          KEY_FILE="$RUNNER_TEMP/private-repo-deploy-key"
          umask 077
          printf '%s\n' "$PRIVATE_REPO_DEPLOY_KEY" > "$KEY_FILE"
          export GIT_SSH_COMMAND="ssh -i $KEY_FILE -o IdentitiesOnly=yes -o StrictHostKeyChecking=accept-new"
          git clone --depth 1 "git@github.com:${PRIVATE_REPO}.git" "$RUNNER_TEMP/private"
          FILE_PATH="support/alarms/${ISSUE_NUMBER}-${ALARM_NAME}.md"
          mkdir -p "$RUNNER_TEMP/private/support/alarms"
          cp "$RUNNER_TEMP/alarm-lookup.md" "$RUNNER_TEMP/private/${FILE_PATH}"
          cd "$RUNNER_TEMP/private"
          git config user.name "submit-alarm-lookup"
          git config user.email "submit-alarm-lookup@users.noreply.github.com"
          git add "$FILE_PATH"
          git commit -m "Alarm lookup for #${ISSUE_NUMBER}: ${ALARM_NAME}"
          for ATTEMPT in 1 2 3; do
            if git push origin HEAD:main; then break; fi
            if [ "$ATTEMPT" = 3 ]; then exit 1; fi
            git pull --rebase origin main
          done
          rm -f "$KEY_FILE"
          echo "file-path=${FILE_PATH}" | tee -a "$GITHUB_OUTPUT"

      - name: Tell the operator on Telegram
        if: steps.private-commit.outcome == 'success'
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          FILE_PATH: ${{ steps.private-commit.outputs.file-path }}
        run: |
          set -euo pipefail
          CHAT_ID=$(sed -n 's/^TELEGRAM_OPS_CHAT_ID=\([-0-9]*\).*/\1/p' .env.prod | head -1)
          TEXT=$(printf '%s: customer lookup written to %s in %s\n%s' "$ALARM_NAME" "$FILE_PATH" "$PRIVATE_REPO" "$ISSUE_URL")
          curl --silent --show-error --fail --max-time 15 \
            --data-urlencode "chat_id=${CHAT_ID}" \
            --data-urlencode "text=${TEXT}" \
            "https://api.telegram.org/bot${TELEGRAM_BOT_TOKEN}/sendMessage" > /dev/null
