name: run migrations
run-name: "${{ inputs.phase }} migrations for ${{ inputs.environment-name }}"

on:
  workflow_dispatch:
    inputs:
      environment-name:
        type: choice
        description: 'Environment'
        required: true
        options:
          - 'ci'
          - 'prod'
      phase:
        description: 'Migration phase to run'
        type: choice
        options:
          - 'all'
          - 'pre-deploy'
          - 'post-deploy'
        required: true
        default: 'all'
  workflow_call:
    inputs:
      environment-name:
        type: string
        required: true
      phase:
        type: string
        required: false
        default: 'all'

env:
  NODE_VERSION: '24'
  AWS_REGION: 'eu-west-2'

jobs:
  migrate:
    name: 'run ${{ inputs.phase }} migrations (${{ inputs.environment-name }})'
    runs-on: ubuntu-24.04
    environment: ${{ inputs.environment-name }}
    permissions:
      id-token: write
      contents: read
    steps:
      - name: Configure AWS role via GitHub OIDC
        uses: aws-actions/configure-aws-credentials@v6
        with:
          role-to-assume: ${{ vars.SUBMIT_ACTIONS_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}
          role-chaining: false
          audience: sts.amazonaws.com
          role-skip-session-tagging: true
          output-credentials: true
          retry-max-attempts: 3

      - name: Assume AWS deployment role
        uses: aws-actions/configure-aws-credentials@v6
        with:
          role-to-assume: ${{ vars.SUBMIT_DEPLOY_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}
          role-chaining: true
          audience: sts.amazonaws.com
          role-skip-session-tagging: true
          output-credentials: true
          retry-max-attempts: 3

      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup Node
        uses: actions/setup-node@v6
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'

      - name: Install dependencies
        run: timeout 120 npm ci --prefer-offline || { sleep 30; timeout 180 npm ci; }
        timeout-minutes: 6
        env:
          NPM_CONFIG_FETCH_RETRIES: "3"

      - name: Lookup Cognito User Pool
        id: lookup-resources
        uses: './.github/actions/lookup-resources'
        with:
          environment-name: ${{ inputs.environment-name }}

      - name: Run migrations
        run: node scripts/migrations/runner.js --phase ${{ inputs.phase }}
        env:
          ENVIRONMENT_NAME: ${{ inputs.environment-name }}
          AWS_REGION: ${{ env.AWS_REGION }}
          COGNITO_USER_POOL_ID: ${{ steps.lookup-resources.outputs.cognito-user-pool-id }}
