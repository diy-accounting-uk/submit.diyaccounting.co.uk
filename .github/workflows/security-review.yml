# .github/workflows/security-review.yml

name: security-review
run-name: "Security Review [${{ github.ref_name }}]"

on:
  workflow_dispatch:
    inputs:
      target_branch:
        description: 'Target branch for PR'
        required: false
        default: 'main'
        type: string
      copilot_agent_login:
        description: 'GitHub Copilot agent login'
        required: false
        default: 'copilot-swe-agent'
        type: string
      skip_if_open_security_issues:
        description: 'Skip if security review issues already open'
        required: false
        default: true
        type: boolean
      issue_number:
        description: 'Assign Copilot to this existing issue instead of creating one'
        required: false
        type: string
  schedule:
    - cron: '0 6 * * 1' # Monday 06:00 UTC; the env block below supplies every input the schedule lacks

env:
  TARGET_BRANCH: ${{ inputs.target_branch || 'main' }}
  COPILOT_AGENT_LOGIN: ${{ inputs.copilot_agent_login || 'copilot-swe-agent' }}
  SKIP_IF_OPEN: ${{ inputs.skip_if_open_security_issues == null && 'true' || inputs.skip_if_open_security_issues }}

jobs:
  check-existing:
    name: 'Check for Existing Security Issues'
    if: ${{ !inputs.issue_number }}
    runs-on: ubuntu-latest
    permissions:
      contents: read
      issues: read
    outputs:
      should_create: ${{ steps.check.outputs.should_create }}
    steps:
      - name: Check for open security review issues
        id: check
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9
        with:
          script: |
            const skipIfOpen = '${{ env.SKIP_IF_OPEN }}' === 'true';

            if (!skipIfOpen) {
              core.setOutput('should_create', 'true');
              console.log('Skip check disabled - will create issue');
              return;
            }

            const { data: issues } = await github.rest.issues.listForRepo({
              owner: context.repo.owner,
              repo: context.repo.repo,
              state: 'open',
              labels: 'security-review',
              per_page: 1
            });

            const hasOpenIssue = issues.length > 0;
            core.setOutput('should_create', (!hasOpenIssue).toString());

            if (hasOpenIssue) {
              console.log(`Skipping: Found existing open security review issue #${issues[0].number}`);
            } else {
              console.log('No open security review issues found - will create one');
            }

  create-issue:
    name: 'Create Security Review Issue'
    needs: [check-existing]
    if: needs.check-existing.outputs.should_create == 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      issues: write
    outputs:
      issue_number: ${{ steps.create.outputs.issue_number }}
      issue_id: ${{ steps.create.outputs.issue_id }}
      issue_url: ${{ steps.create.outputs.issue_url }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - name: Create security review issue
        id: create
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9
        env:
          TARGET_BRANCH: ${{ env.TARGET_BRANCH }}
          WORKFLOW_NAME: ${{ github.workflow }}
          RUN_ID: ${{ github.run_id }}
          SERVER_URL: ${{ github.server_url }}
          REPOSITORY: ${{ github.repository }}
        with:
          script: |
            const fs = require('fs');

            const promptPath = 'prompts/security-review.md';
            if (!fs.existsSync(promptPath)) {
              core.setFailed(`Prompt file not found: ${promptPath}`);
              return;
            }

            const promptContent = fs.readFileSync(promptPath, 'utf8');
            const timestamp = new Date().toISOString().split('T')[0];

            const targetBranch = process.env.TARGET_BRANCH;
            const workflowName = process.env.WORKFLOW_NAME;
            const runId = process.env.RUN_ID;
            const serverUrl = process.env.SERVER_URL;
            const repository = process.env.REPOSITORY;

            const issueTitle = `Security Review: OWASP Top 10 Analysis (${timestamp})`;

            // Build issue body using array join to avoid YAML parsing issues with ** markdown
            const issueBody = [
              '## Automated Security Review Request',
              '',
              `__Target Branch:__ ${targetBranch}`,
              `__Triggered by:__ ${workflowName} workflow`,
              `__Run ID:__ [${runId}](${serverUrl}/${repository}/actions/runs/${runId})`,
              '',
              '---',
              '',
              promptContent,
              '',
              '---',
              '',
              '### Instructions for Copilot Agent',
              '',
              '1. Review each file pattern listed in the scope section',
              '2. Check for vulnerabilities in each OWASP category',
              '3. Document findings with file paths and line numbers',
              '4. Create a PR with fixes, grouped into logical commits',
              '5. If no vulnerabilities found, close this issue with a summary',
              '',
              `__Create a pull request targeting the \`${targetBranch}\` branch.__`
            ].join('\n');

            try {
              const repoQuery = `
                query($owner: String!, $name: String!) {
                  repository(owner: $owner, name: $name) {
                    id
                  }
                }
              `;

              const repoResult = await github.graphql(repoQuery, {
                owner: context.repo.owner,
                name: context.repo.repo
              });

              const createMutation = `
                mutation($repositoryId: ID!, $title: String!, $body: String!) {
                  createIssue(input: {
                    repositoryId: $repositoryId,
                    title: $title,
                    body: $body
                  }) {
                    issue {
                      id
                      number
                      url
                    }
                  }
                }
              `;

              const result = await github.graphql(createMutation, {
                repositoryId: repoResult.repository.id,
                title: issueTitle,
                body: issueBody
              });

              const issue = result.createIssue.issue;

              await github.rest.issues.addLabels({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: issue.number,
                labels: ['security-review', 'copilot-agent']
              });

              console.log(`Created issue #${issue.number}: ${issue.url}`);
              core.setOutput('issue_number', issue.number.toString());
              core.setOutput('issue_id', issue.id);
              core.setOutput('issue_url', issue.url);

            } catch (error) {
              core.setFailed(`Failed to create issue: ${error.message}`);
            }

  assign-copilot:
    name: 'Assign to Copilot Agent'
    needs: [check-existing, create-issue]
    if: |
      always() &&
      (
        (inputs.issue_number != '' && inputs.issue_number != null && needs.create-issue.result == 'skipped') ||
        (needs.check-existing.outputs.should_create == 'true' && needs.create-issue.result == 'success')
      )
    runs-on: ubuntu-latest
    permissions:
      contents: read
      issues: write
    steps:
      - name: Resolve target issue
        id: resolve-issue
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9
        with:
          script: |
            const dispatchedIssueNumber = '${{ inputs.issue_number }}';

            if (dispatchedIssueNumber) {
              const { data: issue } = await github.rest.issues.get({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: Number(dispatchedIssueNumber)
              });
              core.setOutput('issue_id', issue.node_id);
              core.setOutput('issue_number', issue.number.toString());
              core.setOutput('issue_url', issue.html_url);
            } else {
              core.setOutput('issue_id', '${{ needs.create-issue.outputs.issue_id }}');
              core.setOutput('issue_number', '${{ needs.create-issue.outputs.issue_number }}');
              core.setOutput('issue_url', '${{ needs.create-issue.outputs.issue_url }}');
            }

      # The workflow's own GITHUB_TOKEN goes first: run 35598208062 showed the App token's
      # suggestedActors call never lists copilot-swe-agent at all (only human collaborators),
      # so the App has no route to the actor regardless of what the mutation does with it.
      - name: Assign issue to Copilot (workflow token)
        id: assign-workflow-token
        continue-on-error: true
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9
        with:
          script: |
            const issueId = '${{ steps.resolve-issue.outputs.issue_id }}';
            const issueNumber = ${{ steps.resolve-issue.outputs.issue_number }};

            const actorsQuery = `
              query($owner: String!, $name: String!) {
                repository(owner: $owner, name: $name) {
                  suggestedActors(capabilities: [CAN_BE_ASSIGNED], first: 100) {
                    nodes {
                      login
                      __typename
                      ... on Bot { id }
                      ... on User { id }
                    }
                  }
                }
              }
            `;

            const actorsResult = await github.graphql(actorsQuery, {
              owner: context.repo.owner,
              name: context.repo.repo
            });

            const suggestedLogins = actorsResult.repository.suggestedActors.nodes.map(n => n.login);
            console.log('Suggested actors (workflow token):', suggestedLogins);

            const copilotBot = actorsResult.repository.suggestedActors.nodes.find(
              actor => actor.login === '${{ env.COPILOT_AGENT_LOGIN }}'
            );

            if (!copilotBot) {
              core.setOutput('assigned', 'false');
              core.setOutput('reason', 'actor-not-suggested');
              return;
            }

            const assignMutation = `
              mutation($assignableId: ID!, $actorIds: [ID!]!) {
                replaceActorsForAssignable(input: {
                  assignableId: $assignableId,
                  actorIds: $actorIds
                }) {
                  assignable {
                    ... on Issue {
                      assignees(first: 5) {
                        nodes { login }
                      }
                    }
                  }
                }
              }
            `;

            const assignResult = await github.graphql(assignMutation, {
              assignableId: issueId,
              actorIds: [copilotBot.id]
            });

            const assignees = assignResult.replaceActorsForAssignable.assignable.assignees.nodes.map(n => n.login);
            console.log('Assignees after mutation (workflow token):', assignees);

            if (assignees.includes('${{ env.COPILOT_AGENT_LOGIN }}')) {
              core.setOutput('assigned', 'true');
              console.log(`Assigned issue #${issueNumber} to ${{ env.COPILOT_AGENT_LOGIN }}`);
            } else {
              core.setOutput('assigned', 'false');
              core.setOutput('reason', 'mutation-left-assignee-absent');
            }

      - name: Mint an App token
        id: app-token
        if: steps.assign-workflow-token.outputs.assigned != 'true'
        uses: actions/create-github-app-token@fee1f7d63c2ff003460e3d139729b119787bc349 # v2.2.2
        with:
          app-id: ${{ vars.AGENT_APP_ID }}
          private-key: ${{ secrets.AGENT_APP_PRIVATE_KEY }}

      - name: Assign issue to Copilot (GitHub App token)
        id: assign-app-token
        if: steps.assign-workflow-token.outputs.assigned != 'true'
        continue-on-error: true
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9
        with:
          github-token: ${{ steps.app-token.outputs.token }}
          script: |
            const issueId = '${{ steps.resolve-issue.outputs.issue_id }}';
            const issueNumber = ${{ steps.resolve-issue.outputs.issue_number }};

            const actorsQuery = `
              query($owner: String!, $name: String!) {
                repository(owner: $owner, name: $name) {
                  suggestedActors(capabilities: [CAN_BE_ASSIGNED], first: 100) {
                    nodes {
                      login
                      __typename
                      ... on Bot { id }
                      ... on User { id }
                    }
                  }
                }
              }
            `;

            const actorsResult = await github.graphql(actorsQuery, {
              owner: context.repo.owner,
              name: context.repo.repo
            });

            const suggestedLogins = actorsResult.repository.suggestedActors.nodes.map(n => n.login);
            console.log('Suggested actors (App token):', suggestedLogins);

            const copilotBot = actorsResult.repository.suggestedActors.nodes.find(
              actor => actor.login === '${{ env.COPILOT_AGENT_LOGIN }}'
            );

            if (!copilotBot) {
              core.setOutput('assigned', 'false');
              core.setOutput('reason', 'actor-not-suggested');
              return;
            }

            const assignMutation = `
              mutation($assignableId: ID!, $actorIds: [ID!]!) {
                replaceActorsForAssignable(input: {
                  assignableId: $assignableId,
                  actorIds: $actorIds
                }) {
                  assignable {
                    ... on Issue {
                      assignees(first: 5) {
                        nodes { login }
                      }
                    }
                  }
                }
              }
            `;

            const assignResult = await github.graphql(assignMutation, {
              assignableId: issueId,
              actorIds: [copilotBot.id]
            });

            const assignees = assignResult.replaceActorsForAssignable.assignable.assignees.nodes.map(n => n.login);
            console.log('Assignees after mutation (App token):', assignees);

            if (assignees.includes('${{ env.COPILOT_AGENT_LOGIN }}')) {
              core.setOutput('assigned', 'true');
              console.log(`Assigned issue #${issueNumber} to ${{ env.COPILOT_AGENT_LOGIN }}`);
            } else {
              core.setOutput('assigned', 'false');
              core.setOutput('reason', 'mutation-left-assignee-absent');
            }

      - name: Fail if Copilot was not assigned
        if: steps.assign-workflow-token.outputs.assigned != 'true' && steps.assign-app-token.outputs.assigned != 'true'
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9
        with:
          script: |
            const workflowReason = '${{ steps.assign-workflow-token.outputs.reason }}' || '${{ steps.assign-workflow-token.outcome }}';
            const appReason = '${{ steps.assign-app-token.outputs.reason }}' || '${{ steps.assign-app-token.outcome }}';
            core.setFailed(
              `Copilot was not assigned to issue #${{ steps.resolve-issue.outputs.issue_number }}. ` +
              `Workflow token: ${workflowReason}. App token: ${appReason}.`
            );

      - name: Summary
        if: always()
        run: |
          echo "## Security Review Issue"
          echo ""
          echo "**Issue:** #${{ steps.resolve-issue.outputs.issue_number }}"
          echo "**URL:** ${{ steps.resolve-issue.outputs.issue_url }}"
          echo "**Assigned to:** ${{ env.COPILOT_AGENT_LOGIN }}"
          echo "**Assigned via:** ${{ steps.assign-workflow-token.outputs.assigned == 'true' && 'workflow token' || (steps.assign-app-token.outputs.assigned == 'true' && 'App token' || 'not assigned') }}"
