name: support-triage
run-name: support triage

# Drafts the reply to a support ticket that the operator has approved. A ticket from the public
# form lands in private.diyaccounting.co.uk behind the `maintainer-review` label. support-reader.yml
# posts a code-checked summary on it. The operator reads both and removes the label, and this
# workflow then handles the ticket. No agent run starts from the label's presence, from an
# `issues` event or from any text in a ticket: a poll every ten minutes (or a dispatch) looks for
# issues that scripts/maintainer-review-gate.mjs approves.
#
# The handling agent never sees the ticket. It reads the reader's checked fields and the
# operator's later comments from one file, and it has Read, Grep and Glob only. It chains into
# the same read-only role alarm-triage.yml uses (see ObservabilityStack.java's alarmTriageRole)
# for the Bedrock model invocation and the guardrail's SSM parameters that the shared
# publish-filter action needs. Only the `sweep` job edits a label on the private repository or
# closes an issue, and only for the operator's `rejected` label: it closes a `rejected` issue with
# no comment, and puts `maintainer-review` back when the operator removes `rejected`. The gate
# also refuses while `injection-suspected` is on an issue. When the agent judges that a ticket needs a change, the fix-pr job opens a draft
# pull request in this repository from the checked fields alone.
#
# This repository is public, so its logs, step summaries and artifacts are public. No step prints
# ticket-derived text, the drafted reply or the model's result, and no job uploads an artifact.
# Jobs pass that text to each other only as job outputs encrypted with a key from a secret: a
# step that reads a job output shows the value in its own log header. The drafted reply reaches
# the private issue as a comment and, when a dispatch names a Gmail thread, the support mailbox as
# an unsent draft.

on:
  schedule:
    - cron: '7-59/10 * * * *'
  workflow_dispatch:
    inputs:
      issue-number:
        description: the private support issue to handle; empty handles the oldest approved one
        required: false
        type: string
      retriage:
        description: with issue-number, handle that issue again although it already has a handled comment; every gate still applies
        required: false
        type: boolean
        default: false
      gmail-thread-id:
        description: the Gmail thread of the customer's message in the support mailbox; empty skips the draft
        required: false
        type: string
      reply-to:
        description: the customer's address, for the Gmail draft
        required: false
        type: string
      reply-subject:
        description: the subject of the customer's message, for the Gmail draft
        required: false
        type: string
      reply-message-id:
        description: the Message-ID header of the customer's message, for the Gmail draft
        required: false
        type: string

permissions: {}

concurrency:
  group: support-triage
  cancel-in-progress: false

env:
  AWS_REGION: 'eu-west-2'
  CLAUDE_CODE_VERSION: '2.0.30'
  MODEL_ID: 'eu.anthropic.claude-haiku-4-5-20251001-v1:0'
  PRIVATE_REPO: diy-accounting-uk/private.diyaccounting.co.uk
  # The one place this number is written. The budget guard and its step name read it.
  SUPPORT_TRIAGE_BUDGET_PER_DAY: '8'

jobs:
  # Applies the operator's `rejected` label before an issue is picked. It holds a token that
  # writes issues in the private repository and no AWS credentials. A failed sweep does not stop
  # the pick, because the gate refuses a `rejected` issue on its own.
  sweep:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    environment: prod
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      - name: Set up the toolchain
        uses: ./.github/actions/setup-toolchain
        with:
          npm-install: scripts
          npm-cache: 'false'

      - name: Generate a token that writes issues in the private repository
        id: private-token
        uses: actions/create-github-app-token@fee1f7d63c2ff003460e3d139729b119787bc349 # v2.2.2
        with:
          app-id: ${{ vars.AGENT_APP_ID }}
          private-key: ${{ secrets.AGENT_APP_PRIVATE_KEY }}
          owner: diy-accounting-uk
          repositories: private.diyaccounting.co.uk
          permission-issues: write

      - name: Close rejected issues and restore the review label
        env:
          GH_TOKEN: ${{ steps.private-token.outputs.token }}
        run: node scripts/support-label-sweep.mjs sweep --repo "$PRIVATE_REPO"

  # Finds the oldest open support issue that the maintainer-review gate approves, that has a
  # valid reader comment and that has no handled comment. Support tickets are always prod, so
  # every job here runs in the prod environment.
  select:
    needs: sweep
    if: always() && !cancelled()
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    environment: prod
    permissions:
      contents: read
      actions: read
    outputs:
      issue-number: ${{ steps.pick.outputs.issue-number }}
      proceed: ${{ steps.pick.outputs.issue-number != '' && steps.budget-guard.outputs.over-budget == 'false' }}
      handling-input: ${{ steps.hand-on.outputs.handling-input }}
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      - name: Set up the toolchain
        uses: ./.github/actions/setup-toolchain
        with:
          npm-install: scripts
          npm-cache: 'false'

      - name: Generate a token that reads issues in the private repository
        id: private-token
        uses: actions/create-github-app-token@fee1f7d63c2ff003460e3d139729b119787bc349 # v2.2.2
        with:
          app-id: ${{ vars.AGENT_APP_ID }}
          private-key: ${{ secrets.AGENT_APP_PRIVATE_KEY }}
          owner: diy-accounting-uk
          repositories: private.diyaccounting.co.uk
          permission-issues: read

      - name: Pick the oldest approved issue and write its handling input
        id: pick
        env:
          GH_TOKEN: ${{ steps.private-token.outputs.token }}
          ISSUE_INPUT: ${{ inputs.issue-number }}
          RETRIAGE_INPUT: ${{ inputs.retriage }}
        run: |
          set -euo pipefail
          ARGS=()
          if [ -n "${ISSUE_INPUT}" ]; then
            ARGS+=(--issue "${ISSUE_INPUT}")
            if [ "${RETRIAGE_INPUT}" = "true" ]; then ARGS+=(--retriage); fi
          fi
          node scripts/support-handling-input.mjs --out /tmp/support-handling-input.json "${ARGS[@]}"

      # Counting reads the job history of every run in the last day, so it runs only when there
      # is an approved issue; most polls find none.
      - name: Stop once ${{ env.SUPPORT_TRIAGE_BUDGET_PER_DAY }} triage runs have already posted a result today
        if: steps.pick.outputs.issue-number != ''
        id: budget-guard
        uses: ./.github/actions/agent-run-budget
        with:
          workflow-file: support-triage.yml
          job-name: post
          step-name: Comment the triage
          budget: ${{ env.SUPPORT_TRIAGE_BUDGET_PER_DAY }}

      - name: Hand the input on, encrypted
        if: steps.pick.outputs.issue-number != '' && steps.budget-guard.outputs.over-budget == 'false'
        id: hand-on
        env:
          TRANSIT_KEY: ${{ secrets.AGENT_APP_PRIVATE_KEY }}
        run: |
          set -euo pipefail
          TRANSIT_PASS=$(printf '%s' "${TRANSIT_KEY}${GITHUB_RUN_ID}" | sha256sum | cut -d' ' -f1)
          export TRANSIT_PASS
          echo "handling-input=$(openssl enc -aes-256-cbc -pbkdf2 -salt -a -A -pass env:TRANSIT_PASS < /tmp/support-handling-input.json)" >> "$GITHUB_OUTPUT"

  # Holds AWS credentials for the alarm triage role and no GitHub token. It writes the drafted
  # comment and reply, encrypted, as job outputs.
  handle:
    needs: select
    if: needs.select.outputs.proceed == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    environment: prod
    permissions:
      id-token: write
      contents: read
    env:
      ISSUE_NUMBER: ${{ needs.select.outputs.issue-number }}
      RUN_URL: '${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}'
      RETRIAGE_INPUT: ${{ inputs.retriage }}
    outputs:
      comment: ${{ steps.build.outputs.comment }}
      reply: ${{ steps.build.outputs.reply }}
      stopped: ${{ steps.triage-run.outputs.stopped }}
      resolution: ${{ steps.build.outputs.resolution }}
      redactions: ${{ steps.publish-filter.outputs.redactions }}
      guardrail-action: ${{ steps.publish-filter.outputs.guardrail-action }}
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      - name: Set up the toolchain
        uses: ./.github/actions/setup-toolchain
        with:
          npm-install: none
          npm-cache: 'false'

      - name: Assume the AWS actions and deployment roles
        uses: ./.github/actions/aws-role
        with:
          actions-role-arn: ${{ vars.SUBMIT_ACTIONS_ROLE_ARN }}
          deploy-role-arn: ${{ vars.SUBMIT_ALARM_TRIAGE_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Stop when the agent kill switch is on
        uses: ./.github/actions/agent-kill-switch
        with:
          environment-name: prod

      - name: Write the handling input for the agent to read
        env:
          TRANSIT_KEY: ${{ secrets.AGENT_APP_PRIVATE_KEY }}
          HANDLING_INPUT_ENCRYPTED: ${{ needs.select.outputs.handling-input }}
        run: |
          set -euo pipefail
          TRANSIT_PASS=$(printf '%s' "${TRANSIT_KEY}${GITHUB_RUN_ID}" | sha256sum | cut -d' ' -f1)
          export TRANSIT_PASS
          printf '%s' "$HANDLING_INPUT_ENCRYPTED" | openssl enc -d -aes-256-cbc -pbkdf2 -a -A -pass env:TRANSIT_PASS > /tmp/support-handling-input.json
          jq -e '.issueNumber' /tmp/support-handling-input.json > /dev/null

      - name: Install Claude Code
        run: npm install -g "@anthropic-ai/claude-code@${CLAUDE_CODE_VERSION}"

      - name: Run triage
        uses: ./.github/actions/run-triage-agent
        with:
          model-id: ${{ env.MODEL_ID }}
          small-fast-model-id: ${{ env.MODEL_ID }}
          allowed-tools: 'Read,Grep,Glob'
          output-file: /tmp/support-triage.json
          prompt-file: prompts/support-triage.md
          echo-output: 'false'

      # Prints the kind of result and nothing from it.
      - name: Require a usable result
        id: triage-run
        run: |
          set -o pipefail
          node scripts/triage-result-verdict.mjs /tmp/support-triage.json > /tmp/support-verdict.txt
          VERDICT=$(sed -n 's/^verdict=//p' /tmp/support-verdict.txt)
          REASON=$(sed -n 's/^reason=//p' /tmp/support-verdict.txt)
          case "$VERDICT" in
            complete)
              echo "stopped=false" >> "$GITHUB_OUTPUT"
              ;;
            max_turns | incomplete)
              echo "triage stopped before an answer: ${REASON}"
              echo "stopped=${VERDICT}" >> "$GITHUB_OUTPUT"
              ;;
            *)
              echo "triage produced no answer (subtype: $(jq -r '.subtype // "none"' /tmp/support-triage.json))"
              exit 1
              ;;
          esac

      - name: Filter the triage answer before it is published
        id: publish-filter
        uses: ./.github/actions/publish-filter
        with:
          input-file: /tmp/support-triage.json
          format: claude-json
          environment-name: prod
          model-id: ${{ env.MODEL_ID }}
          workflow-name: support-triage
          run-number: ${{ github.run_number }}
          run-url: ${{ env.RUN_URL }}
          echo-output: 'false'

      # The filtered file holds both sections plus the closing byline. The article link is built
      # by code from an FAQ id, the category comes from the reader's checked fields, and every
      # URL the model wrote is removed. A missing "## Drafted reply" heading means the split
      # cannot be trusted, so the run fails before anything is posted.
      - name: Build the comment and the reply
        id: build
        env:
          TRANSIT_KEY: ${{ secrets.AGENT_APP_PRIVATE_KEY }}
        run: |
          set -euo pipefail
          FINAL="${{ steps.publish-filter.outputs.output-file }}"
          if ! grep -q '^## Drafted reply$' "$FINAL"; then
            echo "::error::the triage answer has no '## Drafted reply' heading; nothing is posted"
            exit 1
          fi
          CATEGORY=$(jq -r '.category' /tmp/support-handling-input.json)
          case "$CATEGORY" in
            connection|submission|bundles|receipts|other) ;;
            *) echo "::error::the handling input holds no valid category"; exit 1 ;;
          esac
          # The resolution is the word fix or the word answer and nothing else. Any other text,
          # or no section, counts as answer, so a malformed section never opens a pull request.
          RESOLUTION=$(awk '/^## Drafted reply$/{exit} /^## Resolution$/{flag=1; next} /^## /{flag=0} flag && NF {print; exit}' "$FINAL" | tr -d '`*_ .' | tr '[:upper:]' '[:lower:]')
          case "$RESOLUTION" in
            fix) ;;
            *) RESOLUTION=answer ;;
          esac
          awk '/^## Drafted reply$/{exit} /^## Resolution$/{skip=1; next} /^## /{skip=0} !skip {print}' "$FINAL" > /tmp/support-matched.md
          node scripts/support-triage-public-half.mjs web/public/faqs.toml /tmp/support-matched.md
          awk '/^## Drafted reply$/{flag=1; next} flag' "$FINAL" | grep -v '^_Written by ' > /tmp/support-reply-body.md || true
          node scripts/support-triage-public-half.mjs web/public/faqs.toml /tmp/support-reply-body.md
          MARKER_SUFFIX=""
          if [ "$RETRIAGE_INPUT" = "true" ]; then MARKER_SUFFIX=" retriage=true"; fi
          {
            echo "<!-- support-handled:v1 run=${GITHUB_RUN_ID}${MARKER_SUFFIX} -->"
            cat /tmp/support-matched.md
            printf '## Resolution\n\n%s\n\n## Category\n\n%s\n\n## Drafted reply\n\n' "$RESOLUTION" "$CATEGORY"
            cat /tmp/support-reply-body.md
            echo
            grep '^_Written by ' "$FINAL" | tail -1
          } > /tmp/support-comment.md
          {
            echo "Drafted by an AI from a support ticket and not yet reviewed by a person. Read and edit before sending."
            echo
            cat /tmp/support-reply-body.md
          } > /tmp/support-reply.md
          TRANSIT_PASS=$(printf '%s' "${TRANSIT_KEY}${GITHUB_RUN_ID}" | sha256sum | cut -d' ' -f1)
          export TRANSIT_PASS
          echo "resolution=${RESOLUTION}" >> "$GITHUB_OUTPUT"
          echo "comment=$(openssl enc -aes-256-cbc -pbkdf2 -salt -a -A -pass env:TRANSIT_PASS < /tmp/support-comment.md)" >> "$GITHUB_OUTPUT"
          echo "reply=$(openssl enc -aes-256-cbc -pbkdf2 -salt -a -A -pass env:TRANSIT_PASS < /tmp/support-reply.md)" >> "$GITHUB_OUTPUT"

  # Holds a token that writes to the private repository's issues and no AWS credentials. The gate
  # runs again here, so an issue the operator re-labelled while the agent ran gets no comment.
  post:
    needs: [select, handle]
    if: needs.handle.result == 'success'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    environment: prod
    permissions:
      contents: read
    env:
      ISSUE_NUMBER: ${{ needs.select.outputs.issue-number }}
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      - name: Set up the toolchain
        uses: ./.github/actions/setup-toolchain
        with:
          npm-install: none
          npm-cache: 'false'

      - name: Generate a token that writes issues in the private repository
        id: private-token
        uses: actions/create-github-app-token@fee1f7d63c2ff003460e3d139729b119787bc349 # v2.2.2
        with:
          app-id: ${{ vars.AGENT_APP_ID }}
          private-key: ${{ secrets.AGENT_APP_PRIVATE_KEY }}
          owner: diy-accounting-uk
          repositories: private.diyaccounting.co.uk
          permission-issues: write

      - name: Check the maintainer-review gate again
        env:
          GH_TOKEN: ${{ steps.private-token.outputs.token }}
        run: node scripts/maintainer-review-gate.mjs --repo "$PRIVATE_REPO" --issue "$ISSUE_NUMBER"

      - name: Decrypt the comment
        env:
          TRANSIT_KEY: ${{ secrets.AGENT_APP_PRIVATE_KEY }}
          COMMENT_ENCRYPTED: ${{ needs.handle.outputs.comment }}
        run: |
          set -euo pipefail
          TRANSIT_PASS=$(printf '%s' "${TRANSIT_KEY}${GITHUB_RUN_ID}" | sha256sum | cut -d' ' -f1)
          export TRANSIT_PASS
          printf '%s' "$COMMENT_ENCRYPTED" | openssl enc -d -aes-256-cbc -pbkdf2 -a -A -pass env:TRANSIT_PASS > /tmp/support-comment.md

      - name: Comment the triage
        id: comment-triage
        env:
          GH_TOKEN: ${{ steps.private-token.outputs.token }}
        run: node scripts/github-issue-comment.mjs --repo "$PRIVATE_REPO" --issue "$ISSUE_NUMBER" --body-file /tmp/support-comment.md

      # Runs after the comment is posted, so the answer is not lost, but the run still ends red:
      # a triage that stopped before an answer is not a clean pass.
      - name: Fail the run when triage stopped early
        if: needs.handle.outputs.stopped == 'max_turns' || needs.handle.outputs.stopped == 'incomplete'
        run: |
          echo "failing the run: triage stopped before an answer"
          exit 1

  # Opens a draft pull request in this repository when the handling agent judged that the ticket
  # needs a change. Code builds the branch name, the one file under support/ and the body from the
  # reader's checked fields and the operator's comments; no text the agent wrote reaches them. The
  # job holds no AWS credentials. It holds two tokens: contents and pull-requests write on this
  # repository only, and issues write on the private repository, for the one comment that links the
  # pull request. Merging the pull request is the job of /auto-merge. Closing the private issue
  # once the fix is live would be a later workflow that reads the issue number from the merged
  # pull request's file name, support/<issue>-<category>.md; nothing here closes an issue.
  fix-pr:
    needs: [select, handle, post]
    if: needs.post.result == 'success' && needs.handle.outputs.resolution == 'fix' && needs.handle.outputs.stopped == 'false'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    environment: prod
    permissions:
      contents: read
    env:
      ISSUE_NUMBER: ${{ needs.select.outputs.issue-number }}
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      - name: Set up the toolchain
        uses: ./.github/actions/setup-toolchain
        with:
          npm-install: scripts
          npm-cache: 'false'

      - name: Generate a token that writes issues in the private repository
        id: private-token
        uses: actions/create-github-app-token@fee1f7d63c2ff003460e3d139729b119787bc349 # v2.2.2
        with:
          app-id: ${{ vars.AGENT_APP_ID }}
          private-key: ${{ secrets.AGENT_APP_PRIVATE_KEY }}
          owner: diy-accounting-uk
          repositories: private.diyaccounting.co.uk
          permission-issues: write

      - name: Generate a token that opens a pull request in this repository
        id: repo-token
        uses: actions/create-github-app-token@fee1f7d63c2ff003460e3d139729b119787bc349 # v2.2.2
        with:
          app-id: ${{ vars.AGENT_APP_ID }}
          private-key: ${{ secrets.AGENT_APP_PRIVATE_KEY }}
          owner: diy-accounting-uk
          repositories: submit.diyaccounting.co.uk
          permission-contents: write
          permission-pull-requests: write

      - name: Check the maintainer-review gate again
        env:
          GH_TOKEN: ${{ steps.private-token.outputs.token }}
        run: node scripts/maintainer-review-gate.mjs --repo "$PRIVATE_REPO" --issue "$ISSUE_NUMBER"

      - name: Decrypt the handling input
        env:
          TRANSIT_KEY: ${{ secrets.AGENT_APP_PRIVATE_KEY }}
          HANDLING_INPUT_ENCRYPTED: ${{ needs.select.outputs.handling-input }}
        run: |
          set -euo pipefail
          TRANSIT_PASS=$(printf '%s' "${TRANSIT_KEY}${GITHUB_RUN_ID}" | sha256sum | cut -d' ' -f1)
          export TRANSIT_PASS
          printf '%s' "$HANDLING_INPUT_ENCRYPTED" | openssl enc -d -aes-256-cbc -pbkdf2 -a -A -pass env:TRANSIT_PASS > /tmp/support-handling-input.json

      - name: Build the row file and the pull request body
        id: build-row
        run: node scripts/support-fix-pr.mjs --input /tmp/support-handling-input.json --body-file /tmp/support-fix-body.md

      - name: Commit the row on a new branch
        env:
          GH_TOKEN: ${{ steps.repo-token.outputs.token }}
          BRANCH: ${{ steps.build-row.outputs.branch }}
          MODEL_ID_FOR_TRAILER: ${{ env.MODEL_ID }}
        run: |
          set -euo pipefail
          printf 'Support fix row for private issue #%s\n\nCo-Authored-By: Claude <noreply@anthropic.com>\nClaude-Model: %s\nClaude-Run: %s' \
            "$ISSUE_NUMBER" "$MODEL_ID_FOR_TRAILER" "${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}" > /tmp/support-fix-commit.txt
          scripts/github-api-commit.sh --repo "${{ github.repository }}" --branch "$BRANCH" \
            --base-sha "$(git rev-parse HEAD)" --message-file /tmp/support-fix-commit.txt

      # The label is created on first use. Its repository is always this one.
      - name: Open the draft pull request
        id: open-pr
        env:
          GH_TOKEN: ${{ steps.repo-token.outputs.token }}
          BRANCH: ${{ steps.build-row.outputs.branch }}
          PR_TITLE: ${{ steps.build-row.outputs.title }}
        run: |
          set -euo pipefail
          gh label create "origin:support" --color 5319e7 --description "Opened from a support ticket the operator approved" --repo "${{ github.repository }}" 2>/dev/null || true
          PR_URL=$(gh pr create --draft --base main --head "$BRANCH" --repo "${{ github.repository }}" \
            --title "$PR_TITLE" --body-file /tmp/support-fix-body.md --label "origin:support")
          echo "url=${PR_URL}" >> "$GITHUB_OUTPUT"

      - name: Comment the pull request link on the private issue
        env:
          GH_TOKEN: ${{ steps.private-token.outputs.token }}
          PR_URL: ${{ steps.open-pr.outputs.url }}
        run: |
          set -euo pipefail
          printf '<!-- support-fix-pr:v1 run=%s -->\nDraft pull request for this ticket: %s\n' "$GITHUB_RUN_ID" "$PR_URL" > /tmp/support-fix-comment.md
          node scripts/github-issue-comment.mjs --repo "$PRIVATE_REPO" --issue "$ISSUE_NUMBER" --body-file /tmp/support-fix-comment.md

  # The draft goes into the support mailbox unsent; this workflow has no send step and the key's
  # only scope is gmail.compose. The thread comes from the dispatch inputs and never from a
  # ticket. A ticket from the public form carries no address, so it has no thread and the draft
  # waits for a dispatch that names one.
  draft:
    needs: [select, handle, post]
    if: needs.post.result == 'success' && inputs.gmail-thread-id != ''
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    environment: prod
    permissions:
      contents: read
      id-token: write
    env:
      ISSUE_NUMBER: ${{ needs.select.outputs.issue-number }}
    steps:
      - name: Stop when no Gmail draft can be made
        id: draft-key
        env:
          SUPPORT_GMAIL_DRAFT_KEY: ${{ secrets.SUPPORT_GMAIL_DRAFT_KEY }}
        run: |
          if [ -z "${SUPPORT_GMAIL_DRAFT_KEY}" ]; then
            echo "SUPPORT_GMAIL_DRAFT_KEY is not set on the prod environment, so no Gmail draft is made"
            echo "configured=false" >> "$GITHUB_OUTPUT"
          else
            echo "configured=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Checkout
        if: steps.draft-key.outputs.configured == 'true'
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      - name: Set up the toolchain
        if: steps.draft-key.outputs.configured == 'true'
        uses: ./.github/actions/setup-toolchain
        with:
          npm-install: none
          npm-cache: 'false'

      - name: Install dependencies for the Gmail draft
        if: steps.draft-key.outputs.configured == 'true'
        run: timeout 120 npm ci --prefer-offline || { sleep 30; timeout 180 npm ci; }

      - name: Decrypt the reply
        if: steps.draft-key.outputs.configured == 'true'
        env:
          TRANSIT_KEY: ${{ secrets.AGENT_APP_PRIVATE_KEY }}
          REPLY_ENCRYPTED: ${{ needs.handle.outputs.reply }}
        run: |
          set -euo pipefail
          TRANSIT_PASS=$(printf '%s' "${TRANSIT_KEY}${GITHUB_RUN_ID}" | sha256sum | cut -d' ' -f1)
          export TRANSIT_PASS
          printf '%s' "$REPLY_ENCRYPTED" | openssl enc -d -aes-256-cbc -pbkdf2 -a -A -pass env:TRANSIT_PASS > /tmp/support-reply.md

      - name: Put the drafted reply in the support mailbox
        if: steps.draft-key.outputs.configured == 'true'
        id: gmail-draft
        continue-on-error: true
        env:
          SUPPORT_GMAIL_DRAFT_KEY: ${{ secrets.SUPPORT_GMAIL_DRAFT_KEY }}
          GMAIL_THREAD_ID: ${{ inputs.gmail-thread-id }}
          REPLY_TO: ${{ inputs.reply-to }}
          REPLY_SUBJECT: ${{ inputs.reply-subject }}
          REPLY_MESSAGE_ID: ${{ inputs.reply-message-id }}
        run: |
          set -euo pipefail
          node scripts/support-gmail-draft.mjs \
            --thread-id "$GMAIL_THREAD_ID" --to "$REPLY_TO" --subject "$REPLY_SUBJECT" \
            --in-reply-to "$REPLY_MESSAGE_ID" --body-file /tmp/support-reply.md \
            --issue-number "$ISSUE_NUMBER" --out /tmp/support-draft-row.json
          echo "row=$(cat /tmp/support-draft-row.json)" >> "$GITHUB_OUTPUT"
          echo "key=curated/support-drafts/dt=$(date -u +%F)/${{ github.run_id }}-${{ github.run_attempt }}.json" >> "$GITHUB_OUTPUT"

      - name: Assume the AWS actions and deployment roles
        if: steps.gmail-draft.outcome == 'success'
        uses: ./.github/actions/aws-role
        with:
          actions-role-arn: ${{ vars.SUBMIT_ACTIONS_ROLE_ARN }}
          deploy-role-arn: ${{ vars.SUBMIT_ALARM_TRIAGE_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}

      # The acceptance measure: one row per draft. Comparing these rows with the mail the
      # mailbox later sent gives the share of drafts sent as written.
      - name: Write the support draft row to the lake
        if: steps.gmail-draft.outcome == 'success'
        uses: ./.github/actions/dora-row
        with:
          bucket: 'prod-env-analytics-lake-${{ vars.SUBMIT_ACCOUNT_ID }}'
          key: ${{ steps.gmail-draft.outputs.key }}
          row: ${{ steps.gmail-draft.outputs.row }}

  # Agent-run ledger row for the one-stop dashboard (v_agent_runs_daily): one row per run that
  # got as far as the agent. The row holds the outcome, the counts and the run. It holds no
  # ticket, model or reply text.
  ledger:
    needs: [select, handle, post]
    if: always() && !cancelled() && needs.select.outputs.proceed == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    environment: prod
    permissions:
      id-token: write
      contents: read
      actions: read
    steps:
      - name: Checkout the ledger action
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          sparse-checkout: |
            .github/actions/dora-row
            .github/actions/aws-role
          sparse-checkout-cone-mode: false
          persist-credentials: false

      - name: Assume the AWS actions and deployment roles
        uses: ./.github/actions/aws-role
        with:
          actions-role-arn: ${{ vars.SUBMIT_ACTIONS_ROLE_ARN }}
          deploy-role-arn: ${{ vars.SUBMIT_ALARM_TRIAGE_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Build the agent-run row
        id: agent-run-row
        env:
          GH_TOKEN: ${{ github.token }}
          HANDLE_RESULT: ${{ needs.handle.result }}
          POST_RESULT: ${{ needs.post.result }}
          STOPPED: ${{ needs.handle.outputs.stopped }}
          ISSUE_NUMBER: ${{ needs.select.outputs.issue-number }}
          ROW_REDACTIONS: ${{ needs.handle.outputs.redactions }}
          ROW_GUARDRAIL_ACTION: ${{ needs.handle.outputs.guardrail-action }}
        run: |
          set -euo pipefail
          if [ "$POST_RESULT" = "success" ] && { [ "$STOPPED" = "max_turns" ] || [ "$STOPPED" = "incomplete" ]; }; then OUTCOME=max-turns
          elif [ "$POST_RESULT" = "success" ]; then OUTCOME=posted
          elif [ "$HANDLE_RESULT" = "failure" ]; then OUTCOME=no-answer
          elif [ "$POST_RESULT" = "failure" ]; then OUTCOME=post-failed
          else OUTCOME=no-action
          fi
          STARTED_AT=$(gh api "repos/${{ github.repository }}/actions/runs/${{ github.run_id }}" --jq .run_started_at)
          FINISHED_AT=$(date -u +%FT%TZ)
          DURATION_SECONDS=$(( $(date -u -d "$FINISHED_AT" +%s) - $(date -u -d "$STARTED_AT" +%s) ))
          ROW=$(jq -nc \
            --arg run_id "${{ github.run_id }}" \
            --arg run_url "${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}" \
            --arg trigger "${{ github.event_name }}" \
            --arg issue_number "$ISSUE_NUMBER" \
            --arg model_id "$MODEL_ID" \
            --arg outcome "$OUTCOME" \
            --arg redactions "${ROW_REDACTIONS:-}" \
            --arg guardrail_action "${ROW_GUARDRAIL_ACTION:-}" \
            --argjson duration_seconds "$DURATION_SECONDS" \
            --arg finished_at "$FINISHED_AT" \
            '{
              workflow: "support-triage", run_id: $run_id, run_url: $run_url, trigger: $trigger,
              environment: "prod",
              issue_number: (if $issue_number == "" then null else ($issue_number | tonumber) end),
              model_id: (if $model_id == "" then null else $model_id end),
              outcome: $outcome, escalated: false,
              redactions: (if $redactions == "" then null else ($redactions | tonumber) end),
              guardrail_action: (if $guardrail_action == "" then null else $guardrail_action end),
              pr_number: null, duration_seconds: $duration_seconds, finished_at: $finished_at
            }')
          echo "row=$ROW" >> "$GITHUB_OUTPUT"
          echo "key=curated/agent-runs/dt=$(date -u +%F)/${{ github.run_id }}-${{ github.run_attempt }}.json" >> "$GITHUB_OUTPUT"

      - name: Write the agent-run row to the lake
        uses: ./.github/actions/dora-row
        with:
          bucket: 'prod-env-analytics-lake-${{ vars.SUBMIT_ACCOUNT_ID }}'
          key: ${{ steps.agent-run-row.outputs.key }}
          row: ${{ steps.agent-run-row.outputs.row }}
