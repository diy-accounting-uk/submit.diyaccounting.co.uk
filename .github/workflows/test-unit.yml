# @capability OPS-159 Run the unit, system and browser test tiers in CI
# - **Use when:** checking which unit, MCP, system, web unit and browser test jobs run for a push, and in what shape.
# - **Does:** test-unit.yml runs the npm unit, MCP, system, web unit and sharded browser tests. test.yml calls it with the code and build flags of its changes job.
# - **Run:** no command; test.yml calls it (see OPS-26)
# - **Entry:** `.github/workflows/test-unit.yml`
# - **Files:** .github/workflows/test-unit.yml
# - **Keywords:** unit tests, system tests, browser tests, mcp tests, test shards, workflow_call
# - **Related:** OPS-26
# @end-capability

name: test-unit
run-name: "test-unit from ${{ github.ref_name }}"

on:
  workflow_call:
    inputs:
      code:
        type: string
        required: true
      build:
        type: string
        required: true

permissions:
  contents: read
  packages: read
  id-token: write

env:
  JAVA_VERSION: '25'
  NODE_VERSION: '24'
  AWS_REGION: 'eu-west-2'
  BASE_IMAGE_TAG_PREFIX: 'submit-base'
  loadTestDuration: '30s'
  GITHUB_ACTOR: ${{ github.actor }}
  SELF_DESTRUCT_DELAY_HOURS: '1'
  BASE_IMAGE_TAG: ${{ github.sha }}
  FORCE_ALL_STACK_DEPLOYMENT: 'false'
  COMMIT_HASH: ${{ github.sha }}
  BUILD_NUMBER: ${{ github.run_number }}
  GITHUB_REF: ${{ github.ref }}

jobs:

  npm-unit-test:
    if: ${{ inputs.code == 'true' }}
    name: 'npm unit test'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - name: Setup Node
        timeout-minutes: 6
        uses: ./.github/actions/setup-toolchain
        with:
          npm-install: scripts

      # The full output overflows the job log's display limit, so it goes to a file kept as
      # an artifact and the console shows its last 29000 lines, where vitest's summary is.
      - name: Run npm run test:coverage
        shell: bash
        run: |
          set +e
          npm run test:coverage > npm-unit-test.log 2>&1
          status=$?
          tail -n 29000 npm-unit-test.log
          exit $status

      - name: Save the npm run test:coverage log
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: npm-unit-test-log-${{ github.run_id }}
          path: npm-unit-test.log
          if-no-files-found: warn
          retention-days: 14

  npm-mcp-test:
    if: ${{ inputs.code == 'true' && inputs.build == 'true' }}
    name: 'npm mcp test'
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - name: Setup Node
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'
          cache-dependency-path: |
            package-lock.json
            mcp/package-lock.json

      - run: timeout 120 npm ci --prefer-offline || { sleep 30; timeout 180 npm ci; }
        working-directory: mcp
        timeout-minutes: 6
        env:
          NPM_CONFIG_FETCH_RETRIES: "3"

      # The accounts derivation test renders BrickWork Pro's lines through
      # app/services/microEntityAccountsIxbrl.js, which resolves its own
      # dependencies from the repository root.
      - run: timeout 120 npm ci --prefer-offline --ignore-scripts || { sleep 30; timeout 180 npm ci --ignore-scripts; }
        timeout-minutes: 6
        env:
          NPM_CONFIG_FETCH_RETRIES: "3"

      - run: npx vitest run
        working-directory: mcp

  npm-system-test:
    if: ${{ inputs.code == 'true' }}
    name: 'npm system test'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - name: Setup Node
        timeout-minutes: 6
        uses: ./.github/actions/setup-toolchain
        with:
          npm-install: scripts

      - run: npm run test:system

  npm-test-web-unit:
    if: ${{ inputs.code == 'true' }}
    name: 'npm unit test with coverage'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - name: Setup Node
        uses: ./.github/actions/setup-toolchain
        with:
          npm-install: none

      - run: timeout 120 npm ci --prefer-offline || { sleep 30; timeout 180 npm install; }
        timeout-minutes: 6
        env:
          NPM_CONFIG_FETCH_RETRIES: "3"

      - name: Build bundle for tests
        run: npm run bundle

      - run: npm run test:web-unit

  # The browser tests run on one worker, so three shards cut the wall time to about a third.
  # `npm-browser-test` below keeps the job name and gathers the shards.
  npm-browser-test-shard:
    if: ${{ inputs.code == 'true' }}
    name: 'npm browser test shard ${{ matrix.shard }}/3'
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2, 3]
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - name: Setup Node
        timeout-minutes: 6
        uses: ./.github/actions/setup-toolchain
        with:
          npm-install: scripts

      - run: npx playwright install chromium --with-deps

      # diya-gl caches the workbook templates it downloads under ~/.cache/diya-gl/<version>/
      # (XDG_CACHE_HOME moves it); a warm cache lets savePackageZip run with no network.
      - name: Read the installed diya-gl version
        id: diya-gl-version
        run: echo "version=$(node -p "require('./node_modules/@diy-accounting-uk/diya-gl/package.json').version")" >> "$GITHUB_OUTPUT"

      - name: Cache diya-gl templates
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6
        with:
          path: ~/.cache/diya-gl
          key: diya-gl-templates-${{ runner.os }}-${{ steps.diya-gl-version.outputs.version }}

      - run: npm run test:browser -- --shard=${{ matrix.shard }}/3

  npm-browser-test:
    if: ${{ always() && needs.npm-browser-test-shard.result != 'skipped' }}
    name: 'npm browser test'
    runs-on: ubuntu-latest
    needs:
      - npm-browser-test-shard
    permissions: {}
    steps:
      - name: Fail unless every shard passed
        env:
          SHARD_RESULT: ${{ needs.npm-browser-test-shard.result }}
        run: |
          echo "Browser test shards: ${SHARD_RESULT}"
          test "${SHARD_RESULT}" = "success"
