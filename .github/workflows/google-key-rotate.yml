# Rotates the GA4 service account's key, one job per environment, each writing the new key
# to its own account's Secrets Manager secret (scripts/gcp-key-rotate.js reads
# google/identity.toml's [service_account.key_rotation]). Monthly, and on demand. Goes away
# with the key itself once the analytics Lambdas are federated (PLAN_EVERYTHING_AS_CODE.md item 11).

name: google key rotate
run-name: "google key rotate (${{ github.event_name == 'workflow_dispatch' && (inputs.apply && 'apply' || 'plan') || 'apply' }}) from ${{ github.ref_name }}"

concurrency:
  group: google-key-rotate
  cancel-in-progress: false

on:
  workflow_dispatch:
    inputs:
      apply:
        description: "Create the key and write the secret (true) or plan only (false)"
        required: false
        default: false
        type: boolean
  schedule:
    # Monthly on the 1st, off the top-of-hour queue and clear of the nightly analytics jobs.
    - cron: '23 5 1 * *'

env:
  NODE_VERSION: '24'
  AWS_REGION: 'eu-west-2'
  GOOGLE_APPLY: ${{ (github.event_name == 'schedule' || inputs.apply) && 'true' || 'false' }}

jobs:
  rotate:
    name: ${{ matrix.environment }}
    runs-on: ubuntu-24.04
    environment: ${{ matrix.environment }}
    strategy:
      fail-fast: false
      max-parallel: 1
      matrix:
        environment: [ci, prod]
    permissions:
      id-token: write
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Setup Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'

      - name: Install dependencies
        run: timeout 120 npm ci --prefer-offline || { sleep 30; timeout 180 npm ci; }
        timeout-minutes: 6
        env:
          NPM_CONFIG_FETCH_RETRIES: "3"

      - name: Configure AWS role via GitHub OIDC
        uses: aws-actions/configure-aws-credentials@e1253824e5c10ff9df46874f81ed3ec929e19cfd # v6
        with:
          role-to-assume: ${{ vars.SUBMIT_ACTIONS_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}
          role-chaining: false
          audience: sts.amazonaws.com
          role-skip-session-tagging: true
          output-credentials: true
          retry-max-attempts: 3

      - name: Assume AWS deployment role
        uses: aws-actions/configure-aws-credentials@e1253824e5c10ff9df46874f81ed3ec929e19cfd # v6
        with:
          role-to-assume: ${{ vars.SUBMIT_DEPLOY_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}
          role-chaining: true
          audience: sts.amazonaws.com
          role-skip-session-tagging: true
          output-credentials: true
          retry-max-attempts: 3

      # The current key authenticates the rotation that replaces it. The value is masked and
      # reaches the script through the environment, never a log line.
      - name: Rotate the key into this environment's secret
        env:
          GA4_SERVICE_ACCOUNT_ARN: "arn:aws:secretsmanager:${{ env.AWS_REGION }}:${{ vars.SUBMIT_ACCOUNT_ID }}:secret:${{ matrix.environment }}/submit/ga4/service_account"
          SECRET_NAME: "${{ matrix.environment }}/submit/ga4/service_account"
        run: |
          if [ "$GOOGLE_APPLY" != "true" ]; then
            node scripts/gcp-key-rotate.js 2>&1 | tee gcp-key-rotate.log
          else
            node scripts/gcp-key-rotate.js --apply --secret-name "$SECRET_NAME" 2>&1 | tee gcp-key-rotate.log
          fi

      - name: Generate step summary
        if: always()
        run: |
          echo "# Google key rotate, ${{ matrix.environment }} ($([ "$GOOGLE_APPLY" = "true" ] && echo apply || echo plan))" >> "$GITHUB_STEP_SUMMARY"
          echo '```' >> "$GITHUB_STEP_SUMMARY"
          cat gcp-key-rotate.log >> "$GITHUB_STEP_SUMMARY"
          echo '```' >> "$GITHUB_STEP_SUMMARY"
