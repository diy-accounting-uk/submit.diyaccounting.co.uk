# @capability OPS-181 Prove the customer email path on ci
# - **Use when:** the EmailStack or the customer email worker has deployed to ci and the path from the activity bus to a delivered message needs a check.
# - **Does:** customer-email-proof.yml puts fixture CustomerEmailRequest events on the ci activity bus: one for each of three kinds to the operator address, one to each SES simulator bounce and complaint address. It waits, reads the worker's log group, and queries the ci activity events for the customer-email outcomes.
# - **Run:** `gh workflow run customer-email-proof.yml -f operator-address=<address>`
# - **Entry:** `.github/workflows/customer-email-proof.yml`
# - **Files:** .github/workflows/customer-email-proof.yml
# - **Keywords:** customer email proof, ses, dkim, spf, bounce, complaint, simulator, ci
# - **Related:** SITE-27
# @end-capability

name: customer email proof
run-name: "customer email proof on ci from ${{ github.ref_name }}"

on:
  workflow_dispatch:
    inputs:
      operator-address:
        description: 'Mailbox that receives the fixture emails, to read the DKIM and SPF results'
        required: true
        type: string
        default: 'antony@diyaccounting.co.uk'

env:
  AWS_REGION: 'eu-west-2'
  ENVIRONMENT_NAME: 'ci'

concurrency:
  group: customer-email-proof
  cancel-in-progress: false

jobs:
  proof:
    name: 'proof'
    runs-on: ubuntu-24.04
    environment: ci
    permissions:
      id-token: write
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Assume the AWS actions and deploy roles
        uses: ./.github/actions/aws-role
        with:
          actions-role-arn: ${{ vars.SUBMIT_ACTIONS_ROLE_ARN }}
          deploy-role-arn: ${{ vars.SUBMIT_DEPLOY_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Put the fixture requests on the activity bus
        env:
          OPERATOR_ADDRESS: ${{ inputs.operator-address }}
        run: |
          set -euo pipefail
          BUS="${ENVIRONMENT_NAME}-env-activity-bus"
          RUN_TAG="proof-${GITHUB_RUN_ID}"
          START_EPOCH_MS="$(date +%s)000"
          echo "START_EPOCH_MS=${START_EPOCH_MS}" >> "$GITHUB_ENV"

          put_request() {
            local kind="$1" to="$2" data="$3" suffix="$4"
            local detail
            detail="$(jq -cn --arg kind "$kind" --arg to "$to" --arg tag "$RUN_TAG-$suffix" --argjson data "$data" \
              '{userId: $tag, requestId: $tag, payload: {kind: $kind, to: $to, hashedSub: $tag, synthetic: false, data: $data}}')"
            local entries
            entries="$(jq -cn --arg bus "$BUS" --arg detail "$detail" \
              '[{EventBusName: $bus, Source: "diy.submit", DetailType: "CustomerEmailRequest", Detail: $detail}]')"
            local failed
            failed="$(aws events put-events --entries "$entries" --query FailedEntryCount --output text)"
            echo "put ${kind} ${suffix}: failed entries ${failed}"
            test "$failed" = "0"
          }

          EXPIRY="$(date -u -d '+30 days' +%Y-%m-%dT%H:%M:%SZ)"
          put_request subscription-started "$OPERATOR_ADDRESS" \
            "{\"bundleId\":\"day-guest\",\"currentPeriodEnd\":\"${EXPIRY}\"}" operator-subscription
          put_request pass-generated "$OPERATOR_ADDRESS" \
            "{\"bundleId\":\"day-guest\",\"code\":\"physical-pass\",\"validUntil\":\"${EXPIRY}\",\"maxUses\":1}" operator-pass
          put_request pass-redeemed "$OPERATOR_ADDRESS" \
            "{\"bundleId\":\"day-guest\",\"expiry\":\"${EXPIRY}\"}" operator-redeemed
          put_request pass-redeemed "bounce@simulator.amazonses.com" \
            "{\"bundleId\":\"day-guest\",\"expiry\":\"${EXPIRY}\"}" simulator-bounce
          put_request pass-redeemed "complaint@simulator.amazonses.com" \
            "{\"bundleId\":\"day-guest\",\"expiry\":\"${EXPIRY}\"}" simulator-complaint

      - name: Wait for the queue to drain
        run: |
          set -euo pipefail
          QUEUE_URL="$(aws sqs get-queue-url --queue-name "${ENVIRONMENT_NAME}-env-customer-email" --query QueueUrl --output text)"
          for _ in $(seq 1 30); do
            COUNTS="$(aws sqs get-queue-attributes --queue-url "$QUEUE_URL" \
              --attribute-names ApproximateNumberOfMessages ApproximateNumberOfMessagesNotVisible \
              --query 'Attributes.[ApproximateNumberOfMessages,ApproximateNumberOfMessagesNotVisible]' --output text)"
            echo "visible and in flight: ${COUNTS}"
            if [ "$COUNTS" = "0	0" ]; then break; fi
            sleep 10
          done
          DLQ_URL="$(aws sqs get-queue-url --queue-name "${ENVIRONMENT_NAME}-env-customer-email-dlq" --query QueueUrl --output text)"
          DLQ_COUNT="$(aws sqs get-queue-attributes --queue-url "$DLQ_URL" --attribute-names ApproximateNumberOfMessages --query 'Attributes.ApproximateNumberOfMessages' --output text)"
          echo "dead letter queue depth: ${DLQ_COUNT}"
          test "$DLQ_COUNT" = "0"

      - name: Read the worker and event outcomes from the logs
        run: |
          set -euo pipefail
          sleep 30
          for GROUP in "/aws/lambda/${ENVIRONMENT_NAME}-env-customer-email-send" "/aws/lambda/${ENVIRONMENT_NAME}-env-customer-email-event"; do
            echo "--- ${GROUP}"
            aws logs filter-log-events --log-group-name "$GROUP" --start-time "$START_EPOCH_MS" \
              --filter-pattern '"Customer email"' \
              --query 'events[].message' --output text | grep -o '"outcome":"[a-z-]*"\|"eventType":"[A-Za-z ]*"' | sort | uniq -c || true
          done

      - name: Read the customer email events from the activity lake
        run: |
          set -euo pipefail
          sleep 90
          QUERY="SELECT event, count(*) AS c FROM ci_env_analytics.activity_events_all WHERE dt = current_date AND event LIKE 'customer-email-%' AND event_ts > current_timestamp - interval '1' hour GROUP BY 1 ORDER BY 1"
          QUERY_ID="$(aws athena start-query-execution --work-group ci-env-analytics --query-string "$QUERY" --query QueryExecutionId --output text)"
          STATE=RUNNING
          for _ in $(seq 1 60); do
            STATE="$(aws athena get-query-execution --query-execution-id "$QUERY_ID" --query 'QueryExecution.Status.State' --output text)"
            case "$STATE" in SUCCEEDED|FAILED|CANCELLED) break ;; esac
            sleep 2
          done
          echo "athena state: ${STATE}"
          test "$STATE" = "SUCCEEDED"
          aws athena get-query-results --query-execution-id "$QUERY_ID" \
            --query 'ResultSet.Rows[*].Data[*].VarCharValue' --output text
