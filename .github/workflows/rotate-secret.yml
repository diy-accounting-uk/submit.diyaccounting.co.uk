name: rotate secret
run-name: "rotate ${{ inputs.secret }} in ${{ inputs.environment-name }}"

# Writes one GitHub environment secret to Secrets Manager and stamps its rotated-at tag, then
# runs that vendor's assert. For the Google client secret it also refreshes the Cognito identity
# provider. No other secret and no stack changes. Set the GitHub environment secret first.
# scripts/rotate-secret-plan.js holds the table of secrets, their GitHub names and their asserts.

on:
  workflow_dispatch:
    inputs:
      secret:
        description: 'Secret to write, as its name under <environment>/submit/'
        type: choice
        required: true
        options:
          - 'google/client_secret'
          - 'microsoft/client_secret'
          - 'hmrc/client_secret'
          - 'hmrc/sandbox_client_secret'
          - 'companies-house/api_key'
          - 'companies-house/sandbox_api_key'
          - 'companies-house/client_secret'
          - 'companies-house/presenter_id'
          - 'companies-house/presenter_code'
          - 'stripe/secret_key'
          - 'stripe/test_secret_key'
          - 'stripe/webhook_secret'
          - 'stripe/test_webhook_secret'
          - 'telegram/bot_token'
          - 'paypal/client_secret'
          - 'github/ops_app_private_key'
      environment-name:
        description: 'Environment'
        type: choice
        required: true
        options:
          - 'ci'
          - 'prod'

concurrency:
  group: rotate-secret-${{ inputs.environment-name }}
  cancel-in-progress: false

permissions:
  id-token: write
  contents: read

env:
  AWS_REGION: 'eu-west-2'

jobs:
  rotate:
    name: 'rotate ${{ inputs.secret }}'
    runs-on: ubuntu-24.04
    environment: ${{ inputs.environment-name }}
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Set up the toolchain
        uses: ./.github/actions/setup-toolchain

      - name: Plan the rotation
        id: plan
        env:
          SECRET_SUFFIX: ${{ inputs.secret }}
          ENVIRONMENT_NAME: ${{ inputs.environment-name }}
        run: node scripts/rotate-secret-plan.js "$SECRET_SUFFIX" "$ENVIRONMENT_NAME"

      - name: Assume the AWS actions and deployment roles
        uses: ./.github/actions/aws-role
        with:
          actions-role-arn: ${{ vars.SUBMIT_ACTIONS_ROLE_ARN }}
          deploy-role-arn: ${{ vars.SUBMIT_DEPLOY_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Write the secret to Secrets Manager
        env:
          SECRET_VALUE: ${{ secrets[steps.plan.outputs.github-secret] }}
          AWS_SECRET_NAME: ${{ steps.plan.outputs.aws-secret-name }}
          GITHUB_SECRET_NAME: ${{ steps.plan.outputs.github-secret }}
        run: |
          set -euo pipefail
          if [ -z "$SECRET_VALUE" ]; then
            echo "::error::The GitHub environment secret $GITHUB_SECRET_NAME is empty or not set on this environment."
            exit 1
          fi
          scripts/put-secret-with-rotation-tag.sh "$AWS_SECRET_NAME" "$SECRET_VALUE"

      - name: Refresh the Cognito Google identity provider
        if: steps.plan.outputs.refresh-cognito == 'true'
        env:
          ENVIRONMENT_NAME: ${{ inputs.environment-name }}
        run: scripts/refresh-google-identity-provider.sh "$ENVIRONMENT_NAME"

      - name: Run the vendor assert
        if: steps.plan.outputs.assert-command != ''
        env:
          ASSERT_COMMAND: ${{ steps.plan.outputs.assert-command }}
        run: |
          set -euo pipefail
          echo "Running: $ASSERT_COMMAND"
          bash -c "$ASSERT_COMMAND"

      - name: Show the rotated-at tag
        env:
          AWS_SECRET_NAME: ${{ steps.plan.outputs.aws-secret-name }}
        run: |
          aws secretsmanager describe-secret --secret-id "$AWS_SECRET_NAME" --region "$AWS_REGION" \
            --query "{name:Name,rotatedAt:Tags[?Key=='rotated-at'].Value | [0]}" --output json
