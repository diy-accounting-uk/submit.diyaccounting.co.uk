name: alarm-customer-lookup
run-name: "alarm customer lookup for #${{ inputs.issue-number }}"

# Looks up the customer behind a failed submission and writes the result to a file in the
# private repository, then pings the operator on Telegram with the alarm name, the issue link
# and the file's path. The file holds personal data, so it never goes to the issue, the run log
# or the run summary. The lookup reads customer data, which the read-only alarm triage role
# denies, so this workflow chains into the deployment role instead.
#
# alarm-triage.yml's customer-lookup job starts it with workflow_dispatch. It runs here, in its own
# concurrency group, because it waits up to 25 minutes for the lake to hold the alarm window's
# events, and inside alarm-triage's single group that wait would queue the next alarm's triage
# and let a third replace the second.

on:
  workflow_dispatch:
    inputs:
      alarm-name:
        description: the alarm whose customers to look up
        required: true
        type: string
      region:
        description: the alarm's region
        required: false
        default: eu-west-2
        type: string
      window:
        description: the alarm window the triage read, for the origin check
        required: true
        type: string
      timestamp:
        description: the alarm's state-change timestamp
        required: true
        type: string
      issue-number:
        description: the alarm issue
        required: true
        type: string

permissions:
  id-token: write
  contents: read

concurrency:
  group: alarm-customer-lookup-${{ inputs.issue-number }}
  cancel-in-progress: false

env:
  AWS_REGION: 'eu-west-2'

jobs:
  customer-lookup:
    runs-on: ubuntu-24.04
    # The lookup waits up to 25 minutes for the lake to hold the alarm window's events.
    timeout-minutes: 40
    environment: prod
    env:
      ALARM_NAME: ${{ inputs.alarm-name }}
      ALARM_REGION: ${{ inputs.region }}
      ALARM_WINDOW: ${{ inputs.window }}
      ALARM_TIMESTAMP: ${{ inputs.timestamp }}
      ISSUE_NUMBER: ${{ inputs.issue-number }}
      ISSUE_URL: ${{ github.server_url }}/${{ github.repository }}/issues/${{ inputs.issue-number }}
      PRIVATE_REPO: diy-accounting-uk/private.diyaccounting.co.uk
    steps:
      - name: Stop when the ops App credentials are not set
        id: key
        env:
          OPS_APP_ID: ${{ vars.OPS_APP_ID }}
          OPS_APP_PRIVATE_KEY: ${{ secrets.OPS_APP_PRIVATE_KEY }}
        run: |
          if [ -z "${OPS_APP_ID}" ] || [ -z "${OPS_APP_PRIVATE_KEY}" ]; then
            echo "OPS_APP_ID or OPS_APP_PRIVATE_KEY is not set, so the customer lookup waits" | tee -a "$GITHUB_STEP_SUMMARY"
            echo "configured=false" | tee -a "$GITHUB_OUTPUT"
          else
            echo "configured=true" | tee -a "$GITHUB_OUTPUT"
          fi

      - name: Checkout
        if: steps.key.outputs.configured == 'true'
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      - name: Set up the toolchain
        if: steps.key.outputs.configured == 'true'
        uses: ./.github/actions/setup-toolchain
        with:
          npm-install: none
          npm-cache: 'false'

      - name: Assume the AWS actions and deployment roles
        if: steps.key.outputs.configured == 'true'
        uses: ./.github/actions/aws-role
        with:
          actions-role-arn: ${{ vars.SUBMIT_ACTIONS_ROLE_ARN }}
          deploy-role-arn: ${{ vars.SUBMIT_DEPLOY_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Install dependencies
        if: steps.key.outputs.configured == 'true'
        run: timeout 120 npm ci --prefer-offline || { sleep 30; timeout 180 npm ci; }

      - name: Verify the alarm actually fired
        if: steps.key.outputs.configured == 'true'
        run: |
          node scripts/verify-alarm-origin.mjs \
            --alarm-name "$ALARM_NAME" --window "$ALARM_WINDOW" --region "${ALARM_REGION:-eu-west-2}"

      - name: Look up the customer into a file
        if: steps.key.outputs.configured == 'true'
        run: |
          set -euo pipefail
          node scripts/alarm-customer-lookup.mjs \
            --alarm-name "$ALARM_NAME" --timestamp "$ALARM_TIMESTAMP" \
            --issue-number "$ISSUE_NUMBER" --issue-url "$ISSUE_URL" \
            --region "${ALARM_REGION:-eu-west-2}" --out "$RUNNER_TEMP/alarm-lookup.md"

      - name: Generate a token that writes to the private repository
        if: steps.key.outputs.configured == 'true'
        id: private-token
        uses: actions/create-github-app-token@64ab729a6294000f5aa4a4bc0b73d1f32bc45510 # v3.3.0
        with:
          app-id: ${{ vars.OPS_APP_ID }}
          private-key: ${{ secrets.OPS_APP_PRIVATE_KEY }}
          owner: diy-accounting-uk
          repositories: private.diyaccounting.co.uk
          permission-contents: write

      - name: Commit the file to the private repository
        if: steps.key.outputs.configured == 'true'
        id: private-commit
        env:
          PRIVATE_REPO_TOKEN: ${{ steps.private-token.outputs.token }}
        run: |
          set -euo pipefail
          git clone --depth 1 "https://x-access-token:${PRIVATE_REPO_TOKEN}@github.com/${PRIVATE_REPO}.git" "$RUNNER_TEMP/private"
          FILE_PATH="support/alarms/${ISSUE_NUMBER}-${ALARM_NAME}.md"
          mkdir -p "$RUNNER_TEMP/private/support/alarms"
          cp "$RUNNER_TEMP/alarm-lookup.md" "$RUNNER_TEMP/private/${FILE_PATH}"
          cd "$RUNNER_TEMP/private"
          git config user.name "submit-alarm-lookup"
          git config user.email "submit-alarm-lookup@users.noreply.github.com"
          git add "$FILE_PATH"
          git commit -m "Alarm lookup for #${ISSUE_NUMBER}: ${ALARM_NAME}"
          for ATTEMPT in 1 2 3; do
            if git push origin HEAD:main; then break; fi
            if [ "$ATTEMPT" = 3 ]; then exit 1; fi
            git pull --rebase origin main
          done
          echo "file-path=${FILE_PATH}" | tee -a "$GITHUB_OUTPUT"

      - name: Tell the operator on Telegram
        if: steps.private-commit.outcome == 'success'
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          FILE_PATH: ${{ steps.private-commit.outputs.file-path }}
        run: |
          set -euo pipefail
          CHAT_ID=$(sed -n 's/^TELEGRAM_OPS_CHAT_ID=\([-0-9]*\).*/\1/p' .env.prod | head -1)
          TEXT=$(printf '%s: customer lookup written to %s in %s\n%s' "$ALARM_NAME" "$FILE_PATH" "$PRIVATE_REPO" "$ISSUE_URL")
          curl --silent --show-error --fail --max-time 15 \
            --data-urlencode "chat_id=${CHAT_ID}" \
            --data-urlencode "text=${TEXT}" \
            "https://api.telegram.org/bot${TELEGRAM_BOT_TOKEN}/sendMessage" > /dev/null
