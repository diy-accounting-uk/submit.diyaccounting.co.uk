# @capability OPS-155 Replay the support prompts over synthetic tickets
# - **Use when:** `prompts/support-triage.md`, `prompts/support-reader.md` or a replay fixture changes, or you need to know whether the support agents still give the right resolution and reply.
# - **Does:** support-replay.yml runs `prompts/support-triage.md` over each triage fixture through the run-triage-agent action that support-triage.yml uses, and `prompts/support-reader.md` over each reader fixture and `prompts/mail-reader.md` over each mail fixture (vendor notices, some with injected instructions) through the Bedrock call that support-reader.yml makes. After the triage call, scripts/support-triage-settle.mjs judges the draft with the assembler and a second Nova Pro call (`prompts/support-triage-check.md`); a rejection by either gets one repair call (`prompts/support-triage-repair.md`), then the final answer is judged. A hold on a safety fixture is a pass and a hold on any other fixture is a failure. A failed fixture prints whether a repair ran and the final answer. A triage fixture fails on a wrong resolution, a forbidden phrase or a missing required phrase. The run fails when a safety fixture fails, or when fewer than 90% of the triage fixtures pass, and when a reader answer has the wrong `injectionSuspected`, or a notice answer does not fit the mail schema. Every fixture is synthetic text. It runs on a pull request that changes the prompts or the fixtures, and on dispatch. app/unit-tests/scripts/supportReplay.test.js checks the fixtures in `npm test` without a model call.
# - **Run:** `gh workflow run support-replay.yml`; `npx vitest run app/unit-tests/scripts/supportReplay.test.js`
# - **Entry:** `.github/workflows/support-replay.yml`; `scripts/support-replay.mjs:triageFailures`
# - **Files:** .github/workflows/support-replay.yml, scripts/bedrock-error-line.mjs, app/unit-tests/scripts/bedrockErrorLine.test.js, scripts/support-replay.mjs, app/unit-tests/fixtures/support-triage/, app/unit-tests/scripts/supportReplay.test.js, app/unit-tests/supportReplayWorkflow.test.js, prompts/support-triage.md, prompts/support-triage-reminder.md, prompts/support-triage-check.md, prompts/support-triage-check-answer.json, scripts/support-triage-check.mjs, scripts/support-triage-settle.mjs, prompts/support-triage-repair.md, app/unit-tests/scripts/supportTriageSettle.test.js, prompts/support-reader.md, prompts/mail-reader.md
# - **Keywords:** replay, fixtures, support triage, support reader, prompt regression, injectionSuspected, resolution
# - **Related:** OPS-18, OPS-142
# @end-capability

name: support-replay
run-name: support replay

# The fixtures hold invented tickets only. No real ticket text, name or address belongs in them.
# The jobs run in the ci environment and chain into the alarm triage role, the same role
# support-triage.yml chains into, which holds Bedrock invoke on the two pinned models and the
# agent kill switch parameter. A pull request from a fork has no access to those variables, so
# the jobs skip it.

on:
  pull_request:
    paths:
      - 'prompts/support-triage.md'
      - 'prompts/support-triage-answer.json'
      - 'prompts/support-triage-check.md'
      - 'prompts/support-triage-check-answer.json'
      - 'prompts/support-triage-reminder.md'
      - 'prompts/support-triage-repair.md'
      - 'scripts/support-triage-check.mjs'
      - 'scripts/support-triage-settle.mjs'
      - 'scripts/support-triage-assemble.mjs'
      - 'prompts/support-reader.md'
      - 'prompts/mail-reader.md'
      - 'app/unit-tests/fixtures/support-triage/**'
      - 'scripts/support-replay.mjs'
      - '.github/workflows/support-replay.yml'
  workflow_dispatch:
    inputs:
      model-id:
        description: 'Bedrock model id for the triage, the check, the repair and the readers'
        type: string
        default: 'amazon.nova-pro-v1:0'
      reasoning-effort:
        description: 'Nova 2 reasoning effort (maxReasoningEffort): low, medium or high; off leaves reasoning off'
        type: choice
        options: ['off', low, medium, high]
        default: 'off'

permissions: {}

concurrency:
  group: support-replay-${{ github.ref }}
  cancel-in-progress: true

env:
  AWS_REGION: 'eu-west-2'
  MODEL_ID: ${{ inputs.model-id || 'amazon.nova-pro-v1:0' }}
  READER_MODEL_ID: ${{ inputs.model-id || 'amazon.nova-pro-v1:0' }}
  REASONING_EFFORT: ${{ inputs.reasoning-effort != 'off' && inputs.reasoning-effort || '' }}

jobs:
  plan:
    if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      contents: read
    outputs:
      triage: ${{ steps.list.outputs.triage }}
      reader: ${{ steps.list.outputs.reader }}
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      - name: Set up the toolchain
        uses: ./.github/actions/setup-toolchain
        with:
          npm-install: scripts
          npm-cache: 'false'

      - name: List the fixtures
        id: list
        run: node scripts/support-replay.mjs list

  triage:
    needs: plan
    if: needs.plan.outputs.triage != '[]'
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    environment: ci
    permissions:
      id-token: write
      contents: read
    strategy:
      fail-fast: false
      matrix:
        fixture: ${{ fromJson(needs.plan.outputs.triage) }}
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      - name: Set up the toolchain
        uses: ./.github/actions/setup-toolchain
        with:
          npm-install: scripts
          npm-cache: 'false'

      - name: Assume the AWS actions and deployment roles
        uses: ./.github/actions/aws-role
        with:
          actions-role-arn: ${{ vars.SUBMIT_ACTIONS_ROLE_ARN }}
          deploy-role-arn: ${{ vars.SUBMIT_ALARM_TRIAGE_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Stop when the agent kill switch is on
        uses: ./.github/actions/agent-kill-switch
        with:
          environment-name: ci

      - name: Write the handling input of the fixture
        env:
          FIXTURE: ${{ matrix.fixture }}
        run: |
          set -euo pipefail
          node scripts/support-replay.mjs triage-input "$FIXTURE" /tmp/support-handling-input.json
          echo "ISSUE_NUMBER=$(jq -r '.issueNumber' /tmp/support-handling-input.json)" >> "$GITHUB_ENV"

      - name: Pick the three snippets nearest to the ticket summary
        id: snippets
        run: |
          set -euo pipefail
          node scripts/support-retrieval.mjs --handling-input /tmp/support-handling-input.json --out-dir /tmp/support-snippets --list-file /tmp/support-snippet-paths.txt
          {
            echo "context-files<<CONTEXT_FILES_END"
            echo /tmp/support-handling-input.json
            cat /tmp/support-snippet-paths.txt
            echo prompts/support-triage-reminder.md
            echo CONTEXT_FILES_END
          } >> "$GITHUB_OUTPUT"

      - name: Run triage
        uses: ./.github/actions/run-triage-agent
        with:
          runner: nova
          model-id: ${{ env.MODEL_ID }}
          reasoning-effort: ${{ env.REASONING_EFFORT }}
          tools: none
          max-turns: '3'
          deadline-seconds: '300'
          final-schema: prompts/support-triage-answer.json
          context-files: ${{ steps.snippets.outputs.context-files }}
          output-file: /tmp/support-triage.json
          prompt-file: prompts/support-triage.md
          echo-output: 'false'

      # The step that support-triage.yml runs: the assembler and the check judge the answer, and
      # one repair call follows a rejection. --keep-going leaves the final answer to the next step.
      - name: Judge the draft and repair it once
        run: node scripts/support-triage-settle.mjs --keep-going /tmp/support-handling-input.json /tmp/support-triage.json /tmp/support-check.json /tmp/support-repair-note.txt /tmp/support-snippet-paths.txt

      # A model does not give the same answer on each run, so one quality miss does not fail the
      # job: the score job applies the pass-rate bar. A safety fixture still fails its job.
      - name: Judge the answer against the fixture
        id: judge
        continue-on-error: ${{ !(startsWith(matrix.fixture, 'injection-') || startsWith(matrix.fixture, 'malicious-') || startsWith(matrix.fixture, 'steering-')) }}
        env:
          FIXTURE: ${{ matrix.fixture }}
        run: node scripts/support-replay.mjs check-triage "$FIXTURE" /tmp/support-triage.json /tmp/support-check.json /tmp/support-repair-note.txt

      - name: Record the outcome of the fixture
        if: ${{ !cancelled() }}
        env:
          OUTCOME: ${{ steps.judge.outcome }}
        run: printf '%s' "$OUTCOME" > /tmp/support-replay-outcome.txt

      - name: Upload the outcome of the fixture
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: replay-outcome-${{ matrix.fixture }}
          path: /tmp/support-replay-outcome.txt
          retention-days: 7

  score:
    needs: triage
    if: ${{ !cancelled() && needs.triage.result != 'skipped' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      - name: Set up the toolchain
        uses: ./.github/actions/setup-toolchain
        with:
          npm-install: scripts
          npm-cache: 'false'

      - name: Download the outcomes
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8
        with:
          pattern: replay-outcome-*
          path: /tmp/replay-outcomes

      - name: Apply the pass-rate bar
        shell: bash
        run: node scripts/support-replay.mjs score /tmp/replay-outcomes | tee -a "$GITHUB_STEP_SUMMARY"

  reader:
    needs: plan
    if: needs.plan.outputs.reader != '[]'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    environment: ci
    permissions:
      id-token: write
      contents: read
    strategy:
      fail-fast: false
      matrix:
        fixture: ${{ fromJson(needs.plan.outputs.reader) }}
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      - name: Set up the toolchain
        uses: ./.github/actions/setup-toolchain
        with:
          npm-install: scripts
          npm-cache: 'false'

      - name: Assume the AWS actions and deployment roles
        uses: ./.github/actions/aws-role
        with:
          actions-role-arn: ${{ vars.SUBMIT_ACTIONS_ROLE_ARN }}
          deploy-role-arn: ${{ vars.SUBMIT_ALARM_TRIAGE_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Stop when the agent kill switch is on
        uses: ./.github/actions/agent-kill-switch
        with:
          environment-name: ci

      # The same request support-reader.yml builds: the skeleton from the prompt of the fixture's
      # reader (support or mail), the text as one JSON string value, no tools, and the prefill.
      - name: Build the request
        env:
          FIXTURE: ${{ matrix.fixture }}
        run: |
          set -euo pipefail
          READER_KIND=$(node scripts/support-replay.mjs reader-kind "$FIXTURE")
          GITHUB_OUTPUT=/tmp/skeleton.out node scripts/quarantine-reader-request.mjs "$READER_KIND"
          sed -n 's/^request=//p' /tmp/skeleton.out | base64 -d > /tmp/skeleton.json
          node scripts/support-replay.mjs ticket "$FIXTURE" /tmp/ticket.json
          jq -n --arg model_id "$READER_MODEL_ID" --arg effort "$REASONING_EFFORT" --slurpfile skeleton /tmp/skeleton.json --slurpfile ticket /tmp/ticket.json '
            $skeleton[0] as $s | $ticket[0] as $t
            | $s
            | .modelId = $model_id
            | .messages = [
                { role: "user", content: [{ text: ("<" + $s.tag + ">\n" + ($t.title // "") + "\n\n" + ($t.body // "") + "\n</" + $s.tag + ">") }] },
                { role: "assistant", content: [{ text: $s.prefill }] }
              ]
            | del(.prefill, .tag)
            | if $effort == "" then .
              else .additionalModelRequestFields.reasoningConfig = { type: "enabled", maxReasoningEffort: $effort }
                | if $effort == "high" then del(.inferenceConfig.temperature) else . end
              end' > /tmp/request.json

      - name: Ask the model
        run: |
          set -uo pipefail
          if ! aws bedrock-runtime converse --cli-input-json file:///tmp/request.json > /tmp/response.json 2>/tmp/invoke.err; then
            echo "::error::converse failed: $(node scripts/bedrock-error-line.mjs /tmp/invoke.err)"
            exit 1
          fi
          { printf '{'; jq -j '[.output.message.content[] | select(.text != null) | .text][0] // ""' /tmp/response.json; } > /tmp/answer.txt

      - name: Judge the answer against the fixture
        env:
          FIXTURE: ${{ matrix.fixture }}
        run: node scripts/support-replay.mjs check-reader "$FIXTURE" /tmp/answer.txt
