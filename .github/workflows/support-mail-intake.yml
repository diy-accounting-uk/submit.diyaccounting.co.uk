name: support-mail-intake
run-name: support mail intake

# Opens one private issue per new customer thread in the support@diyaccounting.co.uk inbox. The
# issue lands in private.diyaccounting.co.uk labelled `support` and `maintainer-review`, where
# support-reader.yml reads it and the operator approves it.
#
# This repository is public, so its logs, step summaries and artifacts are public. The script
# prints counts only: no subject, address, message text or thread id. One job holds everything,
# so no mail text passes between jobs. The job holds no Gmail key. It federates to Google, signs a
# read-only delegation assertion for the mailbox, and holds a token that can only write issues in
# the private repository.

on:
  schedule:
    - cron: '2-59/10 * * * *'
    - cron: '17 5 * * *'
  workflow_dispatch:
    inputs:
      dry-run:
        description: read the mailbox and count the new threads without opening any issue
        required: false
        type: boolean
        default: false

permissions: {}

concurrency:
  group: support-mail-intake
  cancel-in-progress: false

env:
  AWS_REGION: 'eu-west-2'

jobs:
  intake:
    if: github.event.schedule != '17 5 * * *'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    environment: prod
    permissions:
      id-token: write
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      - name: Set up Node
        uses: ./.github/actions/setup-toolchain
        with:
          npm-install: scripts
          npm-cache: 'false'

      - name: Generate a token that writes issues in the private repository
        id: private-token
        uses: actions/create-github-app-token@64ab729a6294000f5aa4a4bc0b73d1f32bc45510 # v3.3.0
        with:
          app-id: ${{ vars.AGENT_APP_ID }}
          private-key: ${{ secrets.AGENT_APP_PRIVATE_KEY }}
          owner: diy-accounting-uk
          repositories: private.diyaccounting.co.uk
          permission-issues: write

      - name: Read the GitHub federation provider from infra/google/gcp/identity.toml
        id: google-identity
        run: |
          node -e '
            const TOML = require("@iarna/toml");
            const fs = require("node:fs");
            const c = TOML.parse(fs.readFileSync("infra/google/gcp/identity.toml", "utf-8"));
            const provider = c.workload_identity_pool.provider.find((p) => p.type === "oidc");
            console.log("provider=projects/" + c.project.number + "/locations/global/workloadIdentityPools/" + c.workload_identity_pool.id + "/providers/" + provider.id);
            console.log("project=" + c.project.id);
          ' >> "$GITHUB_OUTPUT"

      # No service_account input: direct federation. The federated principal is this workflow file
      # on main, which holds roles/iam.serviceAccountTokenCreator on support-gmail-read.
      - name: Authenticate to Google by federation
        uses: google-github-actions/auth@7c6bc770dae815cd3e89ee6cdf493a5fab2cc093 # v3.0.0
        with:
          workload_identity_provider: ${{ steps.google-identity.outputs.provider }}
          # The project id stops the Google auth library from a Resource Manager read that the
          # federated principal has no permission for.
          project_id: ${{ steps.google-identity.outputs.project }}

      - name: Open an issue for each new customer thread
        env:
          GH_TOKEN: ${{ steps.private-token.outputs.token }}
          DRY_RUN: ${{ inputs.dry-run }}
        run: |
          set -euo pipefail
          ARGS=()
          if [ "${DRY_RUN}" = "true" ]; then ARGS+=(--dry-run); fi
          node scripts/support-mail-intake.mjs "${ARGS[@]}"

  # The acceptance rate of the support reply drafts, once a day. The draft rows come from the lake;
  # the mailbox is read through the same federated read account. The summary row goes back to the lake. The script
  # prints counts only, as the intake does.
  acceptance:
    if: github.event_name != 'schedule' || github.event.schedule == '17 5 * * *'
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    environment: prod
    permissions:
      id-token: write
      contents: read
    env:
      LAKE_BUCKET: 'prod-env-analytics-lake-${{ vars.SUBMIT_ACCOUNT_ID }}'
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      - name: Set up Node
        uses: ./.github/actions/setup-toolchain
        with:
          npm-install: scripts
          npm-cache: 'false'

      # The dedicated role reads only the support draft rows and writes only the acceptance row.
      # No chaining: the deployment and alarm triage roles are not involved.
      - name: Configure AWS role via GitHub OIDC
        uses: aws-actions/configure-aws-credentials@e1253824e5c10ff9df46874f81ed3ec929e19cfd # v6
        with:
          role-to-assume: ${{ vars.SUBMIT_SUPPORT_ACCEPTANCE_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}
          role-chaining: false
          audience: sts.amazonaws.com
          role-skip-session-tagging: true
          retry-max-attempts: 3

      - name: Fetch the draft rows from the lake
        run: |
          set -euo pipefail
          mkdir -p /tmp/support-drafts
          aws s3 sync "s3://${LAKE_BUCKET}/curated/support-drafts/" /tmp/support-drafts --only-show-errors

      - name: Read the GitHub federation provider from infra/google/gcp/identity.toml
        id: google-identity
        run: |
          node -e '
            const TOML = require("@iarna/toml");
            const fs = require("node:fs");
            const c = TOML.parse(fs.readFileSync("infra/google/gcp/identity.toml", "utf-8"));
            const provider = c.workload_identity_pool.provider.find((p) => p.type === "oidc");
            console.log("provider=projects/" + c.project.number + "/locations/global/workloadIdentityPools/" + c.workload_identity_pool.id + "/providers/" + provider.id);
            console.log("project=" + c.project.id);
          ' >> "$GITHUB_OUTPUT"

      # No service_account input: direct federation. The federated principal is this workflow file
      # on main, which holds roles/iam.serviceAccountTokenCreator on support-gmail-read.
      - name: Authenticate to Google by federation
        uses: google-github-actions/auth@7c6bc770dae815cd3e89ee6cdf493a5fab2cc093 # v3.0.0
        with:
          workload_identity_provider: ${{ steps.google-identity.outputs.provider }}
          # The project id stops the Google auth library from a Resource Manager read that the
          # federated principal has no permission for.
          project_id: ${{ steps.google-identity.outputs.project }}

      - name: Class each old draft and measure the acceptance rate
        id: acceptance
        run: |
          set -euo pipefail
          node scripts/support-draft-acceptance.mjs --rows-dir /tmp/support-drafts --out /tmp/support-draft-acceptance.json
          echo "row=$(cat /tmp/support-draft-acceptance.json)" >> "$GITHUB_OUTPUT"
          echo "key=curated/support-draft-acceptance/dt=$(date -u +%F)/${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}.json" >> "$GITHUB_OUTPUT"

      - name: Write the acceptance row to the lake
        if: steps.acceptance.outputs.row != ''
        uses: ./.github/actions/dora-row
        with:
          bucket: ${{ env.LAKE_BUCKET }}
          key: ${{ steps.acceptance.outputs.key }}
          row: ${{ steps.acceptance.outputs.row }}
