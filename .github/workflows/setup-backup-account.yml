name: setup backup account
run-name: "Setup backup account ${{ inputs.backup-account-id }}"

# Provisions the submit-backup account: the vault that receives backup copies from the
# deployment accounts, and the roles GitHub Actions uses to get in.
#
# The backup account holds nothing else. Keeping it separate means losing a deployment
# account does not lose the backups, which only holds if nothing in a deployment account
# can reach in and delete them - hence the vault access policy in the stack.
#
# ONE-TIME BOOTSTRAP (operator, from a host terminal)
#
# This workflow assumes backup-github-actions-role, and that role is created by the very
# stack the workflow deploys, so the first deploy has to come from somewhere else. Run it
# once by hand with the SSO profile:
#
#   aws sso login --sso-session diyaccounting
#   export AWS_PROFILE=submit-backup
#   export CDK_DEFAULT_ACCOUNT=914216784828
#   export CDK_DEFAULT_REGION=eu-west-2
#   npx cdk bootstrap aws://914216784828/eu-west-2
#   ./mvnw --errors clean verify -DskipTests -P cdk-backup
#   cd cdk-backup && npx cdk deploy --all --require-approval never
#
# Do not run scripts/aws-accounts/bootstrap-account.sh against the backup account. The CDK
# app owns the GitHub OIDC provider and both roles there; the script would create a second
# copy under the same names and the deploy would fail. If it has already been run, delete
# backup-github-actions-role, backup-deployment-role and the OIDC provider first.
#
# After that one deploy, every later change goes through this workflow.

on:
  workflow_dispatch:
    inputs:
      backup-account-id:
        description: 'AWS Account ID for the dedicated backup account'
        type: string
        required: true
        default: '914216784828'
      primary-region:
        description: 'Region holding the cross-account vault'
        type: string
        required: true
        default: 'eu-west-2'
      dry-run:
        description: 'Dry run (cdk diff only, no changes applied)'
        type: boolean
        required: false
        default: true

env:
  JAVA_VERSION: '21'
  BACKUP_ACTIONS_ROLE_ARN: 'arn:aws:iam::${{ inputs.backup-account-id }}:role/backup-github-actions-role'
  BACKUP_DEPLOY_ROLE_ARN: 'arn:aws:iam::${{ inputs.backup-account-id }}:role/backup-deployment-role'

jobs:
  setup:
    name: 'Setup backup account'
    runs-on: ubuntu-24.04
    permissions:
      id-token: write
      contents: read
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Validate inputs
        run: |
          if ! echo "${{ inputs.backup-account-id }}" | grep -qE '^[0-9]{12}$'; then
            echo "ERROR: Invalid AWS Account ID format. Expected 12 digits."
            exit 1
          fi
          echo "Backup account: ${{ inputs.backup-account-id }}"
          echo "Region:         ${{ inputs.primary-region }}"
          echo "Dry run:        ${{ inputs.dry-run }}"

      - uses: actions/setup-node@v6
        with:
          node-version: '22'

      - name: Install npm dependencies
        run: npm ci
        timeout-minutes: 6

      - uses: actions/setup-java@v5
        with:
          distribution: 'temurin'
          java-version: ${{ env.JAVA_VERSION }}
          cache: 'maven'

      - name: Configure AWS role via GitHub OIDC
        uses: aws-actions/configure-aws-credentials@v6
        with:
          role-to-assume: ${{ env.BACKUP_ACTIONS_ROLE_ARN }}
          aws-region: ${{ inputs.primary-region }}
          role-chaining: false
          audience: sts.amazonaws.com
          role-skip-session-tagging: true
          output-credentials: true
          retry-max-attempts: 3

      - name: Assume backup account deployment role
        uses: aws-actions/configure-aws-credentials@v6
        with:
          role-to-assume: ${{ env.BACKUP_DEPLOY_ROLE_ARN }}
          aws-region: ${{ inputs.primary-region }}
          role-chaining: true
          audience: sts.amazonaws.com
          role-skip-session-tagging: true
          output-credentials: true
          retry-max-attempts: 3

      - name: Build backup CDK app
        run: |
          ./mvnw --errors clean verify -DskipTests -P cdk-backup \
            -Dmaven.compiler.source=${{ env.JAVA_VERSION }} \
            -Dmaven.compiler.target=${{ env.JAVA_VERSION }}

      - name: Show planned changes (cdk diff)
        if: inputs.dry-run == true
        working-directory: cdk-backup
        env:
          CDK_DEFAULT_ACCOUNT: ${{ inputs.backup-account-id }}
          CDK_DEFAULT_REGION: ${{ inputs.primary-region }}
        run: |
          npx cdk diff --all --no-notices
          echo ""
          echo "Dry run only. Re-run with dry-run unchecked to apply."

      - name: Deploy backup account stacks
        if: inputs.dry-run == false
        working-directory: cdk-backup
        env:
          CDK_DEFAULT_ACCOUNT: ${{ inputs.backup-account-id }}
          CDK_DEFAULT_REGION: ${{ inputs.primary-region }}
        run: |
          npx cdk deploy --all \
            --require-approval never \
            --ci true \
            --no-notices \
            --outputs-file ../cdk-submit-backup.out/cdk-outputs-backup.json

      - name: Report vault and role details
        if: inputs.dry-run == false
        run: |
          {
            echo "### Backup account ${{ inputs.backup-account-id }}"
            echo ""
            echo '```json'
            jq -r '.' cdk-submit-backup.out/cdk-outputs-backup.json
            echo '```'
            echo ""
            echo "The deployment accounts copy into this vault. Their vault ARN comes from"
            echo "\`crossAccountBackupVaultArn\` in cdk-environment/cdk.json."
          } | tee -a "$GITHUB_STEP_SUMMARY"
