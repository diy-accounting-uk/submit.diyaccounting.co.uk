# deploy: force a clean prod deployment after the EdgeStack WAF fix (bump 02)
name: deploy
run-name: "deploy from ${{ github.ref_name }}"

concurrency:
  # This workflow's own app-level CDK stacks are named after the resolved deployment, normally
  # unique per commit, so two branches don't usually fight over the same stack. What they do
  # share is per-environment state this workflow also writes: the last-known-good SSM
  # parameter, the live CloudFront origin (set-origins), and the Cognito native-auth toggle used
  # for behaviour tests. For the everyday ci push flow the fallback below still keys on the ref
  # and leaves cross-branch ordering to the wait-for-ci-deploys action: a shared 'deploy-ci'
  # group here would queue every ci branch behind one slot, and GitHub only keeps the latest
  # queued run in a group, so a third branch pushing while a second waits would drop the
  # second's run entirely — the exact failure wait-for-ci-deploys exists to avoid. Prod has no
  # such backstop, and workflow_dispatch can send a prod deploy from any branch, so whenever the
  # *effective* target is prod (explicit deployment-name, explicit environment-name, or a push to
  # main) the group always resolves to the same 'deploy-prod', or a same-time push to main and an
  # explicit-input prod dispatch would land in different groups and run concurrently.
  #
  # This group gives no ordering at all against deploy-environment.yml, which used to share this
  # exact group string by accident (both keyed on plain github.ref) until B90 split them so two
  # branches stopped fighting over deploy-environment's shared `{env}-env-*` stacks. That side
  # effect was never written down, so removing it broke deploy.yml's `names` job racing
  # deploy-environment.yml's `deploy identity` job for the DIYA-GL Cognito client (B94). The
  # `wait-for-environment-deploy` job below restores that ordering on purpose, by polling instead
  # of a shared group — see its comment for why a shared group is the wrong tool here.
  group: deploy-${{ inputs.deployment-name || (inputs.environment-name && inputs.environment-name != '(auto)' && inputs.environment-name) || (github.ref == 'refs/heads/main' && 'prod') || github.ref }}
  cancel-in-progress: false

# Bump25

on:
  workflow_dispatch:
    inputs:
      skipDeploy:
        description: 'Skip deploy (run tests only, no deployment)'
        type: choice
        options:
          - 'true'
          - 'false'
        required: false
        default: 'false'
      forceAllStackDeployment:
        description: 'Force re-deploy of all stacks even if they already exist or pass comparison checks'
        type: choice
        options:
          - 'true'
          - 'false'
        required: false
        default: 'true'
      environment-name:
        type: choice
        description: 'Environment name to use instead of computing from branch, e.g. ci or prod'
        required: false
        options:
          - '(auto)'
          - 'ci'
          - 'prod'
        default: '(auto)'
      deployment-name:
        type: string
        description: 'Deployment name to use instead of computing from branch, e.g. ci-lambdas6 or prod-ea373de'
        required: false
        default: ''
      selfDestructDelayHours:
        description: 'Hours before self-destruct triggers for non-prod environments'
        required: false
        default: '4'
      skipTestScenarios:
        description: 'Skip test scenarios for behaviour tests'
        type: choice
        options:
          - 'true'
          - 'false'
        required: false
        default: 'true'
      runProxyBehaviourTests:
        description: 'Run proxy behaviour tests (uses the real local TLS certificate and Docker)'
        type: choice
        options:
          - 'true'
          - 'false'
        required: false
        default: 'false'
      runCompaniesHouseSandboxFiling:
        description: 'Run the Companies House filing suites that sign in to the real sandbox on ci'
        type: choice
        options:
          - 'true'
          - 'false'
        required: false
        default: 'false'
      skipCleanup:
        description: 'Keep test users and native auth enabled after tests (for debugging)'
        type: choice
        options:
          - 'true'
          - 'false'
        required: false
        default: 'false'
  push:
    branches:
      - '**'
      - '!gh_pages'
      - '!dependabot/**'
    paths:
      - 'app/data/**'
      - 'app/functions/**'
      - 'app/lib/**'
      - 'app/services/**'
      - 'infra/main/**'
      - 'web/public/**'
      - '.env.ci'
      - '.env.prod'
      - '**/cdk.json'
      - 'Dockerfile'
      - 'LICENSE'
      - 'package.json'
      - 'package-lock.json'
      - 'pom.xml'
      - 'web/public/submit.catalogue.toml'
      - '.github/actions/**'
      - '.github/workflows/deploy.yml'
      - '.github/workflows/deploy-cdk-stack.yml'
      - '.github/workflows/destroy-prod.yml'
      - '.github/workflows/generate-pass.yml'
      - '.github/workflows/probe-test.yml'
      - '.github/workflows/test.yml'
  schedule:
    - cron: '11 4 * * *'

permissions:
  id-token: write
  contents: read
  pull-requests: read
  pages: write
  actions: read

env:
  JAVA_VERSION: '25'
  NODE_VERSION: '24'
  AWS_REGION: 'eu-west-2'
  BASE_IMAGE_TAG_PREFIX: 'submit-base'
  GITHUB_ACTOR: ${{ github.actor }}
  SELF_DESTRUCT_DELAY_HOURS: ${{ inputs.selfDestructDelayHours || '4' }}
  BASE_IMAGE_TAG: ${{ github.sha }}
  FORCE_ALL_STACK_DEPLOYMENT: ${{ inputs.forceAllStackDeployment || 'true' }}
  COMMIT_HASH: ${{ github.sha }}
  BUILD_NUMBER: ${{ github.run_number }}
  GITHUB_REF: ${{ github.ref }}
  # GITHUB_REF_TO_ENV: resolved per-job via needs.params.outputs.github-environment

jobs:

  params:
    runs-on: ubuntu-24.04
    steps:
      - name: "github.event_name=[${{ github.event_name }}]"
        run: ":"
      - name: "github.ref=[${{ github.ref }}]"
        run: ":"
      - name: "github.sha=[${{ github.sha }}]"
        run: ":"
      - name: "inputs.skipDeploy=[${{ inputs.skipDeploy }}]"
        run: ":"
      - name: "inputs.forceAllStackDeployment=[${{ inputs.forceAllStackDeployment }}]"
        run: ":"
      - name: "inputs.environment-name=[${{ inputs.environment-name }}]"
        run: ":"
      - name: "inputs.deployment-name=[${{ inputs.deployment-name }}]"
        run: ":"
      - name: "inputs.selfDestructDelayHours=[${{ inputs.selfDestructDelayHours }}]"
        run: ":"
      - name: "inputs.skipTestScenarios=[${{ inputs.skipTestScenarios }}]"
        run: ":"
      - name: "inputs.runProxyBehaviourTests=[${{ inputs.runProxyBehaviourTests }}]"
        run: ":"
      - name: "inputs.runCompaniesHouseSandboxFiling=[${{ inputs.runCompaniesHouseSandboxFiling }}]"
        run: ":"
      - name: "inputs.skipCleanup=[${{ inputs.skipCleanup }}]"
        run: ":"
      - name: "github.event.head_commit.message=[${{ github.event.head_commit.message }}]"
        run: ":"
      - name: Normalise Params
        id: normalise
        shell: bash
        env:
          RAW_COMMIT_MSG: ${{ github.event.head_commit.message }}
        run: |
          X='${{ inputs.forceAllStackDeployment }}' ; echo "forceAllStackDeployment=${X:-true}" | tee -a "$GITHUB_OUTPUT"
          X='${{ inputs.skipDeploy }}' ; echo "skipDeploy=${X:-false}" | tee -a "$GITHUB_OUTPUT"
          # Convert '(auto)' to empty string for downstream processing
          ENV_NAME='${{ inputs.environment-name }}'; [[ "$ENV_NAME" == "(auto)" ]] && ENV_NAME=""
          echo "environment-name=${ENV_NAME}" | tee -a "$GITHUB_OUTPUT"
          # Resolve GitHub Actions environment from explicit input or branch
          GH_ENV="${ENV_NAME}"
          if [ -z "$GH_ENV" ]; then
            if [ "${{ github.ref }}" == "refs/heads/main" ]; then GH_ENV="prod"; else GH_ENV="ci"; fi
          fi
          echo "github-environment=${GH_ENV}" | tee -a "$GITHUB_OUTPUT"
          echo 'deployment-name=${{ inputs.deployment-name }}' | tee -a "$GITHUB_OUTPUT"
          X='${{ inputs.selfDestructDelayHours }}' ; echo "selfDestructDelayHours=${X:-2}" | tee -a "$GITHUB_OUTPUT"
          X='${{ inputs.skipTestScenarios }}' ; echo "skipTestScenarios=${X:-true}" | tee -a "$GITHUB_OUTPUT"
          X='${{ inputs.runProxyBehaviourTests }}' ; echo "runProxyBehaviourTests=${X:-false}" | tee -a "$GITHUB_OUTPUT"
          X='${{ inputs.runCompaniesHouseSandboxFiling }}' ; echo "runCompaniesHouseSandboxFiling=${X:-false}" | tee -a "$GITHUB_OUTPUT"
          X='${{ inputs.skipCleanup }}' ; echo "skipCleanup=${X:-false}" | tee -a "$GITHUB_OUTPUT"
          # Compute isSkippingDeploy: true if skipDeploy=true OR (push event with skip: in commit message)
          SKIP_DEPLOY='${{ inputs.skipDeploy }}'
          EVENT_NAME='${{ github.event_name }}'
          # Sanitize commit message: replace chars outside [a-zA-Z0-9 :-] with -, dedupe spaces and dashes
          COMMIT_MSG=$(printf '%s' "$RAW_COMMIT_MSG" | tr -c 'a-zA-Z0-9 :-' '-' | sed 's/--*/-/g; s/  */ /g')
          if [ "${SKIP_DEPLOY:-false}" = "true" ]; then
            echo "isSkippingDeploy=true" | tee -a "$GITHUB_OUTPUT"
          elif [ "$EVENT_NAME" = "push" ] && echo "$COMMIT_MSG" | grep -q "skip:"; then
            echo "isSkippingDeploy=true" | tee -a "$GITHUB_OUTPUT"
          else
            echo "isSkippingDeploy=false" | tee -a "$GITHUB_OUTPUT"
          fi
    outputs:
      skipDeploy: ${{ steps.normalise.outputs.skipDeploy }}
      forceAllStackDeployment: ${{ steps.normalise.outputs.forceAllStackDeployment }}
      environment-name: ${{ steps.normalise.outputs.environment-name }}
      deployment-name: ${{ steps.normalise.outputs.deployment-name }}
      selfDestructDelayHours: ${{ steps.normalise.outputs.selfDestructDelayHours }}
      skipTestScenarios: ${{ steps.normalise.outputs.skipTestScenarios }}
      runProxyBehaviourTests: ${{ steps.normalise.outputs.runProxyBehaviourTests }}
      runCompaniesHouseSandboxFiling: ${{ steps.normalise.outputs.runCompaniesHouseSandboxFiling }}
      skipCleanup: ${{ steps.normalise.outputs.skipCleanup }}
      isSkippingDeploy: ${{ steps.normalise.outputs.isSkippingDeploy }}
      github-environment: ${{ steps.normalise.outputs.github-environment }}

  # A workflow_dispatch naming an explicit deployment-name is about to deploy this same commit,
  # so any push-triggered run of deploy.yml for the same github.sha would otherwise run alongside
  # it and the two contend for the same ci apex alias and Cognito lane user (B140; the coordinator
  # cancelled this by hand three times on 2026-09-13). Runs only for that dispatch shape: a plain
  # push or a dispatch with no deployment-name leaves every other run alone. See
  # cancel-superseded-push-deploy.mjs for why a run whose own stack deploy has already started is
  # never touched.
  #
  # GitHub sometimes delivers one push twice, starting two deploys of the same head a second
  # apart; the newer push-triggered run cancels itself when an older one for the same SHA is
  # still queued or running.
  cancel-superseded-push-deploy:
    name: 'cancel superseded push-triggered deploy'
    if: ${{ (github.event_name == 'workflow_dispatch' && inputs.deployment-name != '') || github.event_name == 'push' }}
    needs:
      - params
    runs-on: ubuntu-24.04
    permissions:
      actions: write
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      # Only ci-set1, ci-set2 and the apex are Cognito callback hosts, so a ci dispatch naming
      # any other set builds stacks whose signed-in probes cannot pass. The whole run is
      # cancelled, because failing one job still lets the probe jobs start.
      - name: Stop a ci dispatch whose deployment-name cannot sign in
        if: ${{ github.event_name == 'workflow_dispatch' && inputs.deployment-name != '' }}
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          TARGET_ENVIRONMENT: ${{ needs.params.outputs.github-environment }}
          DEPLOYMENT_NAME: ${{ needs.params.outputs.deployment-name }}
          SKIP_TEST_SCENARIOS: ${{ needs.params.outputs.skipTestScenarios }}
        run: |
          if [ "$TARGET_ENVIRONMENT" = "ci" ] && [ "$SKIP_TEST_SCENARIOS" = "false" ] \
            && [ "$DEPLOYMENT_NAME" != "ci-set1" ] && [ "$DEPLOYMENT_NAME" != "ci-set2" ]; then
            echo "::error::a ci deployment-name must be ci-set1 or ci-set2 when test scenarios run; other names cannot sign in because only those hosts are Cognito callbacks"
            gh run cancel "${{ github.run_id }}" --repo "${{ github.repository }}"
            exit 1
          fi
      # A push deploys main to prod and any other branch to ci; a dispatch aimed at the other
      # environment covers nothing the push run does, so it leaves that run alone.
      - name: Cancel any push-triggered run of this commit that hasn't started a stack job
        if: ${{ github.event_name == 'workflow_dispatch' && inputs.deployment-name != '' && (needs.params.outputs.github-environment == 'prod') == (github.ref == 'refs/heads/main') }}
        uses: './.github/actions/cancel-superseded-push-deploy'
        with:
          github-token: ${{ github.token }}
      - name: For push events, cancel this run if an older run for the same SHA already exists
        if: ${{ github.event_name == 'push' }}
        shell: bash
        run: |
          OLDER_RUNS=$(gh run list --repo "${{ github.repository }}" --workflow deploy.yml --branch "${{ github.ref_name }}" --json databaseId,headSha,status,event,createdAt --jq ".[] | select(.event == \"push\" and .headSha == \"${{ github.sha }}\" and .databaseId < ${{ github.run_id }}) | select(.status == \"in_progress\" or .status == \"queued\")")

          if [ -z "$OLDER_RUNS" ]; then
            echo "No older push-triggered deploy.yml run for this SHA; proceeding."
            exit 0
          fi

          OLDER_ID=$(echo "$OLDER_RUNS" | jq -r '.databaseId' | head -1)
          echo "Found older push-triggered run $OLDER_ID for SHA ${{ github.sha }} with status in_progress or queued."
          echo "Cancelling this run (${{ github.run_id }}) to avoid duplicate deploy."
          gh run cancel "${{ github.run_id }}" --repo "${{ github.repository }}"
        env:
          GH_TOKEN: ${{ github.token }}

  # Restores app-after-environment ordering on purpose (see the concurrency block's comment for
  # the regression this fixes: B94, caused by removing an ordering nobody had written down when
  # B90 split deploy.yml and deploy-environment.yml's concurrency groups).
  #
  # A shared concurrency group would restore the ordering in one line, but it is the wrong tool:
  # deploy-environment.yml's paths (Java infra source, cdk.json, holding page) change far less
  # often than deploy.yml's (app/functions, web/public, package.json, ...), so folding deploy.yml
  # into deploy-environment.yml's per-environment group would queue every ordinary app-only ci
  # push behind that shared slot too. GitHub keeps only the latest queued run per group, so a
  # third push while a second is queued drops the second's run entirely — exactly the failure
  # wait-for-ci-deploys exists to avoid for deploy.yml's own cross-branch races, and merging
  # groups here would reintroduce it on a wider, busier group. A workflow_run trigger (start
  # deploy.yml only after deploy-environment.yml completes) was also rejected: deploy.yml's push
  # trigger needs to keep firing immediately for the (usual) case where no environment deploy
  # runs at all, and layering a second workflow_run trigger on top risks two runs for one push
  # (one push-triggered, one workflow_run-triggered) with no clean way to dedupe them.
  #
  # So this polls instead, the same technique wait-for-ci-deploys already uses for the other
  # cross-branch race, extended to watch deploy-environment.yml and match by resolved environment
  # rather than by which run was created first: both workflows fire off the same push and can be
  # created in either order a few hundred milliseconds apart, so "older than me" isn't reliable
  # here the way it is for two runs of the same workflow. No deadlock risk: neither workflow calls
  # the other with `uses:`, unlike deploy.yml's `destroy-previous` job calling destroy-prod.yml,
  # which is why that pairing keeps its own distinct group instead of this polling approach.
  #
  # `names` (below) needs this job because its own Cognito lookup is what raced IdentityStack in
  # B94; every job in this workflow that needs `names` — test, mvn-package,
  # npm-unit-test-coverage, push-images(-us-east-1), and everything past them — inherits the wait
  # for free. If you change how either workflow resolves its environment name, keep this in step:
  # it re-derives deploy-environment.yml's side of that resolution from head_branch alone (see
  # environmentResolvedFromBranch in wait-for-ci-deploys.mjs).
  wait-for-environment-deploy:
    name: 'wait for environment deploy'
    needs:
      - params
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - name: Wait for an in-progress or queued deploy-environment.yml run for this environment
        uses: './.github/actions/wait-for-ci-deploys'
        with:
          github-token: ${{ github.token }}
          workflows: 'deploy-environment.yml'
          match-mode: 'environment'
          target-environment: ${{ needs.params.outputs.github-environment }}

  names:
    needs:
      - params
      - wait-for-environment-deploy
    runs-on: ubuntu-24.04
    environment: ${{ needs.params.outputs.github-environment }}
    env:
      # The push trigger's `paths:` list above as git pathspecs, for the two diff checks below;
      # keep the two lists in step.
      DEPLOY_PATHSPECS: >-
        :(glob)app/data/** :(glob)app/functions/** :(glob)app/lib/** :(glob)app/services/**
        :(glob)infra/main/** :(glob)web/public/** .env.ci .env.prod :(glob)**/cdk.json
        Dockerfile LICENSE package.json package-lock.json pom.xml
        web/public/submit.catalogue.toml :(glob).github/actions/** .github/workflows/deploy.yml
        .github/workflows/deploy-cdk-stack.yml .github/workflows/destroy-prod.yml
        .github/workflows/generate-pass.yml .github/workflows/probe-test.yml .github/workflows/test.yml
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          # The live-head and package.json checks below diff against a commit that isn't
          # necessarily the default shallow depth away (the previous live prod deploy, or the
          # push's own previous head), so both need real history. workflow_dispatch never runs
          # either check, so it keeps the cheap shallow clone.
          fetch-depth: ${{ github.event_name == 'workflow_dispatch' && 1 || 0 }}

      # push's own `paths:` filter can't see inside package.json, so a scripts-only addition
      # (a new npm script) still matches the 'package.json' entry there and triggers a full
      # deploy. Diffing the two commits' package.json with `scripts` removed from
      # both tells a real dependency/engine/bundle-input change from a scripts-only one; only a
      # push has a `before` commit to diff against.
      - name: Check whether this push only changed package.json's scripts
        id: package-json-check
        if: ${{ github.event_name == 'push' }}
        shell: bash
        run: |
          BEFORE_SHA="${{ github.event.before }}"
          if [ -z "$BEFORE_SHA" ] || [ "$BEFORE_SHA" = "0000000000000000000000000000000000000000" ]; then
            echo "No previous head for this push (new branch); not treating as a scripts-only change."
            echo "package-json-scripts-only=false" | tee -a "$GITHUB_OUTPUT"
            exit 0
          fi
          if ! git rev-parse --verify "${BEFORE_SHA}^{commit}" >/dev/null 2>&1; then
            echo "Previous head $BEFORE_SHA not found in this checkout's history; not treating as a scripts-only change."
            echo "package-json-scripts-only=false" | tee -a "$GITHUB_OUTPUT"
            exit 0
          fi
          CHANGED=$(git diff --name-only "$BEFORE_SHA"..HEAD -- $DEPLOY_PATHSPECS)
          if [ "$CHANGED" != "package.json" ]; then
            echo "This push's deploy-relevant changes are not package.json alone:"
            echo "$CHANGED"
            echo "package-json-scripts-only=false" | tee -a "$GITHUB_OUTPUT"
            exit 0
          fi
          if ! git show "${BEFORE_SHA}:package.json" > /tmp/package.before.json 2>/dev/null; then
            echo "package.json did not exist at the previous head; not treating as a scripts-only change."
            echo "package-json-scripts-only=false" | tee -a "$GITHUB_OUTPUT"
            exit 0
          fi
          git show HEAD:package.json > /tmp/package.after.json
          if node -e '
            const fs = require("fs");
            function deepEqual(a, b) {
              if (a === b) return true;
              if (typeof a !== typeof b || a === null || b === null || typeof a !== "object") return false;
              const aKeys = Object.keys(a).sort();
              const bKeys = Object.keys(b).sort();
              if (aKeys.length !== bKeys.length) return false;
              return aKeys.every((k, i) => k === bKeys[i] && deepEqual(a[k], b[k]));
            }
            const before = JSON.parse(fs.readFileSync("/tmp/package.before.json", "utf8"));
            const after = JSON.parse(fs.readFileSync("/tmp/package.after.json", "utf8"));
            delete before.scripts;
            delete after.scripts;
            process.exit(deepEqual(before, after) ? 0 : 1);
          '; then
            echo "package.json changed only in its scripts object."
            echo "package-json-scripts-only=true" | tee -a "$GITHUB_OUTPUT"
          else
            echo "package.json changed outside its scripts object."
            echo "package-json-scripts-only=false" | tee -a "$GITHUB_OUTPUT"
          fi

      - name: Configure AWS role via GitHub OIDC
        uses: aws-actions/configure-aws-credentials@e1253824e5c10ff9df46874f81ed3ec929e19cfd # v6
        with:
          role-to-assume: ${{ vars.SUBMIT_ACTIONS_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}
          role-chaining: false
          audience: sts.amazonaws.com
          role-skip-session-tagging: true
          output-credentials: true
          retry-max-attempts: 3

      - name: Assume AWS deployment role
        uses: aws-actions/configure-aws-credentials@e1253824e5c10ff9df46874f81ed3ec929e19cfd # v6
        with:
          role-to-assume: ${{ vars.SUBMIT_DEPLOY_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}
          role-chaining: true
          audience: sts.amazonaws.com
          role-skip-session-tagging: true
          output-credentials: true
          retry-max-attempts: 3

      - name: "needs.params.outputs.isSkippingDeploy=[${{ needs.params.outputs.isSkippingDeploy }}]"
        run: ":"

      # The schedule trigger has no push event to filter by `paths:`, so a nightly run redeploys
      # and re-cuts prod even when HEAD only changed files the push trigger would have ignored
      # (e.g. a .md-only commit). /submit/prod/last-known-good-deployment names the sha that is
      # actually live (set only after set-origins and web-test both succeed on a previous run),
      # so its suffix is compared against HEAD directly instead of trusting the schedule to have
      # fired on a real change.
      - name: Check whether the live prod head is already current
        id: live-head-check
        if: ${{ github.event_name == 'schedule' }}
        shell: bash
        run: |
          PARAMETER_NAME="/submit/prod/last-known-good-deployment"
          LIVE_DEPLOYMENT=$(aws ssm get-parameter --name "$PARAMETER_NAME" --query "Parameter.Value" --output text 2>/dev/null || echo "")
          if [ -z "$LIVE_DEPLOYMENT" ] || [ "$LIVE_DEPLOYMENT" = "None" ]; then
            echo "No last-known-good prod deployment on record; treating the live head as not current."
            echo "live-head-is-current=false" | tee -a "$GITHUB_OUTPUT"
            exit 0
          fi
          echo "$LIVE_DEPLOYMENT" > /tmp/last_known_good_deployment.txt
          LIVE_SHA7="${LIVE_DEPLOYMENT#prod-}"
          CURRENT_SHA7="${GITHUB_SHA::7}"
          if [ "$LIVE_SHA7" = "$CURRENT_SHA7" ]; then
            echo "HEAD ($CURRENT_SHA7) is already the live deployment ($LIVE_DEPLOYMENT)."
            echo "live-head-is-current=true" | tee -a "$GITHUB_OUTPUT"
            exit 0
          fi
          if ! git rev-parse --verify "${LIVE_SHA7}^{commit}" >/dev/null 2>&1; then
            echo "Live sha $LIVE_SHA7 not found in this checkout's history; treating the live head as not current."
            echo "live-head-is-current=false" | tee -a "$GITHUB_OUTPUT"
            exit 0
          fi
          LIVE_SHA_FULL=$(git rev-parse "$LIVE_SHA7")
          CHANGED=$(git diff --name-only "$LIVE_SHA_FULL"..HEAD -- $DEPLOY_PATHSPECS)
          if [ -z "$CHANGED" ]; then
            echo "No files under deploy.yml's push paths changed between $LIVE_SHA_FULL and HEAD."
            echo "live-head-is-current=true" | tee -a "$GITHUB_OUTPUT"
          else
            echo "Deploy-relevant files changed since the live deployment:"
            echo "$CHANGED"
            echo "live-head-is-current=false" | tee -a "$GITHUB_OUTPUT"
          fi

      - name: If main and skipping deploy, read back last known good prod deployment from SSM Parameter Store
        if: ${{ (needs.params.outputs.isSkippingDeploy == 'true' || steps.package-json-check.outputs.package-json-scripts-only == 'true') && needs.params.outputs.deployment-name == '' && github.ref == 'refs/heads/main' }}
        run: |
          PARAMETER_NAME="/submit/prod/last-known-good-deployment"
          LAST_KNOWN_GOOD=$(aws ssm get-parameter --name "$PARAMETER_NAME" --query "Parameter.Value" --output text 2>/dev/null || echo "")
          if [ -n "$LAST_KNOWN_GOOD" ] && [ "$LAST_KNOWN_GOOD" != "None" ]; then
            echo "$LAST_KNOWN_GOOD" > /tmp/last_known_good_deployment.txt
          fi
          echo "Last known good deployment: ${LAST_KNOWN_GOOD:-<none>}"

      - name: If not main and skipping deploy, read back last known good ci deployment from SSM Parameter Store
        if: ${{ needs.params.outputs.isSkippingDeploy == 'true' && needs.params.outputs.deployment-name == '' && github.ref != 'refs/heads/main' }}
        run: |
          PARAMETER_NAME="/submit/ci/last-known-good-deployment"
          LAST_KNOWN_GOOD=$(aws ssm get-parameter --name "$PARAMETER_NAME" --query "Parameter.Value" --output text 2>/dev/null || echo "")
          if [ -n "$LAST_KNOWN_GOOD" ] && [ "$LAST_KNOWN_GOOD" != "None" ]; then
            echo "$LAST_KNOWN_GOOD" > /tmp/last_known_good_deployment.txt
          fi
          echo "Last known good deployment: ${LAST_KNOWN_GOOD:-<none>}"

      - name: Determine deployment name to use
        id: resolved-deployment-name
        run: |
          # If skipping deploy (explicitly, or because the live head is already current, or
          # because this push only changed package.json's scripts) AND we found a
          # last-known-good deployment, use that. Otherwise, pass empty/params value to let
          # get-names compute from commit hash or branch.
          if { [ "${{ needs.params.outputs.isSkippingDeploy }}" = "true" ] || [ "${{ steps.live-head-check.outputs.live-head-is-current }}" = "true" ] || [ "${{ steps.package-json-check.outputs.package-json-scripts-only }}" = "true" ]; } && [ -s /tmp/last_known_good_deployment.txt ]; then
              echo "Using last known good deployment from SSM Parameter Store (skipping deploy)"
              echo "deployment-name=$(cat /tmp/last_known_good_deployment.txt)" | tee -a "$GITHUB_OUTPUT"
          elif [ -n "${{ needs.params.outputs.deployment-name }}" ]; then
              echo "Using explicitly provided deployment name"
              echo "deployment-name=${{ needs.params.outputs.deployment-name }}" | tee -a "$GITHUB_OUTPUT"
          else
              echo "Deployment in progress - get-names will compute deployment name from commit hash"
              echo "deployment-name=" | tee -a "$GITHUB_OUTPUT"
          fi

      # Only a plain ci push or dispatch reaches here with no name already resolved: a prod
      # deploy always resolves its own name below (get-names hashes the commit), a
      # skip-deploy run already read one back from last-known-good, and an explicit
      # deployment-name dispatch bypasses the pool.
      - name: Claim a ci slot
        id: claim-slot
        if: ${{ needs.params.outputs.github-environment == 'ci' && steps.resolved-deployment-name.outputs.deployment-name == '' }}
        uses: './.github/actions/claim-ci-slot'
        with:
          github-ref: ${{ github.ref }}
          run-id: ${{ github.run_id }}
          github-token: ${{ github.token }}
          self-destruct-delay-hours: ${{ env.SELF_DESTRUCT_DELAY_HOURS }}

      - name: Compute deployment name and environment
        id: deployment-config
        uses: './.github/actions/get-names'
        with:
          environment-name: ${{ needs.params.outputs.environment-name || '' }}
          deployment-name: ${{ steps.resolved-deployment-name.outputs.deployment-name || steps.claim-slot.outputs.deployment-name }}

      - name: Lookup Cognito from domain convention
        id: lookup-cognito
        uses: './.github/actions/lookup-resources'
        with:
          environment-name: ${{ steps.deployment-config.outputs.environment-name }}
          lookup-cognito: 'true'

      # A push-triggered redeploy re-runs this workflow against a deployment that may already
      # have a SelfDestructStack with a schedule ticking down. "now + delay hours" here would
      # overwrite that schedule with a new one, pushing the deployment's teardown out every time
      # it is redeployed — a branch under active development would then never self-destruct.
      # CloudFormation's own CreationTime for the stack survives updates (only its
      # LastUpdatedTime moves), so it is the one fixed point that identifies this deployment's
      # actual first deploy: read it back and anchor the delay to it instead of to "now". Skipped
      # for prod, which never deploys a SelfDestructStack (see deploy-application-self-destruct's
      # `if:` below) and has no such stack to look up.
      #
      # A ci slot name is different: the same stack name outlives any one ref, so its
      # CreationTime can belong to whichever ref claimed the slot first, not to this run. Anchoring
      # a reclaim to that stale CreationTime could start the window already expired. claim-ci-slot
      # stamps a fresh claimedAt on every claim or reclaim, so a slot deployment anchors there
      # instead, always restarting the window from the claim.
      - name: Resolve self-destruct start datetime, anchored to this deployment's own creation
        id: self-destruct-start
        if: ${{ steps.deployment-config.outputs.environment-name != 'prod' }}
        shell: bash
        run: |
          STACK_NAME="${{ steps.deployment-config.outputs.deployment-name }}-app-SelfDestructStack"
          EXISTING_CREATION_TIME=$(aws cloudformation describe-stacks \
            --stack-name "$STACK_NAME" \
            --query "Stacks[0].CreationTime" \
            --output text 2>/dev/null || echo "")
          if [ -n "${{ steps.claim-slot.outputs.deployment-name }}" ]; then
            ANCHOR_DATETIME="${{ steps.claim-slot.outputs.claimed-at }}"
            echo "Slot ${{ steps.deployment-config.outputs.deployment-name }} was claimed at $ANCHOR_DATETIME; anchoring self-destruct to the claim, not to the stack's CreationTime"
          elif [ -n "$EXISTING_CREATION_TIME" ] && [ "$EXISTING_CREATION_TIME" != "None" ]; then
            echo "Found existing $STACK_NAME created at $EXISTING_CREATION_TIME; anchoring self-destruct to that creation time, not to this redeploy"
            ANCHOR_DATETIME="$EXISTING_CREATION_TIME"
          else
            echo "No existing $STACK_NAME found; this is the deployment's first deploy, anchoring self-destruct to now"
            ANCHOR_DATETIME=$(date -u +"%Y-%m-%dT%H:%M:%SZ")
          fi
          SELF_DESTRUCT_START_DATETIME=$(date -u -d "$ANCHOR_DATETIME + ${{ env.SELF_DESTRUCT_DELAY_HOURS }} hours" +"%Y-%m-%dT%H:%M:%SZ")
          echo "SELF_DESTRUCT_START_DATETIME=$SELF_DESTRUCT_START_DATETIME"
          echo "SELF_DESTRUCT_START_DATETIME=$SELF_DESTRUCT_START_DATETIME" >> $GITHUB_OUTPUT
          # Carried as an output because a reusable workflow's `with:` block cannot read the
          # `env` context, only github/inputs/matrix/needs/strategy/vars. A step's `run:` can,
          # so the delay travels out of here alongside the start time it was used to compute.
          echo "SELF_DESTRUCT_DELAY_HOURS=${{ env.SELF_DESTRUCT_DELAY_HOURS }}" >> $GITHUB_OUTPUT
          # Carried out so the refusal check below (a separate step, for a focused diff) can
          # tell "redeploy of an existing stack" from "this deployment's first deploy" without
          # re-running the same describe-stacks call.
          if [ -n "$EXISTING_CREATION_TIME" ] && [ "$EXISTING_CREATION_TIME" != "None" ]; then
            echo "EXISTING_STACK_FOUND=true" >> "$GITHUB_OUTPUT"
          else
            echo "EXISTING_STACK_FOUND=false" >> "$GITHUB_OUTPUT"
          fi

      # B127: ci-claud20c8 was created 19:37 UTC 2026-09-13 with the 2-hour default; the branch
      # was rebased and pushed; the self-destruct fired 21:37 while the redeploy was recreating
      # ApiStack, and the run failed with "Function not found ...custom-authorizer". Re-anchoring
      # the schedule on every redeploy (so it always moves forward) was rejected on purpose: the
      # anchor-to-CreationTime design immediately above exists specifically so a branch under
      # active development still self-destructs on schedule instead of never — see that step's
      # own comment. Refusing the redeploy here keeps that guarantee and stops it from landing
      # mid-stack-recreation instead: it fails before push-images, mvn-package or any stack job
      # runs, so nothing is left half-deployed.
      #
      # The EventBridge cron this reproduces is SelfDestructStack's own hourExpression logic
      # (24 % delayHours == 0: fires every delayHours hours on the hour that divides evenly from
      # the anchor's hour; otherwise once daily at the anchor's hour) — see SelfDestructStack.java.
      # Only checked for a genuine redeploy of an existing stack: a first deploy's own first fire
      # is always a full selfDestructDelayHours away, which the default (2h) and every documented
      # use of this input clears easily.
      - name: Refuse the redeploy if this deployment's next self-destruct fire is imminent
        if: ${{ steps.deployment-config.outputs.environment-name != 'prod' && steps.self-destruct-start.outputs.EXISTING_STACK_FOUND == 'true' }}
        shell: bash
        run: |
          DELAY_HOURS=${{ env.SELF_DESTRUCT_DELAY_HOURS }}
          START_EPOCH=$(date -u -d "${{ steps.self-destruct-start.outputs.SELF_DESTRUCT_START_DATETIME }}" +%s)
          NOW_EPOCH=$(date -u +%s)
          if [ $((24 % DELAY_HOURS)) -eq 0 ]; then
            PERIOD_SECONDS=$((DELAY_HOURS * 3600))
          else
            # SelfDestructStack.java falls back to a single fixed hour (fires once daily) when
            # delayHours doesn't divide 24 evenly.
            PERIOD_SECONDS=$((24 * 3600))
          fi
          if [ "$NOW_EPOCH" -le "$START_EPOCH" ]; then
            NEXT_FIRE_EPOCH=$START_EPOCH
          else
            ELAPSED=$((NOW_EPOCH - START_EPOCH))
            PERIODS_ELAPSED=$(((ELAPSED + PERIOD_SECONDS - 1) / PERIOD_SECONDS))
            NEXT_FIRE_EPOCH=$((START_EPOCH + PERIODS_ELAPSED * PERIOD_SECONDS))
          fi
          SECONDS_UNTIL_FIRE=$((NEXT_FIRE_EPOCH - NOW_EPOCH))
          MINUTES_UNTIL_FIRE=$((SECONDS_UNTIL_FIRE / 60))
          NEXT_FIRE_ISO=$(date -u -d "@$NEXT_FIRE_EPOCH" +"%Y-%m-%dT%H:%M:%SZ")
          echo "Next self-destruct fire for ${{ steps.deployment-config.outputs.deployment-name }}-app-SelfDestructStack: $NEXT_FIRE_ISO ($MINUTES_UNTIL_FIRE minutes away)"
          if [ "$SECONDS_UNTIL_FIRE" -lt 2700 ]; then
            echo "::error::Refusing this redeploy: ${{ steps.deployment-config.outputs.deployment-name }}'s self-destruct fires at $NEXT_FIRE_ISO, only $MINUTES_UNTIL_FIRE minutes away, and would tear this redeploy's stacks down mid-flight (B127). Wait for it to pass, or dispatch deploy.yml with an explicit deployment-name to deploy under a fresh name instead."
            exit 1
          fi
    outputs:
      environment-name: ${{ steps.deployment-config.outputs.environment-name }}
      deployment-name: ${{ steps.deployment-config.outputs.deployment-name }}
      base-domain: ${{ steps.deployment-config.outputs.base-domain }}
      base-url:      ${{ steps.deployment-config.outputs.base-url }}
      apex-domain: ${{ steps.deployment-config.outputs.apex-domain }}
      apex-url: ${{ steps.deployment-config.outputs.apex-url }}
      public-url: ${{ steps.deployment-config.outputs.public-url }}
      holding-domain: ${{ steps.deployment-config.outputs.holding-domain }}
      holding-url: ${{ steps.deployment-config.outputs.holding-url }}
      prod-apex-alias: ${{ steps.deployment-config.outputs.prod-apex-alias }}
      cognito-user-pool-arn: ${{ steps.lookup-cognito.outputs.cognito-user-pool-arn }}
      cognito-client-id: ${{ steps.lookup-cognito.outputs.cognito-client-id }}
      cognito-diya-gl-client-id: ${{ steps.lookup-cognito.outputs.cognito-diya-gl-client-id }}
      cognito-mcp-client-id: ${{ steps.lookup-cognito.outputs.cognito-mcp-client-id }}
      self-destruct-start-datetime: ${{ steps.self-destruct-start.outputs.SELF_DESTRUCT_START_DATETIME }}
      self-destruct-delay-hours: ${{ steps.self-destruct-start.outputs.SELF_DESTRUCT_DELAY_HOURS }}
      live-head-is-current: ${{ steps.live-head-check.outputs.live-head-is-current }}
      package-json-scripts-only: ${{ steps.package-json-check.outputs.package-json-scripts-only }}

  test:
    name: 'delegate to test workflow'
    needs:
      - params
      - names
    uses: ./.github/workflows/test.yml
    permissions:
      contents: read
      packages: read
      id-token: write
    with:
      environment-name: ${{ needs.names.outputs.environment-name }}
      deployment-name: ${{ needs.names.outputs.deployment-name }}
      runProxyBehaviourTests: ${{ needs.params.outputs.runProxyBehaviourTests }}
    secrets:
      HMRC_SANDBOX_CLIENT_SECRET: ${{ secrets.HMRC_SANDBOX_CLIENT_SECRET }}

  npm-unit-test-coverage:
    name: 'npm unit test with coverage'
    runs-on: ubuntu-latest
    needs:
      - names
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - name: Setup Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'

      - run: timeout 120 npm ci --prefer-offline || { sleep 30; timeout 180 npm ci; }
        timeout-minutes: 6
        env:
          NPM_CONFIG_FETCH_RETRIES: "3"

      - run: npm run test:coverage

      - name: Upload coverage reports
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        if: ${{ !cancelled() }}
        with:
          name: coverage-reports
          path: coverage/
          retention-days: 7

  mvn-package:
    name: 'maven package'
    runs-on: ubuntu-latest
    needs:
      - names
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961 # v5
        with:
          distribution: 'temurin'
          java-version: ${{ env.JAVA_VERSION }}
          cache: 'maven'

      - name: package
        id: package
        shell: bash
        run: |
          MVN_ARGS="clean verify -DskipTests -Dmaven.compiler.source=${{ env.JAVA_VERSION }} -Dmaven.compiler.target=${{ env.JAVA_VERSION }} -Dmaven.wagon.http.retryHandler.count=3 -Daether.connector.http.retryHandler.count=3"
          ./mvnw $MVN_ARGS || { sleep 30; ./mvnw $MVN_ARGS || { sleep 60; ./mvnw $MVN_ARGS; }; }

      - name: Upload Maven build artifact
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: maven-target
          path: |
            target/submit-application.jar
            target/submit-environment.jar
          if-no-files-found: error
          retention-days: 1

  # NOTE: behaviour-test-submit-vat has been moved to test.yml as behaviour-test-proxy-submit-vat
  # It runs when runProxyBehaviourTests=true is passed to the test workflow

  test-aws-credentials:
    name: 'test aws credentials'
    needs:
      - params
    runs-on: ubuntu-24.04
    environment: ${{ needs.params.outputs.github-environment }}
    steps:
      - name: Configure AWS role via GitHub OIDC
        uses: aws-actions/configure-aws-credentials@e1253824e5c10ff9df46874f81ed3ec929e19cfd # v6
        with:
          role-to-assume: ${{ vars.SUBMIT_ACTIONS_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}
          role-chaining: false
          audience: sts.amazonaws.com
          role-skip-session-tagging: true
          output-credentials: true
          retry-max-attempts: 3

      - name: Assume AWS deployment role
        uses: aws-actions/configure-aws-credentials@e1253824e5c10ff9df46874f81ed3ec929e19cfd # v6
        with:
          role-to-assume: ${{ vars.SUBMIT_DEPLOY_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}
          role-chaining: true
          audience: sts.amazonaws.com
          role-skip-session-tagging: true
          output-credentials: true
          retry-max-attempts: 3

      - name: CDK stacks in eu-west-2 and us-east-1
        run: |
          aws cloudformation describe-stacks --region eu-west-2 --query "Stacks[].StackName" --output text | tr '\t' '\n' | sort
          aws cloudformation describe-stacks --region us-east-1 --query "Stacks[].StackName" --output text | tr '\t' '\n' | sort

  skip-deploy-check:
    name: 'skip deploy check'
    needs:
      - params
      - names
    if: ${{ needs.params.outputs.isSkippingDeploy != 'true' && needs.names.outputs.live-head-is-current != 'true' && needs.names.outputs.package-json-scripts-only != 'true' }}
    runs-on: ubuntu-24.04
    environment: ${{ needs.params.outputs.github-environment }}
    steps:
      - name: Check if skipDeploy is set
        id: check
        run: |
          echo "params.skipDeploy=${{ needs.params.outputs.skipDeploy }}"
          echo "params.isSkippingDeploy=${{ needs.params.outputs.isSkippingDeploy }}"
          echo "names.live-head-is-current=${{ needs.names.outputs.live-head-is-current }}"
          echo "names.package-json-scripts-only=${{ needs.names.outputs.package-json-scripts-only }}"
          echo "isSkippingDeploy=${{ needs.params.outputs.isSkippingDeploy }}" >> "$GITHUB_OUTPUT"

    outputs:
      isSkippingDeploy: ${{ needs.params.outputs.isSkippingDeploy }}

  docker-build:
    name: 'docker build'
    needs:
      - params
      - skip-deploy-check
    runs-on: ubuntu-24.04
    environment: ${{ needs.params.outputs.github-environment }}
    steps:
      - name: Set up Docker
        uses: docker/setup-buildx-action@594f3bf4285d9ea8dc53c9a0c9c4092420091003 # v4
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - name: Setup Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'

      - name: Node dependencies
        run: timeout 120 npm ci --prefer-offline || { sleep 30; timeout 180 npm ci; }
        timeout-minutes: 6
        env:
          NPM_CONFIG_FETCH_RETRIES: "3"

      - name: Build base image
        run: |
          docker buildx build \
            --platform linux/arm64 \
            --provenance=false \
            --cache-from type=gha \
            --cache-to type=gha,mode=max \
            --load \
            -t "${{ env.BASE_IMAGE_TAG_PREFIX }}:${{ github.sha }}" \
            -f Dockerfile .

      - name: Save image artifact
        run: |
          mkdir docker-image
          docker save -o docker-image/image.tar "${{ env.BASE_IMAGE_TAG_PREFIX }}:${{ github.sha }}"

      - name: Upload image artifact
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: docker-image
          path: docker-image/image.tar
          if-no-files-found: error

  wait-for-previous-cleanup:
    name: 'wait for previous cleanup'
    needs:
      - params
      - names
    runs-on: ubuntu-24.04
    environment: ${{ needs.params.outputs.github-environment }}
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - name: Wait for older ci deploy runs to finish
        if: ${{ needs.names.outputs.environment-name != 'prod' }}
        uses: './.github/actions/wait-for-ci-deploys'
        with:
          github-token: ${{ github.token }}

      - name: Configure AWS role via GitHub OIDC
        uses: aws-actions/configure-aws-credentials@e1253824e5c10ff9df46874f81ed3ec929e19cfd # v6
        with:
          role-to-assume: ${{ vars.SUBMIT_ACTIONS_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}
          role-chaining: false
          audience: sts.amazonaws.com
          role-skip-session-tagging: true
          output-credentials: true
          retry-max-attempts: 3

      - name: Assume AWS deployment role
        uses: aws-actions/configure-aws-credentials@e1253824e5c10ff9df46874f81ed3ec929e19cfd # v6
        with:
          role-to-assume: ${{ vars.SUBMIT_DEPLOY_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}
          role-chaining: true
          audience: sts.amazonaws.com
          role-skip-session-tagging: true
          output-credentials: true
          retry-max-attempts: 3

      - name: Wait for any DELETE_IN_PROGRESS stacks
        run: |
          DEPLOYMENT_PREFIX="${{ needs.names.outputs.deployment-name }}-app"
          MAX_WAIT_SECONDS=300
          POLL_INTERVAL=15
          ELAPSED=0

          echo "Checking for stacks with prefix: ${DEPLOYMENT_PREFIX} in DELETE_IN_PROGRESS state"

          while [ $ELAPSED -lt $MAX_WAIT_SECONDS ]; do
            DELETING_STACKS=$(aws cloudformation list-stacks \
              --stack-status-filter DELETE_IN_PROGRESS \
              --query "StackSummaries[?starts_with(StackName, '${DEPLOYMENT_PREFIX}')].StackName" \
              --output text)

            if [ -z "$DELETING_STACKS" ] || [ "$DELETING_STACKS" == "None" ]; then
              echo "No stacks in DELETE_IN_PROGRESS state. Proceeding with deployment."
              exit 0
            fi

            echo "Found stacks still deleting: ${DELETING_STACKS}"
            echo "Waiting ${POLL_INTERVAL} seconds... (${ELAPSED}s / ${MAX_WAIT_SECONDS}s)"
            sleep $POLL_INTERVAL
            ELAPSED=$((ELAPSED + POLL_INTERVAL))
          done

          echo "Warning: Some stacks may still be deleting after ${MAX_WAIT_SECONDS}s timeout. Proceeding anyway."
          echo "Stacks still in DELETE_IN_PROGRESS: ${DELETING_STACKS}"

  validate-secrets:
    name: 'validate required secrets'
    needs:
      - params
      - names
    runs-on: ubuntu-24.04
    environment: ${{ needs.params.outputs.github-environment }}
    steps:
      - name: Configure AWS role via GitHub OIDC
        uses: aws-actions/configure-aws-credentials@e1253824e5c10ff9df46874f81ed3ec929e19cfd # v6
        with:
          role-to-assume: ${{ vars.SUBMIT_ACTIONS_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}
          role-chaining: false
          audience: sts.amazonaws.com
          role-skip-session-tagging: true
          output-credentials: true
          retry-max-attempts: 3

      - name: Assume AWS deployment role
        uses: aws-actions/configure-aws-credentials@e1253824e5c10ff9df46874f81ed3ec929e19cfd # v6
        with:
          role-to-assume: ${{ vars.SUBMIT_DEPLOY_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}
          role-chaining: true
          audience: sts.amazonaws.com
          role-skip-session-tagging: true
          output-credentials: true
          retry-max-attempts: 3

      - name: Validate all required secrets exist
        id: validate
        run: |
          ENV_NAME="${{ needs.names.outputs.environment-name }}"
          MISSING=""
          ALL_VALID=true

          echo "=== Validating secrets for environment: $ENV_NAME ==="
          echo ""

          # List of required secrets
          SECRETS=(
            "$ENV_NAME/submit/user-sub-hash-salt"
            "$ENV_NAME/submit/google/client_secret"
            "$ENV_NAME/submit/hmrc/client_secret"
            "$ENV_NAME/submit/hmrc/sandbox_client_secret"
            "$ENV_NAME/submit/companies-house/api_key"
          )

          for SECRET in "${SECRETS[@]}"; do
            echo -n "Checking: $SECRET ... "
            if aws secretsmanager describe-secret --secret-id "$SECRET" --region ${{ env.AWS_REGION }} 2>/dev/null; then
              # Verify it has a value
              VALUE=$(aws secretsmanager get-secret-value --secret-id "$SECRET" \
                --query 'SecretString' --output text --region ${{ env.AWS_REGION }} 2>/dev/null || echo "")
              if [ -n "$VALUE" ] && [ "$VALUE" != "null" ]; then
                echo "OK (has value)"
              else
                echo "EMPTY VALUE"
                MISSING="$MISSING\n  - $SECRET (exists but empty)"
                ALL_VALID=false
              fi
            else
              echo "MISSING"
              MISSING="$MISSING\n  - $SECRET"
              ALL_VALID=false
            fi
          done

          echo ""

          if [ "$ALL_VALID" = "false" ]; then
            echo "=============================================="
            echo "ERROR: Missing or invalid secrets detected!"
            echo "=============================================="
            echo -e "Missing secrets:$MISSING"
            echo ""
            echo "To fix this, run the 'deploy environment' workflow first:"
            echo "  1. Go to Actions -> 'deploy environment'"
            echo "  2. Run workflow for the '$ENV_NAME' environment"
            echo ""
            echo "Or use the 'manage secrets' workflow to check status:"
            echo "  1. Go to Actions -> 'manage secrets'"
            echo "  2. Select 'check' action for '$ENV_NAME' environment"
            echo ""
            exit 1
          fi

          echo "All required secrets validated successfully"
          echo "secrets-valid=true" >> $GITHUB_OUTPUT

      - name: Validate salt secret specifically
        run: |
          ENV_NAME="${{ needs.names.outputs.environment-name }}"
          SECRET_NAME="$ENV_NAME/submit/user-sub-hash-salt"

          echo "=== Salt Secret Validation ==="
          echo "Checking: $SECRET_NAME"

          # Get secret metadata
          METADATA=$(aws secretsmanager describe-secret --secret-id "$SECRET_NAME" --region ${{ env.AWS_REGION }} 2>/dev/null || echo "")

          if [ -z "$METADATA" ]; then
            echo "CRITICAL: Salt secret does not exist!"
            echo "This will cause all Lambda functions to fail at runtime."
            exit 1
          fi

          # Check for tags
          echo ""
          echo "Secret metadata:"
          echo "$METADATA" | jq '{Name: .Name, Created: .CreatedDate, Modified: .LastChangedDate, Tags: .Tags}'

          # Verify value exists and has expected length
          VALUE=$(aws secretsmanager get-secret-value --secret-id "$SECRET_NAME" \
            --query 'SecretString' --output text --region ${{ env.AWS_REGION }} 2>/dev/null || echo "")

          if [ -z "$VALUE" ]; then
            echo "CRITICAL: Salt secret has no value!"
            exit 1
          fi

          VALUE_LENGTH=${#VALUE}
          echo ""
          echo "Salt value length: $VALUE_LENGTH characters"

          # Base64-encoded 32-byte salt should be ~44 characters
          if [ $VALUE_LENGTH -lt 40 ]; then
            echo "WARNING: Salt value seems short (expected ~44 chars for 32-byte base64)"
          else
            echo "Salt value length appears valid"
          fi

          echo ""
          echo "Salt secret validation passed"

    outputs:
      secrets-valid: ${{ steps.validate.outputs.secrets-valid }}

  push-images:
    name: 'push images'
    needs:
      - params
      - names
      - skip-deploy-check
      - docker-build
    runs-on: ubuntu-24.04
    environment: ${{ needs.params.outputs.github-environment }}
    steps:

      - name: Configure AWS role via GitHub OIDC
        uses: aws-actions/configure-aws-credentials@e1253824e5c10ff9df46874f81ed3ec929e19cfd # v6
        with:
          role-to-assume: ${{ vars.SUBMIT_ACTIONS_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}
          role-chaining: false
          audience: sts.amazonaws.com
          role-skip-session-tagging: true
          output-credentials: true
          retry-max-attempts: 3

      - name: Assume AWS deployment role
        uses: aws-actions/configure-aws-credentials@e1253824e5c10ff9df46874f81ed3ec929e19cfd # v6
        with:
          role-to-assume: ${{ vars.SUBMIT_DEPLOY_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}
          role-chaining: true
          audience: sts.amazonaws.com
          role-skip-session-tagging: true
          output-credentials: true
          retry-max-attempts: 3

      - name: Login to Amazon ECR
        shell: bash
        run: |
          aws ecr get-login-password --region ${{ env.AWS_REGION }} \
            | docker login \
                --username AWS \
                --password-stdin "${ECR_REPOSITORY_BASE_URL?}/${ECR_REPOSITORY_NAME?}" \
            ;
        env:
          ECR_REPOSITORY_BASE_URL: ${{ vars.SUBMIT_ACCOUNT_ID }}.dkr.ecr.${{ env.AWS_REGION }}.amazonaws.com
          ECR_REPOSITORY_NAME: ${{ needs.names.outputs.environment-name }}-env-ecr

      - name: Check if image already exists in ECR
        id: image-exists
        shell: bash
        run: |
          REPO_URI="${ECR_REPOSITORY_BASE_URL?}/${ECR_REPOSITORY_NAME?}"
          REPO_NAME="${REPO_URI##*/}"
          echo "Checking if image with tag ${{ github.sha }} exists in $REPO_NAME"
          if aws ecr describe-images --repository-name "$REPO_NAME" --image-ids imageTag="${{ github.sha }}" >/dev/null 2>&1; then
            echo "exists=true" >> "$GITHUB_OUTPUT"
          else
            echo "exists=false" >> "$GITHUB_OUTPUT"
          fi
        env:
          ECR_REPOSITORY_BASE_URL: ${{ vars.SUBMIT_ACCOUNT_ID }}.dkr.ecr.${{ env.AWS_REGION }}.amazonaws.com
          ECR_REPOSITORY_NAME: ${{ needs.names.outputs.environment-name }}-env-ecr

      - name: Checkout
        if: ${{ steps.image-exists.outputs.exists != 'true' }}
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - name: Setup Node
        if: ${{ steps.image-exists.outputs.exists != 'true' }}
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'

      - name: Node dependencies
        if: ${{ steps.image-exists.outputs.exists != 'true' }}
        run: timeout 120 npm ci --prefer-offline || { sleep 30; timeout 180 npm ci; }
        timeout-minutes: 6
        env:
          NPM_CONFIG_FETCH_RETRIES: "3"

      - name: Download image artifact
        if: ${{ steps.image-exists.outputs.exists != 'true' }}
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8
        with:
          name: docker-image
          path: docker-image/

      - name: Load Docker image
        if: ${{ steps.image-exists.outputs.exists != 'true' }}
        run: docker load -i docker-image/image.tar

      - name: Tag and push Docker image to ECR
        if: ${{ steps.image-exists.outputs.exists != 'true' }}
        shell: bash
        run: |
          docker tag "${{ env.BASE_IMAGE_TAG_PREFIX }}:${{ github.sha }}" "${ECR_REPOSITORY_BASE_URL?}/${ECR_REPOSITORY_NAME?}:${{ github.sha }}"
          docker tag "${{ env.BASE_IMAGE_TAG_PREFIX }}:${{ github.sha }}" "${ECR_REPOSITORY_BASE_URL?}/${ECR_REPOSITORY_NAME?}:latest"
          docker push "${ECR_REPOSITORY_BASE_URL?}/${ECR_REPOSITORY_NAME?}:${{ github.sha }}"
          docker push "${ECR_REPOSITORY_BASE_URL?}/${ECR_REPOSITORY_NAME?}:latest"
        env:
          ECR_REPOSITORY_BASE_URL: ${{ vars.SUBMIT_ACCOUNT_ID }}.dkr.ecr.${{ env.AWS_REGION }}.amazonaws.com
          ECR_REPOSITORY_NAME: ${{ needs.names.outputs.environment-name }}-env-ecr
    outputs:
      base-image-tag: ${{ github.sha }}

