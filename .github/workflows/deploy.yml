  deploy-application-self-destruct:
    # This job's own `if:` doesn't fall back to the default success()-on-needs check, so it must
    # list every reason skip-deploy-check (a listed need) can be skipped itself, or this job
    # would still try to run against mvn-package/push-images artifacts that were never built.
    if: ${{ needs.params.outputs.isSkippingDeploy != 'true' && needs.names.outputs.package-json-scripts-only != 'true' && github.ref != 'refs/heads/main' && needs.names.outputs.environment-name != 'prod' }}
