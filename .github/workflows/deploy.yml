    runs-on: ubuntu-24.04
    environment: ${{ needs.params.outputs.github-environment }}
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - name: Setup Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'

      - name: Install dependencies
        run: timeout 120 npm ci --ignore-scripts --prefer-offline || { sleep 30; timeout 180 npm ci --ignore-scripts; }
        timeout-minutes: 6
        env:
          NPM_CONFIG_FETCH_RETRIES: "3"
          PLAYWRIGHT_SKIP_BROWSER_DOWNLOAD: 1

      - name: Configure AWS role via GitHub OIDC
        uses: aws-actions/configure-aws-credentials@e1253824e5c10ff9df46874f81ed3ec929e19cfd # v6
        with:
          role-to-assume: ${{ vars.SUBMIT_ACTIONS_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}
          role-chaining: false
          audience: sts.amazonaws.com
          role-skip-session-tagging: true
          output-credentials: true
          retry-max-attempts: 3

      - name: Assume AWS deployment role
        uses: aws-actions/configure-aws-credentials@e1253824e5c10ff9df46874f81ed3ec929e19cfd # v6
        with:
          role-to-assume: ${{ vars.SUBMIT_DEPLOY_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}
          role-chaining: true
          audience: sts.amazonaws.com
          role-skip-session-tagging: true
          output-credentials: true
          retry-max-attempts: 3

      - name: Disable native auth on Cognito Hosted UI
        if: ${{ needs.params.outputs.skipCleanup != 'true' && needs.names.outputs.environment-name != 'ci' }}
        shell: bash
        run: |
          ENV_FILE=".env.${{ needs.names.outputs.environment-name }}"
          PROVIDER=$(grep -E '^TEST_AUTH_PROVIDER=' "$ENV_FILE" | tail -n1 | cut -d'=' -f2)
          if [ "$PROVIDER" = "cognito-native" ]; then
            node scripts/toggle-cognito-native-auth.js disable "${{ needs.names.outputs.environment-name }}"
          else
            echo "Skipping native auth toggle (TEST_AUTH_PROVIDER=${PROVIDER:-unset})"
          fi

  # Set the deployment name as the last known good deployment for this environment in a parameter store parameter
  set-last-known-good-deployment:
    # Requires set-origins too, not just web-test: without this, a deployment whose
    # EdgeStack/cutover failed could still get marked "last known good" purely on tests
    # passing, while CloudFront kept serving something else entirely (reproduced live
    # 2026-09-01/02 - three EdgeStack bugs blocked set-origins for hours while this job
    # kept advancing the SSM pointer regardless).
    # On ci set-origins does not run at all, so the requirement is prod's alone.
    if: ${{ !cancelled() && needs.names.result == 'success' && needs.web-test.result == 'success' && (needs.names.outputs.environment-name != 'prod' || needs.set-origins.result == 'success') }}
    name: 'set last known good deployment'
    needs:
      - names
      - web-test
      - disable-native-auth
      - set-origins
    runs-on: ubuntu-24.04
    environment: ${{ needs.names.outputs.environment-name }}
    permissions:
      id-token: write
      issues: write
    steps:
      - name: Configure AWS role via GitHub OIDC
        uses: aws-actions/configure-aws-credentials@e1253824e5c10ff9df46874f81ed3ec929e19cfd # v6
        with:
          role-to-assume: ${{ vars.SUBMIT_ACTIONS_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}
          role-chaining: false
          audience: sts.amazonaws.com
          role-skip-session-tagging: true
          output-credentials: true
          retry-max-attempts: 3

      - name: Assume AWS deployment role
        uses: aws-actions/configure-aws-credentials@e1253824e5c10ff9df46874f81ed3ec929e19cfd # v6
        with:
          role-to-assume: ${{ vars.SUBMIT_DEPLOY_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}
          role-chaining: true
          audience: sts.amazonaws.com
          role-skip-session-tagging: true
          output-credentials: true
          retry-max-attempts: 3

      - name: Set last known good deployment in SSM Parameter Store
        run: |
          PARAMETER_NAME="/submit/${{ needs.names.outputs.environment-name }}/last-known-good-deployment"
          echo "Setting SSM Parameter Store parameter $PARAMETER_NAME to value '${{ needs.names.outputs.deployment-name }}'"
          aws ssm put-parameter \
            --name "$PARAMETER_NAME" \
            --type String \
            --value "${{ needs.names.outputs.deployment-name }}" \
            --overwrite

      # Read back the value to confirm it was set correctly
      - name: Read back last known good deployment from SSM Parameter Store
        run: |
          PARAMETER_NAME="/submit/${{ needs.names.outputs.environment-name }}/last-known-good-deployment"
          aws ssm get-parameter --name "$PARAMETER_NAME" --query "Parameter.Value" --output text | tee /tmp/last_known_good_deployment.txt
          echo "Last known good deployment: $(cat /tmp/last_known_good_deployment.txt)"

      - name: CDK stacks in eu-west-2 and us-east-1
        run: |
          aws cloudformation describe-stacks --region eu-west-2 --query "Stacks[].StackName" --output text | tr '\t' '\n' | sort
          aws cloudformation describe-stacks --region us-east-1 --query "Stacks[].StackName" --output text | tr '\t' '\n' | sort

      # A set promoted to last-known-good means whatever rollback issue is open for this
      # environment (rollback-origins raised it under this same title) is resolved: some set
      # has now cleared web-test and gone live. Closes every open one rather than just the
      # newest, in case more than one rollback happened before a set finally cleared.
      - name: Close open rollback incident issues for this environment
        env:
          GH_TOKEN: ${{ github.token }}
          ISSUE_TITLE: "[INCIDENT] ${{ needs.names.outputs.environment-name }} apex rollback"
        run: |
          gh issue list --repo "${{ github.repository }}" --label incident --state open \
            --json number,title --jq ".[] | select(.title == \"$ISSUE_TITLE\") | .number" \
          | while read -r NUMBER; do
              gh issue comment "$NUMBER" --repo "${{ github.repository }}" \
                --body "Deployment ${{ needs.names.outputs.deployment-name }} promoted to last known good for ${{ needs.names.outputs.environment-name }}; closing."
              gh issue close "$NUMBER" --repo "${{ github.repository }}"
            done

  # The ci apex follows a set only once that set's own probes have passed, so it moves after this
  # run rather than inside it. promote-ci-apex.yml serialises the alias move on its own
  # concurrency group and this job does not wait for it, so a promotion superseded at that group
  # is dropped there instead of reddening a deploy.
  promote-ci-apex:
    name: 'promote the ci apex to this set'
    if: ${{ !cancelled() && needs.names.outputs.environment-name == 'ci' && needs.set-last-known-good-deployment.result == 'success' }}
    needs:
      - names
      - set-last-known-good-deployment
    runs-on: ubuntu-24.04
    permissions:
      actions: write
    steps:
      - name: Dispatch promote-ci-apex for this deployment
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          DEPLOYMENT_NAME: ${{ needs.names.outputs.deployment-name }}
        run: |
          set -euo pipefail
          # A workflow_dispatch resolves against the default branch, so the promotion runs the
          # merged copy of promote-ci-apex.yml whatever branch this deploy came from. Until that
          # copy exists the apex simply stays where it is, which is the state this row leaves it
          # in anyway, so say so and pass rather than failing a proven set's deploy.
          if ! gh workflow view promote-ci-apex.yml --repo "$REPO" >/dev/null 2>&1; then
            echo "::warning::promote-ci-apex.yml is not on the default branch yet, so the ci apex still points where it did; it will follow ${DEPLOYMENT_NAME} on the first deploy after this branch merges."
            exit 0
          fi
          gh workflow run promote-ci-apex.yml --repo "$REPO" -f "deployment-name=${DEPLOYMENT_NAME}"

  # If set-origins already cut this environment's apex over to the new deployment but that
  # deployment's own behaviour tests then failed, leaving the cutover in place serves a
  # rejected deployment until a person notices. Point the apex and its API Gateway custom
  # domain back at the deployment that was live before this run.
  #
  # The previous deployment name comes from set-origins' own existing-deployment-name output
  # (captured live from CloudFront during this run's own cutover), not from the
  # /submit/{env}/last-known-good-deployment SSM parameter. That parameter is only overwritten
  # by set-last-known-good-deployment below, which itself requires web-test to succeed — so on
  # the failure path this job runs on, the parameter is never touched this run and would still
  # read back correctly. existing-deployment-name is used anyway because it needs no such
  # ordering argument: it is the same value destroy-previous already trusts as "the deployment
  # before this one", captured once and reused rather than re-derived from a second source.
  #
  # set-last-known-good-deployment's own success requirement means destroy-previous below
  # already cannot fire on this path (its `if:` requires that job's result to be 'success', and
  # it never runs here) — so the deployment this job rolls back to is never at risk from
  # destroy-previous in the same run. No change to that guard is needed.
  #
  # This job does not force its own conclusion to failure: web-test's own failed conclusion
  # already makes the whole run's conclusion 'failure' regardless of what runs afterwards, so
  # the run cannot report green just because the rollback below succeeds.
  rollback-origins:
    name: 'roll back apex to previous deployment'
    # Prod only, like the promotion it undoes: a ci run never moves an apex, so it has nothing to
    # roll back and the set it just proved is simply never promoted.
    if: ${{ !cancelled() && needs.names.outputs.environment-name == 'prod' && needs.set-origins.result == 'success' && needs.web-test.result == 'failure' && needs.set-origins.outputs.existing-deployment-name != '' }}
    needs:
      - names
      - set-origins
      - web-test
    runs-on: ubuntu-24.04
    environment: ${{ needs.names.outputs.environment-name }}
    permissions:
      id-token: write
      contents: read
      issues: write
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - name: Configure AWS role via GitHub OIDC
        uses: aws-actions/configure-aws-credentials@e1253824e5c10ff9df46874f81ed3ec929e19cfd # v6
        with:
          role-to-assume: ${{ vars.SUBMIT_ACTIONS_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}
          role-chaining: false
          audience: sts.amazonaws.com
          role-skip-session-tagging: true
          output-credentials: true
          retry-max-attempts: 3

      - name: Assume AWS deployment role
        uses: aws-actions/configure-aws-credentials@e1253824e5c10ff9df46874f81ed3ec929e19cfd # v6
        with:
          role-to-assume: ${{ vars.SUBMIT_DEPLOY_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}
          role-chaining: true
          audience: sts.amazonaws.com
          role-skip-session-tagging: true
          output-credentials: true
          retry-max-attempts: 3

      - name: Lookup CloudFront and API Gateway for the previous deployment
        id: lookup-previous
        uses: './.github/actions/lookup-resources'
        with:
          environment-name: ${{ needs.names.outputs.environment-name }}
          deployment-name: ${{ needs.set-origins.outputs.existing-deployment-name }}
          lookup-cognito: 'false'
          lookup-api-gateway: 'true'
          lookup-cloudfront: 'true'

      - name: Alias apex domain back to the previous deployment
        id: rollback
        uses: './.github/actions/set-origins'
        with:
          origin-domain: ${{ needs.set-origins.outputs.existing-deployment-name }}.submit.diyaccounting.co.uk
          apex-domain: ${{ needs.names.outputs.apex-domain }}
          prod-apex-alias: ${{ needs.names.outputs.prod-apex-alias }}
          aws-account-id: ${{ vars.SUBMIT_ACCOUNT_ID }}
          hosted-zone-id: ${{ vars.ROOT_HOSTED_ZONE_ID }}
          cloudfront-distribution-id: ${{ steps.lookup-previous.outputs.cloudfront-distribution-id }}
          api-gateway-id: ${{ steps.lookup-previous.outputs.http-api-id }}
          regional-certificate-arn: ${{ vars.SUBMIT_REGIONAL_CERTIFICATE_ARN }}
          route53-actions-role-arn: ${{ vars.ROOT_ACTIONS_ROLE_ARN }}
          route53-deploy-role-arn: ${{ vars.ROOT_DEPLOY_ROLE_ARN }}
          restore-actions-role-arn: ${{ vars.SUBMIT_ACTIONS_ROLE_ARN }}
          restore-deploy-role-arn: ${{ vars.SUBMIT_DEPLOY_ROLE_ARN }}

      - name: Report the rollback
        run: |
          echo "::error::web-test failed for ${{ needs.names.outputs.deployment-name }}; rolled the apex back to ${{ needs.set-origins.outputs.existing-deployment-name }}."

      # The set left standing (needs.names.outputs.deployment-name) is never promoted to
      # last-known-good on this path (set-last-known-good-deployment requires web-test to
      # succeed), so nobody is told unless this issue exists. set-last-known-good-deployment
      # closes it (by this same title) the next time a set for this environment is promoted.
      - name: Open an incident issue for the rollback
        if: ${{ !cancelled() }}
        env:
          GH_TOKEN: ${{ github.token }}
          ISSUE_TITLE: "[INCIDENT] ${{ needs.names.outputs.environment-name }} apex rollback"
        run: |
          BODY=$(cat <<BODYEOF
          ## Apex rollback

          Run: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
          Failed probe suite: submitVatBehaviour (the web-test job gating this rollback)
          Rolled back to deployment: ${{ needs.set-origins.outputs.existing-deployment-name }}
          Deployment left standing, unpromoted: ${{ needs.names.outputs.deployment-name }}
          BODYEOF
          )
          # The REST endpoint creates the label on first use; gh issue create --label fails when it is missing.
          gh api --method POST "repos/${{ github.repository }}/issues" -f title="$ISSUE_TITLE" -f body="$BODY" -f "labels[]=incident" --jq .html_url
    outputs:
      rolled-back-to-deployment-name: ${{ needs.set-origins.outputs.existing-deployment-name }}

  # DORA row for the one-stop dashboard's deployment-frequency, lead-time and failure-rate
  # panels: one row per deploy run, written regardless of how the run ended so a failed deploy
  # counts towards the failure rate rather than leaving a silent gap.
  record-dora:
    # A run superseded by a newer commit is cancelled at the concurrency group, taking `names`
    # down with it, so `environment-name` is empty and `configure-aws-credentials` fails with no
    # role to assume. That is a supersession, not a deployment failure, so skip rather than let
    # the run show a failed job for it; a genuine failure still has an environment name and runs.
    if: ${{ !cancelled() && needs.names.outputs.environment-name != '' }}
    name: 'record DORA row'
    needs:
      - names
      - deploy-publish
      - set-origins
      - web-test
    runs-on: ubuntu-24.04
    environment: ${{ needs.names.outputs.environment-name }}
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - name: Configure AWS role via GitHub OIDC
        uses: aws-actions/configure-aws-credentials@e1253824e5c10ff9df46874f81ed3ec929e19cfd # v6
        with:
          role-to-assume: ${{ vars.SUBMIT_ACTIONS_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}
          role-chaining: false
          audience: sts.amazonaws.com
          role-skip-session-tagging: true
          output-credentials: true
          retry-max-attempts: 3

      - name: Assume AWS deployment role
        uses: aws-actions/configure-aws-credentials@e1253824e5c10ff9df46874f81ed3ec929e19cfd # v6
        with:
          role-to-assume: ${{ vars.SUBMIT_DEPLOY_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}
          role-chaining: true
          audience: sts.amazonaws.com
          role-skip-session-tagging: true
          output-credentials: true
          retry-max-attempts: 3

      - name: Build the DORA row
        id: dora-row
        env:
          GH_TOKEN: ${{ github.token }}
          DORA_WORKFLOW: ${{ github.workflow }}
          DORA_ENVIRONMENT: ${{ needs.names.outputs.environment-name }}
          DORA_DEPLOYMENT: ${{ needs.names.outputs.deployment-name }}
          DORA_BRANCH: ${{ github.ref_name }}
          DORA_SHA: ${{ github.sha }}
          DORA_RUN_ID: ${{ github.run_id }}
          DORA_RUN_ATTEMPT: ${{ github.run_attempt }}
          DORA_RUN_NUMBER: ${{ github.run_number }}
          DORA_ACTOR: ${{ github.actor }}
          DORA_TRIGGER: ${{ github.event_name }}
          DORA_REPOSITORY: ${{ github.repository }}
          DORA_DEPLOY_PUBLISH_RESULT: ${{ needs.deploy-publish.result }}
          DORA_SET_ORIGINS_RESULT: ${{ needs.set-origins.result }}
          DORA_WEB_TEST_RESULT: ${{ needs.web-test.result }}
        run: |
          set -euo pipefail
          STARTED_AT=$(gh api "repos/${DORA_REPOSITORY}/actions/runs/${DORA_RUN_ID}" --jq .run_started_at)
          FINISHED_AT=$(date -u +%FT%TZ)
          DURATION_SECONDS=$(( $(date -u -d "$FINISHED_AT" +%s) - $(date -u -d "$STARTED_AT" +%s) ))
          MERGED_AT=$(gh api "repos/${DORA_REPOSITORY}/commits/${DORA_SHA}/pulls" --jq '.[0].merged_at // empty' || echo "")

          CONCLUSION="success"
          if [ "$DORA_DEPLOY_PUBLISH_RESULT" != "success" ] || [ "$DORA_WEB_TEST_RESULT" != "success" ]; then
            CONCLUSION="failure"
          fi
          # set-origins runs for prod only, so on ci it is skipped and there is no apex cutover
          # to have failed. Any other non-success is a real failed cutover.
          if [ "$DORA_SET_ORIGINS_RESULT" != "success" ] && [ "$DORA_SET_ORIGINS_RESULT" != "skipped" ]; then
            CONCLUSION="failure"
          fi

          ROW=$(jq -nc \
            --arg workflow "$DORA_WORKFLOW" \
            --arg environment "$DORA_ENVIRONMENT" \
            --arg deployment "$DORA_DEPLOYMENT" \
            --arg branch "$DORA_BRANCH" \
            --arg sha "$DORA_SHA" \
            --arg run_id "$DORA_RUN_ID" \
            --argjson run_attempt "$DORA_RUN_ATTEMPT" \
            --argjson run_number "$DORA_RUN_NUMBER" \
            --arg actor "$DORA_ACTOR" \
            --arg trigger "$DORA_TRIGGER" \
            --arg started_at "$STARTED_AT" \
            --arg finished_at "$FINISHED_AT" \
            --argjson duration_seconds "$DURATION_SECONDS" \
            --arg conclusion "$CONCLUSION" \
            --arg merged_at "$MERGED_AT" \
            '{
              workflow: $workflow, environment: $environment, deployment: $deployment,
              branch: $branch, sha: $sha, run_id: $run_id, run_attempt: $run_attempt,
              run_number: $run_number, actor: $actor, trigger: $trigger,
              started_at: $started_at, finished_at: $finished_at,
              duration_seconds: $duration_seconds, conclusion: $conclusion,
              merged_at: (if $merged_at == "" then null else $merged_at end),
              lead_time_seconds: (
                if $merged_at == "" then null
                else (($finished_at | strptime("%Y-%m-%dT%H:%M:%SZ") | mktime)
                      - ($merged_at | strptime("%Y-%m-%dT%H:%M:%SZ") | mktime))
                end
              )
            }')
          echo "row=$ROW" >> "$GITHUB_OUTPUT"
          echo "key=curated/dora/dt=$(date -u +%F)/${DORA_RUN_ID}-${DORA_RUN_ATTEMPT}.json" >> "$GITHUB_OUTPUT"

      - name: Write the DORA row to the lake
        uses: './.github/actions/dora-row'
        with:
          bucket: '${{ needs.names.outputs.environment-name }}-env-analytics-lake-${{ vars.SUBMIT_ACCOUNT_ID }}'
          key: ${{ steps.dora-row.outputs.key }}
          row: ${{ steps.dora-row.outputs.row }}

  # Run workflow: .github/workflows/destroy-prod.yml to destroy previous prod deployments but not the holding page (`-holding`)
  # Without a status function GitHub applies success() over the whole ancestor chain, and the
  # scenario web-test jobs skipped by skipTestScenarios sit in that chain, so this job would
  # never run. Gate on the direct results instead.
  destroy-previous:
    if: ${{ !cancelled() && needs.names.outputs.environment-name == 'prod' && needs.set-origins.result == 'success' && needs.set-last-known-good-deployment.result == 'success' && needs.set-origins.outputs.existing-deployment-name != '' && !contains(needs.set-origins.outputs.existing-deployment-name, '-holding') }}
    name: 'destroy previous'
    needs:
      - names
      - skip-deploy-check
      - set-origins
      #- upload-web-test-results
      - set-last-known-good-deployment
    uses: './.github/workflows/destroy-prod.yml'
    with:
      deployment-name: ${{ needs.set-origins.outputs.existing-deployment-name }}
      # This run IS the prod deploy destroy-prod.yml's own wait step would otherwise wait for —
      # see that step's comment in destroy-prod.yml for why waiting here would deadlock.
      called-from-deploy: true

  # A failed or cancelled run never reaches set-last-known-good-deployment, and until now only
  # claim-ci-slot.mjs's own staleness rule (self-destruct delay plus one hour) freed its slot
  # again - about five hours on the default two-hour delay, during which no other branch can get
  # a slot at all. Releasing here, at the end of every run regardless of outcome, gives the slot
  # back the moment this run is done instead of waiting on staleness; that rule stays as the
  # backstop for a run that never reaches this job (a runner outage, a cancellation before this
  # point).
  #
  # Only releases a deployment name that is actually a slot (ci-setN); an explicit
  # deployment-name dispatch or a prod deployment holds no slot and this is a no-op for it, same
  # as destroy-ci.yml's own release step. A deployment that is still this environment's
  # last-known-good is left alone even when this run's own claim named it, so a run that just got
  # promoted doesn't hand its slot to the next unrelated branch the moment it ends - see
  # set-last-known-good-deployment above for where that parameter is written.
  release-ci-slot:
    name: 'release the ci slot this run claimed'
    if: ${{ always() && needs.names.outputs.deployment-name != '' }}
    needs:
      - params
      - names
      - deploy-ops
      - web-test
      - set-last-known-good-deployment
      - promote-ci-apex
      - rollback-origins
      - record-dora
      - destroy-previous
    runs-on: ubuntu-24.04
    environment: ${{ needs.params.outputs.github-environment }}
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Configure AWS role via GitHub OIDC
        uses: aws-actions/configure-aws-credentials@e1253824e5c10ff9df46874f81ed3ec929e19cfd # v6
        with:
          role-to-assume: ${{ vars.SUBMIT_ACTIONS_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}
          role-chaining: false
          audience: sts.amazonaws.com
          role-skip-session-tagging: true
          output-credentials: true
          retry-max-attempts: 3

      - name: Assume AWS deployment role
        uses: aws-actions/configure-aws-credentials@e1253824e5c10ff9df46874f81ed3ec929e19cfd # v6
        with:
          role-to-assume: ${{ vars.SUBMIT_DEPLOY_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}
          role-chaining: true
          audience: sts.amazonaws.com
          role-skip-session-tagging: true
          output-credentials: true
          retry-max-attempts: 3

      - name: Release the ci slot this run claimed
        shell: bash
        env:
          DEPLOYMENT: ${{ needs.names.outputs.deployment-name }}
        run: |
          if [[ ! "$DEPLOYMENT" =~ ^ci-set[0-9]+$ ]]; then
            echo "$DEPLOYMENT holds no ci slot, nothing to release"
            exit 0
          fi
          LAST_KNOWN_GOOD=$(aws ssm get-parameter --name "/submit/ci/last-known-good-deployment" --query "Parameter.Value" --output text 2>/dev/null || echo "")
          if [ "$LAST_KNOWN_GOOD" = "$DEPLOYMENT" ]; then
            echo "$DEPLOYMENT is the current ci last-known-good deployment; leaving its slot claim in place"
            exit 0
          fi
          RELEASE_CI_SLOT_AWS_CLI="$(command -v aws)"
          export RELEASE_CI_SLOT_AWS_CLI
          export RELEASE_CI_SLOT_DEPLOYMENT_NAME="$DEPLOYMENT"
          export RELEASE_CI_SLOT_RUN_ID="${{ github.run_id }}"
          node .github/actions/claim-ci-slot/release-ci-slot.mjs

  # GitHub drops most of destroy-ci.yml's cron slots, so each ci deploy ends by checking for a
  # set old enough to sweep and calls the sweep only when it finds one.
  check-ci-sweep:
    if: ${{ !cancelled() && needs.params.outputs.github-environment == 'ci' }}
    name: 'check whether a ci set needs sweeping'
    needs:
      - params
      - names
      - disable-native-auth
    runs-on: ubuntu-24.04
    environment: ci
    steps:
      - name: Configure AWS role via GitHub OIDC
        uses: aws-actions/configure-aws-credentials@e1253824e5c10ff9df46874f81ed3ec929e19cfd # v6
        with:
          role-to-assume: ${{ vars.SUBMIT_ACTIONS_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}
          role-chaining: false
          audience: sts.amazonaws.com
          role-skip-session-tagging: true
          output-credentials: true
          retry-max-attempts: 3

      - name: Assume AWS deployment role
        uses: aws-actions/configure-aws-credentials@e1253824e5c10ff9df46874f81ed3ec929e19cfd # v6
        with:
          role-to-assume: ${{ vars.SUBMIT_DEPLOY_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}
          role-chaining: true
          audience: sts.amazonaws.com
          role-skip-session-tagging: true
          output-credentials: true
          retry-max-attempts: 3

      - name: Find whether any ci set's SelfDestructStack is old enough to sweep
        id: check
        shell: bash
        run: |
          set -euo pipefail
          LAST_KNOWN_GOOD=$(aws ssm get-parameter --name "/submit/ci/last-known-good-deployment" --query "Parameter.Value" --output text 2>/dev/null || echo "")
          echo "Last known good ci deployment: '$LAST_KNOWN_GOOD'"

          STACK_LINES=$(
            for REGION in eu-west-2 us-east-1; do
              aws cloudformation describe-stacks --region "$REGION" \
                --query "Stacks[?ends_with(StackName, '-app-SelfDestructStack')].[StackName,CreationTime]" \
                --output text 2>/dev/null || true
            done
          )

          NOW_EPOCH=$(date -u +%s)
          NEEDS_SWEEP="false"

          while IFS=$'\t' read -r STACK_NAME CREATION_TIME; do
            [ -z "$STACK_NAME" ] && continue
            case "$STACK_NAME" in
              ci-*-app-SelfDestructStack) ;;
              *) continue ;;
            esac
            DEPLOYMENT_NAME="${STACK_NAME%-app-SelfDestructStack}"
            if [ "$DEPLOYMENT_NAME" = "$LAST_KNOWN_GOOD" ]; then
              echo "$DEPLOYMENT_NAME: last known good, not a sweep candidate"
              continue
            fi
            CREATED_EPOCH=$(date -u -d "$CREATION_TIME" +%s 2>/dev/null || echo "0")
            if [ "$CREATED_EPOCH" -eq 0 ]; then
              echo "$DEPLOYMENT_NAME: could not parse creation time '$CREATION_TIME', skipping"
              continue
            fi
            AGE_HOURS=$(( (NOW_EPOCH - CREATED_EPOCH) / 3600 ))
            echo "$DEPLOYMENT_NAME: $AGE_HOURS hours old"
            # Keep in step with destroy-ci.yml's own SELF_DESTRUCT_SWEEP_MIN_AGE_HOURS.
            if [ "$AGE_HOURS" -ge 8 ]; then
              echo "$DEPLOYMENT_NAME is $AGE_HOURS hours old and not last-known-good; a sweep is needed"
              NEEDS_SWEEP="true"
            fi
          done <<< "$STACK_LINES"

          echo "needs-sweep=$NEEDS_SWEEP" | tee -a "$GITHUB_OUTPUT"
    outputs:
      needs-sweep: ${{ steps.check.outputs.needs-sweep }}

  sweep-ci:
    if: ${{ !cancelled() && needs.check-ci-sweep.outputs.needs-sweep == 'true' }}
    name: 'sweep ci for a stale set'
    needs:
      - check-ci-sweep
    permissions:
      id-token: write
      contents: read
      actions: read
    secrets: inherit
    uses: './.github/workflows/destroy-ci.yml'
    with:
      sweep-for-stacks: true
