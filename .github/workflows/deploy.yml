# @capability OPS-06 Run the full deployment pipeline
# - **Use when:** a change on main must reach production, or a named deployment must be redeployed by hand.
# - **Does:** deploy.yml is the main pipeline, triggered by a push to main. It synths CDK, runs tests, deploys infrastructure and app code, then validates the result. Once validation passes it atomically moves the prod apex domain to the new deployment.
# - **Run:** `git push origin main`; `gh workflow run deploy.yml -f deployment-name=<name>`
# - **Entry:** `.github/workflows/deploy.yml`
# - **Files:** .github/workflows/deploy.yml, .github/workflows/deploy-stacks.yml, .github/workflows/deploy-finish.yml, .github/workflows/deploy-build.yml
# - **Keywords:** deploy pipeline, prod apex, cdk synth, push to main, deployment-name, full deploy
# - **Related:** OPS-04, OPS-09
# @end-capability

# deploy: force a clean prod deployment after the EdgeStack WAF fix (bump 02)
name: deploy
run-name: "deploy from ${{ github.ref_name }}"

concurrency:
  # This workflow's own app-level CDK stacks are named after the resolved deployment, normally
  # unique per commit, so two branches don't usually fight over the same stack. What they do
  # share is per-environment state this workflow also writes: the last-known-good SSM
  # parameter, the live CloudFront origin (set-origins), and the Cognito native-auth toggle used
  # for behaviour tests. For the everyday ci push flow the fallback below still keys on the ref
  # and leaves cross-branch ordering to the wait-for-ci-deploys action: a shared 'deploy-ci'
  # group here would queue every ci branch behind one slot, and GitHub only keeps the latest
  # queued run in a group, so a third branch pushing while a second waits would drop the
  # second's run entirely — the exact failure wait-for-ci-deploys exists to avoid. Prod has no
  # such backstop, and workflow_dispatch can send a prod deploy from any branch, so whenever the
  # *effective* target is prod (explicit deployment-name, explicit environment-name, or a push to
  # main) the group always resolves to the same 'deploy-prod', or a same-time push to main and an
  # explicit-input prod dispatch would land in different groups and run concurrently.
  #
  # This group gives no ordering at all against deploy-environment.yml, which used to share this
  # exact group string by accident (both keyed on plain github.ref) until B90 split them so two
  # branches stopped fighting over deploy-environment's shared `{env}-env-*` stacks. That side
  # effect was never written down, so removing it broke deploy.yml's `names` job racing
  # deploy-environment.yml's `deploy identity` job for the DIYA-GL Cognito client (B94). The
  # `wait-for-environment-deploy` job below restores that ordering on purpose, by polling instead
  # of a shared group — see its comment for why a shared group is the wrong tool here.
  group: deploy-${{ inputs.deployment-name || (inputs.environment-name && inputs.environment-name != '(auto)' && inputs.environment-name) || (github.ref == 'refs/heads/main' && 'prod') || github.ref }}
  cancel-in-progress: false

# Bump25

on:
  workflow_dispatch:
    inputs:
      skipDeploy:
        description: 'Skip deploy (run tests only, no deployment)'
        type: choice
        options:
          - 'true'
          - 'false'
        required: false
        default: 'false'
      forceAllStackDeployment:
        description: 'Force re-deploy of all stacks even if they already exist or pass comparison checks'
        type: choice
        options:
          - 'true'
          - 'false'
        required: false
        default: 'true'
      environment-name:
        type: choice
        description: 'Environment name to use instead of computing from branch, e.g. ci or prod'
        required: false
        options:
          - '(auto)'
          - 'ci'
          - 'prod'
        default: '(auto)'
      deployment-name:
        type: string
        description: 'Deployment name to use instead of computing from branch, e.g. ci-lambdas6 or prod-ea373de'
        required: false
        default: ''
      selfDestructDelayHours:
        description: 'Hours before self-destruct triggers for non-prod environments'
        required: false
        default: '4'
      skipTestScenarios:
        description: 'Skip test scenarios for behaviour tests'
        type: choice
        options:
          - 'true'
          - 'false'
        required: false
        default: 'true'
      runProxyBehaviourTests:
        description: 'Run proxy behaviour tests (uses the real local TLS certificate and Docker)'
        type: choice
        options:
          - 'true'
          - 'false'
        required: false
        default: 'false'
      runCompaniesHouseSandboxFiling:
        description: 'Run the Companies House filing suites that sign in to the real sandbox on ci'
        type: choice
        options:
          - 'true'
          - 'false'
        required: false
        default: 'false'
      skipCleanup:
        description: 'Keep test users and native auth enabled after tests (for debugging)'
        type: choice
        options:
          - 'true'
          - 'false'
        required: false
        default: 'false'
  push:
    branches:
      - '**'
      - '!gh_pages'
      - '!dependabot/**'
    paths:
      - 'app/data/**'
      - 'app/functions/**'
      - 'app/lib/**'
      - 'app/services/**'
      - 'infra/main/**'
      - 'web/public/**'
      - 'experiments.toml'
      - '.env.ci'
      - '.env.prod'
      - '**/cdk.json'
      - 'Dockerfile'
      - 'LICENSE'
      - 'package.json'
      - 'package-lock.json'
      - 'pom.xml'
      - 'web/public/submit.catalogue.toml'
      - '.github/actions/**'
      - '.github/workflows/deploy.yml'
      - '.github/workflows/deploy-cdk-stack.yml'
      - '.github/workflows/deploy-stacks.yml'
      - '.github/workflows/deploy-finish.yml'
      - '.github/workflows/deploy-build.yml'
      - '.github/workflows/destroy-prod.yml'
      - '.github/workflows/generate-pass.yml'
      - '.github/workflows/probe-test.yml'
      - '.github/workflows/test.yml'
  schedule:
    - cron: '11 4 * * *'

permissions:
  id-token: write
  contents: read
  pull-requests: read
  pages: write
  actions: read

env:
  JAVA_VERSION: '25'
  AWS_REGION: 'eu-west-2'
  BASE_IMAGE_TAG_PREFIX: 'submit-base'
  GITHUB_ACTOR: ${{ github.actor }}
  SELF_DESTRUCT_DELAY_HOURS: ${{ inputs.selfDestructDelayHours || '4' }}
  BASE_IMAGE_TAG: ${{ github.sha }}
  FORCE_ALL_STACK_DEPLOYMENT: ${{ inputs.forceAllStackDeployment || 'true' }}
  COMMIT_HASH: ${{ github.sha }}
  BUILD_NUMBER: ${{ github.run_number }}
  GITHUB_REF: ${{ github.ref }}
  # GITHUB_REF_TO_ENV: resolved per-job via needs.params.outputs.github-environment
  # Job-name prefixes in deploy-environment.yml: a job listed here deploys an env resource that an
  # app stack reads. Add a job when an app stack starts to read a new env resource. A rename in
  # deploy-environment.yml needs the same change here; a prefix that matches no job waits for the
  # whole run. "deploy observability /" does not match "deploy observability us-east-1 /".
  ENV_JOBS_READ_BY_APP_STACKS: 'create secrets,verify certificate,deploy identity,deploy data /,deploy ecr /,deploy ecr us-east-1 /,deploy observability /'

jobs:

  params:
    runs-on: ubuntu-24.04
    steps:
      - name: "github.event_name=[${{ github.event_name }}]"
        run: ":"
      - name: "github.ref=[${{ github.ref }}]"
        run: ":"
      - name: "github.sha=[${{ github.sha }}]"
        run: ":"
      - name: "inputs.skipDeploy=[${{ inputs.skipDeploy }}]"
        run: ":"
      - name: "inputs.forceAllStackDeployment=[${{ inputs.forceAllStackDeployment }}]"
        run: ":"
      - name: "inputs.environment-name=[${{ inputs.environment-name }}]"
        run: ":"
      - name: "inputs.deployment-name=[${{ inputs.deployment-name }}]"
        run: ":"
      - name: "inputs.selfDestructDelayHours=[${{ inputs.selfDestructDelayHours }}]"
        run: ":"
      - name: "inputs.skipTestScenarios=[${{ inputs.skipTestScenarios }}]"
        run: ":"
      - name: "inputs.runProxyBehaviourTests=[${{ inputs.runProxyBehaviourTests }}]"
        run: ":"
      - name: "inputs.runCompaniesHouseSandboxFiling=[${{ inputs.runCompaniesHouseSandboxFiling }}]"
        run: ":"
      - name: "inputs.skipCleanup=[${{ inputs.skipCleanup }}]"
        run: ":"
      - name: "github.event.head_commit.message=[${{ github.event.head_commit.message }}]"
        run: ":"
      - name: Normalise Params
        id: normalise
        shell: bash
        env:
          RAW_COMMIT_MSG: ${{ github.event.head_commit.message }}
        run: |
          X='${{ inputs.forceAllStackDeployment }}' ; echo "forceAllStackDeployment=${X:-true}" | tee -a "$GITHUB_OUTPUT"
          X='${{ inputs.skipDeploy }}' ; echo "skipDeploy=${X:-false}" | tee -a "$GITHUB_OUTPUT"
          # Convert '(auto)' to empty string for downstream processing
          ENV_NAME='${{ inputs.environment-name }}'; [[ "$ENV_NAME" == "(auto)" ]] && ENV_NAME=""
          echo "environment-name=${ENV_NAME}" | tee -a "$GITHUB_OUTPUT"
          # Resolve GitHub Actions environment from explicit input or branch
          GH_ENV="${ENV_NAME}"
          if [ -z "$GH_ENV" ]; then
            if [ "${{ github.ref }}" == "refs/heads/main" ]; then GH_ENV="prod"; else GH_ENV="ci"; fi
          fi
          echo "github-environment=${GH_ENV}" | tee -a "$GITHUB_OUTPUT"
          echo 'deployment-name=${{ inputs.deployment-name }}' | tee -a "$GITHUB_OUTPUT"
          X='${{ inputs.selfDestructDelayHours }}' ; echo "selfDestructDelayHours=${X:-2}" | tee -a "$GITHUB_OUTPUT"
          X='${{ inputs.skipTestScenarios }}' ; echo "skipTestScenarios=${X:-true}" | tee -a "$GITHUB_OUTPUT"
          X='${{ inputs.runProxyBehaviourTests }}' ; echo "runProxyBehaviourTests=${X:-false}" | tee -a "$GITHUB_OUTPUT"
          X='${{ inputs.runCompaniesHouseSandboxFiling }}' ; echo "runCompaniesHouseSandboxFiling=${X:-false}" | tee -a "$GITHUB_OUTPUT"
          X='${{ inputs.skipCleanup }}' ; echo "skipCleanup=${X:-false}" | tee -a "$GITHUB_OUTPUT"
          # Compute isSkippingDeploy: true if skipDeploy=true OR (push event with skip: in commit message)
          SKIP_DEPLOY='${{ inputs.skipDeploy }}'
          EVENT_NAME='${{ github.event_name }}'
          # Sanitize commit message: replace chars outside [a-zA-Z0-9 :-] with -, dedupe spaces and dashes
          COMMIT_MSG=$(printf '%s' "$RAW_COMMIT_MSG" | tr -c 'a-zA-Z0-9 :-' '-' | sed 's/--*/-/g; s/  */ /g')
          if [ "${SKIP_DEPLOY:-false}" = "true" ]; then
            echo "isSkippingDeploy=true" | tee -a "$GITHUB_OUTPUT"
          elif [ "$EVENT_NAME" = "push" ] && echo "$COMMIT_MSG" | grep -q "skip:"; then
            echo "isSkippingDeploy=true" | tee -a "$GITHUB_OUTPUT"
          else
            echo "isSkippingDeploy=false" | tee -a "$GITHUB_OUTPUT"
          fi
    outputs:
      skipDeploy: ${{ steps.normalise.outputs.skipDeploy }}
      forceAllStackDeployment: ${{ steps.normalise.outputs.forceAllStackDeployment }}
      environment-name: ${{ steps.normalise.outputs.environment-name }}
      deployment-name: ${{ steps.normalise.outputs.deployment-name }}
      selfDestructDelayHours: ${{ steps.normalise.outputs.selfDestructDelayHours }}
      skipTestScenarios: ${{ steps.normalise.outputs.skipTestScenarios }}
      runProxyBehaviourTests: ${{ steps.normalise.outputs.runProxyBehaviourTests }}
      runCompaniesHouseSandboxFiling: ${{ steps.normalise.outputs.runCompaniesHouseSandboxFiling }}
      skipCleanup: ${{ steps.normalise.outputs.skipCleanup }}
      isSkippingDeploy: ${{ steps.normalise.outputs.isSkippingDeploy }}
      github-environment: ${{ steps.normalise.outputs.github-environment }}

  # Reasoned job filter: the same select-jobs job test.yml carries. It writes a decision artifact
  # recording which behaviour suites and stack jobs it judges this change has nothing left to
  # prove for, so scripts/ci/select-jobs-trial.mjs can check each advised skip against what that
  # job did. Its advised-json output is read by the web-test-* jobs, and through stack-holdings by
  # the deploy-* stack jobs, each guarded by the REASONED_JOB_FILTER repository variable ('off'
  # runs every job) and by the ref (main runs every job). web-test always runs, because
  # set-last-known-good-deployment and the apex promotion rest on it. See select-jobs.mjs's
  # module comment for the shared eligibility,
  # budget, and kill-switch behaviour; `continue-on-error: true` and no job-level `if:` mean a
  # Bedrock error here never surfaces as a red status check.
  select-jobs:
    name: 'select jobs'
    needs:
      - params
    continue-on-error: true
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    environment: ci
    permissions:
      contents: read
      id-token: write
      actions: read
    env:
      CLAUDE_CODE_VERSION: '2.0.30'
      MODEL_ID: 'eu.anthropic.claude-haiku-4-5-20251001-v1:0'
      OUT_DIR: '/tmp/select-jobs'
      SELECT_JOBS_BUDGET_PER_DAY: '200'
      # 'off' makes the ref ineligible, so no model call runs and every job runs.
      SELECT_JOBS_MODE: 'off'
    outputs:
      skip-json: ${{ steps.decide.outputs.skip-json }}
      advised-json: ${{ steps.decide.outputs.advised-json }}
      compared-from: ${{ steps.diff.outputs.compared-from }}
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0

      - name: Decide whether this ref is eligible for a job-selection call
        id: eligibility
        run: |
          markdown_only=false
          before='${{ github.event.before }}'
          if [ "${{ github.event_name }}" = "push" ] && [ -n "$before" ] \
            && [ "$before" != "0000000000000000000000000000000000000000" ] \
            && git cat-file -e "${before}^{commit}" 2>/dev/null; then
            changed=$(git diff --name-only "${before}..${{ github.sha }}")
            non_md=$(printf '%s\n' "$changed" | grep -v -E '\.md$' || true)
            if [ -n "$changed" ] && [ -z "$non_md" ]; then
              markdown_only=true
            fi
          fi
          echo "markdown-only=${markdown_only}" | tee -a "$GITHUB_OUTPUT"
          if [ "${SELECT_JOBS_MODE}" = "off" ] || [ "${{ github.ref }}" = "refs/heads/main" ] || [ "$markdown_only" = "true" ]; then
            echo "eligible=false" | tee -a "$GITHUB_OUTPUT"
          else
            echo "eligible=true" | tee -a "$GITHUB_OUTPUT"
          fi

      - name: Stop once ${{ env.SELECT_JOBS_BUDGET_PER_DAY }} decisions have already posted today
        id: budget-guard
        if: steps.eligibility.outputs.eligible == 'true'
        uses: ./.github/actions/agent-run-budget
        with:
          workflow-file: deploy.yml
          job-name: select jobs
          step-name: Parse the answer
          budget: ${{ env.SELECT_JOBS_BUDGET_PER_DAY }}

      - name: Assume the AWS actions and deploy roles
        if: steps.eligibility.outputs.eligible == 'true' && steps.budget-guard.outputs.over-budget == 'false'
        uses: ./.github/actions/aws-role
        with:
          actions-role-arn: ${{ vars.SUBMIT_ACTIONS_ROLE_ARN }}
          deploy-role-arn: ${{ vars.SUBMIT_ALARM_TRIAGE_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Stop when the agent kill switch is on
        if: steps.eligibility.outputs.eligible == 'true' && steps.budget-guard.outputs.over-budget == 'false'
        id: kill-switch
        uses: ./.github/actions/agent-kill-switch
        with:
          environment-name: ci

      - name: Set up the toolchain
        uses: ./.github/actions/setup-toolchain
        with:
          npm-install: none
          npm-cache: 'false'

      - name: Install Claude Code
        if: >-
          steps.eligibility.outputs.eligible == 'true' && steps.budget-guard.outputs.over-budget == 'false' &&
          steps.kill-switch.conclusion != 'failure'
        run: npm install -g "@anthropic-ai/claude-code@${CLAUDE_CODE_VERSION}"

      - name: Find the last green run of this workflow on this branch
        id: last-green
        if: >-
          steps.eligibility.outputs.eligible == 'true' && steps.budget-guard.outputs.over-budget == 'false' &&
          steps.kill-switch.conclusion != 'failure'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          mkdir -p "${OUT_DIR}"
          sha=$(gh run list --repo "${{ github.repository }}" --workflow deploy.yml \
                  --branch "${{ github.ref_name }}" --status success --limit 1 \
                  --json headSha --jq '.[0].headSha // empty' || true)
          echo "sha=${sha}" | tee -a "$GITHUB_OUTPUT"

      - name: Build the diff and changed-files inputs
        id: diff
        if: >-
          steps.eligibility.outputs.eligible == 'true' && steps.budget-guard.outputs.over-budget == 'false' &&
          steps.kill-switch.conclusion != 'failure'
        env:
          LAST_GREEN_SHA: ${{ steps.last-green.outputs.sha }}
        run: |
          set -euo pipefail
          git fetch origin '${{ github.event.repository.default_branch }}' --quiet
          fork_point=$(git merge-base "origin/${{ github.event.repository.default_branch }}" HEAD)
          # A code name comes round again, so the last green run of a branch of the same name can
          # be weeks older than this branch. Use it only when it already holds this branch's fork
          # point from the default branch.
          if [ -n "${LAST_GREEN_SHA}" ] && git cat-file -e "${LAST_GREEN_SHA}^{commit}" 2>/dev/null \
            && git merge-base --is-ancestor "${fork_point}" "${LAST_GREEN_SHA}"; then
            range="${LAST_GREEN_SHA}..${{ github.sha }}"
            echo "compared-from=${LAST_GREEN_SHA}" | tee -a "$GITHUB_OUTPUT"
          else
            range="origin/${{ github.event.repository.default_branch }}...HEAD"
          fi
          echo "comparing ${range}" | tee -a "$GITHUB_STEP_SUMMARY"
          git diff "${range}" > "${OUT_DIR}/diff.txt"
          git diff --name-only "${range}" > "${OUT_DIR}/changed-files.txt"
          echo "range=${range}" | tee -a "$GITHUB_OUTPUT"

      - name: Write the invocation context
        id: context
        if: >-
          steps.eligibility.outputs.eligible == 'true' && steps.budget-guard.outputs.over-budget == 'false' &&
          steps.kill-switch.conclusion != 'failure'
        run: |
          set -euo pipefail
          jq -n \
            --arg eventName '${{ github.event_name }}' \
            --arg ref '${{ github.ref }}' \
            --arg refName '${{ github.ref_name }}' \
            --arg environmentName '${{ needs.params.outputs.environment-name }}' \
            --arg githubEnvironment '${{ needs.params.outputs.github-environment }}' \
            --arg deploymentName '${{ needs.params.outputs.deployment-name }}' \
            --arg forceAllStackDeployment '${{ needs.params.outputs.forceAllStackDeployment }}' \
            --arg skipTestScenarios '${{ needs.params.outputs.skipTestScenarios }}' \
            --arg isSkippingDeploy '${{ needs.params.outputs.isSkippingDeploy }}' \
            --arg lastGreenSha '${{ steps.last-green.outputs.sha }}' \
            --arg comparedRange '${{ steps.diff.outputs.range }}' \
            '{eventName: $eventName, ref: $ref, refName: $refName, environmentName: $environmentName, githubEnvironment: $githubEnvironment, deploymentName: $deploymentName, forceAllStackDeployment: $forceAllStackDeployment, skipTestScenarios: $skipTestScenarios, isSkippingDeploy: $isSkippingDeploy, lastGreenSha: $lastGreenSha, comparedRange: $comparedRange}' \
            > "${OUT_DIR}/context.json"

      - name: Build the prompt
        id: prompt
        if: >-
          steps.eligibility.outputs.eligible == 'true' && steps.budget-guard.outputs.over-budget == 'false' &&
          steps.kill-switch.conclusion != 'failure'
        run: |
          set -euo pipefail
          node scripts/ci/select-jobs.mjs prompt \
            --context "${OUT_DIR}/context.json" \
            --diff "${OUT_DIR}/diff.txt" \
            --changed-files "${OUT_DIR}/changed-files.txt" \
            --catalogue deploy.yml \
            > "${OUT_DIR}/prompt.txt"
          echo "prompt-hash=$(sha256sum "${OUT_DIR}/prompt.txt" | cut -d' ' -f1)" | tee -a "$GITHUB_OUTPUT"

      - name: Run the job-selection agent
        if: >-
          steps.eligibility.outputs.eligible == 'true' && steps.budget-guard.outputs.over-budget == 'false' &&
          steps.kill-switch.conclusion != 'failure'
        id: run
        env:
          CLAUDE_CODE_USE_BEDROCK: '1'
          AWS_REGION: ${{ env.AWS_REGION }}
          ANTHROPIC_MODEL: ${{ env.MODEL_ID }}
          ANTHROPIC_SMALL_FAST_MODEL: ${{ env.MODEL_ID }}
          DISABLE_TELEMETRY: '1'
          DISABLE_ERROR_REPORTING: '1'
          DISABLE_AUTOUPDATER: '1'
        run: |
          set -o pipefail
          claude -p \
            --max-turns 6 \
            --output-format json \
            --permission-mode default \
            --disallowedTools "Bash,Edit,Write,WebFetch,WebSearch" \
            --allowedTools "Read,Grep,Glob" \
            < "${OUT_DIR}/prompt.txt" \
            2>&1 | tee "${OUT_DIR}/claude-output.json"

      - name: Parse the answer
        id: decide
        if: always()
        run: |
          set -euo pipefail
          mkdir -p "${OUT_DIR}"
          SKIP_JSON=$(node scripts/ci/select-jobs.mjs decide \
            --ref "${{ github.ref }}" \
            --claude-output "${OUT_DIR}/claude-output.json" \
            --context "${OUT_DIR}/context.json" \
            --model-id "${{ env.MODEL_ID }}" \
            --prompt-hash "${{ steps.prompt.outputs.prompt-hash }}" \
            --catalogue deploy.yml \
            --mode "${SELECT_JOBS_MODE}" \
            --markdown-only "${{ steps.eligibility.outputs.markdown-only }}" \
            --out "${OUT_DIR}/decision.json")
          echo "skip-json=${SKIP_JSON}" | tee -a "$GITHUB_OUTPUT"
          ADVISED_JSON=$(jq -c '.advisedSkip // []' "${OUT_DIR}/decision.json" 2>/dev/null || echo '[]')
          echo "advised-json=${ADVISED_JSON}" | tee -a "$GITHUB_OUTPUT"

      # This run also calls test.yml with `uses:` (job "test"), whose own select-jobs job shares
      # this same github.run_id and uploads its own decision artifact - the name is prefixed by
      # which catalogue produced it so the two never collide.
      - name: Save the decision artifact
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: select-jobs-decision-deploy-${{ github.run_id }}
          path: ${{ env.OUT_DIR }}/decision.json
          if-no-files-found: warn
          retention-days: 30

  # The advice above compares this commit with the head of the branch's last green run, so a
  # stack job may skip only when this deployment still holds what that run left in its stacks.
  # A ci slot passes from branch to branch, so existence alone is not enough: see
  # scripts/ci/stack-holdings.mjs for the checks. Its skip-json names the stack jobs that may
  # skip; on main, with REASONED_JOB_FILTER 'off', on prod, or on any error this job is skipped
  # or writes nothing, and every stack job runs.
  stack-holdings:
    name: 'read which stacks this deployment still holds'
    needs:
      - params
      - names
      - select-jobs
    if: >-
      ${{ !cancelled() && vars.REASONED_JOB_FILTER != 'off' && github.ref != 'refs/heads/main'
      && needs.names.result == 'success' && needs.names.outputs.environment-name == 'ci'
      && needs.params.outputs.isSkippingDeploy != 'true'
      && needs.select-jobs.outputs.compared-from != '' && needs.select-jobs.outputs.advised-json != '' && needs.select-jobs.outputs.advised-json != '[]' }}
    continue-on-error: true
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    environment: ${{ needs.params.outputs.github-environment }}
    permissions:
      contents: read
      id-token: write
      actions: read
    outputs:
      skip-json: ${{ steps.read.outputs.skip-json }}
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Set up the toolchain
        uses: ./.github/actions/setup-toolchain
        with:
          npm-install: none
          npm-cache: 'false'

      - name: Assume the AWS actions and deploy roles
        uses: ./.github/actions/aws-role
        with:
          actions-role-arn: ${{ vars.SUBMIT_ACTIONS_ROLE_ARN }}
          deploy-role-arn: ${{ vars.SUBMIT_DEPLOY_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Read which advised stack jobs this deployment still holds
        id: read
        env:
          GH_TOKEN: ${{ github.token }}
          ADVISED_JSON: ${{ needs.select-jobs.outputs.advised-json }}
          DEPLOYMENT_NAME: ${{ needs.names.outputs.deployment-name }}
          COMPARED_FROM: ${{ needs.select-jobs.outputs.compared-from }}
        run: |
          SKIP_JSON=$(node scripts/ci/stack-holdings.mjs \
            --advised-json "${ADVISED_JSON}" \
            --deployment-name "${DEPLOYMENT_NAME}" \
            --compared-from "${COMPARED_FROM}" \
            --repo "${{ github.repository }}" \
            --branch "${{ github.ref_name }}") || SKIP_JSON='[]'
          echo "skip-json=${SKIP_JSON}" | tee -a "$GITHUB_OUTPUT"

  # A workflow_dispatch naming an explicit deployment-name is about to deploy this same commit,
  # so any push-triggered run of deploy.yml for the same github.sha would otherwise run alongside
  # it and the two contend for the same ci apex alias and Cognito lane user (B140; the coordinator
  # cancelled this by hand three times on 2026-09-13). Runs only for that dispatch shape: a plain
  # push or a dispatch with no deployment-name leaves every other run alone. See
  # cancel-superseded-push-deploy.mjs for why a run whose own stack deploy has already started is
  # never touched.
  #
  # GitHub sometimes delivers one push twice, starting two deploys of the same head a second
  # apart; the newer push-triggered run cancels itself when an older one for the same SHA is
  # still queued or running.
  cancel-superseded-push-deploy:
    name: 'cancel superseded push-triggered deploy'
    if: ${{ (github.event_name == 'workflow_dispatch' && inputs.deployment-name != '') || github.event_name == 'push' }}
    needs:
      - params
    runs-on: ubuntu-24.04
    permissions:
      actions: write
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      # Only ci-set1, ci-set2 and the apex are Cognito callback hosts, so a ci dispatch naming
      # any other set builds stacks whose signed-in probes cannot pass. The whole run is
      # cancelled, because failing one job still lets the probe jobs start.
      - name: Stop a ci dispatch whose deployment-name cannot sign in
        if: ${{ github.event_name == 'workflow_dispatch' && inputs.deployment-name != '' }}
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          TARGET_ENVIRONMENT: ${{ needs.params.outputs.github-environment }}
          DEPLOYMENT_NAME: ${{ needs.params.outputs.deployment-name }}
          SKIP_TEST_SCENARIOS: ${{ needs.params.outputs.skipTestScenarios }}
        run: |
          if [ "$TARGET_ENVIRONMENT" = "ci" ] && [ "$SKIP_TEST_SCENARIOS" = "false" ] \
            && [ "$DEPLOYMENT_NAME" != "ci-set1" ] && [ "$DEPLOYMENT_NAME" != "ci-set2" ]; then
            echo "::error::a ci deployment-name must be ci-set1 or ci-set2 when test scenarios run; other names cannot sign in because only those hosts are Cognito callbacks"
            gh run cancel "${{ github.run_id }}" --repo "${{ github.repository }}"
            exit 1
          fi
      # A push deploys main to prod and any other branch to ci; a dispatch aimed at the other
      # environment covers nothing the push run does, so it leaves that run alone.
      - name: Cancel any push-triggered run of this commit that hasn't started a stack job
        if: ${{ github.event_name == 'workflow_dispatch' && inputs.deployment-name != '' && (needs.params.outputs.github-environment == 'prod') == (github.ref == 'refs/heads/main') }}
        uses: './.github/actions/cancel-superseded-push-deploy'
        with:
          github-token: ${{ github.token }}
      - name: For push events, cancel this run if an older run for the same SHA already exists
        if: ${{ github.event_name == 'push' }}
        shell: bash
        run: |
          OLDER_RUNS=$(gh run list --repo "${{ github.repository }}" --workflow deploy.yml --branch "${{ github.ref_name }}" --json databaseId,headSha,status,event,createdAt --jq ".[] | select(.event == \"push\" and .headSha == \"${{ github.sha }}\" and .databaseId < ${{ github.run_id }}) | select(.status == \"in_progress\" or .status == \"queued\")")

          if [ -z "$OLDER_RUNS" ]; then
            echo "No older push-triggered deploy.yml run for this SHA; proceeding."
            exit 0
          fi

          OLDER_ID=$(echo "$OLDER_RUNS" | jq -r '.databaseId' | head -1)
          echo "Found older push-triggered run $OLDER_ID for SHA ${{ github.sha }} with status in_progress or queued."
          echo "Cancelling this run (${{ github.run_id }}) to avoid duplicate deploy."
          gh run cancel "${{ github.run_id }}" --repo "${{ github.repository }}"
        env:
          GH_TOKEN: ${{ github.token }}

  # Restores app-after-environment ordering on purpose (see the concurrency block's comment for
  # the regression this fixes: B94, caused by removing an ordering nobody had written down when
  # B90 split deploy.yml and deploy-environment.yml's concurrency groups).
  #
  # A shared concurrency group would restore the ordering in one line, but it is the wrong tool:
  # deploy-environment.yml's paths (Java infra source, cdk.json, holding page) change far less
  # often than deploy.yml's (app/functions, web/public, package.json, ...), so folding deploy.yml
  # into deploy-environment.yml's per-environment group would queue every ordinary app-only ci
  # push behind that shared slot too. GitHub keeps only the latest queued run per group, so a
  # third push while a second is queued drops the second's run entirely — exactly the failure
  # wait-for-ci-deploys exists to avoid for deploy.yml's own cross-branch races, and merging
  # groups here would reintroduce it on a wider, busier group. A workflow_run trigger (start
  # deploy.yml only after deploy-environment.yml completes) was also rejected: deploy.yml's push
  # trigger needs to keep firing immediately for the (usual) case where no environment deploy
  # runs at all, and layering a second workflow_run trigger on top risks two runs for one push
  # (one push-triggered, one workflow_run-triggered) with no clean way to dedupe them.
  #
  # So this polls instead, the same technique wait-for-ci-deploys already uses for the other
  # cross-branch race, extended to watch deploy-environment.yml and match by resolved environment
  # rather than by which run was created first: both workflows fire off the same push and can be
  # created in either order a few hundred milliseconds apart, so "older than me" isn't reliable
  # here the way it is for two runs of the same workflow. No deadlock risk: neither workflow calls
  # the other with `uses:`.
  #
  # `names` (below) needs this job because its own Cognito lookup is what raced IdentityStack in
  # B94; every job in this workflow that needs `names` — test, mvn-package,
  # npm-unit-test-coverage, push-images(-us-east-1), and everything past them — inherits the wait
  # for free. If you change how either workflow resolves its environment name, keep this in step:
  # it re-derives deploy-environment.yml's side of that resolution from head_branch alone (see
  # environmentResolvedFromBranch in wait-for-ci-deploys.mjs).
  wait-for-environment-deploy:
    name: 'wait for environment deploy'
    needs:
      - params
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - name: Wait for an in-progress or queued deploy-environment.yml run for this environment
        uses: './.github/actions/wait-for-ci-deploys'
        with:
          github-token: ${{ github.token }}
          workflows: 'deploy-environment.yml'
          match-mode: 'environment'
          target-environment: ${{ needs.params.outputs.github-environment }}
          jobs: ${{ env.ENV_JOBS_READ_BY_APP_STACKS }}

  names:
    needs:
      - params
      - wait-for-environment-deploy
    runs-on: ubuntu-24.04
    environment: ${{ needs.params.outputs.github-environment }}
    env:
      # The push trigger's `paths:` list above as git pathspecs, for the two diff checks below;
      # keep the two lists in step.
      DEPLOY_PATHSPECS: >-
        :(glob)app/data/** :(glob)app/functions/** :(glob)app/lib/** :(glob)app/services/**
        :(glob)infra/main/** :(glob)web/public/** experiments.toml .env.ci .env.prod :(glob)**/cdk.json
        Dockerfile LICENSE package.json package-lock.json pom.xml
        web/public/submit.catalogue.toml :(glob).github/actions/** .github/workflows/deploy.yml
        .github/workflows/deploy-cdk-stack.yml .github/workflows/deploy-stacks.yml .github/workflows/deploy-finish.yml
        .github/workflows/deploy-build.yml .github/workflows/destroy-prod.yml
        .github/workflows/generate-pass.yml .github/workflows/probe-test.yml .github/workflows/test.yml
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          # The live-head and package.json checks below diff against a commit that isn't
          # necessarily the default shallow depth away (the previous live prod deploy, or the
          # push's own previous head), so both need real history. workflow_dispatch never runs
          # either check, so it keeps the cheap shallow clone.
          fetch-depth: ${{ github.event_name == 'workflow_dispatch' && 1 || 0 }}

      # push's own `paths:` filter can't see inside package.json, so a scripts-only addition
      # (a new npm script) still matches the 'package.json' entry there and triggers a full
      # deploy. Diffing the two commits' package.json with `scripts` removed from
      # both tells a real dependency/engine/bundle-input change from a scripts-only one; only a
      # push has a `before` commit to diff against.
      - name: Check whether this push only changed package.json's scripts
        id: package-json-check
        if: ${{ github.event_name == 'push' }}
        shell: bash
        run: |
          BEFORE_SHA="${{ github.event.before }}"
          if [ -z "$BEFORE_SHA" ] || [ "$BEFORE_SHA" = "0000000000000000000000000000000000000000" ]; then
            echo "No previous head for this push (new branch); not treating as a scripts-only change."
            echo "package-json-scripts-only=false" | tee -a "$GITHUB_OUTPUT"
            exit 0
          fi
          if ! git rev-parse --verify "${BEFORE_SHA}^{commit}" >/dev/null 2>&1; then
            echo "Previous head $BEFORE_SHA not found in this checkout's history; not treating as a scripts-only change."
            echo "package-json-scripts-only=false" | tee -a "$GITHUB_OUTPUT"
            exit 0
          fi
          CHANGED=$(git diff --name-only "$BEFORE_SHA"..HEAD -- $DEPLOY_PATHSPECS)
          if [ "$CHANGED" != "package.json" ]; then
            echo "This push's deploy-relevant changes are not package.json alone:"
            echo "$CHANGED"
            echo "package-json-scripts-only=false" | tee -a "$GITHUB_OUTPUT"
            exit 0
          fi
          if ! git show "${BEFORE_SHA}:package.json" > /tmp/package.before.json 2>/dev/null; then
            echo "package.json did not exist at the previous head; not treating as a scripts-only change."
            echo "package-json-scripts-only=false" | tee -a "$GITHUB_OUTPUT"
            exit 0
          fi
          git show HEAD:package.json > /tmp/package.after.json
          if node -e '
            const fs = require("fs");
            function deepEqual(a, b) {
              if (a === b) return true;
              if (typeof a !== typeof b || a === null || b === null || typeof a !== "object") return false;
              const aKeys = Object.keys(a).sort();
              const bKeys = Object.keys(b).sort();
              if (aKeys.length !== bKeys.length) return false;
              return aKeys.every((k, i) => k === bKeys[i] && deepEqual(a[k], b[k]));
            }
            const before = JSON.parse(fs.readFileSync("/tmp/package.before.json", "utf8"));
            const after = JSON.parse(fs.readFileSync("/tmp/package.after.json", "utf8"));
            delete before.scripts;
            delete after.scripts;
            process.exit(deepEqual(before, after) ? 0 : 1);
          '; then
            echo "package.json changed only in its scripts object."
            echo "package-json-scripts-only=true" | tee -a "$GITHUB_OUTPUT"
          else
            echo "package.json changed outside its scripts object."
            echo "package-json-scripts-only=false" | tee -a "$GITHUB_OUTPUT"
          fi

      - name: Assume the AWS actions and deploy roles
        uses: ./.github/actions/aws-role
        with:
          actions-role-arn: ${{ vars.SUBMIT_ACTIONS_ROLE_ARN }}
          deploy-role-arn: ${{ vars.SUBMIT_DEPLOY_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}

      - name: "needs.params.outputs.isSkippingDeploy=[${{ needs.params.outputs.isSkippingDeploy }}]"
        run: ":"

      # The schedule trigger has no push event to filter by `paths:`, so a nightly run redeploys
      # and re-cuts prod even when HEAD only changed files the push trigger would have ignored
      # (e.g. a .md-only commit). /submit/prod/last-known-good-deployment names the sha that is
      # actually live (set only after set-origins and web-test both succeed on a previous run),
      # so its suffix is compared against HEAD directly instead of trusting the schedule to have
      # fired on a real change.
      - name: Check whether the live prod head is already current
        id: live-head-check
        if: ${{ github.event_name == 'schedule' }}
        shell: bash
        run: |
          PARAMETER_NAME="/submit/prod/last-known-good-deployment"
          LIVE_DEPLOYMENT=$(aws ssm get-parameter --name "$PARAMETER_NAME" --query "Parameter.Value" --output text 2>/dev/null || echo "")
          if [ -z "$LIVE_DEPLOYMENT" ] || [ "$LIVE_DEPLOYMENT" = "None" ]; then
            echo "No last-known-good prod deployment on record; treating the live head as not current."
            echo "live-head-is-current=false" | tee -a "$GITHUB_OUTPUT"
            exit 0
          fi
          echo "$LIVE_DEPLOYMENT" > /tmp/last_known_good_deployment.txt
          LIVE_SHA7="${LIVE_DEPLOYMENT#prod-}"
          CURRENT_SHA7="${GITHUB_SHA::7}"
          if [ "$LIVE_SHA7" = "$CURRENT_SHA7" ]; then
            echo "HEAD ($CURRENT_SHA7) is already the live deployment ($LIVE_DEPLOYMENT)."
            echo "live-head-is-current=true" | tee -a "$GITHUB_OUTPUT"
            exit 0
          fi
          if ! git rev-parse --verify "${LIVE_SHA7}^{commit}" >/dev/null 2>&1; then
            echo "Live sha $LIVE_SHA7 not found in this checkout's history; treating the live head as not current."
            echo "live-head-is-current=false" | tee -a "$GITHUB_OUTPUT"
            exit 0
          fi
          LIVE_SHA_FULL=$(git rev-parse "$LIVE_SHA7")
          CHANGED=$(git diff --name-only "$LIVE_SHA_FULL"..HEAD -- $DEPLOY_PATHSPECS)
          if [ -z "$CHANGED" ]; then
            echo "No files under deploy.yml's push paths changed between $LIVE_SHA_FULL and HEAD."
            echo "live-head-is-current=true" | tee -a "$GITHUB_OUTPUT"
          else
            echo "Deploy-relevant files changed since the live deployment:"
            echo "$CHANGED"
            echo "live-head-is-current=false" | tee -a "$GITHUB_OUTPUT"
          fi

      - name: If main and skipping deploy, read back last known good prod deployment from SSM Parameter Store
        if: ${{ (needs.params.outputs.isSkippingDeploy == 'true' || steps.package-json-check.outputs.package-json-scripts-only == 'true') && needs.params.outputs.deployment-name == '' && github.ref == 'refs/heads/main' }}
        run: |
          PARAMETER_NAME="/submit/prod/last-known-good-deployment"
          LAST_KNOWN_GOOD=$(aws ssm get-parameter --name "$PARAMETER_NAME" --query "Parameter.Value" --output text 2>/dev/null || echo "")
          if [ -n "$LAST_KNOWN_GOOD" ] && [ "$LAST_KNOWN_GOOD" != "None" ]; then
            echo "$LAST_KNOWN_GOOD" > /tmp/last_known_good_deployment.txt
          fi
          echo "Last known good deployment: ${LAST_KNOWN_GOOD:-<none>}"

      - name: If not main and skipping deploy, read back last known good ci deployment from SSM Parameter Store
        if: ${{ needs.params.outputs.isSkippingDeploy == 'true' && needs.params.outputs.deployment-name == '' && github.ref != 'refs/heads/main' }}
        run: |
          PARAMETER_NAME="/submit/ci/last-known-good-deployment"
          LAST_KNOWN_GOOD=$(aws ssm get-parameter --name "$PARAMETER_NAME" --query "Parameter.Value" --output text 2>/dev/null || echo "")
          if [ -n "$LAST_KNOWN_GOOD" ] && [ "$LAST_KNOWN_GOOD" != "None" ]; then
            echo "$LAST_KNOWN_GOOD" > /tmp/last_known_good_deployment.txt
          fi
          echo "Last known good deployment: ${LAST_KNOWN_GOOD:-<none>}"

      - name: Determine deployment name to use
        id: resolved-deployment-name
        run: |
          # If skipping deploy (explicitly, or because the live head is already current, or
          # because this push only changed package.json's scripts) AND we found a
          # last-known-good deployment, use that. Otherwise, pass empty/params value to let
          # get-names compute from commit hash or branch.
          if { [ "${{ needs.params.outputs.isSkippingDeploy }}" = "true" ] || [ "${{ steps.live-head-check.outputs.live-head-is-current }}" = "true" ] || [ "${{ steps.package-json-check.outputs.package-json-scripts-only }}" = "true" ]; } && [ -s /tmp/last_known_good_deployment.txt ]; then
              echo "Using last known good deployment from SSM Parameter Store (skipping deploy)"
              echo "deployment-name=$(cat /tmp/last_known_good_deployment.txt)" | tee -a "$GITHUB_OUTPUT"
          elif [ -n "${{ needs.params.outputs.deployment-name }}" ]; then
              echo "Using explicitly provided deployment name"
              echo "deployment-name=${{ needs.params.outputs.deployment-name }}" | tee -a "$GITHUB_OUTPUT"
          else
              echo "Deployment in progress - get-names will compute deployment name from commit hash"
              echo "deployment-name=" | tee -a "$GITHUB_OUTPUT"
          fi

      # Only a plain ci push or dispatch reaches here with no name already resolved: a prod
      # deploy always resolves its own name below (get-names hashes the commit), a
      # skip-deploy run already read one back from last-known-good, and an explicit
      # deployment-name dispatch bypasses the pool.
      - name: Claim a ci slot
        id: claim-slot
        if: ${{ needs.params.outputs.github-environment == 'ci' && steps.resolved-deployment-name.outputs.deployment-name == '' }}
        uses: './.github/actions/claim-ci-slot'
        with:
          github-ref: ${{ github.ref }}
          run-id: ${{ github.run_id }}
          github-token: ${{ github.token }}
          self-destruct-delay-hours: ${{ env.SELF_DESTRUCT_DELAY_HOURS }}

      - name: Compute deployment name and environment
        id: deployment-config
        uses: './.github/actions/get-names'
        with:
          environment-name: ${{ needs.params.outputs.environment-name || '' }}
          deployment-name: ${{ steps.resolved-deployment-name.outputs.deployment-name || steps.claim-slot.outputs.deployment-name }}

      - name: Lookup Cognito from domain convention
        id: lookup-cognito
        uses: './.github/actions/lookup-resources'
        with:
          environment-name: ${{ steps.deployment-config.outputs.environment-name }}
          lookup-cognito: 'true'

      # A push-triggered redeploy re-runs this workflow against a deployment that may already
      # have a SelfDestructStack with a schedule ticking down. "now + delay hours" here would
      # overwrite that schedule with a new one, pushing the deployment's teardown out every time
      # it is redeployed — a branch under active development would then never self-destruct.
      # CloudFormation's own CreationTime for the stack survives updates (only its
      # LastUpdatedTime moves), so it is the one fixed point that identifies this deployment's
      # actual first deploy: read it back and anchor the delay to it instead of to "now". Skipped
      # for prod, which never deploys a SelfDestructStack (see deploy-application-self-destruct's
      # `if:` below) and has no such stack to look up.
      #
      # A ci slot name is different: the same stack name outlives any one ref, so its
      # CreationTime can belong to whichever ref claimed the slot first, not to this run. Anchoring
      # a reclaim to that stale CreationTime could start the window already expired. claim-ci-slot
      # stamps a fresh claimedAt on every claim or reclaim, so a slot deployment anchors there
      # instead, always restarting the window from the claim.
      - name: Resolve self-destruct start datetime, anchored to this deployment's own creation
        id: self-destruct-start
        if: ${{ steps.deployment-config.outputs.environment-name != 'prod' }}
        shell: bash
        run: |
          STACK_NAME="${{ steps.deployment-config.outputs.deployment-name }}-app-SelfDestructStack"
          EXISTING_CREATION_TIME=$(aws cloudformation describe-stacks \
            --stack-name "$STACK_NAME" \
            --query "Stacks[0].CreationTime" \
            --output text 2>/dev/null || echo "")
          if [ -n "${{ steps.claim-slot.outputs.deployment-name }}" ]; then
            ANCHOR_DATETIME="${{ steps.claim-slot.outputs.claimed-at }}"
            echo "Slot ${{ steps.deployment-config.outputs.deployment-name }} was claimed at $ANCHOR_DATETIME; anchoring self-destruct to the claim, not to the stack's CreationTime"
          elif [ -n "$EXISTING_CREATION_TIME" ] && [ "$EXISTING_CREATION_TIME" != "None" ]; then
            echo "Found existing $STACK_NAME created at $EXISTING_CREATION_TIME; anchoring self-destruct to that creation time, not to this redeploy"
            ANCHOR_DATETIME="$EXISTING_CREATION_TIME"
          else
            echo "No existing $STACK_NAME found; this is the deployment's first deploy, anchoring self-destruct to now"
            ANCHOR_DATETIME=$(date -u +"%Y-%m-%dT%H:%M:%SZ")
          fi
          SELF_DESTRUCT_START_DATETIME=$(date -u -d "$ANCHOR_DATETIME + ${{ env.SELF_DESTRUCT_DELAY_HOURS }} hours" +"%Y-%m-%dT%H:%M:%SZ")
          echo "SELF_DESTRUCT_START_DATETIME=$SELF_DESTRUCT_START_DATETIME"
          echo "SELF_DESTRUCT_START_DATETIME=$SELF_DESTRUCT_START_DATETIME" >> $GITHUB_OUTPUT
          # Carried as an output because a reusable workflow's `with:` block cannot read the
          # `env` context, only github/inputs/matrix/needs/strategy/vars. A step's `run:` can,
          # so the delay travels out of here alongside the start time it was used to compute.
          echo "SELF_DESTRUCT_DELAY_HOURS=${{ env.SELF_DESTRUCT_DELAY_HOURS }}" >> $GITHUB_OUTPUT
          # Carried out so the refusal check below (a separate step, for a focused diff) can
          # tell "redeploy of an existing stack" from "this deployment's first deploy" without
          # re-running the same describe-stacks call.
          if [ -n "$EXISTING_CREATION_TIME" ] && [ "$EXISTING_CREATION_TIME" != "None" ]; then
            echo "EXISTING_STACK_FOUND=true" >> "$GITHUB_OUTPUT"
          else
            echo "EXISTING_STACK_FOUND=false" >> "$GITHUB_OUTPUT"
          fi

      # B127: ci-claud20c8 was created 19:37 UTC 2026-09-13 with the 2-hour default; the branch
      # was rebased and pushed; the self-destruct fired 21:37 while the redeploy was recreating
      # ApiStack, and the run failed with "Function not found ...custom-authorizer". Re-anchoring
      # the schedule on every redeploy (so it always moves forward) was rejected on purpose: the
      # anchor-to-CreationTime design immediately above exists specifically so a branch under
      # active development still self-destructs on schedule instead of never — see that step's
      # own comment. Refusing the redeploy here keeps that guarantee and stops it from landing
      # mid-stack-recreation instead: it fails before push-images, mvn-package or any stack job
      # runs, so nothing is left half-deployed.
      #
      # The EventBridge cron this reproduces is SelfDestructStack's own hourExpression logic
      # (24 % delayHours == 0: fires every delayHours hours on the hour that divides evenly from
      # the anchor's hour; otherwise once daily at the anchor's hour) — see SelfDestructStack.java.
      # Only checked for a genuine redeploy of an existing stack: a first deploy's own first fire
      # is always a full selfDestructDelayHours away, which the default (2h) and every documented
      # use of this input clears easily.
      - name: Refuse the redeploy if this deployment's next self-destruct fire is imminent
        if: ${{ steps.deployment-config.outputs.environment-name != 'prod' && steps.self-destruct-start.outputs.EXISTING_STACK_FOUND == 'true' }}
        shell: bash
        run: |
          DELAY_HOURS=${{ env.SELF_DESTRUCT_DELAY_HOURS }}
          START_EPOCH=$(date -u -d "${{ steps.self-destruct-start.outputs.SELF_DESTRUCT_START_DATETIME }}" +%s)
          NOW_EPOCH=$(date -u +%s)
          if [ $((24 % DELAY_HOURS)) -eq 0 ]; then
            PERIOD_SECONDS=$((DELAY_HOURS * 3600))
          else
            # SelfDestructStack.java falls back to a single fixed hour (fires once daily) when
            # delayHours doesn't divide 24 evenly.
            PERIOD_SECONDS=$((24 * 3600))
          fi
          if [ "$NOW_EPOCH" -le "$START_EPOCH" ]; then
            NEXT_FIRE_EPOCH=$START_EPOCH
          else
            ELAPSED=$((NOW_EPOCH - START_EPOCH))
            PERIODS_ELAPSED=$(((ELAPSED + PERIOD_SECONDS - 1) / PERIOD_SECONDS))
            NEXT_FIRE_EPOCH=$((START_EPOCH + PERIODS_ELAPSED * PERIOD_SECONDS))
          fi
          SECONDS_UNTIL_FIRE=$((NEXT_FIRE_EPOCH - NOW_EPOCH))
          MINUTES_UNTIL_FIRE=$((SECONDS_UNTIL_FIRE / 60))
          NEXT_FIRE_ISO=$(date -u -d "@$NEXT_FIRE_EPOCH" +"%Y-%m-%dT%H:%M:%SZ")
          echo "Next self-destruct fire for ${{ steps.deployment-config.outputs.deployment-name }}-app-SelfDestructStack: $NEXT_FIRE_ISO ($MINUTES_UNTIL_FIRE minutes away)"
          if [ "$SECONDS_UNTIL_FIRE" -lt 2700 ]; then
            echo "::error::Refusing this redeploy: ${{ steps.deployment-config.outputs.deployment-name }}'s self-destruct fires at $NEXT_FIRE_ISO, only $MINUTES_UNTIL_FIRE minutes away, and would tear this redeploy's stacks down mid-flight (B127). Wait for it to pass, or dispatch deploy.yml with an explicit deployment-name to deploy under a fresh name instead."
            exit 1
          fi
    outputs:
      environment-name: ${{ steps.deployment-config.outputs.environment-name }}
      deployment-name: ${{ steps.deployment-config.outputs.deployment-name }}
      base-domain: ${{ steps.deployment-config.outputs.base-domain }}
      base-url:      ${{ steps.deployment-config.outputs.base-url }}
      apex-domain: ${{ steps.deployment-config.outputs.apex-domain }}
      apex-url: ${{ steps.deployment-config.outputs.apex-url }}
      public-url: ${{ steps.deployment-config.outputs.public-url }}
      holding-domain: ${{ steps.deployment-config.outputs.holding-domain }}
      holding-url: ${{ steps.deployment-config.outputs.holding-url }}
      prod-apex-alias: ${{ steps.deployment-config.outputs.prod-apex-alias }}
      cognito-user-pool-arn: ${{ steps.lookup-cognito.outputs.cognito-user-pool-arn }}
      cognito-client-id: ${{ steps.lookup-cognito.outputs.cognito-client-id }}
      cognito-diya-gl-client-id: ${{ steps.lookup-cognito.outputs.cognito-diya-gl-client-id }}
      cognito-mcp-client-id: ${{ steps.lookup-cognito.outputs.cognito-mcp-client-id }}
      self-destruct-start-datetime: ${{ steps.self-destruct-start.outputs.SELF_DESTRUCT_START_DATETIME }}
      self-destruct-delay-hours: ${{ steps.self-destruct-start.outputs.SELF_DESTRUCT_DELAY_HOURS }}
      live-head-is-current: ${{ steps.live-head-check.outputs.live-head-is-current }}
      package-json-scripts-only: ${{ steps.package-json-check.outputs.package-json-scripts-only }}

  test:
    name: 'delegate to test workflow'
    needs:
      - params
      - names
    uses: ./.github/workflows/test.yml
    permissions:
      contents: read
      packages: read
      id-token: write
      actions: read
    with:
      environment-name: ${{ needs.names.outputs.environment-name }}
      deployment-name: ${{ needs.names.outputs.deployment-name }}
      runProxyBehaviourTests: ${{ needs.params.outputs.runProxyBehaviourTests }}
    secrets:
      HMRC_SANDBOX_CLIENT_SECRET: ${{ secrets.HMRC_SANDBOX_CLIENT_SECRET }}

  npm-unit-test-coverage:
    name: 'npm unit test with coverage'
    runs-on: ubuntu-latest
    needs:
      - names
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - name: Set up the toolchain
        uses: ./.github/actions/setup-toolchain
        timeout-minutes: 6
        with:
          npm-install: scripts

      - run: npm run test:coverage

      - name: Upload coverage reports
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        if: ${{ !cancelled() }}
        with:
          name: coverage-reports
          path: coverage/
          retention-days: 7

  # NOTE: behaviour-test-submit-vat has been moved to test.yml as behaviour-test-proxy-submit-vat
  # It runs when runProxyBehaviourTests=true is passed to the test workflow

  test-aws-credentials:
    name: 'test aws credentials'
    needs:
      - params
    runs-on: ubuntu-24.04
    environment: ${{ needs.params.outputs.github-environment }}
    steps:
      - name: Checkout the actions
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          sparse-checkout: .github/actions
          persist-credentials: false
      - name: Assume the AWS actions and deploy roles
        uses: ./.github/actions/aws-role
        with:
          actions-role-arn: ${{ vars.SUBMIT_ACTIONS_ROLE_ARN }}
          deploy-role-arn: ${{ vars.SUBMIT_DEPLOY_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}

      - name: CDK stacks in eu-west-2 and us-east-1
        run: |
          aws cloudformation describe-stacks --region eu-west-2 --query "Stacks[].StackName" --output text | tr '\t' '\n' | sort
          aws cloudformation describe-stacks --region us-east-1 --query "Stacks[].StackName" --output text | tr '\t' '\n' | sort

  skip-deploy-check:
    name: 'skip deploy check'
    needs:
      - params
      - names
    if: ${{ needs.params.outputs.isSkippingDeploy != 'true' && needs.names.outputs.live-head-is-current != 'true' && needs.names.outputs.package-json-scripts-only != 'true' }}
    runs-on: ubuntu-24.04
    environment: ${{ needs.params.outputs.github-environment }}
    steps:
      - name: Check if skipDeploy is set
        id: check
        run: |
          echo "params.skipDeploy=${{ needs.params.outputs.skipDeploy }}"
          echo "params.isSkippingDeploy=${{ needs.params.outputs.isSkippingDeploy }}"
          echo "names.live-head-is-current=${{ needs.names.outputs.live-head-is-current }}"
          echo "names.package-json-scripts-only=${{ needs.names.outputs.package-json-scripts-only }}"
          echo "isSkippingDeploy=${{ needs.params.outputs.isSkippingDeploy }}" >> "$GITHUB_OUTPUT"

    outputs:
      isSkippingDeploy: ${{ needs.params.outputs.isSkippingDeploy }}

  wait-for-previous-cleanup:
    name: 'wait for previous cleanup'
    needs:
      - params
      - names
    runs-on: ubuntu-24.04
    environment: ${{ needs.params.outputs.github-environment }}
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - name: Wait for older ci deploy runs to finish
        if: ${{ needs.names.outputs.environment-name != 'prod' }}
        uses: './.github/actions/wait-for-ci-deploys'
        with:
          github-token: ${{ github.token }}

      - name: Assume the AWS actions and deploy roles
        uses: ./.github/actions/aws-role
        with:
          actions-role-arn: ${{ vars.SUBMIT_ACTIONS_ROLE_ARN }}
          deploy-role-arn: ${{ vars.SUBMIT_DEPLOY_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Wait for any DELETE_IN_PROGRESS stacks
        run: |
          DEPLOYMENT_PREFIX="${{ needs.names.outputs.deployment-name }}-app"
          MAX_WAIT_SECONDS=300
          POLL_INTERVAL=15
          ELAPSED=0

          echo "Checking for stacks with prefix: ${DEPLOYMENT_PREFIX} in DELETE_IN_PROGRESS state"

          while [ $ELAPSED -lt $MAX_WAIT_SECONDS ]; do
            DELETING_STACKS=$(aws cloudformation list-stacks \
              --stack-status-filter DELETE_IN_PROGRESS \
              --query "StackSummaries[?starts_with(StackName, '${DEPLOYMENT_PREFIX}')].StackName" \
              --output text)

            if [ -z "$DELETING_STACKS" ] || [ "$DELETING_STACKS" == "None" ]; then
              echo "No stacks in DELETE_IN_PROGRESS state. Proceeding with deployment."
              exit 0
            fi

            echo "Found stacks still deleting: ${DELETING_STACKS}"
            echo "Waiting ${POLL_INTERVAL} seconds... (${ELAPSED}s / ${MAX_WAIT_SECONDS}s)"
            sleep $POLL_INTERVAL
            ELAPSED=$((ELAPSED + POLL_INTERVAL))
          done

          echo "Warning: Some stacks may still be deleting after ${MAX_WAIT_SECONDS}s timeout. Proceeding anyway."
          echo "Stacks still in DELETE_IN_PROGRESS: ${DELETING_STACKS}"

  build:
    name: 'build'
    if: ${{ !cancelled() && needs.names.result == 'success' }}
    needs:
      - params
      - names
      - skip-deploy-check
    uses: ./.github/workflows/deploy-build.yml
    secrets: inherit
    permissions:
      id-token: write
      contents: read
      pull-requests: read
      pages: write
      actions: read
    with:
      github-environment: ${{ needs.params.outputs.github-environment }}
      environment-name: ${{ needs.names.outputs.environment-name }}
      skip-deploy-check-result: ${{ needs.skip-deploy-check.result }}

  stacks:
    name: 'deploy stacks'
    if: ${{ !cancelled() && needs.names.result == 'success' && needs.skip-deploy-check.result == 'success' && needs.build.outputs.push-images-result == 'success' }}
    needs:
      - params
      - names
      - stack-holdings
      - skip-deploy-check
      - build
    uses: ./.github/workflows/deploy-stacks.yml
    secrets: inherit
    permissions:
      id-token: write
      contents: read
      packages: read
      pages: write
      pull-requests: read
      actions: read
    with:
      github-environment: ${{ needs.params.outputs.github-environment }}
      is-skipping-deploy: ${{ needs.params.outputs.isSkippingDeploy }}
      force-all-stack-deployment: ${{ needs.params.outputs.forceAllStackDeployment }}
      environment-name: ${{ needs.names.outputs.environment-name }}
      deployment-name: ${{ needs.names.outputs.deployment-name }}
      package-json-scripts-only: ${{ needs.names.outputs.package-json-scripts-only }}
      self-destruct-start-datetime: ${{ needs.names.outputs.self-destruct-start-datetime }}
      self-destruct-delay-hours: ${{ needs.names.outputs.self-destruct-delay-hours }}
      public-url: ${{ needs.names.outputs.public-url }}
      base-url: ${{ needs.names.outputs.base-url }}
      cognito-user-pool-arn: ${{ needs.names.outputs.cognito-user-pool-arn }}
      cognito-client-id: ${{ needs.names.outputs.cognito-client-id }}
      cognito-diya-gl-client-id: ${{ needs.names.outputs.cognito-diya-gl-client-id }}
      cognito-mcp-client-id: ${{ needs.names.outputs.cognito-mcp-client-id }}
      skip-json: ${{ needs.stack-holdings.outputs.skip-json }}
      base-image-tag: ${{ needs.build.outputs.base-image-tag }}
      mvn-package-result: ${{ needs.build.outputs.mvn-package-result }}
      validate-secrets-result: ${{ needs.build.outputs.validate-secrets-result }}

  set-origins:
    name: 'set origins'
    # Prod only. A ci set proves itself on its own host, and the ci apex follows the set that
    # passed, one promotion behind this run, through promote-ci-apex.yml. Skipping this job on ci
    # does not skip the jobs that need it: every one of them is `if: !cancelled()`.
    # The condition names each need's result, because the implicit success() is false whenever
    # any job upstream was skipped, and stack-holdings is skipped on main by design.
    if: >-
      ${{ !cancelled() && needs.names.result == 'success' && needs.names.outputs.environment-name == 'prod'
      && needs.skip-deploy-check.result == 'success'
      && needs.stacks.outputs.deploy-api-result == 'success'
      && needs.stacks.outputs.deploy-auth-result == 'success'
      && needs.stacks.outputs.deploy-hmrc-result == 'success'
      && needs.stacks.outputs.deploy-hmrc-itsa-result == 'success'
      && needs.stacks.outputs.deploy-hmrc-itsa-property-result == 'success'
      && needs.stacks.outputs.deploy-account-result == 'success'
      && needs.stacks.outputs.deploy-edge-result == 'success'
      && needs.stacks.outputs.deploy-publish-result == 'success'
      && needs.stacks.outputs.deploy-ops-result == 'success' }}
    needs:
      - names
      - skip-deploy-check
      - stacks
    runs-on: ubuntu-24.04
    environment: ${{ needs.names.outputs.environment-name }}
    permissions:
      id-token: write
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - name: Assume the AWS actions and deploy roles
        uses: ./.github/actions/aws-role
        with:
          actions-role-arn: ${{ vars.SUBMIT_ACTIONS_ROLE_ARN }}
          deploy-role-arn: ${{ vars.SUBMIT_DEPLOY_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Lookup CloudFront and API Gateway from domain convention
        id: lookup-resources
        uses: './.github/actions/lookup-resources'
        with:
          environment-name: ${{ needs.names.outputs.environment-name }}
          deployment-name: ${{ needs.names.outputs.deployment-name }}
          lookup-cognito: 'false'
          lookup-api-gateway: 'true'
          lookup-cloudfront: 'true'

      - name: Alias apex domain to base domain
        id: set-origins
        uses: './.github/actions/set-origins'
        with:
          origin-domain: ${{ needs.names.outputs.base-domain }}
          apex-domain: ${{ needs.names.outputs.apex-domain }}
          prod-apex-alias: ${{ needs.names.outputs.prod-apex-alias }}
          aws-account-id: ${{ vars.SUBMIT_ACCOUNT_ID }}
          hosted-zone-id: ${{ vars.ROOT_HOSTED_ZONE_ID }}
          cloudfront-distribution-id: ${{ steps.lookup-resources.outputs.cloudfront-distribution-id }}
          api-gateway-id: ${{ steps.lookup-resources.outputs.http-api-id }}
          regional-certificate-arn: ${{ vars.SUBMIT_REGIONAL_CERTIFICATE_ARN }}
          route53-actions-role-arn: ${{ vars.ROOT_ACTIONS_ROLE_ARN }}
          route53-deploy-role-arn: ${{ vars.ROOT_DEPLOY_ROLE_ARN }}
          restore-actions-role-arn: ${{ vars.SUBMIT_ACTIONS_ROLE_ARN }}
          restore-deploy-role-arn: ${{ vars.SUBMIT_DEPLOY_ROLE_ARN }}
    outputs:
      existing-deployment-name: ${{ steps.set-origins.outputs.existing-deployment-name }}

  # TODO: Uncomment to enable data migrations in the deploy pipeline.
  # Pre-deploy migrations (e.g., salt format conversion) run before CDK deploy.
  # Post-deploy migrations (e.g., backfill saltVersion) run after CDK deploy.
  # For now, run migrations manually via the run-migrations.yml workflow.
  #
  # run-post-deploy-migrations:
  #   name: 'run post-deploy migrations'
  #   needs:
  #     - names
  #     - stacks
  #   uses: ./.github/workflows/run-migrations.yml
  #   permissions:
  #     contents: read
  #     id-token: write
  #   with:
  #     environment-name: ${{ needs.names.outputs.environment-name }}
  #     phase: 'post-deploy'

  enable-native-auth:
    if: ${{ !cancelled() && needs.names.result == 'success' && (github.event_name != 'schedule' || needs.names.outputs.live-head-is-current != 'true' || needs.params.outputs.isSkippingDeploy == 'true') }}
    name: 'enable native auth for behaviour tests'
    needs:
      - params
      - names
      - stacks
    runs-on: ubuntu-24.04
    environment: ${{ needs.params.outputs.github-environment }}
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - name: Set up the toolchain
        uses: ./.github/actions/setup-toolchain
        timeout-minutes: 6
        env:
          PLAYWRIGHT_SKIP_BROWSER_DOWNLOAD: 1

      - name: Assume the AWS actions and deploy roles
        uses: ./.github/actions/aws-role
        with:
          actions-role-arn: ${{ vars.SUBMIT_ACTIONS_ROLE_ARN }}
          deploy-role-arn: ${{ vars.SUBMIT_DEPLOY_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Read TEST_AUTH_PROVIDER
        id: auth-provider
        shell: bash
        run: |
          ENV_FILE=".env.${{ needs.names.outputs.environment-name }}"
          PROVIDER=$(grep -E '^TEST_AUTH_PROVIDER=' "$ENV_FILE" | tail -n1 | cut -d'=' -f2)
          echo "provider=${PROVIDER:-unset}" | tee -a "$GITHUB_OUTPUT"

      # Holds this whole run's need for native auth: every web-test-* job below reuses this
      # hold rather than registering its own, and disable-native-auth (which needs every one of
      # them) releases it. Keyed on the run id alone because deploy.yml's own job graph already
      # serialises this job before every job that depends on the hold.
      - name: Enable native auth on Cognito Hosted UI
        if: ${{ steps.auth-provider.outputs.provider == 'cognito-native' }}
        uses: './.github/actions/hold-native-auth'
        with:
          mode: enable
          environment-name: ${{ needs.names.outputs.environment-name }}
          holder-id: ${{ github.run_id }}
          run-id: ${{ github.run_id }}
          workflow: ${{ github.workflow }}
          github-token: ${{ github.token }}

      # Each suite rotates its own durable Cognito user via probe-test.yml. One user per
      # suite, so parallel suites never clear each other's bundles or each other's password.

  verify-api:
    if: ${{ !cancelled() }}
    name: 'verify API endpoints are reachable'
    needs:
      - names
      - set-origins
      - stacks
    runs-on: ubuntu-24.04
    steps:
      - name: Wait for DNS propagation
        run: sleep 10

      - name: Verify API health via HEAD /api/v1/cognito/token
        run: |
          PUBLIC_URL="${{ needs.names.outputs.public-url }}"
          ENDPOINT="${PUBLIC_URL}api/v1/cognito/token"
          echo "Checking API endpoint: $ENDPOINT"

          MAX_RETRIES=5
          RETRY_DELAY=10
          ATTEMPT=0

          while [ $ATTEMPT -lt $MAX_RETRIES ]; do
            ATTEMPT=$((ATTEMPT + 1))
            echo "Attempt $ATTEMPT of $MAX_RETRIES..."

            HTTP_STATUS=$(curl -s -o /dev/null -w "%{http_code}" --head --max-time 15 "$ENDPOINT" || echo "000")
            echo "HTTP status: $HTTP_STATUS"

            if [ "$HTTP_STATUS" = "404" ] || [ "$HTTP_STATUS" = "000" ]; then
              echo "API route not reachable (status: $HTTP_STATUS)"
              if [ $ATTEMPT -lt $MAX_RETRIES ]; then
                echo "Retrying in ${RETRY_DELAY}s..."
                sleep $RETRY_DELAY
              fi
            else
              echo "API route is reachable (status: $HTTP_STATUS)"
              exit 0
            fi
          done

          echo "ERROR: API routes are unreachable after $MAX_RETRIES attempts."
          echo "This likely means the API Gateway deployment is stale."
          echo "The \$default stage does not include the configured routes."
          echo ""
          echo "Expected: 200, 400, or 401"
          echo "Got: $HTTP_STATUS (404 means routes are not deployed)"
          exit 1

  generate-test-pass:
    if: ${{ !cancelled() && (github.event_name != 'schedule' || needs.names.outputs.live-head-is-current != 'true' || needs.params.outputs.isSkippingDeploy == 'true') }}
    name: 'generate test pass for ${{ needs.names.outputs.environment-name }}'
    needs:
      - params
      - names
      - stacks
    uses: ./.github/workflows/generate-pass.yml
    permissions:
      contents: read
      id-token: write
    with:
      environment-name: ${{ needs.names.outputs.environment-name }}
      pass-type: 'day-guest-test-pass'
      quantity: '1'
      notes: 'Auto-generated by deploy workflow run #${{ github.run_number }}'
      generate-hmrc-user: 'true'
      generate-cognito-user: ${{ (needs.names.outputs.environment-name == 'ci' || needs.params.outputs.skipCleanup == 'true') && 'true' || 'false' }}
    secrets:
      HMRC_SANDBOX_CLIENT_SECRET: ${{ secrets.HMRC_SANDBOX_CLIENT_SECRET }}

  web-test:
    if: ${{ !cancelled() && (github.event_name != 'schedule' || needs.names.outputs.live-head-is-current != 'true' || needs.params.outputs.isSkippingDeploy == 'true') }}
    name: 'submitVatBehaviour-${{ needs.names.outputs.environment-name }} via probe test'
    needs:
      - params
      - names
      - set-origins
      - enable-native-auth
      - verify-api
    uses: ./.github/workflows/probe-test.yml
    permissions:
      contents: read
      packages: read
      id-token: write
    with:
      environment-name: ${{ needs.names.outputs.environment-name }}
      deployment-name: ${{ needs.names.outputs.deployment-name }}
      behaviour-test-suite: 'submitVatBehaviour'
      generate-test-reports: 'true'
      skip-native-auth-disable: 'true'
    secrets:
      HMRC_SANDBOX_CLIENT_SECRET: ${{ secrets.HMRC_SANDBOX_CLIENT_SECRET }}

  # The probe suites other than web-test are listed in .github/behaviour-probe-suites.json; each
  # entry's id is the id select-jobs knows it by. The reasoned job filter drops an entry that
  # advised-json names, while the variable is on and the ref is not main. scenarios drops it when
  # skipTestScenarios is set, ciOnly drops it outside ci, and filing drops it unless
  # runCompaniesHouseSandboxFiling is set.
  probe-suites:
    if: ${{ !cancelled() }}
    name: 'probe suites'
    runs-on: ubuntu-24.04
    needs:
      - select-jobs
      - params
      - names
    outputs:
      include: ${{ steps.filter.outputs.include }}
    steps:
      - name: Checkout the suite list
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          sparse-checkout: .github/behaviour-probe-suites.json
          persist-credentials: false

      - name: Drop the suites that do not run in this deploy
        id: filter
        env:
          ADVISED_JSON: ${{ needs.select-jobs.outputs.advised-json || '[]' }}
          REASONED_JOB_FILTER: ${{ vars.REASONED_JOB_FILTER }}
          SKIP_TEST_SCENARIOS: ${{ needs.params.outputs.skipTestScenarios }}
          ENVIRONMENT_NAME: ${{ needs.names.outputs.environment-name }}
          RUN_COMPANIES_HOUSE_FILING: ${{ needs.params.outputs.runCompaniesHouseSandboxFiling }}
        run: |
          ADVISED_ACTIVE=false
          if [ "${REASONED_JOB_FILTER}" != "off" ] && [ "${GITHUB_REF}" != "refs/heads/main" ]; then
            ADVISED_ACTIVE=true
          fi
          INCLUDE=$(jq -c \
            --argjson advised "${ADVISED_JSON}" \
            --arg active "${ADVISED_ACTIVE}" \
            --arg skipScenarios "${SKIP_TEST_SCENARIOS}" \
            --arg environment "${ENVIRONMENT_NAME}" \
            --arg filing "${RUN_COMPANIES_HOUSE_FILING}" \
            '[.[] | .id as $id | select(
              (($active == "true" and ($advised | index($id) != null)) | not)
              and (if .scenarios then $skipScenarios != "true" else true end)
              and (if .ciOnly then $environment == "ci" else true end)
              and (if .filing then $filing == "true" else true end)
            )]' .github/behaviour-probe-suites.json)
          echo "include=${INCLUDE}" | tee -a "$GITHUB_OUTPUT"

  web-test-suites:
    if: ${{ !cancelled() && needs.probe-suites.result == 'success' && needs.probe-suites.outputs.include != '[]' && (github.event_name != 'schedule' || needs.names.outputs.live-head-is-current != 'true' || needs.params.outputs.isSkippingDeploy == 'true') }}
    name: '${{ matrix.suite }}-${{ needs.names.outputs.environment-name }} via probe test'
    needs:
      - probe-suites
      - names
      - params
      - set-origins
      - enable-native-auth
      - verify-api
    strategy:
      fail-fast: false
      matrix:
        include: ${{ fromJSON(needs.probe-suites.outputs.include) }}
    uses: ./.github/workflows/probe-test.yml
    permissions:
      contents: read
      packages: read
      id-token: write
    with:
      environment-name: ${{ needs.names.outputs.environment-name }}
      deployment-name: ${{ needs.names.outputs.deployment-name }}
      behaviour-test-suite: ${{ matrix.suite }}
      generate-test-reports: 'false'
      skip-native-auth-disable: 'true'
      runCompaniesHouseSandboxFiling: ${{ matrix.filing && needs.params.outputs.runCompaniesHouseSandboxFiling || '' }}
    secrets:
      HMRC_SANDBOX_CLIENT_SECRET: ${{ secrets.HMRC_SANDBOX_CLIENT_SECRET }}
      COMPANIES_HOUSE_SANDBOX_API_KEY: ${{ matrix.filing && secrets.COMPANIES_HOUSE_SANDBOX_API_KEY || '' }}
      TEST_COMPANIES_HOUSE_PASSWORD: ${{ matrix.filing && secrets.TEST_COMPANIES_HOUSE_PASSWORD || '' }}
      TEST_COMPANIES_HOUSE_TOTP_SECRET: ${{ matrix.filing && secrets.TEST_COMPANIES_HOUSE_TOTP_SECRET || '' }}

  disable-native-auth:
    if: ${{ !cancelled() && needs.names.result == 'success' && (github.event_name != 'schedule' || needs.names.outputs.live-head-is-current != 'true' || needs.params.outputs.isSkippingDeploy == 'true') }}
    name: 'disable native auth after behaviour tests'
    needs:
      - params
      - names
      - enable-native-auth
      - web-test
      - web-test-suites
    runs-on: ubuntu-24.04
    environment: ${{ needs.params.outputs.github-environment }}
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - name: Set up the toolchain
        uses: ./.github/actions/setup-toolchain
        timeout-minutes: 6
        env:
          PLAYWRIGHT_SKIP_BROWSER_DOWNLOAD: 1

      - name: Assume the AWS actions and deploy roles
        uses: ./.github/actions/aws-role
        with:
          actions-role-arn: ${{ vars.SUBMIT_ACTIONS_ROLE_ARN }}
          deploy-role-arn: ${{ vars.SUBMIT_DEPLOY_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Read TEST_AUTH_PROVIDER
        id: auth-provider
        if: ${{ needs.params.outputs.skipCleanup != 'true' && needs.names.outputs.environment-name != 'ci' }}
        shell: bash
        run: |
          ENV_FILE=".env.${{ needs.names.outputs.environment-name }}"
          PROVIDER=$(grep -E '^TEST_AUTH_PROVIDER=' "$ENV_FILE" | tail -n1 | cut -d'=' -f2)
          echo "provider=${PROVIDER:-unset}" | tee -a "$GITHUB_OUTPUT"

      # Releases the hold this run's enable-native-auth job registered. Native auth turns off
      # here only once no other run's hold remains; while one does, this job still succeeds and
      # whichever hold is released last performs the real disable.
      - name: Disable native auth on Cognito Hosted UI
        if: ${{ needs.params.outputs.skipCleanup != 'true' && needs.names.outputs.environment-name != 'ci' && steps.auth-provider.outputs.provider == 'cognito-native' }}
        uses: './.github/actions/hold-native-auth'
        with:
          mode: disable
          environment-name: ${{ needs.names.outputs.environment-name }}
          holder-id: ${{ github.run_id }}
          run-id: ${{ github.run_id }}
          workflow: ${{ github.workflow }}
          github-token: ${{ github.token }}

  finish:
    name: 'finish'
    if: ${{ !cancelled() }}
    needs:
      - names
      - stacks
      - set-origins
      - web-test
      - disable-native-auth
    uses: ./.github/workflows/deploy-finish.yml
    secrets: inherit
    permissions:
      id-token: write
      contents: read
      issues: write
      actions: write
      pull-requests: read
      pages: write
    with:
      environment-name: ${{ needs.names.outputs.environment-name }}
      deployment-name: ${{ needs.names.outputs.deployment-name }}
      names-result: ${{ needs.names.result }}
      web-test-result: ${{ needs.web-test.result }}
      set-origins-result: ${{ needs.set-origins.result }}
      existing-deployment-name: ${{ needs.set-origins.outputs.existing-deployment-name }}
      deploy-publish-result: ${{ needs.stacks.outputs.deploy-publish-result }}

  # If set-origins already cut this environment's apex over to the new deployment but that
  # deployment's own behaviour tests then failed, leaving the cutover in place serves a
  # rejected deployment until a person notices. Point the apex and its API Gateway custom
  # domain back at the deployment that was live before this run.
  #
  # The previous deployment name comes from set-origins' own existing-deployment-name output
  # (captured live from CloudFront during this run's own cutover), not from the
  # /submit/{env}/last-known-good-deployment SSM parameter. That parameter is only overwritten
  # by set-last-known-good-deployment below, which itself requires web-test to succeed — so on
  # the failure path this job runs on, the parameter is never touched this run and would still
  # read back correctly. existing-deployment-name is used anyway because it needs no such
  # ordering argument: it is the same value dispatch-destroy-previous already trusts as "the deployment
  # before this one", captured once and reused rather than re-derived from a second source.
  #
  # set-last-known-good-deployment's own success requirement means dispatch-destroy-previous below
  # already cannot fire on this path (its `if:` requires that job's result to be 'success', and
  # it never runs here) — so the deployment this job rolls back to is never at risk from
  # dispatch-destroy-previous in the same run. No change to that guard is needed.
  #
  # This job does not force its own conclusion to failure: web-test's own failed conclusion
  # already makes the whole run's conclusion 'failure' regardless of what runs afterwards, so
  # the run cannot report green just because the rollback below succeeds.
  rollback-origins:
    name: 'roll back apex to previous deployment'
    # Prod only, like the promotion it undoes: a ci run never moves an apex, so it has nothing to
    # roll back and the set it just proved is simply never promoted.
    if: ${{ !cancelled() && needs.names.outputs.environment-name == 'prod' && needs.set-origins.result == 'success' && needs.web-test.result == 'failure' && needs.set-origins.outputs.existing-deployment-name != '' }}
    needs:
      - names
      - set-origins
      - web-test
    runs-on: ubuntu-24.04
    environment: ${{ needs.names.outputs.environment-name }}
    permissions:
      id-token: write
      contents: read
      issues: write
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - name: Assume the AWS actions and deploy roles
        uses: ./.github/actions/aws-role
        with:
          actions-role-arn: ${{ vars.SUBMIT_ACTIONS_ROLE_ARN }}
          deploy-role-arn: ${{ vars.SUBMIT_DEPLOY_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Lookup CloudFront and API Gateway for the previous deployment
        id: lookup-previous
        uses: './.github/actions/lookup-resources'
        with:
          environment-name: ${{ needs.names.outputs.environment-name }}
          deployment-name: ${{ needs.set-origins.outputs.existing-deployment-name }}
          lookup-cognito: 'false'
          lookup-api-gateway: 'true'
          lookup-cloudfront: 'true'

      - name: Alias apex domain back to the previous deployment
        id: rollback
        uses: './.github/actions/set-origins'
        with:
          origin-domain: ${{ needs.set-origins.outputs.existing-deployment-name }}.submit.diyaccounting.co.uk
          apex-domain: ${{ needs.names.outputs.apex-domain }}
          prod-apex-alias: ${{ needs.names.outputs.prod-apex-alias }}
          aws-account-id: ${{ vars.SUBMIT_ACCOUNT_ID }}
          hosted-zone-id: ${{ vars.ROOT_HOSTED_ZONE_ID }}
          cloudfront-distribution-id: ${{ steps.lookup-previous.outputs.cloudfront-distribution-id }}
          api-gateway-id: ${{ steps.lookup-previous.outputs.http-api-id }}
          regional-certificate-arn: ${{ vars.SUBMIT_REGIONAL_CERTIFICATE_ARN }}
          route53-actions-role-arn: ${{ vars.ROOT_ACTIONS_ROLE_ARN }}
          route53-deploy-role-arn: ${{ vars.ROOT_DEPLOY_ROLE_ARN }}
          restore-actions-role-arn: ${{ vars.SUBMIT_ACTIONS_ROLE_ARN }}
          restore-deploy-role-arn: ${{ vars.SUBMIT_DEPLOY_ROLE_ARN }}

      - name: Report the rollback
        run: |
          echo "::error::web-test failed for ${{ needs.names.outputs.deployment-name }}; rolled the apex back to ${{ needs.set-origins.outputs.existing-deployment-name }}."

      # The set left standing (needs.names.outputs.deployment-name) is never promoted to
      # last-known-good on this path (set-last-known-good-deployment requires web-test to
      # succeed), so nobody is told unless this issue exists. set-last-known-good-deployment
      # closes it (by this same title) the next time a set for this environment is promoted.
      - name: Open an incident issue for the rollback
        if: ${{ !cancelled() }}
        env:
          GH_TOKEN: ${{ github.token }}
          ISSUE_TITLE: "[INCIDENT] ${{ needs.names.outputs.environment-name }} apex rollback"
        run: |
          BODY=$(cat <<BODYEOF
          ## Apex rollback

          Run: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
          Failed probe suite: submitVatBehaviour (the web-test job gating this rollback)
          Rolled back to deployment: ${{ needs.set-origins.outputs.existing-deployment-name }}
          Deployment left standing, unpromoted: ${{ needs.names.outputs.deployment-name }}
          BODYEOF
          )
          # The REST endpoint creates the label on first use; gh issue create --label fails when it is missing.
          gh api --method POST "repos/${{ github.repository }}/issues" -f title="$ISSUE_TITLE" -f body="$BODY" -f "labels[]=incident" --jq .html_url
    outputs:
      rolled-back-to-deployment-name: ${{ needs.set-origins.outputs.existing-deployment-name }}

  # A failed or cancelled run never reaches set-last-known-good-deployment, and until now only
  # claim-ci-slot.mjs's own staleness rule (self-destruct delay plus one hour) freed its slot
  # again - about five hours on the default two-hour delay, during which no other branch can get
  # a slot at all. Releasing here, at the end of every run regardless of outcome, gives the slot
  # back the moment this run is done instead of waiting on staleness; that rule stays as the
  # backstop for a run that never reaches this job (a runner outage, a cancellation before this
  # point).
  #
  # Only releases a deployment name that is actually a slot (ci-setN); an explicit
  # deployment-name dispatch or a prod deployment holds no slot and this is a no-op for it, same
  # as destroy-ci.yml's own release step. A deployment that is still this environment's
  # last-known-good is left alone even when this run's own claim named it, so a run that just got
  # promoted doesn't hand its slot to the next unrelated branch the moment it ends - see
  # set-last-known-good-deployment above for where that parameter is written.
  release-ci-slot:
    name: 'release the ci slot this run claimed'
    if: ${{ always() && needs.names.outputs.deployment-name != '' }}
    needs:
      - params
      - names
      - stacks
      - web-test
      - finish
      - rollback-origins
    runs-on: ubuntu-24.04
    environment: ${{ needs.params.outputs.github-environment }}
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Assume the AWS actions and deploy roles
        uses: ./.github/actions/aws-role
        with:
          actions-role-arn: ${{ vars.SUBMIT_ACTIONS_ROLE_ARN }}
          deploy-role-arn: ${{ vars.SUBMIT_DEPLOY_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Release the ci slot this run claimed
        shell: bash
        env:
          DEPLOYMENT: ${{ needs.names.outputs.deployment-name }}
        run: |
          if [[ ! "$DEPLOYMENT" =~ ^ci-set[0-9]+$ ]]; then
            echo "$DEPLOYMENT holds no ci slot, nothing to release"
            exit 0
          fi
          LAST_KNOWN_GOOD=$(aws ssm get-parameter --name "/submit/ci/last-known-good-deployment" --query "Parameter.Value" --output text 2>/dev/null || echo "")
          if [ "$LAST_KNOWN_GOOD" = "$DEPLOYMENT" ]; then
            echo "$DEPLOYMENT is the current ci last-known-good deployment; leaving its slot claim in place"
            exit 0
          fi
          RELEASE_CI_SLOT_AWS_CLI="$(command -v aws)"
          export RELEASE_CI_SLOT_AWS_CLI
          export RELEASE_CI_SLOT_DEPLOYMENT_NAME="$DEPLOYMENT"
          export RELEASE_CI_SLOT_RUN_ID="${{ github.run_id }}"
          node .github/actions/claim-ci-slot/release-ci-slot.mjs

  # GitHub drops most of destroy-ci.yml's cron slots, so each ci deploy ends by checking for a
  # set old enough to sweep and calls the sweep only when it finds one.
  check-ci-sweep:
    if: ${{ !cancelled() && needs.params.outputs.github-environment == 'ci' }}
    name: 'check whether a ci set needs sweeping'
    needs:
      - params
      - names
      - disable-native-auth
    runs-on: ubuntu-24.04
    environment: ci
    steps:
      - name: Checkout the actions
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          sparse-checkout: .github/actions
          persist-credentials: false
      - name: Assume the AWS actions and deploy roles
        uses: ./.github/actions/aws-role
        with:
          actions-role-arn: ${{ vars.SUBMIT_ACTIONS_ROLE_ARN }}
          deploy-role-arn: ${{ vars.SUBMIT_DEPLOY_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Find whether any ci set's SelfDestructStack is old enough to sweep
        id: check
        shell: bash
        run: |
          set -euo pipefail
          LAST_KNOWN_GOOD=$(aws ssm get-parameter --name "/submit/ci/last-known-good-deployment" --query "Parameter.Value" --output text 2>/dev/null || echo "")
          echo "Last known good ci deployment: '$LAST_KNOWN_GOOD'"

          STACK_LINES=$(
            for REGION in eu-west-2 us-east-1; do
              aws cloudformation describe-stacks --region "$REGION" \
                --query "Stacks[?ends_with(StackName, '-app-SelfDestructStack')].[StackName,CreationTime]" \
                --output text 2>/dev/null || true
            done
          )

          NOW_EPOCH=$(date -u +%s)
          NEEDS_SWEEP="false"

          while IFS=$'\t' read -r STACK_NAME CREATION_TIME; do
            [ -z "$STACK_NAME" ] && continue
            case "$STACK_NAME" in
              ci-*-app-SelfDestructStack) ;;
              *) continue ;;
            esac
            DEPLOYMENT_NAME="${STACK_NAME%-app-SelfDestructStack}"
            if [ "$DEPLOYMENT_NAME" = "$LAST_KNOWN_GOOD" ]; then
              echo "$DEPLOYMENT_NAME: last known good, not a sweep candidate"
              continue
            fi
            CREATED_EPOCH=$(date -u -d "$CREATION_TIME" +%s 2>/dev/null || echo "0")
            if [ "$CREATED_EPOCH" -eq 0 ]; then
              echo "$DEPLOYMENT_NAME: could not parse creation time '$CREATION_TIME', skipping"
              continue
            fi
            AGE_HOURS=$(( (NOW_EPOCH - CREATED_EPOCH) / 3600 ))
            echo "$DEPLOYMENT_NAME: $AGE_HOURS hours old"
            # Keep in step with destroy-ci.yml's own SELF_DESTRUCT_SWEEP_MIN_AGE_HOURS.
            if [ "$AGE_HOURS" -ge 8 ]; then
              echo "$DEPLOYMENT_NAME is $AGE_HOURS hours old and not last-known-good; a sweep is needed"
              NEEDS_SWEEP="true"
            fi
          done <<< "$STACK_LINES"

          echo "needs-sweep=$NEEDS_SWEEP" | tee -a "$GITHUB_OUTPUT"
    outputs:
      needs-sweep: ${{ steps.check.outputs.needs-sweep }}

  sweep-ci:
    if: ${{ !cancelled() && needs.check-ci-sweep.outputs.needs-sweep == 'true' }}
    name: 'sweep ci for a stale set'
    needs:
      - check-ci-sweep
    permissions:
      id-token: write
      contents: read
      actions: read
    secrets: inherit
    uses: './.github/workflows/destroy-ci.yml'
    with:
      sweep-for-stacks: true
