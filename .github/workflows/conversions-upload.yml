name: conversions upload
run-name: "conversions upload (${{ inputs.vendor || 'scheduled' }}, ${{ inputs.mode || 'apply' }})"

# Uploads paid-subscription conversions to each ad vendor. Both run after the nightly analytics
# ingestion (02:15 UTC) has refreshed the lake. Each vendor has its own schedule, and a dispatch
# runs one vendor or both. The credentials come from Secrets Manager through the AWS role chain.
#
# - google: conversions with a stored gclid go to Google Ads through the Data Manager API. The
#   invoice id is the transactionId, so re-sending a day is a no-op.
# - microsoft: conversions with a stored msclkid go to Microsoft Advertising as offline
#   conversions (credentials at prod/submit/microsoft-ads/*). Microsoft ignores a repeat of the
#   same msclkid and conversion time, so re-sending a day is a no-op.

defaults:
  run:
    shell: bash

on:
  schedule:
    - cron: '0 5 * * *'
    - cron: '20 5 * * *'
  workflow_dispatch:
    inputs:
      vendor:
        description: "Vendor to upload to"
        required: false
        default: both
        type: choice
        options:
          - both
          - google
          - microsoft
      since:
        description: "First day to include, YYYY-MM-DD (default: yesterday for google, three days ago for microsoft)"
        required: false
        type: string
      mode:
        description: "apply uploads, validate-only (google only) has Google check without storing, dry-run only prints the conversions"
        required: false
        default: apply
        type: choice
        options:
          - apply
          - validate-only
          - dry-run

env:
  AWS_REGION: 'eu-west-2'

jobs:
  select:
    name: select vendors
    runs-on: ubuntu-24.04
    permissions: {}
    outputs:
      vendors: ${{ steps.select.outputs.vendors }}
    steps:
      - name: Select the vendors for this run
        id: select
        env:
          EVENT_NAME: ${{ github.event_name }}
          SCHEDULE: ${{ github.event.schedule }}
          VENDOR_INPUT: ${{ inputs.vendor || 'both' }}
          MODE_INPUT: ${{ inputs.mode || 'apply' }}
        run: |
          if [ "$EVENT_NAME" = "schedule" ]; then
            case "$SCHEDULE" in
              '0 5 * * *') vendors='["google"]' ;;
              '20 5 * * *') vendors='["microsoft"]' ;;
              *) echo "No vendor for the schedule '$SCHEDULE'" >&2; exit 1 ;;
            esac
          else
            case "$VENDOR_INPUT" in
              both) vendors='["google","microsoft"]' ;;
              google) vendors='["google"]' ;;
              microsoft) vendors='["microsoft"]' ;;
              *) echo "Unknown vendor: $VENDOR_INPUT" >&2; exit 1 ;;
            esac
            if [ "$MODE_INPUT" = "validate-only" ]; then
              if [ "$VENDOR_INPUT" = "microsoft" ]; then
                echo "validate-only is a Google Ads mode" >&2
                exit 1
              fi
              vendors='["google"]'
            fi
          fi
          echo "vendors=$vendors" | tee -a "$GITHUB_OUTPUT"

  upload:
    needs: select
    name: upload ${{ matrix.vendor }}
    strategy:
      fail-fast: false
      matrix:
        vendor: ${{ fromJSON(needs.select.outputs.vendors) }}
    concurrency:
      group: conversions-upload-${{ matrix.vendor }}
      cancel-in-progress: false
    runs-on: ubuntu-24.04
    environment: prod
    permissions:
      id-token: write
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Set up the toolchain
        timeout-minutes: 6
        uses: ./.github/actions/setup-toolchain

      - name: Assume the AWS actions and deployment roles
        uses: ./.github/actions/aws-role
        with:
          actions-role-arn: ${{ vars.SUBMIT_ACTIONS_ROLE_ARN }}
          deploy-role-arn: ${{ vars.SUBMIT_DEPLOY_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Upload Google Ads conversions
        if: matrix.vendor == 'google'
        env:
          SINCE_INPUT: ${{ inputs.since }}
          MODE_INPUT: ${{ inputs.mode || 'apply' }}
        run: |
          since="${SINCE_INPUT:-$(date -u -d yesterday +%F)}"
          case "$MODE_INPUT" in
            apply) mode_flag="--apply" ;;
            validate-only) mode_flag="--validate-only" ;;
            dry-run) mode_flag="" ;;
            *) echo "Unknown mode: $MODE_INPUT" >&2; exit 1 ;;
          esac
          node infra/google/ads/ads-conversions-upload.js --env prod --since "$since" $mode_flag 2>&1 | tee conversions-upload.log

      - name: Upload Microsoft Advertising conversions
        if: matrix.vendor == 'microsoft'
        env:
          SINCE_INPUT: ${{ inputs.since }}
          MODE_INPUT: ${{ inputs.mode || 'apply' }}
        run: |
          args=(--env prod)
          if [ -n "$SINCE_INPUT" ]; then args+=(--since "$SINCE_INPUT"); fi
          case "$MODE_INPUT" in
            apply) args+=(--apply) ;;
            dry-run) ;;
            *) echo "Unknown mode: $MODE_INPUT" >&2; exit 1 ;;
          esac
          node infra/microsoft/ads/msads-conversions-upload.js "${args[@]}" 2>&1 | tee conversions-upload.log

      - name: Generate step summary
        if: always()
        env:
          VENDOR: ${{ matrix.vendor }}
          MODE: ${{ inputs.mode || 'apply' }}
        run: |
          if [ -f conversions-upload.log ]; then
            echo "# ${VENDOR} conversions upload (${MODE})" >> "$GITHUB_STEP_SUMMARY"
            echo '```' >> "$GITHUB_STEP_SUMMARY"
            cat conversions-upload.log >> "$GITHUB_STEP_SUMMARY"
            echo '```' >> "$GITHUB_STEP_SUMMARY"
          fi
