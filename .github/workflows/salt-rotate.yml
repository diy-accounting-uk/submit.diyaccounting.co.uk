# Rotates one environment's user-sub-hash-salt and re-keys every hash-keyed store
# (scripts/salt-rotate.js, scripts/salt-rotation-tables.json).
# Dispatch-only. plan writes nothing and prints counts per table by salt version. rotate adds a new
# version and moves every item, and a rotate after a stop resumes from the registry. sweep moves
# only items written late under an earlier version, and runs a day after a rotate.
# The script prints counts only, because this log is public. It reads every row of the passes,
# commissions and subscriptions tables; a list of users cannot address those rows.

name: salt rotate
run-name: "salt rotate (${{ inputs.mode }}) ${{ inputs.environment-name }} from ${{ github.ref_name }}"

concurrency:
  group: salt-rotate-${{ inputs.environment-name }}
  cancel-in-progress: false

on:
  workflow_dispatch:
    inputs:
      environment-name:
        description: 'Environment'
        type: choice
        required: true
        default: 'ci'
        options:
          - 'ci'
          - 'prod'
      mode:
        description: 'plan writes nothing; rotate adds a salt version and re-keys; sweep re-keys late items'
        type: choice
        required: true
        default: 'plan'
        options:
          - 'plan'
          - 'rotate'
          - 'sweep'

env:
  AWS_REGION: 'eu-west-2'

jobs:
  rotate:
    name: ${{ inputs.mode }} (${{ inputs.environment-name }})
    runs-on: ubuntu-24.04
    timeout-minutes: 180
    environment: ${{ inputs.environment-name }}
    permissions:
      id-token: write
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Set up the toolchain
        timeout-minutes: 6
        uses: ./.github/actions/setup-toolchain

      - name: Assume the AWS actions and deployment roles
        uses: ./.github/actions/aws-role
        with:
          actions-role-arn: ${{ vars.SUBMIT_ACTIONS_ROLE_ARN }}
          deploy-role-arn: ${{ vars.SUBMIT_DEPLOY_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Look up the Cognito user pool
        id: lookup-resources
        uses: ./.github/actions/lookup-resources
        with:
          environment-name: ${{ inputs.environment-name }}

      - name: Rotate the salt
        env:
          ENVIRONMENT_NAME: ${{ inputs.environment-name }}
          COGNITO_USER_POOL_ID: ${{ steps.lookup-resources.outputs.cognito-user-pool-id }}
          MODE: ${{ inputs.mode }}
        run: |
          set -o pipefail
          node scripts/salt-rotate.js --mode "$MODE" 2>&1 | tee salt-rotate.log

      - name: Generate step summary
        if: always()
        env:
          ENVIRONMENT_NAME: ${{ inputs.environment-name }}
          MODE: ${{ inputs.mode }}
        run: |
          {
            echo "# Salt rotate, $ENVIRONMENT_NAME ($MODE)"
            echo '```'
            cat salt-rotate.log
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
