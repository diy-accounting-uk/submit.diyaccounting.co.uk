name: video-capture
run-name: "record ${{ inputs.script }} video"

# Records a scene script (videos/*.json) against a running deployment with
# scripts/site-video-capture.js and uploads the mp4, vtt, transcript and stills as artifacts.
# See the site-video-capture skill (.claude/skills/site-video-capture/SKILL.md) for the full
# procedure — local iteration first, then this workflow for the real recording.

concurrency:
  # This workflow toggles Cognito native auth during recording, so same-environment runs must not
  # overlap. They queue instead of cancelling: a cancelled capture is a lost recording, and the
  # hold-native-auth action (see its own enable/disable steps below) keeps this workflow's toggle
  # from racing deploy.yml, deploy-app.yml or probe-test.yml over the same Cognito setting.
  # GitHub keeps one pending run per group and drops an older pending one, so a caller that
  # dispatches several captures waits for each to finish before dispatching the next
  # (video-capture-on-deploy.yml does). Key the group on the environment being recorded, not the
  # branch triggering it, so that workflow_dispatch calls targeting prod from any branch queue
  # behind each other. When deployment-name is given, use it (often reused across branches for
  # targeted re-records); otherwise resolve the effective environment from the explicit input or
  # branch.
  group: video-capture-${{ inputs.deployment-name || (inputs.environment-name && inputs.environment-name != '(auto)' && inputs.environment-name) || (github.ref == 'refs/heads/main' && 'prod' || 'ci') }}
  cancel-in-progress: false

on:
  workflow_dispatch:
    inputs:
      script:
        type: choice
        description: 'Scene script to record (videos/<script>.json)'
        required: false
        options:
          - 'tour'
          - 'view-obligations'
          - 'hmrc-authorise'
          - 'view-return'
          - 'view-liabilities'
          - 'view-payments'
          - 'view-penalties'
          - 'submit-return'
          - 'vat-hmrc-assist'
          - 'itsa-business-details'
          - 'itsa-quarterly-update'
          - 'itsa-year'
          - 'itsa-year-part'
          - 'file-micro-entity-accounts'
          - 'sign-in'
          - 'tokens'
          - 'subscription-management'
          - 'company-lookup'
          - 'change-registered-office'
          - 'change-registered-email'
          - 'my-receipts'
          - 'generate-pass-digital'
          - 'generate-pass-physical'
          - 'file-confirmation-statement'
          - 'mcp-diya-gl'
          - 'accounting-diya-gl-profit'
          - 'accounting-spreadsheet-profit'
          - 'itsa-loss-claims'
          - 'itsa-foreign-property-losses'
          - 'itsa-carry-back-adjustments'
          - 'itsa-self-employment-amend'
          - 'itsa-uk-property-year'
          - 'itsa-annual-from-book'
          - 'itsa-in-year-estimate'
        default: 'tour'
      environment-name:
        type: choice
        description: 'Environment to record against'
        required: false
        options:
          - '(auto)'
          - 'ci'
          - 'prod'
        default: '(auto)'
      deployment-name:
        type: string
        description: 'Deployment name to use instead of computing from branch, e.g. ci-lambdas6 or prod-ea373de'
        required: false
        default: ''
      skip-native-auth-disable:
        type: boolean
        description: 'Skip disabling native auth after the run (caller manages cleanup)'
        required: false
        default: false

permissions:
  id-token: write
  contents: read
  actions: read

env:
  NODE_VERSION: '24'
  AWS_REGION: 'eu-west-2'

jobs:

  playwright-version:
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.v.outputs.version }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - id: v
        run: echo "version=$(node -p "require('./package-lock.json').packages['node_modules/playwright'].version")" >> "$GITHUB_OUTPUT"

  params:
    runs-on: ubuntu-24.04
    steps:
      - name: Normalise params
        id: normalise
        shell: bash
        run: |
          X='${{ inputs.script }}'; echo "script=${X:-tour}" | tee -a "$GITHUB_OUTPUT"
          ENV_NAME='${{ inputs.environment-name }}'; [[ "$ENV_NAME" == "(auto)" ]] && ENV_NAME=""
          echo "environment-name=${ENV_NAME}" | tee -a "$GITHUB_OUTPUT"
          GH_ENV="${ENV_NAME}"
          if [ -z "$GH_ENV" ]; then
            if [ "${{ github.ref }}" == "refs/heads/main" ]; then GH_ENV="prod"; else GH_ENV="ci"; fi
          fi
          echo "github-environment=${GH_ENV}" | tee -a "$GITHUB_OUTPUT"
          echo 'deployment-name=${{ inputs.deployment-name }}' | tee -a "$GITHUB_OUTPUT"
          X='${{ inputs.skip-native-auth-disable }}'; echo "skip-native-auth-disable=${X:-false}" | tee -a "$GITHUB_OUTPUT"
    outputs:
      script: ${{ steps.normalise.outputs.script }}
      environment-name: ${{ steps.normalise.outputs.environment-name }}
      deployment-name: ${{ steps.normalise.outputs.deployment-name }}
      skip-native-auth-disable: ${{ steps.normalise.outputs.skip-native-auth-disable }}
      github-environment: ${{ steps.normalise.outputs.github-environment }}

  script-meta:
    # A scene script with "localApp" records a local tool, so the names job's deployment lookup is skipped.
    needs: params
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - name: Read scene script localApp
        id: meta
        run: |
          HAS_LOCAL_APP=$(node -p "!!(require('./videos/${{ needs.params.outputs.script }}.json').localApp)")
          echo "has-local-app=${HAS_LOCAL_APP}" | tee -a "$GITHUB_OUTPUT"
    outputs:
      has-local-app: ${{ steps.meta.outputs.has-local-app }}

  names:
    needs:
      - params
      - script-meta
    if: ${{ needs.script-meta.outputs.has-local-app != 'true' }}
    runs-on: ubuntu-24.04
    environment: ${{ needs.params.outputs.github-environment }}
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - name: Configure AWS role via GitHub OIDC
        uses: aws-actions/configure-aws-credentials@e1253824e5c10ff9df46874f81ed3ec929e19cfd # v6
        with:
          role-to-assume: ${{ vars.SUBMIT_ACTIONS_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}
          role-chaining: false
          audience: sts.amazonaws.com
          role-skip-session-tagging: true
          output-credentials: true
          retry-max-attempts: 3

      - name: Assume AWS deployment role
        uses: aws-actions/configure-aws-credentials@e1253824e5c10ff9df46874f81ed3ec929e19cfd # v6
        with:
          role-to-assume: ${{ vars.SUBMIT_DEPLOY_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}
          role-chaining: true
          audience: sts.amazonaws.com
          role-skip-session-tagging: true
          output-credentials: true
          retry-max-attempts: 3

      - name: Read back last known good deployment from SSM Parameter Store
        # Runs even when deployment-name is given, so an explicit name can be checked against
        # it below: the apex only serves the last-known-good deployment, and sign-in only
        # completes on the apex (Cognito's registered redirect_uri), so recording an explicit
        # deployment that the apex does not serve records a broken sign-in.
        run: |
          PARAMETER_NAME="/submit/${{ needs.params.outputs.github-environment }}/last-known-good-deployment"
          LAST_KNOWN_GOOD=$(aws ssm get-parameter --name "$PARAMETER_NAME" --query "Parameter.Value" --output text 2>/dev/null || echo "")
          if [ -n "$LAST_KNOWN_GOOD" ] && [ "$LAST_KNOWN_GOOD" != "None" ]; then
            echo "$LAST_KNOWN_GOOD" > /tmp/last_known_good_deployment.txt
          fi
          echo "Last known good deployment: ${LAST_KNOWN_GOOD:-<none>}"

      - name: Fail if the named deployment is not the environment's last-known-good
        if: ${{ needs.params.outputs.deployment-name != '' }}
        run: |
          LAST_KNOWN_GOOD=$(cat /tmp/last_known_good_deployment.txt 2>/dev/null || echo "")
          NAMED="${{ needs.params.outputs.deployment-name }}"
          if [ "$NAMED" != "$LAST_KNOWN_GOOD" ]; then
            echo "::error::deployment-name=${NAMED} is not the environment's last-known-good ${LAST_KNOWN_GOOD:-<none>}; the apex serves ${LAST_KNOWN_GOOD:-<none>} and sign-in only completes on the apex" >&2
            exit 1
          fi

      - name: Resolve deployment name
        id: deployment-name
        run: |
          if [ -n "${{ needs.params.outputs.deployment-name }}" ]; then
            echo "deployment-name=${{ needs.params.outputs.deployment-name }}" | tee -a "$GITHUB_OUTPUT"
          elif [ -s /tmp/last_known_good_deployment.txt ]; then
            echo "deployment-name=$(cat /tmp/last_known_good_deployment.txt)" | tee -a "$GITHUB_OUTPUT"
          else
            echo "deployment-name=" | tee -a "$GITHUB_OUTPUT"
          fi

      - name: Compute environment name and apex URL
        id: deployment-config
        uses: './.github/actions/get-names'
        with:
          environment-name: ${{ needs.params.outputs.environment-name }}
          deployment-name: ${{ steps.deployment-name.outputs.deployment-name }}
    outputs:
      environment-name: ${{ steps.deployment-config.outputs.environment-name }}
      deployment-name: ${{ steps.deployment-config.outputs.deployment-name }}
      public-url: ${{ steps.deployment-config.outputs.public-url }}
      base-url: ${{ steps.deployment-config.outputs.base-url }}

  capture:
    name: 'capture ${{ needs.params.outputs.script }}-${{ needs.names.outputs.environment-name }}'
    needs:
      - params
      - script-meta
      - names
      - playwright-version
    # names is skipped for a localApp script; the default success() would skip this job with it.
    if: ${{ !cancelled() && needs.script-meta.result == 'success' && (needs.names.result == 'success' || needs.names.result == 'skipped') }}
    runs-on: ubuntu-24.04
    container: mcr.microsoft.com/playwright:v${{ needs.playwright-version.outputs.version }}-jammy
    environment: ${{ needs.params.outputs.github-environment }}
    # Collabora Online (the workbook video's spreadsheet editor) starts only for that script; an
    # empty image string starts no service. SYS_ADMIN lets it bind-mount each document's jail.
    services:
      collabora:
        image: ${{ needs.params.outputs.script == 'accounting-spreadsheet-profit' && 'collabora/code@sha256:4e983196eb9878f339cc506c38c21f1cc3473bca3d6de883c5de08f9c0cc3a6c' || '' }}
        env:
          aliasgroup1: http://.*:8099
          extra_params: --o:ssl.enable=false --o:ssl.termination=false --o:user_interface.mode=classic
        options: --cap-add MKNOD --cap-add SYS_ADMIN
    # This job rotates and purges the videoCapture lane's durable Cognito user, so two runs on
    # that user queue rather than overlap.
    concurrency:
      group: behaviour-test-user-${{ needs.names.outputs.environment-name }}-videoCapture
      cancel-in-progress: false
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - name: Setup Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'

      - name: Install dependencies
        # No --ignore-scripts here (unlike the behaviour-test workflows): ffmpeg-static's own
        # postinstall must run to download its ffmpeg binary. PLAYWRIGHT_SKIP_BROWSER_DOWNLOAD
        # still stops @playwright/test re-downloading browsers the container already has.
        run: npm ci
        env:
          PLAYWRIGHT_SKIP_BROWSER_DOWNLOAD: 1

      - name: Install Playwright browsers
        run: npx playwright install chromium --with-deps

      - name: Read scene script auth mode
        id: script-auth
        run: |
          AUTH=$(node -p "require('./videos/${{ needs.params.outputs.script }}.json').auth")
          echo "auth=${AUTH}" | tee -a "$GITHUB_OUTPUT"

      - name: Configure AWS role via GitHub OIDC (for native auth / test user)
        if: ${{ steps.script-auth.outputs.auth == 'user' }}
        uses: aws-actions/configure-aws-credentials@e1253824e5c10ff9df46874f81ed3ec929e19cfd # v6
        with:
          role-to-assume: ${{ vars.SUBMIT_ACTIONS_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}
          role-chaining: false
          audience: sts.amazonaws.com
          role-skip-session-tagging: true
          output-credentials: true
          retry-max-attempts: 3

      - name: Assume AWS deployment role (for native auth / test user)
        if: ${{ steps.script-auth.outputs.auth == 'user' }}
        uses: aws-actions/configure-aws-credentials@e1253824e5c10ff9df46874f81ed3ec929e19cfd # v6
        with:
          role-to-assume: ${{ vars.SUBMIT_DEPLOY_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}
          role-chaining: true
          audience: sts.amazonaws.com
          role-skip-session-tagging: true
          output-credentials: true
          retry-max-attempts: 3

      - name: Wait for older ci deploy runs to finish
        if: ${{ steps.script-auth.outputs.auth == 'user' && needs.names.outputs.environment-name != 'prod' }}
        uses: './.github/actions/wait-for-ci-deploys'
        with:
          github-token: ${{ github.token }}

      - name: Enable native auth on Cognito Hosted UI
        if: ${{ steps.script-auth.outputs.auth == 'user' }}
        uses: './.github/actions/hold-native-auth'
        with:
          mode: enable
          environment-name: ${{ needs.names.outputs.environment-name }}
          holder-id: ${{ github.run_id }}
          run-id: ${{ github.run_id }}
          workflow: ${{ github.workflow }}
          github-token: ${{ github.token }}

      - name: Ensure Cognito test user
        id: cognito-test-user
        if: ${{ steps.script-auth.outputs.auth == 'user' }}
        run: node scripts/ensure-cognito-test-user.js "${{ needs.names.outputs.environment-name }}" videoCapture

      - name: Configure AWS role via GitHub OIDC (for the capture)
        uses: aws-actions/configure-aws-credentials@e1253824e5c10ff9df46874f81ed3ec929e19cfd # v6
        with:
          role-to-assume: ${{ vars.SUBMIT_ACTIONS_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}
          role-chaining: false
          audience: sts.amazonaws.com
          role-skip-session-tagging: true
          output-credentials: true
          retry-max-attempts: 3

      - name: Assume AWS deployment role (for the capture)
        uses: aws-actions/configure-aws-credentials@e1253824e5c10ff9df46874f81ed3ec929e19cfd # v6
        with:
          role-to-assume: ${{ vars.SUBMIT_DEPLOY_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}
          role-chaining: true
          audience: sts.amazonaws.com
          role-skip-session-tagging: true
          output-credentials: true
          retry-max-attempts: 3

      - name: 'Record ${{ needs.params.outputs.script }}'
        run: |
          node scripts/site-video-capture.js \
            --script "videos/${{ needs.params.outputs.script }}.json" \
            --out "target/videos/${{ needs.params.outputs.script }}"
        env:
          # Always the environment's apex/public URL, never a deployment's own subdomain:
          # Cognito's registered redirect_uri is the apex, so sign-in only completes there.
          # The names job fails the run before this step if an explicit deployment-name input
          # is not the environment's last-known-good, so by this point the apex is guaranteed
          # to serve whichever deployment is being recorded. A localApp script supplies its own.
          DIY_SUBMIT_BASE_URL: ${{ needs.script-meta.outputs.has-local-app == 'true' && '' || needs.names.outputs.public-url }}
          # The workbook video's Collabora service container; the host starts no container of its own when this is set.
          COLLABORA_URL: ${{ needs.params.outputs.script == 'accounting-spreadsheet-profit' && 'http://collabora:9980' || '' }}
          HMRC_ACCOUNT: synthetic
          # HMRC_SANDBOX_CLIENT_ID is a test application credential - not a production secret
          HMRC_SANDBOX_CLIENT_ID: 'uqMHA6RsDGGa7h8EG2VqfqAmv4tV'
          HMRC_SANDBOX_CLIENT_SECRET: ${{ secrets.HMRC_SANDBOX_CLIENT_SECRET }}
          # The Companies House scripts sign in to the real Companies House sandbox on ci.
          COMPANIES_HOUSE_SANDBOX_API_KEY: ${{ secrets.COMPANIES_HOUSE_SANDBOX_API_KEY }}
          TEST_COMPANIES_HOUSE_USER_ID: ${{ vars.TEST_COMPANIES_HOUSE_USER_ID }}
          TEST_COMPANIES_HOUSE_PASSWORD: ${{ secrets.TEST_COMPANIES_HOUSE_PASSWORD }}
          TEST_COMPANIES_HOUSE_TOTP_SECRET: ${{ secrets.TEST_COMPANIES_HOUSE_TOTP_SECRET }}
          TEST_AUTH_PROVIDER: cognito-native
          TEST_AUTH_USERNAME: ${{ steps.cognito-test-user.outputs.test-auth-username }}
          TEST_AUTH_PASSWORD: ${{ steps.cognito-test-user.outputs.test-auth-password }}
          TEST_AUTH_TOTP_SECRET: ${{ steps.cognito-test-user.outputs.test-auth-totp-secret }}

      - name: Check video timings
        run: node scripts/check-video-timings.js "target/videos/${{ needs.params.outputs.script }}/${{ needs.params.outputs.script }}.timeline.json"

      - name: Configure AWS role via GitHub OIDC (for native auth cleanup)
        if: ${{ !cancelled() && steps.script-auth.outputs.auth == 'user' && needs.params.outputs.skip-native-auth-disable != 'true' }}
        uses: aws-actions/configure-aws-credentials@e1253824e5c10ff9df46874f81ed3ec929e19cfd # v6
        with:
          role-to-assume: ${{ vars.SUBMIT_ACTIONS_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}
          role-chaining: false
          audience: sts.amazonaws.com
          role-skip-session-tagging: true
          output-credentials: true
          retry-max-attempts: 3

      - name: Assume AWS deployment role (for native auth cleanup)
        if: ${{ !cancelled() && steps.script-auth.outputs.auth == 'user' && needs.params.outputs.skip-native-auth-disable != 'true' }}
        uses: aws-actions/configure-aws-credentials@e1253824e5c10ff9df46874f81ed3ec929e19cfd # v6
        with:
          role-to-assume: ${{ vars.SUBMIT_DEPLOY_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}
          role-chaining: true
          audience: sts.amazonaws.com
          role-skip-session-tagging: true
          output-credentials: true
          retry-max-attempts: 3

      - name: Disable native auth on Cognito Hosted UI
        if: ${{ !cancelled() && steps.script-auth.outputs.auth == 'user' && needs.params.outputs.skip-native-auth-disable != 'true' }}
        uses: './.github/actions/hold-native-auth'
        with:
          mode: disable
          environment-name: ${{ needs.names.outputs.environment-name }}
          holder-id: ${{ github.run_id }}
          run-id: ${{ github.run_id }}
          workflow: ${{ github.workflow }}
          github-token: ${{ github.token }}

      - name: List artefacts
        if: ${{ !cancelled() }}
        run: find "target/videos/${{ needs.params.outputs.script }}" -type f -exec ls -l {} \;

      - name: Upload artifacts
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: 'video-${{ needs.params.outputs.script }}-${{ needs.names.outputs.environment-name }}'
          retention-days: 30
          path: |
            target/videos/${{ needs.params.outputs.script }}/
