name: alarm-remedy-close
run-name: "close resolved alarm issues"

# Closes an [ALARM] issue only when every one of scripts/close-alarm-issue-when-ok.mjs's own
# checks passes: the issue was authored by the alarm pipeline's own App identity
# (diyaccounting-ops[bot]), its claimed alarm transition re-verifies against CloudWatch's own
# history, and its family's remedy row says the family is allowed to close itself. This job only
# narrows which issues that script is asked about, to the ones alarm-triage.yml already labelled
# remedy:*; the script re-derives everything it needs from the issue itself and never trusts the
# label alone.

on:
  schedule:
    - cron: '17 * * * *'
  workflow_dispatch: {}

permissions:
  id-token: write
  issues: write

concurrency:
  group: alarm-remedy-close
  cancel-in-progress: false

env:
  NODE_VERSION: '24'
  AWS_REGION: 'eu-west-2'
  # The one place this number is written, same convention as alarm-triage.yml's own budget.
  CLOSE_BUDGET_PER_DAY: '24'

jobs:
  close:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    environment: prod
    steps:
      - name: Stop once ${{ env.CLOSE_BUDGET_PER_DAY }} close runs have already posted a result today
        id: budget-guard
        uses: ./.github/actions/agent-run-budget
        with:
          workflow-file: alarm-remedy-close.yml
          job-name: close
          step-name: Close the issues that qualify
          budget: ${{ env.CLOSE_BUDGET_PER_DAY }}

      - name: Checkout
        if: steps.budget-guard.outputs.over-budget == 'false'
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Set up Node
        if: steps.budget-guard.outputs.over-budget == 'false'
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: ${{ env.NODE_VERSION }}

      - name: Configure AWS role via GitHub OIDC
        if: steps.budget-guard.outputs.over-budget == 'false'
        uses: aws-actions/configure-aws-credentials@e1253824e5c10ff9df46874f81ed3ec929e19cfd # v6
        with:
          role-to-assume: ${{ vars.SUBMIT_ACTIONS_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}
          role-chaining: false
          audience: sts.amazonaws.com
          role-skip-session-tagging: true
          output-credentials: true
          retry-max-attempts: 3

      # Same read-only role alarm-triage.yml assumes for its own CloudWatch reads: this job never
      # writes to AWS, only describe-alarms and describe-alarm-history.
      - name: Assume the read-only alarm triage role
        if: steps.budget-guard.outputs.over-budget == 'false'
        uses: aws-actions/configure-aws-credentials@e1253824e5c10ff9df46874f81ed3ec929e19cfd # v6
        with:
          role-to-assume: ${{ vars.SUBMIT_ALARM_TRIAGE_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}
          role-chaining: true
          audience: sts.amazonaws.com
          role-skip-session-tagging: true
          output-credentials: true
          retry-max-attempts: 3

      - name: Stop when the agent kill switch is on
        if: steps.budget-guard.outputs.over-budget == 'false'
        uses: ./.github/actions/agent-kill-switch
        with:
          environment-name: prod

      - name: Install dependencies
        if: steps.budget-guard.outputs.over-budget == 'false'
        run: timeout 120 npm ci --prefer-offline || { sleep 30; timeout 180 npm ci; }

      - name: Generate a token for diya-agent
        if: steps.budget-guard.outputs.over-budget == 'false'
        id: app-token
        uses: actions/create-github-app-token@fee1f7d63c2ff003460e3d139729b119787bc349 # v2.2.2
        with:
          app-id: ${{ vars.AGENT_APP_ID }}
          private-key: ${{ secrets.AGENT_APP_PRIVATE_KEY }}

      # Narrows to issues alarm-triage.yml already decided had a remedy; the script re-checks
      # author, origin and the remedy row itself, so this filter is a courtesy, not the gate.
      - name: Close the issues that qualify
        if: steps.budget-guard.outputs.over-budget == 'false'
        env:
          GH_TOKEN: ${{ steps.app-token.outputs.token }}
        run: |
          set -euo pipefail
          ISSUE_NUMBERS=$(gh issue list --repo "${{ github.repository }}" --label alarm --state open --json number,labels \
            --jq '.[] | select(.labels | any(.name | startswith("remedy:"))) | .number')
          if [ -z "${ISSUE_NUMBERS}" ]; then
            echo "no open alarm issue carries a remedy:* label"
            exit 0
          fi
          for ISSUE_NUMBER in ${ISSUE_NUMBERS}; do
            echo "checking issue #${ISSUE_NUMBER}"
            node scripts/close-alarm-issue-when-ok.mjs --issue-number "${ISSUE_NUMBER}" --repo "${{ github.repository }}" || true
          done
