# @capability OPS-197 Measure triage accuracy against the amount of injected context
# - **Use when:** you need to know how the accuracy of the support triage answer changes with the amount of page text in the request, or whether retrieval of snippets does as well as all the pages.
# - **Does:** support-context-experiment.yml splits faqs.toml, help.html and guide.html into snippets with front matter. For each size and model, scripts/support-context-experiment.mjs runs the 30 triage fixtures through the answer, the check and one repair call. Titan embeds each snippet once and the ticket summary, and cosine similarity picks the top snippets. The job prints one row for each size and model: accuracy, safety fixtures, tokens and seconds. It runs on dispatch only. Every fixture is synthetic.
# - **Run:** `gh workflow run support-context-experiment.yml -f models=amazon.nova-pro-v1:0 -f sizes=0,4,8,16,36,top3,top6,top12 -f runs=3`
# - **Entry:** `scripts/support-context-experiment.mjs:runExperiment`
# - **Files:** .github/workflows/support-context-experiment.yml, scripts/support-context-experiment.mjs, scripts/support-snippets.mjs, scripts/support-retrieval.mjs, app/unit-tests/scripts/supportContextExperiment.test.js, app/unit-tests/scripts/supportSnippets.test.js
# - **Keywords:** context size, retrieval, embeddings, titan, snippets, front matter, accuracy curve, nova
# - **Related:** OPS-155, OPS-194
# @end-capability

name: support-context-experiment
run-name: support context experiment

# The fixtures hold invented tickets only. The job prints figures and no ticket text. It runs in
# the ci environment and chains into the alarm triage role, the same role support-replay.yml
# uses, which holds Bedrock invoke on the pinned models and the embedding model.

on:
  workflow_dispatch:
    inputs:
      models:
        description: 'Comma-separated Bedrock model ids that answer, check and repair'
        type: string
        default: 'amazon.nova-pro-v1:0'
      sizes:
        description: 'Comma-separated sizes: kilobytes of page text (36 is the three raw files) or topN snippets'
        type: string
        default: '0,4,8,16,36,top3,top6,top12'
      runs:
        description: 'Runs of the 30 fixtures at each size and model'
        type: string
        default: '3'
      reasoning-effort:
        description: 'Nova 2 reasoning effort: low, medium or high; off leaves reasoning off'
        type: choice
        options: ['off', low, medium, high]
        default: 'off'

permissions: {}

concurrency:
  group: support-context-experiment-${{ github.ref }}
  cancel-in-progress: true

env:
  AWS_REGION: 'eu-west-2'

jobs:
  experiment:
    runs-on: ubuntu-24.04
    timeout-minutes: 360
    environment: ci
    permissions:
      id-token: write
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      - name: Set up the toolchain
        uses: ./.github/actions/setup-toolchain
        with:
          npm-install: scripts
          npm-cache: 'false'

      - name: Assume the AWS actions and deployment roles
        uses: ./.github/actions/aws-role
        with:
          actions-role-arn: ${{ vars.SUBMIT_ACTIONS_ROLE_ARN }}
          deploy-role-arn: ${{ vars.SUBMIT_ALARM_TRIAGE_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Stop when the agent kill switch is on
        uses: ./.github/actions/agent-kill-switch
        with:
          environment-name: ci

      - name: Run the experiment
        shell: bash
        env:
          MODELS: ${{ inputs.models }}
          SIZES: ${{ inputs.sizes }}
          RUNS: ${{ inputs.runs }}
          REASONING_EFFORT: ${{ inputs.reasoning-effort != 'off' && inputs.reasoning-effort || '' }}
        run: |
          set -euo pipefail
          ARGS=(--models "$MODELS" --sizes "$SIZES" --runs "$RUNS" --out /tmp/support-context-rows.json)
          if [ -n "$REASONING_EFFORT" ]; then ARGS+=(--reasoning-effort "$REASONING_EFFORT"); fi
          node scripts/support-context-experiment.mjs "${ARGS[@]}" | tee -a "$GITHUB_STEP_SUMMARY"

      - name: Upload the rows
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: support-context-rows
          path: /tmp/support-context-rows.json
          if-no-files-found: ignore
          retention-days: 30
