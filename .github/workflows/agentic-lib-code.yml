name: agentic-lib-code

run-name: "do next (${{ inputs.minutes || '10' }} min budget)"

# One unattended agent, one small task, a hard time budget.
#
# Finished work lands as a branch and a pull request, like any other work. Unfinished work - out of
# time, or nothing suitable to start - lands as a patch file and a written handover in the run's
# artifacts, and pushes nothing at all. The split is the design: a completed task should be
# reviewable, and a half-finished one must not litter the history with no-op commits or the review
# queue with something nobody can judge. A later run reads the artifacts of earlier incomplete runs
# and decides for itself whether any is worth resuming, so a task too big for one budget can still
# finish across a chain of them - and each run records what it resumed, so the chain is visible.
#
# Schedule is deliberately absent for this first drop. Prove it by hand first.
on:
  workflow_dispatch:
    inputs:
      minutes:
        description: 'Working budget in minutes (the agent stops and writes its handover at this point)'
        type: string
        required: true
        default: '10'
      resume-from:
        description: 'Run id to resume (blank = let the agent decide from the last 7 days)'
        type: string
        required: false
      task-hint:
        description: 'Optional nudge toward a board item. Blank = the agent picks the simplest ready task.'
        type: string
        required: false
  # schedule:
  #   # Once the hand-run version has proven itself. Off the hour, and sparse: each run is a model
  #   # run, and the board is not a queue that needs draining every fifteen minutes.
  #   - cron: '43 */4 * * *'

# One at a time. Two unattended agents picking "the simplest ready task" at the same moment pick
# the same one and produce two patches for one item.
concurrency:
  group: agentic-lib-code
  cancel-in-progress: false

permissions:
  id-token: write # OIDC for Bedrock
  contents: read
  actions: read # to list and download the artifacts of earlier runs

env:
  NODE_VERSION: '24'
  AWS_REGION: 'eu-west-2'
  CLAUDE_CODE_VERSION: '2.0.30'
  OUT_DIR: '/tmp/do-next-out'

jobs:
  do-next:
    name: 'do next'
    runs-on: ubuntu-24.04
    # `ci`, not `prod`: the agent works against the ci deployment and reads ci logs, and
    # `vars.SUBMIT_ACTIONS_ROLE_ARN` resolves only inside a GitHub environment (it is not a
    # repository-level variable) - a job with no `environment:` reads it as empty.
    environment: ci
    # The agent's own budget plus room for setup, the handover write-up and artifact upload. The
    # agent is told to stop at `minutes`; this is the backstop if it does not.
    timeout-minutes: 30
    steps:
      - name: Require an agent token
        env:
          AGENT_TOKEN: ${{ secrets.AGENT_TOKEN }}
        run: |
          set -euo pipefail
          if [ -z "${AGENT_TOKEN}" ]; then
            echo "::error::AGENT_TOKEN is not set. A finished task is pushed as a branch and raised"
            echo "::error::as a PR, and GITHUB_TOKEN's push would not trigger the branch's checks,"
            echo "::error::so the PR would sit with nothing having run against it."
            exit 1
          fi
          echo "Agent token present."

      # This agent reads NEXT.md, CLAUDE.md and the skills to decide what to do; those must be the
      # merged versions, not anything a branch proposes.
      # Read from the default branch, and keep credentials: a finished task is pushed as a branch
      # from this checkout by the "Land a complete run as a pull request" step below, never by the
      # agent, which has no push tool. The branch is always new and always `claude/*`.
      - name: Checkout the default branch
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ github.event.repository.default_branch }}
          fetch-depth: 0
          token: ${{ secrets.AGENT_TOKEN || github.token }}

      # The agent commits its own work (`git commit` is in its allow-list) but has no push tool
      # and no `git config` tool, so this identity has to exist before it runs or every commit
      # fails with "Please tell me who you are". "Claude <noreply@anthropic.com>" is the same
      # identity every commit's `Co-Authored-By` trailer already names.
      - name: Configure the commit identity
        run: |
          set -euo pipefail
          git config user.name "Claude"
          git config user.email "noreply@anthropic.com"

      - name: Set up Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: ${{ env.NODE_VERSION }}

      - name: Configure AWS role via GitHub OIDC
        uses: aws-actions/configure-aws-credentials@e1253824e5c10ff9df46874f81ed3ec929e19cfd # v6
        with:
          role-to-assume: ${{ vars.SUBMIT_ACTIONS_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}
          role-chaining: false
          audience: sts.amazonaws.com
          role-skip-session-tagging: true
          output-credentials: true
          retry-max-attempts: 3

      # The actions role above has no bedrock:InvokeModel - only the alarm-triage role does
      # (ObservabilityStack.java) - so the agent below, which runs on Bedrock, needs this chain
      # exactly as alarm-triage.yml does.
      - name: Assume the read-only alarm triage role
        uses: aws-actions/configure-aws-credentials@e1253824e5c10ff9df46874f81ed3ec929e19cfd # v6
        with:
          role-to-assume: ${{ vars.SUBMIT_ALARM_TRIAGE_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}
          role-chaining: true
          audience: sts.amazonaws.com
          role-skip-session-tagging: true
          output-credentials: true
          retry-max-attempts: 3

      # This job's environment is ci, so the switch it reads is ci's; one flag per account is the
      # model, and a prod-facing agent path reads the prod flag from a job carrying that
      # environment instead.
      - name: Stop when the agent kill switch is on
        id: kill-switch
        uses: ./.github/actions/agent-kill-switch
        with:
          environment-name: ci

      - name: Install dependencies
        run: timeout 120 npm ci --prefer-offline || { sleep 30; timeout 180 npm ci; }

      - name: Install Claude Code
        run: npm install -g "@anthropic-ai/claude-code@${CLAUDE_CODE_VERSION}"

      # Pull down what earlier incomplete runs left behind, so the agent can read them as files
      # rather than spending its budget on API calls. It still decides which, if any, to resume.
      - name: Collect the artifacts of recent incomplete runs
        env:
          GH_TOKEN: ${{ github.token }}
          RESUME_FROM: ${{ inputs.resume-from }}
        run: |
          set -euo pipefail
          mkdir -p "${OUT_DIR}/prior"
          since=$(date -u -d '7 days ago' +%Y-%m-%dT%H:%M:%SZ 2>/dev/null || date -u -v-7d +%Y-%m-%dT%H:%M:%SZ)
          if [ -n "${RESUME_FROM}" ]; then
            ids="${RESUME_FROM}"
          else
            ids=$(gh run list --workflow agentic-lib-code.yml --limit 40 \
                    --json databaseId,conclusion,createdAt \
                    --jq "[.[] | select(.createdAt > \"$since\") | select(.conclusion != \"success\" and .conclusion != null)] | .[0:6] | .[].databaseId")
          fi
          echo "candidate runs: ${ids:-none}"
          for id in ${ids}; do
            gh run download "$id" --dir "${OUT_DIR}/prior/$id" 2>/dev/null \
              && echo "  downloaded $id" \
              || echo "  $id had no artifacts"
          done
          find "${OUT_DIR}/prior" -name CHANGES.md | head -20

      # So the pull-request step below can tell what the agent actually added, regardless of
      # whether it committed, only edited files, or did both.
      - name: Record the tree before the agent runs
        id: before
        run: echo "sha=$(git rev-parse HEAD)" | tee -a "$GITHUB_OUTPUT"

      - name: Run the agent
        id: run
        env:
          CLAUDE_CODE_USE_BEDROCK: '1'
          AWS_REGION: ${{ env.AWS_REGION }}
          ANTHROPIC_MODEL: 'eu.anthropic.claude-sonnet-4-5-20250929-v1:0'
          ANTHROPIC_SMALL_FAST_MODEL: 'eu.anthropic.claude-haiku-4-5-20251001-v1:0'
          CLAUDE_CODE_MAX_OUTPUT_TOKENS: '16384'
          DISABLE_TELEMETRY: '1'
          DISABLE_ERROR_REPORTING: '1'
          DISABLE_AUTOUPDATER: '1'
          # This token can push and open a PR, but the agent's allow-list only grants it read-only
          # gh use here (run list/view, pr list); push and `gh pr create` happen in the "Land a
          # complete run as a pull request" step below instead. Merging is /auto-merge's job on a
          # different token again, so an agent that writes code cannot also approve its own work
          # into main.
          GH_TOKEN: ${{ secrets.AGENT_TOKEN }}
          RUN_ID: ${{ github.run_id }}
          RUN_URL: '${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}'
          TASK_HINT: ${{ inputs.task-hint }}
        run: |
          set -o pipefail
          mkdir -p "${OUT_DIR}/notes"
          MINUTES='${{ inputs.minutes }}'
          export DEADLINE_UTC=$(date -u -d "+${MINUTES} minutes" +%Y-%m-%dT%H:%M:%SZ 2>/dev/null \
                                || date -u -v+${MINUTES}M +%Y-%m-%dT%H:%M:%SZ)
          export RUN_ID RUN_URL OUT_DIR
          echo "deadline: ${DEADLINE_UTC}"

          PROMPT=$(envsubst < prompts/do-next-ci.md)
          if [ -n "${TASK_HINT}" ]; then
            PROMPT="${PROMPT}

          ## Operator hint for this run

          ${TASK_HINT}

          Treat this as a steer toward a task, not as permission to skip the checks above. If main
          is red, main still wins. If the hinted task is blocked, owned by the operator, or already
          has a branch on origin, say so and pick by the normal rule instead."
          fi

          # It may commit; it may not push, branch, open a PR, merge one, or touch git identity -
          # this step already set that up, and the workflow steps after this one push and open
          # the PR when CHANGES.md says the work is complete. The allow-list is the enforcement;
          # the brief is only the reasoning.
          claude -p "$PROMPT" \
            --max-turns 80 \
            --output-format json \
            --permission-mode default \
            --disallowedTools "Bash(git push:*),Bash(git checkout:*),Bash(git config:*),Bash(gh pr create:*),Bash(gh pr merge:*),Bash(gh workflow run:*)" \
            --allowedTools "Read,Grep,Glob,Edit,Write,Bash(git status:*),Bash(git diff:*),Bash(git log:*),Bash(git add:*),Bash(git commit:*),Bash(git apply:*),Bash(git ls-remote:*),Bash(git show:*),Bash(git rev-parse:*),Bash(git branch:*),Bash(npm test:*),Bash(npm run:*),Bash(npx vitest:*),Bash(npx prettier:*),Bash(./mvnw:*),Bash(gh run list:*),Bash(gh run view:*),Bash(gh pr list:*),Bash(date:*),Bash(cat:*),Bash(ls:*),Bash(find:*)" \
            2>&1 | tee "${OUT_DIR}/claude-output.json"

      # When the agent reports it finished, land the work exactly as a terminal session would: a
      # branch, a push, and a pull request. The agent has no push or `gh pr create` tool (see the
      # allow-list above), so this step does that on its behalf, only when CHANGES.md's one exact
      # marker line says so.
      # An agent that wrote its handover somewhere in the checkout instead of OUT_DIR still
      # wrote one: move it out before the landing step reads it, so a complete run lands and the
      # handover stays out of the patch; drop any patch it wrote there too, since the capture
      # step's diff is the patch.
      - name: Move a handover left in the checkout into the output directory
        if: always() && steps.run.outcome != 'skipped'
        run: |
          set -euo pipefail
          mkdir -p "${OUT_DIR}"
          git add -A 2>/dev/null || true
          if [ ! -s "${OUT_DIR}/CHANGES.md" ]; then
            stray=$(git diff --cached --name-only --diff-filter=A | grep -E '(^|/)CHANGES\.md$' | head -1 || true)
            if [ -n "${stray}" ]; then
              git reset -q -- "${stray}" 2>/dev/null || true
              mv "${stray}" "${OUT_DIR}/CHANGES.md"
            fi
          fi
          if [ ! -s "${OUT_DIR}/PR.md" ]; then
            straypr=$(git diff --cached --name-only --diff-filter=A | grep -E '(^|/)PR\.md$' | head -1 || true)
            if [ -n "${straypr}" ]; then
              git reset -q -- "${straypr}" 2>/dev/null || true
              mv "${straypr}" "${OUT_DIR}/PR.md"
            fi
          fi
          for straypatch in $(git diff --cached --name-only --diff-filter=A | grep -E '(^|/)work\.patch$' || true); do
            git reset -q -- "${straypatch}" 2>/dev/null || true
            rm -f "${straypatch}"
          done

      - name: Prepare a complete run's branch and pull request body
        if: always() && steps.run.outcome != 'skipped'
        id: prepare-pr
        env:
          GH_TOKEN: ${{ secrets.AGENT_TOKEN }}
        run: |
          set -euo pipefail
          if [ ! -s "${OUT_DIR}/CHANGES.md" ] || ! grep -qxF '- **Status**: complete' "${OUT_DIR}/CHANGES.md"; then
            echo "not a complete run, nothing to land"
            echo "ready=false" | tee -a "$GITHUB_OUTPUT"
            exit 0
          fi
          BRANCH=$(grep -m1 '^- \*\*Branch\*\*: ' "${OUT_DIR}/CHANGES.md" | sed 's/^- \*\*Branch\*\*: *//')
          if [ -z "${BRANCH}" ]; then
            echo "::error::Status is complete but CHANGES.md has no Branch line"
            exit 1
          fi
          if [ ! -s "${OUT_DIR}/PR.md" ]; then
            echo "::error::Status is complete but ${OUT_DIR}/PR.md is missing"
            exit 1
          fi

          git checkout -b "${BRANCH}"

          # The agent commits its own work; this only covers the case where it edited files and
          # forgot to. A commit made here has no narrative to draw on beyond the PR title.
          if ! git diff --quiet || ! git diff --cached --quiet; then
            git add -A
            git commit -m "$(head -1 "${OUT_DIR}/PR.md" | sed 's/^# *//')"
          fi

          if [ "$(git rev-parse HEAD)" = "${{ steps.before.outputs.sha }}" ]; then
            echo "::error::Status is complete but nothing was committed or changed"
            exit 1
          fi

          git push origin "${BRANCH}"

          head -1 "${OUT_DIR}/PR.md" | sed 's/^# *//' > "${OUT_DIR}/pr-title.txt"
          tail -n +2 "${OUT_DIR}/PR.md" > "${OUT_DIR}/pr-body.md"
          echo "ready=true" | tee -a "$GITHUB_OUTPUT"
          echo "branch=${BRANCH}" | tee -a "$GITHUB_OUTPUT"

      # The agent's own prose becomes a public PR body with nobody reviewing it first, so it
      # gets the same redaction and guardrail pass alarm-triage.yml gives its issue comments,
      # even though this path never touches Bedrock's answer text directly.
      - name: Filter the pull request body
        if: always() && steps.prepare-pr.outputs.ready == 'true'
        id: publish-filter
        uses: ./.github/actions/publish-filter
        with:
          input-file: ${{ env.OUT_DIR }}/pr-body.md
          format: markdown
          environment-name: ci
          model-id: 'eu.anthropic.claude-sonnet-4-5-20250929-v1:0'
          workflow-name: ${{ github.workflow }}
          run-number: ${{ github.run_number }}
          run-url: '${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}'

      - name: Open the pull request
        if: always() && steps.prepare-pr.outputs.ready == 'true'
        id: open-pr
        env:
          GH_TOKEN: ${{ secrets.AGENT_TOKEN }}
        run: |
          set -euo pipefail
          PR_URL=$(gh pr create --repo "${{ github.repository }}" \
                     --base "${{ github.event.repository.default_branch }}" \
                     --head "${{ steps.prepare-pr.outputs.branch }}" \
                     --title "$(cat "${OUT_DIR}/pr-title.txt")" \
                     --body-file "${{ steps.publish-filter.outputs.output-file }}")
          echo "- **PR**: ${PR_URL}" >> "${OUT_DIR}/CHANGES.md"
          echo "url=${PR_URL}" | tee -a "$GITHUB_OUTPUT"

      # origin:unattended-agent says a model ran this with nobody watching. Applied here, outside
      # the agent's own tool calls, so it lands whether or not the agent remembered to ask for it.
      # Uses the "add labels" endpoint rather than `gh pr create --label`, which requires the
      # label to already exist: this endpoint creates it on first use (see alarm-triage.yml,
      # REPORT_IDENTITY_AUDIT.md section 8 recommendation 6).
      - name: Label any PR this run opened
        if: always() && steps.run.outcome != 'skipped'
        env:
          GH_TOKEN: ${{ secrets.AGENT_TOKEN }}
        run: |
          set -euo pipefail
          BRANCH=$(git branch --show-current)
          if [ -z "${BRANCH}" ] || [ "${BRANCH}" = "main" ]; then
            echo "no claude/* branch checked out, nothing to label"
            exit 0
          fi
          PR_NUMBER=$(gh pr list --head "${BRANCH}" --json number --jq '.[0].number' || true)
          if [ -z "${PR_NUMBER}" ]; then
            echo "no PR found for branch ${BRANCH}, nothing to label"
            exit 0
          fi
          gh api "repos/${{ github.repository }}/issues/${PR_NUMBER}/labels" -f "labels[]=origin:unattended-agent"

      # Whatever the agent did or failed to do, capture the diff. A run that produced nothing still
      # produces an empty patch and a handover explaining why, which is a usable result.
      - name: Capture the patch
        if: always()
        run: |
          set -euo pipefail
          mkdir -p "${OUT_DIR}"
          git add -A 2>/dev/null || true
          # Diff the index against the pre-agent commit, not against HEAD: an agent that committed
          # its own work (now possible - the identity step above lets `git commit` succeed) moves
          # HEAD, and `git diff --cached` alone would then show nothing, silently losing a
          # handover's committed-but-unpushed work from the one record a later run can read.
          git diff --cached "${{ steps.before.outputs.sha }}" > "${OUT_DIR}/work.patch" 2>/dev/null || : > "${OUT_DIR}/work.patch"
          echo "patch bytes: $(wc -c < "${OUT_DIR}/work.patch")"
          if [ ! -s "${OUT_DIR}/CHANGES.md" ]; then
            {
              echo "# do-next run ${{ github.run_id }}"
              echo
              echo "- **Run**: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}"
              echo "- **Resumed-From**: unknown — the agent did not write a handover"
              echo
              echo "The agent produced no CHANGES.md. It ran out of budget, was cut off, or failed"
              echo "before writing one. The patch beside this file is whatever it had changed."
              echo "Treat this run as unresumable unless the patch itself reads as a coherent start."
            } > "${OUT_DIR}/CHANGES.md"
          fi

      - name: Summarise
        if: always()
        run: |
          set -euo pipefail
          { echo "## do next"; echo; } >> "$GITHUB_STEP_SUMMARY"
          if [ -s "${OUT_DIR}/CHANGES.md" ]; then cat "${OUT_DIR}/CHANGES.md" >> "$GITHUB_STEP_SUMMARY"; fi
          echo >> "$GITHUB_STEP_SUMMARY"
          echo "Patch: $(wc -c < "${OUT_DIR}/work.patch") bytes." >> "$GITHUB_STEP_SUMMARY"
          # A run that opened a PR has landed its work; the patch is then only a record.
          if grep -qiE '^- \*\*(PR|Pull request)\*\*:' "${OUT_DIR}/CHANGES.md" 2>/dev/null; then
            echo "This run opened a pull request - the patch above is a record, not work to resume." >> "$GITHUB_STEP_SUMMARY"
          fi

      # Agent-run ledger row for the one-stop dashboard (v_agent_runs_daily): one row per run,
      # recording whether this path landed a pull request, so the posted rate reads from data
      # rather than from the artifact list. AWS credentials for this write are assumed
      # unconditionally near the top of this job, so - unlike the alarm workflows - every outcome
      # below is always reachable.
      - name: Determine the outcome for the ledger
        if: always()
        id: ledger-outcome
        run: |
          set -euo pipefail
          if [ "${{ steps.kill-switch.conclusion }}" = "failure" ]; then
            OUTCOME=skipped-kill-switch
          elif [ "${{ steps.run.conclusion }}" = "failure" ]; then
            OUTCOME=no-answer
          elif [ -s "${OUT_DIR}/claude-output.json" ] && jq -e '.subtype == "error_max_turns"' "${OUT_DIR}/claude-output.json" > /dev/null 2>&1; then
            OUTCOME=max-turns
          elif [ "${{ steps.prepare-pr.outputs.ready }}" = "true" ]; then
            OUTCOME=posted
          else
            OUTCOME=no-action
          fi
          echo "outcome=${OUTCOME}" | tee -a "$GITHUB_OUTPUT"

      - name: Build the agent-run row
        if: always()
        id: agent-run-row
        env:
          GH_TOKEN: ${{ github.token }}
          ROW_RUN_ID: ${{ github.run_id }}
          ROW_OUTCOME: ${{ steps.ledger-outcome.outputs.outcome }}
          ROW_REDACTIONS: ${{ steps.publish-filter.outputs.redactions }}
          ROW_GUARDRAIL_ACTION: ${{ steps.publish-filter.outputs.guardrail-action }}
          ROW_PR_URL: ${{ steps.open-pr.outputs.url }}
          ROW_REPOSITORY: ${{ github.repository }}
        run: |
          set -euo pipefail
          STARTED_AT=$(gh api "repos/${ROW_REPOSITORY}/actions/runs/${ROW_RUN_ID}" --jq .run_started_at)
          FINISHED_AT=$(date -u +%FT%TZ)
          DURATION_SECONDS=$(( $(date -u -d "$FINISHED_AT" +%s) - $(date -u -d "$STARTED_AT" +%s) ))
          PR_NUMBER=""
          if [ -n "${ROW_PR_URL}" ]; then PR_NUMBER="${ROW_PR_URL##*/}"; fi

          ROW=$(jq -nc \
            --arg run_id "$ROW_RUN_ID" \
            --arg run_url "${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}" \
            --arg trigger "${{ github.event_name }}" \
            --arg outcome "$ROW_OUTCOME" \
            --arg redactions "${ROW_REDACTIONS:-}" \
            --arg guardrail_action "${ROW_GUARDRAIL_ACTION:-}" \
            --arg pr_number "$PR_NUMBER" \
            --argjson duration_seconds "$DURATION_SECONDS" \
            --arg finished_at "$FINISHED_AT" \
            '{
              workflow: "agentic-lib-code", run_id: $run_id, run_url: $run_url, trigger: $trigger,
              environment: "ci", issue_number: null,
              model_id: "eu.anthropic.claude-sonnet-4-5-20250929-v1:0",
              outcome: $outcome, escalated: false,
              redactions: (if $redactions == "" then null else ($redactions | tonumber) end),
              guardrail_action: (if $guardrail_action == "" then null else $guardrail_action end),
              pr_number: (if $pr_number == "" then null else ($pr_number | tonumber) end),
              duration_seconds: $duration_seconds, finished_at: $finished_at
            }')
          echo "row=$ROW" >> "$GITHUB_OUTPUT"
          echo "key=curated/agent-runs/dt=$(date -u +%F)/${ROW_RUN_ID}-${{ github.run_attempt }}.json" >> "$GITHUB_OUTPUT"

      - name: Write the agent-run row to the lake
        if: always()
        uses: ./.github/actions/dora-row
        with:
          bucket: 'ci-env-analytics-lake-${{ vars.SUBMIT_ACCOUNT_ID }}'
          key: ${{ steps.agent-run-row.outputs.key }}
          row: ${{ steps.agent-run-row.outputs.row }}

      - name: Upload the handover
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: agentic-lib-code-${{ github.run_id }}
          path: |
            ${{ env.OUT_DIR }}/work.patch
            ${{ env.OUT_DIR }}/CHANGES.md
            ${{ env.OUT_DIR }}/claude-output.json
            ${{ env.OUT_DIR }}/notes
          if-no-files-found: warn
          retention-days: 14
