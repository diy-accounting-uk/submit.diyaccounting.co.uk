# @capability DATA-60 Replay one analytics nightly by dispatch
# - **Use when:** a night of the analytics nightly did not run or failed, and it must run again for an explicit date.
# - **Does:** run-nightly.yml validates the date (format, calendar day, not in the future). It chains into the deployment role and starts the environment's analytics-nightly state machine with the input `{"date": "<date>"}`. Every task reads `date` from that input. The job polls the execution for up to 30 minutes and fails unless it ends `SUCCEEDED`. The `prod-env-analytics-nightly-missed` remedy row dispatches it with the day before the alarm fired.
# - **Run:** `gh workflow run run-nightly.yml -f environment-name=prod -f date=YYYY-MM-DD`
# - **Entry:** `.github/workflows/run-nightly.yml:run-nightly`
# - **Files:** .github/workflows/run-nightly.yml, app/data/alarm-remedies.json, .github/workflows/alarm-triage.yml
# - **Keywords:** replay nightly, missed night, backfill, state machine execution, start execution, analytics nightly missed, explicit date
# - **Related:** DATA-22, OPS-18
# @end-capability

name: run-nightly
run-name: "run the ${{ inputs.environment-name }} analytics nightly for ${{ inputs.date }}"

# Starts one execution of the environment's analytics nightly state machine with an explicit
# date and waits for it to end. Every task of the state machine reads `date` from the execution
# input, so this replays a night that did not run or that failed.

on:
  workflow_dispatch:
    inputs:
      environment-name:
        description: 'Environment whose nightly to run'
        required: true
        type: choice
        options:
          - ci
          - prod
      date:
        description: 'Night to run, YYYY-MM-DD (UTC), not in the future'
        required: true
        type: string

permissions:
  id-token: write
  contents: read

concurrency:
  group: run-nightly-${{ inputs.environment-name }}-${{ inputs.date }}
  cancel-in-progress: false

env:
  AWS_REGION: 'eu-west-2'

jobs:
  run-nightly:
    runs-on: ubuntu-24.04
    environment: ${{ inputs.environment-name }}
    timeout-minutes: 40
    steps:
      - name: Validate the date
        env:
          RUN_DATE: ${{ inputs.date }}
        run: |
          set -euo pipefail
          if ! printf '%s' "$RUN_DATE" | grep -Eq '^[0-9]{4}-[0-9]{2}-[0-9]{2}$'; then
            echo "date must be YYYY-MM-DD, got: $RUN_DATE"
            exit 1
          fi
          if ! date -u -d "$RUN_DATE" +%F > /dev/null 2>&1 || [ "$(date -u -d "$RUN_DATE" +%F)" != "$RUN_DATE" ]; then
            echo "date is not a calendar date: $RUN_DATE"
            exit 1
          fi
          TODAY=$(date -u +%F)
          if [[ "$RUN_DATE" > "$TODAY" ]]; then
            echo "date $RUN_DATE is in the future (today is $TODAY UTC)"
            exit 1
          fi

      - name: Configure AWS role via GitHub OIDC
        uses: aws-actions/configure-aws-credentials@e1253824e5c10ff9df46874f81ed3ec929e19cfd # v6
        with:
          role-to-assume: ${{ vars.SUBMIT_ACTIONS_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}
          role-chaining: false
          audience: sts.amazonaws.com
          role-skip-session-tagging: true
          output-credentials: true
          retry-max-attempts: 3

      - name: Assume AWS deployment role
        id: deploy-role
        uses: aws-actions/configure-aws-credentials@e1253824e5c10ff9df46874f81ed3ec929e19cfd # v6
        with:
          role-to-assume: ${{ vars.SUBMIT_DEPLOY_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}
          role-chaining: true
          audience: sts.amazonaws.com
          role-skip-session-tagging: true
          output-credentials: true
          retry-max-attempts: 3

      - name: Start the execution and wait for it to end
        env:
          ENVIRONMENT_NAME: ${{ inputs.environment-name }}
          RUN_DATE: ${{ inputs.date }}
          ACCOUNT_ID: ${{ steps.deploy-role.outputs.aws-account-id }}
        run: |
          set -euo pipefail
          STATE_MACHINE_ARN="arn:aws:states:${AWS_REGION}:${ACCOUNT_ID}:stateMachine:${ENVIRONMENT_NAME}-env-analytics-nightly"
          EXECUTION_NAME="replay-${RUN_DATE}-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}"
          EXECUTION_ARN=$(aws stepfunctions start-execution \
            --region "$AWS_REGION" \
            --state-machine-arn "$STATE_MACHINE_ARN" \
            --name "$EXECUTION_NAME" \
            --input "$(jq -cn --arg date "$RUN_DATE" '{date: $date}')" \
            --query executionArn --output text)
          echo "execution: $EXECUTION_ARN" | tee -a "$GITHUB_STEP_SUMMARY"
          DEADLINE=$((SECONDS + 1800))
          while true; do
            STATUS=$(aws stepfunctions describe-execution --region "$AWS_REGION" \
              --execution-arn "$EXECUTION_ARN" --query status --output text)
            echo "status: $STATUS"
            if [ "$STATUS" != "RUNNING" ]; then break; fi
            if [ "$SECONDS" -ge "$DEADLINE" ]; then
              echo "execution still RUNNING after 30 minutes"
              exit 1
            fi
            sleep 20
          done
          echo "final status: $STATUS" | tee -a "$GITHUB_STEP_SUMMARY"
          [ "$STATUS" = "SUCCEEDED" ]
