# Re-records any product demo video whose pages a prod deploy touched, so a video never sits
# more than one deploy behind the page it shows. Runs after deploy.yml finishes on main, works
# out what changed since the last successful deploy, and dispatches video-capture.yml for every
# scene script (videos/*.json) whose declared "pages" the diff touches, videos/publish.json
# marks "publish": true, and no video-capture.yml run in the last 24 hours already recorded.
# Those last two only gate the automatic deploy trigger: a workflow_dispatch run (a manual
# re-run or a check of a specific range) records every page-touched scene, unfiltered.
#
# The workflow_run event carries only the triggering run's head_sha, not what it deployed
# before, so the base of the diff is the newest earlier successful deploy.yml run on main with a
# different head_sha. workflow_dispatch's head-sha/base-sha inputs bypass that discovery for a
# manual re-run or a check of a specific range. The scripts input skips the diff and records the
# named scripts in turn (npm run video:stale -- --dispatch uses it to re-record stale videos).
name: video-capture-on-deploy
run-name: "record videos touched since the last deploy"

concurrency:
  # video-capture.yml queues same-environment captures but keeps only one pending run per group
  # and drops an older pending one, so this workflow dispatches its scripts one after another and
  # waits for each to finish. Two runs of this workflow dispatching at once would drop captures;
  # queue instead of cancelling: every deploy's set of touched videos still gets recorded, just later.
  group: video-capture-on-deploy
  cancel-in-progress: false

on:
  workflow_run:
    workflows: [deploy]
    types: [completed]
    branches: [main]
  workflow_dispatch:
    inputs:
      head-sha:
        type: string
        description: 'Head commit to diff to (defaults to the triggering deploy run''s head)'
        required: false
        default: ''
      base-sha:
        type: string
        description: 'Base commit to diff from (defaults to the newest earlier successful deploy.yml run on main)'
        required: false
        default: ''
      scripts:
        type: string
        description: 'Space-separated scene scripts to record one after another, instead of diffing (npm run video:stale -- --dispatch sets this)'
        required: false
        default: ''

permissions:
  actions: write
  contents: read

jobs:
  dispatch-touched-videos:
    if: ${{ github.event_name == 'workflow_dispatch' || github.event.workflow_run.conclusion == 'success' }}
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0

      - name: Setup Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: '24'

      - name: Resolve the head and base to diff
        id: range
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          RUN_HEAD_SHA: ${{ github.event.workflow_run.head_sha }}
          RUN_ID: ${{ github.event.workflow_run.id }}
          INPUT_HEAD_SHA: ${{ inputs.head-sha }}
          INPUT_BASE_SHA: ${{ inputs.base-sha }}
          INPUT_SCRIPTS: ${{ inputs.scripts }}
        run: |
          set -euo pipefail
          if [ -n "$INPUT_SCRIPTS" ]; then
            echo "Scripts were named by the dispatch; no diff to resolve."
            echo "head=" | tee -a "$GITHUB_OUTPUT"
            exit 0
          fi
          HEAD="${INPUT_HEAD_SHA:-$RUN_HEAD_SHA}"
          if [ -z "$HEAD" ]; then
            echo "No head sha available (no triggering deploy run and no head-sha input); nothing to record."
            echo "head=" | tee -a "$GITHUB_OUTPUT"
            exit 0
          fi

          # The base is the previous successful deploy whatever its head: a scheduled redeploy
          # of an unchanged main then diffs as empty instead of re-recording every day.
          BASE="$INPUT_BASE_SHA"
          if [ -z "$BASE" ]; then
            TRIGGER_CREATED_AT=""
            if [ -n "$RUN_ID" ]; then
              TRIGGER_CREATED_AT=$(gh api "repos/${REPO}/actions/runs/${RUN_ID}" --jq '.created_at')
            fi
            BASE=$(gh api "repos/${REPO}/actions/workflows/deploy.yml/runs?branch=main&event=push&per_page=100" \
              --jq "[.workflow_runs[] | select(.conclusion == \"success\" and (.id | tostring) != \"${RUN_ID}\" and (\"${TRIGGER_CREATED_AT}\" == \"\" or .created_at < \"${TRIGGER_CREATED_AT}\"))] | sort_by(.created_at) | .[-1].head_sha // empty")
          fi
          if [ -z "$BASE" ]; then
            echo "No earlier successful deploy.yml run on main to diff ${HEAD} against; nothing to record."
            echo "head=" | tee -a "$GITHUB_OUTPUT"
            exit 0
          fi
          if [ "$BASE" = "$HEAD" ]; then
            echo "${HEAD} was already the last deployed head; nothing changed, nothing to record."
            echo "head=" | tee -a "$GITHUB_OUTPUT"
            exit 0
          fi

          echo "Diffing ${BASE}...${HEAD}"
          echo "head=${HEAD}" | tee -a "$GITHUB_OUTPUT"
          echo "base=${BASE}" | tee -a "$GITHUB_OUTPUT"

      - name: Work out which scene scripts the diff touches
        id: scripts
        if: ${{ steps.range.outputs.head != '' }}
        env:
          BASE: ${{ steps.range.outputs.base }}
          HEAD: ${{ steps.range.outputs.head }}
        run: |
          set -euo pipefail
          for COMMIT in "$BASE" "$HEAD"; do
            git cat-file -e "${COMMIT}^{commit}" || { echo "Commit ${COMMIT} is missing from the checkout; cannot diff."; exit 1; }
          done
          CHANGED_FILES=$(git diff --name-only "$BASE" "$HEAD")
          if [ -z "$CHANGED_FILES" ]; then
            echo "No changed files between ${BASE} and ${HEAD}; nothing to record."
            exit 0
          fi

          SCRIPTS=$(printf '%s\n' "$CHANGED_FILES" | node scripts/video-scripts-for-changed-files.mjs --environment prod)
          if [ -z "$SCRIPTS" ]; then
            echo "No scene script's declared pages were touched between ${BASE} and ${HEAD}; nothing to record."
            exit 0
          fi

          echo "Scripts to record:"
          echo "$SCRIPTS"
          # A newline-separated list survives GITHUB_OUTPUT via a delimiter GitHub won't see
          # inside a script name (script names are lowercase-and-hyphens, per videos/*.json).
          {
            echo "names<<VIDEO_SCRIPTS_EOF"
            echo "$SCRIPTS"
            echo "VIDEO_SCRIPTS_EOF"
          } | tee -a "$GITHUB_OUTPUT" > /dev/null

      - name: Take the scripts named by the dispatch
        id: named
        if: ${{ inputs.scripts != '' }}
        env:
          INPUT_SCRIPTS: ${{ inputs.scripts }}
        run: |
          set -euo pipefail
          NAMED=""
          for SCRIPT in $INPUT_SCRIPTS; do
            [[ "$SCRIPT" =~ ^[a-z0-9-]+$ ]] || { echo "Invalid script name: ${SCRIPT}"; exit 1; }
            [ -f "videos/${SCRIPT}.json" ] || { echo "No scene script videos/${SCRIPT}.json"; exit 1; }
            NAMED="${NAMED}${SCRIPT}"$'\n'
          done
          echo "Scripts to record:"
          printf '%s' "$NAMED"
          {
            echo "names<<VIDEO_SCRIPTS_EOF"
            printf '%s' "$NAMED"
            echo "VIDEO_SCRIPTS_EOF"
          } | tee -a "$GITHUB_OUTPUT" > /dev/null

      - name: Filter to scenes due a recording
        id: due
        if: ${{ steps.scripts.outputs.names != '' || steps.named.outputs.names != '' }}
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          EVENT_NAME: ${{ github.event_name }}
          NAMES: ${{ steps.scripts.outputs.names || steps.named.outputs.names }}
        run: |
          set -euo pipefail
          if [ "$EVENT_NAME" = "workflow_dispatch" ]; then
            {
              echo "names<<VIDEO_DUE_EOF"
              echo "$NAMES"
              echo "VIDEO_DUE_EOF"
            } | tee -a "$GITHUB_OUTPUT" > /dev/null
            exit 0
          fi

          # video-capture.yml is the workflow that actually records and uploads each scene (as
          # "video-<script>-<environment-name>"); this workflow only dispatches it, so its own
          # runs never carry an artifact to check.
          SINCE=$(date -u -d '24 hours ago' +%FT%TZ)
          RUN_IDS=$(gh run list --repo "$REPO" --workflow video-capture.yml --created ">=${SINCE}" --json databaseId --jq '.[].databaseId')
          : > /tmp/video-recorded-artifacts.txt
          for RUN_ID in $RUN_IDS; do
            gh api "repos/${REPO}/actions/runs/${RUN_ID}/artifacts" --jq '.artifacts[].name' >> /tmp/video-recorded-artifacts.txt
          done

          DUE=$(echo "$NAMES" | node scripts/video-scenes-to-record.mjs --publish videos/publish.json --recorded /tmp/video-recorded-artifacts.txt)
          if [ -z "$DUE" ]; then
            echo "No touched scene is due a recording (not in videos/publish.json with publish: true, or already recorded in the last 24 hours); nothing to record."
          else
            echo "Scenes due a recording:"
            echo "$DUE"
          fi
          {
            echo "names<<VIDEO_DUE_EOF"
            echo "$DUE"
            echo "VIDEO_DUE_EOF"
          } | tee -a "$GITHUB_OUTPUT" > /dev/null

      - name: Record each touched script in turn
        if: ${{ steps.due.outputs.names != '' }}
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          SCRIPTS: ${{ steps.due.outputs.names }}
        run: |
          set -euo pipefail

          # Captures for prod run on main. A capture already queued or running there (a hand
          # dispatch, or an earlier run of this workflow) would hold this one pending and GitHub
          # drops an older pending run, so skip instead of queueing behind it.
          ACTIVE=$(for ACTIVE_STATUS in queued in_progress waiting; do
            gh run list --repo "$REPO" --workflow video-capture.yml --branch main --status "$ACTIVE_STATUS" --json databaseId --jq '.[].databaseId'
          done)
          if [ -n "$ACTIVE" ]; then
            echo "::warning::video-capture.yml already has a run queued or in progress on main (${ACTIVE//$'\n'/ }); skipping this dispatch"
            exit 0
          fi

          echo "$SCRIPTS" | while IFS= read -r SCRIPT; do
            [ -z "$SCRIPT" ] && continue

            PREV_RUN_ID=$(gh run list --repo "$REPO" --workflow video-capture.yml --limit 1 --json databaseId --jq '.[0].databaseId // empty')

            # A scene script declares where it can record; an absent field means both.
            ENVIRONMENTS=$(SCENE_SCRIPT="$SCRIPT" node -e 'const scene = JSON.parse(require("fs").readFileSync(`videos/${process.env.SCENE_SCRIPT}.json`, "utf8")); process.stdout.write((scene.environments ?? ["ci", "prod"]).join(" "))')
            case " ${ENVIRONMENTS} " in
              *" prod "*) TARGET_ENVIRONMENT=prod ;;
              *" ci "*) TARGET_ENVIRONMENT=ci ;;
              *) echo "::error::videos/${SCRIPT}.json declares no environment video-capture.yml records"; exit 1 ;;
            esac

            echo "Dispatching video-capture.yml for ${SCRIPT} to ${TARGET_ENVIRONMENT} (declared: ${ENVIRONMENTS})"
            gh workflow run video-capture.yml --repo "$REPO" -f "script=${SCRIPT}" -f "environment-name=${TARGET_ENVIRONMENT}"

            # Wait for the dispatched run to register before polling it, so this does not read
            # the previous run's already-completed status and move on before the new one starts.
            NEW_RUN_ID=""
            for _ in $(seq 1 20); do
              sleep 15
              CANDIDATE=$(gh run list --repo "$REPO" --workflow video-capture.yml --limit 1 --json databaseId --jq '.[0].databaseId // empty')
              if [ -n "$CANDIDATE" ] && [ "$CANDIDATE" != "$PREV_RUN_ID" ]; then
                NEW_RUN_ID="$CANDIDATE"
                break
              fi
            done
            if [ -z "$NEW_RUN_ID" ]; then
              echo "::warning::video-capture.yml run for ${SCRIPT} never showed up in the run list; moving on to the next script"
              continue
            fi

            # video-capture.yml queues captures per environment and holds one pending run, so the
            # next script's dispatch waits for this one to finish.
            for _ in $(seq 1 80); do
              STATUS=$(gh run view "$NEW_RUN_ID" --repo "$REPO" --json status --jq .status)
              if [ "$STATUS" = "completed" ]; then
                break
              fi
              sleep 30
            done
          done
