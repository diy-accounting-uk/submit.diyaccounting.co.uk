name: keepalive
run-name: "keepalive sweep of ${{ github.ref_name }}"
# SPDX-FileCopyrightText: 2025-2026 DIY Accounting Limited
# SPDX-License-Identifier: AGPL-3.0-or-later

# GitHub disables a scheduled workflow once a repository goes 60 days without any
# activity, and it does so silently: no issue, no notification, the cron simply
# stops firing (https://docs.github.com/actions/using-workflows/disabling-and-enabling-a-workflow#disabling-a-workflow).
# That is exactly what happened to this repository's scheduled destroy sweep from
# 2026-07-13 to 2026-08-24 - six weeks of CI cost drift with nobody told.
#
# Re-enabling a workflow that is already active is a no-op that still resets
# GitHub's 60-day inactivity clock, so a weekly touch here keeps every scheduled
# workflow's clock running indefinitely. If a workflow is still disabled_inactivity
# after the sweep runs, this job fails, which is the notification the July outage
# never got. Workflows a human disabled on purpose (disabled_manually) are left
# alone and never cause a failure.

on:
  schedule:
    - cron: '15 8 * * 6' # Weekly on Saturday - clear of every other workflow's day/hour/minute slot
  workflow_dispatch:

concurrency:
  group: keepalive-${{ github.ref }}
  cancel-in-progress: true

permissions:
  actions: write
  contents: read

jobs:
  keepalive:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7

      - name: Re-enable every workflow to reset GitHub's 60-day inactivity clock
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
        run: |
          set -euo pipefail

          list_workflows() {
            gh api "/repos/${REPO}/actions/workflows" --paginate \
              --jq '.workflows[] | [.id, .name, .state] | @tsv'
          }

          echo "=== Workflow states before sweep ==="
          INACTIVE_COUNT=0
          while IFS=$'\t' read -r WORKFLOW_ID WORKFLOW_NAME WORKFLOW_STATE; do
            echo "${WORKFLOW_NAME}: ${WORKFLOW_STATE}"
            case "${WORKFLOW_STATE}" in
              active|disabled_inactivity)
                if [ "${WORKFLOW_STATE}" = "disabled_inactivity" ]; then
                  INACTIVE_COUNT=$((INACTIVE_COUNT + 1))
                fi
                gh api -X PUT "/repos/${REPO}/actions/workflows/${WORKFLOW_ID}/enable"
                ;;
              disabled_manually)
                echo "  leaving disabled_manually workflow alone"
                ;;
              *)
                echo "  unrecognised state, leaving alone"
                ;;
            esac
          done < <(list_workflows)

          echo ""
          echo "Re-enabled ${INACTIVE_COUNT} workflow(s) GitHub had disabled for inactivity"

          echo ""
          echo "=== Workflow states after sweep ==="
          AFTER_SWEEP=$(list_workflows)
          printf '%s\n' "${AFTER_SWEEP}" | while IFS=$'\t' read -r WORKFLOW_ID WORKFLOW_NAME WORKFLOW_STATE; do
            echo "${WORKFLOW_NAME}: ${WORKFLOW_STATE}"
          done

          STILL_INACTIVE=$(printf '%s\n' "${AFTER_SWEEP}" | awk -F'\t' '$3 == "disabled_inactivity"' | wc -l | tr -d ' ')
          if [ "${STILL_INACTIVE}" -gt 0 ]; then
            echo ""
            echo "FAIL: ${STILL_INACTIVE} workflow(s) are still disabled_inactivity after the sweep"
            exit 1
          fi

          echo ""
          echo "All workflows are active or intentionally disabled_manually"

      # A workflow can stay "active" and still not fire on time: GitHub's schedule event
      # queues behind other runs at busy times, and the start of every hour is the busiest
      # (https://docs.github.com/actions/using-workflows/events-that-trigger-workflows#schedule).
      # compliance.yml and stack-drift.yml both sat on '0 6 * * 1' and landed 5-7 hours late
      # some weeks. Re-enabling above only catches a workflow GitHub disabled outright; this
      # step catches the quieter case where a schedule keeps queuing later than its own cadence
      # allows for, by comparing each workflow's last schedule-triggered run against its cron.
      - name: Check every scheduled workflow fired within its cadence
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
        run: |
          set -euo pipefail

          FAILURES=()

          for file in .github/workflows/*.yml; do
            if ! grep -qE '^[[:space:]]*schedule:[[:space:]]*$' "$file"; then
              continue
            fi

            cron=$(grep -oE "cron:[[:space:]]*[\"'][^\"']+[\"']" "$file" | head -1 \
              | sed -E "s/cron:[[:space:]]*[\"']([^\"']+)[\"']/\1/")
            if [ -z "${cron:-}" ]; then
              continue
            fi

            read -r _ _ DOM MONTH DOW <<< "$cron"

            if [ "$DOM" = "*" ] && [ "$MONTH" = "*" ] && [[ "$DOW" =~ ^[0-6]$ ]]; then
              cadence=7
            elif [ "$DOM" = "*" ] && [ "$MONTH" = "*" ] && [ "$DOW" = "*" ]; then
              cadence=1
            elif [ "$MONTH" = "*" ] && [ "$DOW" = "*" ] && [[ "$DOM" =~ ^[0-9]{1,2}$ ]]; then
              cadence=32
            else
              echo "SKIP  ${file}: cron '${cron}' does not match a recognised daily/weekly/monthly shape"
              continue
            fi

            workflow_file=$(basename "$file")
            last_run=$(gh api "repos/${REPO}/actions/workflows/${workflow_file}/runs?event=schedule&per_page=1" \
              --jq '.workflow_runs[0].created_at // empty')

            if [ -z "$last_run" ]; then
              echo "MISS  ${workflow_file}: no schedule-triggered run recorded yet (cron '${cron}', cadence ${cadence}d)"
              FAILURES+=("${workflow_file}: no schedule-triggered run recorded yet")
              continue
            fi

            last_epoch=$(date -d "$last_run" +%s)
            now_epoch=$(date +%s)
            age_days=$(( (now_epoch - last_epoch) / 86400 ))
            threshold=$((cadence + 1))

            if [ "$age_days" -gt "$threshold" ]; then
              echo "MISS  ${workflow_file}: last schedule run was ${age_days}d ago, cadence ${cadence}d (cron '${cron}')"
              FAILURES+=("${workflow_file}: last schedule run ${age_days}d ago, expected every ${cadence}d")
            else
              echo "OK    ${workflow_file}: last schedule run ${age_days}d ago, cadence ${cadence}d"
            fi
          done

          if [ "${#FAILURES[@]}" -gt 0 ]; then
            echo ""
            echo "FAIL: ${#FAILURES[@]} scheduled workflow(s) have not fired within their cadence"
            printf '  - %s\n' "${FAILURES[@]}"
            exit 1
          fi

          echo ""
          echo "Every scheduled workflow fired within its cadence"
