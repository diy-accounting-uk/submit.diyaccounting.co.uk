# .github/workflows/copilot-setup-steps.yml

name: copilot-setup-steps

on:
  push:
    branches:
      - '**'
      - '!gh_pages'
    paths:
      - '.github/workflows/copilot-setup-steps.yml'
  workflow_dispatch:

permissions:
  id-token: write
  contents: read

jobs:
  copilot-setup-steps:
    runs-on: ubuntu-latest
    environment: copilot
    permissions:
      id-token: write
      contents: read
    steps:

      - name: Install uv
        uses: astral-sh/setup-uv@v10.0.1
