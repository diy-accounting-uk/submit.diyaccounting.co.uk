name: board

run-name: "board${{ inputs.write-back == 'false' && ' (render only)' || '' }}"

# Renders the open-work board with the repository's own `/board` skill, and writes the statuses
# back to NEXT.md when - and only when - doing so would change what the next reader does.
#
# The render is most of the value: an account of alarms, deployments, origin branches and every
# open row, in the job summary, for a time nobody was looking. The write-back is the rest, and it
# is deliberately reluctant. A no-op commit to main every few hours is noise that teaches everyone
# to ignore the file's history, so the brief lists the conditions that justify a commit and
# instructs the agent to say "already true" and commit nothing otherwise.
#
# The one piece of GitHub state it may change is a tracking comment on an issue it has just added
# to the board - both halves or neither, so the two records never disagree.
#
# Triggers are commented out for this first drop. Prove it by hand.
on:
  workflow_dispatch:
    inputs:
      write-back:
        description: 'Allow the NEXT.md commit and issue tracking comments (false = render only)'
        type: choice
        required: true
        default: 'false'
        options:
          - 'false'
          - 'true'
  # schedule:
  #   # Twice a day is plenty: the board changes when work lands, and work landing already has its
  #   # own signals. Offset from the hour and from destroy-ci's sweep.
  #   - cron: '52 7,19 * * *'

concurrency:
  group: board
  cancel-in-progress: false

permissions:
  id-token: write # OIDC for the read-only AWS deployment table
  contents: read
  issues: write # the tracking comment on an issue newly added to the board
  pull-requests: read
  actions: read

env:
  NODE_VERSION: '24'
  AWS_REGION: 'eu-west-2'
  CLAUDE_CODE_VERSION: '2.0.30'

jobs:
  board:
    name: 'board'
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - name: Require an agent token when writing back
        if: inputs.write-back == 'true'
        env:
          AGENT_TOKEN: ${{ secrets.AGENT_TOKEN }}
        run: |
          set -euo pipefail
          if [ -z "${AGENT_TOKEN}" ]; then
            echo "::error::AGENT_TOKEN is not set, so the NEXT.md commit cannot be pushed."
            echo "::error::Dispatch with write-back=false to render without writing."
            exit 1
          fi

      - name: Checkout the default branch
        uses: actions/checkout@v7
        with:
          ref: ${{ github.event.repository.default_branch }}
          fetch-depth: 0
          token: ${{ secrets.AGENT_TOKEN || github.token }}

      - name: Set up Node
        uses: actions/setup-node@v7
        with:
          node-version: ${{ env.NODE_VERSION }}

      - name: Configure AWS role via GitHub OIDC
        uses: aws-actions/configure-aws-credentials@v6
        with:
          role-to-assume: ${{ vars.SUBMIT_ACTIONS_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}
          role-chaining: false
          audience: sts.amazonaws.com
          role-skip-session-tagging: true
          output-credentials: true
          retry-max-attempts: 3

      - name: Install Claude Code
        run: npm install -g "@anthropic-ai/claude-code@${CLAUDE_CODE_VERSION}"

      # Remember the starting point so the guard below can prove nothing but NEXT.md moved.
      - name: Record the tree before the agent runs
        id: before
        run: echo "sha=$(git rev-parse HEAD)" | tee -a "$GITHUB_OUTPUT"

      - name: Run the board skill
        id: run
        env:
          CLAUDE_CODE_USE_BEDROCK: '1'
          AWS_REGION: ${{ env.AWS_REGION }}
          ANTHROPIC_MODEL: 'eu.anthropic.claude-sonnet-4-5-20250929-v1:0'
          ANTHROPIC_SMALL_FAST_MODEL: 'eu.anthropic.claude-haiku-4-5-20251001-v1:0'
          CLAUDE_CODE_MAX_OUTPUT_TOKENS: '16384'
          DISABLE_TELEMETRY: '1'
          DISABLE_ERROR_REPORTING: '1'
          DISABLE_AUTOUPDATER: '1'
          GH_TOKEN: ${{ secrets.AGENT_TOKEN || github.token }}
          RUN_ID: ${{ github.run_id }}
          RUN_URL: '${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}'
          WRITE_BACK: ${{ inputs.write-back }}
        run: |
          set -o pipefail
          export RUN_ID RUN_URL
          PROMPT="/board

          $(envsubst < prompts/board-ci.md)"
          if [ "${WRITE_BACK}" != "true" ]; then
            PROMPT="${PROMPT}

          ## This run is render only

          Do not edit NEXT.md, do not commit, do not push, and do not comment on any issue. Where
          you would have written a status back, say what you would have changed and why instead.
          That list is this run's product."
          fi

          # No merge, no workflow dispatch, no push to anything but main's NEXT.md - and that push
          # is made by the step below, not by the agent, so the guard runs first.
          claude -p "$PROMPT" \
            --max-turns 60 \
            --output-format json \
            --permission-mode default \
            --disallowedTools "Bash(git push:*),Bash(gh pr merge:*),Bash(gh workflow run:*),Bash(gh issue close:*),Bash(gh issue edit:*)" \
            --allowedTools "Read,Grep,Glob,Edit,Write,Bash(git status:*),Bash(git diff:*),Bash(git log:*),Bash(git fetch:*),Bash(git branch:*),Bash(git ls-remote:*),Bash(git merge-base:*),Bash(git rev-parse:*),Bash(git add:*),Bash(git commit:*),Bash(gh issue list:*),Bash(gh issue view:*),Bash(gh issue comment:*),Bash(gh pr list:*),Bash(gh run list:*),Bash(gh api:*),Bash(aws cloudformation list-stacks:*),Bash(aws cloudformation describe-*),Bash(aws ssm get-parameter:*),Bash(aws cloudwatch describe-alarms:*),Bash(npx prettier:*),Bash(date:*)" \
            2>&1 | tee /tmp/board.json

      - name: Require a usable render
        if: always() && steps.run.outcome != 'skipped'
        run: |
          set -euo pipefail
          test -s /tmp/board.json || { echo "::error::no output from the agent"; exit 1; }
          result=$(jq -r '.result // empty' /tmp/board.json)
          if [ -z "$result" ]; then
            echo "::error::the agent produced no result field. Raw output:"
            head -c 4000 /tmp/board.json
            exit 1
          fi
          { echo "$result"; } >> "$GITHUB_STEP_SUMMARY"

      # THE GUARD. The agent is trusted to decide whether NEXT.md should change; it is not trusted
      # to decide that anything else may reach main this way. The docs exception covers .md only,
      # and this workflow narrows that further to the one file it exists to maintain.
      - name: Refuse anything that is not NEXT.md
        if: always() && steps.run.outcome == 'success'
        run: |
          set -euo pipefail
          changed=$(git diff --name-only "${{ steps.before.outputs.sha }}" HEAD; git diff --name-only; git ls-files --others --exclude-standard)
          unexpected=$(echo "$changed" | sed '/^$/d' | sort -u | grep -v '^NEXT\.md$' || true)
          if [ -n "$unexpected" ]; then
            echo "::error::this workflow may only change NEXT.md. Also changed:"
            echo "$unexpected"
            exit 1
          fi
          echo "Only NEXT.md changed (or nothing did)."

      - name: Push the board update
        if: inputs.write-back == 'true' && steps.run.outcome == 'success'
        env:
          GH_TOKEN: ${{ secrets.AGENT_TOKEN }}
        run: |
          set -euo pipefail
          if git diff --quiet "${{ steps.before.outputs.sha }}" HEAD && git diff --quiet; then
            echo "The board was already true. Nothing committed, nothing pushed."
            echo "The board was already true; nothing committed." >> "$GITHUB_STEP_SUMMARY"
            exit 0
          fi
          npx prettier --check NEXT.md
          git push origin HEAD:"${{ github.event.repository.default_branch }}"
          echo "Pushed $(git rev-parse --short HEAD) to ${{ github.event.repository.default_branch }}." >> "$GITHUB_STEP_SUMMARY"

      - name: Upload the raw agent output
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: board-${{ github.run_id }}
          path: /tmp/board.json
          if-no-files-found: warn
          retention-days: 14
