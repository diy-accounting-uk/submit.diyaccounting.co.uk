# @capability OPS-12 Clean up expired test users
# - **Use when:** a lane's test user has outlived its credential expiry window, or needs manual cleanup.
# - **Does:** cleanup-test-users.yml deletes or rotates Cognito test-user credentials once their lane's expiry window has passed. It runs daily on a schedule and also accepts a manual dispatch.
# - **Run:** `gh workflow run cleanup-test-users.yml -f environment-name=<ci|prod>`
# - **Entry:** `.github/workflows/cleanup-test-users.yml`
# - **Files:** .github/workflows/cleanup-test-users.yml
# - **Keywords:** cleanup test users, cognito test user, expiry window, synthetic user, lane user
# - **Related:** OPS-16, OPS-67
# @end-capability

name: Cleanup Test Users
run-name: "cleanup test users for ${{ inputs.environment-name || 'ci' }}"

on:
  schedule:
    - cron: '0 4 * * *'  # Daily at 04:00 UTC
  workflow_dispatch:
    inputs:
      environment-name:
        description: 'Environment name'
        required: true
        type: choice
        options:
          - ci
          - prod
        default: ci
      confirm:
        description: 'Confirm deletion (false = dry run)'
        required: true
        type: boolean
        default: false

permissions:
  id-token: write
  contents: read

env:
  AWS_REGION: 'eu-west-2'

jobs:
  cleanup:
    runs-on: ubuntu-24.04
    environment: ${{ inputs.environment-name || 'ci' }}
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - name: Set up the toolchain
        timeout-minutes: 6
        uses: ./.github/actions/setup-toolchain

      - name: Assume the AWS actions and deployment roles
        uses: ./.github/actions/aws-role
        with:
          actions-role-arn: ${{ vars.SUBMIT_ACTIONS_ROLE_ARN }}
          deploy-role-arn: ${{ vars.SUBMIT_DEPLOY_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Resolve environment name
        id: names
        run: |
          ENV_NAME="${{ inputs.environment-name || 'ci' }}"
          echo "environment-name=${ENV_NAME}" >> "$GITHUB_OUTPUT"
          echo "Environment: ${ENV_NAME}"

      - name: Cleanup test users (scheduled - always confirm)
        if: ${{ github.event_name == 'schedule' }}
        run: |
          node scripts/cleanup-test-users.js \
            "${{ steps.names.outputs.environment-name }}" \
            --confirm --json | tee cleanup-summary.json

      - name: Cleanup test users (manual dispatch)
        if: ${{ github.event_name == 'workflow_dispatch' }}
        run: |
          CONFIRM_FLAG=""
          if [ "${{ inputs.confirm }}" = "true" ]; then
            CONFIRM_FLAG="--confirm"
          fi
          node scripts/cleanup-test-users.js \
            "${{ steps.names.outputs.environment-name }}" \
            ${CONFIRM_FLAG} --json | tee cleanup-summary.json

      - name: Upload cleanup summary
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: cleanup-summary-${{ github.run_id }}
          path: cleanup-summary.json
          retention-days: 90

      - name: Generate step summary
        run: |
          echo "# Test User Cleanup Summary" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "**Environment**: ${{ steps.names.outputs.environment-name }}" >> $GITHUB_STEP_SUMMARY
          echo "**Trigger**: ${{ github.event_name }}" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          if [ -f cleanup-summary.json ]; then
            echo '```json' >> $GITHUB_STEP_SUMMARY
            cat cleanup-summary.json >> $GITHUB_STEP_SUMMARY
            echo '```' >> $GITHUB_STEP_SUMMARY
          fi
