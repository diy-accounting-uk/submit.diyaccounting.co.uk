name: support-notice-handler
run-name: support notice handler

# Handles a mail notice that the operator has approved. support-reader.yml posts a checked reader
# comment on the notice issue in the private repository. The operator reads it and removes
# `maintainer-review`. This workflow then takes one fixed action with no model: it runs the
# read-only check that the registry names for the sender, or drafts a board row, or closes the
# issue. See scripts/notice-handle.mjs. The handler holds no AWS role and writes only a comment,
# the label `notice-handled` and the close.
#
# This repository is public, so its logs are public. The scripts print issue numbers and actions
# only. The select job holds a token that reads issues, and the act job holds a token that writes
# them. The act job checks the maintainer-review gate again before it writes.

on:
  schedule:
    - cron: '29 * * * *'
  workflow_dispatch:
    inputs:
      issue-number:
        description: the private mail-notice issue to handle; empty handles the oldest approved one
        required: false
        type: string

permissions: {}

concurrency:
  group: support-notice-handler
  cancel-in-progress: false

env:
  PRIVATE_REPO: diy-accounting-uk/private.diyaccounting.co.uk

jobs:
  select:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    environment: prod
    permissions:
      contents: read
    outputs:
      issue-number: ${{ steps.pick.outputs.issue-number }}
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      - name: Set up the toolchain
        uses: ./.github/actions/setup-toolchain
        with:
          npm-install: scripts
          npm-cache: 'false'

      - name: Generate a token that reads issues in the private repository
        id: private-token
        uses: actions/create-github-app-token@64ab729a6294000f5aa4a4bc0b73d1f32bc45510 # v3.3.0
        with:
          app-id: ${{ vars.AGENT_APP_ID }}
          private-key: ${{ secrets.AGENT_APP_PRIVATE_KEY }}
          owner: diy-accounting-uk
          repositories: private.diyaccounting.co.uk
          permission-issues: read

      - name: Pick the oldest approved notice
        id: pick
        env:
          GH_TOKEN: ${{ steps.private-token.outputs.token }}
          ISSUE_INPUT: ${{ inputs.issue-number }}
        run: |
          set -euo pipefail
          ARGS=()
          if [ -n "${ISSUE_INPUT}" ]; then ARGS+=(--issue "${ISSUE_INPUT}"); fi
          node scripts/notice-handle.mjs select "${ARGS[@]}"

  act:
    needs: select
    if: needs.select.outputs.issue-number != ''
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    environment: prod
    permissions:
      contents: read
    env:
      ISSUE_NUMBER: ${{ needs.select.outputs.issue-number }}
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      - name: Set up the toolchain
        uses: ./.github/actions/setup-toolchain
        with:
          npm-install: scripts
          npm-cache: 'false'

      - name: Generate a token that writes issues in the private repository
        id: private-token
        uses: actions/create-github-app-token@64ab729a6294000f5aa4a4bc0b73d1f32bc45510 # v3.3.0
        with:
          app-id: ${{ vars.AGENT_APP_ID }}
          private-key: ${{ secrets.AGENT_APP_PRIVATE_KEY }}
          owner: diy-accounting-uk
          repositories: private.diyaccounting.co.uk
          permission-issues: write

      - name: Check the maintainer-review gate again
        env:
          GH_TOKEN: ${{ steps.private-token.outputs.token }}
        run: node scripts/maintainer-review-gate.mjs --repo "$PRIVATE_REPO" --issue "$ISSUE_NUMBER"

      - name: Take the notice's one action
        env:
          GH_TOKEN: ${{ steps.private-token.outputs.token }}
        run: node scripts/notice-handle.mjs act --issue "$ISSUE_NUMBER"
