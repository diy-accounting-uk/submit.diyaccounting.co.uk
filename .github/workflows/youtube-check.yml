# @capability OPS-53 Verify YouTube channel consistency weekly
# - **Use when:** checking whether the stored YouTube credentials or channel state have gone stale.
# - **Does:** youtube-check.yml checks weekly that the stored YouTube refresh token and channel state are still valid. It runs as github-actions[bot].
# - **Run:** no command; see Does and Entry
# - **Entry:** `.github/workflows/youtube-check.yml`
# - **Files:** .github/workflows/youtube-check.yml
# - **Keywords:** youtube check, refresh token, channel state, weekly verification, youtube-check.yml
# @end-capability

name: youtube check
run-name: "youtube check from ${{ github.ref_name }}"

concurrency:
  group: youtube-check-${{ github.ref }}
  cancel-in-progress: false

on:
  workflow_dispatch: {}
  schedule:
    # Weekly on Monday, off the top-of-hour queue and after compliance/certificate-check/
    # stack-drift (06:06/06:17/06:36). Only reads the stored refresh token and the channel it
    # resolves to; never uploads anything.
    - cron: '46 6 * * 1'

env:
  AWS_REGION: 'eu-west-2'

jobs:
  youtube-check:
    name: check
    runs-on: ubuntu-24.04
    environment: prod
    permissions:
      id-token: write
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - name: Set up the toolchain
        timeout-minutes: 6
        uses: ./.github/actions/setup-toolchain

      - name: Assume the AWS actions and deployment roles
        uses: ./.github/actions/aws-role
        with:
          actions-role-arn: ${{ vars.SUBMIT_ACTIONS_ROLE_ARN }}
          deploy-role-arn: ${{ vars.SUBMIT_DEPLOY_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Check the stored refresh token still resolves to the declared channel
        run: node scripts/youtube-upload.js --check
