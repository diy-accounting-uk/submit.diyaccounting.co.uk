name: youtube check
run-name: "youtube check from ${{ github.ref_name }}"

concurrency:
  group: youtube-check-${{ github.ref }}
  cancel-in-progress: false

on:
  workflow_dispatch: {}
  schedule:
    # Every Monday at 06:00 UTC. Only reads the stored refresh token and the channel it
    # resolves to; never uploads anything.
    - cron: '0 6 * * 1'

env:
  NODE_VERSION: '24'
  AWS_REGION: 'eu-west-2'

jobs:
  youtube-check:
    name: check
    runs-on: ubuntu-24.04
    environment: prod
    permissions:
      id-token: write
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'

      - name: Install dependencies
        run: timeout 120 npm ci --prefer-offline || { sleep 30; timeout 180 npm ci; }
        timeout-minutes: 6
        env:
          NPM_CONFIG_FETCH_RETRIES: "3"

      - name: Configure AWS role via GitHub OIDC
        uses: aws-actions/configure-aws-credentials@v6
        with:
          role-to-assume: ${{ vars.SUBMIT_ACTIONS_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}
          role-chaining: false
          audience: sts.amazonaws.com
          role-skip-session-tagging: true
          output-credentials: true
          retry-max-attempts: 3

      - name: Assume AWS deployment role
        uses: aws-actions/configure-aws-credentials@v6
        with:
          role-to-assume: ${{ vars.SUBMIT_DEPLOY_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}
          role-chaining: true
          audience: sts.amazonaws.com
          role-skip-session-tagging: true
          output-credentials: true
          retry-max-attempts: 3

      - name: Check the stored refresh token still resolves to the declared channel
        run: node scripts/youtube-upload.js --check
