name: "CodeQL"

on:
  # push covers every commit pushed to a branch in this repository, main included; pull_request
  # exists only so a fork's PR gets scanned too, since a fork's own pushes never reach push here.
  # Every branch in this repository opens a PR against main straight away (see the workspace
  # CLAUDE.md's branch-naming convention), so without the analyze job's fork check below, push
  # and pull_request would both fire for the same commit on the same branch - the 16 runs from
  # 12 pushed commits seen on 2026-09-13.
  # Every push except a docs-only one is scanned, because main's ruleset requires the CodeQL
  # context on every pull request.
  # workflow_dispatch lets a Markdown-only PR head (which paths-ignore skips on both push and
  # pull_request, so the CodeQL context never runs on its own) be dispatched manually so its
  # required check gets a run; the analyze job's fork check above already admits this event.
  workflow_dispatch:
  push:
    branches:
      - '**'
      - '!gh_pages'
    paths-ignore:
      - '**.md'
  pull_request:
    branches: [main]
    paths-ignore:
      - '**.md'
  schedule:
    # Run weekly on Sundays at 04:00 UTC
    - cron: "0 4 * * 0"

concurrency:
  group: codeql-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read
  security-events: write

jobs:
  analyze:
    # Runs unconditionally for push (this repository's own branches only trigger push, never
    # pull_request - see the on: block above). For pull_request, runs only when the PR head is a
    # fork: a same-repository PR's head branch already ran this exact commit under push.
    if: ${{ github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name != github.repository }}
    name: Analyze
    runs-on: ubuntu-latest
    permissions:
      security-events: write
      contents: read
      actions: read

    strategy:
      fail-fast: false
      matrix:
        language: [javascript-typescript]

    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - name: Initialize CodeQL
        uses: github/codeql-action/init@b96794f015dfd88f77b49b1c93e0fa7110f94c63 # v4
        with:
          languages: ${{ matrix.language }}
          config-file: ./.github/codeql/codeql-config.yml

      - name: Autobuild
        uses: github/codeql-action/autobuild@b96794f015dfd88f77b49b1c93e0fa7110f94c63 # v4
      - name: Perform CodeQL Analysis
        uses: github/codeql-action/analyze@b96794f015dfd88f77b49b1c93e0fa7110f94c63 # v4
        with:
          category: "/language:${{ matrix.language }}"
