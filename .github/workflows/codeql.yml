name: "CodeQL"

on:
  push:
    branches: [main]
    paths:
      - 'app/**'
      - 'infra/**'
      - 'tests/**'
      - 'behaviour-tests/**'
      - 'web/**'
      - '.env.ci'
      - '.env.prod'
      - '**/cdk.json'
      - 'Dockerfile'
      - 'LICENSE'
      - 'package.json'
      - 'package-lock.json'
      - 'pom.xml'
      - 'web/public/submit.catalogue.toml'
      - '.github/actions/get-names'
      - '.github/workflows/*.yml'
      - '.prettierignore'
      - '.prettierrc'
      - 'eslint.config.js'
      - 'jsconfig.json'
      - 'mock-oauth2-config.json'
      - 'playwright.config.js'
      - 'vitest.config.js'
  pull_request:
    branches: [main]
    paths:
      - 'app/**'
      - 'infra/**'
      - 'tests/**'
      - 'behaviour-tests/**'
      - 'web/**'
      - '.env.ci'
      - '.env.prod'
      - '**/cdk.json'
      - 'Dockerfile'
      - 'LICENSE'
      - 'package.json'
      - 'package-lock.json'
      - 'pom.xml'
      - 'web/public/submit.catalogue.toml'
      - '.github/actions/get-names'
      - '.github/workflows/*.yml'
      - '.prettierignore'
      - '.prettierrc'
      - 'eslint.config.js'
      - 'jsconfig.json'
      - 'mock-oauth2-config.json'
      - 'playwright.config.js'
      - 'vitest.config.js'
  schedule:
    # Run weekly on Sundays at 04:00 UTC
    - cron: "0 4 * * 0"

concurrency:
  group: codeql-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read
  security-events: write

jobs:
  analyze:
    name: Analyze
    runs-on: ubuntu-latest
    permissions:
      security-events: write
      contents: read
      actions: read

    strategy:
      fail-fast: false
      matrix:
        language: [javascript-typescript]

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Initialize CodeQL
        uses: github/codeql-action/init@v4
        with:
          languages: ${{ matrix.language }}
          config-file: ./.github/codeql/codeql-config.yml

      - name: Autobuild
        uses: github/codeql-action/autobuild@v4

      - name: Perform CodeQL Analysis
        uses: github/codeql-action/analyze@v4
        with:
          category: "/language:${{ matrix.language }}"
