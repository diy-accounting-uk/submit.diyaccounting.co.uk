name: google apply
run-name: "google apply (${{ github.event_name == 'pull_request' && 'plan' || 'apply' }}) from ${{ github.ref_name }}"

concurrency:
  group: google-apply-${{ github.ref }}
  cancel-in-progress: false

on:
  pull_request:
    paths:
      - 'google/**'
      - 'analytics/bigquery/**'
      - 'scripts/google-*.js'
      - 'scripts/ga4-*.js'
      - 'scripts/gcp-*.js'
      - '.github/workflows/google-apply.yml'
  push:
    branches:
      - 'main'
    paths:
      - 'google/**'
      - 'analytics/bigquery/**'
      - 'scripts/google-*.js'
      - 'scripts/ga4-*.js'
      - 'scripts/gcp-*.js'
      - '.github/workflows/google-apply.yml'

env:
  NODE_VERSION: '24'
  AWS_REGION: 'eu-west-2'

jobs:
  google-apply:
    name: ${{ github.event_name == 'pull_request' && 'plan' || 'apply' }}
    runs-on: ubuntu-24.04
    environment: prod
    permissions:
      id-token: write
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'

      - name: Install dependencies
        run: timeout 120 npm ci --prefer-offline || { sleep 30; timeout 180 npm ci; }
        timeout-minutes: 6
        env:
          NPM_CONFIG_FETCH_RETRIES: "3"

      - name: Configure AWS role via GitHub OIDC
        uses: aws-actions/configure-aws-credentials@v6
        with:
          role-to-assume: ${{ vars.SUBMIT_ACTIONS_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}
          role-chaining: false
          audience: sts.amazonaws.com
          role-skip-session-tagging: true
          output-credentials: true
          retry-max-attempts: 3

      - name: Assume AWS deployment role
        uses: aws-actions/configure-aws-credentials@v6
        with:
          role-to-assume: ${{ vars.SUBMIT_DEPLOY_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}
          role-chaining: true
          audience: sts.amazonaws.com
          role-skip-session-tagging: true
          output-credentials: true
          retry-max-attempts: 3

      - name: Resolve GA4 service account key
        id: resolve
        run: |
          SECRET_JSON=$(aws secretsmanager get-secret-value --secret-id "$GA4_SERVICE_ACCOUNT_ARN" --query SecretString --output text)
          echo "::add-mask::${SECRET_JSON}"
          {
            echo "credentials-json<<GA4_SERVICE_ACCOUNT_JSON_EOF"
            echo "${SECRET_JSON}"
            echo "GA4_SERVICE_ACCOUNT_JSON_EOF"
          } >> "$GITHUB_OUTPUT"
        env:
          GA4_SERVICE_ACCOUNT_ARN: "arn:aws:secretsmanager:${{ env.AWS_REGION }}:${{ vars.SUBMIT_ACCOUNT_ID }}:secret:prod/submit/ga4/service_account"

      # Steps run in dependency order: APIs, then IAM roles, then billing, then GA4, then the
      # GA4-in-BigQuery dataset, then the OAuth clients. The YouTube credential check runs on
      # its own schedule (.github/workflows/youtube-check.yml), not here.

      - name: Read-only inventory
        env:
          GA4_SERVICE_ACCOUNT_JSON: ${{ steps.resolve.outputs.credentials-json }}
        run: node scripts/google-inventory.js 2>&1 | tee google-inventory.log

      - name: Enable the Google APIs the scripts need
        env:
          GA4_SERVICE_ACCOUNT_JSON: ${{ steps.resolve.outputs.credentials-json }}
        run: |
          if [ "${{ github.event_name }}" = "pull_request" ]; then
            node scripts/gcp-enable-apis.js 2>&1 | tee gcp-enable-apis.log
          else
            node scripts/gcp-enable-apis.js --apply 2>&1 | tee gcp-enable-apis.log
          fi

      - name: Run google-roles-apply
        env:
          GA4_SERVICE_ACCOUNT_JSON: ${{ steps.resolve.outputs.credentials-json }}
        run: |
          if [ "${{ github.event_name }}" = "pull_request" ]; then
            node scripts/google-roles-apply.js 2>&1 | tee google-roles-apply.log
          else
            node scripts/google-roles-apply.js --apply 2>&1 | tee google-roles-apply.log
          fi

      - name: Run gcp-billing-assert
        env:
          GA4_SERVICE_ACCOUNT_JSON: ${{ steps.resolve.outputs.credentials-json }}
        run: |
          if [ "${{ github.event_name }}" = "pull_request" ]; then
            node scripts/gcp-billing-assert.js 2>&1 | tee gcp-billing-assert.log
          else
            node scripts/gcp-billing-assert.js --apply 2>&1 | tee gcp-billing-assert.log
          fi

      - name: Run ga4-sync
        env:
          GA4_SERVICE_ACCOUNT_JSON: ${{ steps.resolve.outputs.credentials-json }}
          GH_TOKEN: ${{ github.token }}
        run: |
          if [ "${{ github.event_name }}" = "pull_request" ]; then
            node scripts/ga4-sync.js 2>&1 | tee ga4-sync.log
          else
            node scripts/ga4-sync.js --apply 2>&1 | tee ga4-sync.log
          fi

      - name: Run ga4-bigquery-sync
        env:
          GA4_SERVICE_ACCOUNT_JSON: ${{ steps.resolve.outputs.credentials-json }}
        run: |
          if [ "${{ github.event_name }}" = "pull_request" ]; then
            node scripts/ga4-bigquery-sync.js 2>&1 | tee ga4-bigquery-sync.log
          else
            node scripts/ga4-bigquery-sync.js --apply 2>&1 | tee ga4-bigquery-sync.log
          fi

      # Read-only: checks google/oauth.toml against Cognito, Secrets Manager and the Google
      # Auth Platform brand, the same on a pull request and on a push. Nothing to apply.
      - name: Run google-oauth-assert
        env:
          GA4_SERVICE_ACCOUNT_JSON: ${{ steps.resolve.outputs.credentials-json }}
        run: node scripts/google-oauth-assert.js 2>&1 | tee google-oauth-assert.log

      - name: Generate step summary
        if: always()
        run: |
          echo "# Google apply (${{ github.event_name == 'pull_request' && 'plan' || 'apply' }})" >> "$GITHUB_STEP_SUMMARY"
          echo "" >> "$GITHUB_STEP_SUMMARY"
          for log in google-inventory.log gcp-enable-apis.log google-roles-apply.log gcp-billing-assert.log ga4-sync.log ga4-bigquery-sync.log google-oauth-assert.log; do
            if [ -f "$log" ]; then
              echo "## $log" >> "$GITHUB_STEP_SUMMARY"
              echo '```' >> "$GITHUB_STEP_SUMMARY"
              cat "$log" >> "$GITHUB_STEP_SUMMARY"
              echo '```' >> "$GITHUB_STEP_SUMMARY"
            fi
          done
