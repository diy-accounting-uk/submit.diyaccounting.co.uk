name: google apply
run-name: "google apply (${{ (github.event_name == 'push' || (github.event_name == 'workflow_dispatch' && inputs.apply)) && 'apply' || 'plan' }}) from ${{ github.ref_name }}"

concurrency:
  group: google-apply-${{ github.ref }}
  cancel-in-progress: false

# Every run step pipes through tee; without an explicit bash shell GitHub runs `bash -e` and the
# pipe masks a failing script, which is how a failed identity sync once reported success.
defaults:
  run:
    shell: bash

on:
  workflow_dispatch:
    inputs:
      apply:
        description: "Apply the difference (true) or plan only (false)"
        required: false
        default: false
        type: boolean
  pull_request:
    paths:
      - 'google/**'
      - 'analytics/bigquery/**'
      - 'scripts/google-*.js'
      - 'scripts/ga4-*.js'
      - 'scripts/gcp-*.js'
      - '.github/workflows/google-apply.yml'
  push:
    branches:
      - 'main'
    paths:
      - 'google/**'
      - 'analytics/bigquery/**'
      - 'scripts/google-*.js'
      - 'scripts/ga4-*.js'
      - 'scripts/gcp-*.js'
      - '.github/workflows/google-apply.yml'

env:
  NODE_VERSION: '24'
  AWS_REGION: 'eu-west-2'
  # pull_request plans; push and a dispatch with apply=true apply.
  GOOGLE_APPLY: ${{ (github.event_name == 'push' || (github.event_name == 'workflow_dispatch' && inputs.apply)) && 'true' || 'false' }}

jobs:
  google-apply:
    name: ${{ (github.event_name == 'push' || (github.event_name == 'workflow_dispatch' && inputs.apply)) && 'apply' || 'plan' }}
    runs-on: ubuntu-24.04
    environment: prod
    permissions:
      id-token: write
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Setup Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'

      - name: Install dependencies
        run: timeout 120 npm ci --prefer-offline || { sleep 30; timeout 180 npm ci; }
        timeout-minutes: 6
        env:
          NPM_CONFIG_FETCH_RETRIES: "3"

      - name: Configure AWS role via GitHub OIDC
        uses: aws-actions/configure-aws-credentials@e1253824e5c10ff9df46874f81ed3ec929e19cfd # v6
        with:
          role-to-assume: ${{ vars.SUBMIT_ACTIONS_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}
          role-chaining: false
          audience: sts.amazonaws.com
          role-skip-session-tagging: true
          output-credentials: true
          retry-max-attempts: 3

      - name: Assume AWS deployment role
        uses: aws-actions/configure-aws-credentials@e1253824e5c10ff9df46874f81ed3ec929e19cfd # v6
        with:
          role-to-assume: ${{ vars.SUBMIT_DEPLOY_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}
          role-chaining: true
          audience: sts.amazonaws.com
          role-skip-session-tagging: true
          output-credentials: true
          retry-max-attempts: 3

      # Federated: the workflow's own OIDC token, exchanged through the pool google/identity.toml
      # declares, leaves application default credentials for every Google step below. The AWS
      # chain above stays for ga4-sync's GitHub-variable write.
      - name: Read the GitHub provider from google/identity.toml
        id: identity
        run: |
          node -e '
            const TOML = require("@iarna/toml");
            const fs = require("node:fs");
            const c = TOML.parse(fs.readFileSync("google/identity.toml", "utf-8"));
            const provider = c.workload_identity_pool.provider.find((p) => p.type === "oidc");
            console.log(`provider=projects/${c.project.number}/locations/global/workloadIdentityPools/${c.workload_identity_pool.id}/providers/${provider.id}`);
            console.log(`service-account=${c.service_account.email}`);
          ' | tee -a "$GITHUB_OUTPUT"

      - name: Authenticate to Google by federation
        uses: google-github-actions/auth@c200f3691d83b41bf9bbd8638997a462592937ed # v2
        with:
          workload_identity_provider: ${{ steps.identity.outputs.provider }}
          service_account: ${{ steps.identity.outputs.service-account }}

      # Steps run in dependency order: APIs, then identity (the workload identity pool and its
      # bindings), then IAM roles, then billing, then GA4, then the GA4-in-BigQuery dataset,
      # then the OAuth clients. The YouTube credential check runs on its own schedule
      # (.github/workflows/youtube-check.yml), not here.

      - name: Read-only inventory
        run: node scripts/google-inventory.js 2>&1 | tee google-inventory.log

      - name: Enable the Google APIs the scripts need
        run: |
          if [ "$GOOGLE_APPLY" != "true" ]; then
            node scripts/gcp-enable-apis.js 2>&1 | tee gcp-enable-apis.log
          else
            node scripts/gcp-enable-apis.js --apply 2>&1 | tee gcp-enable-apis.log
          fi

      - name: Run gcp-identity-sync
        run: |
          if [ "$GOOGLE_APPLY" != "true" ]; then
            node scripts/gcp-identity-sync.js 2>&1 | tee gcp-identity-sync.log
          else
            node scripts/gcp-identity-sync.js --apply 2>&1 | tee gcp-identity-sync.log
          fi

      - name: Run google-roles-apply
        run: |
          if [ "$GOOGLE_APPLY" != "true" ]; then
            node scripts/google-roles-apply.js 2>&1 | tee google-roles-apply.log
          else
            node scripts/google-roles-apply.js --apply 2>&1 | tee google-roles-apply.log
          fi

      - name: Run gcp-billing-assert
        run: |
          if [ "$GOOGLE_APPLY" != "true" ]; then
            node scripts/gcp-billing-assert.js 2>&1 | tee gcp-billing-assert.log
          else
            node scripts/gcp-billing-assert.js --apply 2>&1 | tee gcp-billing-assert.log
          fi

      - name: Run ga4-sync
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if [ "$GOOGLE_APPLY" != "true" ]; then
            node scripts/ga4-sync.js 2>&1 | tee ga4-sync.log
          else
            node scripts/ga4-sync.js --apply 2>&1 | tee ga4-sync.log
          fi

      - name: Run ga4-bigquery-sync
        run: |
          if [ "$GOOGLE_APPLY" != "true" ]; then
            node scripts/ga4-bigquery-sync.js 2>&1 | tee ga4-bigquery-sync.log
          else
            node scripts/ga4-bigquery-sync.js --apply 2>&1 | tee ga4-bigquery-sync.log
          fi

      # Read-only: checks google/oauth.toml against Cognito, Secrets Manager and the Google
      # Auth Platform brand, the same on a pull request and on a push. Nothing to apply.
      - name: Run google-oauth-assert
        run: node scripts/google-oauth-assert.js 2>&1 | tee google-oauth-assert.log

      - name: Generate step summary
        if: always()
        run: |
          echo "# Google apply ($([ "$GOOGLE_APPLY" = "true" ] && echo apply || echo plan))" >> "$GITHUB_STEP_SUMMARY"
          echo "" >> "$GITHUB_STEP_SUMMARY"
          for log in google-inventory.log gcp-enable-apis.log gcp-identity-sync.log google-roles-apply.log gcp-billing-assert.log ga4-sync.log ga4-bigquery-sync.log google-oauth-assert.log; do
            if [ -f "$log" ]; then
              echo "## $log" >> "$GITHUB_STEP_SUMMARY"
              echo '```' >> "$GITHUB_STEP_SUMMARY"
              cat "$log" >> "$GITHUB_STEP_SUMMARY"
              echo '```' >> "$GITHUB_STEP_SUMMARY"
            fi
          done
