name: test
run-name: "test from ${{ github.ref_name }}"

on:
  workflow_dispatch:
    inputs:
      environment-name:
        type: choice
        description: 'Environment name to use instead of computing from branch, e.g. ci or prod'
        required: false
        options:
          - '(auto)'
          - 'ci'
          - 'prod'
        default: '(auto)'
      deployment-name:
        type: string
        description: 'Deployment name to use instead of computing from branch, e.g. ci-lambdas6 or prod-ea373de'
        required: false
        default: ''
      runProxyBehaviourTests:
        description: 'Run proxy behaviour tests (uses the real local TLS certificate and Docker)'
        type: choice
        options:
          - 'true'
          - 'false'
        required: false
        default: 'false'
  workflow_call:
    inputs:
      environment-name:
        type: string
        description: 'Environment name to use instead of computing from branch, e.g. ci or prod'
        required: true
      deployment-name:
        type: string
        description: 'Deployment name to use instead of computing from branch, e.g. ci-lambdas6 or prod-ea373de'
        required: true
      runProxyBehaviourTests:
        type: string
        description: 'Run proxy behaviour tests (uses the real local TLS certificate and Docker)'
        required: false
        default: 'false'
    secrets:
      HMRC_SANDBOX_CLIENT_SECRET:
        required: false

  # Every branch push runs this workflow because the ruleset requires its contexts on pull
  # requests. Main is excluded because deploy.yml calls this workflow for every main head it
  # deploys, and the nightly schedule covers main heads deploy.yml skips.
  push:
    branches:
      - '**'
      - '!gh_pages'
      - '!main'
  schedule:
    - cron: '23 4 * * *'

concurrency:
  # deploy.yml calls this workflow ('delegate to test workflow') with `uses:`, and a reusable
  # workflow's own concurrency block runs in the CALLER's context — so `github.ref` alone would
  # put the delegated call in the same group as the standalone push-triggered run on that same
  # branch, and whichever started later cancels the other. `github.workflow` tells them apart:
  # it is the name of the top-level triggering workflow, so it reads 'test' for a standalone run
  # and 'deploy' for a call from deploy.yml. Keying on both keeps this workflow's own cancel-the-
  # superseded-push behaviour (same `github.workflow`, same `github.ref`) while a delegated call
  # never shares a group with, and so never cancels or is cancelled by, the standalone run. Same
  # shape as destroy-prod.yml's caller/callee group split — see its concurrency comment.
  group: test-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read
  packages: read
  id-token: write

env:
  JAVA_VERSION: '25'
  NODE_VERSION: '24'
  AWS_REGION: 'eu-west-2'
  BASE_IMAGE_TAG_PREFIX: 'submit-base'
  loadTestDuration: '30s'
  GITHUB_ACTOR: ${{ github.actor }}
  SELF_DESTRUCT_DELAY_HOURS: '1'
  BASE_IMAGE_TAG: ${{ github.sha }}
  FORCE_ALL_STACK_DEPLOYMENT: 'false'
  COMMIT_HASH: ${{ github.sha }}
  BUILD_NUMBER: ${{ github.run_number }}
  GITHUB_REF: ${{ github.ref }}
  # GITHUB_REF_TO_ENV: resolved per-job via needs.params.outputs.github-environment

jobs:

  # Decides whether the push touched anything but Markdown, so the heavy jobs below can skip on
  # a docs-only push while still posting a status check for it. A job GitHub skips via its own
  # `if:` reports 'skipped', and main's ruleset counts a skipped required check as passing — the
  # documented way to keep a required context green on a push that has nothing for it to check.
  # workflow_dispatch, workflow_call (deploy.yml's own delegated run) and the nightly schedule
  # always run everything: the operator asked for it, deploy.yml only calls this workflow for a
  # real deployment, and the nightly run should cover the whole suite regardless of what changed.
  changes:
    name: 'changes'
    runs-on: ubuntu-24.04
    outputs:
      code: ${{ steps.check.outputs.code }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0

      - name: Decide whether this push touches anything but Markdown
        id: check
        shell: bash
        run: |
          case "${{ github.event_name }}" in
            workflow_dispatch|workflow_call|schedule)
              echo "code=true" >> "$GITHUB_OUTPUT"
              exit 0
              ;;
          esac

          before='${{ github.event.before }}'
          if [ -n "$before" ] && [ "$before" != "0000000000000000000000000000000000000000" ] \
            && git cat-file -e "${before}^{commit}" 2>/dev/null; then
            range="${before}..${{ github.sha }}"
          else
            # A new branch's zero SHA, or a force push whose old tip is no longer fetchable:
            # fall back to comparing against the default branch.
            git fetch origin '${{ github.event.repository.default_branch }}' --quiet
            range="origin/${{ github.event.repository.default_branch }}...HEAD"
            echo "before SHA unusable; comparing $range instead." >> "$GITHUB_STEP_SUMMARY"
          fi

          changed=$(git diff --name-only $range)
          echo "Changed files ($range):" >> "$GITHUB_STEP_SUMMARY"
          echo "$changed" >> "$GITHUB_STEP_SUMMARY"

          non_md=$(printf '%s\n' "$changed" | grep -v -E '\.md$' || true)
          if [ -z "$changed" ] || [ -n "$non_md" ]; then
            echo "code=true" >> "$GITHUB_OUTPUT"
          else
            echo "code=false" >> "$GITHUB_OUTPUT"
          fi

  playwright-version:
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.v.outputs.version }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - id: v
        run: echo "version=$(node -p "require('./package-lock.json').packages['node_modules/playwright'].version")" >> "$GITHUB_OUTPUT"

  lint-workflows:
    if: ${{ needs.changes.outputs.code == 'true' && !contains(fromJSON(needs.select-jobs.outputs.skip-json || '[]'), 'lint-workflows') }}
    name: 'validate workflow syntax'
    runs-on: ubuntu-24.04
    needs:
      - select-jobs
      - changes
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - name: Install actionlint
        run: |
          # Download and install actionlint
          bash <(curl https://raw.githubusercontent.com/rhysd/actionlint/main/scripts/download-actionlint.bash)
          echo "$PWD" >> $GITHUB_PATH

      - name: Validate workflows
        run: |
          # Run actionlint with relaxed checking
          # - Ignore shellcheck info/style warnings that don't affect execution
          # - Ignore type mismatch false positives for quoted 'true'/'false' strings
          # - Only fail on actual syntax errors that prevent workflows from running
          ./actionlint \
            -ignore 'SC2001' \
            -ignore 'SC2002' \
            -ignore 'SC2015' \
            -ignore 'SC2016' \
            -ignore 'SC2076' \
            -ignore 'SC2086' \
            -ignore 'SC2129' \
            -ignore 'SC2155' \
            -ignore 'SC2207' \
            -ignore 'bool value cannot be assigned' \
            .github/workflows/*.yml

      - name: Setup Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: ${{ env.NODE_VERSION }}

      - name: Validate nested workflow_call permissions
        run: node scripts/check-workflow-permissions.mjs

  lint-js:
    if: ${{ needs.changes.outputs.code == 'true' && !contains(fromJSON(needs.select-jobs.outputs.skip-json || '[]'), 'lint-js') }}
    name: 'eslint'
    runs-on: ubuntu-24.04
    needs:
      - select-jobs
      - changes
    # Gates JavaScript files this change ADDS, and reports the repository total without failing on
    # it. Linting everything would be red on every run until a backlog of pre-existing findings is
    # cleared, and a check that is always red teaches everyone to ignore red, the way an alarm that
    # fires every night does. Gating modified files instead would force reformatting lines the
    # change never touched, which CLAUDE.md forbids. A new file has no such history, so it is the
    # one place the gate can bite without arguing with either rule.
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0

      - name: Setup Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'

      - run: timeout 120 npm ci --prefer-offline || { sleep 30; timeout 180 npm ci; }
        timeout-minutes: 6
        env:
          NPM_CONFIG_FETCH_RETRIES: "3"

      - name: Report the repository-wide finding count
        id: repo-count
        run: |
          set +e
          eslint_json=$(npx eslint . --format json)
          eslint_exit=$?
          set -e
          if [ "$eslint_exit" -ge 2 ]; then
            echo "eslint could not run (exit ${eslint_exit}) — see the job log above for the crash, not 0 findings." >> "$GITHUB_STEP_SUMMARY"
            echo "ran=false" >> "$GITHUB_OUTPUT"
          else
            # no-unsanitized/* (web/public HTML inline scripts and JS) is tracked as its own
            # ratchet below, separately from every other rule, so a fix there can never mask
            # a new finding from an unrelated rule anywhere else in the repository.
            errors=$(printf '%s' "$eslint_json" | jq '[.[].messages[] | select(.severity == 2) | select(.ruleId | startswith("no-unsanitized/") | not)] | length')
            warnings=$(printf '%s' "$eslint_json" | jq '[.[].messages[] | select(.severity == 1) | select(.ruleId | startswith("no-unsanitized/") | not)] | length')
            unsanitized_errors=$(printf '%s' "$eslint_json" | jq '[.[].messages[] | select(.severity == 2) | select(.ruleId | startswith("no-unsanitized/"))] | length')
            unsanitized_warnings=$(printf '%s' "$eslint_json" | jq '[.[].messages[] | select(.severity == 1) | select(.ruleId | startswith("no-unsanitized/"))] | length')
            echo "eslint reports ${errors} error(s) and ${warnings} warning(s) across the repository, plus ${unsanitized_errors} no-unsanitized error(s) and ${unsanitized_warnings} no-unsanitized warning(s) in web/public." >> "$GITHUB_STEP_SUMMARY"
            echo "ran=true" >> "$GITHUB_OUTPUT"
            echo "errors=${errors}" >> "$GITHUB_OUTPUT"
            echo "warnings=${warnings}" >> "$GITHUB_OUTPUT"
            echo "unsanitized_errors=${unsanitized_errors}" >> "$GITHUB_OUTPUT"
            echo "unsanitized_warnings=${unsanitized_warnings}" >> "$GITHUB_OUTPUT"
          fi
          echo "This step never fails; the gate below covers the files this change touches." >> "$GITHUB_STEP_SUMMARY"

      - name: Ratchet the repository-wide error count against the baseline
        if: steps.repo-count.outputs.ran == 'true'
        run: |
          current_errors='${{ steps.repo-count.outputs.errors }}'
          current_warnings='${{ steps.repo-count.outputs.warnings }}'
          baseline_errors=$(jq '.errors' .eslint-baseline.json)
          baseline_warnings=$(jq '.warnings' .eslint-baseline.json)
          echo "Baseline: ${baseline_errors} error(s), ${baseline_warnings} warning(s) (.eslint-baseline.json)." >> "$GITHUB_STEP_SUMMARY"
          echo "Current: ${current_errors} error(s), ${current_warnings} warning(s)." >> "$GITHUB_STEP_SUMMARY"
          if [ "$current_errors" -gt "$baseline_errors" ]; then
            echo "eslint error count rose from ${baseline_errors} to ${current_errors}. Fix the new errors, or lower the baseline only by fixing findings, never by raising the number." >> "$GITHUB_STEP_SUMMARY"
            exit 1
          fi
          if [ "$current_errors" -lt "$baseline_errors" ] || [ "$current_warnings" -lt "$baseline_warnings" ]; then
            echo "Findings dropped below the baseline. Commit this as the new .eslint-baseline.json:" >> "$GITHUB_STEP_SUMMARY"
            echo '```json' >> "$GITHUB_STEP_SUMMARY"
            printf '{\n  "errors": %s,\n  "warnings": %s\n}\n' "$current_errors" "$current_warnings" >> "$GITHUB_STEP_SUMMARY"
            echo '```' >> "$GITHUB_STEP_SUMMARY"
          fi

      - name: Ratchet the web/public unsanitized-HTML count against the baseline
        if: steps.repo-count.outputs.ran == 'true'
        run: |
          current_errors='${{ steps.repo-count.outputs.unsanitized_errors }}'
          current_warnings='${{ steps.repo-count.outputs.unsanitized_warnings }}'
          baseline_errors=$(jq '.unsanitizedErrors' .eslint-baseline.json)
          baseline_warnings=$(jq '.unsanitizedWarnings' .eslint-baseline.json)
          echo "no-unsanitized baseline: ${baseline_errors} error(s), ${baseline_warnings} warning(s) (.eslint-baseline.json)." >> "$GITHUB_STEP_SUMMARY"
          echo "no-unsanitized current: ${current_errors} error(s), ${current_warnings} warning(s)." >> "$GITHUB_STEP_SUMMARY"
          if [ "$current_errors" -gt "$baseline_errors" ]; then
            echo "no-unsanitized error count in web/public rose from ${baseline_errors} to ${current_errors}. Fix the new unsanitized DOM write, or lower the baseline only by fixing findings, never by raising the number." >> "$GITHUB_STEP_SUMMARY"
            exit 1
          fi
          if [ "$current_errors" -lt "$baseline_errors" ] || [ "$current_warnings" -lt "$baseline_warnings" ]; then
            echo "no-unsanitized findings dropped below the baseline. Commit this as the new .eslint-baseline.json unsanitizedErrors/unsanitizedWarnings:" >> "$GITHUB_STEP_SUMMARY"
            echo '```json' >> "$GITHUB_STEP_SUMMARY"
            printf '{\n  "unsanitizedErrors": %s,\n  "unsanitizedWarnings": %s\n}\n' "$current_errors" "$current_warnings" >> "$GITHUB_STEP_SUMMARY"
            echo '```' >> "$GITHUB_STEP_SUMMARY"
          fi

      - name: Lint the JavaScript this change adds
        run: |
          base=$(git merge-base origin/${{ github.event.repository.default_branch }} HEAD || true)
          if [ -z "$base" ]; then
            echo "No merge base against the default branch; nothing to gate." >> "$GITHUB_STEP_SUMMARY"
            exit 0
          fi
          added=$(git diff --name-only --diff-filter=A "$base" HEAD -- '*.js' '*.mjs' '*.cjs')
          if [ -z "$added" ]; then
            echo "This change adds no JavaScript file, so there is nothing to gate." >> "$GITHUB_STEP_SUMMARY"
            exit 0
          fi
          echo "Linting $(echo "$added" | wc -l | tr -d ' ') newly added file(s):" >> "$GITHUB_STEP_SUMMARY"
          echo "$added" >> "$GITHUB_STEP_SUMMARY"
          echo "$added" | xargs npx eslint

      - name: Check formatting (Prettier)
        run: npx prettier --check .

      - uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961 # v5
        with:
          distribution: 'temurin'
          java-version: ${{ env.JAVA_VERSION }}
          cache: 'maven'

      - name: Check formatting (Spotless)
        run: ./mvnw spotless:check

  params:
    runs-on: ubuntu-24.04
    steps:
      - name: "github.event_name=[${{ github.event_name }}]"
        run: ":"
      - name: "github.ref=[${{ github.ref }}]"
        run: ":"
      - name: "inputs.environment-name=[${{ inputs.environment-name }}]"
        run: ":"
      - name: "inputs.deployment-name=[${{ inputs.deployment-name }}]"
        run: ":"
      - name: "inputs.runProxyBehaviourTests=[${{ inputs.runProxyBehaviourTests }}]"
        run: ":"
      - name: Normalise Params
        id: normalise
        shell: bash
        run: |
          # Convert '(auto)' to empty string for downstream processing
          ENV_NAME='${{ inputs.environment-name }}'; [[ "$ENV_NAME" == "(auto)" ]] && ENV_NAME=""
          echo "environment-name=${ENV_NAME}" | tee -a "$GITHUB_OUTPUT"
          # Resolve GitHub Actions environment from explicit input or branch
          GH_ENV="${ENV_NAME}"
          if [ -z "$GH_ENV" ]; then
            if [ "${{ github.ref }}" == "refs/heads/main" ]; then GH_ENV="prod"; else GH_ENV="ci"; fi
          fi
          echo "github-environment=${GH_ENV}" | tee -a "$GITHUB_OUTPUT"
          echo 'deployment-name=${{ inputs.deployment-name }}' | tee -a "$GITHUB_OUTPUT"
          X='${{ inputs.runProxyBehaviourTests }}' ; echo "runProxyBehaviourTests=${X:-false}" | tee -a "$GITHUB_OUTPUT"
    outputs:
      environment-name: ${{ steps.normalise.outputs.environment-name }}
      deployment-name: ${{ steps.normalise.outputs.deployment-name }}
      runProxyBehaviourTests: ${{ steps.normalise.outputs.runProxyBehaviourTests }}
      github-environment: ${{ steps.normalise.outputs.github-environment }}

  # Reasoned job filter (proof of concept): asks a model which of the jobs below, already
  # mechanically gated on `needs.changes.outputs.code`, have nothing left to prove for this
  # diff. Its answer only ADDS skips on top of that mechanical gate - it can turn a job that
  # would run into a skip, never the reverse - and a malformed, failed, budget/kill-switch
  # skipped, or main-branch answer is read as "skip nothing", so every gated job still runs.
  #
  # This job carries NO job-level `if:` and sets `continue-on-error: true`, so it always reports
  # 'success' to every job that needs it, whatever happens inside it. Both are required, not
  # decorative: GitHub Actions applies an implicit `success()` check to a dependent job's `if:`
  # whenever that `if:` does not itself reference a status function (always()/success()/
  # failure()/cancelled()), and success() is false when a needed job was skipped OR failed - so
  # a select-jobs job that could be skipped (a job-level `if:`) or fail (an unhandled step error)
  # would silently skip every job below it, including the required npm test/maven test/eslint
  # status contexts, on exactly the runs (main, a kill-switched or budget-exhausted call) where
  # running everything matters most. See:
  # https://docs.github.com/en/actions/using-jobs/using-jobs-in-a-workflow - "If a job fails or
  # is skipped, all jobs that need it are skipped unless the jobs use a conditional expression
  # that causes the job to continue."
  # https://docs.github.com/en/actions/learn-github-actions/expressions#status-check-functions -
  # "A default status check of success() is applied unless you include one of these functions."
  # A job whose steps fail but which itself carries `continue-on-error: true` still reports
  # `success` to a downstream `needs.<job>.result` (confirmed against
  # https://www.kenmuse.com/blog/how-to-handle-step-and-job-errors-in-github-actions/, which
  # traces this exact case), so that field covers a genuine step failure (Bedrock error, a
  # crashed script) the same way the internal gating below covers main, the budget and the kill
  # switch. The `select-jobs.mjs decide` step (`if: always()`) is what actually turns every one
  # of those cases into "skip nothing" (`decideForContext`, unit tested for each), so the job
  # reporting success is necessary but not sufficient on its own - both layers matter.
  select-jobs:
    name: 'select jobs'
    needs:
      - params
    continue-on-error: true
    runs-on: ubuntu-24.04
    # `continue-on-error: true` reports a step FAILURE inside this job as `success` downstream,
    # but a job cancelled by hitting its own `timeout-minutes` is not a step failure - it reports
    # `cancelled`, which the same default success() gate below would still read as "skip
    # everything". 10 minutes is generous headroom for what this job actually does (git, npm
    # install -g, one small Bedrock call) so that path stays theoretical rather than mitigated.
    timeout-minutes: 10
    # `npm-test-cdk-ci` below already declares `environment: ci` unconditionally - including on
    # every run this workflow serves for a PROD deploy from main via deploy.yml's workflow_call -
    # so this job doing the same is the existing, proven pattern, not a new risk. The eligibility
    # check below means the ci-scoped AWS role chain is never actually exercised on main anyway.
    environment: ci
    permissions:
      contents: read
      id-token: write
      actions: read
    env:
      CLAUDE_CODE_VERSION: '2.0.30'
      MODEL_ID: 'eu.anthropic.claude-haiku-4-5-20251001-v1:0'
      OUT_DIR: '/tmp/select-jobs'
      # The one place this number is written, same convention as alarm-triage.yml's and
      # support-triage.yml's own budgets. This path is called on every branch push rather than
      # per issue or per dispatch, so the budget bounds Bedrock spend on a runaway push loop
      # rather than reflecting a single call's cost.
      SELECT_JOBS_BUDGET_PER_DAY: '200'
      # 'advisory' records what the model would have skipped in the decision artifact but always
      # reports skip-json=[], so every job below still runs. 'enforcing' lets skip-json turn a
      # job off. See select-jobs.mjs's module comment for what each mode does.
      SELECT_JOBS_MODE: 'advisory'
    outputs:
      skip-json: ${{ steps.decide.outputs.skip-json }}
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0

      # Cheap and unconditional: every step below that touches the budget, AWS or Bedrock is
      # gated on this, but the eligibility that actually matters for correctness is
      # `decideForContext`'s own `isEligibleRef` check in the final "Parse the answer" step -
      # this is a cost optimisation on top of that, never its replacement.
      - name: Decide whether this ref is eligible for a job-selection call
        id: eligibility
        run: |
          if [ "${{ github.ref }}" = "refs/heads/main" ]; then
            echo "eligible=false" | tee -a "$GITHUB_OUTPUT"
          else
            echo "eligible=true" | tee -a "$GITHUB_OUTPUT"
          fi

      - name: Stop once ${{ env.SELECT_JOBS_BUDGET_PER_DAY }} decisions have already posted today
        id: budget-guard
        if: steps.eligibility.outputs.eligible == 'true'
        uses: ./.github/actions/agent-run-budget
        with:
          workflow-file: test.yml
          job-name: select jobs
          step-name: Parse the answer
          budget: ${{ env.SELECT_JOBS_BUDGET_PER_DAY }}

      - name: Configure AWS role via GitHub OIDC
        if: steps.eligibility.outputs.eligible == 'true' && steps.budget-guard.outputs.over-budget == 'false'
        uses: aws-actions/configure-aws-credentials@e1253824e5c10ff9df46874f81ed3ec929e19cfd # v6
        with:
          role-to-assume: ${{ vars.SUBMIT_ACTIONS_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}
          role-chaining: false
          audience: sts.amazonaws.com
          role-skip-session-tagging: true
          output-credentials: true
          retry-max-attempts: 3

      - name: Assume the read-only alarm triage role
        if: steps.eligibility.outputs.eligible == 'true' && steps.budget-guard.outputs.over-budget == 'false'
        uses: aws-actions/configure-aws-credentials@e1253824e5c10ff9df46874f81ed3ec929e19cfd # v6
        with:
          role-to-assume: ${{ vars.SUBMIT_ALARM_TRIAGE_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}
          role-chaining: true
          audience: sts.amazonaws.com
          role-skip-session-tagging: true
          output-credentials: true
          retry-max-attempts: 3

      - name: Stop when the agent kill switch is on
        if: steps.eligibility.outputs.eligible == 'true' && steps.budget-guard.outputs.over-budget == 'false'
        id: kill-switch
        uses: ./.github/actions/agent-kill-switch
        with:
          environment-name: ci

      # Unconditional (not gated like the steps around it): the final "Parse the answer" step
      # (`if: always()`) needs a working `node` on every path, including one where every step
      # below this is skipped.
      - name: Set up Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: ${{ env.NODE_VERSION }}

      - name: Install Claude Code
        if: >-
          steps.eligibility.outputs.eligible == 'true' && steps.budget-guard.outputs.over-budget == 'false' &&
          steps.kill-switch.conclusion != 'failure'
        run: npm install -g "@anthropic-ai/claude-code@${CLAUDE_CODE_VERSION}"

      - name: Find the last green run of this workflow on this branch
        id: last-green
        if: >-
          steps.eligibility.outputs.eligible == 'true' && steps.budget-guard.outputs.over-budget == 'false' &&
          steps.kill-switch.conclusion != 'failure'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          mkdir -p "${OUT_DIR}"
          sha=$(gh run list --repo "${{ github.repository }}" --workflow test.yml \
                  --branch "${{ github.ref_name }}" --status success --limit 1 \
                  --json headSha --jq '.[0].headSha // empty' || true)
          echo "sha=${sha}" | tee -a "$GITHUB_OUTPUT"

      - name: Build the diff and changed-files inputs
        id: diff
        if: >-
          steps.eligibility.outputs.eligible == 'true' && steps.budget-guard.outputs.over-budget == 'false' &&
          steps.kill-switch.conclusion != 'failure'
        env:
          LAST_GREEN_SHA: ${{ steps.last-green.outputs.sha }}
        run: |
          set -euo pipefail
          if [ -n "${LAST_GREEN_SHA}" ] && git cat-file -e "${LAST_GREEN_SHA}^{commit}" 2>/dev/null; then
            range="${LAST_GREEN_SHA}..${{ github.sha }}"
          else
            git fetch origin '${{ github.event.repository.default_branch }}' --quiet
            range="origin/${{ github.event.repository.default_branch }}...HEAD"
          fi
          echo "comparing ${range}" | tee -a "$GITHUB_STEP_SUMMARY"
          git diff "${range}" > "${OUT_DIR}/diff.txt"
          git diff --name-only "${range}" > "${OUT_DIR}/changed-files.txt"
          echo "range=${range}" | tee -a "$GITHUB_OUTPUT"

      - name: Write the invocation context
        id: context
        if: >-
          steps.eligibility.outputs.eligible == 'true' && steps.budget-guard.outputs.over-budget == 'false' &&
          steps.kill-switch.conclusion != 'failure'
        run: |
          set -euo pipefail
          jq -n \
            --arg eventName '${{ github.event_name }}' \
            --arg ref '${{ github.ref }}' \
            --arg refName '${{ github.ref_name }}' \
            --arg environmentName '${{ needs.params.outputs.environment-name }}' \
            --arg githubEnvironment '${{ needs.params.outputs.github-environment }}' \
            --arg deploymentName '${{ needs.params.outputs.deployment-name }}' \
            --arg runProxyBehaviourTests '${{ needs.params.outputs.runProxyBehaviourTests }}' \
            --arg lastGreenSha '${{ steps.last-green.outputs.sha }}' \
            --arg comparedRange '${{ steps.diff.outputs.range }}' \
            '{eventName: $eventName, ref: $ref, refName: $refName, environmentName: $environmentName, githubEnvironment: $githubEnvironment, deploymentName: $deploymentName, runProxyBehaviourTests: $runProxyBehaviourTests, lastGreenSha: $lastGreenSha, comparedRange: $comparedRange}' \
            > "${OUT_DIR}/context.json"

      - name: Build the prompt
        id: prompt
        if: >-
          steps.eligibility.outputs.eligible == 'true' && steps.budget-guard.outputs.over-budget == 'false' &&
          steps.kill-switch.conclusion != 'failure'
        run: |
          set -euo pipefail
          node scripts/ci/select-jobs.mjs prompt \
            --context "${OUT_DIR}/context.json" \
            --diff "${OUT_DIR}/diff.txt" \
            --changed-files "${OUT_DIR}/changed-files.txt" \
            --catalogue test.yml \
            > "${OUT_DIR}/prompt.txt"
          echo "prompt-hash=$(sha256sum "${OUT_DIR}/prompt.txt" | cut -d' ' -f1)" | tee -a "$GITHUB_OUTPUT"

      - name: Run the job-selection agent
        if: >-
          steps.eligibility.outputs.eligible == 'true' && steps.budget-guard.outputs.over-budget == 'false' &&
          steps.kill-switch.conclusion != 'failure'
        id: run
        env:
          CLAUDE_CODE_USE_BEDROCK: '1'
          AWS_REGION: ${{ env.AWS_REGION }}
          ANTHROPIC_MODEL: ${{ env.MODEL_ID }}
          ANTHROPIC_SMALL_FAST_MODEL: ${{ env.MODEL_ID }}
          DISABLE_TELEMETRY: '1'
          DISABLE_ERROR_REPORTING: '1'
          DISABLE_AUTOUPDATER: '1'
        run: |
          set -o pipefail
          claude -p \
            --max-turns 6 \
            --output-format json \
            --permission-mode default \
            --disallowedTools "Bash,Edit,Write,WebFetch,WebSearch" \
            --allowedTools "Read,Grep,Glob" \
            < "${OUT_DIR}/prompt.txt" \
            2>&1 | tee "${OUT_DIR}/claude-output.json"

      # Always runs, whatever happened above (not eligible, over budget, kill switch on, or the
      # agent step itself failed) - decideForContext (unit tested) turns every one of those into
      # "skip nothing" rather than this step ever throwing.
      - name: Parse the answer
        id: decide
        if: always()
        run: |
          set -euo pipefail
          mkdir -p "${OUT_DIR}"
          SKIP_JSON=$(node scripts/ci/select-jobs.mjs decide \
            --ref "${{ github.ref }}" \
            --claude-output "${OUT_DIR}/claude-output.json" \
            --context "${OUT_DIR}/context.json" \
            --model-id "${{ env.MODEL_ID }}" \
            --prompt-hash "${{ steps.prompt.outputs.prompt-hash }}" \
            --catalogue test.yml \
            --mode "${SELECT_JOBS_MODE}" \
            --out "${OUT_DIR}/decision.json")
          echo "skip-json=${SKIP_JSON}" | tee -a "$GITHUB_OUTPUT"

      # deploy.yml calls this workflow with `uses:` (job "test"), and `github.run_id` inside a
      # called workflow is the CALLER's run id - so a deploy.yml run carries both this job's
      # artifact and deploy.yml's own select-jobs job's artifact under the same run id.
      # upload-artifact refuses two artifacts of the same name in one run, so the name is
      # prefixed by which catalogue produced it.
      - name: Save the decision artifact
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: select-jobs-decision-test-${{ github.run_id }}
          path: ${{ env.OUT_DIR }}/decision.json
          if-no-files-found: warn
          retention-days: 30

