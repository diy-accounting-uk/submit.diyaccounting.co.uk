  # Proxy behaviour test - requires Docker and HMRC sandbox secrets
  # Uses manual Playwright install (not container) because Docker is needed for mock-oauth2-server
  behaviour-test-proxy-submit-vat:
    if: ${{ needs.changes.outputs.code == 'true' && !cancelled() && needs.params.outputs.runProxyBehaviourTests == 'true' }}
    name: 'proxy - submitVatBehaviour'
    needs:
      - changes
      - params
      - names
    runs-on: ubuntu-24.04
    # Always ci: the job tests a local server with the cert and HMRC sandbox
    # secrets held in submit-ci, regardless of which branch dispatched it.
    environment: ci
    permissions:
      contents: read
      id-token: write
    steps:
      - name: Set up Docker
        uses: docker/setup-buildx-action@594f3bf4285d9ea8dc53c9a0c9c4092420091003 # v4
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - name: Configure AWS role via GitHub OIDC
        uses: aws-actions/configure-aws-credentials@e1253824e5c10ff9df46874f81ed3ec929e19cfd # v6
        with:
          role-to-assume: ${{ vars.SUBMIT_ACTIONS_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}
          role-chaining: false
          audience: sts.amazonaws.com
          role-skip-session-tagging: true
          output-credentials: true
          retry-max-attempts: 3

      - name: Assume AWS deployment role
        uses: aws-actions/configure-aws-credentials@e1253824e5c10ff9df46874f81ed3ec929e19cfd # v6
        with:
          role-to-assume: ${{ vars.SUBMIT_DEPLOY_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}
          role-chaining: true
          audience: sts.amazonaws.com
          role-skip-session-tagging: true
          output-credentials: true
          retry-max-attempts: 3

      - name: Setup Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'

      - name: Install dependencies
        run: |
          npm install
          npx playwright install chromium --with-deps

      - name: Resolve the local hostname to loopback
        run: echo "127.0.0.1 local.submit.diyaccounting.co.uk" | sudo tee -a /etc/hosts

      - name: Fetch the local TLS certificate
        run: |
          aws secretsmanager get-secret-value \
            --secret-id "$LOCAL_TLS_SECRET_ARN" --region "$AWS_REGION" \
            --query SecretString --output text > "$RUNNER_TEMP/local-tls.json"
          jq -r .fullchain "$RUNNER_TEMP/local-tls.json" > "$RUNNER_TEMP/local-tls.pem"
          jq -r .privkey   "$RUNNER_TEMP/local-tls.json" > "$RUNNER_TEMP/local-tls.key"
          chmod 600 "$RUNNER_TEMP/local-tls.key"
        env:
          LOCAL_TLS_SECRET_ARN: arn:aws:secretsmanager:eu-west-2:367191799875:secret:ci/submit/local-tls/certificate

      - name: Run behaviour tests - submit vat
        run: |
          npm run test:submitVatBehaviour-proxy || exit_code=$? \
          ; cp ./target/submit*.log ./target/behaviour-test-results/ || true \
          ; exit ${exit_code:-0} \
          ;
        env:
          HMRC_ACCOUNT: synthetic
          HMRC_SANDBOX_CLIENT_SECRET: ${{ secrets.HMRC_SANDBOX_CLIENT_SECRET }}
          TEST_SERVER_TLS: run
          TEST_SERVER_TLS_CERT: ${{ runner.temp }}/local-tls.pem
          TEST_SERVER_TLS_KEY: ${{ runner.temp }}/local-tls.key
