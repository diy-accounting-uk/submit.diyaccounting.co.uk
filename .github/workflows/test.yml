          DEPLOYMENT_NAME: 'ci'
          SELF_DESTRUCT_HANDLER_SOURCE: "../${{ steps.mvn-verify.outputs.SELF_DESTRUCT_HANDLER_SOURCE }}"
          SELF_DESTRUCT_START_DATETIME: ${{ steps.self-destruct-start.outputs.SELF_DESTRUCT_START_DATETIME }}
          # Looked up from Cognito domain convention
          COGNITO_USER_POOL_ARN: ${{ steps.lookup.outputs.cognito-user-pool-arn }}
          COGNITO_CLIENT_ID: ${{ steps.lookup.outputs.cognito-client-id }}

