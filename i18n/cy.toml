cy = '''Mae blychau 1 i 5 yn dangos y TAW sy’n ddyledus ar eich gwerthiannau, y TAW y gallwch ei hadennill ar bryniadau, a’r swm net. Blwch 5 yw blwch 3 llai blwch 4: y TAW rydych yn ei thalu i CThEF neu’n ei hadennill. Mae’r symiau mewn punnoedd a cheiniogau.'''

[strings."vat-view-return.explain-turnover"]
hash = "c29228ff023e"
cy = '''Mae blychau 6 i 9 yn dangos gwerth eich gwerthiannau a’ch pryniadau heb TAW, mewn punnoedd cyfan. Maen nhw ar wahân i’r TAW ym mlychau 1 i 5.'''

[strings."vat-view-return.explain-declaration"]
hash = "f925b5226246"
cy = '''Mae ‘Wedi’i chwblhau’ yn dangos a gafodd y Ffurflen TAW ei chadarnhau’n gyflawn pan gafodd ei hanfon. Y datganiad yw’r datganiad bod yr wybodaeth yn y Ffurflen TAW yn gywir ac yn gyflawn.'''

