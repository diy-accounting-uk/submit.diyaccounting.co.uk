# == The list of the site's Welsh services on the Welsh home page: shared."welsh-offer" ==
# web/public/about.html holds the same list in English. Each link names the English file; the build sends it to the Welsh copy.

[shared."welsh-offer"]
cy = '''
<h2 id="welshOfferHeading">Submit yn Gymraeg</h2>
<p>Dyma’r hyn y mae Submit yn ei gynnig yn Gymraeg. Dewiswch ‘Cymraeg’ ar frig unrhyw dudalen, ac mae Submit yn cofio’ch dewis.</p>
<ul>
<li>Tudalennau’r wefan: <a href="get-started.html">dechrau arni</a>, <a href="bundles.html">Bundles</a>, <a href="pass.html">defnyddio tocyn</a>, <a href="tools.html">offer</a>, <a href="mtd-calendar.html">calendr MTD</a>, <a href="rates.html">cyfraddau a lwfansau</a>, <a href="spreadsheets.html">taenlenni</a> a <a href="auth/login.html">mewngofnodi</a>.</li>
<li>TAW gyda CThEF: <a href="hmrc/vat/submitVat.html">cyflwyno Ffurflen TAW</a>, <a href="hmrc/vat/vatObligations.html">rhwymedigaethau TAW</a>, <a href="hmrc/vat/vatLiabilities.html">rhwymedigaethau talu</a>, <a href="hmrc/vat/vatPayments.html">taliadau</a>, <a href="hmrc/vat/vatPenalties.html">cosbau</a>, <a href="hmrc/vat/viewVatReturn.html">bwrw golwg dros Ffurflen TAW</a> a’ch <a href="hmrc/receipt/receipts.html">derbynebau</a>.</li>
<li>Tŷ’r Cwmnïau: <a href="companies-house/companySearch.html">chwilio am gwmni</a>, y <a href="companies-house/watchList.html">rhestr wylio</a>, <a href="companies-house/filings.html">eich ffeilio</a>, <a href="companies-house/fileMicroEntityAccounts.html">cyfrifon micro-endid</a>, <a href="companies-house/fileSmallCompanyAccounts.html">cyfrifon cwmni bach</a>, y <a href="companies-house/fileConfirmationStatement.html">datganiad cadarnhau</a>, y <a href="companies-house/changeRegisteredOffice.html">swyddfa gofrestredig</a> a’r <a href="companies-house/changeRegisteredEmail.html">cyfeiriad e-bost cofrestredig</a>.</li>
<li>Gwybodaeth am y wefan: y <a href="help.html">cymorth a’r cwestiynau cyffredin</a>, y <a href="privacy.html">polisi preifatrwydd</a>, y <a href="terms.html">telerau defnyddio</a> a’r <a href="accessibility.html">datganiad hygyrchedd</a>.</li>
</ul>
<p>Gallwch ysgrifennu atom yn Gymraeg yn <a href="mailto:support@diyaccounting.co.uk">support@diyaccounting.co.uk</a>. Rydym yn ateb yn Saesneg am y tro.</p>
'''

