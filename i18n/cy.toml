cy = '''Ad-daliadau a chanslo'''

[strings."terms.if-a-referred-customer-is-refunded-46c514"]
hash = "46c514e7e60c"
cy = '''Os caiff cwsmer a atgyfeiriwyd ad-daliad, neu os yw’n herio’r taliad, rydym yn gwrthdroi’r comisiwn cyfatebol. Os nad ydym wedi’i dalu, nid yw’n cael ei dalu. Os ydym wedi’i dalu, rydym yn ei gymryd o’ch comisiwn nesaf. Rydym yn cymryd credyd ariannol heb ei ddefnyddio yn ôl.'''

