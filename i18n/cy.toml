cy = '''Cedwir yr adroddiad hwn gyda derbynneb y Ffurflen am saith mlynedd, yr un fath â’r derbynebau ar gyfer Ffurflenni a gyflwynwyd. Nid oes dim yn cael ei anfon at CThEF nes i chi bwyso’r botwm gwirio, a gellir cyflwyno’r Ffurflen p’un a ddefnyddir y gwiriad ai peidio.'''

