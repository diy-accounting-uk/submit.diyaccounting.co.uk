[strings."vat.box-1"]
hash = "fad75272126a"
cy = '''TAW sy’n ddyledus yn y cyfnod ar werthiannau ac allbynnau eraill'''

# VAT Notice 700/12 is in English only (no Welsh page found 2026-11-18): the box definitions are our Welsh of its sentences, in the glossary's terms.
[strings."vat.box-1-definition"]
hash = "63436c4dcf0d"
cy = '''Rhowch y TAW sy’n ddyledus ar yr holl nwyddau a gwasanaethau a gyflenwyd gennych yn y cyfnod y mae’r Ffurflen TAW yn ei gwmpasu.'''

[strings."vat.box-2"]
hash = "e063556b0e51"
cy = '''TAW sy’n ddyledus yn y cyfnod ar gaffael nwyddau a wneir yng Ngogledd Iwerddon o Aelod-wladwriaethau’r UE'''

[strings."vat.box-2-definition"]
hash = "4d4c7ad364ac"
cy = '''Blwch 2: TAW sy’n ddyledus yn y cyfnod ar gaffael nwyddau a wneir yng Ngogledd Iwerddon o Aelod-wladwriaethau’r UE'''

[strings."vat.box-3"]
hash = "9af666eb45a2"
cy = '''Cyfanswm y TAW sy’n ddyledus'''

[strings."vat.box-3-definition"]
hash = "aa315eb3f54e"
cy = '''Dangoswch gyfanswm y TAW sy’n ddyledus, hynny yw, blychau 1 a 2 wedi’u hadio at ei gilydd.'''

[strings."vat.box-4"]
hash = "9dedc512e1e3"
cy = '''TAW a adhawliwyd yn y cyfnod ar bryniannau a mewnbynnau eraill (gan gynnwys caffaeliadau yng Ngogledd Iwerddon o Aelod-wladwriaethau’r UE)'''

[strings."vat.box-4-definition"]
hash = "f504772aa45a"
cy = '''Dangoswch gyfanswm y TAW y gellir ei didynnu a godwyd ar bryniannau eich busnes.'''

[strings."vat.box-5"]
hash = "ca83f7afa2e2"
cy = '''TAW net i dalu i CThEF neu ei hadennill'''

[strings."vat.box-5-definition"]
hash = "6f8e8c9477c6"
cy = '''tynnwch y rhif ym mlwch 4 o’r rhif ym mlwch 3'''

[strings."vat.box-6"]
hash = "ce2ad2982308"
cy = '''Cyfanswm gwerth y gwerthiannau a chyflenwadau eraill, ac eithrio TAW'''

[strings."vat.box-6-definition"]
hash = "ff66a231f5a2"
cy = '''Dangoswch gyfanswm gwerth holl werthiannau eich busnes ac allbynnau penodol eraill, ond heb gynnwys TAW.'''

[strings."vat.box-7"]
hash = "6f102035a2ea"
cy = '''Cyfanswm gwerth y pryniannau a’r holl fewnbynnau eraill, heb gynnwys TAW'''

[strings."vat.box-7-definition"]
hash = "08c5755bdc2b"
cy = '''Dangoswch gyfanswm gwerth eich pryniannau a’ch treuliau, ond heb gynnwys TAW.'''

[strings."vat.box-8"]
hash = "f657b58caf78"
cy = '''Cyfanswm gwerth anfon y nwyddau a’r costau cysylltiedig (ac eithrio TAW) o Ogledd Iwerddon i Aelod-wladwriaethau’r UE'''

[strings."vat.box-8-definition"]
hash = "97522121fb92"
cy = '''Dangoswch gyfanswm gwerth yr holl gyflenwadau o nwyddau i Aelod-wladwriaethau’r UE a’r costau sy’n uniongyrchol gysylltiedig, megis cludo nwyddau ac yswiriant, pan fo’r rhain yn rhan o bris yr anfoneb neu’r contract.'''

[strings."vat.box-9"]
hash = "9ad5a7c308cc"
cy = '''Cyfanswm gwerth caffael y nwyddau a’r costau cysylltiedig (ac eithrio TAW) a wneir yng Ngogledd Iwerddon o Aelod-wladwriaethau’r UE'''

[strings."vat.box-9-definition"]
hash = "407a8c9b2fa3"
cy = '''Blwch 9: cyfanswm gwerth caffael yr holl nwyddau a’r costau cysylltiedig, ac eithrio TAW, o Aelod-wladwriaethau’r UE.'''

