# == Income Tax (LANG10b) ==
# ids itsa.*; add entries below this line.
#
# HMRC's Welsh for Making Tax Digital for Income Tax, from the Welsh message files of HMRC's own Income Tax
# services. Use these words.
#   Income Tax                          Treth Incwm
#   Self Assessment, tax return         Hunanasesiad, Ffurflen Dreth (Income Tax Return: Ffurflen Dreth Incwm)
#   National Insurance number           rhif Yswiriant Gwladol
#   tax year, {0} to {1}                blwyddyn dreth, {0} i {1}
#   quarterly update(s)                 diweddariad chwarterol, diweddariadau chwarterol
#   update period, period               cyfnod diweddaru, cyfnod
#   Updates due by                      Diweddariadau’n ddyledus erbyn
#   obligations                         rhwymedigaethau (as LANG10a: open agored, fulfilled wedi’u cyflawni)
#   Overdue                             Yn hwyr
#   Due date                            Dyddiad dyledus
#   annual submission                   cyflwyniad blynyddol (HMRC: annual updates, diweddariadau blynyddol)
#   tax calculation                     cyfrifiad treth; Income Tax calculation: cyfrifiad Treth Incwm
#   final declaration                   datganiad terfynol
#   Declaration                         Datganiad
#   The legal declaration, the Welsh of HMRC's English in the Income Tax end-to-end service guide
#   (make-updates-at-tax-year-end.html#agreeing-to-the-declaration); Ffurflen Dreth is HMRC's Welsh for tax return.
#   The first sentence is a translation: no gov.uk/cy page gives it. The second is HMRC's own Welsh of the same English
#   sentence, from the declaration (box 22) of the Welsh SA100, Ffurflen Dreth 2026
#   (https://assets.publishing.service.gov.uk/media/69c14db1cfa346b9d4704a94/SA100-Cymraeg-2026.pdf):
#     Rwy’n datgan bod yr wybodaeth a’r Ffurflen Dreth a gyflwynwyd gennyf (o’u hystyried gyda’i gilydd) yn gywir ac yn
#     gyflawn hyd eithaf fy ngwybodaeth. Deallaf y gallai fod yn rhaid i mi dalu cosbau ariannol a chael fy erlyn os
#     rhoddaf wybodaeth anwir.
#   forecast, estimate                  rhagolwg, amcangyfrif
#   Business details, business start date  Manylion y busnes, Dyddiad dechrau’r busnes
#   Self-employment                     Hunangyflogaeth (mid-sentence: hunangyflogaeth)
#   UK property, foreign property       Eiddo yn y DU, Eiddo tramor
#   furnished holiday lettings          llety gwyliau wedi’i ddodrefnu (in the EEA: yn yr AEE)
#   Turnover, income, other income      Trosiant, incwm, incwm arall
#   Expenses, allowable, disallowable   Treuliau, caniataol, na ellir eu caniatáu (anghaniataol)
#   Total income received               Cyfanswm yr incwm a gafwyd
#   Net profit, taxable income          Elw net, incwm trethadwy
#   Adjustments, business adjustments   Addasiadau, addasiadau busnes
#   Allowances, capital allowances      Lwfansau, lwfansau cyfalaf
#   Annual investment allowance         Lwfans Buddsoddi Blynyddol
#   Trading income allowance            Lwfans Incwm Masnachu
#   Property income allowance           Lwfans incwm o eiddo
#   Structures and buildings allowance  Lwfans strwythurau ac adeiladau (enhanced: uwch; Freeport: Porthladd Rhydd)
#   Balancing charge, balancing allowance  Tâl mantoli, lwfans mantoli
#   main rate / special rate / single asset pool  cronfa brif gyfradd / gyfradd arbennig / ased sengl
#   Private use adjustment              Addasiad ar gyfer defnydd preifat
#   Goods and services for own use      Nwyddau a gwasanaethau at eich defnydd eich hun
#   Transition profit amount            Swm elw pontio
#   Residential finance costs           Costau ariannol preswyl
#   Premiums for the grant of a lease   Premiymau am ganiatáu prydles
#   Rent a room                         Rhentu ystafell
#   non-resident landlord               landlord dibreswyl
#   Foreign Tax Credit Relief           Rhyddhad Credyd Treth Tramor
#   Losses, carry forward, set against  Colledion, cario colled ymlaen, gwrthbwyso yn erbyn
#   Class 4 National Insurance          Yswiriant Gwladol Dosbarth 4
#   Capital Gains Tax                   Treth Enillion Cyfalaf
#   Personal Allowance, Marriage Allowance  Lwfans Personol, Lwfans Priodasol
#   Gift Aid, Pension contributions     Rhodd Cymorth, Cyfraniadau pensiwn
# What HMRC's services offer in Welsh (read 17 November 2026):
#   The Income Tax (MTD) API specifications in reference/ (Obligations 3.0, Self Employment Business 5.0, Business
#   Source Adjustable Summary 7.0, Individual Calculations 8.0) define no language header or parameter, and the APIs
#   answer in English; their messages show as received.
#   Self Assessment Assist (MTD) 1.0 answers with one list of messages, in English, and defines no welshFeedback
#   field and no language header (unlike VAT Assist); its messages show as received. Spec read:
#   https://developer.service.hmrc.gov.uk/api-documentation/docs/api/service/self-assessment-assist/1.0/oas/resolved
# Sources (retrieved 17 November 2026):
#   https://github.com/hmrc/income-tax-view-change-frontend/blob/main/conf/messages.cy (updates, deadlines, calculation, final declaration)
