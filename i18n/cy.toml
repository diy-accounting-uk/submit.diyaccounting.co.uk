[strings."itsa.record-explain-total"]
hash = "038bd00b335d"
cy = '''Dyma’r swm y mae CThEF yn cyfrifo sydd arnoch ar gyfer y flwyddyn dreth, sef Treth Incwm ac Yswiriant Gwladol gyda’i gilydd. Mae’n newid pan fyddwch yn anfon rhagor o ffigurau i CThEF.'''

[strings."itsa.record-explain-breakdown"]
hash = "bfb05182dc7d"
cy = '''Mae Treth Incwm ac Yswiriant Gwladol yn cael eu dangos ar eu llinellau eu hunain. Treth a ddidynnwyd eisoes yw treth yr ydych chi neu eraill eisoes wedi’i thalu ar yr incwm hwn.'''

[strings."itsa.record-explain-allowances"]
hash = "b05a56079d3f"
cy = '''Mae lwfansau a didyniadau yn lleihau’r incwm y mae CThEF yn ei drethu. Dewisodd CThEF y llinellau hyn o’r ffigurau yr ydych chi ac eraill wedi’u hanfon. Mae llinell doriad yn golygu na roddodd CThEF ffigur.'''

[strings."itsa.record-explain-businesses"]
hash = "2bec3244dd84"
cy = '''Mae un golofn ar gyfer pob busnes a gyfrifodd CThEF. Mae colled a ddygwyd ymlaen yn dangos lle defnyddiodd CThEF golled o flwyddyn gynharach yn erbyn elw’r flwyddyn hon.'''

