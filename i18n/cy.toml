# Glossary: HMRC's own Welsh terms, from the gov.uk Welsh pages.
#   HMRC                          Cyllid a Thollau EF (CThEF)
#   VAT                           Treth ar Werth (TAW)
#   VAT return                    Ffurflen TAW
#   VAT registration number       rhif cofrestru TAW
#   VAT-registered business       busnes sydd wedi'i gofrestru ar gyfer TAW
#   Income Tax                    Treth Incwm
#   Making Tax Digital            Troi Treth yn Ddigidol
#   Making Tax Digital for VAT    Troi Treth yn Ddigidol ar gyfer TAW
#   Self Assessment               Hunanasesiad
#   tax return                    Ffurflen Dreth
#   PAYE                          TWE
#   National Insurance            Yswiriant Gwladol
#   customs, excise               tollau, ecséis
#   sole traders and landlords    unig fasnachwyr a landlordiaid
#   qualifying income             incwm cymhwysol
#   tax year                      blwyddyn dreth
#   quarterly update              diweddariad chwarterol
#   software                      meddalwedd
#   compatible software           meddalwedd sy'n cydweddu
#   bridging software             meddalwedd bontio
#   digital records               cofnodion digidol
#   obligations                   rhwymedigaethau
#   agent                         asiant
#   Government Gateway user ID    Dynodydd Defnyddiwr (ID) ar gyfer Porth y Llywodraeth
#   Companies House               Tŷ'r Cwmnïau
#   confirmation statement        datganiad cadarnhau
#   helpline                      llinell gymorth
#   bank holidays                 gwyliau banc
