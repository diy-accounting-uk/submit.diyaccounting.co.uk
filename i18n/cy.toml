# == HMRC VAT and receipts (LANG10a) ==
# ids vat.* and receipt.*; add entries below this line.
#
# HMRC's Welsh for the VAT Return, from the Welsh text of HMRC's own VAT services on GOV.UK. Use these words.
#   Box 1 VAT due in the period on sales and other outputs
#         TAW sy’n ddyledus yn y cyfnod ar werthiannau ac allbynnau eraill
#   Box 2 VAT due in the period on acquisitions of goods made in Northern Ireland from EU Member States
#         TAW sy’n ddyledus yn y cyfnod ar gaffael nwyddau a wneir yng Ngogledd Iwerddon o Aelod-wladwriaethau’r UE
#   Box 3 Total VAT due (this is the total of box 1 and 2)
#         Cyfanswm y TAW sy’n ddyledus (dyma gyfanswm blychau 1 a 2)
#   Box 4 VAT reclaimed in the period on purchases and other inputs (including acquisitions in Northern Ireland from EU member states)
#         TAW a adhawliwyd yn y cyfnod ar bryniadau a mewnbynnau eraill (gan gynnwys caffaeliadau yng Ngogledd Iwerddon o Aelod-wladwriaethau’r UE)
#   Box 5 Net VAT to pay to HMRC or reclaim (this is the difference between box 3 and 4)
#         TAW net i dalu i CThEF neu ei hadennill (dyma’r gwahaniaeth rhwng blychau 3 a 4)
#   Box 6 Total value of sales and other supplies, excluding VAT
#         Cyfanswm gwerth y gwerthiannau a chyflenwadau eraill, ac eithrio TAW
#   Box 7 Total value of purchases and all other inputs excluding any VAT
#         Cyfanswm gwerth y pryniadau a’r holl fewnbynnau eraill, heb gynnwys TAW
#   Box 8 Total value of dispatches of goods and related costs (excluding VAT) from Northern Ireland to EU Member States
#         Cyfanswm gwerth anfon y nwyddau a’r costau cysylltiedig (ac eithrio TAW) o Ogledd Iwerddon i Aelod-wladwriaethau’r UE
#   Box 9 Total value of acquisitions of goods and related costs (excluding VAT) made in Northern Ireland from EU Member States
#         Cyfanswm gwerth caffael y nwyddau a’r costau cysylltiedig (ac eithrio TAW) a wneir yng Ngogledd Iwerddon o Aelod-wladwriaethau’r UE
#   Box (n), in box (n), boxes      Blwch (n), ym Mlwch (n), blychau
#   Declaration                     Datganiad
#   The legal declaration (HMRC's Welsh, used word for word; it is not a translation of our English):
#     Drwy gyflwyno’r Ffurflen TAW hon, rydych yn gwneud datganiad cyfreithiol bod yr wybodaeth yn gywir ac yn gyflawn
#     hyd eithaf eich gwybodaeth a’ch cred. Gall datganiad ffug arwain at erlyniad.
#   Submit return                   Cyflwyno Ffurflen TAW
#   You have submitted a VAT Return Rydych wedi cyflwyno Ffurflen TAW
#   Submitted returns               Ffurflenni TAW wedi’u cyflwyno
#   View VAT Return                 Bwrw golwg dros y Ffurflen TAW
#   VAT period, accounting period   Cyfnod TAW, cyfnod cyfrifyddu
#   for the period {0}              ar gyfer y cyfnod {0}
#   {date} to {date}                {date} hyd at {date}
#   Return deadlines                Dyddiadau cau ar gyfer cyflwyno
#   Return due date                 Dyddiad cau ar gyfer cyflwyno’r Ffurflen TAW
#   obligations (open, fulfilled)   rhwymedigaethau (agored, wedi’u cyflawni)
#   We received your return         Cawsom eich Ffurflen TAW
#   What you owe                    Yr hyn sydd arnoch
#   Due date                        Dyddiad dyledus
#   Amount due, Total               Swm sy’n ddyledus, Cyfanswm
#   Left to pay                     Yn weddill i’w dalu
#   Amount received                 Swm a gafwyd
#   Payment history, payment        Hanes taliadau, taliad
#   liability                       rhwymedigaeth (HMRC: Rhwymedigaeth TAW); our VAT liabilities page says
#                                   rhwymedigaethau talu TAW, to tell it from the obligations page
#   Balance                         Balans
#   Overdue charge                  Tâl am fod yn hwyr
#   Payment on account instalment   Rhandaliad taliad ar gyfrif
#   repayment                       ad-daliad
#   Penalty, penalty type, amount   Cosb, Math o gosb, Swm y gosb
#   Penalty point, points total     Pwynt cosb, Cyfanswm pwyntiau cosb
#   penalty points threshold        trothwy pwyntiau cosb
#   Late submission penalties       Cosbau am gyflwyno’n hwyr
#   Late payment penalties          Cosbau am dalu’n hwyr
#   Late payment interest           Llog am dalu’n hwyr
#   (estimate)                      (amcangyfrif)
#   appeal                          apêl
#   Error:, There is a problem      Gwall:, Mae problem wedi codi
#   Sign out                        Allgofnodi
#   insolvent                       ansolfent
#   month names                     Ionawr, Chwefror, Mawrth, Ebrill, Mai, Mehefin, Gorffennaf, Awst, Medi, Hydref, Tachwedd, Rhagfyr
# What HMRC's services offer in Welsh (read 17 November 2026):
#   The VAT (MTD) API 1.0 takes no language header and answers in English; its messages show as received.
#   HMRC Assist answers in both languages, welshFeedback beside englishFeedback; a Welsh reader sees the Welsh first.
#   The authorise address (/oauth/authorize) takes no language parameter; HMRC's sign-in pages carry their own
#   Cymraeg link. The callback address stays as registered and sends a Welsh reader back to the Welsh copy.
# Our own terms on these pages:
#   receipt                         derbynneb (plural derbynebau)
