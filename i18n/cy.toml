[strings."privacy.corporation-tax-filing-data-collected-when-d5ce63"]
hash = "d5ce630993d4"
cy = '''<strong>Data ffeilio Treth Gorfforaeth</strong>: Yn cael ei gasglu pan fyddwch yn ffeilio Ffurflen Dreth y Cwmni. Mae Dynodydd Defnyddiwr (ID) a chyfrinair Porth y Llywodraeth yn cael eu defnyddio unwaith ac nid ydynt yn cael eu cadw. Mae’r dderbynneb, gyda’r CT600, y cyfrifon a’r cyfrifiannau, yn cael ei storio yn DynamoDB am 7 mlynedd.'''

