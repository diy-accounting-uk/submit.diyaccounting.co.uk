[strings."terms.these-terms-of-use-terms-govern-b50025"]
hash = "b50025572f03"
cy = '''Mae’r Telerau Defnyddio hyn (“Telerau”) yn rheoli eich mynediad at DIY Accounting Submit&trade; (“y Gwasanaeth”), a ddarperir gan DIY Accounting Limited (rhif cwmni 06846849), a’ch defnydd ohono. Drwy ddefnyddio’r Gwasanaeth, rydych yn cytuno i’r Telerau hyn ac i’n <a href="./privacy.html">Polisi Preifatrwydd</a>.'''

[strings."terms.1-what-the-service-does-3a7da1"]
hash = "3a7da1343a4e"
cy = '''1. Yr hyn y mae’r Gwasanaeth yn ei wneud'''

[strings."terms.diy-accounting-submit-is-a-web-732339"]
hash = "73233923f9c7"
cy = '''Rhaglen we yw DIY Accounting Submit sy’n helpu busnesau yn y DU a’u cyfrifwyr i anfon ffeiliadau at CThEF a Thŷ’r Cwmnïau, ac i gadw’r llyfrau sy’n sail iddynt. Mae’r Gwasanaeth yn cynnig:'''

[strings."terms.vat-making-tax-digital-view-vat-6c4117"]
hash = "6c41179d7329"
cy = '''<strong>TAW (Troi Treth yn Ddigidol).</strong> Gweld rhwymedigaethau, rhwymedigaethau talu (<span lang="en-GB">liabilities</span>), taliadau a chosbau TAW. Cyflwyno Ffurflenni TAW i CThEF. Gweld Ffurflenni a gyflwynwyd a derbynebau.'''

[strings."terms.income-tax-self-assessment-making-tax-9f8dc2"]
hash = "9f8dc239ebed"
cy = '''<strong>Hunanasesiad Treth Incwm (Troi Treth yn Ddigidol ar gyfer Treth Incwm).</strong> Rheoli manylion busnes a rhwymedigaethau, anfon diweddariadau chwarterol ar gyfer hunangyflogaeth ac eiddo yn y DU, gwneud cyflwyniadau blynyddol ac addasiadau, gweithio gyda cholledion a hawliadau, gweld cyfrifiadau treth a gwneud y datganiad terfynol. Mae hyn ar gael yn amgylchedd prawf (sandbox) CThEF nes bydd CThEF yn cymeradwyo’r Gwasanaeth ar gyfer cynhyrchu.'''

[strings."terms.companies-house-search-for-a-company-afb9ad"]
hash = "afb9adc5ffd4"
cy = '''<strong>Tŷ’r Cwmnïau.</strong> Chwilio am gwmni. Newid cyfeiriad swyddfa gofrestredig neu gyfeiriad e-bost cofrestredig. Ffeilio cyfrifon micro-endid, cyfrifon cwmni bach a datganiadau cadarnhau. Ffeilio datganiad dilysu PSC. Mae cyfrifon, datganiadau cadarnhau a newidiadau i’r swyddfa gofrestredig a’r cyfeiriad e-bost cofrestredig yn mynd i’r gofrestr fyw. Mae datganiadau dilysu PSC ar gael yn amgylchedd prawf (sandbox) Tŷ’r Cwmnïau nes bydd Tŷ’r Cwmnïau yn cymeradwyo’r Gwasanaeth ar gyfer ffeilio byw.'''

[strings."terms.company-tax-return-ct600-prepare-a-0cdb3b"]
hash = "0cdb3b1acdc8"
cy = '''<strong>Ffurflen Dreth y Cwmni (CT600).</strong> Paratoi Ffurflen Dreth y Cwmni ar gyfer CThEF. Rhagolwg (preview) yw hwn.'''

[strings."terms.diya-gl-books-save-and-load-ba7937"]
