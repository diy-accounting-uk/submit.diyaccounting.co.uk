cy = '''Mae pob nodwedd yn dangos ei statws (cynhyrchu, amgylchedd prawf (sandbox) neu ragolwg (preview)) ar ei thudalen ei hun. Nid yw nodwedd brawf na nodwedd ragolwg yn anfon dim byd at wasanaeth byw CThEF na Thŷ’r Cwmnïau.'''

