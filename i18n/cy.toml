cy = '''Yr hyn rydych yn ei ennill'''

[strings."terms.the-commission-is-33-of-the-8ca81d"]
hash = "8ca81d02e5a5"
cy = '''Y comisiwn yw 33% o’r swm net y mae’r cwsmer a atgyfeiriwyd yn ei dalu i ni am ei 3 mis cyntaf. Ar gyfer tanysgrifiad blynyddol, mae cwsmer sy’n rhannu tocyn yn ennill 33% o dair rhan o ddeuddeg o’r taliad blynyddol, ac mae partner cyswllt cymeradwy yn ennill 25% o’r taliad blynyddol, unwaith.'''

[strings."terms.a-customer-who-shares-a-pass-5ec1c1"]
hash = "5ec1c1ae62d1"
cy = '''Mae cwsmer sy’n rhannu tocyn yn ennill credyd ariannol (<span lang="en-GB">credit</span>) ar ei danysgrifiad ei hun. Rydym yn rhyddhau’r credyd ariannol 30 diwrnod ar ôl y taliad y mae’n deillio ohono. Mae’r credyd ariannol yn cael ei gymhwyso’n fisol. Mae terfyn o 12 mis am ddim i gyd ar y credyd ariannol.'''

[strings."terms.an-approved-affiliate-earns-cash-we-007173"]
hash = "007173d7ead8"
cy = '''Mae partner cyswllt cymeradwy yn ennill arian parod. Rydym yn rhyddhau arian parod 120 diwrnod ar ôl y taliad y mae’n deillio ohono. Mae terfyn o &pound;100 y mis a &pound;1,000 y flwyddyn dreth ar arian parod, ac rydym yn ei dalu dim ond pan fydd yn cyrraedd &pound;5.'''

[strings."terms.we-hold-a-commission-for-review-6aadb4"]
hash = "6aadb40796eb"
cy = '''Rydym yn dal comisiwn yn ôl i’w adolygu pan eir heibio i derfyn, pan fydd un tocyn yn dod â mwy na 5 trosiad mewn diwrnod, neu pan fydd arwydd o dwyll yn ymddangos.'''

