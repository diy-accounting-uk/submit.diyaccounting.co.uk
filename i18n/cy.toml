[strings."privacy.when-you-run-our-mcp-server-e07e16"]
hash = "e07e16eaa82f"
cy = '''Pan fyddwch yn rhedeg ein gweinydd MCP ar eich cyfrifiadur eich hun ac yn galw CThEF drwyddo, mae’r gweinydd hefyd yn darllen ac yn anfon y data hwn o’r cyfrifiadur hwnnw: ID dyfais a gedwir yn eich ffolder <code>~/.config/diya-submit</code>, eich cyfeiriadau IP lleol, eich cyfeiriadau MAC, eich enw defnyddiwr ar y system weithredu, eich system weithredu a model eich dyfais, a meintiau eich sgriniau. Dyma’r data y mae CThEF yn gofyn amdano ar gyfer rhaglen sydd wedi’i gosod ar gyfrifiadur bwrdd gwaith.'''

[strings."privacy.when-your-ai-client-calls-our-c7aa9c"]
hash = "c7aa9c230f89"
cy = '''Pan fydd eich cleient AI yn galw ein pwynt terfyn MCP a letyir, rydym yn anfon at CThEF gyfeiriad IP cyhoeddus a phorth y galwr, a’r amser y gwnaethom eu darllen. Gall cleient AI gysylltu o weinyddion ei gyflenwr, felly gall y cyfeiriad hwn fod yn gyfeiriad y cyflenwr.'''

[strings."privacy.what-the-hosted-mcp-endpoint-sends-cacd9a"]
hash = "cacd9a1f90bc"
cy = '''Yr hyn y mae’r pwynt terfyn MCP a letyir yn ei anfon at eich cleient AI'''

[strings."privacy.you-can-connect-an-ai-client-518b03"]
hash = "518b03969fb9"
cy = '''Gallwch gysylltu cleient AI, megis ChatGPT, Claude neu Gemini, â’r pwynt terfyn MCP a letyir. Rydych yn mewngofnodi gyda’ch cyfrif Submit. Yna gall y cleient alw chwe offeryn. Mae pob offeryn yn ateb gyda data o’ch cyfrif eich hun yn unig:'''

[strings."privacy.your-saved-books-the-id-title-cffbed"]
hash = "cffbed94530f"
cy = '''<strong>Eich llyfrau a gadwyd</strong>: id, teitl a chynnyrch pob llyfr, a’r cyfnod y mae’n ei gwmpasu.'''

[strings."privacy.an-open-book-the-name-of-edb9fa"]
hash = "edb9fa02aec9"
cy = '''<strong>Llyfr agored</strong>: enw’r busnes, y cynnyrch, y cyfnod, nifer llinellau’r dyddlyfr a chanlyniadau gwiriadau’r llyfr.'''

[strings."privacy.a-vat-return-worked-out-from-85e2a6"]
hash = "85e2a61e7425"
cy = '''<strong>Ffurflen TAW wedi’i chyfrifo o lyfr</strong>: y rhif cofrestru TAW sydd yn y llyfr, y naw blwch TAW, y ffigurau ar gyfer pob mis, y dyddiad dyledus a llinellau’r dyddlyfr y tu ôl i flychau 1, 4, 6 a 7. Ar gyfer pob llinell o’r dyddlyfr, mae’r offeryn yn anfon y dyddiad, y cyfrif, y cyfeirnod, y gwrthbarti a’r symiau. Gwrthbarti yw enw cwsmer neu gyflenwr yn eich llyfr.'''

[strings."privacy.a-link-to-the-vat-form-86587f"]
hash = "86587fe606b3"
cy = '''<strong>Dolen at y ffurflen TAW</strong>: cyfeiriad y ffurflen TAW ar y wefan hon. Mae’r rhan o’r ddolen ar ôl y “#” yn dal y cyfnod, y saith ffigur y mae’r ffurflen yn eu cymryd, enw’r llyfr a fersiwn ein peiriant cyfrifo. Eich porwr sy’n darllen y rhan honno. Nid yw’n cyrraedd ein gweinyddion.'''

[strings."privacy.your-vat-receipts-for-each-vat-17f2cc"]
hash = "17f2cca7571d"
cy = '''<strong>Eich derbynebau TAW</strong>: ar gyfer pob Ffurflen TAW a ffeilioch drwy Submit, enw’r dderbynneb, rhif bwndel y ffurflen gan CThEF a’r diwrnod y gwnaethoch ffeilio. Ar gyfer un dderbynneb, y dyddiad a’r amser y prosesodd CThEF y Ffurflen, rhif bwndel y ffurflen, y dangosydd talu a chyfeirnod y tâl.'''

[strings."privacy.the-tools-send-no-internal-identifier-ce2c61"]
hash = "ce2c618ff0b4"
cy = '''Nid yw’r offer yn anfon unrhyw ddynodydd mewnol o’ch cyfrif, unrhyw ddynodydd sesiwn na chais, nac unrhyw ddata log.'''

[strings."privacy.purpose-the-ai-client-uses-the-511f68"]
hash = "511f688fb9db"
cy = '''<strong>Diben</strong>: mae’r cleient AI yn defnyddio’r data i ddangos eich llyfrau i chi ac i gyfrifo Ffurflen TAW. Yna rydych chi’n gwirio’r Ffurflen ac yn ei ffeilio eich hun yn eich porwr. Nid ydym yn defnyddio’r data at unrhyw ddiben arall.'''

[strings."privacy.recipient-the-supplier-of-the-ai-1f9ae4"]
hash = "1f9ae4aaf7ad"
cy = '''<strong>Derbynnydd</strong>: cyflenwr y cleient AI rydych yn ei gysylltu. OpenAI yw hwn ar gyfer ChatGPT, Anthropic ar gyfer Claude a Google ar gyfer Gemini. Mae’r cyflenwr yn derbyn pob ateb ac yn ei ddefnyddio o dan ei bolisi preifatrwydd ei hun a gosodiadau eich cyfrif gydag ef. Gall y cyflenwr brosesu’r data y tu allan i’r DU.'''

[strings."privacy.retention-we-keep-no-copy-of-21805c"]
hash = "21805cc98d33"
cy = '''<strong>Cadw</strong>: nid ydym yn cadw copi o ateb. Tra byddwch wedi cysylltu, rydym yn cadw cofnod o’r cysylltiad sy’n dal id y llyfr agored. Rydym yn dileu’r cofnod hwnnw 24 awr ar ôl ei ddefnyddio ddiwethaf. Rydym yn dileu llyfr a gadwyd 35 diwrnod ar ôl ei gadw ddiwethaf, oni bai bod eich cyfrif yn cadw llyfrau heb derfyn amser. Rydym yn cadw derbynebau TAW am 7 mlynedd. Cyflenwr y cleient AI sy’n penderfynu am ba hyd y mae’n cadw’r atebion, o dan osodiadau eich cyfrif gydag ef.'''

[strings."privacy.hmrc-consent-2a2a74"]
hash = "2a2a7452ff24"
cy = '''Caniatâd CThEF'''

[strings."privacy.when-you-authorise-this-application-to-6abe8a"]
hash = "6abe8a24e44c"
cy = '''Pan fyddwch yn awdurdodi’r rhaglen hon i gyflwyno Ffurflenni TAW ar eich rhan, rydych yn gwneud hynny drwy lif awdurdodi OAuth CThEF ei hun. Mae sgrin awdurdodi CThEF yn esbonio y bydd data atal twyll yn cael ei gasglu. Drwy gwblhau’r awdurdodi, rydych yn rhoi caniatâd i’r data hwn gael ei gasglu fel y mae CThEF yn gofyn.'''

