hash = "0356f6469947"
cy = '''<strong>Gweinydd MCP.</strong> Darllen a golygu llyfr, a ffeilio ohono, drwy gynorthwyydd deallusrwydd artiffisial sy’n cefnogi’r Model Context Protocol.'''

[strings."terms.receipts-and-history-view-receipts-of-c864be"]
