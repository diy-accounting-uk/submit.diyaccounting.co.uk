cy = '''Eich dewisiadau'''

[strings."privacy.analytics-consent-you-can-decline-both-03e2d4"]
hash = "03e2d48fe7f9"
cy = '''<strong>Caniatâd dadansoddeg</strong>: Gallwch wrthod RUM a Google Analytics ill dau yn y faner ganiatâd. Nid oes data dadansoddeg yn cael ei gasglu nes i chi roi caniatâd. Gallwch newid eich dewis unrhyw bryd gyda’r ddolen “Dewisiadau cwcis” yn nhroedyn y dudalen. Rydym yn cyfrif pob ateb, wedi’i dderbyn neu wedi’i wrthod, heb ddynodydd. Gweler Caniatâd a rheolaeth.'''

[strings."privacy.hmrc-authorisation-you-can-revoke-hmrc-b168fb"]
