[strings."get-started.title"]
hash = "2491af039e03"
cy = '''Dechrau arni - DIY Accounting Submit'''

[strings."get-started.description"]
hash = "adf20195665f"
cy = '''Sut i anfon eich Ffurflen TAW i CThEF gyda DIY Accounting Submit: beth mae’n ei wneud, y pris, y tocyn diwrnod am ddim, Treth Incwm, a ble i gael help.'''

[strings."get-started.heading"]
hash = "61e8d44ad423"
cy = '''Dechrau arni'''

[strings."get-started.subtitle"]
hash = "718cfbd44b2f"
cy = '''Anfon eich Ffurflen TAW i CThEF'''

[strings."get-started.what-heading"]
hash = "4404ef66dc30"
cy = '''Beth mae Submit yn ei wneud'''

[strings."get-started.what-1"]
hash = "71d604d7efc8"
cy = '''Mae DIY Accounting Submit yn anfon eich Ffurflen TAW i CThEF o dan y cynllun Troi Treth yn Ddigidol. Meddalwedd bontio yw hi: rydych yn cadw’ch cofnodion mewn taenlen neu mewn meddalwedd arall, ac yna’n rhoi’r ffigurau ar gyfer y naw blwch yma a’u cyflwyno.'''

[strings."get-started.what-2"]
hash = "3b8d08b8024d"
cy = '''Gallwch hefyd weld eich rhwymedigaethau TAW a’u dyddiadau dyledus, ac edrych ar y Ffurflenni a anfonoch o’r blaen. Pan fydd CThEF yn derbyn Ffurflen, mae’n anfon derbynneb yn ôl gyda rhif Form Bundle Number. Mae Submit hefyd yn cyflwyno cyfrifon a datganiadau cadarnhau i Dŷ’r Cwmnïau.'''

[strings."get-started.price-heading"]
hash = "93c91c851e7a"
cy = '''Pris'''

[strings."get-started.price"]
hash = "33dbabfeb07c"
cy = '''Mae Ffurflenni TAW i CThEF yn costio £0.99 y mis neu £9.99 y flwyddyn. Gallwch ganslo ar unrhyw adeg.'''

[strings."get-started.pass-heading"]
hash = "e0e5828b7087"
cy = '''Y tocyn diwrnod am ddim'''

[strings."get-started.pass-1"]
hash = "ba3d61570026"
cy = '''Gallwch roi cynnig ar Submit am ddim yn gyntaf. Ar y dudalen <a href="bundles.html">Bundles</a> (yn Saesneg), gofynnwch am docyn diwrnod. Mae’n rhoi 3 chredyd (tokens) i chi am 24 awr, ac mae pob cyflwyniad TAW yn defnyddio 1 credyd. Gall hyd at 100 o westeion ddal tocyn diwrnod ar yr un pryd. Os yw’r tocynnau i gyd yn cael eu defnyddio, rhowch gynnig eto y diwrnod wedyn.'''

[strings."get-started.pass-2"]
hash = "58a69ec5f922"
cy = '''Os bydd rhywun yn anfon dolen tocyn atoch, mae’n rhoi 3 chyflwyniad TAW i chi am ddim am 7 diwrnod.'''

[strings."get-started.vat-heading"]
hash = "3b104c83c820"
cy = '''Sut i anfon eich Ffurflen TAW'''

[strings."get-started.vat-1"]
hash = "9421da8f03f5"
cy = '''Mewngofnodwch gyda’ch cyfrif Google neu Microsoft.'''

[strings."get-started.vat-2"]
hash = "3b2e45310271"
cy = '''Gofynnwch am docyn diwrnod, neu tanysgrifiwch ar y dudalen Bundles.'''

[strings."get-started.vat-3"]
hash = "6e41c0fcee4a"
cy = '''Dewiswch Submit VAT, ac yna rhowch eich rhif cofrestru TAW a dyddiadau’r cyfnod TAW.'''

[strings."get-started.vat-4"]
hash = "2efa2e8065ad"
cy = '''Rhowch y ffigurau ar gyfer y blychau. Mae Submit yn cyfrifo blychau 3 a 5 i chi.'''

[strings."get-started.vat-5"]
hash = "47db8349289e"
cy = '''Mewngofnodwch i CThEF gyda’ch Dynodydd Defnyddiwr (ID) ar gyfer Porth y Llywodraeth pan fydd Submit yn gofyn i chi wneud hynny, a rhowch ganiatâd i Submit anfon eich Ffurflenni.'''

[strings."get-started.vat-6"]
hash = "14e9a9ecf841"
cy = '''Cyflwynwch y Ffurflen. Cadwch y dderbynneb y mae CThEF yn ei hanfon yn ôl.'''

[strings."get-started.itsa-heading"]
hash = "31db62e1dc8f"
cy = '''Treth Incwm'''

[strings."get-started.itsa-1"]
hash = "757c5a07ef6a"
cy = '''Dechreuodd Troi Treth yn Ddigidol ar gyfer Treth Incwm ar 6 Ebrill 2026 ar gyfer unig fasnachwyr a landlordiaid sydd ag incwm cymhwysol dros £50,000. O 6 Ebrill 2027 ymlaen, mae’n cynnwys incwm cymhwysol dros £30,000.'''

[strings."get-started.itsa-2"]
hash = "a99887fc646f"
cy = '''Mae ein gwasanaeth Treth Incwm yn rhedeg yn amgylchedd prawf (sandbox) CThEF, felly nid yw’n cyflwyno dim byd go iawn eto. Mae’r <a href="mtd-calendar.html#availability">tabl argaeledd</a> (yn Saesneg) yn dangos statws pob gwasanaeth. Hyd nes y bydd Treth Incwm ar waith yma, defnyddiwch feddalwedd o <a href="https://www.gov.uk/guidance/find-software-thats-compatible-with-making-tax-digital-for-income-tax.cy">restr CThEF o feddalwedd sy’n cydweddu</a>.'''

[strings."get-started.help-heading"]
hash = "00f1193a0417"
cy = '''Ble i gael help'''

[strings."get-started.help-1"]
hash = "a00d9d5e061b"
cy = '''Darllenwch y <a href="help.html">cymorth a’r cwestiynau cyffredin</a>, y <a href="guide.html">canllaw defnyddiwr</a>, neu gwyliwch y <a href="videos.html">fideos sy’n dangos y camau</a>. Mae’r tudalennau hyn yn Saesneg. Gallwch anfon e-bost atom yn <a href="mailto:support@diyaccounting.co.uk">support@diyaccounting.co.uk</a>.'''

[strings."get-started.help-2"]
hash = "e8493e1fc280"
cy = '''Am gwestiynau am eich treth eich hun, cysylltwch â CThEF.'''
