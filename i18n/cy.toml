[strings."privacy.rum-may-use-cookies-or-localstorage-a0f7ad"]
hash = "a0f7ade26547"
cy = '''Gall RUM ddefnyddio cwcis neu localStorage i sefydlu gwybodaeth am y sesiwn, ond dim ond ar ôl i chi roi caniatâd drwy’r faner. Gallwch newid eich dewis gyda’r ddolen “Dewisiadau cwcis” yn nhroedyn y dudalen. Gallwch glirio’r holl ddata sydd wedi’i storio drwy ddefnyddio swyddogaeth “Clear site data” eich porwr.'''

