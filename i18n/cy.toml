[strings."terms.a-pass-is-four-words-or-54dac7"]
hash = "54dac7f7cb84"
cy = '''Pedwar gair yw tocyn, neu ddolen sy’n eu dal, y mae rhywun yn eu rhoi i chi. Mae’r hyn y mae tocyn yn ei roi yn dibynnu ar ei fath: y bundle, y credydau a pha mor hir y maent yn para. Mae’r cyfrif a greodd y tocyn yn ennill comisiwn pan ddaw’r person y mae’n ei gyflwyno yn gwsmer sy’n talu.'''

