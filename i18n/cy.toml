[strings."privacy.attribution-landing-stored-only-after-you-7098a6"]
hash = "7098a6a961f2"
cy = '''<strong><code>attribution.landing</code></strong >: Caiff ei storio dim ond ar ôl i chi dderbyn. ID y clic, tagiau’r ymgyrch a’r cod atgyfeirio o’r ddolen y daethoch drwyddi, a gedwir am hyd at 90 diwrnod i fesur pa hysbysebion ac atgyfeiriadau sy’n arwain at gofrestru a thaliadau. Caiff ei ddileu os byddwch yn gwrthod.'''

