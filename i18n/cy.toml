cy = '''Yna mae CThEF yn prosesu’r ad-daliad drwy ei weithdrefn arferol. Mae ad-daliadau fel arfer yn cyrraedd eich cyfrif banc cyn pen 10 diwrnod gwaith. Mae eich cyfrif ar-lein gyda CThEF yn dangos y statws.'''

