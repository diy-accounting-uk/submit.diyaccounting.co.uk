cy = '''Pan fyddwch yn cyflwyno Ffurflen TAW, gallwch ddewis anfon ffurflen ddrafft at HMRC Assist i’w hadolygu cyn ffeilio. Pan fyddwch yn pwyso’r botwm gwirio, mae ffigurau’r naw blwch a’r cyfnod yn cael eu hanfon at CThEF. Mae CThEF yn anfon hyd at bum neges gynghorol yn ôl, gyda dolenni at arweiniad GOV.UK. Dangosir y negeseuon yn union fel y mae CThEF yn eu hanfon.'''

[strings."privacy.this-report-is-kept-with-the-e9777b"]
