cy = '''Mae Blwch 5 negyddol yn golygu bod ad-daliad yn ddyledus i chi gan CThEF. Mae’n digwydd pan fydd Blwch 4 (y TAW a adhawliwyd) yn fwy na Blwch 3 (y TAW sy’n ddyledus). Mae Submit yn dangos Blwch 5 fel swm positif, sef y gwahaniaeth rhwng Blwch 3 a Blwch 4, ac mae CThEF yn gwybod o’r ffigurau ai taliad ynteu ad-daliad ydyw.'''

[strings."help.hmrc-then-processes-the-refund-by-3730a7"]
