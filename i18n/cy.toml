cy = '''Ein sail gyfreithlon dros ddadansoddeg a mesur hysbysebu yw eich <strong>caniatâd</strong>. Nes i chi dderbyn y faner cwcis, nid yw sgriptiau GA4 a Microsoft Advertising yn cael eu llwytho, nid oes cais yn cael ei wneud i Google na Microsoft, ac nid oes dim am eich ymweliad yn cael ei ysgrifennu i’ch porwr at y dibenion hyn. Os byddwch yn gwrthod, mae hynny’n aros yn wir. Gallwch newid eich dewis neu ei dynnu’n ôl unrhyw bryd gyda’r ddolen “Dewisiadau cwcis” yn nhroedyn y dudalen. Mae’n agor y dewis eto.'''

[strings."privacy.when-you-answer-the-banner-accept-a97f81"]
hash = "a97f81ed6116"
cy = '''Pan fyddwch yn ateb y faner, drwy dderbyn neu wrthod, rydym yn cyfrif yr ateb. Mae’r cyfrif yn dal yr ateb (derbyniwyd neu gwrthodwyd), ble y’i rhoddwyd (baner neu ddeialog) a’ch gwlad. Nid yw’n dal cwci, dynodydd wedi’i storio na thudalen. Rydym yn ei anfon ar ôl gwrthod hefyd.'''

[strings."privacy.google-ads-measurement-913ab1"]
hash = "913ab16a8dec"
cy = '''Mesur Google Ads'''

[strings."privacy.if-you-arrive-from-a-google-742d3a"]
hash = "742d3ab3afdc"
cy = '''Os byddwch yn cyrraedd o hysbyseb Google neu Microsoft, mae’r ddolen yn cario dynodydd clic (<code>gclid</code> neu <code>msclkid</code>) a thagiau ymgyrch (<code>utm_*</code>). Gyda’ch caniatâd rydym yn eu cadw yn eich porwr am hyd at 90 diwrnod ac yn eu hanfon gyda’ch sesiwn, er mwyn i ni allu cyfrif pa hysbysebion sy’n arwain at gofrestru a thalu. Heb ganiatâd nid ydynt yn cael eu cadw.'''

[strings."privacy.microsoft-advertising-measurement-38865a"]
hash = "38865ad9dc86"
cy = '''Mesur Microsoft Advertising'''

[strings."privacy.with-your-consent-we-load-microsoft-cca3d4"]
hash = "cca3d44982e8"
cy = '''Gyda’ch caniatâd rydym yn llwytho tag Universal Event Tracking (UET) Microsoft Advertising o <code>bat.bing.com</code>. Mae’n anfon eich ymweliadau â thudalennau a’r digwyddiadau ar gyfer pryniant, Ffurflen TAW, lawrlwythiad a rhodd at <code>bat.bing.com</code> a <code>bat.bing.net</code>, er mwyn i Microsoft allu cyfrif pa rai o’i hysbysebion sy’n arwain at y gweithredoedd hynny. Gall y tag osod cwci yn eich porwr. Microsoft Corporation yw’r prosesydd; gweler <a href="https://privacy.microsoft.com/privacystatement" target="_blank" rel="noopener">Datganiad Preifatrwydd Microsoft</a> (yn Saesneg).'''

