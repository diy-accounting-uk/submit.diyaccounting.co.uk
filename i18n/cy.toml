[strings."privacy.we-use-a-content-security-policy-524e2d"]
hash = "524e2db60538"
cy = '''Rydym yn defnyddio Polisi Diogelwch Cynnwys (CSP) i amddiffyn rhag sgriptio traws-safle (XSS) ac ymosodiadau chwistrellu cod eraill. Mae ein polisi yn cyfyngu ffynonellau cynnwys i darddiadau dibynadwy. Nid yw’r gyfarwyddeb script-src yn caniatáu 'unsafe-inline', felly nid yw sgriptiau mewnlin yn rhedeg. Derbynnir un eithriad:'''

[strings."privacy.style-src-unsafe-inline-required-for-9cbafc"]
hash = "9cbafce5c237"
cy = '''<strong>style-src 'unsafe-inline'</strong>: Mae ei angen ar gyfer y priodoleddau arddull ar ein tudalennau ac ar gyfer teclynnau trydydd parti. Caiff y risg ei lliniaru gan y canlynol: nid oes gwerthoedd arddull dan reolaeth defnyddwyr, nid oes tudalen sy’n dangos HTML defnyddiwr arall, ac mae terfynau img-src, font-src a connect-src yn atal arddulliau rhag anfon data allan.'''

[strings."privacy.this-exception-is-documented-as-an-4fb503"]
hash = "4fb5038fe160"
cy = '''Mae’r eithriad hwn wedi’i gofnodi fel risg a dderbynnir yn ein proses cydymffurfio diogelwch. Rydym yn adolygu’n rheolaidd a ellir ei ddileu drwy ailstrwythuro’r cod.'''

