#   turnover                      trosiant
#   deadline (a return's due date) dyddiad cau
#   due date (of a payment)       dyddiad dyledus
#   company authentication code   cod dilysu cwmni
#   personal code (identity)      cod personol
#   identity verification         gwiriad hunaniaeth
#   presenter                     cyflwynydd
#   registered office (address)   (cyfeiriad) swyddfa gofrestredig
#   micro-entity accounts         cyfrifon micro-endid
#   abridged accounts             cyfrifon talfyredig
#   dormant company               cwmni segur
#   balance sheet                 mantolen
#   profit and loss account       cyfrif elw a cholled
#   assets (in accounts)          asedau (FRC); HMRC's CT600 writes asedion for tax
#   Company Tax Return            Ffurflen Dreth y Cwmni
#   qualifying donations          cyfraniadau cymhwysol
#   self-employment               hunangyflogaeth
#   UK property                   eiddo yn y DU
#   foreign property              eiddo tramor
#   adjustments                   addasiadau
#   capital allowances            lwfansau cyfalaf
#   disallowable expenses         treuliau nas caniateir
#   losses                        colledion
#   tax calculation               cyfrifiad treth
# Our own terms:
#   day pass                      tocyn diwrnod
