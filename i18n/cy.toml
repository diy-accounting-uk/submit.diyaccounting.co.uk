[strings."terms.this-service-is-intended-for-business-d796ac"]
hash = "d796aceb112a"
cy = '''<strong>Bwriedir y Gwasanaeth hwn at ddefnydd busnes yn unig.</strong> Os ydych yn unig fasnachwr, rydych yn contractio yn rhinwedd eich busnes, nid fel defnyddiwr. Mae’n bosibl na fydd cyfreithiau diogelu defnyddwyr (gan gynnwys Deddf Hawliau Defnyddwyr 2015) yn gymwys i’ch defnydd o’r Gwasanaeth hwn'''

[strings."terms.you-must-have-valid-hmrc-government-154096"]
