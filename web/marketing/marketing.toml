# ---------------------------------------------------------------------------------------------
# Listings
# ---------------------------------------------------------------------------------------------
# The register of the places that list our products, and the copy pack each form is filled from.
# scripts/listings-register.mjs reads both; scripts/listings-check.mjs checks them against
# web/public/submit.catalogue.toml, and the Listings section of the page prints them.
#
# [[listing]] fields: id; place; group (a [[listingGroup]] id); products (ids of [[listingProduct]];
# empty means the company link); url (our page at the place, empty until it exists); state (planned,
# submitted, live); date (YYYY-MM-DD, the day it was submitted or last read); terms (what the place
# asks, read when its form is opened); priceText (the price text we gave there, empty until given);
# utmSource (the utm_source of the link we gave).
#
# [[listingProduct]] description160 and description500 take {price}, the price text of the
# product's catalogue bundle (priceBundle). A product with no priceBundle has no {price}.

