# [[packFields]]). A pack with an empty activity is the pack of a whole site; a pack with an
# activity is one product activity of the site named by parent. section names the brand whose
# logos the pack uses. priceText is set here only for a product with no catalogue bundle.
# videos are ids of videos/publish.json. Each [[listingProduct.screenshots]] is captured at
# 1270 by 760 by the brand build: a page of a site (source, page, signedIn, and optionally
# scrollTo, a selector brought to the top, and click, a selector clicked first), or an image of
