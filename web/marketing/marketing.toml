supportEmail = "support@diyaccounting.co.uk"
phone = "0845 0756015"
phoneInternational = "+44 845 075 6015"
website = "https://diyaccounting.co.uk/"
linkedin = "https://www.linkedin.com/company/3095113/"
founded = 2006
headCount = 4
country = "United Kingdom"
boilerplate = "DIY Accounting Limited is a family company, registered in England and Wales. Its founder, Terry Cartwright, a Chartered Management Accountant, started designing its accounting spreadsheets in 2006. It makes DIY Accounting Spreadsheets, free Excel bookkeeping and accounts workbooks for UK small businesses; DIYA-GL, which opens those books free in the browser; and DIY Accounting Submit, which files VAT returns with HMRC and company accounts with Companies House."
founderName = "Terry Cartwright"
founderShort = "Terry Cartwright founded DIY Accounting. A Chartered Management Accountant (ACMA) and Chartered Company Secretary (ACIS), he began designing payroll and accounting systems on Excel spreadsheets in 2006, and he designed all of its accounting and payroll software himself. Terry passed away in December 2009, and his children now manage the company."
founderLong = "Terry Cartwright founded DIY Accounting. He qualified as a Chartered Management Accountant (ACMA) in 1971 and designed a revenue budgeting system for British Rail. He was Management and Works Accountant at New World Gas Cookers, then qualified as a Chartered Company Secretary (ACIS). At British Steel he became Head of Finance and Administration for the Refractories division. He worked in Saudi Arabia as Chief Accountant for an American corporation, then as Chief Accountant at Dunlop Industrial Hose. In the early 1980s he started his own retail and wholesale company, with turnover approaching £1 million. In the 1990s he returned to accountancy and served as Finance Director for a communications company. In 2006 he started DIY Accounting, designing payroll and accounting systems on Excel spreadsheets. As a Chartered Company Secretary he also acted as a company formation agent. Terry passed away in December 2009, and his children now manage the company."
founderPhoto = "brand/company/founder-square.jpg"
founderPhotoSource = "web/public/images/company/diyaccounting-founder.jpg"
founderPhotoCrop = { x = 30, y = 0, size = 185 }
team = "DIY Accounting Limited is managed by the family of its founder, Terry Cartwright. The four current directors are Samantha, Jane, Antony and Lindsey Cartwright. Since January 2010 they have run the company day to day, and they keep the ease of use and the personal customer service that Terry established."
teamPhoto = "brand/company/directors.png"
teamPhotoSource = "web/public/images/company/four-diyaccounting-shareholders.png"
