description500 = """DIY Accounting Submit files VAT returns with HMRC under Making Tax Digital. Type the nine boxes, or drop a DIY Accounting spreadsheet or a DIYA-GL book on the page to fill them in. HMRC's receipt comes back, and we keep it. For a limited company it files micro-entity and small company accounts and the confirmation statement with Companies House. It is listed on HMRC's software finder for MTD VAT. Start with a free day pass, then {price}."""
long = """DIY Accounting Submit is web software that files a small business's returns with HMRC and Companies House from the figures the business already keeps. It suits a business that keeps its books in a spreadsheet, in a DIYA-GL book or in other software, and wants to file without a move to a new accounting package.

For VAT, Submit is bridging software for Making Tax Digital. The nine boxes of the VAT return can be typed in, or filled from a DIY Accounting spreadsheet or a DIYA-GL book. Boxes 3 and 5 add up as the figures go in. HMRC's receipt comes back with its Form Bundle Number and is kept with the account. Submit also shows the VAT periods that are due, what is owed, the payments HMRC has recorded, penalty points, and any return already sent.

For a limited company, Submit files micro-entity and small company accounts and the confirmation statement with Companies House, and changes the registered office and the registered email address. A company lookup reads the public record first.

Sign-in is with a Google or Microsoft account, and HMRC access is given through Government Gateway. The site is built to WCAG 2.2 Level AA and works with a screen reader and the keyboard. Submit is listed on HMRC's software finder for Making Tax Digital VAT. It is made by DIY Accounting Limited, a family company that has made accounting spreadsheets since 2006."""
