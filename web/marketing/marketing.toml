# web/marketing/marketing.toml: the content of marketing.diyaccounting.co.uk.
# scripts/build-marketing-site.mjs data writes web/marketing/marketing.json from this file;
# web/unit-tests/marketing-site.test.js fails when the JSON is stale.
#
# Placeholders in post text: {link} is the set's link (the pass link when the reader has a pass),
# {offer} is offers.withPass or offers.withoutPass. Only Submit sets use {offer}.
# A campaign shows in the "Post" list from its start date to its end date, both inclusive,
# by the date in Europe/London.

version = 1
disclosure = "#ad"
generatePassUrl = "https://submit.diyaccounting.co.uk/passes/generate-digital.html"
passUrlTemplate = "https://submit.diyaccounting.co.uk/pass.html?pass={code}"
passHosts = ["submit.diyaccounting.co.uk", "ci-submit.diyaccounting.co.uk"]
passCodePattern = "^[a-z]{3,7}(-[a-z]{3,7}){3}$"
passCodeExample = "tiger-happy-maple-river"
submitHosts = ["submit.diyaccounting.co.uk"]

# applyUrl: where an affiliate applies, the signed-in section of the submit site that starts Stripe onboarding.
# Empty, the page says "Applications are opening soon." Run `npm run marketing:build` after a change.
[affiliates]
applyUrl = "https://submit.diyaccounting.co.uk/bundles.html#affiliateApplySection"

[offers]
withPass = "7 days of free VAT submissions"
withoutPass = "a free day pass"

[[lengths]]
id = "headline"
label = "Headline"
max = 80

[[lengths]]
id = "short"
label = "Short"
max = 240

[[lengths]]
id = "medium"
label = "Medium"
max = 800

[[lengths]]
id = "long"
label = "Long"
max = 1600

# urlTemplate placeholders: {url} the link, {text} the selected post with its link,
# {title} the set's headline, {subject} the set's email subject. All are URI-encoded.
# copiesText: the network takes a link only, so the click also copies the post text.
# utmMedium: the utm_medium of the link the network carries.
[[networks]]
id = "linkedin"
label = "LinkedIn"
urlTemplate = "https://www.linkedin.com/sharing/share-offsite/?url={url}"
utmMedium = "social"
copiesText = true

[[networks]]
id = "x"
label = "X"
urlTemplate = "https://x.com/intent/post?text={text}"
utmMedium = "social"
copiesText = false
maxWeightedLength = 280

[[networks]]
id = "facebook"
label = "Facebook"
urlTemplate = "https://www.facebook.com/sharer/sharer.php?u={url}"
utmMedium = "social"
copiesText = true

[[networks]]
id = "whatsapp"
label = "WhatsApp"
urlTemplate = "https://wa.me/?text={text}"
utmMedium = "social"
copiesText = false

[[networks]]
id = "reddit"
label = "Reddit"
urlTemplate = "https://www.reddit.com/submit?url={url}&title={title}"
utmMedium = "social"
copiesText = true

[[networks]]
id = "email"
label = "Email"
urlTemplate = "mailto:?subject={subject}&body={text}"
utmMedium = "email"
copiesText = false

[[imageSizes]]
id = "og"
width = 1200
height = 630
label = "Link preview"
use = "LinkedIn, Facebook, X and WhatsApp link previews; Reddit link posts"

[[imageSizes]]
