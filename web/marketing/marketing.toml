use = "Google Ads and Microsoft Advertising responsive display ads"

[[imageSizes]]
id = "display-square"
width = 1200
height = 1200
label = "Display ad, square"
use = "Google Ads and Microsoft Advertising responsive display ads"

[[imageSizes]]
