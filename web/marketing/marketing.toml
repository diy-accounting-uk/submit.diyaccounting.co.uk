long = """DIY Accounting Submit is bridging software for Making Tax Digital for VAT. Every VAT-registered business sends its VAT return to HMRC from software, and Submit lets a business keep the records it has, in a spreadsheet, a DIYA-GL book or other software, and send the return from them.

