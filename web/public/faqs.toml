[[faq]]
id = "figures-dont-match"
category = "submission"
question = "My figures don't match my spreadsheet"
answer = """
These causes explain most mismatches:

1. Rounding can differ. HMRC accepts figures to 2 decimal places for Boxes 1 to 5. Check that your spreadsheet rounds the same way.
2. Boxes 3 and 5 calculate for you. Box 3 is Box 1 plus Box 2. Box 5 is the difference between Box 3 and Box 4, shown as a positive number. Do not calculate them yourself.
3. Boxes 1 to 5 hold VAT amounts. Boxes 6 to 9 hold net values that exclude VAT.
4. Boxes 6 to 9 are whole pounds with no pence.
5. The period dates must match the obligation exactly. Check that your spreadsheet covers the same dates.
"""
keywords = ["figures", "don't match", "doesn't match", "wrong", "different", "spreadsheet", "mismatch", "numbers", "calculation"]
priority = 11

[[faq]]
id = "flat-rate-scheme"
category = "vat-basics"
question = "I'm on the Flat Rate Scheme. Can I use this app?"
answer = """
Yes. The Flat Rate Scheme changes how you work out your VAT, not how you submit it. Enter these figures:

- **Box 1** is your flat rate VAT: your gross turnover multiplied by your flat rate percentage.
- **Box 6** is your gross turnover including VAT.
- **Boxes 2, 4, 7, 8 and 9** are usually £0. Check HMRC guidance for exceptions.
"""
keywords = ["flat rate", "flat rate scheme", "frs", "simplified"]
priority = 12

