[[faq]]
id = "submitted-wrong-figures"
category = "submission"
question = "I submitted the wrong figures. What do I do?"
answer = """
You cannot amend a submitted VAT return in Submit. How you correct it depends on the size of the error.

- A small error goes on your next VAT return. It is small when its net value is £10,000 or less, or up to £50,000 if it is no more than 1% of your Box 6 figure for the return period in which you find it. It must be inside the 4-year time limit and not deliberate.
- Any other error goes to HMRC on form VAT652, or in a letter.

See [HMRC guidance on correcting VAT errors](https://www.gov.uk/vat-corrections). Keep your Submit receipt as a record of what you first submitted.
"""
keywords = ["wrong figures", "mistake", "error", "submitted wrong", "amend", "correct", "change", "fix submission"]
priority = 6

[[faq]]
id = "first-time-mtd"
category = "connection"
question = "I've never submitted digitally before. Where do I start?"
answer = """
1. Sign up for Making Tax Digital for VAT at [gov.uk/vat-record-keeping](https://www.gov.uk/vat-record-keeping/sign-up-for-making-tax-digital-for-vat), if you have not already.
2. Wait 24 to 48 hours. HMRC needs time to start your Making Tax Digital access.
3. Sign in to DIY Accounting Submit with your Google or Microsoft account.
4. Request a day pass or choose a bundle on the [Bundles](bundles.html) page.
5. Check your obligations to see which VAT periods HMRC expects returns for.
6. Enter your 9-digit VAT registration number and your figures on the VAT form.
7. Submit your return.

Keep your Government Gateway user ID and password ready. HMRC asks for them when you authorise.
"""
keywords = ["first time", "never", "new", "start", "begin", "how do i", "getting started", "setup", "making tax digital", "mtd"]
priority = 7

[[faq]]
id = "vat-registration-number-format"
category = "vat-basics"
question = "What format should my VAT registration number be in?"
answer = """
Your VAT registration number is 9 digits, with no spaces, letters or GB prefix. It is on your VAT registration certificate from HMRC.

If your certificate shows "GB 123 456 789", enter 123456789.

Submit rejects these forms:
- GB123456789, which has a GB prefix.
- 123 456 789, which has spaces.
- 12345678, which has 8 digits.
"""
keywords = ["vat registration number", "format", "9 digits", "gb", "how to enter", "invalid"]
priority = 8

