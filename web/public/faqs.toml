[[faq]]
id = "data-security"
category = "vat-basics"
question = "Where is my data stored? Is it secure?"
answer = """
Submit stores your data in the AWS eu-west-2 (London) region. See [Security](security.html) for the hosting and the protections.

We store:
- Your bundles and token balances.
- Your submission receipts, in your account.

We do not store:
- Your VAT figures. They go directly to HMRC and are not kept on our servers.
- Your Government Gateway credentials. You enter them on HMRC's own website.

Protections:
- Every connection uses HTTPS encryption.
- HMRC authorisation uses OAuth 2.0.
- Your HMRC access tokens are stored securely and are never exposed to JavaScript.

