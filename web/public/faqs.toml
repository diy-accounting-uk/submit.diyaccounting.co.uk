[[faq]]
id = "authorisation-expired"
category = "connection"
question = "My HMRC authorisation has expired"
answer = """
An HMRC authorisation lasts 18 months, or ends when you remove the software's authority.

To authorise again:
1. Start a submission. Submit sends you to HMRC.
2. Enter your **Government Gateway** user ID and password on HMRC's page.
3. Give DIY Accounting Submit permission to act for you.

A business checks or removes the software's authority at [tax.service.gov.uk/applications-manage-authority](https://www.tax.service.gov.uk/applications-manage-authority). An agent uses the [agent services account](https://www.tax.service.gov.uk/agent-services-account).
"""
