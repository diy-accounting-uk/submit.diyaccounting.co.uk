<html lang="en-GB">
  <head>
    <meta charset="UTF-8" />
    <title>Companies House codes - DIY Accounting Submit</title>
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="referrer" content="no-referrer" />
    <meta name="robots" content="noindex" />
    <link rel="icon" href="/favicon.ico" sizes="any" />
    <link rel="icon" href="/favicon.svg" type="image/svg+xml" />
    <link rel="stylesheet" href="../submit.css" />
  </head>
  <body>
    <a href="#mainContent" class="skip-link">Skip to main content</a>
    <header>
      <h1>DIY Accounting Submit</h1>
      <p class="subtitle">Companies House codes</p>
    </header>

    <main id="mainContent">
      <div id="codesMessage" role="status" aria-live="polite" class="hint"></div>

      <div id="codesFormView" class="form-container" style="display: none">
        <p id="codesIntro"></p>
        <p class="hint">
          The codes go straight to DIY Accounting Submit, are kept sealed for ten minutes and are used once, for this filing. They do not
          appear in your chat.
        </p>
        <form id="codesForm" autocomplete="off">
          <div class="form-group">
            <label for="companyAuthCode">Company authentication code</label>
            <input type="password" id="companyAuthCode" name="companyAuthCode" minlength="6" maxlength="8" required autocomplete="off" />
          </div>
          <div id="personalCodeFields"></div>
          <button type="submit" id="saveCodesBtn" class="btn">Save codes</button>
        </form>
      </div>

      <div id="codesDoneView" class="results-container" style="display: none">
        <h2>Codes saved</h2>
        <p>Go back to your chat and ask for the filing to be made.</p>
      </div>
    </main>

    <script src="mcpCodes.page.js"></script>
  </body>
</html>
