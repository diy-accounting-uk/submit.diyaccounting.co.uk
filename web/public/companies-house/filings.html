<html lang="en-GB" data-theme="light">
  <head>
    <meta charset="UTF-8" />
    <title>DIY Accounting Submit - Your filing</title>
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="icon" href="/favicon.ico" sizes="any" />
    <link rel="icon" href="/favicon.svg" type="image/svg+xml" />
    <link rel="icon" type="image/png" sizes="32x32" href="/favicon-32.png" />
    <link rel="icon" type="image/png" sizes="16x16" href="/favicon-16.png" />
    <link rel="apple-touch-icon" sizes="180x180" href="/apple-touch-icon.png" />
    <link rel="manifest" href="/site.webmanifest" />
    <link rel="stylesheet" href="../submit.css" />
    <link rel="stylesheet" href="../submission-record.css" />
    <style>
      .filing-actions {
        display: flex;
        flex-wrap: wrap;
        gap: 0.75em 1.5em;
        margin: 1em 0;
      }
      .filing-notice {
        margin: 1em 0;
        color: var(--c-ink-muted, #505a5f);
      }
      .submission-record iframe.filed-document {
        display: block;
        width: 100%;
        height: 40em;
        border: 0;
        background: #fff;
      }
      @media print {
        .skip-link,
        body > header,
        body > footer,
        .filing-actions,
        .filing-notice,
        #unauthenticatedHint {
          display: none !important;
        }
        .submission-record iframe.filed-document {
          height: auto;
        }
      }
    </style>
    <!-- CloudWatch RUM configuration placeholders; replace values during deployment -->
    <meta name="rum:appMonitorId" content="${RUM_APP_MONITOR_ID}" />
    <meta name="rum:region" content="${AWS_REGION}" />
    <meta name="rum:identityPoolId" content="${RUM_IDENTITY_POOL_ID}" />
    <meta name="rum:guestRoleArn" content="${RUM_GUEST_ROLE_ARN}" />
    <script src="../lib/analytics.js"></script>
  </head>
  <body>
    <a href="#mainContent" class="skip-link">Skip to main content</a>
    <header>
      <p class="chrome-fallback"><a href="../">DIY Accounting Submit</a></p>
      <h1>DIY Accounting Submit</h1>
      <p class="subtitle">Your copy of a filing</p>
    </header>

    <main id="mainContent">
      <div id="unauthenticatedHint" style="display: none; margin-bottom: 1em; color: #b30000">Please log in to see your filing.</div>
      <p id="filingNotice" class="filing-notice" style="display: none"></p>
      <div class="filing-actions" id="filingActions" style="display: none">
        <button type="button" class="btn-small" id="printFilingBtn">Print or save as PDF</button>
        <a href="../hmrc/receipt/receipts.html">All your receipts</a>
      </div>
      <div id="filingContent"></div>
    </main>

    <footer></footer>

    <script src="../widgets/page-chrome.js"></script>
    <script src="../lib/env-loader.js"></script>
    <script type="module" src="../submit.js"></script>
    <script src="../developer-mode.js"></script>
    <script src="../lib/request-cache.js"></script>
    <script src="../widgets/entitlement-status.js"></script>
    <script src="../widgets/auth-status.js"></script>
    <script type="module" src="../widgets/view-source-link.js"></script>
    <script src="filings.page.js"></script>
  </body>
</html>
