<html lang="en-GB">
  <head>
    <meta charset="UTF-8" />
    <title>DIY Accounting Submit - Redeem a pass</title>
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="description" content="Open this link to see what your pass gives you, and add it to your account." />
    <meta name="robots" content="noindex" />
    <link rel="canonical" href="https://submit.diyaccounting.co.uk/pass.html" />
    <meta property="og:type" content="website" />
    <meta property="og:url" content="https://submit.diyaccounting.co.uk/pass.html" />
    <meta property="og:title" content="You have a pass for DIY Accounting Submit" />
    <meta property="og:description" content="Open this link to see what your pass gives you, and add it to your account." />
    <meta property="og:image" content="https://submit.diyaccounting.co.uk/images/social/og-pass-link.png" />
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="You have a pass for DIY Accounting Submit" />
    <meta name="twitter:description" content="Open this link to see what your pass gives you, and add it to your account." />
    <meta name="twitter:image" content="https://submit.diyaccounting.co.uk/images/social/og-pass-link.png" />
    <link rel="icon" href="/favicon.ico" sizes="any" />
    <link rel="icon" href="/favicon.svg" type="image/svg+xml" />
    <link rel="icon" type="image/png" sizes="32x32" href="/favicon-32.png" />
    <link rel="icon" type="image/png" sizes="16x16" href="/favicon-16.png" />
    <link rel="apple-touch-icon" sizes="180x180" href="/apple-touch-icon.png" />
    <link rel="manifest" href="/site.webmanifest" />
    <link rel="stylesheet" href="submit.css" />
    <!-- CloudWatch RUM configuration placeholders; replace values during deployment -->
    <meta name="rum:appMonitorId" content="${RUM_APP_MONITOR_ID}" />
    <meta name="rum:region" content="${AWS_REGION}" />
    <script src="./lib/analytics.js"></script>
    <script src="./lib/session-beacon.js"></script>
  </head>
  <body>
    <a href="#mainContent" class="skip-link">Skip to main content</a>
    <header>
      <p class="chrome-fallback"><a href="./">DIY Accounting Submit</a></p>
      <h1>Redeem a pass</h1>
      <p class="subtitle">Add the bundle that your pass gives you</p>
    </header>

    <main id="mainContent">
      <section id="passCard" class="pass-card" aria-labelledby="passHeading">
        <h2 id="passHeading" tabindex="-1">Checking your pass</h2>
        <div id="passBundle" class="pass-bundle" hidden></div>
        <p id="passMessage" class="pass-message" role="status"></p>
        <p id="passError" class="pass-error" role="alert" hidden></p>
        <form id="passForm" class="pass-entry" action="pass.html" method="get" hidden>
          <label for="passInput">Passphrase</label>
          <p id="passInput-hint" class="hint">Enter four words separated by hyphens, for example word-word-word-word.</p>
          <input type="text" id="passInput" name="pass" autocomplete="off" spellcheck="false" aria-describedby="passInput-hint" required />
          <button type="submit" id="passEnterBtn" class="btn">Redeem pass</button>
        </form>
        <div id="passActions" class="pass-actions">
          <button type="button" id="passRedeemBtn" class="btn" data-activity-start="bundle" hidden>Redeem pass</button>
          <a id="passHomeLink" class="btn" href="./" hidden>Go to your activities</a>
          <a id="passBundlesLink" class="pass-link" href="bundles.html" hidden>See your bundles</a>
        </div>
        <p id="passAfterAction" class="pass-after-action hint" hidden></p>
      </section>
    </main>

    <footer></footer>

    <script src="widgets/page-chrome.js"></script>
    <script src="lib/env-loader.js"></script>
    <script type="module" src="submit.js"></script>
    <script src="developer-mode.js"></script>
    <script src="lib/request-cache.js"></script>
    <script src="lib/bundle-cache.js"></script>
    <script src="lib/toml-parser.js"></script>
    <script src="widgets/auth-status.js"></script>
    <script type="module" src="widgets/view-source-link.js"></script>

    <script src="lib/post-login-redirect.js"></script>
    <script src="pass.page.js"></script>
  </body>
</html>
