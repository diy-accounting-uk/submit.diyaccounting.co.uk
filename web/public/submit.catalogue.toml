[[activities]]
id = "vat-liabilities"
name = "VAT Liabilities (HMRC)"
display = "always-with-upsell"
bundles = ["day-guest", "invited-guest", "resident-vat", "resident", "resident-guest", "resident-pro-comp", "resident-pro"]
