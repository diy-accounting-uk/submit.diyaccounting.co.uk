<html lang="en-GB">
  <head>
    <meta charset="UTF-8" />
    <title>Your receipts - DIY Accounting Submit</title>
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="icon" href="/favicon.ico" sizes="any" />
    <link rel="icon" href="/favicon.svg" type="image/svg+xml" />
    <link rel="icon" type="image/png" sizes="32x32" href="/favicon-32.png" />
    <link rel="icon" type="image/png" sizes="16x16" href="/favicon-16.png" />
    <link rel="apple-touch-icon" sizes="180x180" href="/apple-touch-icon.png" />
    <link rel="manifest" href="/site.webmanifest" />
    <link rel="stylesheet" href="../../submit.css" />
    <link rel="stylesheet" href="../../lib/hmrc-field-table.css" />
    <link rel="stylesheet" href="../../submission-record.css" />
    <!-- CloudWatch RUM configuration placeholders; replace values during deployment -->
    <meta name="rum:appMonitorId" content="${RUM_APP_MONITOR_ID}" />
    <meta name="rum:region" content="${AWS_REGION}" />
    <meta name="rum:identityPoolId" content="${RUM_IDENTITY_POOL_ID}" />
    <meta name="rum:guestRoleArn" content="${RUM_GUEST_ROLE_ARN}" />
    <script src="../../lib/analytics.js"></script>
    <!-- HEAD-prefetch to help mitigate API cold starts for this page's calls -->
    <!--script async src="../../prefetch/prefetch-hmrc-receipt-head.js"></script-->
    <!--script async src="../../prefetch/prefetch-hmrc-receipt-name-head.js"></script-->
  </head>
  <body>
    <a href="#mainContent" class="skip-link">Skip to main content</a>
    <header>
      <p class="chrome-fallback"><a href="../../">DIY Accounting Submit</a></p>
      <h1>Your receipts</h1>
      <p class="subtitle">The receipts HMRC and Companies House sent back for your submissions</p>
    </header>

    <main id="mainContent">
      <div
        class="form-container"
        data-requires-sign-in
        data-sign-in-title="Log in to see your receipts"
        data-sign-in-text="Log in to see the receipts for your submissions and to download them."
      >
        <div class="table-scroll">
          <table id="receiptsTable" class="data-table" style="display: none">
            <thead>
              <tr>
                <th>Date</th>
                <th>Receipt</th>
                <th>Size</th>
              </tr>
            </thead>
            <tbody></tbody>
          </table>
        </div>
        <p id="emptyState" class="hint" style="display: none">No receipts yet.</p>

        <div class="export-controls" id="exportControls" style="display: none">
          <button class="btn-small" id="exportCsvBtn" data-activity-start="my-receipts">Export CSV</button>
        </div>
      </div>

      <div id="receiptDisplay" class="receipt-panel" style="display: none">
        <h2 id="receiptHeading">Receipt details</h2>
        <div id="assistMessages"></div>
        <div id="receiptContent"></div>
      </div>
    </main>

    <footer></footer>

    <script src="../../widgets/page-chrome.js"></script>
    <script src="../../lib/env-loader.js"></script>
    <script type="module" src="../../submit.js"></script>
    <script src="../../developer-mode.js"></script>
    <script src="../../lib/request-cache.js"></script>
    <script src="../../lib/toml-parser.js"></script>
    <script src="../../lib/money-format.js"></script>
    <script src="../../lib/hmrc-display-format.js"></script>
    <script src="../../lib/hmrc-field-table.js"></script>
    <script src="../../widgets/entitlement-status.js"></script>
    <script src="../../widgets/auth-status.js"></script>
    <script src="../../widgets/signed-out-panel.js"></script>
    <script type="module" src="../../widgets/view-source-link.js"></script>
    <script src="receipts.page.js"></script>
  </body>
</html>
