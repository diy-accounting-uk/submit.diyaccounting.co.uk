# Secrets that deploy-environment.yml's create-secrets job rewrites from a GitHub Environment
# secret, once per environment (ci, prod). Every deploy writes the current GitHub Environment
# value regardless of whether it changed, so Secrets Manager's own LastChangedDate always reads
# as "the last deploy" and never tells you when a secret was genuinely rotated. The `rotated-at`
# tag on each AWS secret (set by scripts/put-secret-with-rotation-tag.sh, only when the value
# it's about to write differs from the current one) is the real record; this file adds the human
# side — which console the value comes from, and the last rotation date a person actually knows.
# Leave last_rotated empty rather than guess.
#
# Two optional fields per entry: `store` ("aws" by default, or "github" for a secret that lives
# only in a GitHub repository or environment, with `location` saying where) and `environments`
# (a list of "ci"/"prod"; absent means both). buildRotationRows in
# app/functions/security/securityLakeNightly.js skips a github-store entry, and skips an
# aws-store entry whose environments exclude the current one, so a GitHub-only token or a
# ci-only secret never reports as a missing AWS secret.
#
# Not listed here: companies-house/presenter_id, a GitHub secret set in ci only (emailed by
# Companies House, not yet requested for prod) with no rotation date known yet; user-sub-hash-salt,
# generated by the workflow itself with openssl rather than sourced from a console, and rotated
# only through manage-secrets.yml's restore-salt action; and email-hash-secret, created once by
# hand with no console source and no rotation code path yet -- see
# RUNBOOK_INFORMATION_SECURITY.md Sec3.6.

[[secret]]
name = "google/client_secret"
console = "Google"
last_rotated = ""

