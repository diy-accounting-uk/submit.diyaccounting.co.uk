# Secrets that deploy-environment.yml's create-secrets job rewrites from a GitHub Environment
# secret, once per environment (ci, prod). Every deploy writes the current GitHub Environment
# value regardless of whether it changed, so Secrets Manager's own LastChangedDate always reads
# as "the last deploy" and never tells you when a secret was genuinely rotated. The `rotated-at`
# tag on each AWS secret (set by scripts/put-secret-with-rotation-tag.sh, only when the value
# it's about to write differs from the current one) is the real record; this file adds the human
# side — which console the value comes from, and the last rotation date a person actually knows.
# Leave last_rotated empty rather than guess.
#
# Not listed here: companies-house/presenter_id and companies-house/presenter_code, GitHub
# secrets not yet set in either environment, so no AWS secret exists for them to rotate; and
# user-sub-hash-salt, generated by the workflow itself with openssl rather than sourced from a
# console, and rotated only through manage-secrets.yml's restore-salt action.

[[secret]]
name = "google/client_secret"
console = "Google"
last_rotated = ""

[[secret]]
name = "hmrc/client_secret"
console = "HMRC"
last_rotated = ""

[[secret]]
name = "hmrc/sandbox_client_secret"
console = "HMRC"
last_rotated = ""

[[secret]]
name = "companies-house/api_key"
console = "Companies House"
last_rotated = ""

[[secret]]
name = "companies-house/client_secret"
console = "Companies House"
last_rotated = ""

