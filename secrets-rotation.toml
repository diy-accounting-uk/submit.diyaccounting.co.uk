# Secrets that deploy-environment.yml's create-secrets job writes from a GitHub Environment
# secret, once per environment (ci, prod). The `rotated-at` tag on each AWS secret (set by
# scripts/put-secret-with-rotation-tag.sh, only when the value it's about to write differs from
# the current one) is the real record of a rotation; this file adds the human
# side — which console the value comes from, and the last rotation date a person actually knows.
# Leave last_rotated empty rather than guess.
#
# Two optional fields hold the schedule. `max_age_days` is the most days a value may go without
# a roll; absent means no fixed schedule. `expires_at` is the date the issuer ends the key.
# Each night buildRotationRows reports days to the nearer of the two, and rotation-check.yml
# fails and raises an issue when that is 30 days or fewer. The date a roll happened is the
# `rotated-at` tag of an AWS secret, else `last_rotated` here.
#
# Two further optional fields per entry: `store` ("aws" by default, or "github" for a secret that
# lives only in a GitHub repository or environment, with `location` saying where) and
# `environments` (a list of "ci"/"prod"; absent means both). buildRotationRows in
# app/functions/security/securityLakeNightly.js reads an aws-store entry from its AWS secret, skips
# one whose environments exclude the current one, and reads a github-store entry from
# `last_rotated`, so a ci-only secret never reports as missing in prod.
#
# Not listed here: companies-house/presenter_id, an identifier Companies House emails; and
# email-hash-secret, which this repository generates and rotates by workflow.
# ../private.diyaccounting.co.uk/security/RUNBOOK_INFORMATION_SECURITY.md sections 3 and 4
# hold the procedure for every key.

